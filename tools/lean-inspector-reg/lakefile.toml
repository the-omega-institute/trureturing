name = "regInspector"
version = "0.1.0"
defaultTargets = ["LeanInformationAuditRegTests"]
packagesDir = "../../.lake/packages"
buildDir = "../../.lake/build/lean-inspector/reg"
weakLeanArgs = ["-j1"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "reg"
path = "../../Reg"

[[require]]
name = "leanInspector"
path = "../lean-inspector"

[[lean_lib]]
name = "LeanInformationAuditRegTests"
srcDir = "../lean-inspector"
roots = ["LeanInformationAuditRegTests"]
globs = ["LeanInformationAuditRegTests.+"]

[[lean_lib]]
name = "LeanInformationAuditFibTests"
srcDir = "../lean-inspector"
roots = ["LeanInformationAuditFibTests"]
globs = ["LeanInformationAuditFibTests.+"]

# Full production analysis is explicit and never belongs to the default test glob.
[[lean_lib]]
name = "LeanInformationAuditRegAnalysis"
srcDir = "../lean-inspector"
roots = ["LeanInformationAuditRegAnalysis"]
globs = ["LeanInformationAuditRegAnalysis.+"]

[[lean_lib]]
name = "LeanInformationAuditLookupDisk"
srcDir = "../lean-inspector"
roots = ["LeanInformationAuditRegAnalysis.SearchReduction.DiskLookup", "LeanInformationAuditRegAnalysis.SearchReduction.Lookup"]
precompileModules = true

[[lean_exe]]
name = "compiledJudgeTests"
srcDir = "../lean-inspector"
root = "LeanInformationAuditRegTests.CompiledDiscovery"

[[lean_exe]]
name = "compiledFibTests"
srcDir = "../lean-inspector"
root = "LeanInformationAuditFibTests.AuricFib.SourceContracts"

[[lean_exe]]
name = "auricFibAnalysis"
srcDir = "../lean-inspector"
root = "LeanInformationAuditRegAnalysis.AuricFib.Main"

[[lean_exe]]
name = "searchReductionIndex"
srcDir = "../lean-inspector"
root = "LeanInformationAuditRegAnalysis.SearchReduction.DiskLookupMain"
