name = "regInspector"
version = "0.1.0"
defaultTargets = ["LeanInformationAuditRegTests"]
packagesDir = "../../.lake/packages"
buildDir = "../../.lake/build/lean-inspector/reg"

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "reg"
path = "../../Reg"

[[require]]
name = "leanInspector"
path = "../lean-inspector"

[[lean_lib]]
name = "LeanInformationAuditRegTests"
srcDir = "../lean-inspector"
roots = ["LeanInformationAuditRegTests"]
globs = ["LeanInformationAuditRegTests.+"]

# Full production analysis is explicit and never belongs to the default test glob.
[[lean_lib]]
name = "LeanInformationAuditRegAnalysis"
srcDir = "../lean-inspector"
roots = ["LeanInformationAuditRegAnalysis"]
globs = ["LeanInformationAuditRegAnalysis.+"]

[[lean_exe]]
name = "compiledJudgeTests"
srcDir = "../lean-inspector"
root = "LeanInformationAuditRegTests.CompiledDiscovery"

[[lean_exe]]
name = "nodeFactTests"
srcDir = "../lean-inspector"
root = "LeanInformationAuditRegTests.NodeFactMain"

[[lean_exe]]
name = "k2FactsGenerator"
srcDir = "../lean-inspector"
root = "LeanInformationAuditRegAnalysis.K2FactsGenerator"
supportInterpreter = true

[[lean_exe]]
name = "k2SourceFactsGenerator"
srcDir = "../lean-inspector"
root = "LeanInformationAuditRegAnalysis.K2SourceFactsGenerator"
supportInterpreter = true

[[lean_exe]]
name = "k2PostprocessGenerator"
srcDir = "../lean-inspector"
root = "LeanInformationAuditRegAnalysis.K2PostprocessGenerator"
supportInterpreter = true

[[lean_exe]]
name = "k2OriginalArtifactCheck"
srcDir = "../lean-inspector"
root = "LeanInformationAuditRegAnalysis.K2OriginalArtifactCheck"

[[lean_exe]]
name = "k2ProducerAPICompatibility"
srcDir = "../lean-inspector"
root = "LeanInformationAuditRegAnalysis.K2ProducerAPICompatibility"

[[lean_exe]]
name = "k2SourceOpeningValidation"
srcDir = "../lean-inspector"
root = "LeanInformationAuditRegAnalysis.K2SourceOpeningValidation"
supportInterpreter = true
