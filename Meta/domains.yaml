domains:
  Analytic:
    stratum: S3
    definition: Mellin-transform analysis reconstructing completed zeta from theta-kernel tails.
  AnalyticClosure:
    stratum: S3
    definition: Certified finite-window approximation and tail-budget closure of analytic readings.
  Arith:
    stratum: S3
    definition: Elementary integer arithmetic — prime factorization, divisibility, and modular residue structure — used as foundations by the golden-integer and analytic strata.
  ArithUnits:
    stratum: S3
    definition: Finite-dimensional unit and coprimality structures over prime and composite moduli.
  Asymptotics:
    stratum: S0
    definition: Asymptotic bounds for finite-listing weights and exclusion of nonzero limiting phases.
  Axis:
    stratum: S3
    definition: Prime-axis escape arguments over the natural primes.
  Carrier:
    stratum: S0
    definition: The golden integer carrier, conjugation, norm, and units.
  CertificateHistory:
    stratum: S0
    definition: Finite event-history certificates and the finite sets of generating events they reference.
  Computability:
    stratum: S0
    definition: Partial recursive codes with universal evaluation and the recursion-theoretic fixed points of computable code transformations.
  CompletionDynamics:
    stratum: S3
    definition: Dynamical structures of observer completion - golden Mobius fixed points, projective jets and first-break orders, and real-completion thread fibers with blow-up coordinates.
  ConceptDynamics:
    stratum: S3
    definition: Abstract concept readouts, dependent fibers, refinements, joins, and descent uniqueness.
  Constants:
    stratum: S3
    definition: Canonical real constants and registered reference centers used by audited projections.
  ContinuousObservables:
    stratum: S3
    definition: Continuous matrix-valued observables over phase spaces and their pointwise operator-algebraic structure.
  Conventions:
    stratum: S0
    definition: Canonical W-digit and notation conventions used by later strata.
  Deficit:
    stratum: S1
    definition: Normalized beta deficits and signed carry accounting of golden addition.
  Depth:
    stratum: S1
    definition: Finite-resolution depth combining logarithmic scale, Zeckendorf support size, and quantized phase.
  Descent:
    stratum: S1
    definition: Descending refinement chains of finite self-maps, their stabilization, and conjugacy classification.
  Diagonal:
    stratum: S0
    definition: Diagonal constructions on finite listings, their exact distance-profile and escape counts, and their asymptotic escape rates.
  Digit:
    stratum: S1
    definition: Raw and canonical W-digit representations and local value-preserving carry rules.
  Divergence:
    stratum: S3
    definition: Classical and quantum relative-entropy and data-processing identities of the cone program.
  DivergenceSupport:
    stratum: S3
    definition: Finite classical-divergence identities and bounds under general-support and absolute-continuity conventions.
  Dynamics:
    stratum: S1
    definition: Visible-hidden dynamics of phase trajectories, throat transitions, and jump cocycles.
  Eigenstructure:
    stratum: S1
    definition: Linear endomorphism eigenframes and invariance of their coordinate lines.
  Entropy:
    stratum: S3
    definition: Finite Shannon entropy in nats and its information-theoretic identities and inequalities, including maximum-entropy bounds, mutual information and its independence characterization, subadditivity, and conditional-entropy chain rules.
  Estimation:
    stratum: S3
    definition: Finite estimation-theoretic bounds relating error probability to conditional entropy, including Fano-type inequalities.
  Factorization:
    stratum: S3
    definition: The multiplicative monoid of positive naturals as the free commutative monoid on the primes, with additive prime-exponent readouts.
  FixedPoints:
    stratum: S1
    definition: Least and greatest fixed-point structure and concrete gaps between inductive and coinductive solutions.
  Fourier:
    stratum: S3
    definition: Fourier analysis for the kernel, including finite and discrete Poisson summation and entire analytic extensions of the Weil Fourier-Laplace transform.
  History:
    stratum: S0
    definition: Finite marker and event histories, their append operation, and faithful self-encoding bridges.
  Ledger:
    stratum: S1
    definition: Prime-exponent generation ledgers, their length readings, and the monotonicity of legal generation.
  Midline:
    stratum: S3
    definition: Dual and multiple characterizations of the critical midline sigma equals one half.
  Naming:
    stratum: S0
    definition: Countable naming systems over uncountable carriers and their dark-side measure.
  Observation:
    stratum: S0
    definition: Finite observation windows over integer walks and the residue readings they admit.
  Observer:
    stratum: S3
    definition: Observer read-write structures on finite windows from the observer-ledger reconstruction - update-defect metrics, window registers, and record conditioning.
  ObserverMemory:
    stratum: S3
    definition: Finite epistemic-state and forgetting-ledger certificate structures of the observer program.
  Phase:
    stratum: S1
    definition: Additive golden-ratio phases modulo one.
  PrimeForms:
    stratum: S3
    definition: Representations of prime numbers by integral quadratic forms.
  PrimeObserver:
    stratum: S3
    definition: Prime-indexed observer memory structures with projective golden-mode multipliers.
  Quad:
    stratum: S1
    definition: Parameterized quadratic presentation rings and actual orders carrying the digit-gas root-unit criteria.
  Quantum:
    stratum: S3
    definition: Finite-dimensional complex operator-algebra and probability structures.
  QuantumBounds:
    stratum: S3
    definition: Finite-dimensional quantum correlation and uncertainty bounds derived from Gram positivity, including Robertson-Schrodinger and CHSH/Tsirelson.
  QuantumChannels:
    stratum: S3
    definition: Finite-dimensional quantum channels and their fixed structures, including standard-basis pinching as zero-retention phase damping and its Hilbert-Schmidt mirror.
  QuantumContext:
    stratum: S3
    definition: Finite-dimensional quantum contextuality witnesses and context-dependent quantities.
  QuantumStates:
    stratum: S3
    definition: Finite-dimensional quantum states and their positive normalized expectation functionals.
  Recurrence:
    stratum: S1
    definition: Linear recurrence solution spaces, shift eigenstructure, and self-similar weight lifts.
  RenyiDivergence:
    stratum: S3
    definition: Finite Renyi divergences of order alpha, their pinning identities against the Bhattacharyya coefficient and the classical divergence, and their monotonicity in the order.
  Resource:
    stratum: S3
    definition: Resource-theoretic functionals defined as infima over tensor-closed strategy classes and their subadditivity.
  ResourceOrder:
    stratum: S3
    definition: Order structure on resource cost profiles and tax receipts, covering the eventual-domination preorder at large scales, its non-antisymmetry, and the minimal price face.
  Rewriting:
    stratum: S0
    definition: Abstract terminating rewrite relations, confluence, and canonical normal forms.
  Scale:
    stratum: S1
    definition: Real embeddings and logarithmic scales of golden integers.
  Solenoid:
    stratum: S1
    definition: The universal solenoid carrier, its visible projection, and hidden fiber structure.
  TotalVariation:
    stratum: S3
    definition: Finite total-variation distance between mass functions and its comparison inequalities against the classical divergence, including Pinsker-type bounds.
  Tower:
    stratum: S0
    definition: Radix name towers and their normalized approximation arms.
  Weil:
    stratum: S3
    definition: Classical zeta conventions, Weil test functions, and Fourier-Laplace analysis.
  Words:
    stratum: S1
    definition: Golden mechanical words and their local window letter conditions.
  Zeros:
    stratum: S3
    definition: Geometry, symmetry, and local balance of classical zeta zeros.
