schema_version: 1
root_files:
  - ".editorconfig"
  - ".gitignore"
  - "AGENTS.md"
  - "CLAUDE.md"
  - "Directory.Build.props"
  - "Directory.Packages.props"
  - "Makefile"
  - "README.md"
  - "Trureturing.lean"
  - "global.json"
  - "lake-manifest.json"
  - "lakefile.toml"
  - "lean-toolchain"
governance_documents:
  - "D5/X_Frontier/HeartsAuthorizations.md"
  - "Golden/gate-authority-roots.toml"
  - "Meta/Digestion/atomizers.toml"
  - "Meta/FILEMAP.toml"
  - "docs/CONTRIBUTING.md"
  - "docs/GOVERNANCE.md"
  - "docs/MISSION.md"
  - "docs/develop/spec/golden-ledger-repo-spec.md"
agent_files:
  - "CONTEXT.md"
  - "adversary.md"
  - "echo-template.md"
  - "gate.md"
  - "librarian.md"
  - "numericist.md"
  - "prover.md"
  - "scout.md"
  - "scribe.md"
  - "theorist.md"
  - "verdict-template.md"
artifact_kinds:
  csv:
    profile: opaque-text
    selectors:
      - "result"
    path_selectors:
      - "formal"
  json:
    profile: structured-json
    selectors:
      - "check"
      - "legacy"
      - "quote"
      - "result"
      - "run"
    path_selectors:
      - "experiments"
      - "formal"
      - "kernels"
      - "special"
      - "values"
  md:
    profile: opaque-text
    selectors:
      - "result"
    path_selectors:
      - "formal"
      - "special"
  py:
    profile: opaque-text
    selectors:
      - "source"
    path_selectors:
      - "formal"
      - "kernels"
  txt:
    profile: opaque-text
    selectors:
      - "result"
    path_selectors:
      - "formal"
  yaml:
    profile: structured-yaml
    selectors:
      - "result"
      - "run"
      - "spec"
    path_selectors:
      - "experiments"
      - "formal"
  yml:
    profile: structured-yaml
    selectors:
      - "result"
      - "run"
      - "spec"
    path_selectors:
      - "experiments"
      - "formal"
