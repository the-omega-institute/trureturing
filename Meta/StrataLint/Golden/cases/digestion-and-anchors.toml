[[cases]]
name = "illegal-formula-character"
changes = ["Blueprint/D5/S0/Carrier/Ring.md"]
baseline_mutations = []
mutations = [{ op = "write", path = "Evidence/D5/S0/Carrier/Formula.check.json", content = "{\"formula\": \"sqrt@5\", \"refs\": {}}\n" }]
expected_diagnostics = [{ rule = 15, path = "Evidence/D5/S0/Carrier/Formula.check.json", message = "illegal formula character '@'" }]

