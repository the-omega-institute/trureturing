  quarantine:
    justification: Retrieval preceded quarantine. The frozen parent `joint_law_externalized_certification_meaning` publicly constructs co-selected and independent product-law worlds with the same realized suite, which supports the transcript-indistinguishability clause, but its statement has no signing object, institutional witness, or carrier relation. The remaining public clause says verbatim `签署行为由此获得非仪式性职能:它是笔录外前件之制度载体。`, while the source immediately limits scope with `本文不涉签署之语义学`; therefore defining a signature or institutional carrier ad hoc would manufacture the missing semantics and violate whole-clause coverage. D5 searches `jointLaw|independent.*sampl|transcript|certif|institution|signature|signing` and body shapes `Measure.pi|Measure.dirac|same.*suite` hit the frozen parent and joint-law sampling owners but no source-sanctioned signing/institutional-carrier primitive. Pinned Mathlib searches `institutional witness|signature carrier|signing|transcript certification` and pinned non-Mathlib package searches missed a matching semantic object or theorem. A17/GitHub Lean searches for `institutional witness` and `certification meaning` returned no relevant formalization. The local proof decomposition can reuse the frozen theorem for equal transcripts under distinct joint laws, but cannot state, falsify, or prove that signing carries the external independence premise without inventing the very signature semantics the source disclaims.
    reentry_condition: Add a source-sanctioned formal semantics for signing or an institutional witness, with a public relation connecting that carrier to the joint distribution of implementation and suite; then deposit one public theorem containing both transcript non-identifiability and the signing-carrier clause.
    blocker_class: multi-clause-guard
