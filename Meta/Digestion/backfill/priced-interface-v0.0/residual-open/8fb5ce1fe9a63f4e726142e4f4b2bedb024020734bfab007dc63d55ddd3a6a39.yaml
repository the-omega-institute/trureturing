  quarantine:
    justification: "Retrieval preceded quarantine. This clause requires a fixed prefix-universal machine, a separate step-bounded description complexity K^B with a shortest B-step decoder, self-delimiting pairing with ell, and a theorem composing that decoder with the t-step witness computation inside the enlarged T bound. D5 searches `time.?bounded|bounded.*description|description.*runtime|runtime.*description|prefix.*universal|universal.*machine|self.delimit` hit the untimed `TransformationDescriptionBound.DescriptionSystem` and `descriptionComplexity`, `ProgramCostFiltration`, `XorTransformationTightness`, and `PrefixFreeCode`, but missed a bounded universal description system and runtime-composition bridge; exact owner search `TimeBoundedDescriptionComplexity|bounded_name_composition_under_linear_simulation` missed. Pinned Mathlib search under `Mathlib/Computability` hit `Turing.TM2OutputsInTime` and `Turing.TM2ComputableInTime`, but missed a prefix-universal machine, K^B, shortest bounded-description API, and decoder/witness composition; generic `TM2ComputableInPolyTime.comp` remains `proof_wanted`. A17 retrieval found Apache-2.0 `AlexeyMilovanov/kolmogorov-complexity-lean` f11c8f01 with untimed complexity, unlicensed `krstopro/lean-kolmogorov-complexity` 30030888 with custom universal-recursion axioms and no timed layer, and Apache-2.0 `nickroci/timed-kt` 9816ed9f with mixed Levin Kt rather than separate K^B and witness runtime; all use toolchain/mathlib pins different from this repository's Lean v4.31.0/mathlib fabf563a, so A17.2 rejects direct dependency. Local probe `/private/tmp/w72d20-atom1-probe.lean` resolved both partial APIs, then exited 1 on unknown identifiers `TimeBoundedDescriptionComplexity` and `bounded_name_composition_under_linear_simulation`; assuming the missing composition inequality would make the deposit hollow."
    reentry_condition: "Provide a frozen D5 or A17-admissible Lean-v4.31-compatible operational prefix-universal machine defining K^B separately from runtime, with a shortest bounded-description theorem and a self-delimiting decoder/witness composition theorem whose time bound instantiates B(ell), t(ell), and T(ell); then expose both the complexity upper bound and derived witness lower bound publicly."
    blocker_class: missing-prerequisite
