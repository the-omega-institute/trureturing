  quarantine:
    justification: "The public clause requires concrete literal-table and uniform enumerator programs, bounded descriptions of both program codes, linear versus greater-than-t execution clocks, a reverse constant-map description bound, and their two-coordinate incomparability in one canonical machine model. Retrieval receipts: D5 search `Kolmogorov|time.?bounded|boundedNameCost|literal.*program|print.*witness|enumerat.*witness|decoder.*time` found only D5/S0/Computability/DescriptionComplexity/LookupProgramUpperBound and D5/S0/Asymptotics/NamingRate/LogarithmicMargin; the former assumes an abstract lookup cost and the latter derives short-implies-slow from an assumed fast-implies-long inequality, so neither constructs or clocks the source programs. Pinned Mathlib search with the same concepts found TM2ComputableInTime and unrelated Kolmogorov probability results but no Kolmogorov-complexity model; local non-Mathlib packages missed. A17 ecosystem search found SamuelSchlesinger/complexitylib at e9834f354301195e7971b2943e68a1b4ed9373fb with TM.plainKolmogorovComplexity, TM.timeBoundedKolmogorovComplexity, finite incompressibility, and a universal-machine family, but its toolchain is Lean 4.30.0 rather than this repository's pinned toolchain and its Kolmogorov modules do not expose the literal-table/enumerator compilers and paired runtime bounds required here. The local proof attempt reaches the abstract endpoint comparison using the two D5 results but cannot construct either endpoint on canonical executable primitives; assuming their complexity and runtime inequalities would restate the atom."
    reentry_condition: "Integrate an A17-compatible universal-machine and plain/time-bounded Kolmogorov-complexity library, then provide public literal-table, constant reverse, and uniform enumerator program constructors with proved code-generation and execution clocks sufficient for the bounded-description and incomparability clauses."
    blocker_class: missing-prerequisite
