    justification: 'Whole-statement retrieval preceded quarantine. D5 searches for multi-filtration, hardness surface, Pareto budget boundary, program length/runtime, and short-slow or fast-long witnesses found NamingSystem, TestingTowerMembership.testing_tower_is_multi_filtration, ProgramCostFiltration.program_cost_filtration_classification, and LogarithmicMargin.logarithmic_error_eventually_leaves_quarter_margin, but no time-bounded Kolmogorov diagonal family, program-to-infinite-stream semantics, or theorem making reachable sequence distance vary along both budget coordinates. Pinned Mathlib searches for Kolmogorov complexity, time-bounded complexity, Busy Beaver, prefix machines, multi-filtration, and hardness surfaces returned no relevant declaration; only generic computability infrastructure is present. Installed non-Mathlib Lake packages missed the same terms. GitHub repository search found pin-compatible AlexeyMilovanov/kolmogorov-complexity-lean tree f11c8f01e90a41e18fdc97f31561a04712dc699c and nickroci/timed-kt tree 9816ed9fe6cc16ce29e3d8da475ae36a0df37022: the former supplies untimed finite-string/profile machinery, while TimedKt/Asymptotic.lean:60-63 explicitly states that no positive timed-rate versus zero untimed-rate separation is claimed and supplies only upper and collapse bounds; krstopro/lean-kolmogorov-complexity is on Lean v4.26.0-rc2. Exact GitHub code search returned HTTP 401 and remains wait-for-capability. Local probe /private/tmp/w73a14-atom2-probe.lean imported all four D5 partial owners, then exited 1 on absent timeBoundedDescriptionComplexity, timeBoundedDiagonalStreamFamily, and programStreamBudgetSurfaceVariesInBothCoordinates. There is also a source-level carrier gap: Definition 3.3 requires every height h_i : N -> Nat, but the proof makes the second coordinate per-bit runtime and pins it to t : Nat -> Nat, without defining a Nat-valued height or function-budget order, so the displayed reachable set cannot yet be constructed on the claimed carrier.'
    reentry_condition: A pinned D5 or admissible third-party development must supply the theorem 4.5 time-bounded diagonal string family on an explicit universal prefix machine, a canonical program-to-infinite-sequence semantics with the product metric, and a public bridge proving strict reachable-distance variation in each budget coordinate; the source must also specify how per-bit runtime functions instantiate the Nat-valued heights of Definition 3.3.
