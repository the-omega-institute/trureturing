  quarantine:
    justification: "Retrieval preceded quarantine. The whole theorem needs a fixed prefix universal machine with a decidable step-bounded realization relation, the separate resource-bounded name cost K^B, a self-delimiting compiler that composes a B-step decoder with a t-step witness inside the enlarged T bound, and concrete hardcoded and fixed-enumerator endpoints. D5 searches `time.?bounded|bounded.*description|description.*runtime|runtime.*description|fast.*long|short.*slow|incompressible` found exact partial owners `LogarithmicMargin.logarithmic_error_eventually_leaves_quarter_margin` for the clause-(ii) contrapositive and `XorTransformationTightness.xor_transformation_description_tight` for untimed incompressibility, but no step-bounded description system, composition bridge, or endpoint theorem; exact required-owner search `TimeBoundedDescriptionComplexity|bounded_name_composition_under_linear_simulation|hardcoded_witness_endpoint|fixed_enumerator_slow_endpoint` missed. Pinned Mathlib searches under `Mathlib/Computability` found `Turing.TM2OutputsInTime` and generic step semantics, but no universal prefix machine, K^B, bounded-description counting API, or decoder/witness runtime composition theorem; its general polynomial-time composition remains `proof_wanted TM2ComputableInPolyTime.comp`. A17 GitHub repository retrieval found `AlexeyMilovanov/kolmogorov-complexity-lean` at f11c8f01 on v4.33.0 with untimed K and bounded-output snapshots, `krstopro/lean-kolmogorov-complexity` at 30030888 on v4.26.0-rc2 without a license or timed layer, and Apache-2.0 `nickroci/timed-kt` at 9816ed9f on v4.33.0; the last formalizes Levin Kt=min(|p|+ceil(log t)), not the atom's separate K^B(u) and witness-runtime coordinates. Their toolchains and mathlib revisions differ from this repository's v4.31.0 pin, so A17.2 rejects direct dependency, and none states the two-point theorem. Local probe `/private/tmp/w72b17-atom5-probe.lean` elaborated both D5 partial owners and `Turing.TM2OutputsInTime`, then exited 1 on the four missing bridge/endpoint identifiers recorded above; assuming them would place the atom's main conclusions among the premises and make a hollow deposit."
    reentry_condition: "Provide a frozen D5 or A17-admissible v4.31-compatible operational prefix-universal machine defining K^B separately from runtime, with bounded-realization counting, self-delimiting decoder/witness composition and explicit hardcode/fixed-enumerator runtime bounds; then combine those owners with the existing logarithmic-margin theorem and expose all six chained clauses publicly."
    blocker_class: missing-prerequisite
