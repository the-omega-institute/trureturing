    justification: 'Whole-atom guard after source-context and public-statement audit. Frozen owner `D5/S0/Asymptotics/SkewedEscapeMass.escape_mass_eq_one_sub_fixed_mass` carries the visibility complement `escapeMass q f = 1 - fixedMass q f`, but it has no suite support or coverage product. Frozen owner `D5/S0/Naming/SkewedIndependentKillRate.skewed_independent_kill_rate` states that complement, its finite fixed-mass sum, and `measure (covered ∩ visible) = coverageRate * (1 - fixedMass q f)` only under explicit `IndepSet covered visible measure` and the two named measure equalities; the source positional-average premise does not supply that independence. Frozen near miss `D5/S0/Diagonal/Probability/DifferentialTestingEscape.directory_escape_probability_exact` instead states `directoryEscapeProbability f = (1 - card(Fix f)/card(Y)^card(A))^card(A)` for a uniformly sampled full directory `A -> A -> Y`; it has neither the source single-position suite event nor `S`, `m`, or `m/A`. The source clause `杀灭概率 = (m/A) · (1 − k/n)。` is false under its stated premises. Counterexample: `A = Fin 2`, `Y = Bool`, `f` is constantly false, baseline is true at `0` and false at `1`, and `S = {0}`. Thus `Fix f = {false}`, the uniform positional premise is `P[x*(a) ∈ Fix f] = k/n = 1/2`, `m = 1`, and coverage and visibility coincide at position `0`; actual kill probability is `1/2`, while the claimed product is `(1/2) * (1 - 1/2) = 1/4` (checked by `/private/tmp/w73e36-atom2-counterexample.lean`, exit 0). The sentence `对变异语料回归"实测杀灭率对覆盖率",斜率估 1 − k/n` is an empirical remark outside the named theorem.'
    reentry_condition: Obtain source errata that add an explicit per-site independence premise or restate the product law as conditional on independence, and include Appendix B treatment of multi-site mutation and biased behavior; then re-cover the carried complement and any corrected surviving clauses in source order.
