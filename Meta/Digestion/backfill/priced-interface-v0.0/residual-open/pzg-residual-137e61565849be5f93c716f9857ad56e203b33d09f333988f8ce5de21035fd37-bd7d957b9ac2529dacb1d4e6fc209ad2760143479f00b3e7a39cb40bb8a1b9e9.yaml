  quarantine:
    justification: "The frozen parent D5/S3/Resource/LogicalReversibleExtension.logical_reversible_extension publicly constructs only a reversible work-register equivalence and its Scribe explicitly says that it has no physical cost model and leaves the reversible-simulation time-space family and reversible-pebble optimality unresolved, so whole-atom binding would omit clauses. Retrieval receipts: D5 search `reversib|pebbl|time.*space|space.*time` hit only the logical extension and unrelated uses, with no simulation-cost or pebble-game theorem; pinned Mathlib search over `Computability` found TM2ComputableInTime but no space-cost, reversible-simulation, or pebble-game definition/theorem; pinned package search `reversible pebble|pebble game|Bennett|Tromp|Vitanyi` missed; GitHub Lean code searches for `reversible pebble`, `pebble game`, `Bennett reversible`, and `pebble` returned no relevant result. Local proof decomposition stops before elaboration because clauses 2-5 require canonical reversible-machine simulation, time/space cost, reversible pebble-game, and model-optimality primitives absent from D5 and pinned dependencies; introducing them ad hoc would invent the source model and make the optimality claim definitional."
    reentry_condition: "Add canonical reversible-machine simulations with public time and space costs, a reversible pebble-game semantics, Bennett-family upper bounds, and the Li-Tromp-Vitanyi model-optimality theorem, or admit an A17-compatible third-party Lean source providing those exact results."
    blocker_class: missing-prerequisite
