    justification: "Missing prerequisite: a canonical prefix-free universal binary machine at the pinned toolchain, together with a fixed-overhead compiler from finite functional table codes to passing total-program codes and the compressible/incompressible suite lemmas needed by witnesses one, two, four, and five. Retrieval receipts: D5 exact searches found only `LookupProgramUpperBound`, which assumes `LookupCompiler`, and generic `DescriptionSystem` machinery without prefix-universal optimality; the measure, metric, dense-property, and searchable-window columns have partial frozen owners only. Pinned Mathlib and installed-package exact searches exited 1 with no Kolmogorov-complexity primitive. GitHub Lean-code search found Apache-2.0 `SamuelSchlesinger/complexitylib` at `ac500f68a7b2e064e2c620efb921242406b11d27`, but A17 comparison rejects dependency because it pins Lean `v4.34.0-rc2` and mathlib `e06eff5f...` versus this repo's `v4.33.0` and `db584cd...`; its API has machine-relative prefix complexity and plain universality, but exact queries found no prefix-free universal machine or lookup theorem. Local probe `/private/tmp/w73e35-atom2-probe.lean` exited 1 at the exact goals to construct a total program, prove suite consistency, and prove the cost bound once `LookupCompiler` was removed. Source section 9.1 also records this complexity family outside its Lean scope."
    reentry_condition: "Freeze a pinned-toolchain prefix-free universal binary machine, its invariance theorem, a canonical finite-table encoding and fixed-overhead lookup compiler into total programs, and the suite-complexity witness lemmas; then combine them with the existing green-class geometry and specification-window owners."
    blocker_class: missing-prerequisite
