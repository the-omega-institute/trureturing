  quarantine:
    justification: "Whole-atom binding to D5/S3/Estimation/DecisionRisk/FixedSuiteBayesRiskFloor.fixed_suite_bayes_risk_floor is under-coverage: its public statement proves only clause (a), and its Scribe explicitly leaves the conditional-mode lower bound, fresh-sample comparison, and later qualifications unresolved. Retrieval receipts: D5 search `conditional.*mode|posterior.*mode|maximum.*posterior|unmeasured|unobserved|unseen.*risk|fresh.*sample|external.*learner|bayes.*risk.*floor` found the frozen clause-(a) owner and unrelated posterior/risk results, but no canonical unmeasured-point conditional modal probability or theorem integrating its pointwise error into deployment Bayes risk. Pinned Mathlib has the exact `ProbabilityTheory.bayesRisk_le_avgRisk` lever for (a), generic Bayes-risk data processing, and countable Bayes-risk formulas, but searches for conditional mode, posterior mode, and unmeasured/unseen Bayes error missed clause (b); pinned non-Mathlib packages missed. A17 inspection of SamuelSchlesinger/complexitylib e9834f354301195e7971b2943e68a1b4ed9373fb likewise missed conditional-mode, unmeasured-mass, and fixed-suite Bayes-floor results. The local proof attempt applies the frozen theorem for every fixed round and can reinstantiate it at sample size k*m for the floor-only clause (c), but stops at (b): the repository lacks the source-faithful task-function prior, observed-support posterior, conditional modal probability, and 0-1 deployment-risk bridge. Assuming the desired Bayes-risk lower bound would restate that clause."
    reentry_condition: "Add a canonical Bayesian task-function/suite model with observed support, posterior conditional modal mass on unmeasured points, 0-1 deployment loss, and a theorem integrating the pointwise `1-p_max` error into the unmeasured deployment mass; then compose it with the frozen Bayes-floor theorem at m and k*m observations while retaining the no-extra-theta-information channel restriction."
    blocker_class: missing-prerequisite
