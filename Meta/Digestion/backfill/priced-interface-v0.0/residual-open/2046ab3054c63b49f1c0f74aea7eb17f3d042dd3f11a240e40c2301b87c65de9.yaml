  quarantine:
    justification: "Retrieval preceded quarantine. The clause requires a semidecidable step-bounded passing predicate, a total dovetail search over `(program, steps)` whose first hit is proved passing whenever a halting passing body exists, and a prefix-universal description machine proving the selected program has `K <= K(specification) + O(1)`. D5 searches `kolmogorov|description complexity|descriptionComplexity|semidecid|dovetail|Partrec|Nat.unpair` and body shapes `Nat.find|programCost.*recordComplexity|exists.*program.*step` hit `TransformationDescriptionBound`, `LookupProgramUpperBound`, `Nat.Partrec.Code.eval`, and generic `Nat.find`/pairing uses, but exact `semidecid|dovetail|halts.*pass|first.*hit` searches missed a search compiler. The frozen parent is not an exact hit: `LookupCompiler.compile_cost_le` assumes the desired additive complexity bound as a structure field, so applying `lookup_program_upper_bound` would restate rather than derive this clause. Pinned Mathlib searches `kolmogorov complexity|description complexity|prefix-free machine|dovetail|universal machine` missed algorithmic complexity; it supplies `Nat.Partrec.Code.eval`, `exists_code`, and `Nat.unpair`, but no prefix-free program cost or additive-overhead compiler. Pinned non-Mathlib packages also missed. A17 ecosystem search found Apache-2.0 `SamuelSchlesinger/complexitylib` at `43d4bb1a30bd93846eab5480bec8a37113586109`, with `plainKolmogorovComplexity`, `prefixKolmogorovComplexity`, universal-machine and simulation bounds, but its Lean 4.30.0/mathlib pin differs from this repository's Lean 4.33.0 pin, and repository searches for `dovetail` and `semidecidable` found no required first-passing search theorem. The local proof decomposition can construct a first passing pair with `Nat.find` and `Nat.unpair`, but neither D5 nor pinned dependencies connect that selection to `K(specification) + O(1)`; routing through `TransformationDescriptionBound` requires supplying `TransformationCompiler.combine_cost_le`, exactly the missing conclusion. The source's own section 9 explicitly excludes theorem 4.3's K-complexity family because a prefix universal machine is absent."
    reentry_condition: Integrate or port an A17-compatible prefix-universal description machine at the repository's current Lean/mathlib pin, then provide a public dovetail compiler from semidecidable step-bounded specifications with proved first-hit acceptance and fixed additive program-length overhead; the resulting theorem must derive rather than assume the `K(specification) + O(1)` bound.
    blocker_class: missing-prerequisite
