  quarantine:
    justification: "Pass-2 retrieval preceded quarantine. The atom requires constructing, from a finite functional table `T`, a total default-valued lookup program in one concrete description model, proving that program realizes `T`, and proving its description cost is at most `K(T)` plus one fixed additive overhead. D5 `DescriptionComplexity` contains the public interfaces `DescriptionSystem`, `TransformationCompiler`, `LookupCompiler`, `spectrumBottom`, `descriptionComplexity`, and `lookup_program_upper_bound`, but no concrete description machine at this abstraction level: `LookupCompiler` requires the construction as its fields `compile`, `compile_consistent`, and `compile_cost_le`, while `lookup_program_upper_bound` only applies `Nat.find_min'` to those assumed fields. Other D5 computability modules expose the concrete carrier `Nat.Partrec.Code` and evaluator `Nat.Partrec.Code.eval`, but no public `DescriptionSystem` on that carrier, no finite-functional-table record encoding and realization relation, no table complexity `K(T)`, no code-description cost, and no concrete `LookupCompiler` witness connecting them. Pinned Mathlib searches found `Turing.TM2`, `TM2ComputableInTime`, `Encodable`, `Denumerable`, `Nat.Partrec.Code.encodeCode`, and `Nat.Partrec.Code.eval`; targeted searches under `Mathlib/Computability` and `Mathlib/InformationTheory` found no algorithmic Kolmogorov/description-complexity development, and `encodeCode` has no associated code-length metric or fixed-additive-overhead lookup/composition theorem. Thus the exact missing prerequisites are concrete witnesses for `LookupCompiler.compile`, `LookupCompiler.compile_consistent`, and `LookupCompiler.compile_cost_le` over a canonical finite-table/total-program carrier, together with concrete definitions identifying `recordComplexity` and `programCost` with the source's `K(T)` and `K(P)`. Assuming any of those witnesses would restate the construction that this atom must prove."
    reentry_condition: Add a canonical universal description machine with a finite functional-table encoding, a total default-valued lookup-program constructor, an evaluation/realization theorem for that constructor, concrete definitions of table and program description complexity in the same model, and a proved fixed-additive-overhead code-generation bound; then instantiate `LookupCompiler` from those constructions and derive the minimum-cost inequality.
    blocker_class: missing-prerequisite
