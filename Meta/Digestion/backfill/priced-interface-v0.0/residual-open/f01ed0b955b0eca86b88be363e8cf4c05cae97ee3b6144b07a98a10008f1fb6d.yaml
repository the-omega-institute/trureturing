    justification: "The theorem requires one integrated semantics for nonuniform one-way-function security, uniform-input average inversion probability, program description length and runtime, program-to-circuit simulation, and exhaustive/table inverse endpoints. Retrieval receipts: D5 search `one.?way function|nonuniform.*circuit|circuit.*family|average.?case.*invert|inversion.*probability|negligible function|polynomial adversary|truth table.*inverse|exhaustive.*search` missed all required cryptographic-complexity owners; pinned Mathlib search found only Analysis/Asymptotics/SuperpolynomialDecay's generic negligible-function notion and no circuit family, OWF, average inverter, or program-to-circuit simulation; pinned non-Mathlib packages likewise missed. A17 GitHub Lean searches for `one-way function`, `nonuniform circuit`, `average-case inverter`, and `negligible function adversary` found no OWF security formalization; SamuelSchlesinger/complexitylib at e9834f354301195e7971b2943e68a1b4ed9373fb has partial nonuniform circuit-size and Kolmogorov infrastructure but repository searches for one-way functions and average inverters missed. The local proof attempt cannot construct the source endpoints or security contradiction without these primitives, while postulating that every polynomial-description polynomial-time inverter has negligible success would place the theorem's forbidden-corner conclusion directly in a hypothesis."
    reentry_condition: "Add or admit an A17-compatible cryptographic complexity library defining nonuniform-secure one-way-function families, uniform average inversion success, program description/runtime costs, a proved program-to-polynomial-circuit simulation, and canonical exhaustive and full-table inverse constructions with the stated costs."
