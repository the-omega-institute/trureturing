    justification: "Multi-clause guard after converse audit. Near-miss frozen carriers are `D5/S0/Naming/Conservation/GreenClassNamingConservation.green_class_naming_conservation`, `D5/S0/Computability/DescriptionComplexity/XorTransformationTightness.xor_transformation_description_tight`, and `D5/S0/Naming/GreenClassMeasure.greenClass_measure`. The retracted one-direction construction `D5/S0/Naming/Conservation/GreenMassDescriptionSeparation.green_mass_naming_conservation_and_description_separation` combined those carriers to produce equal Green mass with different description cost, so it addressed only that Green mass does not determine description price. The exact remaining gap is that no frozen declaration provides the converse witness: controlled description price with different Green mass. Theorem 7.4 witness atom `8b825447622f9d128554094266947f0ee85ef64d9848d5766883bf27e6c59ac2` lists witnesses in both directions, so one-direction coverage cannot close this child."
    reentry_condition: "Freeze a public two-direction separation theorem that includes a controlled-description-price witness with different Green mass, or add source errata narrowing the mutual claim; then re-cover this child first and parent `0d3e6016e6faf7fe408218d6faa457f740c2390e39773e79014642479daf2781` last."
