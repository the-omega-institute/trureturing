  quarantine:
    justification: "Retrieval confirms the named theorem cannot be completed from current owners. D5 searches `time.?bounded|bounded.*description|description.*runtime|fast.*long|short.*slow|incompressible` found `LogarithmicMargin.logarithmic_error_eventually_leaves_quarter_margin` for the clause-(ii) contrapositive and `XorTransformationTightness.xor_transformation_description_tight` for untimed counting, while exact owner search `TimeBoundedDescriptionComplexity|bounded_name_composition_under_linear_simulation|hardcoded_witness_endpoint|fixed_enumerator_slow_endpoint` missed. Pinned Mathlib search under `Mathlib/Computability` found `Turing.TM2OutputsInTime` and generic machine semantics, but no prefix-universal machine defining separate K^B, no bounded-name counting/compiler bridge, and no endpoint construction; `TM2ComputableInPolyTime.comp` is still `proof_wanted`. A17 retrieval was run against `AlexeyMilovanov/kolmogorov-complexity-lean` f11c8f01 (untimed, Lean 4.33), `krstopro/lean-kolmogorov-complexity` 30030888 (untimed, Lean 4.26-rc2, no license file), and Apache-2.0 `nickroci/timed-kt` 9816ed9f (Lean 4.33); the last defines Kt as min of program length plus ceil-log runtime, not the atom's separate bounded-name K^B(u) and witness-runtime coordinates, and none states the two-point theorem. Local probe `/private/tmp/w72a25-atom3-probe.lean` elaborated both D5 partial owners and `Turing.TM2OutputsInTime`, then exited 1 on exactly the four missing identifiers above. Assuming those bridges/endpoints would put the theorem's substantive conclusions among its premises, producing a hollow deposit."
    reentry_condition: "Provide a frozen D5 or pin-compatible operational prefix-universal machine with decidable bounded realization and separate K^B, plus bounded decoder/witness composition and explicit hardcoded and fixed-enumerator endpoint bounds; then combine these with the existing logarithmic-margin owner in one public six-clause theorem."
    blocker_class: missing-prerequisite
