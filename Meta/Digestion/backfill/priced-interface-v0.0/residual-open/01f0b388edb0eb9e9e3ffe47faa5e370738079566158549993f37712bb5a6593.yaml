  quarantine:
    justification: "Chain child guard after source-context and public-statement audit. Parent carrier D5/S0/Computability/DescriptionComplexity/ThreeTowerCostSeparation.three_tower_cost_sandwich_and_double_separation publicly states one constant-overhead sandwich and two witness families, but it does not define a full hardness spectrum or an operation that adds a jump primitive to the naming grammar. Retrieval receipts reused from attempt 1: D5 search `ThreeTowerCostSeparation|prefix tower|testing tower|program tower|indexedSpikeCost|selected support|support compress` exited 0 and found that owner plus near misses TestingTowerStructureMembership, TestingTowerValuation, and TestingCostClassification; none states the deferred spectrum claim. Pinned Mathlib search `Kolmogorov|self-delimiting|prefix code|sparse support|Partrec.Code` exited 0 and found generic coding, logarithm, and partial-recursive-code lemmas only. A17 GitHub Lean-code searches for `three tower infDist`, `BudgetedNaming CostCompiler`, and `indexedSpikeCost` each exited 0 with no further carrier. Exact gap: the interpretive claim assigns spectrum control to combinatorial compressibility of nondefault support and says adding a jump primitive changes the controlling spectrum, while explicitly deferring the full characterization to section 11."
    reentry_condition: "Provide a source-faithful naming-grammar augmentation operator, a hardness-spectrum carrier, and a public theorem characterizing how support compressibility and an added jump primitive change that spectrum, with the deferred section 11 premises made explicit."
