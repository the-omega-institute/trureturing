  quarantine:
    justification: "Whole-atom binding to D5/S3/Estimation/DecisionRisk/FixedSuiteBayesRiskFloor.fixed_suite_bayes_risk_floor is under-coverage: its public statement proves only clause (a), and its Scribe explicitly leaves the conditional-mode lower bound, fresh-sample comparison, and later qualifications unresolved. Retrieval receipts: D5 search `conditional.*mode|posterior.*mode|maximum.*posterior|unmeasured|unobserved|unseen.*risk|fresh.*sample|external.*learner|bayes.*risk.*floor` found the frozen clause-(a) owner, PosteriorStoppingMapErrorBound, and unrelated posterior/risk results, but no canonical unmeasured-point conditional modal probability or theorem integrating its pointwise error into deployment Bayes risk. Pinned Mathlib search under `.lake/packages/mathlib/Mathlib` found `ProbabilityTheory.bayesRisk_le_avgRisk`, `ProbabilityTheory.lintegral_iInf_posterior_le_bayesRisk`, generic Bayes-risk data processing, and countable Bayes-risk formulas, but no conditional-mode or unmeasured-mass bridge; installed non-Mathlib package searches missed. A17 inspection of the available SamuelSchlesinger/complexitylib snapshot labeled e9834f354301195e7971b2943e68a1b4ed9373fb used `conditional.{0,30}(mode|maximum)|posterior.{0,30}(mode|maximum)|unmeasured|unobserved|bayesRisk|avgRisk|decision risk|0-1 loss` and exited 1 with no hits. Probe `/private/tmp/w73c42-atom2-probe.lean`, after `make lean-cache-ensure` exited 0, ran as `lake env lean /private/tmp/w73c42-atom2-probe.lean` and exited 1. It applies the frozen theorem to clause (a), reinstantiates it at sample size `k*m` for the floor-only clause (c), and applies Mathlib's posterior Bayes-risk lower bound before leaving the exact goal `⊢ ∫⁻ (observation : Fin m → X), deployment (↑(observedSupport observation))ᶜ * (1 - pMax) ∂⇑fixedSuite ∘ₘ pi ≤ ∫⁻ (x : Fin m → X), ⨅ y, ∫⁻ (θ : Theta), loss θ y ∂(fixedSuite†pi) x ∂⇑fixedSuite ∘ₘ pi`. The context contains `pMax < 1` and the pointwise conditional-modal cap, but no source-faithful task-function prior, observed-support posterior, or theorem connecting that cap to the posterior-loss integral; assuming this bridge would restate clause (b)."
    reentry_condition: "Add a canonical Bayesian task-function and suite model with observed support, posterior conditional modal mass on unmeasured points, 0-1 deployment loss, and a theorem integrating the pointwise `1-p_max` error into the unmeasured deployment mass; then compose it with the frozen Bayes-floor theorem at `m` and `k*m` observations while retaining the no-extra-theta-information channel restriction."
    blocker_class: missing-prerequisite
