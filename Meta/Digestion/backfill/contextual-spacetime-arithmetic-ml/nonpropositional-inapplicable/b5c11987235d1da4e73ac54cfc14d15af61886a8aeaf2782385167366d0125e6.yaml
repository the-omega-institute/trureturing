    justification: 命题仍是命题，proof_shape=bind-only；本收据只表示无需项目覆盖，不把数学断言改称非命题。复用 Mathlib db584cd6d46c92f209a44c0f1c829460d327499d。源域 q,m>=1、N>=0、0<h_n；索引 I=Fin q，拼块索引 I⊕I 与 Fin(2q) 等势，取左下块21。损失 (1/2)∑ij(VU)_ij² 的可微性由有限和、乘积和平方的 Differentiable 规则给出；HasDerivAt.fun_sum、HasDerivAt.add/mul/mul_const/pow/const_mul、hasDerivAt_const/id 给每个方向导数，Finset.sum_comm、sum_mul、mul_sum、sum_add_distrib 与交换环规范化给 Frobenius 梯度 Vᵀ(VU)、(VU)Uᵀ。同步用旧 U,V：U⁺=U-hVᵀ(VU)，V⁺=V-h(VU)Uᵀ。Matrix.fromCols_mul_fromBlocks、transpose_fromCols、fromRows_mul_fromCols、fromCols_toCols、fromCols_ext_iff、transpose_mul/sub/smul、transpose_transpose、mul_assoc、mul_add/add_mul/mul_sub/sub_mul、smul_mul/mul_smul 和模块规范化给 Z⁺=Z C_h(VU)ᵀ 与 Gram 合同式及三个递推式。给定 X.PosSemidef 和 X.rank<=m，以 Matrix.IsHermitian.spectral_theorem 的实酉特征向量 E、μ=IsHermitian.eigenvalues；PosSemidef.eigenvalues_nonneg 提供 μ>=0，IsHermitian.rank_eq_card_non_zero_eigs 给 S={i|μ_i≠0} 的基数<=m，Function.Embedding.nonempty_of_card_le 得 S↪Fin m。令 R_sj=√μ_s E_js，将 R 的行沿该嵌入补零为 Z_0；Real.mul_self_sqrt、Fintype.sum_ite_eq'、Finset.sum_subtype/sum_subset/sum_congr/sum_comm、sum_mul/mul_sum、Matrix.mul_apply/mul_diagonal 和交换环规范化验证 Z_0ᵀZ_0=X，空支撑同样成立。正向 PSD 用 Matrix.posSemidef_conjTranspose_mul_self，rank<=m 用 Matrix.rank_mul_le_right 与 rank_le_card_height，实数共轭转置用 conjTranspose_eq_transpose_of_trivial。P_n=(List.range n).foldl (fun P k=>C_(h_k)(W_k)P) I；List.range_succ、foldl_append 给 P_(n+1)=C_n P_n，P_0=I。传播因子 Z_n=Z_0 P_nᵀ 经 transpose_mul/mul_assoc 得受观测驱动的更新；其 Gram 为 P_n X P_nᵀ。观测约束逐个 n<=N 使实际梯度中的 V_nU_n 恰为 W_n。Function.Semiconj.iterate_right 直接实例化 φ(k)=(min(k,N),Z_(min(k,N)))、源步 Nat.succ、目标步 (k,Z)↦(min(k+1,N),if k<N then actualStep_k(Z) else Z)，用 Nat.succ_iterate、min/不等式规范化及已验一步方程得到实际递归重放与唯一性；正反向均无额外归纳假设，包含 N=0。重复谱、零谱、共振、断连和边界秩均由同一无相关限制的量化陈述覆盖。m>=2q 时 Matrix.rank_le_card_height 与 Fintype.card_sum/card_fin、自然数规范化消去 rank 条件。固定 P 后 Matrix.mul_add/add_mul/mul_smul/smul_mul 逐项给线性观测；PosSemidef.smul/add 与 map_add/map_smul 给 PSD 锥与仿射等式纤维的交集为凸集，不声称它是仿射空间。小宽度一般非凸由 q=m=1、N=0、W_0=0 的 diag(1,0)、diag(0,1) 见证：Matrix.posSemidef_diagonal_iff、rank_diagonal、Fintype.card_subtype 与两点有限规范化给端点 PSD/rank=1/左下块0，半和 rank=2；不声称每个观测纤维非凸。m=0、q=0、任意实 h 是明确扩展，不冒充源假设；零宽凸性由原宽分解 Fin 0 的空和得 X=0。最后一句“该刻画不等于任意规模下已经实现了高效算法”是单独的算法保证范围声明，不另立数学命题。所有数学子句经上述既有前置实例化、存在见证选取、逻辑投影和规范化闭合；没有可忠实覆盖此完整叶的项目冻结声明 GID，不新建 Lean 包装。
