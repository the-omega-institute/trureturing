    justification: 'Boundary qualifications for the preceding conditional theorem. Repeated/zero singular values and d_i=0 remove the nonzero factors used by the stated cancellation, without asserting permanent unobservability. Disconnected components must be retained individually; S=0 sets the stated third-step scalar signal to zero and does not assert an all-future identity. PSD/rank restrictions remain intersections with the linear fiber. The strict-shrink possibility is already scalar determinant normalization: q=1, W=A=B=1, eta0=1/2 gives Gamma_c=[[1+4c/3,1],[1,1-4c/3]], det=-16c^2/9, hence PSD forces c=0. This is boundary/explanatory text with upstream-only algebra, not permission to weaken hypotheses or a new project theorem.'
