  quarantine:
    justification: Whole-atom retrieval found generic computability and finite-description components, but not the fixed universal-prefix-machine function carrier required by either public clause. D5 searches `DescriptionSystem|spectrumBottom|Kolmogorov|prefix.?free|Turing.?jump|oracle.*complex|noncomputable.*complex|minimal.*program|total.*program|RelativeSemanticDiagonal` found the abstract `TransformationDescriptionBound.DescriptionSystem`, `LookupProgramUpperBound.spectrumBottom`, program-cost filtration, Mathlib-code diagonal wrappers, and `RelativeSemanticDiagonal`; none constructs complexity from the source's fixed universal prefix machine, decides totality or extensional equality using a second jump, catalogs bounded total functions, or proves noncomputability of the resulting record minimum. Pinned Mathlib searches `Turing.?jump|second jump|double jump|halting.*oracle|oracle.*halting|Kolmogorov|prefix.?free machine` found `Computable`, `ComputablePred`, and `Nat.Partrec.Code.eval` but no algorithmic Kolmogorov-complexity or Turing-jump API. The same search over installed non-Mathlib packages Cli, LeanSearchClient, Qq, aesop, batteries, importGraph, plausible, and proofwidgets found no relevant carrier. Reachable ecosystem retrieval found SamuelSchlesinger/complexitylib current dev `43d4bb1a30bd93846eab5480bec8a37113586109` (pinned to Lean/mathlib v4.30.0), whose `PrefixFreeMachine` and Boolean-oracle complexity measure finite output strings but whose current GitHub searches for `Turing jump`, `total function`, extensional metacomplexity, and catalogs all miss; AlexeyMilovanov/kolmogorov-complexity-lean current main `f11c8f01e90a41e18fdc97f31561a04712dc699c` proves `notComputablePlainKNat` for natural-number complexity but has no jump or total-function catalog; rjwalters/lean-genius `RelativizedHalting.lean` supplies only an abstract Boolean `jumpOracle` and explicitly lists the `Nat.Partrec.Code` oracle bridge as out of scope. Local probe `/private/tmp/w73a6-atom5-probe.lean` resolved the generic D5 and Mathlib primitives, then exited 1 only on unknown identifiers `UniversalPrefixMachine`, `secondTuringJump`, `decideTotalProgramWithSecondJump`, `minimalTotalFunctionCatalog`, `recordMinimumComplexity`, and `recordMinimumComplexity_not_computable`. Replacing these with the D5 abstract description systems would make the assumptions proxies rather than the source's objects and would not establish either clause.
    reentry_condition: Admit a canonical fixed universal prefix machine computing total functions, a Mathlib-code-compatible first and second Turing jump with decision theorems for program totality and extensional equality, the finite bounded-program catalog with one globally minimal representative per total function, oracle-relative function complexity and its indexing bound, and a proved reduction from ordinary string complexity to the source-defined record minimum establishing that record-to-minimum map is not computable.
    blocker_class: missing-prerequisite
