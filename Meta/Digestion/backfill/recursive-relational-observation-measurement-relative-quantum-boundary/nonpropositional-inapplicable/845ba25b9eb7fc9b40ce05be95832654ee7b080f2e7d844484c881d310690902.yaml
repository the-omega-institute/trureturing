    justification: Upstream-only bind-only reuse. At mathlib revision 56a005855ea17e0b0958f73ec801ae140b0a1679, Finset.exists_max_image supplies a maximal absolute edge; abs_add_le, abs_mul, abs_sum_le_sum_abs and ordered multiplication supply the mixed-product estimates; EuclideanSpace.real_norm_sq_eq supplies the ten-coordinate L2 squares. Expanding the original skew and polarization definitions gives the signed matching identities by finite algebra. If alpha is the maximal absolute u-edge, the original diagonal, adjacent and complementary-Pfaffian hypotheses give alpha*abs(v_e) bounds eta,2*eta,10*eta on the pivot,six neighbors,three disjoint edges. Summing squares yields norm(u)^2<=10*alpha^2 and alpha^2*norm(v)^2<=1000*eta^2, hence norm(u)*norm(v)<=100*eta by nonnegative square comparison. No division excludes zero vectors or eta=0. The complete route uses closed generic facts and normalization; no project GID or new D5 declaration is required. This auxiliary upstream-only receipt asserts no newly kernel-verified theorem or coverage edge. Lemmas13.3 and13.4 remain outside this settlement.
