    justification: "复核范围固定于 HEAD 953f98b36387d7a4822b88ed04c47f943e953060；已结构化读取目标 YAML，receipts 无 cover_disposition，coverage_gids=[]；空覆盖仅作账目事实，不作零承载证明。①检索留痕：实际在 D5 搜 golden.?observation|exponent.?layer|layer.?exponent|fibonacci.*trunc|trunc.*fibonacci|满窗|黄金观察，命中 PrimeGoldenChronologyFiberSeparation 及无关解析注释；再搜指数与 factorization、greatestFib，定位 GoldenDisplacementEulerProduct.dvd_nS、D5.S1.Digit.prime_axis_encoding_spec 和 D5.S3.Axis.AxisPartialSum.depth_le_iff。逐项读声明：dvd_nS 给 n≠0 → n∣nS n，方向相反，且同文件证明 goldenSubstStart 1=2；原文 b(1)=1，故 nS 不是 G。prime_axis_encoding_spec 给全素数指数表的双射、解码和乘法解释，不给指数下截；depth_le_iff 只给单个自然数的 Zeckendorf 深度区间，没有正整数上逐素指数的观察乘积；prime_golden_chronology_fiber_separation 给两个事件交换时的相位轨迹与 Magnus 读数，不给算术整除。已读取前两者冻结状态片，其存在不改变上述对象差异。②钉版 mathlib（v4.33.0，实读 rev=db584cd6d46c92f209a44c0f1c829460d327499d）检索命中 Nat.fib_greatestFib_le、Nat.greatestFib_mono、Nat.lt_fib_greatestFib_add_one、Nat.greatestFib_fib，以及 Nat.factorization_le_iff_dvd、Nat.prod_pow_factorization_eq_self、Nat.prod_pow_dvd_of_le_factorization、Nat.factorizationEquiv。这些确实是可用前置，不能写成库里缺 Fibonacci 截层基础事实；前一组尚未连接 a+1、减一和原文索引，后一组要求已给定合法的有限素数指数表或指数序，均不陈述原文 G 的三个子句。③有联网能力，实际经 NyxID/Tavily 搜 Lean theorem Fibonacci exponent truncation golden observation divisibility idempotent site:github.com，命中 mlyean/fib_gcd.lean gist 与 kbuzzard/lean-squares-in-fibonacci；又提取两页。前者的 nat.gcd_fib_eq_fib_gcd 讲 Fibonacci 数的 gcd，不是素因子指数下截；后者 README 讲最大 Fibonacci 平方数、旧 valuation 文件及未完成证明，不能提供本 atom 的载体。④缺失前置的陈述为：自然语言：将原文 G_0=1、G_1=2 的权重识别为 Nat.fib (L+2)，对原始正整数的素数指数实施最大 Fibonacci 下截，证明截层的零点、下界、幂等及单调性质，并证明有限素幂乘积的精确因子分解和非零性。接近 Lean 的规格（这些 b、goldenObserve 名称是待建立的定义，不声称已在 D5）：let b : Nat → Nat := fun a => Nat.fib (Nat.greatestFib (a+1)) - 1; let goldenObserve : Nat → Nat := fun n => n.factorization.prod (fun p a => p ^ b a); b 0 = 0 ∧ (∀ a, b a ≤ a) ∧ (∀ a, b (b a) = b a) ∧ Monotone b ∧ (∀ n, n ≠ 0 → goldenObserve n ≠ 0 ∧ ∀ p, (goldenObserve n).factorization p = b (n.factorization p)). 同一模块还须证明 lambda a := Nat.greatestFib (a+1)-2 满足 Nat.fib (lambda a+2) ≤ a+1 ∧ a+1 < Nat.fib (lambda a+3)，以锁定原文索引和 a=0 端点。 ⑤为何不能直接包装：不能把 G 的整除、幂等、单调性质先放进结构体字段再投影，也不能以 nS 或恒等函数代换原文 G。合法的本地构造并非数学上不可行：钉版 mathlib 已有最大 Fibonacci 指标及因子分解工具，所缺是上面源对象的类型化构造和连接证明。因此本记录不声称存在新的深层数学障碍，也不声称任何新增 Lean 声明必为空洞；空洞的是省去源对象桥而假设这些结论的直接包装。本席的只读约束禁止实施、编译或冻结该构造。 诚实标注：assumed_unverified 中逐项列出未实跑的 elaboration、覆盖门、全生态穷举和第三方兼容性；未将有限查询声称为全称不存在证明。按已读冻结候选的完整陈述，本 atom 的三个完整承重子句均未找到载体，沿 missing-prerequisite 线提出草案。"
