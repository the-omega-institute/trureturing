  quarantine:
    justification: "复核对象为 zeckendorf-euler-5040 的定理13.4原子53c332b5781c3452ffdb9d3a63aab53b7a00a8f195a9d18a19904cf92e268ff7。已读原子CAS、对应 residual-open YAML，以及 docs/develop/theory/ZECKENDORF_EULER_5040.md 的定义2.1、定理7.5和定理13.4；YAML 的 coverage_gids=[]，receipts 没有 cover_disposition，也没有 chain_atoms，故本条没有这两项结构阻塞。本文采用的完整承重子句是实际有限因数和 Z_n 的全部零点定位，以及原文指定满窗族在 Re(s)>1 经绝对收敛趋向实际 zeta 的结论；抽象代数步骤、级数识别或另一个有限函数的结论不单独认领这些子句。下述实际检索和声明阅读中未确认任一完整子句的冻结载体，因此提出 missing-prerequisite；这不是词法检索对全库语义不存在性的证明。 ①D5检索留痕：实际运行 rg -n -i 'divisor.*(zero|partition)|[Dd]ivisor[Pp]artition|full_?window|finite_euler|geometric_sum_eq_cyclotomic_product|riemann_zeta_dirichlet_sum' D5 --glob '*.lean'，沿命中读了 D5/S3/Weil/EulerProduct.lean、D5/S3/Zeros/EulerWindows.lean、D5/S3/Factorization/Cyclotomic/GeometricSpectrumFactorization.lean、D5/S3/Zeros/ZetaIdentities.lean 和 D5/S3/Zeros/ZetaUpgrade.lean。近似命中 finite_euler_zero_free_and_pole_locus 的对象是有限逆Euler乘积 ∏p(1-p^(-s))⁻¹；Lean的逆在零处分配零值，该函数的分母零点行为与整函数 Z_n 的有限几何和零点不同，而且没有局部指数截断 a。finite_euler_window_ne_zero 同样作用于逆Euler乘积且只给 Re(s)>0 的非零性。geometric_sum_eq_cyclotomic_product 是形式多项式的分圆分解，没有把原始因数和识别为这些因子的乘积，也没有对 p^(-s) 求值后推出实部为零。riemann_zeta_dirichlet_sum 在 hs:1<s.re 下证明自然数项 tsum 等于 classicalZeta；它不涉及原文 M_k 或 Z_(M_k) 的极限。riemann_zeta_dirichlet_sum_eq_euler_product 比较两个无限对象；classical_zeta_unique_simple_pole_residue_one 提供 zeta 的解析性与一处留数，均不建立满窗族的收敛或有限零点向临界带的传递。已结构化读取这些模块在 Golden/Frozen/state/D5/S3 下的对应 .lean.json 状态片，其存在不能补足上述对象差异。 还实跑 rg -n -i 'divisor.*partition|partition.*divisor|divisor.*cpow|finite.*dirichlet|dirichlet.*finite' D5 --glob '*.lean' 和 rg -n 'divisors.*ℂ|∑.*divisors' D5 --glob '*.lean'。沿相关命中读到 PrimeGaps/EulerProducts.divisorEulerMoment_primeProduct、Weil/GoldenCriticalSpectrum/EulerPronyArithmeticRealization.finite_euler_shift_trace_eq_vonMangoldt_dirichlet_window、Analytic/Asymptotics/SpectralZetaContinuation.linear_density_spectral_zeta_continuation：第一条使用实指数、倒Euler函数权重和不同素数的无平方因子乘积，不能给任意复指数、无权因数和及任意素数幂；第二条是 von Mangoldt 加权地址和的有限迹，既非 Z_n，也无满窗极限；第三条以正递增谱、有限次水平集和有界计数差为前提，没有给实际 M_k 或本有限族所需的前提实例。此轮其余词法命中包括有限正弦模态、Fourier模态及其他带权因数和，没有据此认领承载。又实跑 rg -n -i 'critical.*limit|limit.*commut|exhaust.*divisor|divisor.*exhaust|prime.*fib.*- 1|nth.*prime.*fib' D5 --glob '*.lean'，返回显式公式临界线和路径极限不交换等异题命中，未得到本满窗的整除穷尽性声明。 ②钉版mathlib检索留痕：lake-manifest.json 的 mathlib inputRev 为 v4.33.0，git -C .lake/packages/mathlib rev-parse HEAD 实得 db584cd6d46c92f209a44c0f1c829460d327499d。实际运行 rg -n 'norm_cpow_eq_rpow_re_of_pos|geom_sum_eq_zero|sum_divisors.*prod|prod.*sum_divisors|sum_divisors.*mul|summable_one_div_nat_cpow|tendsto.*sum.*divisors' .lake/packages/mathlib/Mathlib --glob '*.lean'，并沿声明阅读 Algebra/Ring/GeomSum.lean、Analysis/Complex/Basic.lean、Analysis/SpecialFunctions/Pow/Real.lean、NumberTheory/ArithmeticFunction/Defs.lean、NumberTheory/ArithmeticFunction/Misc.lean、NumberTheory/Divisors.lean、NumberTheory/EulerProduct/DirichletLSeries.lean 和 Analysis/Normed/Group/Tannery.lean。geom_sum_mul 确已证明有限几何和乘 (z-1) 等于 z^m-1；Complex.norm_eq_one_of_pow_eq_one、Complex.norm_cpow_eq_rpow_re_of_pos 和 Real.rpow_right_inj 确已提供单位根模长与正实底数复幂的工具，不能称这些基础工具缺失，但它们没有处理原始 Z_n 的有限乘积分解。ArithmeticFunction.IsMultiplicative.multiplicative_factorization 要求一个已证明乘法性的算术函数，尚需把本复幂因数和实例化；sigma_eq_prod_primeFactors_sum_range_factorization_pow_mul 的指数 k 是自然数，不能直接替换成任意复数 -s；Nat.prod_divisors_prime_pow 上的 to_additive 指定了 sum_divisors_prime_pow，只覆盖一个素数幂的因数枚举，且该生成声明未运行 `#check`。riemannZetaSummandHom 确实给复幂的完全乘法性，但其参数要求 s≠0，不能直接覆盖本零点命题允许的所有 s，须单独处理 s=0。summable_riemannZetaSummand 和 tsum_riemannZetaSummand 要求 1<s.re；tendsto_tsum_of_dominated_convergence 要求可求和上界、逐坐标收敛及最终一致支配。这些是可复用工具，尚无本源 M_k 的非零性、整除穷尽性和有限和到指示函数 tsum 的已证连接。 ③第三方Lean生态检索留痕：本席有联网能力，已通过 NyxID 的 tavily-search-chrono-ai /search 实际搜索 'Lean theorem finite divisor sum complex zeros imaginary axis site:github.com'、'Lean4 formalization divisor Dirichlet polynomial geometric sum roots of unity' 和 '\"Lean\" \"divisor\" \"Dirichlet polynomial\"'。第一组返回 dkogan/PDL 的 C 数值多项式求根文件、Evan Chen 的 Dirichlet 文章、tadamcz 的 OEIS A306477 Lean例子及 kimihiro64/Robin 的README索引摘要；C实现和博客不是Lean证明，OEIS例子对象不符，Robin摘要涉及因数不等式而未给本零点或满窗定理。第二组返回 arXiv:2503.07625v2 的 zeta(3) 无理性形式化、sinhp/Poly 的范畴多项式函子、Lean3 p-adic L函数材料及单位根百科页面；对象或形式系统版本不同，没有目标声明。第三组返回 MathOverflow 的因数问题、arXiv:2309.08057v1 的Dirichlet多项式均值文献及Dirichlet级数百科等，未返回可核对的目标Lean声明。随后用 /extract 请求 kimihiro64/Robin 的仓库页与README，两次均未取到正文，返回404；该候选只按未核实索引线索记载，不能当作源码证据。外部搜索没有确认能导入钉版环境的本题证明。 缺失前置的具体形状如下，名称仅为待实现接口的示意。定义 Z (n:ℕ) (s:ℂ) := ∑ d ∈ n.divisors, (d:ℂ)^(-s)，G_k := Nat.fib (k+2)，M (k:ℕ) := ∏ i ∈ Finset.range k, (Nat.nth Nat.Prime i)^(Nat.fib (k+2)-1)；后两式绑定原文 G_0=1、G_1=2 的黄金数和前k个素数满窗。需要一条不把下列结论作为参数的已证桥接定理，其陈述为：(A) ∀ (n:ℕ) (s:ℂ), 0<n → Z n s = ∏ p ∈ n.primeFactors, ∑ j ∈ Finset.range (n.factorization p+1), ((p:ℂ)^(-s))^j；(B) (∀ k, M k ≠ 0) ∧ (∀ d:ℕ, 0<d → ∀ᶠ k in Filter.atTop, d ∣ M k)，并给出该有限和的求和域识别 ∀ (k:ℕ) (s:ℂ), Z (M k) s = ∑' d:ℕ, if d ∈ (M k).divisors then (d:ℂ)^(-s) else 0。A必须覆盖 s=0，B必须使用上述实际满窗而非任意满足穷尽性假设的族。由A及现有单位根/复幂工具应得到 ∀ (n:ℕ) (s:ℂ), 1<n → Z n s=0 → s.re=0；由B及已有绝对收敛/支配收敛工具应得到 ∀ s:ℂ, 1<s.re → Filter.Tendsto (fun k => Z (M k) s) Filter.atTop (𝓝 (D5.S3.Weil.Convention.classicalZeta s))。这些都是待证及待绑定陈述，未伪称为现存声明。 不能就地用一个合同声明消除缺口：把上述A、B、零点位置或趋近zeta直接作为结构体字段或定理假设，只是把证明义务重新假设掉；把 Z_n 改定义成逆Euler乘积则改变了原函数。现有工具足以构成具体证明工作的合理起点，本记录不宣称数学上无法新增这样的证明；需要完成复幂乘法性与因数枚举的实例化、处理 s=0 和自然数求和中的零项，并证明黄金满窗的算术穷尽性，之后才能冻结。本席只读，不能把尚未完成的实例化文字当作Lean证明。 诚实标注：未运行 Lean、LSP、#check、内核验证、构建、任何lake或仓库门；待实现接口的名称、语法、强制转换、导入和公理闭包均未检验。未证明A、B或其组合，也未完成全库声明的语义穷尽；较早宽检索的截断输出未视为全部审阅。第三方项目正文、兼容性和证明闭包未核实，Robin正文未取得。本文仅复核本次已读候选不构成完整载体；不把右半平面收敛解释为临界带的零点控制，也不宣称更强解析控制定理不存在。"
    reentry_condition: "提供一条冻结的D5定理或钉版库定理，绑定 Z (n:ℕ) (s:ℂ) := ∑ d ∈ n.divisors, (d:ℂ)^(-s) 和原文满窗 M (k:ℕ) := ∏ i ∈ Finset.range k, (Nat.nth Nat.Prime i)^(Nat.fib (k+2)-1)，其陈述同时给出：(A) ∀ (n:ℕ) (s:ℂ), 0<n → Z n s = ∏ p ∈ n.primeFactors, ∑ j ∈ Finset.range (n.factorization p+1), ((p:ℂ)^(-s))^j；(B) (∀ k, M k≠0) ∧ (∀ d:ℕ, 0<d → ∀ᶠ k in Filter.atTop, d ∣ M k)；以及 ∀ (k:ℕ) (s:ℂ), Z (M k) s = ∑' d:ℕ, if d ∈ (M k).divisors then (d:ℂ)^(-s) else 0。这些结论须被证明而非置于该定理的假设中，A须处理 s=0。 有了A，从 Z n s=0 及有限乘积为零取出素数 p 的局部几何和零因子，令 a=n.factorization p、z=(p:ℂ)^(-s)；geom_sum_mul 给 z^(a+1)=1，z=1 时和为 a+1≠0，因此 z≠1。以 a+1≠0 接 Complex.norm_eq_one_of_pow_eq_one，再以 p>1 接 Complex.norm_cpow_eq_rpow_re_of_pos 和 Real.rpow_right_inj，得到 (p:ℝ)^(-s.re)=1=(p:ℝ)^0，从而 s.re=0，完成原文有限零点子句。 有了B和有限和识别，固定 1<s.re，以 f k d := if d ∈ (M k).divisors then (d:ℂ)^(-s) else 0。正整数d最终整除 M k，故各正坐标最终等于原级数项；d=0单独用 M k≠0 和 s≠0 证明两端均为0。逐项范数被 ‖(d:ℂ)^(-s)‖ 支配，由 summable_riemannZetaSummand 得可求和上界，用 tendsto_tsum_of_dominated_convergence 得到该有限族趋于自然数Dirichlet tsum，再接 D5.S3.Zeros.ZetaIdentities.riemann_zeta_dirichlet_sum，得到 Tendsto (fun k => Z (M k) s) atTop (𝓝 classicalZeta(s))。归档时保持 1<s.re 的作用域，解析延拓的背景可接已有 classical_zeta_unique_simple_pole_residue_one，但不得由此认领临界带的零点传递。接口须完成Lean核验和冻结后才计入覆盖；若只先完成一个完整子句，应回到部分覆盖分类复评。"
