  quarantine:
    justification: 'carried:本 PR 同时冻结的 D5/S3/Arith/RobinExponentSwap 的公开定理 D5/S3/Arith/RobinExponentSwap.reciprocal_geom_sum_swap_strict(Lean 名 D5.S3.Arith.RobinExponentSwap.reciprocal_geom_sum_swap_strict,statement_id sha256:1f7a8c1ca212a99933c506ed3cbe27e20885446d9881b25e9b9d396e03580cba,冻结状态片 Golden/Frozen/state/D5/S3/Arith/RobinExponentSwap.lean.json 实读存在)承载原文定理 2.1 的第三步:对 1<p<q 与 a<b,reciprocalGeomSum p a * reciprocalGeomSum q b < reciprocalGeomSum p b * reciprocalGeomSum q a,即把较大指数配给较小底数会严格增大归一化因数和的两因子局部比较。该模块头部 utility: none,准入依据为 escape-witness,其逃逸见证是证明内的具名中间命题 increment(尾项对固定前缀的逐项严格比较,由 Finset.sum_lt_sum_of_nonempty 与 pow_lt_pow_left0 的分拆链证出,两个 Nat.le_induction 分支都实际用到它)。 uncarried:原文定理 2.1 的其余四条承重子句均未被承载 —— ①充分大的严格反例存在性与记录点构造;②记录点必须使用连续小素数;③指数交换下的整数变小与记录点矛盾;④非增指数分拆结论及以 5040 为阈的 RH 等价。上列局部比较只提供 ③ 所需的因数和方向,不提供整数大小比较本身,也不提供 ①②④ 的任何部分。 scope gap:owner 的定义域是任意实底数 1<p<q 与自然数指数,不含素数、不含 sigma、不含 N(a) 与 5040 阈值;原文子句量化的是整数分拆与 RH,两者不是同一个陈述,不能合报为整条覆盖。 near misses:实跑 D5 全库不分大小写检索 robin|superabundant|rearrang 与 sigma 相关声明名扫描,除本次新冻结者外零命中;钉版 mathlib NumberTheory 只提供 sigma_apply、sigma_mono、isMultiplicative_sigma、sigma_one_apply_prime_pow 一类积木,无任何关于归一化因数和在指数重排下比较的声明。 账目先决:实读该条目 coverage_gids 为空、receipts 无 cover_disposition、无 chain_atoms。 同族对照:同卷 67e608434c3a38497a2f2ac72b78f65cc8472c190d5ed143d446b7842010cfac 是同一节的另一修订版(多四行注,数学相同),本次未处置,其状态不受本记录影响。 诚实边界:本记录的检索限于上列范围;未作第三方生态穷尽检索;冻结身份据现有状态片读取,未重跑 kernel 或公理闭包重算,这些均为 ASSUMED-UNVERIFIED。'
    reentry_condition: 当出现一条冻结的 D5 或钉版库定理,以素数分拆 a1>=...>=ar>=1 与 N(a)>5040 为对象,陈述 RH 为假蕴含存在满足 Z(a) > exp(gamma)*log(log(N(a))) 的严格反例时,重审本 atom。接线路径:先由本次冻结的 reciprocal_geom_sum_swap_strict 取得指数交换下归一化因数和严格增大的方向,再补 ① 充分大严格反例到超丰记录点的迁移、② 记录点素数支撑连续性、③ p^b*q^a < p^a*q^b 给出的整数变小与记录点极值性的矛盾,四者复合方得非增指数结论。亦可由调用方授权的无损分解,给出一个作用域恰与本局部定理相符的子 atom,届时该子 atom 可直接 cover,而本 atom 仍须等待其余子句。不得以本局部比较直接覆盖整条 atom:deposit 门的自动覆盖曾在此产生一条不忠实的整条边,已由调用方撤回。
