  quarantine:
    justification: 'carried:本 PR 同时冻结的 D5/S3/Arith/GoldenLocalThreshold.golden_prime_local_objective_maximal_of_threshold(statement_id sha256:23987e6eeb6fbde5080aa4c081a5fbbacd89ead9bfe62eaa144463e2b7fa875d,见冻结事件 sha256:61fb7a628def3f0f7cf83f13e6a4a59306c9cf07234646b1890e9df017a93686 的 declaration_statement_ids)只承载原文证明内部的一步——**对一个固定素数 p**,若边界边际满足 goldenLayerMarginal p (a+1) <= lambda 且(a = 0 或 lambda <= goldenLayerMarginal p a),则指数 a 在该素数方向上使局部目标 goldenPrimeLocalObjective lambda p 取最大。这对应原文的「由于边际收益递减,局部最优要求 eta(p,a_p) >= lambda >= eta(p,a_p+1);对于 a_p=0,只要求 lambda >= eta(p,1)」,且只是其**充分**方向。 第二承载者(同一研究线,PR lane/math/pf0906m):D5/S3/Arith/GoldenResource/GoldenResourceThresholdCriterion.golden_resource_optimal_iff_layer_thresholds(冻结事件 sha256:bf8f319f103f98a2bbe8325c72590e3698c9f330806893e5636a54d5a23907a6)在固定 lambda>0 下把原文「各方向的目标可相加,所以局部条件充分;反过来,若某个局部方向不最优,单独改变该方向即可提高整体目标,所以条件也必要」形式化为一条充要,并保留「由于边际收益递减,局部最优要求 eta(p,a_p) >= lambda >= eta(p,a_p+1)」以及 a_p=0 时只需 lambda >= eta(p,1) 的分支。其逃逸见证是具名中间命题 golden_resource_strict_improvement_of_marginal_gt(源码第 90 行声明,第 110 至 113 行消费):若某素数的下一层边际严格高于价格,则 n 乘以 p 是一个严格更好的竞争者。席位用 Lean LSP 实测该见证处于公开 iff 定理 elaborate 后的常量依赖闭包内(直接引用)。该见证相对 orchestrator 原始 brief 的拟议版本**不一致**:席位在实施前把它修订为 v2,补上了 hn 即 1 <= n 的前提,并以新版本重新预登记——这是第 5⁗ 条允许的形态,不是事后改标。反事实:去掉它只剩最优性不等式与冻结的充分方向局部条件,必要方向的上阈值推不出来。 第一承载者仍只承载单素数方向局部最优的充分方向,见上。 第三承载者(同一研究线的收官层,PR lane/math/pf0907a):D5/S3/Arith/GoldenResource/GoldenResourcePriceInterval.colossally_abundant_iff_price_interval_nonempty(冻结事件 sha256:c1c0e308a6551d8d841af65023880bb763d4a742d7934fa5e5bea4359003b1c7)定义了 L(n) 为全体素数上 eta(p,a_p+1) 的最大值、U(n) 为整除 n 的素数上 eta(p,a_p) 的最小值,以及谓词 IsColossallyAbundant,并证出原文式 (7) 本身,即 n 是极大丰数当且仅当 L(n) <= U(n),比较取非严格,保留原文在临界处的等号约定。其逃逸见证是具名中间定理 golden_upper_price_attained(源码第 65 行):对任意 n >= 1,存在一个素数在全体素数中取到最大的下一层边际,即 L(n) 是**真正取到**的最大值而非仅上确界;它在第 105 行被 golden_upper_price_spec 使用,后者又在公开 iff 的第 122 行、必要方向第 126 行、充分方向第 135 至 137 行被使用,并在第 114 至 116 行供给正性。席位用 Lean LSP 以 ConstantInfo.value? 与 Expr.getUsedConstants 读定理体,实测确认了公开 iff 到上价格规范、再到取到性最大值的两条依赖边。反事实:冻结的截断定理只在**已给定的正价格**上界定尾部,把它绑到一个任意 n 上得不到取到性。 uncarried:原文的承重断言是式 (7) 的**充要**判据「n 是极大丰数当且仅当 L(n) <= U(n)」,其中 L(n)=max_p eta(p,a_p+1)、U(n)=min_{p|n} eta(p,a_p)。本模块四段一段未证: scope gap:冻结定理的量化对象是单个素数方向上的一元函数极值,不含 n 的分解、不含跨素数求和、不含「极大丰数」这一谓词;原文子句量化的是整数 n 的一个充要判据,两者不是同一陈述,不能合报为整条覆盖。 near misses:同卷已冻结的 D5/S3/Arith/GoldenResourceOptimalInteger.golden_layer_strict_decrease 提供逐点的边际递减序,但不提供累积目标的不等式;该模块的局部最优只在价格 1/25 与 5040 的指数处成立,无法实例化到任意价格,故不能覆盖本条。检索留痕见模块顶部的 Library-search audit trail 块注释。 账目先决:实读该条目在 origin/dev 上 coverage_gids 为空、receipts 无 cover_disposition、无 chain_atoms。 门的自动覆盖已被撤回:make deposit 的内建 cover 把整条 atom 迁入 absorbed-closed 并写入整条覆盖边(边指向上述 statement_id),门退出 0 而语法层多子句守卫未拒绝;这是同一形态第五次(前四次见 issue 5844),调用方据 origin/dev 逐字节还原该条目。 诚实边界:Lean 与 Scribe 由 codex 席位 impl4b 产出,该席被宿主因内存不足杀掉,未产出自评报告;deposit、判形、撤回与本记录均为 orchestrator 完成,零评审席;未重跑 kernel 也未重算公理闭包。以上均为 ASSUMED-UNVERIFIED。 承载进度:本 atom 的承重断言式 (7) 现已由第三承载者证出;仍未承载的只剩三段——区间内全体价格的全称刻画(公开定理给的是存在性)、未出现素数中只需检查最小者的归约、以及临界参数处并列最优的存在性与分类。 第四承载者(PR 5989 落地 Lean 与 Scribe、本 PR 冻结):D5/S3/Arith/GoldenResource/GoldenSmallestMissingPrime(冻结事件 sha256:03d22f6e5c58842086c49f13effcae85d53d9b1e1cee140763d208d0de4fc8d3,模块 statement_id sha256:a8040dec859ecd15f3fc6e6d5a4bc40a19033be005e1ef3552053fa94ea46cd8)承载此前列为未承载的第二段,即未出现素数中只需检查最小者的归约。公开定理 exists_smallest_missing_prime_threshold(statement_id sha256:afa021c2ce16a2b073b5abe4405a1a922589a1319ed9addc2e026b58f31e43bd,源码第 103 行)证:每个 n 大于等于 1 都存在不整除 n 的最小素数 q,且对任意实价格 lambda,一切不整除 n 的素数 p 满足首层阈值 goldenLayerMarginal p 1 小于等于 lambda,当且仅当 q 满足该阈值;中间的 iff 由 golden_missing_prime_threshold_iff_of_isLeast(statement_id sha256:6382a32b47230338c9c302bf84698a18f52e92f6de73fce219b1f40d62cdc4e9,源码第 92 行)给出。其逃逸见证是公开定理 golden_layer_marginal_one_strictAnti(statement_id sha256:f95a3d8b774af70fd79f3d353a13ab92ca41774b489bfc76b9a047026155e94a,源码第 71 行):两个素数 p 小于 q 时 goldenLayerMarginal q 1 严格小于 goldenLayerMarginal p 1,即首层边际关于素数严格递减;证法是首层的精确消去把它化为 log(1+1/p)/log p,再由 inv_strictAnti 与 Real.log_lt_log 定分子的序、由 Real.log_lt_log 与 Nat.Prime.log_pos 定分母的正性,最后 div_lt_div 合成。反事实:仓内三条相关冻结事实各自都给不出两个不同素数之间的序——golden_layer_strict_decrease 固定素数比较层数;golden_layer_marginal_le_inv_pow 对另一个素数只给上界不给下界,两个上界推不出严格序;inv_pow_div_log_lt 是对全体素数一致的最终截断而非逐对单调性。 本次以 make deposit 冻结时,门的 cover 步以 COVER_INVALID 拒绝并报 PLAYBOOK_DEPOSIT_FROZEN_UNCOVERED,故未写入任何 coverage 边,atom 仍为 residual-open。诚实边界:Lean 与 Scribe 由 codex 席位 pf0907i-impl 产出,逃逸见证与 orchestrator 派席前预登记的拟议见证逐字一致;orchestrator 亲验 make lean 退出码 0、^error 行数 0、模块 sorry 计数 0、四条 print axioms 输出只有 propext 与 Classical.choice 与 Quot.sound;零评审席;未重跑 kernel、未重算公理闭包。 承载进度更新(第四承载者后):仍未承载的只剩两段,且两段在 2026-09-07 均被判为 bind-only,按第 5 撇 4 条不应为它们单独派实施席。第一段区间内全体价格的全称刻画:已冻结的 golden_resource_optimal_iff_layer_thresholds 已把最优性刻画为两个阈值不等式,而 goldenUpperPrice 是诸下一层价格的 sSup、goldenLowerPrice 是已采纳层价格在整除 n 的素数上的 inf,故由 lambda 落在区间内推出最优,只是该 iff 的实例化加两次投影加一次 trans,判为 bind-only,由 orchestrator 以两条读源码的检索判定。第二段临界参数处并列最优的存在性与分类:存在性由已冻结的 golden_resource_objective_eq_of_layer_price 一次重写即得;分类部分由一个 codex 探针席在实施之前判为 bind-only 并按预设停手条件停在建模块之前,理由是公开定理 positive_layers_eq_count_interval(GoldenResourceOptimalLayerCount 源码第 97 行)把活跃层集合等同于 Set.Icc 1 optimalLayerCount,配上两个阈值不等式后窗口只剩 omega 与 linarith 一级的规范化。该判定同时纠正了 orchestrator 先前一次不完备的反事实:orchestrator 当时凭记忆只点了三条冻结事实,漏掉了同一模块的这条公开定理。按第 5 撇 4 条 c 款,这两段的合法出路是消化、或写成某个有内容模块内的具名伴随引理,不是单独 deposit。'
    reentry_condition: 本 atom 的承重断言式 (7) 已由第三承载者证出,首层阈值只需检查最小缺失素数已由第四承载者证出。仅当出现下列情形之一时重审:一是某个有逃逸内容的模块把剩余两段之一写成具名伴随引理并连同该模块一起冻结;二是有人给出证据推翻本记录对那两段的 bind-only 判定。剩余两段为区间内全体价格的全称刻画,以及临界参数处并列最优的存在性与分类,二者在 2026-09-07 均被判为 bind-only,判据与归约路径写在 justification 末段。不得以任一单段直接覆盖整条 atom:deposit 门的自动覆盖曾在此写出一条不忠实的整条边,已由调用方撤回;第四承载者冻结时门以 COVER_INVALID 拒绝、未再发生。
