  quarantine:
    justification: carried:本 PR 冻结的 D5/S3/Arith/GoldenLayerMarginalDecay(冻结事件 sha256:a09e3d33fbe5e9a99a3d2cdde25709c08b6234ac8b4b575783ac91beefe4ee12)承载原文证明里逐字写出的量界一句「此外:eta(p,k) <= p^(-k)/ln p」,即公开定理 golden_layer_marginal_le_inv_pow(statement_id sha256:12a2846f451ec15f79dd749a146973ffd2c01ba3382ab02ba3d9cbc12479fee4);伴随的公开定理 golden_layer_marginal_lt_of_le(statement_id sha256:f5751f69061c3)承载「对固定 lambda>0 只有有限多个指数层满足 eta>lambda」中**单个素数**那一半,形状为存在 N 使得一切 a >= N 的层都低于 lambda。逃逸见证是私有定理 layer_ratio_sub_one_le(源码第 33 行,在公开证明第 65 行经 hlog.trans 使用,处于活推导路径上),它给出比值减一的 p^(-a) 上界;冻结前置只给序(golden_layer_strict_decrease 说 eta 逐层严格递减)而不给任何量的上界,严格递减的正数列可以不趋于零,故反事实成立。 uncarried:①「只有有限多个**素数**满足 eta>lambda」这一半未证——本模块对每个固定素数各给一个 N,不给跨素数的一致界;②P0(lambda) = sum over p, sum over k of (ln p)(eta(p,k) - lambda)_+ 的闭式未证;③最优配置 a_p^0(lambda) = 满足 eta(p,k)>lambda 的层数,未证;④「阈值恰好等于 lambda 时采用或不采用该层都不改变目标值」未证;⑤「各局部最优可以同时实现」的跨素数结论未证;⑥5040 与 RH 区域的边界讨论未形式化。 原文缺陷(按第 1 条入账):该 atom 的定理 2.1 写作对一切 lambda 的全称,但在 lambda <= 0 时为假——此时每一层都满足 eta > lambda,右端的双重和发散,最大值不存在。本模块的两条定理都显式要求 0 < lambda 或 1 <= a,不承载那个错误的全称;若要覆盖原句须先由该卷追加勘注限定 lambda > 0。该缺陷由判形探针席在实施之前独立指出,orchestrator 复核原文确认。 scope gap:冻结定理量化的是单个素数的边际数列的上界与尾部行为;原文子句量化的是全体素数与全体指数层上的最优值闭式与最优配置,两者不是同一陈述,不能合报为整条覆盖。 near misses:仓内 grep -rn goldenLayerMarginal 于 D5 只见其定义处与 GoldenLocalThreshold 的使用,无任何关于它的界;全库 11466 个声明名的索引中 layer_marginal 与 marginal 加 le 或 bound 的组合无同义命中;席位在钉版 mathlib 检索 log((1-x^(a+1))/(1-x^a)) <= x^a 一类引理零命中,只找到通用的 Real.log_le_sub_one_of_pos 与 tendsto_pow_atTop_nhds_zero_of_lt_one。席位对更广第三方生态的检索因凭据代理的 GitHub 服务拒绝认证而未完成,标 ASSUMED-UNVERIFIED。 账目先决:实读该条目在 origin/dev 上 coverage_gids 为空、receipts 无 cover_disposition、receipts 无 chain_atoms(实读为空列表)。 门的自动覆盖已被撤回:make deposit 的内建 cover 把整条 atom 迁入 absorbed-closed 并写入整条覆盖边,门退出 0 而语法层多子句守卫未拒绝;这是同一形态第六次(前五次见 issue 5844),本次由实施席提交在案,调用方以后续提交据 origin/dev 逐字节还原该条目。 诚实边界:Lean 与 Scribe 由 codex 席位 impl-glmd 产出并自报 lean_exit 0、emit_exit 0、deposit_exit 0;逃逸见证与 orchestrator 派席前预登记的拟议见证一致;零评审席;orchestrator 未重跑 kernel、未重算公理闭包。
    reentry_condition: 当出现一条冻结定理,其陈述为原文式 (4) 的闭式 P0(lambda) = sum over p, sum over k of (ln p)(eta(p,k) - lambda)_+ 且带 lambda > 0 的限定,并同时给出最优配置 a_p^0(lambda) 的刻画时重审。接线路径:本次冻结的 golden_layer_marginal_le_inv_pow 提供每层的几何量界,golden_layer_marginal_lt_of_le 提供单素数的尾部消失;还需 ①跨素数的一致界,把活跃层集合整体判为有限;②任意 lambda 下把 goldenResourceObjective 分解为各素数方向 goldenPrimeLocalObjective 之和(现有机器是 private 且硬编码 lambda = 1/25);③由分方向最优合成整体最优;④阈值相等时的不变性。不得以量界直接覆盖整条 atom,也不得覆盖其在 lambda <= 0 时为假的全称:deposit 门的自动覆盖曾在此写出一条不忠实的整条边,已由调用方撤回。
