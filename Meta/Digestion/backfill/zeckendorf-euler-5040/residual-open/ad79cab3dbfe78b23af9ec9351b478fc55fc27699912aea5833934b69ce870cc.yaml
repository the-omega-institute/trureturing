  quarantine:
    justification: "Half of this atom is frozen and the other half has a located, unbuilt foundation. Theorem 9.1 argues in two segments. The second, that one together with the primes is not a semilinear set, is frozen as D5/S3/Arith/PrimesNotSemilinear.primes_union_one_not_isSemilinearSet, which reduces through the pinned Nat.isSemilinearSet_iff_ultimately_periodic and closes by the composite p times one plus d. The first segment is Conway's theorem that the reachable exponents of PRIMEGAME on the pure powers of two axis are exactly one together with the primes; no carrier for it is in D5. The earlier scoping note recorded that the repository has no FRACTRAN foundation, which is accurate for D5 but incomplete: a probe seat located two third-party Lean formalizations, pimlu/fractran with fractran-lean/Fractran/Basic.lean and sanchace/FRACTRAN. The same probe also showed that the one-step semantics of FRACTRAN closes term by term against pinned Mathlib factorization results, so building that layer locally would not itself yield an admissible first freeze."
    reentry_condition: "The A17.2 question this record asked to settle is now settled, against the third party. Readings taken on 2026-09-12 by GitHub code search and raw file fetch. The on-topic repository is sanchace/FRACTRAN, whose own description is formalizing Conway's 1986 FRACTRAN paper in Lean 4, default branch main, last pushed 2024-05-22, seven stars. Its FRACTRAN/PrimeGame.lean is 35 lines and defines the fourteen fractions, prime_game_list and prime_game; it states lemma prime_game_doesnt_halt and theorem prime_game_primes, and the body of each is the single token sorry. Its own comment says the stated theorem is much weaker than the actual prime game theorem, does not show that it generates every prime, and asks whether to formalize it at all. So the statement present there is one direction only, carries a hypothesis excluding the start value, and is not proved. Two further readings close the route: the repository has no license, the licenses endpoint returns 404 and the license field is null, so a port under A17.2 has no license text to carry and a dependency on it is not admissible either; and a GitHub code search for PRIMEGAME restricted to Lean returns zero hits. The other Lean FRACTRAN sources are interpreters with no theorem at all: pimlu/fractran fractran-lean/Fractran/Basic.lean is 39 lines with zero theorems and is MIT, and the one Conway-named file in jsboige/CoursIA is 74 lines defining fractranStep, fractranRun and primeProgram with zero theorems. Conclusion: there is no exact third-party hit, so the A17.2 ban on reproving does not bind here and the route is a local proof under 第 3.1 条 step four. Shape it as a research line, not one seat. The step semantics is definitional against pinned Mathlib factorization and its module cannot first-freeze on its own now that escape-witness is the only admission basis; the content is the reachability characterization itself, in both directions, and its proof is a state-machine invariant argument over the fourteen fractions. Once that carrier is frozen, compose it with the frozen D5/S3/Arith/PrimesNotSemilinear.primes_union_one_not_isSemilinearSet to obtain theorem 9.1 and cover this atom."
