  quarantine:
    justification: 'carried:本 PR 同时冻结的 D5/S3/Arith/PrimeLogBudget 的唯一公开定理 D5/S3/Arith/PrimeLogBudget.exists_unique_prime_log_budget(statement_id sha256:e4f2b95b59f057bae53a6fdff806bb9805fbc1c9ff34a9c8d6550e1ad4feae78,冻结状态片 Golden/Frozen/state/D5/S3/Arith/PrimeLogBudget.lean.json 实读存在)承载原文定理 12.2 的第一块:存在唯一的阈值。其陈述为对 0<T,存在唯一实数 y 使 2<y 且 T = primeLogBudget y,其中 primeLogBudget y 定义为 sum over p in Nat.primesBelow (natCeil y) of log (y/p)。模块头部 utility: none,准入依据 escape-witness,逃逸见证为两条私有引理:budget_strictMonoOn(primeLogBudget 在 Set.Ici 2 上严格单调)与 budget_continuousAt(在每个正点连续,经固定上截断改写为定指标集的有限和后用 tendsto_finsetSum 得到);二者配中值定理给出存在、配严格单调给出唯一,两条在公开定理的证明中均被实际使用。 uncarried:原文定理 12.2 的其余两块均未被承载 —— ①最优指数公式 x_p 星 = max(0, log y / log p - 1);②最优值 Phi(T) 的闭式,即 log of product over p<y of (1-1/p) 的倒数 加上 piLess(y)*log(1-1/y)。原文用 lambda = 1/(y-1) 作乘子、以每个 f_p(x) - lambda*x*log p 的严格凹性给出逐方向最优,再对有限支撑配置求和并用预算约束得到全局最优与唯一;本模块只给出该论证所依赖的阈值 y 本身的存在唯一,不给出乘子、不给出最优指数、不给出最优值。 scope gap:owner 的结论是一个关于实数 y 的存在唯一性陈述,不含指数配置 x_p、不含 f_p、不含 lambda、不含 Phi(T);原文子句量化的是最优化问题的解与最优值,两者不是同一陈述,不能合报为整条覆盖。 near misses:实跑 D5 全库检索 robin|superabundant|rearrang 与 sigma 相关声明名扫描,除本次新冻结者外无相关命中;钉版 mathlib 无 ContinuousAt 版的有限和声明(实测 ContinuousAt.sum、continuousAt_finsetSum、ContinuousAt.finset_sum 皆不存在,fun_prop 亦不能闭合),故连续性须回到 Tendsto 定义,这正是本模块私有引理的内容之一。 账目先决:实读该条目 coverage_gids 为空、receipts 无 cover_disposition、无 chain_atoms。 门的自动覆盖已被撤回:make deposit 的内建 cover 步骤把整条 atom 迁入 absorbed-closed 并写入整条覆盖边,门退出 0 而语法层多子句守卫未拒绝;这是同一形态第三次(前两次见 issue 5844 记录),调用方据 origin/dev 逐字节还原该条目,现 coverage_gids 为空。 诚实边界:检索限于上列范围,未作第三方生态穷尽检索;冻结身份据状态片读取,未重跑 kernel 或公理闭包重算;本模块的 Lean 由上一席位起草、orchestrator 修两处编译错误后自证 lake env lean 退出 0,Scribe 由 orchestrator 手写并经 make emit 退出 0 与逐值读 md 核对;未经独立评审。这些均为 ASSUMED-UNVERIFIED。'
    reentry_condition: 当出现冻结定理给出原文定理 12.2 的最优解结构 —— 即对上述唯一阈值 y,最优指数为 x_p = max(0, log y / log p - 1),且最优值 Phi(T) 等于 log of the reciprocal of product over p<y of (1 - 1/p) 加上 piLess(y) * log(1 - 1/y) —— 时重审。接线路径:本次冻结的 exists_unique_prime_log_budget 直接给出该论证所需的阈值 y 及其唯一性;还需补 lambda = 1/(y-1) 的乘子刻画、每个方向上 f_p(x) - lambda*x*log p 的严格凹性与唯一最大点、以及对有限支撑配置求和后由预算约束得到全局最优,三者齐备方得整条。不得以本阈值定理直接覆盖整条 atom:deposit 门的自动覆盖曾在此写出一条不忠实的整条边,已由调用方撤回。
