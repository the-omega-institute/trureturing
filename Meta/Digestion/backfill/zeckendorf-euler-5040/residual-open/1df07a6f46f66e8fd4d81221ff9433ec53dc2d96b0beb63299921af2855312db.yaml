  quarantine:
    justification: "carried:本 PR 同时冻结的 D5/S3/Analytic/SeriesInequalities/PrimeEulerLogTail 的唯一公开定理 D5/S3/Analytic/SeriesInequalities/PrimeEulerLogTail.prime_euler_log_tail_le(statement_id sha256:b2bb2ab527e381e0c0664e19cf109d890a8f621457af00c5514fada69a53f943,冻结状态片 Golden/Frozen/state/D5/S3/Analytic/SeriesInequalities/PrimeEulerLogTail.lean.json 实读存在)承载原文定理 7.4 显式有限窗口界中的一项:被略去素数的 Euler 对数尾。其陈述为对 1<s 与 2<=X,sum' over p in Nat.Primes of (if X < p then -log(1 - p^(-s)) else 0) <= 1/(1-2^(-s)) * (X^(1-s)/(s-1)),无条件成立、不含 window 或 Fibonacci 截断参数。模块头部 utility: none,准入依据 escape-witness,逃逸见证为私有定理 integer_log_tail_le(整数下标对数尾的同型界,定义在第 76 行、在公开定理证明第 123 行被实际使用,其证明需逐点控制、可和性、前缀分裂与积分比较,非 Mathlib 声明的实例化或规范化)。该见证由席位以第三版预登记(v3 取代 v2 的整数幂尾提案),先于证明写下,非事后追认。 uncarried:原文定理 7.4 的其余四条承重子句均未被承载 —— ①识别并分解有限除数窗口的对数误差;②界住 p<=X 上有限 Fibonacci 指数截断的修正和;③把被略去素数误差与有限指数误差合成为完整的显式有限窗口界;④先取 X 再取足够大的 L,证明带 epsilon 的收敛陈述。 scope gap:owner 只量化素数尾这一项,不含 window X L、不含 Nat.fib、不含除数和与 tsum 之比的对数,也不含任何 epsilon 量化;原文子句量化的是完整有限窗口误差,两者不是同一陈述。 near misses:实读仓内 EulerLogBridge 给的是整条级数恒等式,EulerProducts.tsum_succ_rpow_le 处理端点为一的幂级数,两者都不陈述本对数尾估计;钉版 mathlib 提供积分比较、幂积分与对数不等式作为积木,无该尾估计本身。席位另经 Tavily/NyxID 作外网检索,返回结果中未见对应的 Lean 声明。 账目先决:实读该条目 coverage_gids 为空、receipts 无 cover_disposition、无 chain_atoms。 门的自动覆盖已被撤回:make deposit 的内建 cover 步骤曾把整条 atom 迁入 absorbed-closed 并写入整条覆盖边,门退出 0 而语法层多子句守卫未拒绝;席位在结论中自报 faithful_whole_atom_coverage 为假并列出上述四条,调用方据 origin/dev 逐字节还原该条目,现 coverage_gids 为空。 诚实边界:检索限于上列范围,未作第三方生态穷尽检索;冻结身份据状态片读取,未重跑 kernel 或公理闭包重算;这些均为 ASSUMED-UNVERIFIED。"
    reentry_condition: '当出现一条冻结定理,陈述完整的显式有限窗口界 —— 即对 1<s、2<=X 与任意 L : Nat -> Nat,-log((sum over n in (window X L).divisors of n^(-s)) / (tsum over n of (n+1)^(-s)))<= 1/(1-2^(-s)) * (X^(1-s)/(s-1) + sum over p in primesLE X of p^(-s * fib (L p + 2))) —— 时重审。接线路径:本次冻结的 prime_euler_log_tail_le 直接给出该界右侧的第一项(被略去素数尾);还需补 ②有限 Fibonacci 指数截断修正和的界、①窗口对数误差的分解、③两者的合成,三者齐备方得第一段。第二段的 epsilon 收敛须另证:先由第一段取 X 使首项小于 epsilon/2,再取 L 使第二项小于 epsilon/2。不得以本尾估计直接覆盖整条 atom:deposit 门的自动覆盖曾在此写出一条不忠实的整条边,已由调用方撤回。'
