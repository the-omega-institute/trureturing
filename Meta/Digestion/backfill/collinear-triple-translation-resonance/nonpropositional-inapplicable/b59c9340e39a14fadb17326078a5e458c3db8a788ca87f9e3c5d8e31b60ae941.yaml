    justification: Pure pinned-upstream closure, with no matching frozen project GID. The complete homomorphism-filtered carrier, arbitrary-group preservation, finite-G census with arbitrary possibly infinite codomain, both nonzero-translation branches, arbitrary/nonunit slope specialization, infinite-codomain example, and all displayed F3-squared directions, actual subgroups, paired fixed families, coset representatives and disjoint orbits are supplied by Mathlib at db584cd6d46c92f209a44c0f1c829460d327499d through instantiation, logical transport and normalization. Finset.card_vadd_finset and additive-homomorphism/cancellation identities give preservation; finite sums and local injectivity give the two necessary conditions. addOrderOf_eq_prime, nsmul_injOn_Iio_addOrderOf and IsOfFinAddOrder.mem_zmultiples_iff_mem_range_addOrderOf give the locally injective three-element cycle. AddSubgroup.zmultiples_le, Set.vadd_set_mono, AddAction.vadd_set_stabilizer_subset and Finset.eq_of_subset_of_card_le identify every fixed triple with a cycle coset. AddAction.stabilizer_coe_finset, AddAction.stabilizer_addSubgroup, finEquivZMultiples, AddAction.orbitProdStabilizerEquivAddGroup, Nat.card_congr and Nat.card_prod give the full census. Parameter substitution and finite ring/set normalization give all stated applications and pairwise disjointness via their distinct stabilizers. Exact clause-complete Lean applications use only propext, Classical.choice and Quot.sound. The existing project grid theorems require both coordinate injections and exclude H0, so their GIDs do not cover this target. No new Lean declaration, frozen theorem or coverage GID is asserted.
