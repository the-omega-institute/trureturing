  nonpropositional:
    justification: This atom is the status and scope paragraph of section 22. It records that the section is a paper argument, repo derived, to be settled later; that it closes the whole two coordinate family of the adjacent two point problem of sections eighteen through twenty and strengthens it to arbitrary positive real two point grids; that it does not close the arbitrary finite exponent set problem of section seventeen; that the general real prime case with three or more coordinates stays open; and that the manual three coordinate counterexample of section twenty one keeps its scope. These are provenance and scope declarations about the section, not mathematical assertions with a truth value, so no frozen declaration can cover them. The scope limits they state are honoured by the carriers of the sibling theorem atom, which are stated for two coordinates only.
