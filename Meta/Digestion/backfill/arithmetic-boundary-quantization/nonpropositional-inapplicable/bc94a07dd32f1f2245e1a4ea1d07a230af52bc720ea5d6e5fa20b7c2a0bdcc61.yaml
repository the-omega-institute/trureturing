    justification: 'Upstream-only bind-only boundary clauses; no project GID is available in this reuse basis. At Mathlib revision 56a005855ea17e0b0958f73ec801ae140b0a1679 (leanprover/lean4:v4.35.0), Matrix.gram_apply, Matrix.posSemidef_gram and Matrix.PosSemidef.dotProduct_mulVec_nonneg supply the Gram obstruction in an arbitrary complex Hilbert space: the fixed rounded block has quadratic value -2h<0 and therefore cannot be a Gram block or common unitary history. Matrix.PosSemidef.smul and finite-sum/algebraic normalization handle the simultaneous scaling s -> b Q_m(s/b), b>0: the diagonal becomes b and the negative quadratic becomes -2bh<0. The construction retains m>=1, h=1/m>0 and an input model depending on m. The exclusions of h=0, one fixed input failing at all resolutions, all quantum observables, and conclusions about actual xi or RH are scope limits, not additional negation theorems. This is an upstream-reuse bookkeeping receipt, not a new Lean proof or freeze.'
