  quarantine:
    justification: "Three of the theorem's five segments are frozen and the fourth is blocked by two named interface gaps, both confirmed against the frozen signatures. Frozen: D5/S3/Analytic/Interpolation/LogOneSubExpDerivatives.log_one_sub_exp_derivatives gives the derivative chain for the logarithm of one minus a negative exponential together with a positive third derivative, stated as ContDiffOn over Ioi 0; D5/S3/Analytic/Interpolation/HermiteMomentBounds.hermite_moment_bounds gives a positive lower node and an upper bound on every coordinate; D5/S3/Analytic/Interpolation/HermiteTwoPointRemainder.hermite_two_point_remainder gives the remainder identity and its strict sign. All three are generality G. The assembly segment, that the sum of the function over the coordinates is at most the value at the upper node plus k minus one times the value at the lower node, does not close from these three as they stand. First gap: the remainder theorem takes ContDiff over the whole line while the derivative chain supplies ContDiffOn over the positive half line, and the function is undefined at and below zero, so the hypothesis cannot be met by strengthening the supply. Second gap: the moment bound gives an upper bound on each coordinate but no lower bound against the lower node, while the remainder theorem needs membership in the open interval. A probe seat reached the same two blockers in 316 seconds and stopped without creating a module."
    reentry_condition: Close either gap and the assembly follows. The narrower repair is a ContDiffOn variant of hermite_two_point_remainder over an open interval containing the closed span of the two nodes, which is a separate module because the existing one is frozen and immutable. The second gap needs a lower bound on each coordinate against the lower node, either proved as a companion to hermite_moment_bounds or avoided by restructuring the argument to treat coordinates outside the open interval separately, noting that equality holds at the nodes. The degenerate case of vanishing variance, where every coordinate equals the mean, also needs its own branch. The load-bearing step of the assembly is not the pointwise application of the remainder but the observation that the sum of the interpolating quadratic depends only on the first two moments and equals the target expression exactly; that computation is where the content sits. Segment five, the classification of equality cases, is untouched.
    blocker_class: missing-prerequisite
