  quarantine:
    justification: "Four of the theorem's five segments are frozen and the fifth has no carrier. Frozen, all generality G: D5/S3/Analytic/Interpolation/LogOneSubExpDerivatives.log_one_sub_exp_derivatives gives the derivative chain for the logarithm of one minus a negative exponential together with a positive third derivative, stated as ContDiffOn over Ioi 0; D5/S3/Analytic/Interpolation/HermiteMomentBounds.hermite_moment_bounds gives a positive lower node and an upper bound on every coordinate; D5/S3/Analytic/Interpolation/HermiteTwoPointRemainder.hermite_two_point_remainder gives the remainder identity and its strict sign; and the assembly is now D5/S3/Analytic/Interpolation/HermiteUpperEnvelope.hermite_upper_envelope with statement id sha256:ea4423026bebc90b7273449fba7cd348734ffcc05e00ba941515f245cacae999, which imports only the other three and pinned Mathlib. Both interface gaps this record named earlier are settled, and neither was settled the way the earlier reentry condition proposed. The smoothness mismatch, whole-line ContDiff demanded against half-line ContDiffOn supplied, is bridged by hermite_two_point_remainder_on, carried as a named companion inside the assembly module and not as a separate module: a probe seat compiled the ContDiffOn variant as an extension of the frozen statement in 3.8 seconds and found it bind-only, so it had no independent first freeze available, and the legal route for a bind-only fact is a named companion inside a content module. The missing lower bound against the lower node is not closed but bypassed: a private double-node sign lemma handles coordinates below the lower node directly, so the assembly needs no such bound. Segment five, the classification of equality cases, is untouched."
    reentry_condition: 'Land a carrier for segment five, the classification of equality cases. The statement: with the total squared deviation positive, the sum attains the envelope exactly when every coordinate is one of the two nodes, and then the first moment forces exactly one coordinate at the upper node; with the total squared deviation zero every coordinate equals the mean and the two sides agree; and the prototype vector with one coordinate at the upper node and the rest at the lower node is a feasible positive vector for every admissible pair of moments, which is what makes the bound sharp. The content sits in the strict sign of the remainder away from the nodes. The frozen public surface supplies strictness only on the open interval between the nodes, through hermite_two_point_remainder_on; the matching strict statement for a coordinate below the lower node lives inside the assembly module as a private lemma with no GID, so a new module has to state and prove that one as a public lemma of its own. That branch cannot be dropped, because coordinates below the lower node do occur: for k equal to three at coordinates one, two and three the lower node is about 1.42 while the smallest coordinate is one.'
    blocker_class: missing-prerequisite
