  quarantine:
    justification: 'All five segments of the theorem are frozen; what blocks whole-atom coverage is now two tail clauses of the prose, not the theorem. Frozen carriers, all generality G, all in D5/S3/Analytic/Interpolation: LogOneSubExpDerivatives.log_one_sub_exp_derivatives, statement sha256:d968a17314f3943ea74, gives the derivative chain for the logarithm of one minus a negative exponential together with a positive third derivative on Ioi 0; HermiteMomentBounds.hermite_moment_bounds, sha256:cd6201b63e5fb1d61b9, gives a positive lower node and an upper bound on every coordinate; HermiteTwoPointRemainder.hermite_two_point_remainder, sha256:7de5144a1c06306de75, gives the remainder identity and its strict sign; HermiteUpperEnvelope.hermite_upper_envelope, sha256:ea4423026bebc90b727, gives the bound and carries hermite_two_point_remainder_on as a named companion; HermiteEnvelopeEquality, sha256:11c823d0b15c45aa896, closes the equality discussion with four public theorems. In that last module negative_left_of_double_node makes the strict sign left of the double node public, which the assembly module had only as a private lemma; hermite_envelope_equality states that for positive total squared deviation the bound is attained exactly when every coordinate is one of the two nodes, and that this forces exactly one coordinate at the upper node and all others at the lower one; hermite_envelope_zero_variance settles the degenerate case, where every coordinate equals the mean and both nodes collapse onto it; and hermite_envelope_sharpness exhibits, for every admissible pair of moments, a positive vector with those moments that attains the bound. Two clauses of the atom prose still have no carrier. First, the integer-exponent corollary bounding sigma of n over n by E_S times the upper node factor times the lower node factor to the power k minus one: it is stated in the prime-labelled exponent encoding and in E_S, and this chain defines neither. Second, the Lambda_k paragraph, which lower-bounds J minus F by Lambda_k and then by BV over 2k times the square of B minus one, and expands Lambda_k as BV over twice the square of B minus one plus a remainder of order V to the three halves: it is written in B, J and F, quantities this volume introduces in its sections on the finite exponent box and the separable dual, and those sections are not built in D5.'
    reentry_condition: 'Cover needs the two remaining clauses, not more work on the theorem. Do not reopen the theorem: all five of its segments are frozen, and any further module in that direction would be bind-only against them. The integer-exponent corollary needs E_S and the prime-labelled exponent encoding before it can be stated. The Lambda_k clause needs B, J and F, so it sits behind the same unbuilt sections of this volume that also block the three sufficient dominance conditions and the two-prime strict specialization; do not open a lane against it while those three symbols have no definitions in D5. Either build that layer first, as its own dependency-ordered line, or split the two clauses off as errata. When both have carriers, cover this atom against the five frozen GIDs named above together with the new ones.'
    blocker_class: multi-clause-guard
