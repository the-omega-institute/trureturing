    justification: 'Whole-statement guard for the clause `圆周双覆盖 z↦z^2 是最小例子。`: the in-scope source at lines 294-337 defines a finite free group action and quotient but gives no comparison class, order, or size functional for `最小`. Retrieval receipts: D5 searches `cocycle|monodromy|coveringMap|IsCoveringMap|orbit.*quotient|global.*section|circle.*cover` and `smallest example|minimal example|circle double|double cover` hit the exact-carrier partial owners `CircleDoubleCoverNoSection` and `CircleDoubleCoverHistoryLift` plus generic orbit/cocycle modules, but no minimality predicate or whole theorem; pinned Mathlib searches `IsQuotientCoveringMap|IsCoveringMap|properlyDiscontinuous|orbitRel|section.*quotient` hit `Topology/Covering/Quotient.lean` and `Circle.isQuotientCoveringMap_npow`, but no ordering of covering examples; the same search over pinned non-Mathlib packages missed. Local encoding assessment imported and read the compiled circle owners, confirming that the squaring cover, no-section clause, canonical lift, and endpoint exchange are expressible, but the minimality clause has no proposition until one invents a comparison relation absent from the source.'
    reentry_condition: The source defines the comparison class and order meant by `最小`, and a frozen theorem proves that minimality for the exact Circle squaring cover alongside every other public clause of Theorem 5.1.
