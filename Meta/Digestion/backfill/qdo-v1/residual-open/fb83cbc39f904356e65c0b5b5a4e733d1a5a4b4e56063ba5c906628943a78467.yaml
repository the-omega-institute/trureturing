  quarantine:
    justification: "w73a48: D5 search jordan|rank.*loss|nilpotent exit 0 found InformationLossJordanLayers.information_loss_layers_and_zero_jordan_chains (609), which carries rank-drop and finite total-loss equalities, but transferZeroBlocks (151) is constructed from rank-loss multiplicities, with no actual chain basis or similarity theorem. KernelTowerNilpotentRecovery (20-22) explicitly omits matrix conjugacy. The resisting clauses are actual zero-eigenvalue Jordan-block counts of sizes at least k and exactly k. Pinned Mathlib db584cd6d46c92f209a44c0f1c829460d327499d searches jordan|rank.*pow|finrank.*pow and invariant.*complement found JordanChevalley, kernel stabilization, and vector-space/semisimple complements, no nilpotent maximal-cyclic invariant complement. loogle: query \"jordan\" exit 0 count 86, no chain-basis hit in inspected results. leansearch: query Jordan normal form nilpotent linear map chain basis POST /search exit 0 hits 8, only nilpotency transport and nilRank near hits. A17 GitHub code queries JordanNormalForm language:Lean and \"Jordan normal\" language:Lean exit 0 hits 0; broader jordan query found no relevant owner. Local construction /private/tmp/consensus-rnd/sshx/w73a48/attempt-1/atom1-probe.lean exit 1 obtains a maximal-height vector, constructs its invariant cyclic span C, and obtains IsCompl C Q; exact remaining goal: V : Type u_1, f : Module.End Complex V, hf : IsNilpotent f, hQ : IsCompl C Q, w : V, hw : w ∈ Q ⊢ f w ∈ Q. Full diagnostic is atom1-probe-final.log in the same directory. An arbitrary linear complement does not supply operator invariance; no whole-atom coverage is asserted."
    reentry_condition: "Provide a proved invariant complement for the cyclic span of a maximal-nilpotency-height vector of a finite-dimensional complex nilpotent endomorphism, or an admitted Jordan-chain basis construction; use it to connect the existing Fitting restriction and abstract block profile to actual chains."
