    justification: "Retrieval preceded quarantine. D5 search (minimal action, path energy, absolutely continuous path, integral norm derivative, orthogonal projection residual, unique minimizing path) found canonical Hilbert-subspace projection owners such as OrthogonalProjectionComplement but no action functional, absolute-continuity energy bound, or uniqueness theorem. Pinned Mathlib search (.lake/packages/mathlib; AbsolutelyContinuousOnInterval, integral_deriv_eq_sub, Bochner derivative integral, L2 Holder/Jensen equality, ae_eq_const, projection distance) found vector-valued absolute continuity, projection identities, Holder/Jensen ingredients, and the scalar theorem AbsolutelyContinuousOnInterval.integral_deriv_eq_sub for f : Real -> Real; it found no vector-valued Bochner identity integral deriv gamma = gamma(1)-gamma(0) or equality-rigid theorem identifying constant Hilbert velocity from equality in the L2 energy bound. Third-party GitHub Lean code searches for the absolute-continuity derivative identity, minimal Hilbert action paths, Hilbert derivative norm integrals, and Physlib action/trajectory uniqueness found no exact theorem; only scalar Mathlib mirrors and unrelated smooth Euler-Lagrange infrastructure appeared. Local proof attempt: projection minimality supplies ||x-gamma(0)|| >= ||r||, and Holder/Jensen can supply a non-strict integral inequality after adding differentiability/integrability data, but the exact source carrier is every absolutely continuous Hilbert-valued path; replacing it by smooth paths or assuming a velocity reconstruction law would be an illegal special case or conclusion-bearing premise, and the unique-equality clause cannot be closed without the missing vector bridge."
    reentry_condition: "A sorry-free frozen D5 or admissible upstream theorem gives the Bochner fundamental theorem for Hilbert-valued AbsolutelyContinuousOnInterval paths and the equality case of the unit-interval L2 derivative-energy inequality, proving that equality forces an almost-everywhere constant velocity and hence the unique affine path."
