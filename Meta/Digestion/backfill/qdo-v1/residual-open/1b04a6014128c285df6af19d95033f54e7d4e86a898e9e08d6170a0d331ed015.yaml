  quarantine:
    justification: Retrieval preceded quarantine. D5 queries `Moore.?Penrose|pseudoinverse|pinv|Gram.*projection|projection.*Gram|optimal distance` found the canonical real `L2(0,infinity)` objects `FractionalReciprocalInnerProduct.positiveMeasure`, `unitIntervalIndicator`, and `fractionalReciprocal`, plus the generic projection/limit owner `NymanBeurlingTargetQuotientCriterion.hilbert_target_criteria`, but no Moore-Penrose inverse or whole projection-and-distance formula on the source's complex synthesis map. Pinned Mathlib queries with the same inverse names found `Submodule.starProjection` and ordinary `Matrix.inv`; `Mathlib/LinearAlgebra/Matrix/NonsingularInverse.lean` explicitly says matrix pseudoinverses are not considered. Installed non-Mathlib Lake packages had no matching owner. A17 GitHub Lean-code retrieval found the Apache-2.0 module `AIQ-Kitware/aiq-dkps-formalization:ForTauCeti/Analysis/InnerProductSpace/MoorePenroseInverse.lean`, but its HEAD `20461e477e1ae464d6abac1dade3188c29109b8c` uses Lean `v4.34.0-rc1`, Mathlib `72f9c607bb3a3e3a9fbe2a0513c7c79f998b9944`, and additional `Singular.System`/`RectangularSingularValues` staging, while this tree pins Lean `v4.33.0` and Mathlib `db584cd6d46c92f209a44c0f1c829460d327499d`. Local probe `/private/tmp/w73c13-atom2-probe.lean` exited 1 after elaborating the source objects and `starProjection`, with unknown constants for `Matrix.moorePenroseInverse`, `LinearMap.moorePenroseInverse`, and `Matrix.pinv`; ordinary inversion covers only the source's final conditional clause and cannot state the first two clauses.
    reentry_condition: Provide a frozen D5, pinned-Mathlib, or A17-admissibly ported Moore-Penrose inverse with its Penrose laws, together with the projection identity for the finite synthesis map on the exact complex Nyman-Beurling carrier and its Gram quadratic-form distance identity; then state the ordinary-inverse specialization as the third public clause.
    blocker_class: missing-prerequisite
