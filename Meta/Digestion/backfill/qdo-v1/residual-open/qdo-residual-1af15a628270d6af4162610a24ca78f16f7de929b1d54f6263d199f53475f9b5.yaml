  quarantine:
    justification: "Missing-prerequisite after whole-statement retrieval and the pass-1 counterexample audit. Exact D5 search for RecordCorrelationMonogamy|EnvironmentRecords|copyable|classicalLabel|jointRecord|observerContext found the matrix-level EnvironmentRecord, controlledRecordJointState, traceEnvironment, and record_correlation_monogamy owners, but no public/copyable/classical label predicate, abstract perfect-record-and-discard contract, four-orbit readout carrier, observer object, or quantum-context/joint-record-structure predicate connected to that record machinery. Expanded D5 search found ClassicalAddressRealism only for one fixed eighteen-projection configuration and IsPublic only for generic context-valuation gluing; neither models this atom's observer or record scenario. Pinned Mathlib search for copyable/classical/public labels, observer context or ontology, joint-record structure, perfect records, and discarded records returned no matching Lean declaration. Public GitHub Lean code searches for observerContext, classicalLabel copyable, and jointRecordStructure returned no result. The withdrawn theorem instead fixed copiedAddressRecord and proved its retained-coherence conjunct by unfolding controlledRecordJointState and copiedAddressRecord back to the input coherence hypothesis; retaining it would violate the universal-scenario and no-definitional-substitution gates. Introducing five arbitrary propositions or new predicates named after the source alternatives would only assume or rename the missing clauses."
    reentry_condition: "Add canonical D5 carriers that connect an arbitrary EnvironmentRecord to a proved perfect-record predicate and a discard operation; define and substantively characterize public, copyable, and classical label status plus the four-orbit nonzero exchange readout; and provide an observer carrier with independently grounded classical-object, quantum-context, and joint-record-structure predicates. Then prove the explicit five-way disjunction and the observer ontology conclusion from disjoint source premises, without selecting copiedAddressRecord, restating a conclusion as a premise, or discharging any credited conjunct by definition unfolding."
    blocker_class: missing-prerequisite
