  quarantine:
    justification: 'The required prerequisite zeta(sigma) != 0 for real 0 < sigma < 1, hence no ZeroData index is conjugation-fixed, already exists in the truth DAG ONLY as the frozen PRIVATE declaration GoldenAuxiliaryZetaNonzero.riemannZeta_ne_zero_of_real_pos (shard f7799b84aaefe784f7cc459d80a767eb847db29466d47fdc073999aab8ac15ea), which is non-importable. A lane re-proof was rejected twice as a FAMILY-SSOT fork (PR #4900; record: owner-level withdrawal). Missing-prerequisite after whole-statement retrieval and a local proof probe. The in-scope source defines C(s)=conj(s), R(s)=1-s, J(s)=1-conj(s), and the four-element Klein action; Proposition 1.1 makes a four-point orbit require both nonzero transverse displacement and nonzero ordinate, and explicitly says the classical real-axis case needs the separate theorem 0<sigma<1 implies zeta(sigma) is nonzero. D5 searches RiemannHypothesis|critical.line|mirror.index|zero.symmetr|stabilizer|free.orbit|orbit.card.four|real.zero found exact partial owners RhLocatesZeroData.zeroData_zero_on_critical_line_of_rh, ZeroSymmetryAction.mirror_index_fixed_iff_critical and all_nontrivial_zeros_critical_iff_mirror_indices_fixed, ZeroOrbitCardinality.zero_orbit_card_four_of_off_line, and the functional-equation/conjugation fields of ZeroData, but no theorem excluding a self-conjugate real zeta zero in the open critical strip. The frozen ZeroOrbitDegeneracy.zero_orbit_card_two_of_real theorem confirms that off-line plus self-conjugacy gives only two points. Pinned Mathlib searches riemannZeta_ne_zero|real.*zero|zero.*real found only riemannZeta_ne_zero_of_one_lt_re and riemannZeta_ne_zero_of_one_le_re, with no real-axis nonvanishing theorem for 0<Re(s)<1. A17 public GitHub Lean-code searches riemannZeta_ne_zero, riemannZeta_ne_zero_of_real, riemannZeta_neg, riemannZeta_real_Ioo, and zero_orbit_card_four found the same Mathlib half-plane facts and an AxiomMath private lemma only for negative real arguments in (-1,0), while exact searches in the zeta-lab, zeta-23-lean, and Lean-RH shallow clones found no positive open-strip real-axis theorem or four-point orbit result. Local probe /private/tmp/w73b16-atom3-probe.lean compiled the RiemannHypothesis-to-J-fixed clause from the frozen owners, applied the exact four-point owner to an off-line ZeroData index, and exited 1 solely at Z.conjugation(n) != n; that obligation is exactly the missing real-axis exclusion and cannot be added as a source premise.'
