    justification: "将 atom 657991a53e1acf31963b9fbef2d8ff6101e89575eebdf2149715c30f71e9dc17（CAS 标题：251. 与 Weil 负轨道测试的关系）作 multi-clause-guard：D5/S3/Weil/ZetaBridge/PrescribedPairNegativeOrbit.prescribed_pair_gives_negative_zero_orbit 在 Z : ZeroData、非实且离线的索引 n、g : WeilTestFunction 和 Fourier-Laplace 两值分别为 1、-1 的假设下，将指定四点有限和的实部算为 -4m；D5/S3/Weil/ZetaBridge/ConvolutionSquareOffLineOrbits.off_line_zero_orbit_sum_eq_four_mul_re 另给该和为实数的复嵌入，组合后才可读成复数贡献 -4m。D5/S3/Weil/ZetaBridge/PrescribedPairNegativeOrbit.real_off_line_zero_orbit_sum_re 的 hReal、hOff 分支等于 2m*normSq，借 D5/S3/Weil/ZeroSum.ZeroData.multiplicity_pos 得非负；D5/S3/Weil/ZetaBridge/PrescribedPairNegativeOrbit.prescribed_pair_impossible_for_real_zero 在 hReal 与同一赋值下结论 False，携带实轴反相位不可能。未携带的是末句所称 Casimir-Hausdorff 路线与 Weil separator 寻找频谱负方向的关系：这些类型没有 Casimir/Hausdorff 对象、表示映射或联系结论。scope 只及 D5/S3/Weil/TestFunctions.WeilTestFunction 的偶光滑紧支撑测试和 ZeroData 的经典 zeta 零点、正重数及对称结构，不能扩展至未指定的任意频谱函数空间；CAS 对测试空间的意指仍为 ASSUMED-UNVERIFIED。D5/S3/Weil/ZeroInfinitude/ExplicitFormulaObstruction.nonempty_zeroData 已证明 ZeroData 可居住，不能列作缺口；D5/S3/Weil/Separator/OffLineZeroNegativeWeilSquare.zeroData_im_ne_zero 排除实际实零点，实轴等式不是此类零点的存在断言。near misses 为 D5/S3/Weil/Separator/OffLineZeroNegativeWeilSquare.offLineZero_yields_negative_weil_square（给 hOff 下全局收敛负测试）、D5/S3/Weil/ZetaBridge/OffLineNonrealZeroNegativeWeilSquare.offLineNonrealZero_yields_negative_weil_square（另显式要求 hIm），二者已有真正的负方向存在结论但均无 Casimir-Hausdorff 联系；D5/S3/Weil/ZetaBridge/TwoDimensionalEvaluationNegativeDirection.two_dimensional_evaluation_has_negative_direction 要求二维评价像满秩且 m>0，只给 crossValue<0；D5/S3/Weil/ZetaBridge/ConvolutionSquareOrbitBounds.off_line_zero_orbit_sum_energy_bounds 只给正负能量界；D5/S3/Analytic/Adelic/PrimeObserverCasimirCompleteMonotonicity.prime_observer_casimir_complete_monotonicity 只给 sigma>1 的 split-prime Casimir 导数非负双和，论域及结论均不构成上述联系。本次按 D5/*.lean 的 digest 搜 Casimir、Hausdorff、negative direction/orbit，并交叉搜这些概念与 zeroSum、crossValue、fourierLaplace、convolutionSquare 的陈述形状，未定位到该联系；这是一项有范围的检索结果，非全仓语义不存在的证明。已覆盖同族 d3919ff03314455a6a43a2ffbfed64ea468544b18aca1514d87de6570e6f56d4 只含非实赋值贡献，缺本 atom 的实轴两句及路线关系，本 atom 不得复用那条覆盖；c6366e47d899024278096b87bf7337f415636885e7a7467ce70b89264993d04b 的账面实轴覆盖也不携带路线关系，且其单一 norm-square selector 不应被冒充为对同族全部文字的重新认证。本 CAS 止于 Weil separator 这一条 bullet，没有把相邻 source 的后续 Hausdorff bullet 加入义务。"
    reentry_condition: "再入有两条路径：一是先给最后一句确定对象级含义，明确 Casimir-Hausdorff 对象、Weil 测试空间、两者的表示或转移映射及其负性关系，再提供公开 content 定理，在原有非实/实轴分支及其真实函数域内同时涵盖 -4m、2m*normSq、反相位不可能和这条联系；全部额外前提必须由该 source 的适用域导出，不能把联系本身或评价满秩直接当作假设。预登记实际需要的新分析或构造命题作为 CLAUDE.md 5⁗ 逃逸见证，例如该具体表示映射保留所需二次型符号的非平凡证明，并在已 elaborate 的传递依赖闭包和删去死项后的活推导路径核验它确实不可由冻结事实的实例化、投影、合取或规范化替代，然后由 orchestrator 按全子句复核后 re-cover。二是由 orchestrator 将 source 拆成有精确测试域的轨道公式及不可能性部分，分别匹配上述冻结 selector，并把 Casimir-Hausdorff 联系单列；若最后一句只是研究路线说明，显式按散文处置，否则保留具名缺失映射的开放数学义务。不得为把既有三条结论合成一条而另造无逃逸内容的 deposit。"
