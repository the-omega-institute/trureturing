  quarantine:
    justification: "Whole-atom multi-clause guard after independent fidelity review of a rejected cover attempt. The source atom asserts three things: (1) deleting OR MODIFYING any finite set of Euler local factors leaves the classical nontrivial zeta zero set in the critical strip unchanged; (2) consequently, for a nontrivial zero rho there is no finite prime set whose removal makes that zero disappear; (3) the necessary local-address set PrimeSupport(rho) is therefore NOT a finite set. Carried: clause (1) restricted to canonical finite DELETION, and clause (2), are carried by frozen owner `D5/S3/Weil/PrimeAddress/PrimeAddress.finite_prime_modification_preserves_global_zero_set`, whose statement is expressed over `classicalZeta` and `finiteEulerProduct S`. Uncarried: (a) the widening from canonical finite deletion to arbitrary MODIFICATION of the local factors -- the owner's type carries no substitution-function parameter, so an arbitrary replacement of the local factors is outside its quantification; (b) the set semantics of PrimeSupport(rho) -- no frozen declaration defines that necessary-address set; (c) the bridging proposition from finite-deletion stability to INFINITUDE of that set. Source-vs-owner scope gap: the owner proves invariance of the zero set under a finite Euler product factor, which is a special case of `modification`; the source quantifies over modification generally and then draws a cardinality conclusion about a set it introduces but does not define formally. Near misses: `D5/S3/Zeros/PrimeRefinement/FinitePrimeExtractionZeroPersistence.finite_prime_extraction_preserves_zeta_zero` is strictly weaker (one-directional persistence, i.e. `zeta rho = 0 -> zeta rho * prod (1 - p^(-rho)) = 0`, which is `0 * x = 0` and states nothing about not introducing new zeros); `D5/S3/Zeros/PrimeRefinement/LocalNonzeroContinuationZero` treats the point -2 and finite windows, not the critical strip. Sibling precedent (corrected 2026-09-06 after independent review): the sibling atom `9f190f418889b1a457cb2b79c57434dfca62c864857002bf4f8d7581eeb1e94a` (section 197) is absorbed-closed with a coverage edge to the same owner `D5/S3/Weil/PrimeAddress/PrimeAddress.finite_prime_modification_preserves_global_zero_set`; that ledger state is a verified fact. VERIFIED TEXTUAL DIFFERENCE: section 118 additionally writes the MODIFICATION range (not only canonical deletion) and makes an explicit non-finiteness assertion about a NAMED set PrimeSupport(rho); section 197 writes neither. CORRECTION OF AN EARLIER OVERSTATEMENT IN THIS RECORD: an earlier revision of this justification said section 197 asserts only the deletion-range clauses, and that the difference is exactly (a)-(c). That was too strong. Section 197 does carry an infinite-support narrative of its own: its heading is `infinite prime support`, it concludes `cofinite-stable arithmetic support`, and it states that every zero depends on an infinite prime ledger (while explicitly declining to infer entanglement between zeros). ASSUMED-UNVERIFIED: whether section 197's infinite-ledger sentence is merely an informal restatement of finite-deletion stability -- which would make it carried by the same owner -- or an independent claim that the owner does not carry, has NOT been adjudicated here; the earlier revision silently assumed the former without evidence. What this record does assert is only the verified textual difference above, which is by itself sufficient to forbid reusing section 197's coverage edge for this atom: the owner's type has no substitution-function parameter and no named address set, so neither the modification range nor the PrimeSupport non-finiteness assertion can be carried by it."
    reentry_condition: "Provide a content theorem whose public statement (i) quantifies over an arbitrary modification of the finite set of Euler local factors, not only their canonical deletion, and (ii) formally defines the necessary local-address set PrimeSupport(rho) and proves it infinite for every nontrivial zero, with a genuine rule-5-quadruple-prime escape witness; then re-cover this atom. Alternatively, split the source into (1)+(2) restricted to deletion -- which the existing frozen owner already carries -- and a separate atom for the modification range and the PrimeSupport infinitude, then re-cover the applicable clauses."
    blocker_class: multi-clause-guard
