    justification: Pinned Mathlib 56a005855ea17e0b0958f73ec801ae140b0a1679, fwdDiff_iter_eq_sum_shift, gives the complete binomial finite-difference formula. Identify the source D=I-S with the negative of fwdDiff at step 1, using coe_fwdDiffₗ_pow and Even.neg_pow/Odd.neg_pow to normalize the sign. Function.iterate_succ_apply gives D^(k+1) a n = D^k a n - D^k a (n+1); expanding k=0,1,2 and ordered-ring subtraction gives exactly the displayed monotonicity tests. The Boolean-subset wording denotes the same binomial sum grouped by subset cardinality (Finset.sum_powersetCard). Whole-D5 public/private searches for fwdDiff, iterDifference, finite_difference, finiteDifference, binomial differences and Boolean Mobius inversion found specialized refutations and coefficient systems, not an applicable generic difference formula.
