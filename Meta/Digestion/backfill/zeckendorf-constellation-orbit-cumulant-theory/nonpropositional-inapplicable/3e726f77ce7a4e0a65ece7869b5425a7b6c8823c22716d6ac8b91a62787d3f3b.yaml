    justification: Section 589 interpreted with source clarification 635 is discharged by pinned Mathlib composition, with no reusable project GID. For every finite nonnegative Borel measure concentrated on [0,1] with infinite topological support and every natural N including zero, the moment Hankel matrix indexed by Fin (N+1) is strictly positive definite. ContinuousOn.integrableOn_compact and Measure.restrict_eq_self_of_ae_mem derive integrability; integral_eq_zero_iff_of_nonneg, Measure.support_subset_of_isClosed and Polynomial.finite_setOfPred_isRoot give strict positivity of each nonzero coefficient polynomial square; finite integral linearity and Matrix.PosDef.of_dotProduct_mulVec_pos give the exact matrix conclusion. Independent canonical compilation exited zero with only propext, Classical.choice and Quot.sound, and three independent reviews approved. This is bind-only upstream reuse under CLAUDE 3.2, not a new theorem freeze or an unrestricted real-line or innovation-positivity claim.
