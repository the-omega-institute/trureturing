  nonpropositional:
    justification: Pinned Mathlib 56a005855ea17e0b0958f73ec801ae140b0a1679 supplies finite symmetric differences and their toFinset conversion (Set.Finite.symmDiff, Set.Finite.toFinset_symmDiff). Apply Finset.card_sdiff_add_card_inter to the two finite differences A symmetric-difference B and B symmetric-difference C, and Finset.card_union_of_disjoint to their symmetric difference. Boolean normalization via symmDiff_assoc and symmDiff_self identifies this with A symmetric-difference C; reducing the resulting card equation in ZMod 2 cancels the doubled intersection (ZMod.natCast_self). This is the source finite-difference parity cocycle, with no absolute parity assigned to an infinite set. Whole-D5 public/private shape search covered relativeParity, symmetric-difference parity, cocycle and finite-edit parity; no frozen supplier of this card-parity law was found.
