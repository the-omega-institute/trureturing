    justification: 'Complete proposition50.3 settlement preparation: the full leaf is bind-only under definition50.1 and the direct pinned-library derivation of lemma50.2, using Mathlib db584cd6d46c92f209a44c0f1c829460d327499d. D5 search found no usable frozen project GID for the complete statement. proof_shape=bind-only; admission_basis=none; escape_witness=none. This is the current CLAUDE3.2 and spec11.21 upstream-only receipt route. Neither this receipt nor the preceding lemma50.2 receipt is a Lean theorem. Fix separately p=1/4 or p=1/3, r=1/4 and the probability measure P_p of definition50.1. All E_t and F_t are jointly independent measurable sign-valued random variables and independent of the initial hidden bit. Y_t=S_t E_t, S_(t+1)=S_t F_t and S_t^2=1 give Z_k=F_(2k-1)E_(2k-1)E_(2k) and C_k=(1+Z_k)/2=indicator(b_(2k-1)=b_(2k)), for k>=1. The initial sign cancels pointwise, so any initial hidden law satisfying the source noise-independence condition gives the same classifier law. With k=n+1, the tagged map (n,0)->(F,2n+1), (n,1)->(E,2n+1), (n,2)->(E,2n+2) is injective by tag separation, parity and cancellation. ProbabilityTheory.iIndepFun.precomp transfers mutual noise independence. ProbabilityTheory.iIndepFun.map_fun_eq_infinitePi_map, MeasureTheory.Measure.map_map and MeasureTheory.Measure.infinitePi_map_piCurry identify the grouped joint law as the product of block laws. The same map identity on each finite block and ProbabilityTheory.iIndepFun_iff_map_fun_eq_infinitePi_map give mutual independence of the block family; ProbabilityTheory.iIndepFun.comp gives independence of their product and affine readouts C_k. Measurability follows from measurable source coordinates, measurable_pi_iff and measurable multiplication, addition and division, not finite range alone. MeasureTheory.Measure.isProbabilityMeasure_map supplies probability instances for coordinate laws. Time-independent sign marginals follow from the source probabilities for +1 and MeasureTheory.measure_compl for -1. MeasureTheory.Measure.ext_of_singleton on the finite discrete sign type, MeasureTheory.Measure.map_apply, ProbabilityTheory.IdentDistrib.pi on Fin 3 and ProbabilityTheory.IdentDistrib.comp give identical block and C laws. Each C_k is pointwise 0 or 1, hence almost surely in [0,1]. MeasureTheory.Integrable.of_mem_Icc, Measurable.aestronglyMeasurable and bounded sign integrability discharge the integral hypotheses. ProbabilityTheory.iIndepFun.integral_fun_prod_eq_prod_integral on Fin 3 gives E[Z_k]=(1-2r)(1-2p)^2. MeasureTheory.integral_add, MeasureTheory.integral_const and MeasureTheory.integral_div give theta_p=[1+(1-2r)(1-2p)^2]/2. Exact normalization gives theta_A=9/16, theta_B=19/36, midpoint m=157/288 and both margins 5/288. For M>=1 use C_(n+1) over Finset.range M and c=sum C. The classifier selects A exactly when 288c>=157M, including equality, and B otherwise. Finset.sum_sub_distrib, Finset.sum_const and Finset.card_range identify the centered sums. Under A, error is c<M*157/288 and implies sum(theta_A-C)>M*5/288, a subset of the non-strict lower-deviation event. Under B, error is c>=M*157/288, exactly sum(C-theta_B)>=M*5/288. MeasureTheory.measureReal_mono transfers the A subset bound; all relevant measures are finite. ProbabilityTheory.hasSubgaussianMGF_of_mem_Icc applied to C_k in [0,1] gives HasSubgaussianMGF(C_k-theta_p,1/4,P_p). Applied to -C_k in [-1,0], with MeasureTheory.integral_neg, it gives HasSubgaussianMGF(theta_p-C_k,1/4,P_p). Each support width is one and ((norm_nn(width))/2)^2=1/4. The centered support intervals are [-theta_p,1-theta_p] and [theta_p-1,theta_p]; expectation zero follows from MeasureTheory.integral_sub and integrable_const. ProbabilityTheory.iIndepFun.comp with the measurable affine maps gives both signed independent families. ProbabilityTheory.HasSubgaussianMGF.measure_sum_range_ge_le_of_iIndepFun states P_p.real{omega | t<=sum X_i}<=Real.exp(-t^2/(2*M*cSG)). Apply it once to theta_A-C under A and once to C-theta_B under B, with cSG=(1/4:NNReal), n=M and t=(M:Real)*(5/288)>=0. All probability, measurability, bounds, means, centering and independence hypotheses are supplied above. M>=1 gives (M:Real)>0, so field normalization yields -t^2/(2*M*(1/4))=-2*M*(5/288)^2=-25*M/41472. Each fixed-model error is at most exp(-25*M/41472), with no union bound or factor two. For positive integers a,b with 0<delta=a/b<1, use their natural representatives. Positivity of b and field order give a<b. Rat.cast_div and Rat.cast_natCast preserve delta in Real; no coprimality is used. The set for L is nonempty with witness k=b, since Nat.lt_two_pow_self gives b<2^b and Nat.le_mul_of_pos_right gives 2^b<=2^b*a when a>0. Nat.find_spec and Nat.find_min supply the least qualifying L. At k=0 qualification would require b<=a; Nat.find_pos therefore gives L>=1. Write N=41472*L. Nat.ceilDiv_eq_add_pred_div gives N ceiling-divided by 25=(N+24)/25 in natural division. Nat.ceil_le, ceilDiv_le_iff_le_mul and eq_of_forall_ge_iff identify it with Nat.ceil((N:Real)/25), since both upper-bound predicates are N<=25*n after div_le_iff₀ and Nat.cast_le. Nat.floor_div_eq_div identifies (N+24)/25 with Nat.floor(((N+24):Real)/25). Both arguments are nonnegative; Int.natCast_ceil_eq_ceil and Int.natCast_floor_eq_floor recover the integer ceiling and floor. Thus M=ceil(41472*L/25)=floor((41472*L+24)/25). Nat.le_ceil gives 41472*L<=25*M; L>=1 implies M>=1. Nat.cast_mul, Nat.cast_add, Nat.cast_pow and Nat.cast_le preserve these identities and inequalities in Real. Real.exp_le_exp gives exp(-25*M/41472)<=exp(-(L:Real)). Real.add_one_le_exp at 1 gives 2<=exp(1). pow_le_pow_left₀, one_div_le_one_div_of_le with positive 2^L, Real.exp_nat_mul and Real.exp_neg give exp(-L)<=1/(2:Real)^L. Nat.find_spec gives b<=2^L*a, and div_le_div_iff₀ with positive real denominators (2:Real)^L and b gives 1/(2:Real)^L<=(a:Real)/b=delta. The notation 2^(-L) is the reciprocal, equivalently an integer exponent by zpow_neg and zpow_natCast, not natural truncated negation. This discharges the complete displayed bound chain. The additional logarithmic sufficient condition is discharged as well. If M>=(41472/25)*Real.log(1/delta), field order and Real.log_inv give -25*M/41472<=Real.log(delta). Real.exp_le_exp and Real.exp_log with delta>0 give exp(-25*M/41472)<=delta. The integer budget requires no logarithm evaluation. The M disjoint pairs use reports 2k-1 and 2k, exactly 2M reports. This is a conservative sufficient budget only, with no optimality, optimal identification-rate or sample-complexity claim. No mixture-IID assumption or independence of original report-pair vectors is used. Arbitrary-initial-law invariance concerns only the classifier; the prediction-task prior remains 1/2. This request settles only the complete proposition50.3 leaf, not its neighboring atoms.'
