  nonpropositional:
    justification: 'Complete lemma50.2, atom c780513249f875668e6b470366dd4615bdbd1493919e1ee8635af6d5b38ec250, is bind-only under the full definition50.1 noise model, with r=1/4 and each fixed p in {1/4,1/3}, for every probability law of the initial hidden bit independent of the noise. D5 search found no usable frozen GID covering this complete atom; closure uses pinned Mathlib db584cd6d46c92f209a44c0f1c829460d327499d. proof_shape=bind-only; admission_basis=none; escape_witness=none. For every k>=1, the defining Z_k=Y_(2k-1)Y_(2k), C_k=(1+Z_k)/2 and C_k=indicator(b_(2k-1)=b_(2k)) agree by the two bit values and sign arithmetic. Substitution of Y_t=S_t E_t and S_(t+1)=S_t F_t cancels S_(2k-1)^2=1 and gives Z_k=F_(2k-1)E_(2k-1)E_(2k), pointwise. This removes the initial hidden bit without assuming its law is fair or stationary; the actual prediction-task prior remains 1/2. Full mutual independence, not merely pairwise independence, follows as follows. Reindex k=n+1 and use the injective tagged-coordinate map (n,0)->(F,2n+1), (n,1)->(E,2n+1), (n,2)->(E,2n+2); tag separation, parity and cancellation discharge injectivity by normalization. ProbabilityTheory.iIndepFun.precomp transfers the source joint noise independence to these coordinates. ProbabilityTheory.iIndepFun.map_fun_eq_infinitePi_map, MeasureTheory.Measure.map_map and MeasureTheory.Measure.infinitePi_map_piCurry identify the grouped joint law as the product of the three-coordinate block laws. Applying the same map identity to each block and ProbabilityTheory.iIndepFun_iff_map_fun_eq_infinitePi_map gives independence of the entire block family. ProbabilityTheory.iIndepFun.comp then gives independence separately for Z and C. The noise coordinates are measurable sign-valued random variables of the source probability model; measurability is not inferred from finite range alone. All sign-tuple readouts are measurable by measurable_of_finite on the finite discrete sign domain, equivalently by measurable coordinate evaluation and real multiplication/addition/division. MeasureTheory.Measure.isProbabilityMeasure_map supplies the probability-measure hypotheses for coordinate laws. All expectations are of real-valued bounded measurable functions: Measurable.aestronglyMeasurable and MeasureTheory.Integrable.of_bound apply with bound 1 to E,F,Z,C and the constant one. Fin 3 is finite and countable, and the base measure is the stated probability measure. The marginal sign laws are time-independent: definition50.1 gives P(E_t=1)=1-p and P(F_t=1)=3/4; their other sign probabilities follow by MeasureTheory.measure_compl. MeasureTheory.Measure.ext_of_singleton on the two-point sign type identifies the marginal laws, with MeasureTheory.Measure.map_apply and ProbabilityTheory.IdentDistrib.comp transporting to real signs. ProbabilityTheory.IdentDistrib.pi applied to the independent Fin 3 coordinates, followed by ProbabilityTheory.IdentDistrib.comp for the product and affine readouts, proves identical distribution for all triples, all Z_k and all C_k. ProbabilityTheory.iIndepFun.integral_fun_prod_eq_prod_integral gives E[Z_k]=(1-2r)(1-2p)^2 from the source means E[F_t]=1/2=1-2r and E[E_t]=1-2p. Its AEStronglyMeasurable and Fintype hypotheses are discharged above. MeasureTheory.integral_add, MeasureTheory.integral_div and MeasureTheory.integral_const give theta_p=[1+(1-2r)(1-2p)^2]/2. Exact rational normalization gives theta_A=9/16, theta_B=19/36, theta_A-theta_B=5/144, m_*=(theta_A+theta_B)/2=157/288 and both margins theta_A-m_*=m_*-theta_B=5/288. The final source qualifications are retained: only the matching indicators and the noise-product signs are asserted IID; the original report-pair vectors are not licensed as independent by this argument. At the declared fair initial law even Y_2 and Y_3 have zero means and E[Y_2 Y_3]=(1-2p)^2/2>0, so independence of the first two raw report pairs would contradict ProbabilityTheory.IndepFun.comp and ProbabilityTheory.IndepFun.integral_fun_mul_eq_mul_integral. This supporting instance uses the same independent-product expectation and sign normalization, not a universal nonindependence assertion. Overlapping adjacent-pair products share E_(t+1), so the disjoint-coordinate hypothesis fails; no universal dependence claim is substituted for that caveat. Randomizing and marginalizing the global parameter is outside the fixed-model assertion. The stated possibility of correlation is witnessed by the equal mixture of the two fixed-model laws of any two distinct C coordinates: their mixed product mean minus the product of mixed means is (theta_A-theta_B)^2/4=25/82944>0. MeasureTheory.integral_add_measure and MeasureTheory.integral_smul_measure, bounded integrability, the fixed-model independence already obtained and ProbabilityTheory.IndepFun.integral_fun_mul_eq_mul_integral reduce this calculation to rational arithmetic. A degenerate parameter law is not claimed dependent. This request settles only the complete leaf lemma50.2; no parent or lemma50.3 conclusion is claimed.'
