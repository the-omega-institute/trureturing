    justification: "Complete Proposition 48.2, including all six statement clauses and its proof, is Mathlib-only binding under CLAUDE 3.2 and spec 11.21 (#8049): proof_shape: bind-only; admission_basis: none; escape_witness: none. Repository searches for the recurrence, rational bounds, fixed-model zero words and posterior/filtering carriers found no usable frozen project GID for the complete atom; no project GID is asserted or added.\n\nPinned Mathlib db584cd6d46c92f209a44c0f1c829460d327499d supplies Set.MapsTo.iterate, Function.Semiconj.iterate_right, Nat.succ_iterate, strictMono_nat_of_lt_succ, StrictMono.monotone, div_lt_iff₀, div_lt_div_iff₀, div_pos, add_pos and mul_pos. Their joint binding is as follows. Put M_p(a,b)=((3/4)pa+(1/4)(1-p)b,(1/4)pa+(3/4)(1-p)b), with fixed p and initial pair (1/2,1/2). The mass recurrence is definitionally a semiconjugacy with Nat.succ; Function.Semiconj.iterate_right and Nat.succ_iterate identify every length with M_p iterated n times. For p=1/3, the cone a>0,b>0,5b<9a is preserved by arithmetic: 9(Mv)_0-5(Mv)_1=(9a-5b)/5+a/30>0. Its initial membership and Set.MapsTo.iterate give the all-length cone. Positive division and normalization yield q_n<9/14 and b_n=1/3+q_n/3<23/42.\n\nFor p=1/4, write D(v)=(Mv)_1 v_0-v_1(Mv)_0. Polynomial normalization gives D(Mv)=(3/32)D(v), D(1/2,1/2)=1/16, and preservation of positive coordinates. Set.MapsTo.iterate on a>0,b>0,D(v)>0 gives the all-length determinant inequality. div_lt_div_iff₀ and strictMono_nat_of_lt_succ give strict posterior growth. Exact arithmetic gives q_1=5/8, q_2=2/3, q_3=19/28, a_3=33/56 and the initial strict increase. StrictMono.monotone at 3<=n gives a_n>=33/56; together with b_n<23/42 and (33/56-23/42)/2=1/48 this gives the uniform strict half-gap for every n>=3.\n\nThe source recurrence is also discharged, not assumed: for every 0<p<1, arithmetic normalization of M_p gives q'=F_p(q), q=b/(a+b), F_p(q)=1/4+(1/2)(1-p)q/(p+(1-2p)q). Set.MapsTo.iterate on the synchronized mass/scalar graph, with the same semiconjugacy lemmas, proves positive masses and equality to the source scalar recurrence at every length. The total mass and emission denominator are positive and 0<q_n<1. On [0,1], normalization gives F_(1/3)(q)=1/4+q/(1+q) and F_(1/4)(q)=1/4+3q/(2+4q); div_lt_div_iff₀ reduces their strict monotonicity to positive denominator cross-products. Arithmetic checks F_(1/3)(9/14)=59/92<9/14 and q_0=1/2<9/14. These facts check the source barrier-preservation and successive-growth implications, while upstream iteration provides their universal propagation. Standard Nat and Real carriers and both parameter ranges are inhabited, including n=3. No statement or proof clause is omitted and no universal invariant is assumed. This settlement concerns only Proposition 48.2; it does not settle Proposition 48.3 or section 50."
