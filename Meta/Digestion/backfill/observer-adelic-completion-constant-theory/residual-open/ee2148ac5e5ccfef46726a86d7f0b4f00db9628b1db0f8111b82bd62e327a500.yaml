  quarantine:
    justification: Retrieval preceded quarantine. The source context defines `psi(n) = lambda_(|n|)` with `psi(0) = 0`, derives the forward direction from the earlier displayed zero-phase expansion, and invokes Li's criterion for the reverse direction. D5 queries `conditional.*negative|negative.*definite|Li.*criterion|Li.*coefficient|RiemannHypothesis`, `lambda.*natAbs|natAbs.*lambda|sum.*conj`, and the zero-phase representation found no exact conditional-negative-definiteness owner and no canonical standard Li coefficient sequence tied to `riemannZeta`. The nearest theorem `LiCurvatureCriterion.li_curvature_criterion` takes an abstract `liCoefficient`, Li's criterion, and the RH Fourier representation as hypotheses; its module explicitly records that canonical connecting owners are absent. `LiCurvatureFourierRepresentation.li_curvature_fourier_representation` constructs curvature data from an arbitrary probability measure and does not identify it with the standard Li coefficients under RH. Pinned Mathlib queries `conditional negative|conditionally negative|negative definite|Li criterion|Li coefficient|Keiper.*Li|RiemannHypothesis` found only the definition of `RiemannHypothesis` and no Li sequence, Li criterion, conditional-negative kernel, or zero-phase expansion. The installed non-Mathlib Lake packages returned no matching declaration. Exact GitHub Lean-code queries for `"Li criterion" RiemannHypothesis` and `"conditionally negative definite"` each returned zero results; one broader Li query found `open_problems/CertificateEquivalence.lean`, which declares both `RiemannHypothesis` and `li_theorem` as axioms and is not admissible. The focused local probe `/private/tmp/W73a26Atom3Probe.lean` compiled with exit 0 and proves the complete two-point converse using coefficients `1,-1`, confirming that the finite algebra is available; the forward application cannot be instantiated without the canonical analytic bridges, and the lease forbids replacing the source's earlier displayed expansion by a hypothesis.
    reentry_condition: Provide a frozen D5, pinned Mathlib, or A17-admissible canonical standard Li coefficient sequence constructed from `riemannZeta`, a theorem identifying RH with nonnegativity of that sequence, and an RH theorem giving the convergent multiplicity-weighted zero-phase expansion with enough summability to exchange it with every finite complex quadratic form.
    blocker_class: missing-prerequisite
