  quarantine:
    justification: 'The whole theorem requires the canonical completed-zeta Li coefficient sequence and its multiplicity-aware standard symmetric-zero expansion before the second-difference algebra can be applied. Retrieval receipts: D5 searches `Li coefficient|liCoefficient|Li.*zero|zero.*Li|lambda_n|curvature|second.*difference|omega.*rho` found the canonical `xiReading`, the first-coefficient owner `FirstLiCoefficientNormalization`, the actual zero carrier `Zeta23.zetaZeroConfig`, multiplicity and zero-sum infrastructure in `ZeroSummability` and `ZeroSumLimit`, and downstream `LaguerreLiBridge`, `LiCurvatureFourierRepresentation`, and `FixedDepthLiClarkRecovery`, but no definition of all Li coefficients from `xiReading` and no theorem equating them to the required symmetric zero sums. Pinned Mathlib search `Li coefficient|Li coefficients|Li criterion|Keiper|lambda_n` found no relevant declaration. A17 ecosystem checks found no Li-coefficient declaration in local non-Mathlib packages; GitHub repository search `Li coefficients Lean theorem prover` returned total_count 0, and Loogle query `Li coefficient` returned unknown identifier; the vendored Zeta23 corpus supplies the actual zeros and absolutely convergent test-function sums, not the conditionally symmetric Li expansion. Local probe `/private/tmp/w73a21-atom2-probe.lean` compiled the claimed pointwise mode-amplitude algebra on `Zeta23.IsNontrivialZero` with exit 0, but the full theorem cannot be assembled without the canonical Li-to-symmetric-zero bridge; taking an arbitrary sequence plus that bridge as a premise would substitute an abstract proxy for the source object and restate the needed content.'
    reentry_condition: Provide a frozen theorem constructing every completed-zeta Li coefficient from `xiReading` and identifying it, with multiplicity, with the standard symmetric cutoff over `Zeta23.zetaZeroConfig`; then transport finite-cutoff second differences through that limit and expose the mode and amplitude identifications publicly.
    blocker_class: missing-prerequisite
