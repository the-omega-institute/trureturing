  quarantine:
    justification: "Retrieval preceded quarantine. The in-scope source defines the Weil Hermitian form `Q_W(psi)=<W_xi,psi*psi_tilde>`, states immediately beforehand the full Weil criterion `RH iff Q_W(psi)>=0 for every compact smooth psi`, and derives the support cutoff `n<=exp(2L)` from the prime-Archimedean source identity. D5 name/body-shape queries `RiemannHypothesis|off.?line.*negative|negative.*off.?line|Weil.*nonnegative|finite.*prime.*certificate|compact.*negative`, `Weil.*positive|Weil.*criterion|nonnegative.*zeroSum|negative.*zeroSum`, and the same searches on fresh `origin/dev` found substantial exact partial carriers but no whole owner: `FinitePaleyWienerInterpolation.finite_exact_paley_wiener_interpolation` constructs compact smooth Hermitian tests with prescribed finite Fourier-Laplace values; `TwoDimensionalEvaluationNegativeDirection.two_dimensional_evaluation_has_negative_direction` produces a negative cross value only from an assumed full-rank evaluation map; `ConvolutionSquareOffLineOrbits` and `ConvolutionSquareOrbitBounds` identify and bound off-line orbit contributions; `PrimeJumpDecomposition.activePrimePowers` and `prime_jump_decomposition` construct the finite cutoff at `floor(exp(2L))`; `FixedScaleWeilQuadraticForm.fixed_scale_weil_quadratic_form` identifies the canonical zero-side form. No theorem proves the decisive bridge from `not RiemannHypothesis` (or an off-line zeta zero) to full-rank Paley-Wiener evaluation and a negative globally convergent canonical Weil form. Pinned Mathlib queries `RiemannHypothesis|Weil.*criter|criter.*Weil|Weil.*posit|off.?line.*negative|negative.*off.?line|Paley.?Wiener` found only the definition `Mathlib/NumberTheory/LSeries/RiemannZeta.lean:182:RiemannHypothesis`, with no Weil criterion, zero enumeration/multiplicity bridge, or negative witness theorem. Third-party GitHub code queries `\"Weil criterion\" language:Lean`, `\"RiemannHypothesis\" \"Weil\" language:Lean`, and `\"Paley-Wiener\" \"RiemannHypothesis\" language:Lean` returned HTTP 401 requiring authentication; wait-for-capability is recorded, while the locally available immutable `anthropics/zeta-23-lean` port under `D5/S3/Weil/ZetaCore` contains the explicit-formula carriers but no Weil positivity criterion or off-line-to-negative-witness result. Durable local probe `/private/tmp/w72b14-weil-probe.lean` elaborated the four partial D5 declarations, then exited 1 with unknown identifiers for `RiemannHypothesis_iff_weilQuadraticForm_nonnegative`, `not_riemannHypothesis_implies_negative_weil_witness`, `off_line_zero_evaluation_full_rank`, and `finite_prime_power_countercertificate`. Assuming nonnegative-definiteness equivalence or the negative witness would place the atom's primary conclusion among its premises; the minimal-support-radius, function-complexity, and prime-cutoff bullets are explicitly described as unknown quantities rather than additional theorem values."
    reentry_condition: "Provide a theorem on the canonical `RiemannHypothesis`, `ZeroData`, `WeilTestFunction`, `zeroSum`, and convergence carriers proving that an off-critical-line zeta zero yields a compact smooth test with strictly negative Weil convolution-square form, including the full-rank finite Paley-Wiener evaluation and global orbit/convergence control; then combine it with the frozen finite prime-jump cutoff theorem."
    blocker_class: missing-prerequisite
