  quarantine:
    justification: "The RH and right-half-plane nonvanishing rows have partial frozen support through `InteriorCurvatureCriterion.interior_curvature_criterion`, `GlobalLogarithmicGaugeCriterion.global_logarithmic_gauge_criterion`, `CountableRationalFluxCriterion.countable_rational_flux_criterion`, and `CompactifiedSquaredDistanceSupport.compactified_squared_distance_support_criterion`, but those owners use atomic measures, analytic logarithms, rational-rectangle zero counts, or compactified distances; none constructs the source's explicit positive-energy eigenline bundle for `H_xi`, its Berry connection and curvature, its first Chern class, or flux over closed surfaces, so rows 3-7 cannot be stated on the source carrier. Retrieval receipts: D5 searches `Berry|Chern|monopole|degeneracy|closed surface|eigenvalue crossing|two-level Hamiltonian|Pauli` and `Chern|Berry|monopole|line bundle|first Chern|Bott suspension|clutched` found the listed analytic partial owners and generic matrix facts but missed the required topology and whole equivalence. Pinned Mathlib searches with the same terms found unrelated simplicial degeneracy and Chernoff strings and no Berry/Chern carrier. A17 GitHub Lean-code searches for `Berry curvature` and `Berry monopole` returned no hits; `Chern number` returned generic or informal declarations and no reusable two-level eigenbundle theorem. Local probe `atom2-partial-probe.lean` exited 0 for the three available analytic owners, while `atom2-missing-probe.lean` exited 1 with unknown identifiers for Berry connection, Berry curvature, complex line bundle, first Chern class, and Chern flux. The exact missing bridge is a source-carrier theorem identifying each centered-xi zero of multiplicity m with a degeneracy of the explicit Hamiltonian whose positive-energy eigenline has Chern flux m, together with the closed-surface zero-flux criterion on the open half-space."
    reentry_condition: Add frozen Berry-eigenbundle and first-Chern infrastructure for the explicit centered-xi two-level Hamiltonian, prove zero multiplicity equals its local Chern flux, and prove that every closed surface in the right open half-space has zero flux exactly when that half-space contains no degeneracy.
    blocker_class: missing-prerequisite
