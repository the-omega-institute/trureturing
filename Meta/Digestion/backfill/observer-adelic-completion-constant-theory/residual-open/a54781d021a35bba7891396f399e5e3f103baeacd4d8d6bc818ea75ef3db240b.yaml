    justification: "Whole-statement retrieval found partial analytic owners but no owner for all five equivalences and the off-line-zero consequence. D5 searches `Riemann hypothesis|critical line|centeredXi|right.*zero|Berry.*Chern|Chern.*flux|monopole|degener` found `GlobalLogarithmicGaugeCriterion.global_logarithmic_gauge_criterion` for the canonical critical-line/right-half-plane analytic criterion, `InteriorCurvatureCriterion.interior_curvature_criterion` for a Riesz atomic curvature-measure criterion, and `CountableRationalFluxCriterion.countable_rational_flux_criterion` for rational rectangle argument-principle flux; none constructs the source two-level Hamiltonian eigenbundle, Berry connection/curvature, first Chern class, closed-surface Chern flux, or the public off-line-zero-to-monopole point map. Pinned Mathlib searches `two.?level.*hamilton|eigenbundle|berry.?connection|berry.?curvature|first.?chern|chern.?number|closed.?surface.*flux` found generic topological and smooth vector-bundle infrastructure but no Chern class/number, Berry geometry, or two-level Hamiltonian theorem. Reachable GitHub Lean code searches `chernClass`, `Chern class`, `Berry curvature`, `Berry connection`, and `Chern number` returned only an unrelated integer toy definition, proposition flags/comments, and algebraic-geometry curve-class vocabulary; no exact theorem or A17 port candidate was found. Local probe `/private/tmp/w72c28-rh-monopole-probe.lean` successfully checks all three D5 partial owners and Mathlib `VectorBundle`, then exits 1 with `lean.unknownIdentifier` for `twoLevelHamiltonianEigenbundle`, `berryConnection`, `berryCurvature`, `firstChernClass`, `chernNumber`, and `closedSurfaceChernFlux`. Defining monopoles or flux to be the xi zero set would make clauses (4)-(5) true by definitional substitution and is forbidden, while adding their equivalence as hypotheses would restate the atom."
    reentry_condition: "Provide a frozen D5, pinned Mathlib, or A17-admissible construction of the canonical centered-xi two-level Hermitian Hamiltonian, its positive-energy eigenline bundle and Berry curvature, and a theorem identifying isolated degeneracy multiplicity with first Chern flux on enclosing closed surfaces, including the off-line zero at 1/2+delta+i*gamma mapping publicly to the parameter point (delta,gamma,0)."
    blocker_class: missing-prerequisite
