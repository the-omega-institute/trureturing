  quarantine:
    justification: Retrieval preceded quarantine. The in-scope construction makes the sampled de Branges matrix a nonsingular diagonal congruence of the negative upper-half-plane Cauchy Gram matrix, so the whole theorem requires strict positive definiteness of H_ij=1/(2*pi*I*(conj(z_i)-z_j)) for every injective finite family with positive imaginary parts. D5 searches `negative square|negative index|off-line zero|uncancel|K_omega|Theta_omega`, `def .*Kernel|deBranges|shifted.*Kernel|E_omega|shiftedWeyl`, `Cauchy.*Gram|PosDef.*Cauchy|negIndex.*card`, and `off_line.*negative|negative.*off_line` found the canonical HermitianKernel, HasNegativeSquares, negIndex, and literal one-point xi certificates, but no finite Cauchy-Gram positivity theorem or multiple-zero inertia owner. Pinned Mathlib searches `CauchyMatrix|cauchy.*PosDef|one_div.*sub.*PosDef`, `Cauchy.*det`, `linearIndependent.*exp`, `PosDef.*principal|Sylvester.*criterion`, and `Vandermonde|posDef_gram` found generic Gram positivity, geometric series, and Vandermonde nonsingularity, but no Hardy/Szego Cauchy-kernel positivity, Cauchy determinant, or exponential-family independence theorem. A17 GitHub Lean code searches `Cauchy matrix PosDef` and `upper half plane Cauchy Gram` returned only unrelated results; LeanSearch returned HTTP 404 and Loogle returned no identifier. Local probe `/private/tmp/w73c4-atom1-probe.lean` imported and elaborated the canonical D5/Mathlib partial owners, then exited 1 on the missing `upperHalfPlaneCauchyGram_posDef`; a Cayley/Vandermonde reduction reaches the same absent Szego-tail positive-semidefiniteness lemma. Assuming that positivity would assume the atom's central implication, and defining the xi kernel by the target factorization would be definitional substitution.
    reentry_condition: Freeze a theorem proving strict positive definiteness of the finite upper-half-plane Cauchy Gram matrix for arbitrary distinct points, or an equivalent Hardy/Szego kernel theorem with the Vandermonde strictness bridge, then combine it with the existing xiReading one-point primitives and negIndex on the literal shifted de Branges kernel.
    blocker_class: missing-prerequisite
