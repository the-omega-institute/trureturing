  quarantine:
    justification: "Retrieval preceded quarantine. D5 searches `toroidal|quadratic.*twist|DirichletCharacter|pointwiseNonvanishing|analyticOrderAt.*iInf` found the algebraic skeleton `ToroidalDivisorGcd.toroidal_divisor_gcd` and related common-zero and finite-window theorems, but each replaces the source family of quadratic fields by an arbitrary index type and arbitrary analytic twist and assumes pointwise nonvanishing; the lease requires the actual source carrier and retrieval of the cited nonvanishing result rather than assuming it. Pinned Mathlib searches found canonical Dirichlet-character `LFunction` and `completedLFunction` APIs and nonvanishing only on the closed half-plane `re s >= 1`, but no family of quadratic characters with the theorem that for every spectral point some completed quadratic twist is nonzero, nor the toroidal-period factorization on that carrier. Public GitHub Lean searches for `quadratic twist` returned field-theory and elliptic-curve material, `analyticOrderAt DirichletCharacter` returned one unrelated Hadamard file, and `nonvanishing DirichletCharacter` returned Mathlib mirrors and unrelated files, with no exact Cornelissen-Lorscheid bridge. Local probe `/private/tmp/w73b22-atom3-probe.lean` elaborated the frozen generic theorem and exited 1 with unknown identifiers for `quadraticToroidalPeriod` and `quadraticTwistPointwiseNonvanishing`; binding the generic owner would leave the source carrier and cited prerequisite unproved."
    reentry_condition: "Freeze canonical completed quadratic Dirichlet twists indexed by the source quadratic fields, their toroidal-period factorization with the completed zeta function, global differentiability on the stated regular domain, and the pointwise existence of a nonzero quadratic twist; then apply analytic-order additivity to that actual family."
    blocker_class: missing-prerequisite
