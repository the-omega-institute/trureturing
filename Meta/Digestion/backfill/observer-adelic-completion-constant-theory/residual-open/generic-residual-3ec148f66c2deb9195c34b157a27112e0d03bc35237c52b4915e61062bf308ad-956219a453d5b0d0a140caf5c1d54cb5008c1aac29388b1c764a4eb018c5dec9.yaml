    justification: "Retrieval preceded quarantine. D5 name/body-shape queries `RiemannHypothesis|Stieltjes|Hankel.*positive|moment.*operator|operator.*moment|positive.*moment|spectral.*measure|inner.*pow` found partial owners only: `ToroidalTemperednessCriterion.rh_iff_all_toroidal_eisenstein_tempered` gives a different RH equivalence, `TruncatedCircleMomentBridge.truncated_circle_moment_of_posSemidef` realizes only finitely many circle moments, and the spectral-measure families do not connect the source inverse-square moment sequence to nontrivial zeta-zero location; no D5 theorem derives RH from the required positive self-adjoint moment realization. Pinned Mathlib queries `Hankel|hankel`, `Stieltjes moment|moment sequence|positive self-adjoint`, and `RiemannHypothesis.*moment|moment.*RiemannHypothesis` found the unproved `RiemannHypothesis` proposition, Stieltjes measures for monotone right-continuous functions, and continuous functional calculus, but no Stieltjes moment-sequence representation criterion or source-specific RH bridge. The spec A17 third-party route is `wait-for-capability` because public-source, immutable-revision, and license-compatibility admission predicates remain open. The local proof decomposition can construct operator moments from an already supplied representation and can reuse the abstract toroidal RH equivalence, but stops at the absent theorem that a positive operator realization of the Taylor coefficients of the source Stieltjes transform excludes every off-critical-line zeta zero; assuming the parent criterion would make the proof a prohibited definitional restatement."
