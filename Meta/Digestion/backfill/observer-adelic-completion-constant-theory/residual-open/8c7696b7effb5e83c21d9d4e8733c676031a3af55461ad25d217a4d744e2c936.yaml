  quarantine:
    justification: 'Retrieval preceded quarantine. The source context at `docs/develop/theory/OBSERVER_ADELIC_COMPLETION_CONSTANT_THEORY.md:28532` canonically defines `lambda_n` by the derivatives of `s^(n-1) log xi(s)` at one, and lines 29531-29607 require RH equivalence with positive definiteness of `exp (-t lambda_|n|)` for every nonnegative `t`, followed by the unique circle probability-measure family with the stated Fourier coefficients and convolution law. D5 name/body-shape searches `Li coefficient|liCoefficient|Schoenberg|conditionally negative|PositiveDefinite|convolution semigroup` found `D5/S3/Weil/TestFunctions/LiCurvatureCriterion.li_curvature_criterion`, but its public signature assumes an abstract `liCoefficient`, the Li criterion, the RH Fourier representation, and a circle Herglotz representation; its docstring explicitly records the missing canonical owners. `LiCurvatureFourierRepresentation.li_curvature_fourier_representation` constructs a measure only from a supplied probability measure on the ordinate carrier, and `FirstLiCoefficientNormalization` treats only the first coefficient. No canonical full Li sequence, Schoenberg equivalence on the integer kernel, or circle probability-semigroup owner was found. Pinned Mathlib searches `Schoenberg|conditionally negative|PositiveDefinite.*sequence|Bochner.*theorem|Herglotz.*representation` found generic matrix positivity, group-measure convolution, AddCircle Fourier analysis, and the analytic Herglotz-Riesz kernel, but no required Schoenberg or circle Bochner representation theorem. Searches of installed non-Mathlib Lake packages found no matching declaration. Reachable GitHub Lean-code searches `Schoenberg RiemannHypothesis`, `Li coefficient RiemannHypothesis`, and `conditionally negative definite` each exited 0 with `[]`. The substantive local probe `/private/tmp/w73e18-atom3-probe.lean` constructs the source derivative-defined coefficient from `CompletedZeta.xiReading`, defines finite-list positive definiteness on integer indices, and proves by the two-point coefficient vector `(1,-1)` that positivity of every exponential sequence forces every coefficient nonnegative; after the dependency build exited 0, the final probe exited 1 solely at the exact unsolved goal `⊢ RiemannHypothesis ↔ ∀ (n : ℕ), 1 ≤ n → 0 ≤ canonicalLiCoefficient n`.'
    reentry_condition: Freeze the Li criterion for the derivative-defined coefficients of `CompletedZeta.xiReading`; add a Schoenberg theorem relating conditional negative definiteness on the integer difference kernel to positive definiteness of all its positive-time exponentials; and add the circle Bochner/Herglotz existence and uniqueness theorem, Fourier transform of measure convolution, and Fourier-determines-measure result needed to construct the unique probability convolution semigroup.
    blocker_class: missing-prerequisite
