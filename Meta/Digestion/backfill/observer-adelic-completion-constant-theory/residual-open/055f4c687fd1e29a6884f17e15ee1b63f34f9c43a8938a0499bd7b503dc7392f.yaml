  quarantine:
    justification: "The named theorem states the one-factor real-line logarithmic Blaschke integral identity unconditionally and then derives the finite-product attenuation sum. The frozen D5/S3/Weil/Scattering/VerticalAttenuation.vertical_attenuation_tomography is not an exact whole-atom owner: its public `hone` binder assumes the one-factor identity, while `hA` and `hdecomp` assume the attenuation normalization and finite decomposition, so binding it would fail the conditional-vs-unconditional and unfold-then-assumption checks. Retrieval receipts: D5 search `VerticalAttenuation|Blaschke|integral.*log|log.*integral|min y (realPart i)` found that conditional owner and disk Blaschke analytic/bound machinery in ZetaPntBase/StrongPNTPrefix, but no upper-half-plane factor with the source real-line integral theorem. Pinned Mathlib searches `Blaschke|integral.*Real.log|integral_log|log.*integral|log.*sq` found CanonicalDecomposition, Jensen/circle-average identities, elementary interval log integrals, and generic improper-integral machinery, but no integral of the required log-quadratic ratio. A17 GitHub Lean code search `Blaschke integral log language:Lean` returned AxiomMath/PrimeNumberTheoremAnd@2667e414 and roos-j/lean-spherical@58001c89; inspection found disk Blaschke bounds and strip interpolation only, not the source identity. Local probe `/private/tmp/w73e1-atom1-probe.lean` instantiated the standard upper-half-plane factor and exited 1 with the exact normalized real-line logarithmic integral still unsolved. The missing prerequisite is a source-faithful theorem proving that one-factor identity from the concrete factor definition; assuming it would restate clause 1279.1 and make the deposit hollow."
    reentry_condition: "Provide a frozen source-faithful upper-half-plane Blaschke-factor definition and a theorem proving its normalized real-line logarithmic integral equals `min y h` for positive height parameters, then import the existing VerticalAttenuation owner to derive the finite multiplicity sum without assuming any named theorem clause."
    blocker_class: missing-prerequisite
