    justification: "Retrieval preceded quarantine. D5 searches `Budget|resolvent|Stieltjes|iteratedDeriv|measure.*determines|measure.*inject` found the private derivative identity `CayleyMomentTransport.iteratedDeriv_resolvent_budget`, the public downstream jet `CayleyMomentTransport.chebyshev_stieltjes_jet`, and `OneScaleInformationalCompleteness.one_scale_informational_completeness`, but no public theorem stating the complete-monotonicity identity together with recovery of the named even spectral measure from its full budget curve. Pinned Mathlib search `resolventTransform|Stieltjes|Cauchy transform|Measure.ext|injective` found `MeasureTheory.hasDerivAt_resolventTransform` and `MeasureTheory.analyticOn_resolventTransform`, but no Stieltjes inversion or resolvent-transform measure-identification theorem. Public GitHub Lean searches for `Stieltjes inversion` returned one unrelated spectral-support mention and `resolventTransform injective` returned no result, so no A17-ready exact owner was found. Local probe `/private/tmp/w73b22-atom1-probe.lean` imported the strongest D5 and Mathlib owners, elaborated the transform and derivative theorem, and exited 1 with `Unknown identifier MeasureTheory.ext_of_resolventTransform_eq`; the local reduction reaches the derivative subclause but stops at the source recovery clause."
    reentry_condition: "Freeze a public theorem for the source budget on an even positive spectral measure, including the signed iterated-derivative integral and nonnegativity, plus a Stieltjes-inversion or injectivity theorem recovering that same measure from equality of the full positive-scale curve."
