    justification: "Whole-clause guard after retrieval: the frozen parent `ToroidalJetDepth.toroidal_jet_depth_eq_vanishing_order` publicly covers the boxed depth equality, while `Nat.sInf_mem` and Mathlib analytic-order lemmas supply derivative-tower constituents, but it does not state the atom's interpretive comparison `完全同型` or the golden clause `黄金分歧 jet 记录两个 Galois 共轭值在模 5 后的碰撞阶`. D5 searches `nilpotent.{0,40}jet|jet.{0,40}nilpotent|coll.*depth|collision.*order|ramified.*jet|galois.*mod` and path searches for `Jet|Ramif|Collision|Golden|Toroid` found `JetResolventSemisimplification`, `Conj`, `GoldenDiscriminant`, `RamifiedFiveBoundarySelection`, and `RamifiedFiveDissection`, but no canonical golden collision-depth object and no typed map or equivalence to the toroidal derivative tower. Pinned Mathlib searches `analyticOrderAt_eq_nat_iff_iteratedDeriv_eq_zero|natCast_le_analyticOrderAt_iff_iteratedDeriv_eq_zero|toroidal|nilpotent.{0,30}jet|collision depth|ramified jet` found the exact generic analytic-order lemmas and no golden/toroidal comparison. Reachable GitHub Lean code searches `nilpotent jet`, `collision depth`, `toroidal derivative`, and `ramified jet` returned no results; `analyticOrderNatAt` returned only mathlib and mirrors, so there is no A17 port candidate. Local probe `/private/tmp/w72b21-active-probe.lean` checks all available constituents, then fails with `lean.unknownIdentifier` for the absent canonical-owner placeholders `GoldenCollisionDepth` and `GoldenToroidalJetEquiv` (exit 1). The unfold-then-assumption probe therefore reaches the analytic conjuncts but cannot even form a public falsifiable proposition for `完全同型` without inventing source semantics, which the definitional-substitution ban forbids."
    reentry_condition: "Provide a canonical exact-carrier definition of golden conjugate collision depth at the ramified prime above five and a typed, falsifiable map or equivalence relating that collision jet to the toroidal derivative tower asserted as `完全同型`."
