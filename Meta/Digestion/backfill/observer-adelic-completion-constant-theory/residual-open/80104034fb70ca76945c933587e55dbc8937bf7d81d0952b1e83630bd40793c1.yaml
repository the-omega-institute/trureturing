    justification: "Retrieval preceded quarantine. The source context at `docs/develop/theory/OBSERVER_ADELIC_COMPLETION_CONSTANT_THEORY.md:42870` requires a negative quadratic-form witness for the canonical completed-xi Weil distribution on the full smooth compact-support carrier and then the finite prime-power cutoff. D5 name/body-shape searches `RiemannHypothesis.*exists|not RiemannHypothesis|activePrimePowers|prime_jump_decomposition|prime_term_eq_active_sum` found the public cutoff owner `D5/S3/Weil/ZetaBridge/PrimeJumpDecomposition.prime_jump_decomposition`, whose `activePrimePowers L` is filtered through `floor (exp (2 * L))`, and the conditional negative owner `D5/S3/Weil/ZetaBridge/OffLineNonrealZeroNegativeWeilSquare.offLineNonrealZero_yields_negative_weil_square`; no theorem derives the canonical distributional witness from `not RiemannHypothesis`. The only real-axis support is the private declaration at `D5/S3/Analytic/Isolation/GoldenAuxiliaryZetaNonzero.lean:349`; the durable record for atom `2316d356` records rejected duplicate reproofs in PR `#4900` and routes its public visibility repair to issue `#4934`. Pinned Mathlib searches `RiemannHypothesis|Weil|prime.*power|compact.*support` found the standard RH proposition, generic smooth compact-support and convolution infrastructure, and generic prime-power sum tools, but no negative Weil certificate or completed-xi finite-certificate theorem. Reachable GitHub Lean-code searches for negative Weil certificates and finite-prime RH certificates both exited 0 with `[]`. The substantive local probe `/private/tmp/w73e18-atom2-probe.lean` proves after a supplied nonreal off-line zero that compactness gives `tsupport g subset Icc (-L) L`, the frozen separator gives a negative full zero sum, and `prime_jump_decomposition` gives the finite arithmetic expression; the final probe exited 1 solely at the exact unsolved goal `⊢ rho.im ≠ 0` for a zeta zero with `1 / 2 < rho.re` and `rho.re < 1`."
