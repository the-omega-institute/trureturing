  quarantine:
    justification: "Retrieval preceded quarantine. D5 searches `Fredholm|riemannXi|completedRiemann|traceClass|positiveFredholmProduct`, `xiReading|completedRiemannZeta.*det|xi.*Fredholm`, and `positiveFredholmProduct|Fredholm determinant|xiReading.*tprod` found the canonical completed-xi reading and the real spectral product owner `D5/S3/Weil/Fredholm/PositiveFredholmProduct`, but no theorem equating xi with a zero product or countable operator determinant; that owner expressly excludes the countable trace-class determinant layer. Pinned Mathlib searches `Fredholm determinant|fredholmDet|trace class operator|trace-class|Riemann xi|riemannXi|completedRiemannZeta|Hadamard product` found completed-zeta definitions, functional equations, finite matrix determinants, and Fredholm index theory, but no trace-class determinant or normalized xi canonical-product identity. The relevant third-party tree `anthropics/zeta-23-lean` at pinned commit `3635e74826a4c1fcece7d1cd2b6fa75e43a00510` was cloned and searched for `Fredholm determinant|fredholmDet|trace class operator|trace-class|Hadamard product|canonical product|xi.*product|product.*xi`; it contains xi, zero-summability, and logarithmic-derivative results, but its XiPrime route expressly avoids a Hadamard product and supplies no product or operator-determinant declaration. The local proof reduces the Mobius algebra to two absent bridges: a normalized canonical-product theorem for the canonical xi reading over its nontrivial zeros under RH, and a countable trace-class determinant theorem identifying that product with the canonically constructed diagonal contraction; the existing real positive product proves neither bridge."
    reentry_condition: "Freeze a normalized canonical-product theorem for the repository's canonical xi reading over the multiplicity-weighted nontrivial-zero configuration under RH, together with a countable trace-class determinant API and a theorem identifying the product with the determinant of the diagonal contraction constructed from the positive ordinates; then derive the Mobius substitution on the source-faithful z domain."
    blocker_class: missing-prerequisite
