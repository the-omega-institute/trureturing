    justification: Retrieval preceded quarantine. The source context constructs the canonical completed-zeta squared image, inverse-square nodes, multiplicities, genus-zero product, centered moments, full Hankel tower, compactly supported Hamburger measure, and the Stieltjes pole/residue recovery; all are required public clauses. D5 queries `Hamburger|Hankel|self.?weight|moment theorem|moment sequence|Stieltjes|resolvent`, `genus.?zero|canonical product|inverse.?square|centered.*moment|log.*jet`, and completed-zeta carrier names found `xiReading`, `Zeta23.IsNontrivialZero`, `zeroMult`, `completedRiemannZeta_eq_zero_iff`, finite Hankel/control results, and other RH criteria, but no canonical xi genus-zero moment identity, Hamburger reconstruction theorem, or Stieltjes pole/residue uniqueness owner. Pinned Mathlib filesystem queries `Hamburger|moment problem|moment sequence|representing measure|compact.*support.*moment` found only forward moments-of-a-measure facts and Riesz-Markov representation from an already-constructed positive functional; real LeanSearch/Loogle queries returned only `Matrix.PosSemidef`, RealRMK primitives, generic meromorphic types, and unrelated Stieltjes-function facts. Installed non-Mathlib package searches for the same terms returned no hit, and a reachable GitHub Lean-code query for `Hamburger moment` exited 0 with no results. Local probe `/private/tmp/w73d5-hamburger-local-attempt.lean` stated the exact exponential-growth plus all-Hankel-PSD reconstruction goal; `exact?` exited 1 with no proof. Building the RealRMK input would itself require the absent positive-polynomial-functional extension, while adding any of these bridges as premises would restate the source proof obligations and would not cover the atom.
    reentry_condition: Provide frozen canonical completed-zeta squared-image and inverse-square moment identities, a compact-support Hamburger reconstruction theorem from exponential growth plus all finite Hankel positive semidefiniteness, and a meromorphic Stieltjes-transform uniqueness theorem forcing every canonical pole real with atomic residue equal to multiplicity times node; then expose the iff, strict positivity, representing measure, residue sign, positive nodes, and critical-line conclusion in one public theorem.
    blocker_class: missing-prerequisite
