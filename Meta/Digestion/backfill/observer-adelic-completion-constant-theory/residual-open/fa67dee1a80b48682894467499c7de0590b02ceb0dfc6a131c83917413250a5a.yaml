  quarantine:
    justification: "Multi-clause guard after whole-statement retrieval and a successful scalar counterexample. D5 searches for non-cloning|Schur phase|ordered transfer|holonomy|Verblunsky|prediction error|Haar floor|completion volume|modulus.*inject found Haar-floor optimization modules and unrelated observer holonomy modules, but no OPUC/Verblunsky coefficient-to-measure correspondence, CMV operator, Szego ordered transfer product, or theorem showing completion volume, prediction error, and Haar-floor data are jointly preserved while the full observer spectral measure changes. OneStepSchurGain concerns Hilbert-space innovation and is not a Schur-parameter carrier. Pinned Mathlib searches for Verblunsky|CMV|Szego|orthogonal polynomials on the unit circle|Toeplitz determinant|prediction error returned no applicable hit; only unrelated Schur lemmas/products occur. Third-party GitHub repository searches for Verblunsky Lean and CMV operator Lean returned total_count 0, and code searches for Verblunsky, CMV with Szego, and Toeplitz determinant with prediction error all returned total_count 0. The local Lean probe `/private/tmp/w72e13-atom967-quotient.lean` exit 0 explicitly constructs the constant sequences alpha_n=1/2 and beta_n=-1/2 in the open unit disk, proves equal pointwise moduli, and proves the sequences differ, establishing that the modulus quotient is not injective. A second probe found unknown identifiers for VerblunskyCorrespondence, CMVOperator, SzegoTransferMatrix, and a combined determinant/prediction/Haar-floor theorem. That scalar result covers only the final quotient clause; it cannot cover the public spectral-data clause. In addition, the atom's separate boxed clause 'Schur phase + ordered transfer product + holonomy' states where observer distinction lies but supplies no in-scope predicate for that phrase, and the ordered transfer matrix is only defined in the following chapter 968; inventing such a predicate would violate the qualitative-clause and definitional-substitution rules."
    reentry_condition: "Define or import a canonical OPUC family with the Verblunsky bijection from open-unit-disk sequences to nontrivial circle probability measures, CMV/Szego ordered transfer products and a precise holonomy observable, and prove that explicit phase-distinct sequences induce different measures while their completion-volume, prediction-error, and Haar-floor data agree; also replace the qualitative boxed 'distinction lies in' phrase with a precise public predicate or an exact mathematical equality."
    blocker_class: multi-clause-guard
