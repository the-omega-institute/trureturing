  quarantine:
    justification: Missing-prerequisite after whole-statement retrieval and a local proof probe. The source defines L_xi as the logarithmic derivative of the canonical entire xi reading, defines its Nevanlinna response on Re(s),Re(t)>1/2, and under RiemannHypothesis requires the cross-point identity with the complete multiplicity-weighted zero-resolvent sum plus its Hilbert Gram realization. D5 searches Nevanlinna|zero.?resolvent|logDeriv.*zero|partial.?fraction.*xi|Gram.*kernel found exact partial owners CompletedZeta.xiReading, RhLocatesZeroData.zeroData_zero_on_critical_line_of_rh, CayleyNevanlinnaKernelEquivalence.cayley_nevanlinna_kernel_identity and cayley_nevanlinna_kernel_posSemidef_iff, PositivityChartCollapse.positivity_chart_collapse, and finite local partial fractions in ZetaExplicit/Landau.lean, but no global partial-fraction identity for logDeriv xiReading and no cross-point zero-resolvent feature theorem. Pinned Mathlib searches RiemannHypothesis|Hadamard|canonical product|logDeriv.*zero|partial.?fraction.*xi|Nevanlinna|resolvent.*Gram found the RiemannHypothesis definition, generic logarithmic derivatives and infinite-product differentiation, and abstract Gram positivity, but no completed-xi zero product or zero-sum formula. A17 public GitHub repository searches Nevanlinna kernel language:Lean, Hadamard product xi language:Lean, and logarithmic derivative zeta zeros language:Lean returned zero repositories; exact searches in shallow clones of zeta-lab, zeta-23-lean, and Lean-RH found zeta-23-lean's re_logDeriv_xi_eq_tsum, which proves only a one-point real-part sum and not the two-variable cross-point identity or Gram feature, and the candidate pins Lean v4.33.0-rc2 plus Mathlib 51e6992 rather than this tree's v4.33.0 plus db584cd6, so A17 dependency form is incompatible. Local probe /private/tmp/w73b16-atom2-probe.lean imported and elaborated all D5 partial owners, used RiemannHypothesis to place every ZeroData zero on Re=1/2, and exited 1 solely with the required cross-point xi logarithmic-response equality unsolved; assuming that equality would restate the atom's principal clause.
    reentry_condition: Provide a frozen D5 or A17-admissible global partial-fraction theorem for logDeriv xiReading that, on the right half-plane and under RiemannHypothesis, gives the complete multiplicity-weighted cross-point zero-resolvent sum with absolute or canonical symmetric convergence; then construct the corresponding square-summable feature vectors and identify their inner product publicly.
    blocker_class: missing-prerequisite
