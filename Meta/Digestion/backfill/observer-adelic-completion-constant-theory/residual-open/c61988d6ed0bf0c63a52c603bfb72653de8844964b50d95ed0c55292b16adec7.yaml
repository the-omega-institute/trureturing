  quarantine:
    justification: Retrieval preceded quarantine. D5 name/body-shape queries `Riemann.*Schwarz|Schwarz.*Riemann|Li.*Schwarz|log.*derivative.*Riemann|arithmetic.*Schur|Schur.*criterion`, exact Cayley quotient shapes, and `xiReading.*prod|Hadamard.*xi|hRH.*logDeriv` found the canonical `CompletedZeta.xiReading`, `FirstLiCoefficientNormalization.first_li_coefficient_normalization`, generic `ShiftedHerglotzCriterion.shifted_herglotz_criterion`, and `CompactifiedSquaredDistanceSupport.compactified_squared_distance_support_criterion`, but no theorem proving positive-real completed-xi logarithmic derivative from `RiemannHypothesis`; `RiemannPoissonDensity.riemann_poisson_density` instead assumes the RH-to-Poisson expansion. Pinned Mathlib searches `Schwarz|RiemannHypothesis|completedRiemannZeta|logDeriv|Hadamard|Caratheodory|Herglotz` found the generic Schwarz lemma, standard RH and completed-zeta definitions, regularity, functional equation, and logarithmic-derivative algebra, but no RH-to-positive-real or completed-xi canonical-product theorem. Resolved non-Mathlib Lake packages had no relevant declaration. Reachable A17 repository searches returned `TristenHarr/RiemannHypothesis` (Apache-2.0, Lean/Mathlib v4.31.0-rc1), whose anti-Herglotz results concern generic finite residue clouds while its reduction main theorem and hypotheses files are declaration-free migration stubs; GitHub code search returned HTTP 401 and is recorded as wait-for-capability. Local probe `W73a16Atom3Probe.lean` stated the exact canonical equivalence using `logDeriv xiReading`, `lambdaOne := Lxi 1`, the half-plane binder, denominator nonvanishing, and the norm inequality; after its dependency built, `lake env lean` exited 1 because `exact?` closed neither implication. The missing prerequisite is the completed-xi positive-real or canonical-product bridge that turns RH into the arithmetic Schur self-map on the source half-plane carrier.
    reentry_condition: D5, pinned Mathlib, or an A17-admissible sorry-free port supplies the completed-xi theorem deriving positive real part of `logDeriv xiReading` on `Re s > 1/2` from the standard `RiemannHypothesis`, with holomorphy and denominator nonvanishing sufficient to apply the canonical Cayley transform and Schwarz lemma; the converse must remain on the same source carrier.
    blocker_class: missing-prerequisite
