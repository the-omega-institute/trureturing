  quarantine:
    justification: "Missing-prerequisite after whole-statement retrieval and local availability probes. D5 searches for trace.?class|Fredholm determinant|FredholmDeterminant|RiemannHypothesis|completed.*zeta|unit disc|cayley found completed-zeta, RH, Cayley, and compact-spectrum primitives but no trace-class operator or Fredholm determinant theorem; D5/S3/Quantum/CountableSlices/SinglePrimeThermalState.lean explicitly records that no countable trace-class operator API was found. Pinned Mathlib searches for trace.?class|nuclear operator|Fredholm determinant|FredholmDeterminant|determinant.*compact found only an unrelated Gaussian TODO and elaborator trace classes; Analysis/Normed/Operator/Compact/FredholmAlternative.lean supplies compact-operator spectral theory but no trace-class determinant, while RiemannHypothesis, completedRiemannZeta_one_sub, and Complex.UnitDisc are present. Third-party GitHub repository searches for quoted Fredholm determinant Lean theorem prover and quoted trace class Lean4 returned total_count 0; the broader Fredholm Lean search found only EllipticPDE, whose description concerns elliptic-equation compactness, and authenticated code searches for FredholmDeterminant and TraceClassOperator in language:Lean both returned total_count 0. The local Lean probe compiled RiemannHypothesis, UnitDisc, xi_reading_reflection, IsCompactOperator, and compact-operator eigenvalue/spectrum primitives, while a second probe failed with unknown identifiers TraceClassOperator and FredholmDeterminant. Without the missing carrier and determinant API, the public existence/equality clause and its spectral-factor zero-free consequence cannot be stated on the source carrier; assuming a determinant equality would restate the core criterion."
    reentry_condition: "Provide a frozen D5, pinned Mathlib, or A17-admissible countable Hilbert-space trace-class operator and Fredholm determinant API, including positivity/contraction spectra, determinant product and zero-locus theorems, plus a theorem realizing the canonical xi Cayley transform as that determinant; then combine it with the existing completed-zeta reflection and unit-disc primitives."
