  quarantine:
    justification: 'Retrieval preceded quarantine. D5 queries `trace.?class|fredholm determinant|exterior power|Polya.?frequency|PF.?infinity|total.?nonnegative|Stieltjes moment|shifted.?Hankel|negative.*minor|Newton ident` found only partial owners: `OneObserverTotalPositivityCriterion.one_observer_total_positivity_criterion` takes the analytic PF-infinity and all-minor bridges as hypotheses, `PositiveFredholmProduct.positive_fredholm_completion` explicitly omits the countable operator and determinant layers, `PositiveFredholmLimitZeros.positive_fredholm_limit_zeros` concerns compact-uniform limits of finite determinants, and `FiniteStieltjesOperatorRealization.finite_stieltjes_operator_realization` is finite-dimensional. No D5 theorem constructs the source reciprocal-zero Hilbert-space operator from `RiemannHypothesis`, relates its exterior and power traces by Newton identities, or proves both negative-minor certificates on that carrier. Pinned Mathlib queries `trace.?class|fredholm|Polya.?frequency|PF.?infinity|total.?nonnegative|Stieltjes moment|shifted.?Hankel|Newton.?identit` found Fredholm operators in the unrelated finite-kernel/cokernel sense and polynomial Newton identities, but no trace-class operator, Fredholm determinant, total-nonnegative matrix predicate, or Stieltjes equivalence. Installed non-Mathlib Lake packages had no owner. A17 GitHub Lean-code queries found no Polya-frequency or Stieltjes-moment development; Apache-2.0 `PerAlexandersson/RealRooted` HEAD `963c2f46394eaabe974a44658fed861304ccb137` defines `Matrix.IsTotallyNonneg` but supplies none of the RH, Hankel, operator, or determinant bridges, while `motanova84/Riemann-adelic` HEAD `73cac012392873118b8d9ea9bf0cc7aca47171d8` defines an abstract trace-class predicate but leaves core results as `sorry` or axioms and directly assumes its determinant identity. Local probe `/private/tmp/w73c13-atom3-probe.lean` exited 1 after elaborating all four partial D5 owners, with unknown constants for the required trace-class, Fredholm-determinant, and total-nonnegative interfaces. The source also supplies no formal comparison carrier or witness for the clause that the earliest Toeplitz and Hankel negative-minor orders need not agree.'
    reentry_condition: Provide frozen D5 or A17-admissible countable positive trace-class operator and Fredholm-determinant APIs, construct the source reciprocal-zero operator from `RiemannHypothesis`, prove the Toeplitz PF-infinity and paired Stieltjes-Hankel equivalences plus the exterior-power, power-trace, Newton, moment, and resolvent commuting square, derive both finite negative-minor certificates, and give a source-compatible public witness showing distinct earliest Toeplitz and Hankel negative-minor orders.
    blocker_class: missing-prerequisite
