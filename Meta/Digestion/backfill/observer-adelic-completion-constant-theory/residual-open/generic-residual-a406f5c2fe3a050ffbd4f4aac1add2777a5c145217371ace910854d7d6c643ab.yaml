  quarantine:
    justification: "Retrieval preceded quarantine. The source scope fixes `a=1/2`, defines the natural budget `C_Xi=2 lambda_1` and white-floor profile `Lambda_L^Xi`, makes theorem 498.3 conditional on the preceding RH-equivalent feasibility conditions, and requires three public conclusions for every optimizer choice along `L_n` increasing to infinity: tempered-distribution convergence `nu_n -> nu_Xi`, disappearance of `(Lambda_{L_n}^Xi/(2*pi)) dxi`, and convergence of the defined residual `mu_n` to the same atomic spectrum. D5/fresh-origin queries `natural.?budget|optimizer.*conver|arbitrary optimizer|white continuum|atomic spectrum|tempered.*converg|residual.*converg|nuXi`, `zeroCountingMeasure|naturalBudget|whiteFloor|optimizer|resolventBudget`, and body-shape searches around measure-valued optimizer limits found no whole owner. Exact partial carriers are `RiemannPoissonDensity.zeroCountingMeasure`, the abstract hypothesis-parametric `AtomicMomentHierarchyConvergence.atomic_moment_hierarchy_converges` (frontier values only), and `GroundStateZeroLocalization.ground_state_zero_localization`, whose vague convergence to the zero-counting measure is itself a premise. `ResolventFrontierGeometry` accepts abstract `localMatches`, `resolventBudget`, and `whiteFloor`; it does not construct the natural-budget optimizer family. No D5 theorem proves natural white-floor collapse, weighted compactness for every optimizer sequence, uniqueness of every subsequential distributional limit, or residual subtraction convergence. Pinned Mathlib queries `toTemperedDistribution|Measure.*Tempered|Tempered.*Measure`, `tendsto.*TemperedDistribution|TemperedDistribution.*tendsto|weak.*Tempered`, and locally-finite/vague measure convergence found the exact partial embedding `MeasureTheory.Measure.toTemperedDistribution` for a measure carrying `Measure.HasTemperateGrowth` and weak convergence APIs only for finite measures, but no convergence theorem for these locally finite optimizer measures and no temperate-growth instance for D5's `zeroCountingMeasure`. Third-party GitHub code queries `\"natural-budget\" language:Lean`, `\"TemperedDistribution\" \"RiemannHypothesis\" language:Lean`, and `\"zeroCountingMeasure\" language:Lean` returned HTTP 401 requiring authentication, so broader ecosystem search is `wait-for-capability`; the locally available immutable Zeta23 port under `D5/S3/Weil/ZetaCore` has neither optimizer nor tempered-limit carriers. Durable probe `/private/tmp/w72b14-optimizer-probe.lean` elaborated the D5 frontier/localization theorems and Mathlib measure embedding, then exited 1 on missing natural-budget optimizer/floor/collapse/residual/convergence identifiers and on failure to synthesize `Measure.HasTemperateGrowth (zeroCountingMeasure Z)`. Introducing abstract convergence or uniqueness binders would simply assume the atom's convergence clauses and violate the conclusion-in-hypotheses rule."
    reentry_condition: "Construct the canonical natural-budget feasible-set, white-floor, optimizer, and residual objects on `Measure Real`; prove under the source's RH-equivalent feasibility scope that every optimizer family has uniform temperate growth, that the natural white floor tends to zero, and that every subsequential tempered-distribution limit is uniquely `zeroCountingMeasure`, yielding whole-sequence and residual convergence."
    blocker_class: missing-prerequisite
