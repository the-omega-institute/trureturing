  quarantine:
    justification: "Missing-prerequisite after whole-statement and cited-proof audit. D5 searches for natural budget|budget.*RH|weighted compactness|global positive spectrum|lambda.?1|Weil.*positive found abstract budget geometry, AtomicMomentHierarchyConvergence, CaratheodoryScaleCovariance.resolventBudget, zeroCountingMeasure parameterized by supplied ZeroData, and finite Gram positivity, but no canonical natural Li coefficient, actual Riemann zero-counting measure, exact resolvent identity R_(1/2)(nu_Xi)=2*lambda_1, cross-window positive-measure completion theorem, or Weil-positivity iff RH owner. Nearby HyperbolicBudgetTube takes naturalBudget as a premise, and FixedDepthLiClarkRecovery takes liCoefficient as an arbitrary function. Pinned Mathlib searches for Li coefficient|lambda.?1|Riemann zero measure found no canonical Li or zero-spectrum declarations; Prokhorov.lean supplies compactness for finite measures under mass/tightness hypotheses, but no theorem assembling these canonical local constraints or deriving RH. Third-party GitHub repository search for quoted Weil criterion Lean Riemann hypothesis returned total_count 0; code searches for RiemannHypothesis with PositiveDefinite, zeroCountingMeasure, Li coefficient, or Prokhorov all returned total_count 0. The local probe compiled RiemannHypothesis, abstract hierarchy convergence, resolventBudget, zeroCountingMeasure, and Prokhorov compactness, while canonical names for naturalLiCoefficientOne, canonicalRiemannZeroCountingMeasure, naturalBudgetRiemannCriterion, and weilPositivity_iff_riemannHypothesis were unknown. Source-proof audit also found that theorem 498.1 invokes theorem 492.1 for a cross-window sequence L_n tending to infinity, whereas the stated theorem 492.1 only gives optimizer attainment for one fixed L,a,C; it does not supply the asserted diagonal global measure. Supplying the missing canonical budget identity, diagonal compactness, and Weil criterion as premises would restate both load-bearing directions."
    reentry_condition: "Provide frozen D5, pinned Mathlib, or A17-admissible canonical definitions and theorems for the first Li coefficient and actual Riemann zero measure, its exact natural resolvent budget, a diagonal weighted-compactness theorem turning uniformly budgeted completions on all expanding windows into one global positive spectral measure with inverse Fourier transform W_xi, and a carrier-faithful Weil positivity iff RH theorem; then repair the source proof's incorrect reliance on fixed-window theorem 492.1."
    blocker_class: missing-prerequisite
