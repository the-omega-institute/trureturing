  quarantine:
    justification: "Retrieval preceded quarantine. D5 searches `Fredholm|traceClass|trace_class|trace class|quasi-free|positive contraction|Polya|RiemannHypothesis|Q_t` found only partial owners: `D5/S3/Weil/Fredholm/PositiveFredholmProduct.positive_fredholm_completion` proves scalar square-folded product convergence and explicitly records that the RH, zero-density, trace-class-operator, and Fredholm-determinant layers are absent, while `D5/S3/Zeros/NormalJetFormula.normal_jet_formula` constructs the actual completed-xi intensity jets but no entire square-folded Q_t, canonical product, trace-class operator, determinant, or RH equivalence. Pinned Mathlib searches `fredholmDet|fredholm_det|detFredholm|Fredholm determinant|IsTraceClass|Schatten` found no mathematical trace-class or Fredholm-determinant API; `ContinuousLinearMap.IsFredholm` is the unrelated finite-kernel/cokernel predicate, and `NumberTheory/LSeries/RiemannZeta.lean` defines `RiemannHypothesis` but contains no Xi Hadamard product or determinant criterion. Installed non-Mathlib package searches over Cli, LeanSearchClient, Qq, aesop, batteries, importGraph, plausible, and proofwidgets for the same symbols plus `RiemannHypothesis|completedRiemannZeta.*det` returned no hits; dependency-form ecosystem retrieval is additionally unavailable under spec A17 because its public-source, immutable-revision, and license predicates remain open. Local probe `/private/tmp/w73a4-active-capability-probe.lean` exited 1: `ContinuousLinearMap.IsFredholm` and finite `Matrix.det` elaborated, but `ContinuousLinearMap.IsTraceClass`, `ContinuousLinearMap.fredholmDet`, and `fredholmDet` were unknown, so the source's positive trace-class contraction and entire Fredholm identity cannot even be stated on the required carrier without inventing the missing API; replacing them by the scalar product would omit public clauses."
    reentry_condition: Provide frozen D5 or A17-admissible declarations for countable positive trace-class operators and their entire Fredholm determinant, the canonical completed-xi square-folded function Q_t with its RH-conditional zero product and reciprocal-square summability, the resolvent construction K = u A_t (I + u A_t)^-1 with positivity and contraction proofs, and the converse zero-location bridge from the determinant identity through Q_t to all Xi zeros real; then expose the equivalence and spectral-process clause publicly for arbitrary source binders t and u.
    blocker_class: missing-prerequisite
