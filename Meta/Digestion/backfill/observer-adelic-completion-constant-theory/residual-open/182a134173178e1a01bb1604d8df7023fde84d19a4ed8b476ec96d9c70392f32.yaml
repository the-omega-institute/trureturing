    justification: "Retrieval preceded quarantine. D5 name/body-shape queries `normalJet|normalIntensity|normal_jet|normal.?jet.*criterion`, `RiemannHypothesis.*iff|iff.*RiemannHypothesis`, and `Hadamard|canonicalProduct|entire.*real.*zero` found the canonical `D5/S3/Zeros/NormalJetFormula.normalIntensity`, `normalJet`, and `normal_jet_formula`, but no theorem connecting their all-order nonnegativity to `RiemannHypothesis`; the statement-identical older atom `f8a0de690602ccec72d3964c954ba5e2aee8f57b77788a053d2aa1bfeaeba635` is itself residual-open with no receipt. Pinned Mathlib searches `laguerre.*inequal|extended.*laguerre|real.*zeros|zeros.*real`, `Laguerre|Polya`, and `Hadamard|canonicalProduct|entire.*zero` found no extended Laguerre inequality or real-entire-zero criterion. Resolved non-Mathlib Lake packages had no relevant declaration. Reachable A17 GitHub Lean searches `LaguerrePolya`, `extended Laguerre`, and `RiemannHypothesis normalJet` found only `TristenHarr/thegoldenalgebra/GoldenAlgebra/ScratchDeBranges.lean`; its `LaguerrePolyaGenus0` stores `realZeros` as a field and `RH_of_Xi_in_LaguerrePolya` merely projects that field, so it is hollow for this bridge, and the repository declares no license while pinning Lean v4.31.0-rc1 and Mathlib `2e770eae1b63e150c37c72b02528d91ecb97bff7`, unlike this lane's Lean v4.33.0 and Mathlib `db584cd6d46c92f209a44c0f1c829460d327499d`. Local probe `/private/tmp/w73e3-atom1-probe.lean` stated the exact canonical equivalence and exited 1 because `exact?` closed neither direction. The missing prerequisite is a sorry-free extended Laguerre theorem for the actual completed-xi `normalJet`, including both RH-to-nonnegativity via the canonical product and the converse real-zero criterion."
    reentry_condition: "D5, pinned Mathlib, or an A17-admissible sorry-free port supplies an extended Laguerre criterion specialized to `NormalJetFormula.normalJet` and the standard `RiemannHypothesis`, proving both directions without carrying either conclusion as an assumption or structure field."
