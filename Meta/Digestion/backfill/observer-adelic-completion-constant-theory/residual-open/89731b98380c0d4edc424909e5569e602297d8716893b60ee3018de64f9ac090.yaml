  quarantine:
    justification: Retrieval preceded quarantine. D5 name and body-shape searches `singular.*Toeplitz|Toeplitz.*singular|Vandermonde decomposition|finite.atomic residual|atomic.*unique|rank.*Toeplitz|moment.*unique` found no whole owner. Exact partial owners are `TruncatedCircleMomentBridge.truncated_circle_moment_of_posSemidef`, which gives existence of a finite circle measure but neither uniqueness nor rank-exact support, `ExactTruncatedHaarFloor.exact_truncated_haar_floor` for the unweighted maximal Haar floor, `RationalToeplitzCollapse.rational_toeplitz_collapse` for the common-denominator Gram congruence, `FiniteVandermondeTomography` for coefficient uniqueness only after distinct nodes are supplied, and `ToeplitzFlatFloorMultiplicity` for a forward finite-atom Gram calculation. Pinned Mathlib searches `singular.*toeplitz|toeplitz.*(vandermonde|atomic|measure)|carath.odory.*(toeplitz|moment)|trigonometric.*moment|rank.*atomic` found no Caratheodory-Fejer moment decomposition; `Mathlib/LinearAlgebra/Vandermonde.lean` supplies determinant and fixed-node independence facts only. Searches of the installed non-Mathlib Lake packages for `singular.*toeplitz|toeplitz.*vandermonde|trigonometric.*moment|carath.odory.*moment` found no hit; A17 admission is `wait-for-capability` because no public-source, immutable-revision, license-checked candidate is registered. Local probe `/private/tmp/w73e17-atom3-probe.lean` imported the truncated-moment existence owner and exited 1 because `exact?` could not close the `exists unique` representing-measure goal under positive semidefiniteness and singular determinant; deriving the nodes and exact rank count is the central missing step, so taking it as a premise would restate the atom.
    reentry_condition: Freeze the singular positive semidefinite Toeplitz Caratheodory-Fejer decomposition on `Circle`, with a unique positive representing measure, distinct nodes, positive weights, and support cardinality equal to matrix rank; then apply the source common-denominator collapse and reweighting to prove uniqueness and the displayed maximal Haar-floor completion formula.
    blocker_class: missing-prerequisite
