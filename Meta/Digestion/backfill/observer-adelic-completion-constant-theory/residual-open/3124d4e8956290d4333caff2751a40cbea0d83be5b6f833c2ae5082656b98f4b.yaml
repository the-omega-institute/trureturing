  quarantine:
    justification: Whole-atom retrieval found one provable clause and five missing public bridges. D5 searches `Theta.*omega|scattering quotient|shifted xi quotient|inner scattering|generalized Schur|Pontryagin|Blaschke|negativeSquares|upperHalfPlane|all-pass|phase orientation` found the canonical actual-xi quotient `FiniteScatteringCascade.shiftedXiScattering`, the sharp-layer identity `ShiftedXiObservationLayers.shifted_xi_observation_layers`, and the standalone predicate `HermitianKernelNegativeSquares.HasNegativeSquares`; that kernel module explicitly records that no Pontryagin-space, generalized-Schur, or Krein-Langer declaration exists, and no D5 theorem connects the source quotient to inner versus generalized-inner scattering, upper-half-plane poles, a Blaschke denominator, phase orientation, and kernel negative squares on one carrier. Pinned Mathlib search `generalized-inner|generalized-Schur|negative squares|Pontryagin space|Krein-Langer|all-pass ambiguity|Blaschke denominator|phase orientation|inner scattering` returned no hits. The same search over installed non-Mathlib packages Cli, LeanSearchClient, Qq, aesop, batteries, importGraph, plausible, and proofwidgets returned no hits; dependency-form ecosystem retrieval remains unavailable under spec A17's open admission predicates. Local probe `/private/tmp/w73a4-atom2-probe.lean` proves `norm (shiftedXiScattering omega t) = 1` for arbitrary real positive omega and real t with the actual source denominator nonzero, then exits 1 because `InnerScattering`, `GeneralizedInnerScattering`, `HasBlaschkeDenominator`, `HasPhaseOrientation`, and `IsAllPassAmbiguity` are unknown. Depositing the unit-norm clause alone would leave the source excerpts `cannot distinguish RH inner scattering from generalized-inner scattering with off-line zeros`, `differences can exist only in upper-half-plane poles, Blaschke denominator, phase orientation, and kernel negative squares`, and `off-line zeros are a strict all-pass ambiguity` absent from the public statement.
    reentry_condition: Define the source inner and generalized-inner scattering predicates on `shiftedXiScattering`, construct its upper-half-plane pole and Blaschke-denominator data, define and relate phase orientation and the canonical de Branges/Pick kernel negative-square count, and prove a public classification theorem showing equal boundary modulus together with exactly the stated four possible distinguishing invariants and the all-pass conclusion.
    blocker_class: multi-clause-guard
