  quarantine:
    justification: Retrieval preceded quarantine. D5 searches `Berry|Chern|Weyl.*monopole|magnetic monopole|degeneracy point|two.level`, `Hamiltonian|Pauli|degeneracy|eigenbundle|curvature flux|Chern|monopole|Weyl point`, and the source matrix body found the canonical qubit/Pauli carriers, the canonical completed-xi reading, and the frozen entire-zero dichotomy, but no declaration constructing the positive-energy eigenline bundle, Berry curvature, linking-sphere flux, or Chern charge for this Hamiltonian. Pinned Mathlib searches `Berry|Chern|Weyl.*monopole|magnetic monopole|degeneracy point`, `Isolated.*zero|zero.*Isolated|Chern class|firstChern|Berry curvature`, and `Hamiltonian|Pauli|eigenbundle|monopole` found analytic isolated-zero and finite Hermitian-matrix infrastructure, but no Berry connection, eigenbundle, first Chern number, or Weyl-monopole bridge. Resolved third-party packages had no relevant hit; `HEPLean/PhysLean` at commit `a4ba9ef953e30809311427774d49b2b7843b07ff` was cloned and exact searches `Berry curvature|Berry phase|Chern number|Chern class|eigenbundle|Weyl.*monopole|magnetic monopole|two.level Hamiltonian` missed. GitHub repository search for `Chern number Lean` returned zero repositories, while Lean code search returned HTTP 401 and is `wait-for-capability` under spec A17. Local probe `/private/tmp/w73d13-atom2-probe.lean` exited 0 after proving the public energy-zero equivalence and discreteness of the centered canonical-xi zero set, then stopped at the exact resisting clause `两能级参数族的孤立简并点携带 Berry 曲率通量，并在 Weyl 系统中表现为动量空间磁单极子；其整数荷由 Chern 数给出`; replacing the named Chern carrier by a newly defined winding charge would change the statement.
    reentry_condition: Freeze source-faithful definitions of the positive-energy eigenline bundle on a linking two-sphere, its Berry connection and curvature flux, and its first Chern number, plus a theorem identifying that integer with the local charge of the canonical centered-xi two-level Hamiltonian; then combine that bridge with the already verified degeneracy and isolated-zero clauses.
    blocker_class: multi-clause-guard
