  quarantine:
    justification: "The public atom requires four equivalent conditions on the canonical square-folded xi data (RH, total nonnegativity of the coefficient Toeplitz matrix, total nonnegativity of both moment Hankel matrices, and a positive trace-class Fredholm determinant representation), the exterior-power/Newton/moment commuting square, and the finite negative Toeplitz-minor certificate when RH fails. Retrieval receipts: D5 searches `total.?nonnegative|totally.?nonnegative|toeplitz.*minor|hankel.*minor|stieltjes moment|Pólya.?frequency|Newton.*moment|exterior.*power` and the Fredholm/body-shape sweeps found generic finite matrices, Hankel determinant calculations, `AllZerosOnMidline`, and unrelated determinant families, but no total-positivity predicate, canonical Toeplitz/Hankel xi construction, commuting-square theorem, or exact owner. Pinned Mathlib searches with the same total-positivity, Pólya-frequency, Stieltjes-moment, Jacobi-Trudi, skew-Schur, and exterior-power-trace vocabulary found finite `Matrix.det` infrastructure but no Aissen-Schoenberg-Whitney-Edrei theorem, Stieltjes Hankel criterion, or Fredholm determinant. A17 GitHub Lean code searches for `Polya frequency`, `Pólya frequency`, `totally nonnegative` with Toeplitz, and `Stieltjes moment` with Hankel returned zero hits; prior Fredholm searches found no determinant implementation, while the only third-party trace-class candidate is toolchain/Mathlib-incompatible and lacks the determinant. The local probe `/private/tmp/w72a21-total-positivity-probe.lean` found `Matrix.det` but exited 1 with unknown identifiers for total nonnegativity, Pólya-frequency, Stieltjes-moment, trace-class, and Fredholm-determinant primitives, so the whole public atom cannot be stated or proved without first supplying these canonical prerequisites."
    reentry_condition: "Provide canonical square-folded-xi Toeplitz and Hankel constructions, total-nonnegativity and Stieltjes-moment predicates, the ASWE/Edrei and Hankel equivalence theorems, admissible trace-class/Fredholm-determinant infrastructure, the exterior-power/Newton/moment commuting laws, and the finite negative-minor extraction theorem."
    blocker_class: missing-prerequisite
