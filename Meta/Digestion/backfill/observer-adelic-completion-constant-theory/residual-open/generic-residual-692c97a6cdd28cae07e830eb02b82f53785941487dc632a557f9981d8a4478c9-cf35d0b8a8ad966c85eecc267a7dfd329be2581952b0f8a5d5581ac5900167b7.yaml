    justification: "Multi-clause guard after the whole-atom and sibling-clause check. The frozen parent D5/S3/Arith/IcosahedralAxisDecomposition.finite_icosahedral_axis_decomposition covers the 6/10/15 abstract cyclic-axis cardinalities and the order-two normalizer-equals-centralizer clause, but its public docstring says the three equivalences are noncanonical finite-cardinality matches and that no real-geometric or equivariant identification is asserted; it therefore does not cover the active boxed clause 六维格的三维判别式模，在射影化以后精确恢复二十面体的全部旋转轴 or the displayed six-dimensional-boundary to finite-quadratic-space to real-axis-geometry composite. D5 searches for boundaryProjection|boundaryReduction|dualLattice.*Quot|Projectivization.*alternatingGroup|Fin 3 to ZMod 5|real rotation axis found ExactDualLatticeFormula, EnergyBoundarySelectionLaw, RamifiedFiveDissection, and the frozen abstract axis decomposition, but no quotient carrier D_L, no A5 action on its three-dimensional boundary, and no real or complex icosahedral axis-line carrier or canonical equivariant map. Pinned Mathlib searches for icosahedron|dodecahedron|PSL2(5)|Omega3(5)|alternatingGroup Fin 5|Projectivization|orbit stabilizer found only the H3 Coxeter matrix description, generic alternating-group facts, projectivization equality, cardinality equivalences, and orbit-stabilizer tools; no axis realization or discriminant-to-axis bridge exists. Third-party GitHub Lean code searches for icosahedron, icosahedral, alternatingGroup Fin 5 with ZMod 5, and Projectivization with alternatingGroup found only Mathlib H3 mirrors and an unrelated PGL2 finite-subgroup file, with no requested geometric realization. The local Lean probe /private/tmp/w72b16-active-probe.lean exited 0 for the maximal available fragment, namely the three noncanonical bijections plus the order-two centralizer equality; the required canonical geometric target cannot be stated because its carrier and map are absent. Replacing that missing map by Fintype.equivOfCardEq or a code-sorted bijection would violate the canonical-object and definitional-substitution rules."
    reentry_condition: "Define and freeze the six-dimensional discriminant quotient D_L = L#/L with its canonical equivalence to the nilpotent boundary image R, the source A5 action on R from the displayed matrices, and a canonical equivariant projectivized map to a real or complex icosahedral axis-line carrier whose 6/10/15 fibers are the rotation axes and whose order-two stabilizer is the stated centralizer; then prove that their composite is the claimed exact recovery map."
    blocker_class: multi-clause-guard
