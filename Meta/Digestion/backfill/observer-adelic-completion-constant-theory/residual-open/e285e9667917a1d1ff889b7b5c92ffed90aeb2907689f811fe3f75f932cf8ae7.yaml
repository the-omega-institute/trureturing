    justification: Missing typed prerequisites for the conditional six-step compiler. D5 search `negative.*(Hankel|jet)|Hankel.*negative|normal.*Hankel|rational.*square|compact.*support.*negative|Feshbach.*negative|schur.*negative` found partial endpoints including ReflectedPairCurvatureRayleighIntertwiner, FinitePaleyWienerInterpolation, fixed-scale Weil/prime-Archimedean identities, SafeComplementFiniteIndex, and ExactStickyReduction, but no canonical normal Hankel carrier `H_N^(r)(t)`, no theorem turning its negative direction into the source rational zero-side witness, and no theorem transporting the exterior-pole l2 zero-set approximation through compact support to the same fixed-support sticky block; the source-planned ObserverNormalJet and JetToFeshbachCompiler files are absent. Pinned Mathlib search `Paley.Wiener|Hankel.*operator|Hankel.*matrix|rational.*approx|Schur.*complement|Feshbach|negative.*inertia|finite.*support.*dense` found algebraic Schur-complement results and rational-function APIs but no Paley-Wiener theorem, weighted zero-sampling approximation, or negative-margin transport chain. Installed third-party packages plausible, proofwidgets, batteries, Cli, aesop, importGraph, LeanSearchClient, and Qq returned zero relevant hits. The local proof attempt can apply the final exact sticky reduction only after a negative full energy on its precise block carrier is supplied; deriving that energy from the normal Hankel direction is exactly the absent compiler bridge, while adding each proof-chain bullet as a premise would assume the conclusion.
    reentry_condition: Freeze source-faithful normal Hankel and exterior-pole approximation carriers plus the composed lemmas from a Hankel negative vector to a rational Hermitian witness, weighted zero-set approximation with strict-margin compact-support truncation, the fixed-scale explicit-formula energy, and the exact sticky block consumed by ExactStickyReduction.
