  quarantine:
    justification: "Retrieval preceded quarantine. D5 queries `Tchakaloff|Richter|finite[-_ ]atomic|atomic.*measure|moment.*preserv|card.*d + 1` found no exact owner; `D5/S3/Weil/TestFunctions/ActiveFiniteContactCompletion.active_finite_contact_completion` has the `d + 1` bound only under extra positive-pressure and finite-contact-support hypotheses, `D5/S3/Weil/TestFunctions/FiniteAtomicBudgetedCompletion.finite_atomic_budgeted_completion` gives a real symmetric finite decomposition under the same active-contact regime but no `d + 1` bound or moment clause, and `D5/S3/Weil/Budget/FullCirclePrimalAttainment.full_circle_primal_attainment` gives optimizer attainment on the compact circle without atomic reduction. Pinned Mathlib queries `Tchakaloff|Richter|cubature|quadrature|atomic measure|finitely supported measure|finite support.*integral|moment.*measure` found `eq_pos_convex_span_of_mem_convexHull`, `AffineIndependent.card_le_finrank_succ`, and `Convex.average_mem`, but no Richter-Tchakaloff representation for arbitrary integrable finite-dimensional functions; `Convex.average_mem` reaches only a closed convex set and does not supply exact membership in the nonclosed convex hull of a noncompact real-line image. Reachable GitHub Lean code queries `Tchakaloff language:Lean`, `Richter theorem language:Lean`, and `cubature convexHull FiniteMeasure language:Lean` all exited 0 with no hits. The local proof route obtains an optimal circle completion from `full_circle_primal_attainment` and can apply Caratheodory after exact convex-hull membership, but stops at the absent theorem that the barycenter of a finite positive measure under an integrable map into `Fin d -> Real` lies in the map's convex hull; compact-circle discretization alone can select the omitted Cayley point and therefore does not construct the source's real-line symmetric Dirac orbits."
    reentry_condition: "Expose and freeze a public Richter-Tchakaloff theorem for a finite positive measure and an integrable map into `Fin d -> Real`, giving at most `d + 1` positive atoms with exact mass and coordinate integrals; then combine it with the existing primal-attainment and Cayley transport owners and explicitly symmetrize on the real carrier."
    blocker_class: missing-prerequisite
