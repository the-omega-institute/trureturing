    justification: "Missing global zero-count and Clark-tail prerequisites. D5 search `Riemann.?von.?Mangoldt|zeroCount|Clark.*arc|small.?arc|spectral crowd|muLambda` hit canonical `Ncount`, `zeroMult`, `zetaZeroConfig`, and the proved local estimate `zeta_local_zero_count`, but the global Riemann-von Mangoldt main term remains only `RiemannVonMangoldt.main`, a structure field in `ZetaCore/Hypotheses.lean`, and no canonical Clark small-arc mass or weighted zero-tail asymptotic was found. Pinned Mathlib search `Riemann.?von.?Mangoldt|zero.?count.*zeta|weighted.*zero|summation by parts|partial summation` hit only generic summation-by-parts support and no zeta-zero counting theorem or Clark measure. GitHub Lean ecosystem searches for `Riemann-von Mangoldt`, `Riemann von Mangoldt`, `Clark measure`, and `spectral crowding` all returned empty result sets with exit 0. Local Lean probe `/private/tmp/w72a22-crowding-probe.lean` proves with exit 0 that a Big-O error which is little-o of the main term yields the claimed asymptotic equivalence, so the downstream asymptotic language is available; the proof attempt stalls specifically at the unproved global zero-count main term, the Clark mass tail identity, and the weighted partial-summation estimate."
