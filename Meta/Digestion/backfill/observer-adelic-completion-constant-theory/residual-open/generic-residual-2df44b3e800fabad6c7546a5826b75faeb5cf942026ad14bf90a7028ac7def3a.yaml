    justification: "Retrieval preceded quarantine. D5 name/body-shape queries `Support.*finite|finite.*reduction|Hermitian.*positiv|positiv.*Hermitian|Feshbach|Schur.*complement|Slepian|safeComplement|sticky|spectral.*projection|finite.*retained` found two partial prerequisites: `D5/S3/Weil/ZetaBridge/SafeComplementFiniteIndex.safe_complement_gap` proves the source-specific positive gap from the support scale and concentration threshold, and `D5/S3/Weil/ZetaLinear/ExactStickyReduction.exact_sticky_reduction` proves the generic full-block/Schur-energy positivity equivalence, but no theorem constructs the finite Slepian retained projection P, its complement Q, and the finite Hermitian matrix representing the resulting Schur energy. Pinned Mathlib searches `Slepian|Landau.Pollak|prolate spheroidal|time.bandlim|concentration operator|spectral projector|spectralProjection`, `compact.*selfAdjoint|selfAdjoint.*compact|eigenspace.*finite|finite.*eigenspace|eigenvalue.*threshold`, and `schurComplement|PosSemidef.*schur|schur.*PosSemidef` found `ContinuousLinearMap.finite_dimensional_eigenspace` only for each single nonzero eigenspace and finite-matrix Schur lemmas, with no Slepian construction or finite-dimensional positive-threshold spectral projection. Reachable GitHub Lean searches `Slepian`, `prolate spheroidal`, `concentration operator`, `time band limiting`, `spectral projection compact`, and `IsCompactOperator spectralProjection` found only mathlib mirrors of the same per-eigenvalue theorem and no A17 port candidate. Local probe `/private/tmp/w72b19-atom2-probe.lean` imported and elaborated the two D5 prerequisites and the Mathlib eigenspace theorem, then exited 1 with unknown identifiers for `slepianConcentrationOperator`, `finiteDimensional_spectralProjection_gt`, and `supportScaleFiniteHermitianReduction`; without that bridge, the public finite-Hermitian clause cannot be derived and adding L, a, eta to the generic Schur theorem would leave source premises unused."
    reentry_condition: "Construct on the source support-L Weil-test carrier the time-band Slepian concentration operator, prove compact self-adjoint threshold projection P is finite-dimensional with Q its orthogonal complement and the stated safe gap, then identify the exact Schur energy with a finite Hermitian matrix and apply the frozen exact sticky reduction."
