  quarantine:
    justification: Whole-atom retrieval found the Zeckendorf carrier but not the exact restricted-determinant bridge. D5 body-shape and theorem searches `GoldenName|goldenNameEquiv|FiniteZeckendorfGeometricSum|golden.*geometric|geometric.*golden|shiftMatrix|det.*shift|shift.*det|det.*cyclic|cyclic.*det|prodEquivOfIsCompl|det_prodMap|LinearMap.restrict` found canonical `D5/S0/Tower/GoldenNames.GoldenName` and `goldenNameEquiv`, plus the actual cyclic matrix `D5/S3/Observer/WindowRegister.shiftMatrix` and its full-period/unitarity laws, but no theorem computes the determinant of `I-xU_K` on the literal constant-vector orthogonal complement or joins it to the hard-core energy sum. Pinned Mathlib searches `dft.*(shift|translate)|shift.*dft|det.*restrict|restrict.*det|det.*quotient|charpoly.*perm|perm.*charpoly|det.*circulant|circulant.*det|charpolyRev.*(perm|shift|cycle)|orthogonal.*determinant` found `ZMod.dft`, `LinearMap.restrict`, `LinearMap.det_prodMap`, orthogonal decomposition, and generic matrix determinants, but no translation-diagonalization theorem for `ZMod.dft`, no invariant-subspace determinant factorization, and no cyclic-shift characteristic-polynomial or restricted determinant theorem. Installed non-Mathlib packages Cli, LeanSearchClient, Qq, aesop, batteries, importGraph, plausible, and proofwidgets were searched for cyclic-shift determinants, orthogonal determinants, Zeckendorf geometric sums, and DFT shift compatibility and returned no hits; dependency-form ecosystem retrieval remains unavailable under spec A17's open admission predicates. Local probe `/private/tmp/w73a4-atom3-api-probe.lean` confirmed that the exact `shiftMatrix`, `LinearMap.restrict`, `LinearMap.det`, and `det_prodMap` APIs elaborate, but exits 1 because even the expected circulant-action lemmas `Matrix.circulant_mulVec` and `Matrix.mulVec_circulant` and an orthogonal-span decomposition helper are absent; completing the source theorem would require first constructing and proving the missing Fourier/invariant-subspace determinant layer. Depositing only the already available geometric sum or only a diagonal phase proxy would omit the public source clause `det on H_K^circ(I-xU_K)` and violate the exact-carrier and whole-statement rules.
    reentry_condition: Provide a frozen D5 or A17-admissible theorem diagonalizing the canonical `WindowRegister.shiftMatrix K` on the literal orthogonal complement of the constant vector, including invariance and identification of the `K-1` nontrivial unitary phase modes, together with a determinant computation `det(I-xU_K|1^perp)=sum_{e<K}x^e`; then combine it with `GoldenNames.goldenNameEquiv` and a public energy-preservation lemma for arbitrary source depth N and scalar x.
    blocker_class: multi-clause-guard
