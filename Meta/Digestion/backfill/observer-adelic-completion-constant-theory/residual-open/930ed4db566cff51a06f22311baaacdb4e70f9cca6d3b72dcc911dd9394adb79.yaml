  quarantine:
    justification: "Missing prerequisites on the source carrier. D5 search `bilateral.*(subshift|golden|Fibonacci)|Fibonacci.*Hamilton|common spectrum|spectrum.*phase|phase.*spectrum|Weyl criterion|minimal.*spectrum` found only one-sided golden word-subshift minimality on `Nat -> Bool` and unrelated bilateral Fibonacci recurrence lifts, with no bilateral golden symbolic hull, Fibonacci Hamiltonian on `lp (fun _ : Int => Complex) 2`, or common-spectrum theorem. Pinned Mathlib search `bilateral.*shift|Weyl.*criterion|approximate.*eigen|mem_spectrum.*approx|IsSelfAdjoint.*spectrum|spectrum.*isClosed|lp.single` found closed/real spectrum facts, finite-support density ingredients, and conjugation invariance, but `Analysis/InnerProductSpace/Spectrum.lean` explicitly leaves bounded self-adjoint spectral theory as TODO and supplies no infinite-dimensional Weyl approximate-vector criterion. Installed third-party packages plausible, proofwidgets, batteries, Cli, aesop, importGraph, LeanSearchClient, and Qq returned zero hits for `Fibonacci Hamilton|Weyl criterion|bilateral subshift|common spectrum`. The local proof reduction can obtain orbitwise unitary spectrum invariance and spectrum closedness, but cannot extend it from one orbit to the minimal hull without the missing finite-support Weyl criterion and bilateral golden recurrence/minimality bridge; replacing the Hamiltonian by an abstract spectrum-valued proxy or one-sided carrier would violate source-carrier fidelity. Reentry w73e40: the exact D5/Scribe and pinned Mathlib queries above were rerun (exit 0); GoldenSubshiftMinimalAction still supplies only a Nat action on Nat-indexed words, while lp.hasSum_single, IsStarNormal.orthogonal_range and bijective_iff_dense_range_and_antilipschitz supply ingredients only. Loogle queries for spectrum/approx returned count 0; LeanSearch /search returned HTTP 200 with extremum eigenvector and unbounded-domain facts only. GitHub Lean queries for Weyl criterion plus spectrum, approximate eigenvector, and bilateral subshift each exited 0 with []; broader Hamiltonian hits at CrystalToe/CrystalAgent@03bde92fe87fb10940b533f1385453c02e09b4cd, gvakhrushev/d0_15@ea39439c8d46031769017dc12e7c656a3f7748cf and zblore/csd-lean4@57b47159960294c992a52635677bf8e6fa6ac0ca were inspected and are finite scalar identities or claim/axiom audits, not this operator. Installed third-party package search exited 1 with no hits. Local construction /private/tmp/consensus-rnd/sshx/w73e40/attempt-1/atom2-probe.lean (exit 1; atom2-probe-v3.log) proves finite truncation convergence/support on complex lp(Int,2), derives range-orthogonality from self-adjointness, and proves nonzero truncation and normalized unit norm; with A = algebraMap Complex _ (E : Complex) - T, horth : (↑A).rangeᗮ = (↑A).ker and hbound : ∀ v, ‖v‖ = 1 → epsilon / 4 ≤ ‖A v‖, the exact remaining spectral goals are `(↑A).range.topologicalClosure = ⊤` and `∃ c, AntilipschitzWith c ⇑A`; after truncation the remaining estimate is `‖T (‖w‖⁻¹ • w) - ↑E • ‖w‖⁻¹ • w‖ < epsilon`. Scope note: the full prerequisite needs the bilateral golden minimal hull and canonical bounded nearest-neighbor operator as well as the spectral approximation bridge; a feasible first content slice is the finite-support Weyl criterion for bounded self-adjoint operators on complex l2(Int), including the normalized residual estimate."
    reentry_condition: "Freeze a canonical bilateral golden subshift with minimal Int-shift action, the source's bounded self-adjoint nearest-neighbor Hamiltonian on complex l2(Int), and an infinite-dimensional self-adjoint Weyl criterion with finitely supported approximation; then transport local words to prove phase-independent real spectrum."
