  quarantine:
    justification: "Retrieval preceded quarantine. D5 name and body-shape searches `circle primal|hfloor|haar floor|full_circle_primal|cayley.*moment|white_to_haar|resolventCompactification|cayleyCompactification`, resolvent `withDensity` pushforwards, circle-point deletion, and circle-to-real measure construction found no whole owner or reverse feasible-set bridge. Exact partial owners are `FullCirclePrimalAttainment.full_circle_primal_attainment` for the compact circle maximizer, `CayleyMomentTransport.cayley_moment_transport` for forward local moments and the Haar moment, `WhiteToHaarIdentity.white_to_haar_identity` for white-to-Haar scaling and floor order on real-line measures, and `OneScaleInformationalCompleteness.one_scale_informational_completeness` for injectivity of the forward encoding; none proves that a circle feasible measure modulo its invisible atom at one comes from an even real-line completion or that the concrete local Weil matching predicates coincide. Pinned Mathlib searches combining `cayley|circle`, `measure|compactification`, and `surject|inverse`, plus `Measure.map.*(surject|inverse)` and resolvent mass shapes, found no reverse compactification or circle-primal theorem. Searches of the installed non-Mathlib Lake packages for `circle primal|resolvent.*cayley.*inverse` found no hit; A17 admission is `wait-for-capability` because no public-source, immutable-revision, license-checked candidate is registered. Local probe `/private/tmp/w73e17-atom2-probe.lean` imported the three strongest partial owners and exited 1 because `exact?` could not close the goal that every circle measure with zero mass at `{1}` is `resolventCompactification` of a real-line measure; the exact local-Weil matching equivalence remains absent as well, and taking either bridge as a premise would assume the atom's central source-carrier equivalence."
    reentry_condition: "Freeze a source-faithful reverse resolvent Cayley compactification modulo the invisible circle point, including mass, evenness, and local-moment preservation on the concrete local Weil source, then combine it with the existing white-to-Haar and circle-attainment owners to derive every maximum and residual-decomposition clause."
    blocker_class: missing-prerequisite
