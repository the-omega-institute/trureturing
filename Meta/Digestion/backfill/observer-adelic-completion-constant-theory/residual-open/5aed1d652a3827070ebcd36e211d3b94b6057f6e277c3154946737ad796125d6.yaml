  quarantine:
    justification: 'Retrieval preceded quarantine. D5 searches `RiemannHypothesis|li coefficient|li curvature|zeroCountingMeasure|cayley|lambda one|cyclic vector` found partial owners `RhLocatesZeroData.zeroData_zero_on_critical_line_of_rh`, `ZeroDataNonemptyIffInfinite.nonempty_zeroData_iff_infinite`, `RiemannPoissonDensity.zeroCountingMeasure`, and `LiCurvatureFourierRepresentation.li_curvature_fourier_representation`, but no theorem deriving a `ZeroData` value from RH, constructing the source probability measure on actual nontrivial zeros with weights `1 / |rho|^2`, identifying its moments with the canonical normalized Li curvature, or proving the concrete cyclic L2 multiplication state. `LiCurvatureCriterion` instead requires the RH Fourier representation as a separate premise. Pinned Mathlib searches `RiemannHypothesis|riemann zero|zeta zero|LiCoefficient|Measure.dirac|IsCyclic` found the RH proposition and closed, discrete, locally finite zeta-zero infrastructure, but no infinitude theorem, Li coefficients, weighted Li zero expansion, or cyclic multiplication-state bridge. Installed non-Mathlib Lake packages had no relevant exact hit; authenticated public GitHub Lean code searches for `RiemannHypothesis` with `LiCoefficient` and with `ZeroData` each returned zero results, while the quoted `Li coefficient` hits were unrelated. Local probe `/private/tmp/w73c17-atom1-probe.lean` imported the strongest partial owners and exited 1 after `nonempty_zeroData_iff_infinite` left the exact unsolved goal `hRH : RiemannHypothesis |- {rho | IsNontrivialZero rho}.Infinite`; later source clauses cannot be reached before this bridge.'
    reentry_condition: Provide frozen D5 or A17-admissible theorems deriving an exhaustive multiplicity-aware nontrivial-zero carrier from RH, the source normalization and weighted circle probability measure from the canonical Li coefficients, its full moment identity, and cyclicity of the concrete L2 multiplication state.
    blocker_class: missing-prerequisite
