  quarantine:
    justification: Retrieval preceded quarantine. D5 name/body-shape searches `entire.{0,40}(growth|order)|growth.{0,40}(entire|order)|maximum.{0,20}modulus|maxModulus|log.*log.*(limsup|atTop)|limsup.*log.*log|canonical.{0,20}product|genus[-_ ]?zero|Hadamard.{0,30}(factor|product)|Weierstrass.{0,30}(factor|product)` found only pointwise analytic zero multiplicity (`ToroidalJetDepth`), concrete Gamma Weierstrass factors, and unrelated finite products; no global entire-function growth order, square-composition order law, or genus-zero Hadamard factorization. Pinned Mathlib searches with the same patterns found the maximum-modulus principle, local `analyticOrderAt`, and `Analysis/Complex/CanonicalDecomposition`, whose API is a finite disk-local Blaschke decomposition, but no global limsup growth-order definition or genus-zero canonical product theorem. Reachable GitHub Lean searches `Hadamard factorization`, `entire function order`, and `canonical product` found `AlexKontorovich/PrimeNumberTheoremAnd`, including `EntireOfOrderAtMost` and `hadamard_factorization_of_order`; however its Lean v4.32.2/mathlib 905b95818eb32af7874a58b427f50c1711a5e96c differs from this repository's Lean v4.33.0/mathlib db584cd6d46c92f209a44c0f1c829460d327499d, so A17 dependency form is impossible, while an admitted port and its prerequisite closure are absent. Focused upstream searches `EntireOfOrderAtMost sqrt`, `EntireOfOrderAtMost z ^ 2`, `order limsup`, and `Nat.floor rho = 0` found no exact square-order bridge. The local proof attempt `.lake/build/w73d3-square-attempt.lean` compiled with exit 0 and proved from pinned Mathlib that squaring gives exactly the source's radius-sphere norm-range equality, so the elementary maximum-modulus step is available; the attempt cannot state, let alone derive, exact order one to one-half or the genus-zero/no-nonconstant-exponential consequence without the missing global growth and Hadamard layers, and assuming either conclusion would restate the atom.
    reentry_condition: Port and admit an A17-compatible entire-function finite-order and Hadamard-factorization stack at the repository's current Lean/mathlib pin, add a canonical exact limsup growth-order definition with a theorem that `F(z)=G(z^2)` sends order one to order one-half, and specialize the global factorization at one-half to a genus-zero product with only a constant exponential factor.
    blocker_class: missing-prerequisite
