  quarantine:
    justification: "Retrieval preceded quarantine. D5 query `shifted_cauchy|cauchy.*kl|kl.*cauchy|poisson.*kl|kl.*poisson` exited 0 and found the frozen partial owner D5/S3/Divergence/CauchyClosedForm: it proves the real-valued closed-form algebra but explicitly records that it does not identify the expression with measure-valued KL for distinct Cauchy laws; no such bridge was found. Pinned Mathlib db584cd6d46c92f209a44c0f1c829460d327499d query `cauchy.*kl|kl.*cauchy|cauchy.*relative.*entropy|relative.*entropy.*cauchy|cauchyMeasure` exited 0 and found Probability/Distributions/Cauchy.lean plus the general InformationTheory.klDiv API and data-processing theorems, but no distinct-Cauchy KL evaluation. Pinned non-Mathlib package query with the same Cauchy, Poisson, KL, and relative-entropy terms over Lean files exited 1. A17 GitHub Lean-code queries `cauchyMeasure klDiv`, `Cauchy relative entropy`, and `Poisson klDiv` each exited 0; the exact queries returned no hit, while the broader relative-entropy query returned only an unrelated Cauchy-Schwarz comment. Probe `/private/tmp/w73e38-atom2-probe.lean` exited 1 after proving the source-restricted scalar decrease for `0 < omega < delta` and `0 < h`; its exact remaining goal was `InformationTheory.klDiv (ProbabilityTheory.cauchyMeasure gamma (delta - omega + h).toNNReal) (ProbabilityTheory.cauchyMeasure gamma (delta + omega + h).toNNReal) < InformationTheory.klDiv (ProbabilityTheory.cauchyMeasure gamma (delta - omega).toNNReal) (ProbabilityTheory.cauchyMeasure gamma (delta + omega).toNNReal)`. Replacing actual KL by the closed-form definition would violate the atom's carrier and would not discharge this goal."
    reentry_condition: "Freeze a theorem evaluating `InformationTheory.klDiv` between arbitrary positive-scale same-center `ProbabilityTheory.cauchyMeasure` laws as `ENNReal.ofReal (cauchyKL gamma a gamma b)`, including the required absolute-continuity and logarithmic-integrability proofs; then derive strict positive-time decrease, admissible reverse-time increase, and the boundary divergence on that measure-valued carrier."
    blocker_class: missing-prerequisite
