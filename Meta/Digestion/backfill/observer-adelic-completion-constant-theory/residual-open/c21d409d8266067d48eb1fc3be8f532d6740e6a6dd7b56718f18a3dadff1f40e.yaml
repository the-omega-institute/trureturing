  quarantine:
    justification: "Retrieval and a source-carrier audit preceded quarantine. The immediately preceding source scope says `take arbitrary M in SL(2,C)` and defines `x=(1/2) tr M`; the atom then includes the trace/Chebyshev identity, the slack-discriminant identity, a three-row elliptic/parabolic/hyperbolic classification by `|tr M|` (equivalently `|x|`), the implication from negative Chebyshev slack to a hyperbolic finite Szego transfer, and the child-atom assertion that the Chebyshev-Toeplitz moment chart and CMV-SL2 transfer chart are the same finite observation structure. D5/fresh-origin queries `Transfer.*Chebyshev|trace.*chebyshev|chebyshev.*trace|slack.*trace`, `Matrix.trace.*pow|moment.*transfer|Toeplitz.*transfer|CMV.*transfer`, plus body-shape searches for determinant-one two-by-two power traces found no whole or partial trace-power identity owner. Exact partial hits `ChebyshevSlackPositivity.chebyshev_slack_bounds` and `ChebyshevSignedDistanceSeparator.first_chebyshev_slack_separates_signed_squared_distance` cover only the real scalar slack, not a transfer matrix or the chart equivalence. Pinned Mathlib supplies `Polynomial.Chebyshev.T` recurrence facts and, in `Mathlib/LinearAlgebra/Matrix/GeneralLinearGroup/FinTwo.lean`, `Matrix.IsElliptic`, `IsParabolic`, and `IsHyperbolic` only over ordered real carriers via the discriminant; queries for a determinant-one matrix trace-power/Chebyshev theorem and for a moment/transfer-chart bridge found no exact result. The source's complex-carrier classification is defective under those standard meanings: `/private/tmp/w72b14-transfer-probe.lean` constructs `M=diag(2i,-i/2)`, and Lean verifies `det M=1`, `norm(trace M)=3/2<2`, while `M` has eigenvector `(1,0)` with eigenvalue `2i` of norm `2`; hence the table labels an expanding complex matrix elliptic. The same probe elaborates the frozen signed-distance separator and exits 1 only on missing `transfer_chebyshev_identity`, `transfer_chebyshev_slack_discriminant`, and `chebyshev_to_cmv_transfer_chart_equivalence`. Third-party GitHub queries `\"trace\" \"Chebyshev.T\" language:Lean`, `\"Matrix.trace\" \"Chebyshev\" language:Lean`, and `\"IsHyperbolic\" \"Matrix.trace\" language:Lean` returned HTTP 401 requiring authentication, so broader ecosystem retrieval is `wait-for-capability`. The algebraic identities could be deposited after a local Cayley-Hamilton proof, but the whole atom cannot be admitted while its public complex classification is false and its child moment/transfer-chart equivalence has no in-scope named maps or predicates; depositing only the identities would violate the whole-atom public-clause rule."
    reentry_condition: "Correct the source carrier to `SL(2,Real)` (or add a real-trace/conjugacy hypothesis and state the appropriate complex loxodromic classification), and define the canonical Szego/CMV transfer object plus the Chebyshev-Toeplitz moment-to-transfer chart maps and their equivalence; then formalize the trace identity, slack identity, trichotomy, negative-slack hyperbolicity, and both child chart clauses publicly in one theorem."
    blocker_class: multi-clause-guard
