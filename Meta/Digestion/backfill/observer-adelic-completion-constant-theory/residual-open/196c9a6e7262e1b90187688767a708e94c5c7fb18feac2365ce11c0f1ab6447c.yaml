  quarantine:
    justification: "Retrieval preceded quarantine. The in-scope source constructs N_t(u)=Xi(t-i*sqrt(u))*Xi(t+i*sqrt(u)) and S_t(u)=N'_t(u)/N_t(u), so the whole theorem needs an RH-derived logarithmic-derivative expansion on that canonical completed-zeta product, strict positivity of its multiplicity-weighted zero-ordinate resolvent sum, and the converse local pole argument giving a negative value to the left of an off-line zero. D5 searches `RiemannHypothesis|Hadamard|log.?deriv|resolvent|Poisson|zero.*enumer|sum.*zero|criticalXi|normalIntensity` and `exists_normSq_sub_ge|summable_wt|logDeriv_xi_sub_reflect|re_logDeriv_xi_eq_tsum` found `CompletedZeta.xiReading`, `NormalJetFormula.normalIntensity`, the ported explicit-formula partial layers, and `RiemannPoissonDensity`, but no RH first-resolvent expansion, zero-tsum log-derivative owner, unconditional nontrivial-zero existence owner, or local pole-sign theorem; `RiemannPoissonDensity` assumes its expansion. Pinned Mathlib searches for the same Hadamard/log-derivative/resolvent/zero-enumeration shapes and analytic-order local factorization found generic `logDeriv`, analytic order, and `RiemannHypothesis`, but no completed-zeta expansion or criterion. Public third-party `anthropics/zeta-23-lean` at immutable rev `2bafb8c88f177284a2123b5fefa2ff84e2365eb6` contains the partial prerequisite `Zeta23.XiPrime.ZeroFree.re_logDeriv_xi_eq_tsum` and zero existence, but no exact normal-product criterion; dependency form is incompatible because it pins Lean v4.33.0-rc2 and Mathlib 51e6992efd06126df61a496bebf8f49482a4e129 while this tree pins Lean v4.33.0 and Mathlib db584cd6d46c92f209a44c0f1c829460d327499d, leaving an A17 migration rather than a callable theorem. Local probe `/private/tmp/w73e7-atom1-probe.lean` constructed `normalIntensity (Real.sqrt u) t` and its derivative quotient on the canonical carrier, then exited 1 exactly at the absent `rh_first_resolvent_expansion`; assuming that bridge would assume the atom's central RH clause, and omitting the left-negative converse would violate whole-statement coverage."
    reentry_condition: "Provide a frozen D5 theorem, or an A17-admissible migration of the upstream weighted argument-principle result, deriving the multiplicity-weighted real-part logarithmic derivative expansion of the canonical `xiReading` from `RiemannHypothesis`, together with nontrivial-zero existence, the chain-rule identification with the derivative quotient of `normalIntensity (sqrt u) t`, and an analytic-order pole lemma proving negativity immediately left of every positive normal zero; then prove all three public clauses of theorem 889.1 without assuming the expansion."
    blocker_class: missing-prerequisite
