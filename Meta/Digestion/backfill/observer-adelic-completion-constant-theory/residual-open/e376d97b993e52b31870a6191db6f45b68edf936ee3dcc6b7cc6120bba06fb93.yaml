  quarantine:
    justification: "Retrieval preceded quarantine. Current D5 name/body-shape queries `LocalSpectrumDoesNotRecoverBundle|Isospectral|Nonisomorphic|GaugePatching|Chern|Clutch|Eigenline`, `local spectrum|isospectral|does.not.recover|same spectrum|identical spectrum`, and `winding|clutch|Chern|line bundle|transition function` found only the partial prime-indexed `LocalEulerTransitionNonreconstruction` and `LocalEulerFrameHistoryNonreconstruction` owners; they construct conjugate diagonal operators and distinct frame transitions, not the source Weyl Hamiltonian, positive eigenline bundle, circle winding, or Chern class. Pinned Mathlib searches `Chern|clutching|clutch|first Chern|line bundle`, `winding(number)?|circle.*degree|degree.*circle|Sphere.*degree`, and bundle-isomorphism primitives found `Matrix.det_fin_two`, `Matrix.charpoly_fin_two`, Hermitian spectrum APIs, and generic `FiberBundleCore`/`VectorBundle` infrastructure, but no circle winding or degree invariant, hemispherical clutching construction of a complex line bundle over the two-sphere, first-Chern invariant, or preservation of that invariant by bundle isomorphism. Reachable GitHub Lean searches `Chern class`, `Chern number`, `clutching`, `winding number`, `line bundle`, and `nonisomorphic line bundles` found TauCeti contour winding as a partial capability; the UFT first-Chern mentions are comments followed only by reflexive integer arithmetic, and sphere-six-complex clutching results concern mapping tori and stable framing, with no exact line-bundle classifier. Local probe `/private/tmp/w73a15-active-attempt.lean` constructed the source two-level Hermitian matrix and proved with standard axiom closure that equal `Complex.normSq` gives equal full characteristic polynomials; `lake env lean` exited 0. The remaining public clause cannot be stated on and proved for the actual positive eigenline bundles without the missing clutching and Chern-classification bridge; replacing those bundles by integer-labelled records or abstract spectrum functions would violate source-carrier fidelity."
    reentry_condition: "Freeze a canonical complex positive-eigenline bundle over a small two-sphere for the source Weyl Hamiltonian, prove its equatorial transition is `F/|F|`, define its first Chern number as the circle degree, and prove that number is preserved by complex line-bundle isomorphism; then instantiate two bound complex profiles of equal modulus and unequal degree to obtain the public isospectral nonisomorphism countermodel."
    blocker_class: missing-prerequisite
