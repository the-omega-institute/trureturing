    justification: "Missing prerequisite after whole-statement retrieval, source-context audit, and a carrier-exact local proof probe. The source's (1) -> (2) clause requires the one-dimensional Krein-Gabardo theorem extending a locally positive finite-order tempered distribution on (-2L,2L) to the inverse Fourier transform of a positive tempered measure. D5 searches `positive-definite|tempered distribution|Paley-Wiener|spectral completion|support outside` found the canonical partial owners TestFunctions/PaleyWienerGauge, TestFunctions/ExternalSupportInvisibility, TestFunctions/ConvolutionSquarePositivity, and TestFunctions/WhiteSpectrumDeltaNormalization, but no interval positive-definite distribution extension theorem or exact whole-statement owner. Pinned Mathlib searches `Krein|Bochner|Herglotz|PositiveDefinite|TemperedDistribution` found Krein-Milman, matrix positivity, complex Herglotz kernels, tempered-distribution Fourier inversion, and measure embedding, but no positive-definite function/distribution representation or local interval extension; all pinned non-Mathlib packages missed. A17 GitHub Lean-code search found TauCetiProject/TauCeti's global Bochner theorem for continuous positive-definite functions, but it has no local interval/distribution extension and uses Mathlib rev 03616a12cdf1e3f499349f69e80eee82b28745bc rather than this repository's db584cd6d46c92f209a44c0f1c829460d327499d. The local probe /private/tmp/w73d24-atom1-probe.lean elaborated the repository's actual Schwartz-test, tempered-distribution, Paley-Wiener gauge, angular-frequency pushforward, and positive tempered-measure carriers; `exact?` could not close LocallyPositive -> HasPositiveTemperedCompletion, while `apply?` offered only generic self-reductions leaving the same goal and marked both hL and hPositive unused. Adding the missing implication as a premise would restate the atom and violate the hollow-clause rule."
    reentry_condition: "Provide a frozen D5 or A17-compatible one-dimensional Krein-Gabardo interval extension theorem on tempered distributions: local convolution-square positivity under the finite-order/tempered hypotheses must construct a positive measure whose angular inverse Fourier transform agrees on the Paley-Wiener window; then combine it with the existing support and Fourier-inversion owners for all three public clauses."
    blocker_class: missing-prerequisite
