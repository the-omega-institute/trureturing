  quarantine:
    justification: "Retrieval preceded quarantine. D5 queries `Exact common-spectrum floor|alpha_*|common-spectrum|H_D|Haar floor|feasibleFloors|smallest eigenvalue|generalized eigen|weighted.*moment|congruence.*eigen` found partial owners `ExactTruncatedHaarFloor.exact_truncated_haar_floor` for the unweighted Toeplitz least-eigenvalue formula, `RationalToeplitzCollapse.rational_toeplitz_collapse` for the rational Gram congruence, and `TruncatedCircleMomentBridge.truncated_circle_moment_of_posSemidef` for positive Toeplitz moment representation, but no public theorem that the source weighted floor is the greatest alpha with `T - alpha H_D` positive semidefinite or that the two positive-definite whitenings in 558.7 and 558.8 have the same least eigenvalue. Pinned Mathlib queries `generalized.?eigen|whiten|eigenvalues.*conjug|congru.*eigen|IsGreatest.*PosSemidef|inv_sqrt|posSemidef_star_right_conjugate_iff` found low-level `CFC.inv_sqrt`, `Matrix.IsUnit.posSemidef_star_right_conjugate_iff`, and Hermitian eigenvalue ordering, but no packaged weighted floor or congruence-invariance result. Installed non-Mathlib Lake packages had no hits for `generalized eigen|Haar floor|weighted Haar|Toeplitz moment`; reachable GitHub Lean-code searches for `generalized eigenvalue`, `Haar floor`, and `Toeplitz moment PosSemidef` each exited 0 with empty results. Local probe `/private/tmp/w73d20-active-probe.lean` exited 1: `exact?` could not close the generalized-floor `IsGreatest` goal and the congruence least-eigenvalue goal exhausted its heartbeat budget. The source-faithful proof cannot be completed from the frozen public interface without these weighted generalized-eigenvalue bridges; defining the floor by the matrix target or specializing the denominator would violate the carrier and definitional-substitution rules."
    reentry_condition: "Provide frozen public theorems proving the weighted circle-measure floor/positive-semidefinite equivalence for arbitrary nonvanishing source denominators and proving least-eigenvalue invariance between the `H_D,T` and `B,G` positive-definite whitenings under an arbitrary invertible source coefficient matrix."
    blocker_class: missing-prerequisite
