    justification: 'Retrieval preceded quarantine. D5 searches `Blaschke|Hardy|Toeplitz|Hankel|Hilbert.?Schmidt|singularValues|anti.?causal|inverse.?inner` found finite matrix/control Hankel owners, generic finite-dimensional Hankel singular-value machinery, and `FiniteShiftedBlaschkeSymmetry`, but no Hardy-space carrier, positive/negative Fourier subspaces, finite Blaschke model space, compressed inverse-inner Hankel operator, or theorem relating its range to the model space. The four source-planned modules `InverseBlaschkeHankelKernel`, `InverseBlaschkeHankelIsometryOnModelSpace`, `InverseBlaschkeHankelRank`, and `InverseBlaschkeHankelHilbertSchmidtCharge` occur only in the atom CAS text and are absent from D5. Pinned Mathlib searches `Blaschke|HardySpace|Hardy space|Toeplitz|Hankel|HilbertSchmidt|Hilbert.?Schmidt|inner function|model space` found only finite disk-local `Complex.canonicalFactor`, the unrelated Hellinger--Toeplitz theorem, finite-dimensional singular values, and generic orthogonal projections; no Hardy, Toeplitz compression, model-space, Hankel, or Hilbert--Schmidt operator stack exists. Reachable GitHub Lean searches `HardySpace`, `Blaschke`, `Toeplitz`, `Hankel`, and `HilbertSchmidt` found no Hardy-space implementation or Blaschke--Hankel rank theorem: Blaschke hits were Mathlib mirrors/disk factors, Toeplitz/Hankel hits were finite matrices or proposition relays, and the external `XiOffsliceModelSpaceDimension` proves only equalities supplied verbatim as hypotheses; a separate external Hilbert--Schmidt library does not construct the missing Hardy/Blaschke operator. A disposable local proof attempt first exited 1 on a corrected syntax typo, then exited 0 and proved the abstract rank consequence from a norm-preserving finite-dimensional linear map, confirming the downstream rank algebra is available; it cannot be instantiated on the source carrier because the canonical model space and inverse-inner Hankel map and their kernel/isometry theorems are absent, while taking those conclusions as hypotheses would restate the atom.'
    reentry_condition: Admit canonical upper-half-plane Hardy positive/negative subspaces with Fourier projections, finite Blaschke products and their model spaces with dimension equal to degree including multiplicity, define the compressed inverse-inner Hankel operator from those primitives, and prove its kernel/range and model-space isometry properties; then derive rank, all nonzero singular values equal to one, Hilbert--Schmidt norm squared equal to the degree, and the corresponding channel count.
    blocker_class: missing-prerequisite
