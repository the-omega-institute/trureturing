    justification: "Retrieval preceded quarantine. D5 searches `Blaschke|Hardy|Toeplitz|Hankel|Hilbert.?Schmidt|singularValues|anti.?causal|inverse.?inner` found finite matrix/control Hankel owners, generic finite-dimensional Hankel singular-value machinery, and `FiniteShiftedBlaschkeSymmetry`, but no Hardy-space carrier, positive/negative Fourier subspaces, finite Blaschke model space, compressed inverse-inner Hankel operator, or theorem relating its range to the model space. The four source-planned modules `InverseBlaschkeHankelKernel`, `InverseBlaschkeHankelIsometryOnModelSpace`, `InverseBlaschkeHankelRank`, and `InverseBlaschkeHankelHilbertSchmidtCharge` occur only in the atom CAS text and are absent from D5. Pinned Mathlib searches `Blaschke|HardySpace|Hardy space|Toeplitz|Hankel|HilbertSchmidt|Hilbert.?Schmidt|inner function|model space` found only finite disk-local `Complex.canonicalFactor`, the unrelated Hellinger--Toeplitz theorem, finite-dimensional singular values, and generic orthogonal projections; no Hardy, Toeplitz compression, model-space, Hankel, or Hilbert--Schmidt operator stack exists. Reachable GitHub Lean searches `HardySpace`, `Blaschke`, `Toeplitz`, `Hankel`, and `HilbertSchmidt` found no Hardy-space implementation or Blaschke--Hankel rank theorem: Blaschke hits were Mathlib mirrors/disk factors, Toeplitz/Hankel hits were finite matrices or proposition relays, and the external `XiOffsliceModelSpaceDimension` proves only equalities supplied verbatim as hypotheses; a separate external Hilbert--Schmidt library does not construct the missing Hardy/Blaschke operator. A disposable local proof attempt first exited 1 on a corrected syntax typo, then exited 0 and proved the abstract rank consequence from a norm-preserving finite-dimensional linear map, confirming the downstream rank algebra is available; it cannot be instantiated on the source carrier because the canonical model space and inverse-inner Hankel map and their kernel/isometry theorems are absent, while taking those conclusions as hypotheses would restate the atom. Reentry w73a43 (2026-09-06): refreshed the same D5/Scribe-title regex on HEAD and origin/dev 6ab8e474c63738d432f5e6650d470512cf7f3acc (exit 0); no D5/Blueprint/Freeze delta since pinned 73485cc490. InverseBlaschkeHistoryDeletion explicitly assumes an isometry and model-space finiteness; PhaseFibreClarkBasis assumes orthonormality and full dimension. Pinned Mathlib db584cd6 supplies Lp.fourierTransformₗᵢ, norm_fourier_eq and Schwartz/L2 compatibility, but the exact Hardy/Blaschke search still has no analytic model-space owner (exit 0, near misses only); planned InverseBlaschkeHankel module-name search exits 1. Loogle query \"Blaschke\" returns 0 hits (exit 0); LeanSearch /api/search is unavailable (HTTP 404, curl 56, wait-for-capability). GitHub Lean queries HardySpace, Blaschke, Toeplitz, Hankel and HilbertSchmidt all exit 0: no exact carrier in the searched results; automath XiOffsliceModelSpaceDimension at 60ce0a1548858b977dd8719efb939ceb3e87effe only packages supplied equalities. AIQ-Kitware/aiq-dkps-formalization at 2613ae440fa316b344cc692103a0697dc842779e supplies Apache-2.0 HilbertSchmidt/Space.lean countable column machinery, but not Hardy multiplication, and pins Lean v4.34.0-rc1 / Mathlib 72f9c607 instead of this tree. Local /private/tmp/consensus-rnd/sshx/w73a43/attempt-1/atom1-probe.lean (final exit 1; atom1-probe-v2.log) constructs b_z(x)=(x-z)/(x-conj z), proves its denominator nonzero and norm one for Im z>0, constructs its Lp multiplier and proves norm preservation; the exact remaining goal is `⊢ ↑↑(𝓕 (MemLp.toLp (fun x => boundaryFactor z x * ↑↑f x) ⋯)) ξ = 0` for ξ<0 with Fourier(f)(ξ)=0. The prerequisite is content but out of scope for one deposit: the missing analytic multiplier/support bridge, kernel decomposition and multiplicity-aware model-space theorem precede the operator algebra; a feasible first slice is the one-pole causal convolution formula and its compatibility with the existing L2 Fourier isometry, proving preservation of the nonnegative support subspace."
    reentry_condition: "Admit canonical upper-half-plane Hardy positive/negative subspaces with Fourier projections, finite Blaschke products and their model spaces with dimension equal to degree including multiplicity, define the compressed inverse-inner Hankel operator from those primitives, and prove its kernel/range and model-space isometry properties; then derive rank, all nonzero singular values equal to one, Hilbert--Schmidt norm squared equal to the degree, and the corresponding channel count."
