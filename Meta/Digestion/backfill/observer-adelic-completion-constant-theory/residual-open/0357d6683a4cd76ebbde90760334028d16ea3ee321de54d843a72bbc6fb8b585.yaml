  quarantine:
    justification: "At repository HEAD df917d01752f22da70e95c214184aaea1185c83d, the target CAS and the actual Lean statements were read. Carried: D5/S3/Fourier/CharacterSelection/BinaryCharacterCodeDuality.character_code_eq_relation_space_orthogonal states characterCode K characters = characterOrthogonalComplement K (characterRelationSpace K characters), for Field K, Fintype I, and characters : I -> Module.Dual K V, without requiring V to be finite dimensional. The definitions identify the code with the range of LinearMap.pi characters and relations with the kernel of Fintype.linearCombination. D5/S3/Fourier/CharacterSelection/BinaryCharacterCodeDuality.standard_orthogonal_complement_involutive separately states double orthogonal complementation equals the original submodule. D5/S3/Fourier/CharacterSelection/BinaryCharacterCodeDuality.field_coefficients_are_necessary separately gives the integer counterexample for the Unit-indexed functional x -> 2*x. Their module's Golden/Frozen/state slice exists. Uncarried: identifying the source's competing-orbit selectors with the annihilator of a particular profile code requires a typed competing-orbit family, its profile map, the selector constraints, and a proof linking these objects; these are not arguments or conclusions of those declarations. The connection from the source's prime integer data to the supplied linear functionals is also absent. Neither the arbitrary-field equality nor this one integer counterexample proves the source's assertion that exact elimination generally requires real/complex coefficients or continuous scalar completion. Scope gap: the owner uses the standard bilinear coordinate dot product over an arbitrary field, including in its complex specialization, not an implicitly Hermitian pairing, a topology, an orbit model, or a scalar-completion universal property. Near misses were actually searched using `rg -n -i 'character_code_eq_relation|orthogonal.*selector|selector.*orthogonal|continuous.*scalar|field_coefficients_are_necessary|competing.*profile' D5/ -g '*.lean'` and `rg -n 'theorem (character_code_eq_relation_space_orthogonal|standard_orthogonal_complement_involutive|field_coefficients_are_necessary|finite_moment_elimination)' D5/ -g '*.lean'`. The necessary-sounding name field_coefficients_are_necessary cannot enlarge its displayed integer counterexample into a necessity theorem for real/complex fields. The involution theorem supplies double orthogonals, not the concrete selector realization. D5/S3/Weil/TestFunctions/FiniteMomentElimination.finite_moment_elimination was also opened: it cancels polynomial moments with endpoint delta jets of a compactly supported signed measure and preserves a smooth compactly supported Weil correlation; its real/complex coefficients are supplied by its setup, not proved necessary for all character selectors. Same-source comparisons are grounded in full CAS reads: absorbed-closed sibling 0df187b93b07ba8b4cdc47fb0fe626df7dfb49c9ade983252b4a3f9a7680c495 says '对所有次数不超过 \\(K\\) 的多项式 \\(p\\)：' and '所以这一有限矩消除完全不改变 Weil form。', and its coverage_gids binds the finite_moment_elimination declaration. Its clauses concern polynomial cancellation AND preservation of the Weil form, whereas this atom additionally claims prime-profile realization and scalar necessity. Quarantined sibling 15db1471cfcffe7bb19d0cd5908903cf6a6ea03af0d59241b79233de30785e8b explicitly says '2. 有限角色码消去竞争轨道；' between Chebyshev amplification and tail domination, and also asserts an RH-equivalent finite matrix criterion. Its existing receipt leaves the actual orbit/matrix/tail construction open; it is not evidence that the selector application in this atom is already proved. ASSUMED-UNVERIFIED: no Lean elaboration, compiler, kernel, axiom-closure or current-pin recomputation was run under this read-only brief; no complete ecosystem search or independent rerun of the sibling receipt's historical probes was performed; the proposed source-specific scalar and profile bridges remain unimplemented. Therefore the three algebraic clauses support a multi-clause guard, not whole-atom cover."
    reentry_condition: "Provide a frozen D5 or pinned-library theorem for independently defined source data: an integer data module V_Z, a specified scalar embedding into K, finite linear channels phi : I -> Module.Dual K V_K, actual competing profiles P : O -> (I -> K), and the source's selector realization map. Its statement must identify the prime-data joint profiles with characterCode K phi and prove {s | forall o, sum i, s i * P o i = 0} = characterOrthogonalComplement K (Submodule.span K (Set.range P)); if the intended complex pairing is Hermitian, state and prove the conjugation transport explicitly. Compose those identifications with D5/S3/Fourier/CharacterSelection/BinaryCharacterCodeDuality.character_code_eq_relation_space_orthogonal and .standard_orthogonal_complement_involutive, and use .field_coefficients_are_necessary exactly for its integer counterexample. This still does not discharge the final necessity sentences. To retain them, first specify the source's admissible scalar models and an independently defined required-selector set S_req in an ambient A-coordinate space, A = R or C. Supply a theorem that the source realization has range S_req over A and fails to have range S_req for every uncompleted coefficient model quantified by that source claim; prove its hypotheses from the source data rather than assuming necessity. If that assertion is not intended or cannot be established, append a source erratum replacing the general real/complex necessity claim by the precise algebraic statement and generate a corrected atom. Cover that corrected atom with the named owners and the profile bridge; the unchanged CAS must remain quarantined while its stronger necessity clauses are unproved."
