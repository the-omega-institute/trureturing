  quarantine:
    justification: 'Whole-atom retrieval and construction preceded quarantine. Source context defines the actual Li coefficients from derivatives of `xi`, extends them evenly to integer indices, defines `c_n` as their second difference divided by `2*lambda_1`, and constructs the stationary process from the resulting circle probability measure. D5 searches `stationary.*process|stationary.*Li|Li.*stationary|partial.?sum.*variance|covariance.*c|circleMoment|liCoefficient` found `LiCurvatureCriterion.li_curvature_criterion`, `LiCurvatureFourierRepresentation.li_curvature_fourier_representation`, and circle moment algebra, but the criterion explicitly assumes `liCriterion`, `rhFourierRepresentation`, and `circleHerglotzRepresentation`, while the Fourier theorem starts from an arbitrary probability measure rather than constructing the source zero measure; searches for a canonical full Li coefficient definition found none. Pinned Mathlib searches `Li coefficient|Keiper|Bombieri.Lagarias|RiemannHypothesis.*nonneg` and `stationary process|wide.sense stationary|covariance function|Herglotz.*circle|Bochner.*sequence|Toeplitz.*measure` found no Li criterion, stationary-process carrier, or circle Herglotz representation theorem. The same searches over installed non-Mathlib packages plausible, proofwidgets, batteries, Cli, aesop, importGraph, LeanSearchClient, and Qq returned no match. Reachable ecosystem retrieval in `anthropics/zeta-23-lean` at `2bafb8c88f177284a2123b5fefa2ff84e2365eb6` found no Li coefficient, stationary-process, circle Herglotz, or Toeplitz-to-measure declaration. Local probe `/private/tmp/w73c24-atom2-probe.lean` constructed the source derivative-defined `canonicalLiCoefficient`, normalized curvature, and canonical circle process `Y_k(z)=z^k`, then exited 1 after elaboration with exact forward goal `hRH : RiemannHypothesis |- exists mu, IsProbabilityMeasure mu and integral normSq(z^0) dmu = 1 and (forall j k : Int, integral z^j * star(z^k) dmu = canonicalLiCurvature(j-k)) and forall n, canonicalLiCoefficient n = canonicalLiCoefficient 1 * integral normSq(sum k in range n, z^k) dmu`, and exact reverse goal consisting of that same stationary-process witness as the premise and `|- RiemannHypothesis`.'
    reentry_condition: Freeze the canonical full Li coefficient sequence from `xiReading`, its equivalence between RiemannHypothesis and coefficient nonnegativity, an RH-derived probability measure whose circle moments are the normalized canonical Li second differences, and the converse circle Herglotz representation needed to recover those coefficients; then apply the existing geometric-polynomial energy identities to the circle-power process.
    blocker_class: missing-prerequisite
