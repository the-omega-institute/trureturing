  quarantine:
    justification: "Missing-prerequisite after exact local construction and searches. Existing tracked facts are D5/S0/Carrier/Euclidean.lean:156 (EuclideanDomain GoldenInt), D5/S0/Carrier/PrincipalIdeal.lean:14,18 (principal-ideal/PID and UFD consequences), D5/S0/Carrier/AlgebraicModel.lean:72 (goldenAdjoinRootEquiv), and D5/S1/Scale/Embedding.lean:16,37 (embedding and embedding_phi); Lean synthesis of Algebra ℤ GoldenInt succeeds through Ring.toIntAlgebra and Lean synthesis of IsDedekindDomain GoldenInt succeeds through PID. Pinned Mathlib signatures are generic Ideal.primesOver over CommSemiring plus Algebra at .lake/packages/mathlib/Mathlib/RingTheory/Ideal/Over.lean:356-373, Ideal.absNorm requiring IsDedekindDomain plus Module.Free ℤ S at .lake/packages/mathlib/Mathlib/RingTheory/Ideal/Norm/AbsNorm.lean:200-214, and NumberField.InfinitePlace requiring only Field at .lake/packages/mathlib/Mathlib/NumberTheory/NumberField/InfinitePlace/Basic.lean:54. Exact local probes for Module.Free ℤ GoldenInt, Module.IsTorsionFree ℤ GoldenInt, Algebra.IsIntegral ℤ GoldenInt, and NumberField (FractionRing GoldenInt) fail; an ad hoc Fin 2 coordinate-basis probe can prove freeness, so the gap is an absent tracked bridge rather than mathematical impossibility. D5 and pinned-Mathlib rg searches, plus git ls-remote https://github.com/leanprover-community/mathlib4.git HEAD and a GitHub code search for GoldenInt primesOver (which returned no usable declaration), found no prime-ideal decomposition/norm/phase owner, Hecke character, or Euler-product owner. Existing D5 prime classification covers only the Legendre split/inert/ramified trichotomy for GoldenInt elements. The removed goldenLocalPrimePlaces list hard-coded target norm/phase rows and cannot be source coverage."
    reentry_condition: "A tracked D5 bridge must provide the GoldenInt module basis/torsion and integral or finite-algebra facts needed by the chosen route; construct the actual prime ideals above p as Ideal.primesOver (Ideal.span {(p : ℤ)}) GoldenInt or an equivalent proved set; prove split existence of two distinct ideals with norm p and opposite embedding phases, inert existence and uniqueness of one ideal with norm p^2 and zero phase difference, and the ramified ideal above 5 with norm 5 using Ideal.absNorm; define a prime-ideal logarithmic phase from the existing embedding/conjugation; define the Hecke character and prove the local Euler-factor identity as a product over those actual ideals. If the FractionRing/InfinitePlace route is selected, also track the Field and ring-of-integers identification needed for that route; NumberField is not a prerequisite of the generic APIs."
    blocker_class: missing-prerequisite
