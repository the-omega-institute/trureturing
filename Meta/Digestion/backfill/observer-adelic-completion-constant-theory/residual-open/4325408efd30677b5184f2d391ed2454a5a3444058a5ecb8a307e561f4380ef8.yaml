    justification: "Retrieval preceded quarantine. The source fixes an arbitrary positive u0, constructs S=G'/G and the Chebyshev trace moments c_n(u0) from the completed-zeta inverse-square spectrum, and requires the whole public result `RiemannHypothesis iff S(u0)>0 and every Toeplitz matrix is positive semidefinite`, together with `abs(c_n(u0))<=1`. D5 searches `Cayley.*Toeplitz|Toeplitz.*Cayley|single scale|phase moment|S(u_0)`, `Toeplitz|moment.*matrix|cayley.*moment|Li criterion`, and `meromorphic.*rigid|pole.*residue.*rigid|Hausdorff moment|inverse-square spectrum` found the generic Cayley moment family and `LiCurvatureCriterion.circle_moment_toeplitz_posSemidef`, but no source-specific S/c construction or one-scale meromorphic recovery. The frozen `li_curvature_criterion` is not an exact owner: it states a different Li-sequence criterion and explicitly assumes its Li criterion, RH Fourier representation, and all-orders circle Herglotz representation; it also lacks S(u0) and the bounded-phase clause. Pinned Mathlib and non-Mathlib package searches for circle Herglotz/Toeplitz measure representation, Hausdorff moments, and meromorphic pole-residue rigidity found only Herglotz-Riesz kernels and generic positivity, not measure existence or the xi spectral bridge. A17 GitHub Lean-code searches `Toeplitz moment Herglotz`, `Hausdorff moment sequence`, and `meromorphic rigidity poles residues` found no complete theorem; a csd-lean4 hit proves only Hausdorff moment determinacy, and Loogle returned unknown identifier `Toeplitz`. Local probe `/private/tmp/w73c4-atom2-probe.lean` elaborated the D5 Toeplitz, Li, and Cayley partial owners but exits 1 on missing `singleScaleCayleyToeplitzCriterion`. Treating the frozen representation hypotheses as premises would assume the source's converse, while defining S or c from a target measure would violate the source construction and definitional-substitution rules."
    reentry_condition: "Freeze source-faithful definitions of G, S(u), rho_u, Y_u, and c_n(u) from xiReading, prove an all-orders circle Toeplitz moment representation and symmetric Hausdorff pushforward, and prove the completed-zeta logarithmic derivative's meromorphic pole/residue rigidity recovers a positive inverse-square spectrum at arbitrary u0>0; expose the bounded-phase consequence publicly."
    blocker_class: missing-prerequisite
