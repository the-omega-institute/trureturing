    justification: 'Retrieval preceded quarantine. The source context constructs S_j on the exact Hardy-space carrier from a normalized finite Blaschke product B, its model space K_B, and an orthonormal basis, then requires both Cuntz relations, the m>=2 O_m representation, and the shared m=1 unitary/nontrivial-inner countermodel. D5 queries Blaschke|Cuntz|HardySpace|model space|inner factor|weighted composition and Isometry|Unitary|adjoint|OrthonormalBasis found only unrelated scalar Blaschke factors and generic Hilbert-space infrastructure, with no exact or partial Hardy branch owner. Pinned Mathlib queries Cuntz|HardySpace|Hardy space|finite Blaschke|model space|inner function|weighted composition found only Analysis/Complex/CanonicalDecomposition.lean for meromorphic canonical factors, not Hardy/model spaces or Cuntz representations. Reachable A17 GitHub Lean searches Cuntz, HardySpace, Blaschke, and inner function all exited 0; the first two returned no hits and the latter two returned only canonical-factor, polynomial, or prose/calculus results. Local probe /private/tmp/w73d4-atom1-probe.lean exited 1: Complex.canonicalFactor and ContinuousLinearMap.adjoint elaborated, while HardySpace, CuntzAlgebra, InnerFunction, and WeightedCompositionOperator were unknown. Defining those absent source carriers locally as the desired decomposition, or replacing them by arbitrary operators already satisfying the target relations, would violate carrier fidelity and definitional substitution.'
