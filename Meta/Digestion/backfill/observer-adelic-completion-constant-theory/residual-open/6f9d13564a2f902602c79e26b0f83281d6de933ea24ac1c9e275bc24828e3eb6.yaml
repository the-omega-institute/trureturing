    justification: "Retrieval preceded quarantine. The source context defines the central reciprocal-zero moments from the even derivatives of the canonical completed xi function, defines both Hankel families, invokes the Stieltjes moment theorem for the RH equivalence, and then transports those matrices through a nonvanishing toroidal period/twist chart. D5 queries `RiemannHypothesis`, `Hankel`, `PosSemidef`, `Stieltjes`, `toroidal`, `center jet`, and body-shape intersections found the exact partial owners `FiniteToroidalFrameReconstruction.finite_toroidal_frame_reconstruction`, `ToroidalCechCompletion.toroidal_cech_completion`, and `HankelJacobiDeterminant.hankelMatrix`, plus generic finite atomic Hankel positivity; no declaration constructs the completed-xi reciprocal moments or proves RH iff both of their Hankel families are positive semidefinite. Pinned Mathlib queries `Hankel`, `Stieltjes moment`, `moment sequence`, and a `RiemannHypothesis`/`PosSemidef` body intersection found no matching theorem. The installed non-Mathlib packages plausible, proofwidgets, batteries, Cli, aesop, importGraph, LeanSearchClient, and Qq returned no matching declaration. The reachable LeanSearch query for the full criterion exited 0 and returned only the generic `RiemannHypothesis`, `Matrix.PosSemidef`, and spectral positivity APIs. Local probe `/private/tmp/consensus-rnd/sshx/w73d25/attempt-1/ToroidalHankelProbe.lean` compiled the chart quotient identity and toroidal transport, then exited 1 only at the exact unsolved goal `RiemannHypothesis <-> AllHankelPositive (centralReciprocalMoments xiReading)`. Taking that equivalence as a premise would restate the analytic core, while defining the moments or matrices from the target would violate carrier fidelity and the definitional-substitution rule."
    reentry_condition: "Freeze source-faithful central reciprocal-zero moments constructed from the even jet of `xiReading`, and prove the canonical two-family Hankel-Stieltjes criterion `RiemannHypothesis <-> forall N, H0(N).PosSemidef and H1(N).PosSemidef`, including the finite negative spectral witness when RH is false; then apply the existing toroidal period/twist reconstruction to transport the complete criterion to every legal local chart."
