  quarantine:
    justification: "Missing canonical xi partial-fraction and positivity-converse prerequisites. D5 search `positive.?definite.*kernel|Kxi|half.?plane.*kernel|logDeriv.*kernel|Hadamard|zero.?free.*half` found the canonical entire `xiReading`, zero/reflection carriers, the generic frozen Gram theorem `positivity_chart_collapse`, and the assumption-driven `riemann_poisson_density`, but no source kernel built from `logDeriv xiReading`, no symmetric Hadamard expansion for that logarithmic derivative, and no theorem deriving right-half-plane zero-freeness from its positive matrices; `SpectralHilbert` is instead the Dirichlet-series zeta kernel. Pinned Mathlib search `Hadamard.*(zeta|xi)|completedRiemannZeta.*product|logDeriv.*zero|positive.?definite.*kernel` hit generic logarithmic-derivative and RKHS/Gram APIs only, with no xi-specific owner. GitHub Lean searches for `positive definite kernel` with xi, `positive semidefinite kernel` with zeta, `RiemannHypothesis kernel xi`, and `RiemannHypothesis logDeriv` returned empty sets; `Hadamard riemannZeta` found `anthropics/formal-math`'s xi-prime explicit-formula development, whose inspected interface and repository search contain no positive-semidefinite xi kernel criterion and concern xi-prime zeros rather than this theorem. Local Lean probe `/private/tmp/w72a22-kernel-probe.lean` proves with exit 0 the source's per-zero factorization under `rho + conj rho = 1`; the proof attempt stalls when replacing the canonical xi logarithmic derivative by the convergent zero sum and in the independent reverse analytic bridge."
    reentry_condition: "Prove a multiplicity-aware symmetric Hadamard logarithmic-derivative expansion for canonical `xiReading`, its square-summable feature realization on the right half-plane under RH, and a theorem that positivity of the resulting canonical kernel forces xi to be zero-free there."
    blocker_class: missing-prerequisite
