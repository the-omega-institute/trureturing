  quarantine:
    justification: "The whole theorem needs two source-specific bridges absent from the pinned environment: the completed-zeta logarithmic derivative must equal the countable real-zero resolvent sum under RiemannHypothesis, with enough convergence to pass finite determinants to the stated strictly ordered zero-subset Cauchy-Binet tsum; and positivity of every finite kernel matrix must imply RiemannHypothesis. D5 search `RiemannHypothesis|Herglotz|Nevanlinna|posSemidef|det.*sum|zero_sum_inv_sq` found only partial owners `Zeta23.RH_implies_on_line`, `Zeta23.WeilEF.zero_sum_inv_sq`, generic Gram positivity, and Cayley kernel congruence, but no spectral identity or reverse implication. Pinned Mathlib search `CauchyBinet|Binet|det.*sum|posSemidef_gram|RiemannHypothesis|Herglotz` found `Matrix.posSemidef_gram` plus square determinant identities, but no rectangular or countable Cauchy-Binet theorem and no completed-zeta Pick criterion. Third-party Lean search through GitHub at 2026-09-03 returned zero for `RiemannHypothesis Herglotz`, `Nevanlinna riemannZeta`, and `posSemidef RiemannHypothesis`; `Cauchy-Binet` found only the generic finite Apache-2.0 project `leanprover/hex-determinant` at b9b21e295175885e2ee20728c8f8a13d00e36124, whose v4.34.0-rc2 toolchain differs from this repository and which contains neither zeta bridge. Local Lean probe `/private/tmp/w73c23-atom207-probe.lean` elaborated the forward zero-location and generic Gram declarations, then exited 1 because the required zero-resolvent and reverse-criterion declarations are unknown."
    reentry_condition: "Provide frozen declarations deriving the completed-zeta real-zero resolvent representation from Mathlib RiemannHypothesis with the summability needed for the displayed countable Cauchy-Binet determinant formula, and deriving Mathlib RiemannHypothesis from positivity of all finite matrices of that same logarithmic-derivative kernel."
    blocker_class: missing-prerequisite
