    justification: "Half of clause 1789.4 is already frozen, by a route that does not use the Li criterion at all. Frozen D5/S3/Weil/Probability/CanonicalLiCurvatureZeroFree states canonical_curvature_posSemidef_implies_rh : (forall N, (toeplitzMatrix canonicalLiCurvature N).PosSemidef) -> RiemannHypothesis, together with its contrapositive companion in the same module, canonical_li_second_difference_bound_implies_rh and canonical_curvature_second_difference_bound; its digest records an explicit finite Toeplitz-to-growth-to-RH proof with no external Li criterion. The canonical sequence it ranges over is frozen in D5/S3/Zeros/Endpoints/CanonicalLiLocalExpansion (canonicalLiCoefficient defined from iteratedDeriv of s^n * Complex.log (xiReading s) at 1, plus canonical_li_local_expansion, canonical_li_zero, canonical_li_one_pos). That module entered dev on 2026-09-07 and this record was written on 2026-09-08, so the previous justification's search conclusion was already false when it was recorded. The earlier reentry path, discharging the liCriterion, curvatureRecurrence, rhFourierRepresentation and circleHerglotzRepresentation binders of D5/S3/Weil/TestFunctions/LiCurvatureCriterion.li_curvature_criterion, is therefore not the only route and is not the cheapest one; of those binders only liZero and liOneNonnegative are dischargeable today from the frozen canonical facts."
    reentry_condition: Prove the converse direction RiemannHypothesis -> forall N, (toeplitzMatrix canonicalLiCurvature N).PosSemidef for the canonical curvature, then pair it with the frozen canonical_curvature_posSemidef_implies_rh to close the iff of clause 1789.4. Confirm first that canonicalLiCurvature is the source's c, that is the normalized second difference of canonicalLiCoefficient divided by 2 * canonicalLiCoefficient 1.
