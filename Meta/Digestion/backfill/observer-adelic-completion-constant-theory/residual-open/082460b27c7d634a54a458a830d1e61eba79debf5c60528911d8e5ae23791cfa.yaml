  quarantine:
    justification: "Retrieval preceded quarantine. D5 searches `li_curvature|LiCurvature|normalizedLi|RiemannHypothesis|PositiveDefinite|toeplitzMatrix|normal convergence|Herglotz` found `LiCurvatureCriterion.li_curvature_criterion` and its finite Toeplitz machinery, but that theorem accepts arbitrary functions `c` and `liCoefficient` and assumes the Li criterion, initial coefficient facts, normalized second-difference recurrence, RH Fourier representation, and circle Herglotz representation; no D5 owner constructs the source's actual xi-derived Li coefficients and curvature or proves those bridges under local normal convergence. Pinned Mathlib searches `RiemannHypothesis|Li coefficient|LiCriterion|Herglotz` found only the proposition `RiemannHypothesis` and analytic Herglotz--Riesz kernels, with no Li coefficient, Li criterion, circle moment representation, or RH/Toeplitz theorem; live Loogle likewise returned only the proposition. A17 GitHub Lean searches `RiemannHypothesis Li`, `Li criterion`, `LiCoefficient`, `Toeplitz RiemannHypothesis`, and `Herglotz Toeplitz` found an axiom-based Li theorem in `gobbleyourdong/open_problems`, a constant-zero placeholder `LiCoefficient` in `TristenHarr/thegoldenalgebra`, and proposition-only wrappers in `the-omega-institute/automath` that assume the required bridges; none is an admissible canonical implementation. Local probe `/private/tmp/w73c15-li-probe.lean` imported the closest D5 owner and exited 1 with six unresolved goal groups: the Li criterion, coefficient-zero fact, first-coefficient nonnegativity, normalized second-difference recurrence, RH-to-circle-moment representation, and Toeplitz-to-circle Herglotz representation. Adding those as binders would replace the source's actual coefficient sequence by an abstract proxy."
    reentry_condition: Construct the canonical xi-derived Li coefficients and their normalized second-difference curvature under the source's standard Li zero expansion and local normal convergence scope, then prove the Li criterion, initial coefficient facts, curvature recurrence, RH Fourier representation, and circle Herglotz representation needed to apply the existing finite Toeplitz owner.
    blocker_class: missing-prerequisite
