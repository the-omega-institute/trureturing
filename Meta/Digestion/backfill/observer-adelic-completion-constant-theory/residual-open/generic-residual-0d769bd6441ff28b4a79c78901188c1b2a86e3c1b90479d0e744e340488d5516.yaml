    justification: "Retrieval preceded quarantine. The in-scope source definitions were read: `D_p(theta)` is the centered local Poisson symbol, `C_Y` is the sum over primes `p<=Y` of `(log p) D_p(x log p)`, and `V_Y=2 sum_{p<=Y}(log p)^2/(p-1)`; the source also asserts independent Haar phases and the Lindeberg condition. D5 searches `central.?limit|lindeberg|kronecker.?weyl|equidistribut|prime.?cluster|sum.*prime.*log|primeCounting` found no exact owner: the closest prime-density modules expose only elementary prime-counting bounds and unrelated Euler-product summability. Pinned Mathlib searches found `ProbabilityTheory.tendstoInDistribution_inv_sqrt_mul_sum`, which requires independent identically distributed variables and therefore does not cover this non-identically distributed prime triangular array, and `Chebyshev.primeCounting_sub_theta_div_log_isBigO`, but no Lindeberg-Feller theorem, finite prime-log Kronecker-Weyl time-average bridge, prime-number theorem asymptotic sufficient for either weighted partial sum, or the combined cluster law. GitHub Lean code searches `Lindeberg language:Lean`, `Kronecker Weyl language:Lean`, `prime number theorem language:Lean`, and `weighted prime sum language:Lean` exited 0; the first returned no results, the second only unrelated uses of `Weyl`, and the latter two only generic prime files or unrelated counting frameworks, with no exact result or usable A17 port candidate. Local probe `/private/tmp/w72c20-atom2-probe.lean` imported Mathlib's central-limit and Chebyshev modules: the i.i.d. CLT and Chebyshev big-O theorem elaborated, then Lean exited 1 with `error(lean.unknownIdentifier): Unknown identifier` for `lindebergFellerCentralLimitTheorem`, `kroneckerWeylPrimeLogTimeAverage`, `primeWeightedVarianceAsymptotic`, `primeWeightedMaximumAsymptotic`, and `primeClusterCentralLimitLaw`. Additionally, the atom's consequence `两者相差指数级别的状态体积` has no in-scope definition of state volume and cannot be made a public conjunct without inventing semantics."
    reentry_condition: "Freeze a non-identically distributed Lindeberg-Feller central limit theorem, a Kronecker-Weyl transfer from prime-log time averages to the joint Haar law, and prime-number-theorem partial-summation results proving the stated variance and maximum asymptotics; also define the claimed state-volume comparison in source scope or remove that undefined consequence from the theorem atom."
    blocker_class: missing-prerequisite
