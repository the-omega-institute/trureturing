    justification: "类别为 (a)：虽有工作评价散文，373.1 量化全部 psi in C_c^infty(R)，明确要求 <A_infty,psi*tilde(psi)> >= sum_p log(p)*<psi,[P_(p^(-1/2))(U_p)-I]psi>，并断言这个全称命题等价于 RH。已读 CAS、账目和源卷 363.2 至 364.2、素数 Poisson 定义及 373.1；账目 coverage_gids 为空，receipts 只有空 scribe、空 unresolved_subitems，无 cover_disposition、无 chain_atoms。第一层在 D5/**/*.lean 实跑 rg 的 prime.?archimedean|source.?identity|prime_poisson_resummation|unitaryPoissonOperator 等模式，阅读命中声明及冻结条目。GID D5/S3/Weil/Scattering/PrimePoissonResummation 的 prime_poisson_resummation 已给出真实 L2 平移 U_p 和 Poisson 算子的单素数双向幂级数重求和恒等式；它没有 A_infty、没有所有素数合并后的下界、更没有 373.1 的无条件非负性。GID D5/S3/Weil/Separator/PrimeArchimedeanPoincareCriterion 的 rh_iff_primeArchimedeanPoincare 已给出 RH 与 prime-Archimedean 能量不等式的等价，GID D5/S3/Weil/Separator/ArchimedeanConvergence 的 rh_iff_primeSidePositivity 给出显式公式右侧在卷积平方上的非负判据；但它们量化的是 TestFunctions.lean 中带 even' 字段的 WeilTestFunction，不能直接覆盖源卷全部复值紧支撑光滑 psi。其 poleTerm、primeTerm、archimedeanTerm 的组合与源卷临界分布 A_infty 及算子素数和的精确对应也尚未找到冻结声明，尤其不能忽略原点有限部和 delta_0 正规化。GID D5/S3/Weil/ZetaBridge/PrimeArchimedeanEnergyIdentity 的 prime_archimedean_energy_identity 以及 GID D5/S3/Weil/Separator/UnconditionalExplicitFormula 的 explicitFormula_unconditional、energyIdentity_unconditional 是等式，后者已消去收敛前提，但仍只在同一偶测试空间，且不证明能量非负；smallSupport_poincare_reduction 只将 exp(2L)<2 的情形化约到另一待证不等式。复核发现 GID D5/S3/Weil/ZeroInfinitude/ExplicitFormulaObstruction 的 nonempty_zeroData 已有冻结证明，故 ZeroData 的存在不是本次缺口，部分旧文件注释不能覆盖这一新证据。没有将偶测试 RH 等价句误认作本 atom 全测试且固定源正规化的完整等价子句，也没有将单素数恒等式误认作整体不等式载体。第二层实际在 mathlib db584cd6d46c92f209a44c0f1c829460d327499d 检索 prime.?archimedean、RiemannHypothesis；前者无相应声明，后者命中 NumberTheory/LSeries/RiemannZeta.lean 的 RiemannHypothesis 定义，邻接 riemannZeta_one_sub 为函数方程。定义和函数方程都不证明源正性或全测试算子判据。第三层已联网，经 NyxID/Tavily 实跑 site:github.com Lean \"Prime Archimedean\" Weil positivity 及 Lean formalization Weil criterion Riemann Hypothesis。前者返回 Massot 的 first-proofs 教学、InfinitePrimes、IMOLean、openai/PrimeGaps186 等，未返回目标算子不等式；后者返回 bhgomes/lean-riemann-hypothesis，其摘要说明将 RH 陈述形式化为类型，以及 MathOverflow 的 Formalisation of the Riemann Hypothesis 讨论，均未给该不等式的 Lean 证明。只审阅搜索结果摘要，未检出或编译这些项目。具体缺的定理是：对由 363.3 固定且在原点按仓库 Weil convention 正规化的真实 A_infty，证明 theorem prime_archimedean_source_nonnegative : forall psi : Real -> Complex, ContDiff Real top psi -> HasCompactSupport psi -> primePoissonEnergy psi <= archSourcePair (psi * tilde psi)，无 even、RH 或正性假设；其中 tilde psi(t)=conj(psi(-t))，U_p psi(x)=psi(x-log p)，P_r(U)=(1-r^2)(I-rU)^(-1)(I-rU*)^(-1)，primePoissonEnergy 是所有素数的 log(p) 加权实内积和。必须证明该和有意义，利用紧支撑将相关项截为有限 prime powers，不能借未证可和性的 tsum 默认值；同时需要该全测试命题与 RH 的精确等价桥。此陈述中的 archSourcePair、primePoissonEnergy 仅为上述固定数学对象的示意名，尚非已类型检查 API。新声明若假设 hRH/hPos，或把 A_infty 定义成右侧再加平方，便假设或改写了待证结论；把测试类型限制成偶函数也会删掉全称域。诚实边界：没有编译或重验传递公理，未证明一般测试空间到 L2 的全部接口、原点正规化桥或 RH 到一般测试正性的补足；第三方源码版本、许可证、兼容性及证明依赖未审计，有限检索不代表穷尽生态。在已检查范围内无完整子句载体。"
    reentry_condition: '提供冻结的 D5 或钉版库定理，陈述为：forall psi : Real -> Complex, ContDiff Real top psi -> HasCompactSupport psi -> sum_{p prime} log(p)*Re(inner psi ((P_(1/sqrt(p))(U_p)-I) psi)) <= Re(<A_infty,psi*tilde(psi)>)。A_infty 须与源卷 363.3 及仓库固定的原点有限部、delta_0 常数对应；U_p 为真实 log(p) 平移，P 为 PrimePoissonResummation.unitaryPoissonOperator，不得假设 RH、even psi 或目标非负性，并须证明求和与函数嵌入有效。此定理与 prime_poisson_resummation 的单素数恒等式及已证明的紧支撑有限和转换复合，直接得到 373.1 的全部测试函数版本，届时重审数学不等式子句。完整接上“这一个不等式就是 RH”还须冻结全测试的 RH iff 上述全称不等式桥：用 nonempty_zeroData 供给 ZeroData，以明确证明的 A_infty/素数项正规化对应接 rh_iff_primeSidePositivity 得到向 RH 的方向，并对一般 psi 证明 RH 推出源卷二次型非负以完成反向；不能把偶测试判据直接当成一般测试判据。'
