  quarantine:
    justification: "Missing-prerequisite after whole-clause retrieval for Theorem 1812.1 under RH. D5 searches `RiemannHypothesis|criticalLineHypothesis|xiReading|logarithmic|Herglotz|Schur|Schwarz|Pick|deriv` found the partial owners `GlobalLogarithmicGaugeCriterion.global_logarithmic_gauge_criterion` and `ShiftedHerglotzCriterion.shifted_herglotz_criterion`: the former derives zero-freeness and a global analytic logarithm on the right half-plane, while the latter proves generic positive-Cayley equivalence, but neither derives strict positivity of `Re (xi'/xi)` or the arithmetic Schur property from RH. Pinned Mathlib searches in `.lake/packages/mathlib/Mathlib` for `RiemannHypothesis|SchwarzPick|Schwarz.Pick|norm_deriv_le|Herglotz|xi` found `Complex.norm_deriv_le_div_of_mapsTo_ball` and the definition of `RiemannHypothesis`, but no arithmetic positivity bridge and no exact whole statement. Third-party retrieval found Apache-2.0 `girving/ray` commit `753f7131cf96f4651294de4398368abf136c34de`, whose `Ray/Schwarz/SchwarzPick.lean` supplies the generic `ContDiffOn.norm_deriv_le_div_of_mapsTo_unit_ball`; it has no completed-zeta or RH bridge. Local proof analysis applies the available zero-free/logarithm and generic Cayley owners but stops at the unavailable implication `RiemannHypothesis -> forall s, 1/2 < s.re -> 0 < Re (deriv xiReading s / xiReading s)`; adding that implication as a premise would drop the source scope clause instead of deriving it."
    reentry_condition: Freeze a theorem deriving the arithmetic Herglotz positivity, or equivalently the arithmetic Schur-map property, from Mathlib's `RiemannHypothesis` for the completed-zeta logarithmic derivative on `Re s > 1/2`; then transport the generic Schwarz-Pick derivative bound back to the source variable and expose both displayed formulas publicly.
    blocker_class: missing-prerequisite
