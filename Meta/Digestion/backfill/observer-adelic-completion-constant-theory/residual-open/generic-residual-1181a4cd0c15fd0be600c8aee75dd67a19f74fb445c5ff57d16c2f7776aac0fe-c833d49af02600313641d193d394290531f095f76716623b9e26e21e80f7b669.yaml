  quarantine:
    justification: "Retrieval preceded quarantine. The in-scope source defines `F_{t,a}(z)=1/(t-z+ia)`, states its one-sided exponential integral converges for `Im z<a`, and assumes the local-detection scale `a<|delta|<1/2`; the scalar obstruction `a<1/2` is formalizable, but this atom additionally requires the public clause `witness 在离线零点附近是有效的`. D5 searches `rational resolvent|resolvent witness|Paley.Wiener|test object|effective near|strip obstruction|off.?line.*witness` found `OffLinePickWitness.off_line_one_point_pick_witness`, `FinitePaleyWienerInterpolation.finite_exact_paley_wiener_interpolation`, and the canonical `WeilTestFunction`/`fourierLaplace`; the first uses a shifted finite-difference observer rather than the source rational resolvent, and none defines the source's nearby-effectiveness predicate or proves the rational witness is a Weil test object. Pinned Mathlib searches `Paley.Wiener|rational resolvent|resolvent witness|Weil test object|effective near` found no semantic bridge; `integrableOn_exp_mul_complex_Ioi` and `integral_exp_mul_complex_Ioi` supply generic half-line exponential integration only. Reachable GitHub Lean code searches `rational resolvent`, `Paley-Wiener resolvent`, `critical strip resolvent`, and `off-line zero witness` returned no exact result or A17 port candidate. Local probe `/private/tmp/w72e16-fallback3-probe.lean` proves from `a<|delta|<1/2` that `a<1/2` and not `1/2<a`, while required identifiers `RationalResolventWitness`, `EffectiveNearOffLineZero`, `WeilTestObject`, and `paleyWienerRegularization` each fail with `lean.unknownIdentifier` (exit 1). Depositing only the scalar inequality would omit the quoted public clause; substituting the finite-difference witness would change the source object."
    reentry_condition: "The source or a frozen D5 owner defines the rational resolvent witness and a falsifiable nearby-effectiveness predicate on the off-line-zero carrier, then proves that effectiveness together with the local-versus-uniform strip inequality without replacing the rational witness by the existing finite-difference observer."
    blocker_class: multi-clause-guard
