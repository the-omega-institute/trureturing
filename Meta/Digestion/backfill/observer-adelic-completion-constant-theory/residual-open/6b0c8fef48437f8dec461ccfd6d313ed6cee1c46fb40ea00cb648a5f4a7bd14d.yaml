  quarantine:
    justification: Retrieval preceded quarantine. The in-scope source constructs the scale-a Cayley nodes, weights, and curvature profile from the nontrivial zeta zeros, while its depth audit at lines 175544-175554 says the RH equivalence still needs the standard zero expansion plus local meromorphic rigidity, arbitrary-scale positivity still needs the generalized zero-sum normalization, and positivity of the actual Li-Clark moments is not yet proved. D5 name and body-shape queries `RiemannHypothesis|positive.?definite|moment.?sequence|Toeplitz|Cayley|Li.*Criterion`, the Cayley coordinate body, and the `4*a^2` weight shape found the canonical scale transport, circle-moment Toeplitz positivity, half-scale Fourier representation, and conditional `LiCurvatureCriterion.li_curvature_criterion`, but no normalized zeta-zero curvature sequence at every bound positive scale and no whole RH equivalence; the conditional criterion instead takes Li's criterion, recurrence, RH Fourier representation, and infinite Herglotz representation as premises. Pinned Mathlib searches under `.lake/packages/mathlib/Mathlib` for `RiemannHypothesis|LiCoefficient|Herglotz|Bochner.*circle|Toeplitz.*PosSemidef|moment.*PosSemidef` found the RH definition and Herglotz-Riesz Poisson kernels but no Li coefficient criterion, circle-moment representation converse, or multiscale RH theorem. Resolved non-Mathlib Lake packages had no matching declaration. Reachable A17 GitHub Lean-code searches `RiemannHypothesis Toeplitz`, `Li coefficient`, `Herglotz Toeplitz moment`, and `RiemannHypothesis PosSemidef` found only `psinary-sketch/SIDE-li-map` for a first Li-coefficient identity; repository-scoped searches there found neither RH nor PosSemidef. Local probe `/private/tmp/w73a20-atom1-probe.lean` imported and resolved the five available D5 components, then exited 1 with `lean.unknownIdentifier` for `generalizedLiZeroSumNormalization`, `scaleLiCurvatureMomentRepresentation`, `positiveDefiniteMomentGeneratingHolomorphic`, and `scalePositiveStateRHIff`. Assuming those bridges or replacing the actual zero construction by an abstract sequence would restate the criterion or change the carrier.
    reentry_condition: Provide frozen D5 or A17-admissible theorems constructing the normalized scale-a Li curvature sequence from exhaustive multiplicity-weighted nontrivial zeta zeros for every bound a>0, proving its RH circle-moment representation, and proving the converse by a no-cancellation local meromorphic-rigidity argument; then derive the scale-name independence and half-scale chart clauses publicly.
    blocker_class: missing-prerequisite
