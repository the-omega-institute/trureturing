  quarantine:
    justification: "Retrieval preceded quarantine. D5 queries `cyclic.*operator|cyclic.*vector|inverse.*square.*root|spectrum.*moment|spectral.*moment|moment.*spectral|support.*spectrum` found moment tomography and measure-separation results but no canonical cyclic positive-operator model whose inverse square root has exactly the nontrivial zeta ordinates. Pinned Mathlib queries with the same shapes found bounded C-star functional-calculus results such as `CFC.conjugate_rpow_neg_one_half` and GNS cyclic-vector infrastructure, but no Stieltjes-moment spectral reconstruction on the source carrier, no unbounded positive self-adjoint inverse-square-root operator theorem, and no identification of its spectrum with zeta ordinates. The spec A17 third-party route is `wait-for-capability` because public-source, immutable-revision, and license-compatibility admission predicates remain open. The local proof decomposition stops at three absent public bridges: determinacy of the source compactly supported moment measure, passage to the cyclic subspace generated by `v`, and atomic identification of support points `gamma^-2` before inverse-square-root spectral mapping. Moreover, the source's displayed witness assumes only a Hilbert space, `U >= 0`, and the moment equalities: adjoining an orthogonal positive summand with `v` extended by zero preserves every displayed premise and every moment while adding arbitrary extra spectrum to `U^-1/2`, so recovery is not a consequence for an arbitrary witness without a cyclic/minimality clause."
    reentry_condition: "Construct the canonical cyclic positive self-adjoint realization of the source inverse-square moments, prove its spectral measure is the unique compactly supported atomic measure at `gamma^-2`, prove zero is excluded on the cyclic support, and establish the inverse-square-root spectral mapping to exactly the zeta ordinates; expose cyclicity or the canonical cyclic restriction in the public statement."
    blocker_class: missing-prerequisite
