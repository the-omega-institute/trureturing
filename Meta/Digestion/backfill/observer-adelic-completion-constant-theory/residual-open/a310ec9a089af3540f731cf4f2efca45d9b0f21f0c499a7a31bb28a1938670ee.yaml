  quarantine:
    justification: 'Retrieval preceded quarantine. D5 queries `RiemannHypothesis|Li.?Clark|Toeplitz|circleMoment|pure.?point|atomic measure` found partial owners `LiCurvatureCriterion.li_curvature_criterion`, `ExactTruncatedHaarFloor.exact_truncated_haar_floor`, and `FiniteWindowGlobalBoundary.finite_window_positive_global_boundary`, but no theorem constructing the source Li-Clark moments or measure from `RiemannHypothesis`; `li_curvature_criterion` explicitly requires `rhFourierRepresentation : RiemannHypothesis -> exists mu, IsProbabilityMeasure mu /\ forall n, c n = circleMoment mu n`, while source lines 112575-112583 record the full RH/Toeplitz bridge as not yet frozen. Pinned Mathlib queries `RiemannHypothesis|Li coefficient|Li.?criterion|Toeplitz.*moment|circle.*Herglotz|pure.?point.*measure|atomic.*measure` found only the `RiemannHypothesis` definition and unrelated Herglotz-Riesz kernels. Installed non-Mathlib Lake packages had no hits. Reachable GitHub Lean-code queries `RiemannHypothesis Toeplitz`, `Li coefficient`, and `LiClark` each exited 0 with no hits. Local probe `/private/tmp/w73c13-active-probe.lean` exited 1 with the exact undischarged RH-to-circle-measure goal, so `hRH` cannot yield even the source Toeplitz positive-semidefinite premise, before strict positivity and convergence of the least eigenvalue to zero.'
    reentry_condition: Provide a frozen D5 or A17-admissible construction of the actual Li-Clark moment sequence and a theorem deriving from `RiemannHypothesis` its probability pure-point circle measure with infinite support and the stated moments, then connect that carrier publicly to strict positivity of every finite Toeplitz matrix and convergence of its least eigenvalue to zero.
    blocker_class: missing-prerequisite
