  quarantine:
    justification: D5 has the canonical entire xi reading but no canonical Li coefficient sequence or proof of the standard Li generating-series expansion. Existing Li modules accept the coefficients as external parameters. Pinned Mathlib supplies generic power-series differentiation but no Li expansion. Consequently the Li-Caratheodory function cannot be constructed from the source coefficients and identified with the canonical xi logarithmic derivative; treating it as an arbitrary function satisfying the immediately preceding target-equivalent identity would violate the construction and whole-clause rules.
    reentry_condition: Define the canonical Li coefficients of xi and prove their convergent generating-series expansion on the unit disk, including termwise differentiation, the Mobius half-plane map, the excess-connection identification, and normalization at zero.
    blocker_class: missing-prerequisite
