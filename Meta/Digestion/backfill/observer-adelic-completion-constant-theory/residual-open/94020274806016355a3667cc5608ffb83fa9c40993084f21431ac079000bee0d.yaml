  quarantine:
    justification: "Whole-statement retrieval found one formalizable counterexample clause and one resisting status/goal clause. The source defines the ideal critical-zero factor, gives `gamma=3`, `omega=2`, `z=2+i`, proves it remains in the Schur region while the real part of its logarithmic generator is negative, then states `对每个固定 omega，Theta_omega 分别拥有一个正的因果实现` as the correct research target; the immediately following section names the corresponding universal conservative realization the `Arithmetic Conservative Colligation Conjecture`, so this is not an established theorem clause and positive causal realization is not defined in scope. D5 queries `Loewner|Herglotz.*chain|pointwise.*monoton|causal realization|conservative colligation|Theta.*omega` found the component owner `ShiftedHerglotzCriterion.shifted_herglotz_criterion` and the unrelated Li-symbol `CausalRealization`, but no canonical shifted-xi family monotonicity counterexample owner and no positive conservative realization of each canonical `Theta_omega`. Pinned Mathlib queries for Loewner/Herglotz chains, conservative colligations, causal realizations, and Schur transfer functions found only the operator Loewner order. Installed non-Mathlib package searches returned no domain hit; reachable GitHub Lean-code queries for `conservative colligation` and `Herglotz-Loewner` exited 0 with no results; real LeanSearch returned only generic upper-half-plane and monotonicity declarations. Local probe `/private/tmp/w73d5-loewner-local-attempt.lean` exited 0 and machine-checked the explicit factor's norm-square bound, exact generator value `-166/1105-i*288/1105`, and negative real part, confirming that only the negative half is depositable. Depositing that half alone would omit the boxed fixed-layer positive-causal-realization clause, while inventing a predicate or assuming the conjecture would violate whole-statement and definitional-restatement rules."
    reentry_condition: "Either repair/atomize the source so the named theorem contains only the explicit critical-factor counterexample and treats the conservative realization as a separate conjecture, or provide a source-defined canonical positive causal/conservative colligation predicate and a frozen proof that every fixed canonical `Theta_omega` has such a realization; then expose both halves publicly."
    blocker_class: multi-clause-guard
