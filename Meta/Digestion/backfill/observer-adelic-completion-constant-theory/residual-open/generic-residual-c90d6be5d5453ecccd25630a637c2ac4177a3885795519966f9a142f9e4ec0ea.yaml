    justification: "Retrieval preceded quarantine. D5 searches `compact resolvent|compact_resolvent|resolvent.*compact|compact.*resolvent|eigenvalue.*tend|tend.*eigenvalue|negative.*eigen`, `unbounded.*operator|closable.*operator|form domain|form-core|quadratic-form domain`, and `fourier.*multiplier|time.?limit|Paley.?Wiener` found no compact-resolvent owner; the closest hits are `D5/S3/Weil/ZetaGamma/RenormalizedWeilMultiplier.renormalized_weil_multiplier`, which stops at the source multiplier-form identity, and `D5/S3/Analytic/Forms/FormCorePositivityTransfer.nonnegative_of_formCore`, whose audit explicitly records the absence of a closed semibounded form-domain framework. Pinned Mathlib searches `compact resolvent|compact_resolvent|resolvent.*compact|compact.*resolvent|eigenvalue.*Tendsto|Tendsto.*eigenvalue|negative.*eigen`, `HilbertSchmidt|IsCompactOperator`, and declaration searches under `Analysis/InnerProductSpace` and `Analysis/Normed/Operator` found only bounded `IsCompactOperator`, finite-dimensional eigenvalue lists, compact-operator spectral results, and the Fredholm alternative; no unbounded self-adjoint operator, compact form embedding, compact resolvent, eigenvalue divergence, or finite negative-spectrum bridge was found. Reachable GitHub Lean code searches `\"compact resolvent\" language:Lean` and `\"Hilbert-Schmidt\" language:Lean` found no compact-resolvent theorem; the sole Hilbert-Schmidt result was a bounded operator-space file in `leanprover-community/physlib`, not the required unbounded spectral framework. Local probe `/private/tmp/w72d12-compact-resolvent-probe.lean` imported the two D5 partial prerequisites and pinned compact-operator spectrum modules, then exited 1 with `error(lean.unknownIdentifier)` for `CompactResolvent`, `compact_resolvent_iff_compact_form_embedding`, `compact_resolvent_eigenvalues_tendsto_atTop`, and `compact_resolvent_finite_negative_spectrum`. A finite-dimensional operator surrogate would change the source carrier and make the spectral consequences tautological rather than formalize the compressed Fourier multiplier."
    reentry_condition: "Provide a source-carrier construction of the closed semibounded compressed Fourier-multiplier operator on the even subspace of L2([-L,L]), its form domain and compact embedding from multiplier coercivity plus the time-limited band projection, and a spectral theorem deriving a nondecreasing eigenvalue enumeration tending to positive infinity with finitely many negative eigenvalues."
