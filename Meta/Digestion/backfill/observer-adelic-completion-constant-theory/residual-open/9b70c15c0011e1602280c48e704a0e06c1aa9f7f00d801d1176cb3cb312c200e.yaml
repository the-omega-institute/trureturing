  quarantine:
    justification: The current D5 and pinned Mathlib libraries have weighted countable Dirac sums and the canonical distinct-zero/multiplicity carrier, but no Aleksandrov-Clark measure construction or theorem identifying its atoms from boundary angular derivatives. Without that prerequisite, the displayed Clark-measure equality can only be assumed or made true by defining the Clark measure to be the target sum, both of which are banned tautological encodings.
    reentry_condition: Add a canonical alpha=1 Aleksandrov-Clark measure for a disk inner function together with Herglotz uniqueness and the finite-angular-derivative atomic mass theorem, then instantiate it for the canonical xi inner function and zero carrier.
    blocker_class: missing-prerequisite
