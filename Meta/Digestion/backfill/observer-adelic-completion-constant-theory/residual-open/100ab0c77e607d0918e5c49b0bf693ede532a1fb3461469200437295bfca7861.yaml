    justification: "Retrieval preceded quarantine. D5 searches `canonical[ -]?system|trace[ -]?normal|Weyl function|WeylFunction|Hamiltonian|RiemannHypothesis`, declaration-shape searches for canonical systems and Weyl functions, and `RiemannHypothesis.*(ExistsUnique|exists unique)|ExistsUnique.*Hamiltonian` found Mathlib's `RiemannHypothesis`, the finite-kernel owner `CayleyNevanlinnaKernelEquivalence`, and unrelated finite-dimensional quantum Hamiltonians, but no canonical-system carrier, trace-normalized positive Hamiltonian, Weyl-function construction, de Branges inverse theorem, or RH equivalence on that carrier. Pinned Mathlib searches `RiemannHypothesis|completedRiemannZeta|CanonicalSystem|WeylFunction|TraceNormalized|de Branges|inverse spectral` found `RiemannHypothesis`, completed zeta, and unrelated Nevanlinna value-distribution material, with no canonical-system or inverse-spectral API. A17 ecosystem GitHub code searches `CanonicalSystem`, `WeylFunction`, `de Branges`, `inverse spectral`, and `RiemannHypothesis Hamiltonian` in Lean found no exact theorem: the only source-shaped result, motanova84/Riemann-adelic at 73cac012392873118b8d9ea9bf0cc7aca47171d8, defines `deBrangesStatement : Prop := True` and labels its proof a stub, while thegoldenalgebra scratch file develops Hermite-Biehler implications without canonical Hamiltonian inverse uniqueness. Local probe `/private/tmp/w73e13-atom1-probe.lean` resolved `RiemannHypothesis` and exited 1 on unknown identifiers `CanonicalSystem`, `WeylFunction`, and `TraceNormalizedHamiltonian`. Defining those objects from the desired unique-existence conclusion or assuming the RH-to-Herglotz equivalence would restate the atom instead of constructing its source objects."
