  quarantine:
    justification: "Retrieval preceded quarantine. D5 searches `PF_infinity|Polya|Pólya|Edrei|Aissen|Schoenberg|totally positive|total positivity|Toeplitz` found the canonical centered xi function `D5/S3/Weil/ZetaAnalytic/CountableRationalFluxCriterion.centeredXi` and the canonical critical-line predicate theorem `D5/S3/Zeros/Symmetry/ZeroSymmetryAction.all_nontrivial_zeros_critical_iff_mirror_indices_fixed`, but no square-folded xi function, Taylor-coefficient/zero bridge, all-finite-Toeplitz-minors predicate, total-nonnegativity preservation theorem, or ASW-Edrei representation. Body-shape searches `if row <= column then a (column - row) else 0` and even `iteratedDeriv` coefficients of `centeredXi` also missed. Pinned Mathlib searches `Edrei|Aissen|Schoenberg|Pólya.frequency|Polya.frequency|totally positive|total positivity|Toeplitz.*minor` found determinant and submatrix infrastructure plus unrelated totally-unimodular matrices, but no Polya-frequency or entire-function representation theorem. Reachable GitHub Lean searches `Edrei`, `Polya frequency`, `Laguerre-Polya`, `Aissen`, `Toeplitz minor`, and `totally positive` found no relevant formalization beyond Mathlib mirrors and number-field uses of totally positive. Local probe `/private/tmp/w72d15-atom1-probe.lean` elaborated the canonical centered-xi coefficient, Toeplitz-minor, and critical-line statements, then exited 1 with both directions unchanged: the critical-line hypothesis cannot prove determinant nonnegativity and the PF-infinity hypothesis cannot prove critical-line zeros."
    reentry_condition: "Freeze a canonical square-folded centered-xi construction with its coefficient and zero correspondences, a Polya-frequency predicate on all finite Toeplitz minors with product and coefficient-limit preservation, and an ASW-Edrei representation for entire functions of order below one that removes pole and exponential factors; then prove both directions on those shared primitives."
    blocker_class: missing-prerequisite
