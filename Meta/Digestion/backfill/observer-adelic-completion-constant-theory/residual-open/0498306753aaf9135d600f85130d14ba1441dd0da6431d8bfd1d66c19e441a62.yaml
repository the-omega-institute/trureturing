  quarantine:
    justification: Retrieval preceded quarantine. D5 searches `xiReading.*norm|norm.*xiReading|RiemannHypothesis.*(norm|abs|modulus)|modulus.*RiemannHypothesis|Hermite.?Biehler|Hadamard|zero.*product|StrictMono.*norm|Monotone.*norm` found `D5/S3/Weil/ZetaCore/OffLineStrongNegativeCertificate.off_line_strong_negative_certificate`, which extracts an arbitrary positive shift and a strong negative diagonal certificate from an off-line zero, but no RH-to-xi-modulus monotonicity theorem, golden cofinal shift selector, or exact countable criterion. Pinned Mathlib searches under `Mathlib/NumberTheory/LSeries` and complex analysis found canonical `RiemannHypothesis`, completed zeta, `Rat.denseRange_cast`, and rational-density APIs, but no xi Hadamard factorization or RH modulus monotonicity. A17 GitHub searches `riemannXi RiemannHypothesis`, `RiemannHypothesis modulus`, and `HermiteBiehler Riemann` found `AlexKontorovich/PrimeNumberTheoremAnd` at a5154676af9aa3095150ee410cdda80555aa0642 with xi Hadamard factorization but no required monotonicity theorem and a v4.32.2 pin, and unlicensed `TristenHarr/thegoldenalgebra` at 7569f12202041f8759a6274651de86361f183b98 on v4.31.0-rc1, whose `ScratchDeBranges.lean` and `ScratchHBDominance.lean` explicitly leave the equivalent xi Hermite-Biehler/modulus positivity unproved. Local probe `/private/tmp/w73a1-atom1-probe.lean` exited 0 and proves the continuity/open-set rational-density tail using the pinned APIs, but stops at the absent theorem that `RiemannHypothesis` implies `0 <= |xi(1/2+y+omega+it)|^2 - |xi(1/2+y-omega+it)|^2` for all positive `omega,y`; the reverse route also lacks a theorem refining the existing arbitrary-shift negative certificate to the source's golden cofinal schedule.
    reentry_condition: Freeze a canonical xi Hadamard/de Branges theorem proving RH-equivalent outward modulus monotonicity for every positive horizontal shift, together with a golden-cofinal shift selection bridge for off-line zeros; then combine it with the existing negative certificate and the already verified rational-density tail.
    blocker_class: missing-prerequisite
