    justification: Whole-atom retrieval found local analytic-limit and isolated-zero infrastructure but not the source's two public bridges. D5 searches `imaginary axis|imaginaryAxis|zero.*axis|axis.*zero|TendstoLocallyUniformly.*zero|locally uniform.*zero|Hurwitz|zero.?free.*limit|stable.*zero` found `Analytic.Isolation.AnalyticZeroDichotomy` and current-dev `Analytic.Isolation.PositiveFredholmLimitZeros`; the first only isolates zeros of one analytic function, while the second proves zero preservation only for positive determinant products using extra factor bounds. No D5 theorem states general Hurwitz zero persistence, no public completed-xi theorem identifies imaginary-axis zeros with Mathlib's RH, and no source-semantic `primeGammaApproximants` construction exists. Pinned Mathlib searches `hurwitz|locallyUniform.*zero|zero.*locallyUniform|eq_zero_or.*Analytic|eventually.*ne_zero|rouche|argument principle` found `TendstoLocallyUniformlyOn.differentiableOn` and `AnalyticAt.eventually_eq_zero_or_eventually_ne_zero`, but no Rouche/Hurwitz theorem transporting zeros through a locally uniform limit. The same search over installed non-Mathlib packages Cli, LeanSearchClient, Qq, aesop, batteries, importGraph, plausible, and proofwidgets found no hit. Reachable GitHub Lean code searches `TendstoLocallyUniformlyOn zero`, `Hurwitz theorem`, and `Hurwitz theorem holomorphic` found Mathlib mirrors, unrelated Cayley-Dickson/number-theoretic Hurwitz results, and AlexKontorovich/PrimeNumberTheoremAnd divisor canonical-product convergence at blob `57d785f7f2d102aa864671276039b99c510bf345`, but no general zero-persistence theorem or completed-xi bridge. Local probe `/private/tmp/w73a6-atom3-probe.lean` resolved the two Mathlib partial results and exited 1 on unknown identifiers `hurwitz_zero_persistence`, `imaginary_axis_zero_closed_under_locally_uniform_limit`, `completedXi_zero_on_imaginary_axis_iff_riemannHypothesis`, and `primeGammaApproximants`. Depositing only the general limit theorem would omit the atom's public consequence `由 prime–Gamma 数据形成的虚轴稳定 entire approximants ... 局部一致收敛到 Xi, RH 将立即成立`; inventing that construction predicate would be definitional substitution.
    reentry_condition: Add or admit a general complex Hurwitz zero-persistence theorem for locally uniform limits, expose the actual completed-xi entire function with a proved equivalence between imaginary-axis zero support and Mathlib's `RiemannHypothesis`, and define the prime-Gamma approximant construction from its arithmetic source data so the final implication is a public nonvacuous clause.
    blocker_class: multi-clause-guard
