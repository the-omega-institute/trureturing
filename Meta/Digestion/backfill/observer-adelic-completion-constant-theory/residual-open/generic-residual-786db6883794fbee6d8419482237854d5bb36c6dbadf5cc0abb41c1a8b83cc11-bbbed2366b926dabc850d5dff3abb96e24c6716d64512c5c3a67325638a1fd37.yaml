    justification: "The atom has two public clauses: negation of RH must yield a negative finite Hankel or shifted-Hankel minor, and `最早失败阶未必相同` (the least negative-minor orders need not be the same). Retrieval receipts: D5 searches `hankel.*minor|stieltjes moment|first.*negative|minimal.*minor|least.*order|Hankel.*Toeplitz` found generic Hankel determinant calculations and unrelated least-counterexample constructions, but no canonical xi Hankel criterion, finite negative-minor extractor, least-counterexample order definition, comparison theorem, or explicit witness. Pinned Mathlib searches for total nonnegativity, Stieltjes moments, Hankel minors, and first negative/minimal minors found finite `Matrix.det` only and no required theorem. A17 GitHub Lean searches for `first negative minor` with Hankel and joint Hankel/Toeplitz minor vocabulary returned zero hits. The local probe `/private/tmp/w72a21-total-positivity-probe.lean` exited 1 on the absent Stieltjes-moment and total-nonnegativity primitives. Later source section 251 defines informal minima N_T and N_H and says their difference may be large, but supplies no quantified carrier, existence hypotheses, equality comparison, or countermodel; it presents artificial zero injection as a proposed experiment. The first clause therefore lacks its Stieltjes-Hankel prerequisite, while the quoted second clause cannot be made public without inventing a missing scope or witness, so whole-atom coverage is guarded."
    reentry_condition: "Prove the canonical square-folded-xi Stieltjes/Hankel equivalence and finite negative-minor extraction, then state typed Toeplitz and Hankel least negative-minor orders with explicit existence hypotheses and supply an in-scope theorem or countermodel witnessing that the two orders differ."
