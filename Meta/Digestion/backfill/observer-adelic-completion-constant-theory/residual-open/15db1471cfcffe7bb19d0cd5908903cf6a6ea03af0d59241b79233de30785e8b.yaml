    justification: "Retrieval preceded quarantine. D5 name/body-shape searches `RiemannHypothesis|PosSemidef|Chebyshev|finite matrix criterion|negative quadratic|selector.*zero|zero.*selector|spectral isolation|tail.*bound.*zero|Nonempty ZeroData|exists.*ZeroData` found partial owners only: `ChebyshevSlackPositivity.chebyshev_slack_bounds` proves nonnegative-input slack, `ChebyshevSignedDistanceMargin.first_chebyshev_off_line_exact_margin` proves one off-line point has a strict negative margin, `ExplicitHyperbolicDegreeThreshold.explicit_hyperbolic_degree_threshold` compares abstract hyperbolic rates, and `LiCurvatureCriterion.li_curvature_criterion` proves a different Toeplitz criterion under four explicit bridge hypotheses. `ZeroSum.ZeroData` explicitly records that its exhaustive classical-zeta enumeration, exact multiplicities, symmetries, and finite spectral balls are missing from pinned Mathlib; no D5 declaration constructs `ZeroData`, defines the source admissible rational feature family and multiplicity-weighted infinite matrix, proves its convergence and real symmetry, separates all competing actual zero orbits, bounds the remaining actual-zero tail, or derives the matrix negative certificate from `not RiemannHypothesis`. Pinned Mathlib searches `RiemannHypothesis|Chebyshev|PosSemidef|zeroSum|ZeroData|finite matrix criterion|hyperbolic.*tail` found the definition of `RiemannHypothesis`, first-kind Chebyshev polynomial APIs, and generic `Matrix.PosSemidef` lemmas, but no zero enumeration/multiplicity package or source matrix-certificate theorem. The same targeted search over installed non-Mathlib packages plausible, proofwidgets, batteries, Cli, aesop, importGraph, LeanSearchClient, and Qq returned no hits; dependency-form ecosystem retrieval remains unavailable under spec A17's open admission predicates. Local probe `/private/tmp/w73a9-atom1-probe.lean` proves that `not RiemannHypothesis` yields a nontrivial zeta zero off the critical line using the actual Mathlib proposition, then exits 1 solely because `zeroDataOfClassicalZeta`, `finiteChebyshevZeroMatrix`, and `offLineZeroFiniteMatrixNegativeCertificate` are unknown. Defining those objects from the desired negative or positive-semidefinite conclusion would violate the definitional-substitution ban."
    reentry_condition: Construct the canonical `ZeroData` for classical zeta with exact analytic multiplicities and finite spectral balls; define the source finite even rational feature family and its multiplicity-weighted symmetrically convergent Chebyshev matrix; prove finite orbit separation and a quantitative tail bound for the actual zeta zero data; then prove RH gives positive semidefiniteness for every admissible finite parameter and every off-line zero produces a finite vector with strictly negative quadratic form.
    blocker_class: missing-prerequisite
