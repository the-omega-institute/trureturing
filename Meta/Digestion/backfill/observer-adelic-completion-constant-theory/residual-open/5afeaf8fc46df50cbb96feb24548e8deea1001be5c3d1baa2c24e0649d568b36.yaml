    justification: 'Source sections 846-847 define a(t)=Re digamma(1/4+i*t/2)-log(pi)=2*pi*Zeta23.mu(t) and its symmetric second difference for every nonzero real tau. Whole coverage requires positive and negative frequency values, hence excludes pointwise positivity; no whole frozen owner was found. D5 rg digamma.*(negative|sign|strict)|sign.*digamma|second.*difference in D5/S3/Weil/ZetaGamma exit 0 found ObserverModeCriticalKernel.observer_mode_critical_kernel, which assumes a Levy identity and gives only the kernel identity and strict zero-frequency positivity. GammaMu.re_digamma_vertical and mu_zero_le supply the actual series and non-strict axis inequality. GammaStirlingVert.mu_stirling gives only an O(t^-2) remainder. Pinned Mathlib db584cd6d46c92f209a44c0f1c829460d327499d rg polygamma|digamma|stirling in Analysis/SpecialFunctions/Gamma exit 0 found digamma values/recurrences and the Gauss integral TODO, not the sharper vertical remainder. loogle: Complex.digamma exit 0 hits 12. leansearch: digamma function asymptotic expansion on vertical lines symmetric second difference exit 0 hits 5, no target. A17 GitHub digamma stirling language:Lean excluding this repo exit 0 hits 3; motanova84/Riemann-adelic@28070fd00c44a702f7d3c4cc0bae54c9f615aa42 spectral/sabio4_weil_derivative.lean:214 psi_expansion ends in sorry at 221 and imports custom axioms, so is not an admitted proof. Existing Apache-2.0 anthropics/zeta-23-lean@3635e74826a4c1fcece7d1cd2b6fa75e43a00510 coarse bounds are already ported and directly applied. Local /private/tmp/consensus-rnd/sshx/w73a47/attempt-1/atom2-probe.lean exit 1, log atom2-probe.log: the three actual Stirling bounds are combined to bound the symmetric-difference remainder by (C/(t+tau)^2+C/(t-tau)^2)/2+C/t^2, and the axis nonnegative inequality is proved. Exact remaining goal: Tendsto (fun t => t^2*((2*Real.pi*Zeta23.mu (t+tau)+2*Real.pi*Zeta23.mu (t-tau))/2-2*Real.pi*Zeta23.mu t)) atTop (nhds (-tau^2/2)). The available bound stays order one after scaling and does not identify this negative coefficient. The growth/discrete-convexity alternative was considered but not proved; no impossibility claim is made for it. No source falsity is asserted.'
    reentry_condition: Admit a vertical digamma remainder estimate at real part 1/4 whose symmetric shift difference is o(t^-2), for example the source fourth-order remainder after the explicit -1/(24*t^2) correction, or an independently proved discrete-convexity/sublinear-growth bridge on Zeta23.mu. Also discharge strict zero-frequency positivity from the canonical series or the public Levy identity without assuming that extra identity.
