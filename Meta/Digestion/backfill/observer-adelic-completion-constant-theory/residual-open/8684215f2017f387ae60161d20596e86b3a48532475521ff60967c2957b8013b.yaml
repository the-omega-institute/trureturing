  quarantine:
    justification: "Retrieval preceded quarantine. The source context defines the classical Li coefficients by the xi derivative/zero sum, assumes RH for the displacement formula, defines `C_Xi` on one block per positive zero ordinate with analytic multiplicity, and derives the paired phase sum; under that convention no normalization defect was found. D5 queries `Li coefficient|LiCoefficient|liCoefficient|displacement.*hilbert|C_Xi|unitary.*zero`, `canonical Li|Li sequence|Cayley.*zero|ZeroData|cayleyCoefficient`, and the same searches on fresh `origin/dev` found exact partial carriers but no whole owner: `D5/S3/Midline/Cayley/CayleyUnitarityDefect.cayleyOperator` is an unweighted coordinatewise operator on the exhaustive all-zero `ZeroData` enumeration and `cayley_unitarity_defect_formula` proves only midline/unitarity equivalences; it has no positive-ordinate quotient, multiplicity-weighted power, Hilbert-Schmidt norm, or Li bridge. `D5/S3/Weil/TestFunctions/LaguerreLiBridge.lean:11` explicitly records that D5 has no canonical Li coefficient sequence, and its theorem takes `liCoefficient` plus mass/moment identities as hypotheses. Pinned Mathlib queries `Li criterion|Li coefficient|liCoefficient|li_coefficient|Riemann.*Xi|riemannXi` found no Li carrier, while exact-token queries `HilbertSchmidt|Schatten|IsTraceClass|TraceClass` under `Mathlib/Analysis` and `Mathlib/LinearAlgebra` exited 1, so it supplies neither the source's countable operator ideal nor the claimed norm identity. Third-party retrieval reached its capability limit: GitHub code searches `\"Li coefficient\" language:Lean`, `\"Li criterion\" language:Lean`, and `Riemann Cayley unitary language:Lean` returned HTTP 403 rate-limit errors, grep.app equivalents returned HTTP 429, and the locally available immutable `anthropics/zeta-23-lean` port under `D5/S3/Weil/ZetaCore` returned no hit for the same Li/Cayley/Hilbert-Schmidt patterns; wait-for-capability is therefore recorded for broader ecosystem search. Durable local probe `/private/tmp/w72b14-li-probe.lean` elaborated `cayleyOperator`, `cayley_unitarity_defect_formula`, and `laguerre_li_bridge`, then exited 1 with `error(lean.unknownIdentifier)` for `riemannLiCoefficient`, `positiveOrdinateCayleyOperator`, `cayleyDisplacementHilbertSchmidt`, and `li_displacement_formula`. Defining an arbitrary sequence to equal the displacement or assuming the missing mass/zero-sum identity would violate the definitional-restatement and conclusion-as-premise rules."
    reentry_condition: "Provide a canonical classical Li coefficient sequence on `ZeroData`, a multiplicity-aware positive-ordinate quotient with the RH midline hypothesis, a countable diagonal Hilbert-Schmidt operator ideal and summability proof for every `I-C^n`, and a proved bridge from the symmetrically convergent xi zero formula to its Hilbert-Schmidt square; alternatively admit an exact third-party result after ecosystem search capability returns."
    blocker_class: missing-prerequisite
