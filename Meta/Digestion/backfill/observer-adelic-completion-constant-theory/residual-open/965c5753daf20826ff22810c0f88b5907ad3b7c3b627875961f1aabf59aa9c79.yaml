  quarantine:
    justification: "Whole-atom retrieval and construction preceded quarantine. Source context defines the actual Li coefficients from `xi`, defines `p_k` by inversion of the lower-triangular transform (258.2), sets `h_n=p_(n+1)`, and includes both the complete-monotonicity equivalence and the proof-section Hausdorff measure plus Chebyshev recovery identity. D5 searches `Li.Hausdorff|Hausdorff.*Li|complete monot|finite difference|Chebyshev.*Li|Mobius.Fredholm|moment sequence` found unrelated complete monotonicity and Chebyshev modules, but no Li-Hausdorff owner, no inverse-transform owner, and no unit-interval moment representation. Pinned Mathlib search `Hausdorff moment|completely monotone|complete monotonicity|alternating finite difference|moment.*Icc.*0.*1|Icc.*moment sequence|Li.Hausdorff` returned no relevant theorem; its second-kind Chebyshev polynomial is available only for stating the recovery integrand. The same Hausdorff and finite-difference search over installed non-Mathlib packages plausible, proofwidgets, batteries, Cli, aesop, importGraph, LeanSearchClient, and Qq returned no match. Reachable ecosystem retrieval in `anthropics/zeta-23-lean` at `2bafb8c88f177284a2123b5fefa2ff84e2365eb6` found only unrelated Chebyshev prime-counting text and no Hausdorff moment, Li inverse-transform, or complete-monotonicity declaration. Local probe `/private/tmp/w73c24-atom3-probe.lean` constructed the derivative-defined canonical Li coefficients, the lower-triangular inverse by strong recursion, `h_n`, and iterated forward differences, then exited 1 after elaboration with exact goals `hRH : RiemannHypothesis |- forall n r : Nat, 0 <= (-1)^r * iteratedForwardDifference r hausdorffLiSequence n`, `hComplete : forall n r : Nat, 0 <= (-1)^r * iteratedForwardDifference r hausdorffLiSequence n |- RiemannHypothesis`, and `hComplete : CompletelyMonotone hausdorffLiSequence |- exists eta : Measure (Set.Icc 0 1), IsFiniteMeasure eta and (forall n, hausdorffLiSequence n = integral x, x^n d eta) and forall n >= 1, canonicalLiCoefficient n = 4 * integral x, (Chebyshev.U_(n-1)(sqrt(1-x)))^2 d eta and 0 <= canonicalLiCoefficient n`."
    reentry_condition: "Freeze the canonical full Li coefficient sequence and Li nonnegativity criterion, the lower-triangular Li-to-power-trace transform with its inverse, the Hausdorff theorem equating alternating finite differences with finite positive measures on the unit interval, and the source zero-spectrum identification that yields the Chebyshev recovery formula for the inverted canonical sequence."
    blocker_class: missing-prerequisite
