  quarantine:
    justification: 'The stated blocker, that no canonical Li coefficient sequence and no generating-series expansion exist, was already false when this record was written. D5/S3/Zeros/Endpoints/CanonicalLiLocalExpansion is frozen and defines canonicalLiCoefficient from iteratedDeriv (n+1) of s^n * Complex.log (xiReading s) at 1, defines liGenerator z = (1-z)^(-1)^2 * logDeriv xiReading ((1-z)^(-1)), and proves generator_taylor_coefficient and canonical_li_local_expansion, the latter giving HasSum of canonicalLiCoefficient (n+1) * z^n to (1-z)^(-2) * logDeriv xiReading (1/(1-z)) on a neighbourhood of zero. That module entered dev on 2026-09-07 and this record was written on 2026-09-08. The real residual is a normalization gap, not a missing construction: the frozen generator carries the factor (1-z)^(-2) and is not divided by canonicalLiCoefficient 1, so it is not yet the Caratheodory function of clause 274.5.'
    reentry_condition: Define the Caratheodory function of clause 274.5 normalized by canonicalLiCoefficient 1 and prove the boxed identity against the frozen canonical_li_local_expansion, making the (1-z)^(-2) normalization explicit. Defining the Caratheodory function as the target logarithmic derivative remains a forbidden definitional restatement.
    blocker_class: missing-prerequisite
