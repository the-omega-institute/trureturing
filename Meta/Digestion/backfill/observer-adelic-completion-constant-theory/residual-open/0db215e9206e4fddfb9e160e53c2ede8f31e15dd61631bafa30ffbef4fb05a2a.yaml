  quarantine:
    justification: 'The named theorem is explicitly scoped by `「RH 下」`, but the required bridge `RH ⇒ Poisson-integral representation of D_x = Re Z_ξ(x+iy) on the half-plane (harmonic-extension / semigroup identity)` is absent. Retrieval preceded quarantine: D5 query `completedRiemannZeta|Z_?xi|completionProfile|poissonKernel|PoissonKernel` found the concrete `xiReading`, `poissonKernel`, `phaseDensity`, and `poissonSmooth`, while the only RH/Poisson hit `D5/S3/Weil/ZetaAnalytic/RiemannPoissonDensity.riemann_poisson_density` additionally assumes `hPhaseExpansion : ∀ x, 0 < omega → RiemannHypothesis → ...`, so it does not derive the representation from RH; D5 query `poisson.*(representation|extension|semigroup|smooth)|RiemannHypothesis.*poisson|phaseExpansion|completion.*profile` found only that conditional theorem and the abstract `coarse_poisson_semigroup`. Pinned Mathlib query `poisson(kernel| integral|semigroup)` found disk Poisson formulas in `Mathlib/Analysis/Complex/Poisson.lean` and `Mathlib/Analysis/Complex/Harmonic/Poisson.lean`, but no real-line half-plane harmonic-extension or kernel-semigroup bridge; `RiemannHypothesis` unfolds in `Mathlib/NumberTheory/LSeries/RiemannZeta.lean` only to localization of nontrivial zeta zeros on Re(s)=1/2. Third-party A17 retrieval is recorded as `wait-for-capability`: grep.app returned HTTP 429 for `RiemannHypothesis poissonKernel`, `RiemannHypothesis Poisson`, `completedRiemannZeta Poisson`, `riemannZeta poissonKernel`, and `HarmonicOnNhd halfPlane poisson`, while Sourcegraph returned HTTP 403 for global Lean query `RiemannHypothesis poisson`. The local proof decomposition through frozen `coarse_poisson_semigroup` stops at exactly the absent RH-derived completion-representation premise; supplying that premise would restate the missing analytic content and leave RH laundered.'
    reentry_condition: 'Freeze in D5 a theorem deriving from public `hRH : RiemannHypothesis` the Poisson-integral representation of the concrete completion profile `D_x(y) = Re Z_ξ(x+iy)` on the real-line half-plane, together with the compatible standard Poisson-kernel semigroup identity, so `hRH` is used to discharge the representation required by `coarse_poisson_semigroup`.'
    blocker_class: missing-prerequisite
