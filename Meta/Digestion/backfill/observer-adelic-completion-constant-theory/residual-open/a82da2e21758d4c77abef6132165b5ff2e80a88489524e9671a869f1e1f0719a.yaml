    justification: Whole-atom retrieval found the actual completed-xi primitives but not the two bridges needed for the stated equivalence. D5 searches `finite.*positive.*rank|positive.*finite.*rank|inverse.?gap|trace.?class|Schatten|Fredholm.*limit|coefficient.*compact|elementary.*symmetr|normalJet|RiemannHypothesis` found `Zeros.NormalJetFormula.criticalXi` and `normalJet`, the product-only `Weil.Fredholm.PositiveFredholmProduct`, and on current origin/dev `Analytic.Isolation.PositiveFredholmLimitZeros`; the latter assumes locally uniform determinant convergence and proves only the nonpositive-zero conclusion, while `PositiveFredholmProduct` explicitly records that the countable trace-class operator API is absent. No D5 theorem constructs the source inverse-gap operator from RH or identifies all of its elementary symmetric traces with `normalJet t m / normalJet t 0`; no theorem derives RH from convergence of those actual coefficients. Pinned Mathlib search `inverse.?gap|trace.?class|TraceClass|Schatten|Fredholm.*limit|coefficient.*compact|elementary.*symmetr|RiemannHypothesis|criticalXi` found `RiemannHypothesis` and finite elementary-symmetric-polynomial definitions only; trace-class hits were elaborator trace classes or prose, not an operator API. The same semantic search over installed non-Mathlib packages Cli, LeanSearchClient, Qq, aesop, batteries, importGraph, plausible, and proofwidgets found no operator or RH bridge; dependency-form ecosystem retrieval remains unavailable under spec A17's open admission predicates. Local probe `/private/tmp/w73a6-atom2-probe.lean` resolved `RiemannHypothesis`, `criticalXi`, and `normalJet` but exited 1 with unknown identifiers `TraceClassOperator`, `inverseGapOperator`, `inverseGapOperator_positive_of_riemannHypothesis`, and `normalJet_eq_inverseGapElementarySymmetric`. Depositing an abstract assumed equivalence or an eigenvalue-list proxy would violate the source-carrier and no-definitional-restatement rules.
    reentry_condition: Provide a canonical countable Hilbert-space trace-class inverse-gap operator for the actual completed-xi zero divisor, prove RH gives its positivity and finite-rank spectral truncations with elementary symmetric coefficients converging to `normalJet t m / normalJet t 0`, and prove the converse bridge from those actual coefficient limits through the moving-square entire function to Mathlib's `RiemannHypothesis`.
    blocker_class: missing-prerequisite
