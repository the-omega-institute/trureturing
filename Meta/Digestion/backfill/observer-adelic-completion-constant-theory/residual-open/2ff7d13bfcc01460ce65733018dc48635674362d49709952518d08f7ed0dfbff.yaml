    justification: "Whole-clause audit found partial coverage only. D5 searches `golden.*shell|shell.*moment|horizontal.*defect|defect.*moment|golden.*charge|phi.*shell|moment.*bound|transverse.*energy|offline.*zero` found the exact frozen finite-family inequalities `D5/S3/Analytic/SeriesInequalities/GoldenShellMomentDiscretization.golden_shell_moment_sandwich` and `golden_shell_second_moment_sandwich`, already receipted to atom 838889f3..., plus canonical zeta `ZeroData`, symmetry, and finite critical-defect owners; none states the atom's independent final clause `RiemannHypothesis iff G_s(T)=0 for every finite T`. `D5/S3/Weil/ZetaCore/Statement.lean:44` explicitly records the missing direction: every strip zero is nontrivial for Mathlib's `RiemannHypothesis`, but the converse classification that all Mathlib-nontrivial zeros lie in the open strip is not proved. Pinned Mathlib searches `RiemannHypothesis.*iff|iff.*RiemannHypothesis|riemannZeta.*zero.*iff|zero.*iff.*riemannZeta|nontrivial.*strip` found the RH definition, right-half-plane nonvanishing, trivial-zero examples, and finite/discrete zero-set results, but no full nontrivial-zero classification or shell criterion. Reachable GitHub Lean searches `RiemannHypothesis IsNontrivialZero`, `riemannZeta negative odd`, `golden shell moment`, and `Riemann shell` found Mathlib mirrors and unrelated results, with no A17 port candidate for the missing equivalence. The local proof attempt can apply the frozen sandwich owners and, using `ZeroData` reflection plus positive finite sums, reduce transcript vanishing to criticality of every enumerated open-strip zero; it stops at the reverse implication to Mathlib `RiemannHypothesis`, exactly the open converse documented in `ZetaCore/Statement`. Binding the frozen sandwich theorem would leave the RH clause absent, while adding that clause as a premise would violate converse-premise fidelity."
    reentry_condition: Freeze a canonical theorem identifying Mathlib `RiemannHypothesis` with critical-line membership of every `ZeroData` open-strip zero, including the currently open converse classification of all Mathlib-nontrivial zeta zeros; then extend the existing golden-shell sandwich owner with the same-zero-family finite-height transcript vanishing equivalence and the explicit second-moment identity.
