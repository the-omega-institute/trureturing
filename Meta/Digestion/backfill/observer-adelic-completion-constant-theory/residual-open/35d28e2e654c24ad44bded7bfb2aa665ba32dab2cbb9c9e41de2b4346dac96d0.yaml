  quarantine:
    justification: "Retrieval preceded quarantine. D5 search `blaschke|poisson.*kernel|cauchy.*poisson|vertical.*decay|finite.*resonance|resonance.*multiset|unimodular constant|phase.*decay` found the exact vertical-sum owner `D5/S3/Weil/Scattering/VerticalAttenuation.vertical_attenuation_tomography` and related Poisson-kernel modules, but no theorem identifying a finite multiset of paired centers and positive widths from its horizontal Poisson profile, nor the required joint-readout injectivity theorem. Pinned Mathlib search `Blaschke|unimodular|finite.*zero.*multiset|Polynomial.*roots|PartialFractions|RatFunc` found `Complex.canonicalFactor`, canonical decomposition, polynomial-root APIs, and rational-function partial-fraction uniqueness, but no finite translated positive Poisson-mixture identifiability result or boundary-phase/vertical-attenuation reconstruction theorem. Third-party Lean dependency admission remains `wait-for-capability` because spec A17 public-source, immutable-revision, and license predicates are open. The local proof reduction can import the frozen vertical attenuation formula and encode the horizontal profile as a finite sum of `width / ((x-center)^2 + width^2)`, but stops at the absent lemma that equality of those functions for all real x forces equality of the multiset of `(center,width)` pairs; assuming injectivity or defining the readout to contain the multiset would put the conclusion in a premise or definition."
    reentry_condition: "Freeze a theorem proving identifiability of finite positive translated Poisson mixtures on the real line, including multiplicities and coincident widths, and connect it to the existing vertical attenuation and finite Blaschke canonical-factor primitives; then derive joint-readout injectivity and the residual global unimodular constant clause."
    blocker_class: missing-prerequisite
