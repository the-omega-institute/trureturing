  quarantine:
    justification: "Retrieval preceded quarantine. D5 search `prime.?cluster|Lindeberg|central limit|Gaussian.*limit|Kronecker.?Weyl|equidistribut|Haar.*torus|independent.*phase|partial summation|prime number theorem|weighted.*prime.*asympt` found no exact owner; `D5/S3/Factorization/PrimeLogIndependence.lean:61` proves only integer linear independence of finite prime logarithms, and `D5/S3/Weil/ZetaCore/Hypotheses.lean:92` packages different Chebyshev-Mertens bounds rather than the source's two asymptotic equivalents. Pinned Mathlib has the i.i.d. theorem `ProbabilityTheory.tendstoInDistribution_inv_sqrt_mul_sum`, whose signature requires IdentDistrib, but no Lindeberg or triangular-array theorem for the non-identically distributed prime channels; searches found no Kronecker-Weyl/equidistribution bridge and no prime-number-theorem asymptotic for either weighted sum, only `Chebyshev.theta` bounds. Reachable GitHub Lean searches `Lindeberg central limit`, `Kronecker-Weyl`, and `partial summation primes` exited 0 with no hits; `prime number theorem` returned only Mathlib prerequisite comments and TauCeti's logarithmic-integral definition, not a proving theorem or A17 port candidate. Local Lean probe imports the i.i.d. CLT, Chebyshev, and prime-log independence successfully, then exits 1 with `error(lean.unknownIdentifier): Unknown identifier` for `lindebergFellerCentralLimitTheorem`, `finitePrimeLogKroneckerWeylDensity`, `primeClusterLongIntervalGaussianLaw`, `weightedPrimeVarianceAsymptotic`, and `weightedPrimeMaximumAsymptotic`; consequently the distributional limit, V_Y~(log Y)^2, M_Y~4 sqrt(Y), and their public scale comparison cannot be proved from available primitives. The trailing source sentence `两者相差指数级别的状态体积` additionally has no in-scope definition of state volume and is a qualitative remark outside the displayed asymptotic clauses."
    reentry_condition: "D5, pinned Mathlib, or a port-ready Lean dependency provides a Lindeberg-Feller triangular-array CLT, finite-torus Kronecker-Weyl equidistribution with long-interval sublevel-set density transfer, and prime-number-theorem partial-summation theorems proving both displayed weighted prime asymptotics; any required public state-volume clause must first receive an in-scope source definition."
    blocker_class: missing-prerequisite
