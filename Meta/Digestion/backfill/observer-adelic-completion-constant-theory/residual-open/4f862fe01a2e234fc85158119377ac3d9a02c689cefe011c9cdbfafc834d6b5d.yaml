  quarantine:
    justification: Retrieval preceded quarantine. The source fixes rho=1/2+delta+i*gamma with delta>0, constructs the local minimal scattering factor from p_omega and q_omega, defines E_rho(omega) as the squared Hilbert--Schmidt norm of its local anti-causal Hankel block, and requires the all-s>0 moment identity plus the s=1 and s=2 clauses on that same carrier. D5 queries BodeWidthCriterion|leakage energy|Hilbert-Schmidt|Hankel|anti-causal|single defect|energy moment and exact omega/delta body shapes found finite state-space Hankel maps, a one-by-one effective-index proxy, a generic energy-function hypothesis in GoldenRobustFirstDetection, and BodeWidthCriterion, but no source scattering-factor block, Hilbert--Schmidt energy, or exact moment owner. Pinned Mathlib queries HankelOperator|HardySpace|HilbertSchmidt|InnerFunction and integral rpow laws found only Complex canonical decomposition plus generic interval integration; no Hardy/scattering Hankel carrier or Hilbert--Schmidt operator construction exists. Reachable A17 GitHub Lean searches HankelOperator, HardySpace, and HilbertSchmidt Hankel all exited 0 with no hits; energy moment rpow returned only unrelated displacement estimates. The pinned non-Mathlib packages had no carrier hit. Local probe /private/tmp/w73d4-atom2-probe.lean exited 1 with HardySpace, HankelOperator, HilbertSchmidt, InnerFunction, and continuous-linear-map singular values unknown. Replacing the named block by an arbitrary energy function, or defining a piecewise scalar function to be omega^2/delta^2, would be a proxy or definitional restatement rather than coverage.
    reentry_condition: Provide frozen D5 or A17-admissible canonical definitions of the source local scattering factor and its anti-causal Hankel block on the Hardy carrier, a Hilbert--Schmidt norm and the rank-one singular-value law sigma=omega/delta, including the boundary interpretation; then derive the general real-rpow moment and both public special cases without replacing E_rho by a target-shaped scalar definition.
    blocker_class: missing-prerequisite
