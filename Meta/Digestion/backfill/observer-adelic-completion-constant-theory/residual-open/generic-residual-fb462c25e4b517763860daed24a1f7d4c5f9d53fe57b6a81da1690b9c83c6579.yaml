  quarantine:
    justification: "Missing-prerequisite after whole-statement retrieval and carrier audit. D5 searches for observation line invariant|critical source|Poisson.*scale|poisson.*semigroup|inverse.*Poisson|Weil source found D5/S3/Weil/Scattering/PoissonSemigroup.lean, which proves only abstract forward smoothing from supplied convolution/profile laws, and D5/S3/Weil/ZetaAnalytic/RiemannPoissonDensity.lean, whose canonical xi phase-density equality requires RH and a supplied phase-expansion hypothesis; neither states the unconditional inverse-Poisson invariant on the canonical xi carrier. Further D5 searches for logDeriv.*xiReading|xiReading.*logDeriv|phaseDensity.*sum|Hadamard.*xi found no global Hadamard/log-derivative zero expansion suitable for this theorem. Pinned Mathlib searches for poissonKernel|poisson kernel|fourier.*cauchy|fourier.*exp found circular Poisson integration and general Fourier APIs but no real-line Poisson-kernel transform/inversion theorem; Analysis/Distribution/FourierMultiplier.lean restricts tempered-distribution multipliers to functions with temperate growth, so the exponentially growing inverse multiplier exp(a*abs(t)) is not supplied. Third-party GitHub repository search for quoted Poisson semigroup Lean theorem prover returned total_count 0; code search for quoted Fourier transform and quoted Poisson kernel found only an unrelated Gaussian preliminary in lean-nct, while fourierMultiplierCLM with Real.exp returned total_count 0. The local Lean probe compiled phaseDensity, riemann_poisson_density, coarse_poisson_semigroup, and TemperedDistribution.fourierMultiplierCLM, while a direct fun_prop proof that exp(a*abs(t)) has temperate growth failed. The source does not impose RH and does not name a distribution space of exponential type; therefore a canonical Hadamard zero expansion plus a non-tempered inverse-Poisson carrier is required, and taking either as a premise would restate the theorem's load-bearing content."
    reentry_condition: "Provide a frozen D5, pinned Mathlib, or A17-admissible distribution space of exponential type on which exp(a*abs(D)) is defined, together with the real-line Poisson Fourier transform/inverse law and an unconditional canonical xi logarithmic-derivative expansion over all nontrivial zeros; then construct the common source from that expansion and prove both observation-line equalities without an RH premise."
    blocker_class: missing-prerequisite
