    justification: "Missing Clark-inner-function machinery. D5 search `Li.?Clark|inner function|IsInner|Schur function|thetaXi|vartheta` found only parameterized finite Li-Clark Toeplitz recovery and no disk-inner predicate or Clark theorem; `RiemannHypothesis|IsNontrivialZero|all_critical` did hit the canonical RH and zero carriers. Pinned Mathlib search `InnerFunction|IsInner|inner function|Clark measure|Aleksandrov|Herglotz|Schur function|Hardy space` hit only the Herglotz-Riesz/Poisson kernel and unrelated simplicial `IsInner`, with no Hardy inner function or Clark measure. GitHub Lean ecosystem searches for `Clark measure`, `inner function`, and `Herglotz` found only Mathlib mirrors, unrelated calculus text, and Poisson-kernel users. Local Lean probe `/private/tmp/w72a22-cayley-probe.lean` proves `0 < re w -> norm ((w-1)/(w+1)) < 1` with exit 0, but the forward implication stalls at the absent theorem that the xi Herglotz measure is pure point/singular and that a Schur function has singular Clark measure iff it is inner; the reverse implication also lacks the analytic inner-function-to-zero-free bridge."
