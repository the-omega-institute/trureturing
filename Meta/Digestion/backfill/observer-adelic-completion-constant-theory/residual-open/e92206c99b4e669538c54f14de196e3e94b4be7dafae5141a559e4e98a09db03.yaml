  quarantine:
    justification: Retrieval preceded quarantine. D5 queries `optimizer|supremum|weak-*|Fourier.*constraint|budget.*exist|attain|IsGreatest|sSup|csSup`, `cayleyCompactification|resolventCompactification|normalizedLebesgueSpectrum`, `local Weil|Weil source|Weil.*functional|inverseMeasurePairing`, and body shapes using `Measure.map` with resolvent `withDensity` found no exact real-line budgeted optimizer owner. `FullCirclePrimalAttainment.full_circle_primal_attainment` attains a Haar floor only for finite measures on the compact circle under continuous real moments; `WhiteToHaarIdentity.white_to_haar_identity` and `CayleyMomentTransport.cayley_moment_transport` provide forward real-to-circle transport, but no public inverse construction discards the omitted circle point and reconstructs an even Borel measure on Real while preserving every local Fourier constraint. D5 also has no canonical named local Weil source functional packaging the source's `W_L`. Pinned Mathlib queries `vague|weak.*measure|compact.*finiteMeasure|dual.*C0`, `OnePoint|one point`, `CocompactlySupportedContinuousMap|toZeroAtInfty`, and `ext.*integral|FiniteMeasure.ext` found compactness only for compact carriers or explicitly tight families, plus `OnePoint.continuousMapMk`, `SchwartzMap.toZeroAtInfty`, and finite-measure equality from all bounded continuous integrals, but no resolvent-weighted vague compactness theorem on Real or assembled inverse Cayley recovery theorem. Third-party GitHub Lean code queries for `vague convergence FiniteMeasure`, `resolvent compactification`, `one-point compactification Measure`, and `isCompact_setOf_finiteMeasure` returned respectively 0, 0, two unrelated paths, and one Econlib name hit; fetching that pinned Econlib file and toolchain both returned HTTP 404, recorded as wait-for-capability. The API inventory probe `/private/tmp/W73a26Atom1Probe.lean` compiled with exit 0 and confirmed only the forward primitives. The focused local attempt `/private/tmp/W73a26Atom1ContinuityProbe.lean` exited 1 because `fun_prop` could not prove continuity of `cayleyMomentFunction` at the omitted point; consequently the compact-circle optimizer cannot be instantiated with the source's full local Fourier family, and no available theorem carries its result back to the exact real-line carrier.
    reentry_condition: Provide frozen D5, pinned Mathlib, or A17-admissible theorems that the resolvent-weighted local Fourier integrand extends continuously by zero across the Cayley point, that compact-circle measures can be pulled back after removing that point and unweighted to an even positive Borel measure on Real with no increase in resolvent budget, and that this recovery preserves all local Weil-source pairings and reflects white-spectrum domination; also expose the canonical local Weil source functional `W_L`.
    blocker_class: missing-prerequisite
