  quarantine:
    justification: "Missing prerequisites on the source carrier. Fresh-origin D5 name/body-shape queries `common.*self.adjoint|shared.*spectral|spectral.*source|Cayley.*resolvent|resolvent.*weight|RiemannHypothesis.*ZeroData|ZeroData.*RiemannHypothesis` found the reusable measure-level owners `PositiveCayleyScaleTransport.positive_cayley_scale_transport`, `CaratheodoryScaleCovariance.caratheodory_scale_covariance`, `RiemannPoissonDensity.zeroCountingMeasure`, and `RhLocatesZeroData.zeroData_zero_on_critical_line_of_rh`, but no whole theorem. The canonical `ZeroData` documentation states that no inhabitant is asserted; every RH bridge takes a supplied `ZeroData`, so D5 has no `RiemannHypothesis -> Nonempty ZeroData` construction of the exhaustive multiplicity-aware zero family required for the source measure. Pinned Mathlib queries `RiemannHypothesis.*exists|enumerat.*zero|Unbounded|LinearPMap.*Lp|multiplication operator|IsSelfAdjoint.*multiplication` found `RiemannHypothesis`, the general `LinearPMap` adjoint API, and L2 infrastructure, but no exhaustive zeta-zero enumeration or self-adjoint unbounded multiplication operator on L2. Reachable LeanSearch queries `Riemann hypothesis implies an exhaustive multiplicity-aware enumeration of all nontrivial zeta zeros` and `multiplication by a real measurable function on L2 is a self-adjoint unbounded operator` returned only the RH definition and general adjoint/L2 declarations; installed non-Mathlib package searches for the same shapes returned zero hits. Local probe `/private/tmp/w73d14-atom2-probe.lean` exited 1 with `hRH : RiemannHypothesis |- Nonempty ZeroData` and `aesop` made no progress. Adding `ZeroData` or a self-adjoint operator as abstract binders would replace the source's RH-derived objects and violate scope and carrier fidelity."
    reentry_condition: "Freeze a theorem constructing the canonical exhaustive multiplicity-aware `ZeroData` from `RiemannHypothesis`, then construct its real zero-counting measure and prove that multiplication by the ordinate on complex L2 of that measure is a self-adjoint `LinearPMap`; the existing Cayley and resolvent-weight owners can then realize every positive scale on that common operator."
    blocker_class: missing-prerequisite
