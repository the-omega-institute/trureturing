  quarantine:
    justification: "The exact source carrier is the Hilbert direct sum over positive xi-zero ordinates, with the diagonal operator having eigenvalues gamma^-2, positivity, trace-class summability, and a Fredholm determinant equal to the square-folded xi function; the converse also needs the zero-locus theorem for positive trace-class Fredholm determinants and the square-fold RH criterion. Retrieval receipts: D5 searches `fredholm|traceclass|trace class|IsTraceClass|determinant.*positive`, `AllZerosOnMidline|squareFold|FoldedXi|negative-real-zero`, and infinite-product/eigenvalue body shapes found `AllZerosOnMidline`, `xiReading`, compact/spectral and finite matrix determinant families, but no trace-class operator, Fredholm determinant, folded-xi product, or exact owner. Pinned Mathlib searches `fredholm|trace.?class|nuclear.*operator|det.*trace`, `Schatten`, and infinite-product/zero-locus vocabulary found the compact-operator Fredholm alternative and generic `HasProd` machinery but no trace-class or Fredholm-determinant API; `/private/tmp/w72a21-fredholm-probe.lean` exited 1 because `ContinuousLinearMap.IsTraceClass` and both queried Fredholm-determinant identifiers are unknown. A17 GitHub Lean searches for `Fredholm determinant`, `trace class operator`, `TraceClass`, `Schatten`, and `fredholmDet` found no Fredholm-determinant theorem; AIQ-Kitware/aiq-dkps-formalization has a trace-class predicate but is pinned to Lean v4.34.0-rc18 and a different Mathlib master revision, so dependency form is incompatible, and its Fredholm-determinant searches returned no hit. The local proof attempt cannot state the public existential on the exact operator carrier, and replacing it by a sequence product or finite matrix would violate carrier fidelity and whole-statement coverage."
    reentry_condition: "Provide pinned, admissible trace-class continuous-linear-operator and Fredholm-determinant primitives, then prove the xi square-fold Hadamard product under RH, positivity and trace-class of the canonical diagonal operator, the determinant identity, the zero-locus theorem for positive trace-class Fredholm determinants, and the square-fold RH converse on the source carrier."
    blocker_class: missing-prerequisite
