    justification: "Whole-atom retrieval found both named bridge endpoints missing. D5 declaration and body-shape searches for `liCoefficient|li_coeff|Li coefficient`, indexed `Nat -> Real` Li sequences, derivatives or coefficient extractions from `xiReading` and centered xi found the canonical analytic functions `CompletedZeta.xiReading` and `CountableRationalFluxCriterion.centeredXi`, one theorem-local explicit first coefficient, and theorem parameters named `liCoefficient`, but no canonical indexed Li-coefficient owner. D5 searches for `X_Ξ|XΞ|XiOperator|traceMoment|spectralMoment|p_k` and for traces of operator powers found generic finite-matrix trace lemmas, an unrelated free transfer matrix, and unrelated moment carriers, but no spectral/operator carrier for X_Ξ and no named sequence p_k = Tr(X_Ξ^k). Pinned Mathlib searches for Li coefficients, the Li criterion, Riemann xi, centered xi, and derivative/coefficient body shapes found no Li-coefficient machinery. The lower-triangular matrix, its invertibility, and the displayed inverse-row algebra are independently provable, but defining lambda to be the matrix transform proves only that algebra; it does not cover the source claim relating the named Li coefficients to the named trace moments."
    reentry_condition: "Add frozen canonical owners for the indexed Li coefficients of xiReading or centered xi and for the spectral trace moments p_k = Tr(X_Ξ^k), together with a frozen theorem identifying those named sequences through the Hausdorff triangular transform; then prove the inverse rows for those same named objects."
