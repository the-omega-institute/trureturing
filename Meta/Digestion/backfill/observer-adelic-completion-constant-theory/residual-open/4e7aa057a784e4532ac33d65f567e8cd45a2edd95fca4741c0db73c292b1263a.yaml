  quarantine:
    justification: "Review finding: 'A fixed let-binding is not a uniqueness proposition', and the public theorem therefore leaves a real uncovered clause. The child contains the valid normalized-parity 2m pole-order sentence together with source lines 189891-189893, `唯一的全局宇称观察通道，在观察半平面内部不得出现奇性；它的全部奇性只能停留在边界。` Source line 189428 only labels the fixed eigendirection u_- as the unique odd parity channel; it does not define a quantified class of global parity observation channels. The source likewise defines no singular-support carrier or boundary-support predicate, while lines 190093-190127 explicitly present preservation of global parity rank by completion as the unproved No-New-Parity Completion Principle. D5 searches for global parity channels, parity-channel uniqueness, singular support, and boundary singularity found no source-faithful public carrier. The frozen theorem covers the 2m order clause but cannot cover the boxed uniqueness/support clause; inventing a channel classifier or defining support from the desired conclusion would be a definitional restatement."
    reentry_condition: "Provide source-level or frozen D5 definitions of the admissible global parity observation channels and of singular support on the completed observation domain, independently of the desired target, then prove that the canonical u_- channel is unique and that under RH its singular support in the closed observation half-plane is contained in the boundary; a strengthened public owner may then cover every clause of this child."
    blocker_class: multi-clause-guard
