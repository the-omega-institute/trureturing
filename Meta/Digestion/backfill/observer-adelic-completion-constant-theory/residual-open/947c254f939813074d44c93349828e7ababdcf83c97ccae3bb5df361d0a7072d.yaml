  quarantine:
    justification: "Retrieval preceded quarantine and exposed a source defect. The in-scope paragraphs define `normalJet` as the actual completed-xi normal Taylor coefficient, say each real zero `lambda` has multiplicity `m_lambda`, define `A_t` with eigenvalue `1/(lambda-t)^2` repeated `m_lambda` times, and assert the order-one-half canonical product. Yet displayed formula (1554.2) sums only over strictly increasing zero values `lambda_1 < ... < lambda_m` with no multiplicity factors. For one zero of multiplicity two, already at `m=1` the exterior trace contributes `2/(lambda-t)^2` while the displayed sum contributes `1/(lambda-t)^2`; RH does not assume simple zeros, and the nearby connected formula (1554.4) itself writes the required factor `m_lambda`. D5 searches `normal.?jet|Fredholm|trace.?class|Schatten|canonical.?product|Hadamard|genus.?zero|inverse.?square.*zero|exteriorPower.*trace|trace.*exteriorPower` found the partial owners `Zeros/NormalJetFormula.normal_jet_formula` for the actual derivative jets and `Weil/Fredholm/PositiveFredholmProduct.positive_fredholm_completion` for a generic scalar product. The latter explicitly records that the RH zero input, countable operator, trace-class, determinant, and coefficient layers are absent; no D5 theorem identifies the two owners or constructs `A_t`. Pinned Mathlib searches `Fredholm determinant|fredholmDet|trace.?class|Schatten|nuclear operator|exteriorPower.*trace|trace.*exteriorPower|elementary symmetric.*eigen` found finite exterior-algebra infrastructure but no countable trace-class operator, Fredholm determinant, or exterior-power trace expansion. Reachable GitHub Lean searches `normalJet`, `fredholmDet`, `trace class`, `exteriorPower trace`, and `hadamard_factorization_of_order exteriorPower` found no admissible bridge: one Fredholm hit declares the determinant by axiom, another custom `fredholmDet` has only downstream uses in search, and no normal-jet or exterior-trace result appeared. A disposable local proof attempt imported and applied both frozen D5 partial owners with exit 0, deriving `normalJet t 0 = criticalXi t ^ 2` and scalar-product normalization separately; it stops at the absent theorem equating actual jet coefficients with the zero product, and adding that equality as a hypothesis would restate the atom."
    reentry_condition: "Correct formula (1554.2) to sum over indexed spectral copies or include the exact multiplicity combinatorics, or add a proved simplicity premise; then admit the exact order-one-half completed-xi canonical product under RH, a countable positive trace-class operator with the repeated inverse-square zero spectrum, its Fredholm determinant and exterior-power trace expansion, and a bridge identifying those coefficients with `NormalJetFormula.normalJet`."
    blocker_class: missing-prerequisite
