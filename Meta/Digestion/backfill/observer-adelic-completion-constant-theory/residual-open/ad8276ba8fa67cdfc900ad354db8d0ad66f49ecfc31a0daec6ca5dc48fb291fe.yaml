  quarantine:
    justification: "Retrieval preceded quarantine. D5 searches `Herglotz|Nevanlinna|Hadamard|logarithmic derivative|logDeriv` found `ShiftedHerglotzCriterion.shifted_herglotz_criterion`, `OffLinePickWitness.off_line_one_point_pick_witness`, `SimpleZeroLogResidue`, and canonical `xiReading` symmetry/zero-locus lemmas, but no Xi Hadamard product, no theorem that the canonical totalized `-deriv Xi / Xi` is holomorphic exactly off the zero set, and no RH equivalence. Pinned Mathlib search in `.lake/packages/mathlib/Mathlib` for `hadamard|weierstrass|Herglotz|Nevanlinna|Stieltjes.*transform` found only elliptic Weierstrass functions, matrix Hadamard products, generic `logDeriv`, and real Stieltjes cdf APIs; no entire-function factorization or upper-half-plane Herglotz criterion. The Suzuki/de Branges third-party route is not vendored as Lean and is recorded as wait-for-capability. A local Lean probe importing `D5.S3.Zeros.CompletedZeta`, `D5.S3.Analytic.Characterizations.ShiftedHerglotzCriterion`, and Mathlib logDeriv exited 1 on unknown `AnalyticOnNhd.hadamard`, `IsHerglotz`, `Nevanlinna`, and direct RH identifiers; the existing Cayley theorem cannot prove either Xi zero direction. The source theorem therefore cannot be stated faithfully without postulating its Hadamard expansion and pole argument, which would violate source scope and anti-tautology rules."
    reentry_condition: "Freeze a canonical Xi/Hadamard factorization with multiplicity summability, a public real-type zero symmetry and zero-locus bridge for `xiReading`, and a meromorphic logarithmic-derivative theorem showing upper-half-plane holomorphicity iff there are no upper-half-plane zeros; then prove the positive partial-fraction and converse directions on that exact carrier."
    blocker_class: missing-prerequisite
