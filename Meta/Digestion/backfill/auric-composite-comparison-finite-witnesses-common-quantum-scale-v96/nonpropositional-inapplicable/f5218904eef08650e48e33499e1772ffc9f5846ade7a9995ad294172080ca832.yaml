    justification: Pinned-upstream closure, with no available frozen project GID for the complete implication. The mathematical clause is a proposition; the existing settle receipt represents its upstream-only reuse, not a new Lean declaration or freeze. The hypotheses are precisely a finite-dimensional real positive inner-product space, a commutative bilinear S, an arbitrary left unit e, the Frobenius identity inner(S a x,y)=inner(x,S a y), and an arbitrary real-linear derivation d. No associativity, Jordan identity, skewness, normalization, distinguished basis, or nontriviality is assumed. In Definition 8.1 instantiate d with each D a; nonzero D and nonzero J are unnecessary stronger source conditions. Write L(a)=S a. Leibniz gives [d,L(a)]=L(d a) by pointwise linear-map normalization. If L(c) commutes with every L(a), C=L(d c)=[d,L(c)] commutes with L(c). LinearMap.trace_lie_mul_eq gives tr(C*C)=tr(d*[L(c),C])=0. Frobenius makes C symmetric. Choose stdOrthonormalBasis; LinearMap.IsSymmetric.adjoint_eq, LinearMap.toMatrix_adjoint, LinearMap.toMatrix_mul and LinearMap.trace_eq_matrix_trace convert this into tr(A.conjTranspose*A)=0. Matrix.trace_conjTranspose_mul_self_eq_zero_iff gives A=0 and injectivity of LinearMap.toMatrix gives C=0. Evaluation at e and commutativity/unit give d c=0. Leibniz at (e,e) gives d e=0. LinearMap.adjoint_inner_left, Frobenius and inner-product extensionality give d.adjoint(L(a)z)=L(a)(d.adjoint z)-L(d a)z. Thus H=d+d.adjoint commutes with all L(a). Set h=H e. Commutativity and the original unit yield H=L(h), so the preceding trace/Gram implication gives d h=0. Since h=d.adjoint e, adjoint_inner_left gives inner(h,h)=inner(e,d h)=0; inner_self_eq_zero gives h=0, hence H=0. Evaluating H on arbitrary x and pairing with arbitrary y yields inner(d x,y)=-inner(x,d y). Every helper in this route is an instance of the listed pinned Mathlib facts followed by hypothesis substitution, linear-map extensionality and algebraic normalization; no non-normalization witness remains. The pinned mathlib revision is 56a005855ea17e0b0958f73ec801ae140b0a1679. Other children of the mixed definition atom are not settled by this receipt.
