    justification: 本 atom 的全部命题子句由钉版 mathlib db584cd6d46c92f209a44c0f1c829460d327499d 闭合。上游声明为 LinearRecurrence.mkSol、LinearRecurrence.is_sol_mkSol、LinearRecurrence.mkSol_eq_init、LinearRecurrence.eq_iff_eqOn_range_order、Fin.sum_univ_two，以及 ZMod.natCast_eq_natCast_iff'、ZMod.subsingleton_iff、Bool.injective_iff、CharTwo.two_eq_zero、CharTwo.neg_eq、Nat.mod_eq_of_lt、Nat.sub_add_cancel 的规范化。二阶差序列取 E = ⟨2, ![1, -1]⟩，用 mkSol 延拓有限视界外序列，IsSolution 与初值侧条件由假设及上述上游声明闭合，再实例化 eq_iff_eqOn_range_order；其余步骤为定义展开、有限分情形、下标算术与环规范化。仓内只用冻结定义 GraftAffineClosure.quantity、ProfiniteCharacter.residueProjection、LegalDigits，没有供应该命题的项目 GID；FullCert.lean 中 result 是临时完整绑定证书，不作为项目 GID 或 coverage。判形裁决见 https://github.com/the-omega-institute/trureturing/issues/14425#issuecomment-6057702934。源正模数对应证书参数 m+1，来源域为 LegalDigits × (ProfiniteIntegers × ProfiniteIntegers)，没有添加假设。result 第 1 项给 r≥1 的双向核公式，第 2 项给 r=0 的单读数核，第 3 项给模一恒定迹。
