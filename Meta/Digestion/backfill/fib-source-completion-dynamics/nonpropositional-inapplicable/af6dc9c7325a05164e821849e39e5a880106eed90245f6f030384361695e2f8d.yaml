    justification: 本 atom 的全部命题子句由钉版 mathlib db584cd6d46c92f209a44c0f1c829460d327499d 闭合。上游声明为 LinearRecurrence.mkSol、LinearRecurrence.is_sol_mkSol、LinearRecurrence.mkSol_eq_init、LinearRecurrence.eq_iff_eqOn_range_order、Fin.sum_univ_two，以及 ZMod.natCast_eq_natCast_iff'、ZMod.subsingleton_iff、Bool.injective_iff、CharTwo.two_eq_zero、CharTwo.neg_eq、Nat.mod_eq_of_lt、Nat.sub_add_cancel 的规范化。二阶差序列取 E = ⟨2, ![1, -1]⟩，用 mkSol 延拓有限视界外序列，IsSolution 与初值侧条件由假设及上述上游声明闭合，再实例化 eq_iff_eqOn_range_order；其余步骤为定义展开、有限分情形、下标算术与环规范化。仓内只用冻结定义 GraftAffineClosure.quantity、ProfiniteCharacter.residueProjection、LegalDigits，没有供应该命题的项目 GID；FullCert.lean 中 result 是临时完整绑定证书，不作为项目 GID 或 coverage。判形裁决见 https://github.com/the-omega-institute/trureturing/issues/14425#issuecomment-6057702934。源正模数对应证书参数 m+1，来源域为 LegalDigits × (ProfiniteIntegers × ProfiniteIntegers)，没有添加假设。result 第 1–3 项给必要性、充分性与边界；第 4 项给 r=1 的初始余数逆矩阵公式；第 5 项给模数≥3、r≥2 的精确前缀/算术坐标等价；第 6–7 项给模二的移位前缀/一步轨迹等价及 r=1 的 z₁=(c₀−c₁,c₁)；第 8–9 项给首位差的算术补偿与固定算术坐标下首位相等；第 10 项给同地址同算术坐标产生同迹；第 11 项给任意模数及视界的同算术坐标同迹但第 r 位不同的来源，包含 r=0 不确定地址与模二不恢复 Uᵣ。
