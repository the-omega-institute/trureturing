    justification: Upstream-only bind-only reuse settlement under CLAUDE.md section 3.2; this mathematical proposition is not being classified as nonmathematical prose or counted as newly Lean-proved. No usable project GID supplies the complete proposition. Pinned mathlib4 revision 56a005855ea17e0b0958f73ec801ae140b0a1679 (v4.35.0) closes every clause. Definition 35.1 supplies 0<l<u<H, the actual normalized sine ground state of G (25.5), raw dk and the wall coefficients of G (21.7). Affine interval substitution via intervalIntegral.integral_comp_mul_sub and integral_sin_sq, together with Real.sq_sqrt, proves normalization rather than assuming it. ContinuousOn.integrableOn_Icc and MeasureTheory.IntegrableOn.mono_set give all natural inverse moments on Ioo l u using l>0. MeasureTheory.integral_add, integral_const_mul, integral_congr_ae and integral_neg expand all nine entries of (36.11), including all symmetric cross terms. Real.sin_pos_of_pos_of_lt_pi gives positive weight; MeasureTheory.integral_pos_iff_support_of_nonneg_ae and Real.volume_Ioo give the strict negative AB integral, hence Matrix.IsDiag fails. For wall positive definiteness, MeasureTheory.integral_eq_zero_iff_of_nonneg_ae and MeasureTheory.Measure.eqOn_Ioo_of_ae_eq turn a zero quadratic form into a continuous zero linear combination. Multiplication by 2*H*k gives the polynomial -(x0+x1)*k^2+(H*x0-2*x2)*k+2*H*x2. Polynomial.eq_zero_of_infinite_isRoot with Set.Ioo_infinite and Polynomial.coeff_C_mul_X_pow, coeff_C_mul_X and coeff_C forces x=0; Matrix.posDef_iff_dotProduct_mulVec concludes PosDef. Finite-sum integral identities use MeasureTheory.integral_finsetSum and integrable_finsetSum. Every step is upstream instantiation, projection or normalization; no integrability, normalization, moment inequalities or positivity is added as a premise. The independent caller-supplied exact-statement probe reports make lean exit 0. Only Proposition 36.2 and its wall positivity are settled; the separate uniform-in-kappa bounds, local limits and Gaussian claims of Theorem 36.1 are outside this atom and are not claimed. No new Lean, Scribe, Reg or frozen module is delivered.
