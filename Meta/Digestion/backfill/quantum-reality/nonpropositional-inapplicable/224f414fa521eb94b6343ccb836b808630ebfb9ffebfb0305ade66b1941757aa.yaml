    justification: Upstream-only bind-only settlement under CLAUDE 3.2, not nonmathematical prose. ST22.1 on finite-dimensional complex Hilbert spaces follows from pinned Mathlib LinearIsometry.adjoint_comp_self, ContinuousLinearMap.adjoint_comp and adjoint_adjoint, composition distributivity, norm_sub_le, opNorm_comp_le and adjoint.norm_map. With Q=I-UU-adjoint, Q is self-adjoint and idempotent; expansion gives the product defect, subtraction with A and B exchanged gives the commutator defect, and the two composition norm bounds give exactly twice the product of the normal-block norms. The complete three-clause exact application compiled with standard-three axioms and independent review; no surjectivity or nonzero-dimension premise. No complete frozen project GID was identified, so no cover edge or new Lean wrapper is supplied. Neighbor ST22.3 and its example are excluded.
