  quarantine:
    justification: "carried: 已打开 D5/S3/Quantum/Matrix/MatrixSelfPairing.lean 与 D5/S3/QuantumStates/GNSStateCone.lean 全文并读取冻结状态片。D5/S3/Quantum/Matrix/MatrixSelfPairing.matrix_self_pairing_and_nonnegative，Lean 全名 D5.S3.Quantum.Matrix.MatrixSelfPairing.matrix_self_pairing_and_nonnegative，第一合取项给 Tr(rho * xᴴ * x) = (‖x * sqrt(rho)‖ : ℂ)^2，第二项给实 Frobenius 范数平方非负。D5/S3/QuantumStates/GNSStateCone.state_cone_sections，Lean 全名 D5.S3.QuantumStates.GNSStateCone.state_cone_sections，其第一分量的 ∀x 中进一步显式给 0 ≤ Tr(rho * xᴴ * x)，采用源码的 ComplexOrder。这些声明均要求有限指标类型的 Fintype/DecidableEq、rho.PosSemidef 与 trace rho = 1；它们承载的是当 x 被绑定为自伴 L_a 时可用的迹正性步骤，尚未给出实际 Fisher 矩阵的二次型非负。uncarried: 缺原文密度态、SLD 族与这些矩阵前件的绑定，缺 L_a = Σ a_α L_α 的自伴性，缺 J_αβ = Re Tr(rho L_α L_β) 到 aᵀJa = Re Tr(rho L_a²) 的展开及迹为实的对齐；还缺任意实 Jacobian T 的合同变换 PSD 保持、同原文参数变换的连接，以及负方向与 PSD 的矛盾。scope gap: 已读 CAS 全文及源卷定义91.1，源文定义了参数态、SLD 方程与 Fisher 矩阵，但该 atom 和所读定义未逐项声明 owner 的有限维、PSD、迹一与矩阵自伴前件；owner 不能因某个证明步骤未用 hTrace 就省去其签名中的假设。owner 量化任意操作矩阵 x，原文量化实参数向量 a 并讨论全部可逆实坐标变换；这些中间连接未齐，几何区分解释也不能被一般范数平方替代。near misses: 实跑 rg -n 'gns_matrix_identity|CFC.sqrt rho|trace.*xᴴ|trace.*PosSemidef' D5/S3/Quantum D5/S3/QuantumStates，发现并读到上述额外的 state_cone_sections；实跑 rg -n -i 'covertThroat|public_recovery|ker_le_ker|fisher|lorentz|mana|wigner|\\bLDL\\b' D5 --glob '*.lean' 搜相邻领域。已读 D5/S3/Quantum/GNSMatrix.gns_matrix_identity，其陈述为迹等于范数平方，没有显式非负合取；已读 D5/S3/Resource/LogDet/CongruenceGeometry.logDetDivergence_conjugate_congr，它断言 logDetDivergence 的复矩阵合同不变性，不给 Fisher PSD 或负方向障碍；已读 D5/S3/Analytic/ZetaObservation/ZetaSampleInformationAdditivity.zeta_sample_information_additive 的实际陈述，它是 zeta 样本对数和的方差可加性；已读 D5/S3/Observer/GoldenCoding/GoldenLorentzUpdate.golden_lorentz_update，它是二维 Fibonacci 更新对 Q(x,y)=x²-xy-y² 的取负/保持，亦不补齐本条。故多项承重连接尚缺，归 multi-clause-guard。同族对照(a): 实跑 ls Meta/Digestion/backfill/quantum-reality/absorbed-closed/ | wc -l 得3，实跑 rg -l '^ quarantine:' Meta/Digestion/backfill/quantum-reality/residual-open/ | wc -l 得0，并以 YAML 解析复核。已读闭合兄弟 fe7e85c4124aaf6dff4973c9915d4cf734900fb7d928ef483f1a75fdf307d397 的账目和 CAS 全文，逐字引句：“因此不同 \\(\\rho_i\\) 的支持两两正交。每个支持至少一维，故 \\(N\\le d\\)。∎”该引句从可无误区分的记忆态的支持正交性推出历史数 N 的容量界；本条要求实系数 SLD 组合的二次型非负及任意实合同下的负方向障碍，历史容量界不提供这些子句。诚实标注: 本席读取 HEAD 953f98b36387d7a4822b88ed04c47f943e953060；目标仍在 residual-open，coverage_gids 为空，receipts 中无 cover_disposition。ASSUMED-UNVERIFIED: 未跑 Lean/LSP、kernel、公理闭包、Scribe、链判官或准入门，未作完整钉版库及第三方检索，未核验源模型绑定和下述重入复合；均列入 assumed_unverified，不把源码阅读报告为形式闭合。"
    reentry_condition: "先落实原文量化模型到 owner 前件的绑定：态空间与参数指标的有限性、rho.PosSemidef、trace rho = 1、SLD L_α 的矩阵自伴性及实参数坐标变换。若原文允许超出该有限矩阵域的模型，须提供同范围的迹类算子版本及收敛前件的依据，不能把有限维结论冒充原文全称。提供冻结的 D5 或钉版库定理，陈述为：对上述已绑定 rho、任意自伴 SLD 族 L、任意 a : ι → ℝ，设 A = Σα (a α : ℂ) • L α，J α β = (Matrix.trace (rho * L α * L β)).re，则 Aᴴ = A 且 aᵀJa = (Matrix.trace (rho * Aᴴ * A)).re，并证明原文 Tr(rho A²) 与此实数相符。将该展开与 D5/S3/Quantum/Matrix/MatrixSelfPairing.matrix_self_pairing_and_nonnegative 的范数平方表达式，或 D5/S3/QuantumStates/GNSStateCone.state_cone_sections 第一分量的迹非负复合，得到实际 J 的所有实二次型非负。再提供冻结 D5 或钉版库的实矩阵合同定理：若 ∀v, 0 ≤ vᵀJv，则对任意实 T 与 b，bᵀ(TᵀJT)b = (Tb)ᵀJ(Tb) ≥ 0；把它绑定到原文的 Jacobian 变换，再以存在 b 使 bᵀGb < 0 推出 G ≠ TᵀJT，特别排除具有负方向的非退化 Lorentz 度量。上述模型前件、迹展开、变换与负方向子句全部接齐后，才重审本 atom 的 quarantine。"
