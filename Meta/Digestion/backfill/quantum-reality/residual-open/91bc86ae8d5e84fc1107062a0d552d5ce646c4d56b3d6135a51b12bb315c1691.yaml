  quarantine:
    justification: "Read-only reassessment at HEAD=origin/dev=685e83157841d6151cd3f8c754af6acd33014aca. The actual YAML and CAS were read, together with QUANTUM-REALITY.md 19815-19874 fixing the operators, state and constraint space. coverage_gids is empty; receipts has neither cover_disposition nor a quarantine; there is no chain_atoms entry. Thus neither disposition coexistence nor an unfinished child migration is the reason for this proposal. Complete substantive clauses mean the actual state's zero-locus identity, its cardinality, the real dimension of its actual constrained space, and its actual Wigner L1 value. No inspected frozen declaration proves any one of these clauses. (1) D5 search: rg -n -i 'wigner|ququint|phasePoint|phase_point|criticalDirection|\\bmana\\b' D5 --glob '*.lean' returned only D5/S3/Constants/WignerYanaseSpectrum, whose public wy_contraction_spectrum_strict_order was read. Its four inequalities concern rational functions of log 2 in an information-metric contraction spectrum, not the discrete Wigner function, the five lattice points, or the state psi. A broader search 'wigner|ququint|phase.?point|zero.?set|constrained.*(space|direction)' across D5 also returned unrelated spectral zero sets and generic zero-set pullbacks, not the concrete finite-state claim. The quantum-directory search 'wigner|ququint|phase.?point|\\bmana\\b|sqrt 5|sqrt \\(5|finrank.*= 4' (also including the literal radical spelling in the executed command) found no candidate. File-name searches for Weyl and phase modules led to direct reads of WeylDisplacement and WeylDisplacementAdjoint. D5/S3/Quantum/Algebra/WeylDisplacement.displacement_mul proves the cocycle law for X^a Z^b over ZMod M; D5/S3/Quantum/Algebra/WeylDisplacementAdjoint.displacement_adjoint proves its adjoint formula. Their frozen state fragments were read, with statement IDs sha256:c8e5ef980a57b4d4b3e6aa0ef0502ce5aa7ef730c6668f0a7f724750556387fc and sha256:8aae4e564b5324721006f2820a517ebfe2132d726deb1f4861e2df87f09df85e. These are reusable operator identities, but the phase-point matrix A is not that displacement word without an additional parity/phase identification; neither theorem evaluates psi, its 25 quadratic values, or the real constraint matrix. Setting M=5 does not supply a complete clause. The WignerYanase module is also frozen, with statement ID sha256:b2c6805867f958698cfe54418b5ee3140d2235d8632020f96c44c1f723b4b477. (2) Pinned mathlib: lake-manifest.json and the package's git HEAD both identify db584cd6d46c92f209a44c0f1c829460d327499d. Running 'wigner|ququint|phasePoint|phase_point|criticalDirection|\\bmana\\b' over .lake/packages/mathlib/Mathlib/*.lean recursively returned no matches (rg exit 1). Searches for 'finrank.*(ker|range)|rank.*nullity' and 'cos_pi_div_five|cos_two_pi_div_five' led to direct reads of LinearMap.finrank_range_add_finrank_ker and Real.cos_pi_div_five. The former gives finrank(range F)+finrank(ker F)=finrank(V), but does not prove rank 6 for this F. The latter evaluates cos(pi/5)=(1+sqrt 5)/4 and supports cyclotomic arithmetic, but supplies neither the state's quadratic-value table nor its sign/zero classification. These missing concrete inputs cannot be counted as already carried clauses. (3) Network was available. NyxID/Tavily was actually queried with 'Lean theorem prover discrete Wigner ququint mana phase point operators github'; it returned duckki/quantum-computing-lean, Timeroot/Lean-QuantumInfo, inQWIRE/LeanQuantum and general Lean pages. The returned snippets describe finite-dimensional matrix/gate/measurement APIs, migration into Physlib, and qubit Pauli/stabilizer codes; none exhibits this ququint certificate. A further requested query 'site:github.com/leanprover-community/physlib Wigner mana' was echoed by the service as 'Wigner mana' and returned Physlib project/README pages and a SpaceTime issue. Those are project-level hits, not evidence that Physlib contains or lacks the requested theorem. A targeted extraction of duckki's project page returned page/editor fragments without a Wigner declaration. Initial requests without an explicit JSON Content-Type returned HTTP 422 and supplied no search evidence; the repeated requests with that header succeeded. The precise missing prerequisite is a concrete algebraic certificate, provisionally named ququint_phase_point_constraint_certificate; the following is a Lean-like specification, not an elaborated declaration. Let I=ZMod 5, V=EuclideanSpace Complex I, zeta=Complex.exp(2*pi*Complex.I/5), psi=(1,1,zeta^3,1,zeta^2)/sqrt 5, A(q,p)[x,y]=if x+y=2*q then zeta^((p*(x-y)).val) else 0, W(v,(q,p))=(1/5)*Complex.re(dotProduct (star v) ((A(q,p)).mulVec v)), and L1(v)=sum_z abs(W(v,z)). Let S : Finset (I*I) be exactly {(0,3),(1,3),(2,4),(3,1),(4,4)}. Define the real-linear map F : V ->_Real (Real*Real*(S -> Real)) by F(v)=(Re(psi^H*v), Im(psi^H*v), fun z => Re(psi^H*A(z)*v)), with S in a binder denoting its subtype. Require a theorem with conclusions (forall z, (A z).IsHermitian) AND sum_z A z=5*1 AND norm(psi)^2=1 AND (forall z, W(psi,z)=0 iff z in S) AND L1(psi)=1+2*Real.sqrt 5/5 AND Module.finrank Real (LinearMap.range F)=6. Every coordinate, phase convention and rank claim must be proved from these independently fixed data. F has seven displayed real coordinates (two orthogonality coordinates plus five zero-point coordinates), of which only six are independent; it must not be silently replaced by an arbitrary six-row map. Defining T by the source's zero set then yields T=ker F. A local declaration merely taking the zero-set equality, L1 value or rank as hypotheses would only project the desired answer. Defining Z0 to be S, defining L1 to equal the target radical, or defining T as Real^4 would change the objects. A genuine exact cyclotomic computation and rank certificate could establish the prerequisite; the gap is an absent verified certificate, not mathematical impossibility. ASSUMED-UNVERIFIED: no Lean/LSP elaboration, compiler, Lake, numerical experiment or repository gate was run; the proposed types and the V-to-matrix coordinate bridge have not been checked; the 25 values and rank have not been independently computed in this seat. External project source closures, proof status, licensing and compatibility with this pin were not audited. The zero-carrier conclusion is the result of the named searches and inspected statements, not a semantic enumeration of every equivalent encoding or a global claim about all Lean libraries."
    reentry_condition: "Provide a frozen D5 theorem or a theorem available in the pinned library for the independently defined I=ZMod 5, zeta=exp(2*pi*i/5), psi=(1,1,zeta^3,1,zeta^2)/sqrt 5 and A(q,p)[x,y]=if x+y=2*q then zeta^((p*(x-y)).val) else 0. Its statement must prove that all A are Hermitian, sum A=5I and norm(psi)^2=1, and must conclude: W(psi,z)=0 iff z belongs to S={(0,3),(1,3),(2,4),(3,1),(4,4)}; sum_z abs(W(psi,z))=1+2*sqrt 5/5; and rank_Real F=6 for the real-linear map F(v)=(Re(psi^H*v),Im(psi^H*v),(Re(psi^H*A(z)*v))_(z in S)). W is the actual quadratic form Re(v^H*A(z)*v)/5, and the seven coordinates of F must be constructed from the stated data. With that theorem, the membership equivalence gives the actual Z0=S; finite-set simplification proves S.card=5; unfolding the original constraints using Z0=S identifies T with ker F. Apply LinearMap.finrank_range_add_finrank_ker to F, use the real dimension 10 of EuclideanSpace Complex (ZMod 5), and subtract the certified rank 6 to obtain finrank Real T=4. The certificate's L1 equality gives the final boxed value directly; its normalization and operator sum also yield sum_z W(psi,z)=1. Check these bindings and the composite declaration before asserting coverage. An assumed rank, preassigned zero set, or preassigned L1 constant does not satisfy this condition."
    blocker_class: missing-prerequisite
