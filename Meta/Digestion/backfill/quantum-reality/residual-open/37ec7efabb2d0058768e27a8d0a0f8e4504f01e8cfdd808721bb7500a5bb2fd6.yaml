  quarantine:
    justification: "[1. Evidence and search scope] At repository HEAD 953f98b36387d7a4822b88ed04c47f943e953060, the target residual-open YAML has coverage_gids: [] and receipts containing only empty scribe and unresolved_subitems lists; cover_disposition is absent. The CAS text and QUANTUM-REALITY.md lines 19800-19980 were read directly, including the specific state psi=(1,1,zeta^3,1,zeta^2)/sqrt(5), the 25 phase-point operators, W, L, Z0 and T. Empty coverage alone was not used to infer zero carriage. D5 search for '\\bmana\\b|\\bWigner\\b|\\bLDL\\b|WignerFunction|wigner_function|criticalDirection|critical_direction|phasePoint|phase_point|discrete.*phase|negative.?definite' found WignerYanaseSpectrum and the negative-definite text in ConfluentNegativeJetBlock and ExactStickyReduction. All three Lean files and their frozen state slices were read. Further searches for normalized perturbations, ququints, the paper identifier, and phase-point terminology found no source-specific declaration; a quantum-directory search located WeylDisplacement and WeylPhaseArithmetic, whose public statements and frozen state slices were also read. Pinned mathlib was searched in .lake/packages/mathlib; lake-manifest.json and the package HEAD both identify db584cd6d46c92f209a44c0f1c829460d327499d, with Lean v4.33.0. The Wigner/mana/ququint/normalized-perturbation query returned no matches; the LDL query located LDL.lower_conj_diag. Matrix positivity, logarithm, finite-filter and inner-product searches located the exact declarations named under SEARCH TRAIL below, whose relevant statement text was read. Network access was available through NyxID/Tavily: four Lean-ecosystem searches were actually run, followed by extraction of the inQWIRE/LeanQuantum, guest2180/lean4-quantum and Anderssorby/Quantum.lean project pages. GitHub API attempts returned HTTP 400 for credential states failed and pending_auth, so those attempts supplied no code-search evidence. Initial Tavily calls without an explicit JSON content type returned HTTP 422; the recorded successful searches used Content-Type: application/json. [2. Near misses and their shortfalls] D5.S3.Constants.WignerYanaseSpectrum.wy_contraction_spectrum_strict_order only orders five constants involving log(2); it supplies no Wigner state, direction constraint, coefficient C, or perturbation identity. D5.S3.Analytic.ReflectedSpectrum.ConfluentNegativeJetBlock.confluent_negative_jet_block proves (-G).PosDef and an inertia count only from H.PosDef, IsUnit L, G.IsHermitian and G=-(L^H*H*L); none of the 32 source matrices or their positive diagonal factors is provided. Its index-lower-bound companion has the same unmet premises. D5.S3.Weil.ZetaLinear.ExactStickyReduction.exact_sticky_reduction transfers nonnegativity and negative inertia across an abstract Schur complement under nonnegativity, symmetry and inverse hypotheses; it provides neither a negative value for this C nor any source-specific block identification. D5.S3.Quantum.Algebra.WeylDisplacement.displacement_mul/displacement_sq and D5.S3.Quantum.Algebra.WeylPhaseArithmetic.windowRoot_pow_mod/windowRoot_pow_val_add are cyclic operator and phase arithmetic, without the source phase-point kernel, psi, T or a sign certificate. These are reusable preliminaries, not carriers of any complete load-bearing clause of this atom. Mathlib's LDL.lower_conj_diag is especially unsuitable as a positivity witness: its parameter hS : S.PosDef already assumes the property sought for S=-M_s. Matrix.posDef_diagonal_iff, Matrix.IsUnit.posDef_star_right_conjugate_iff and Matrix.PosDef.dotProduct_mulVec_pos can consume an explicit certificate but do not supply its entries, invertibility, 128 strict pivot inequalities or Wigner-coordinate binding. Real.log_lt_log requires both a positive smaller argument and an already established strict L comparison; it does not produce either for this state. The finite-filter and norm identities do not provide source stationarity or matrix negativity. External near hits were a Wigner semicircle-law poster (random-matrix spectral limits, not discrete Wigner quasiprobabilities), a generalized quantum Stein lemma formalization (asymptotic hypothesis testing, not the concrete local coefficient), and the three extracted quantum-library pages. inQWIRE/LeanQuantum describes qubit gates, Pauli algebra and stabilizer codes, and advertises Lean v4.26.0-rc2; guest2180/lean4-quantum describes matrix/circuit, no-cloning and uncertainty foundations and advertises Lean v4.16.0; Anderssorby/Quantum.lean describes a quantum-computing simulation project. None of those inspected pages presents the five-dimensional constrained-direction theorem or its concrete LDL data. The PhysLean search returned project ideas and unrelated generated build documentation, not a matching theorem. These are page-level findings, not a claim that every file of those repositories was searched. [3. Missing prerequisite] The required new fact is a concrete ququint Wigner-coordinate and LDL certificate: for the fixed A and psi, prove Hermiticity, sum(A)=5I, norm(psi)=1, the stated five-element Z0 and S*psi=5*L(psi)*psi; construct a real linear equivalence from Real^4 onto the actual constrained space T and source-derived matrices M_s for all 32 signs; prove every independently constructed -M_s equals U_s*diagonal(d_s)*transpose(U_s), with U_s invertible lower triangular and every one of the 128 embedded quartic-field pivots strictly positive. The Lean-like signature and exact branch identity are spelled out below under REQUIRED STATEMENT. This certificate, not an abstract PosDef hypothesis, is what the existing library can consume. [4. Why direct synthesis would be empty] Introducing a structure whose fields are C(phi)<0, (-M_s).PosDef, the desired perturbation equality or the positive pivots, and projecting those fields, would assume the requested result or its entire numerical burden. Defining M_s from arbitrary LDL factors, or redefining W/L to satisfy the fraction, would lose the source's fixed objects. Calling LDL.lower_conj_diag with hS=(-M_s).PosDef is circular for this purpose. A real construction and proof may be possible, but no such construction was verified in the searched frozen repository; this is not a mathematical impossibility claim. [5. Honest limits] This is a read-only declaration and source audit. No Lean elaboration, kernel run, make preflight/gate/lean/lean-report, or lake command was performed. The proposed certificate, its matrices and rational interval proofs, the composition into the complete atom, third-party code-level completeness, and pin compatibility remain assumed_unverified as itemized below. The external paper search did retrieve the conventional definition mana=log(sum(abs(W))) in arXiv:2512.19657v1 equations (2.48)/(2.51); a typed binding to this repository's future pure-state W API still has to be supplied. On the inspected frozen declarations, no complete source-specific clause is carried, so missing-prerequisite is the proposed classification. SEARCH TRAIL (inlined; no external field is referenced): [D5] query=\\bmana\\b|\\bWigner\\b|\\bLDL\\b|WignerFunction|wigner_function|criticalDirection|critical_direction|phasePoint|phase_point|discrete.*phase|negative.?defin ; hits=4 ; insufficient: The direct keyword matches were comments in three modules; the listed public statements were subsequently read in full. The log(2) ordering has unrelated objects. The negative-jet theorems need a positive H, an invertibl | [D5] query=normali[sz].*perturb|perturb.*normali[sz]|wigner|\\bmana\\b|ququint|2512\\.19657|10 \\+ 2 \\*.*sqrt 5|critical.*state ; hits=2 ; insufficient: No match for the ququint, paper identifier or normalized-perturbation expressions. The critical-line text concerns zero-location criteria, not the source's concrete state; it is recorded only as textual search noise, not | [D5] query=normali[sz]|cyclotomic|zeta|root.*unity|PosDef|negative.*definite|perturb; quantum-directory search, followed by direct reads of WeylDisplacement and ; hits=4 ; insufficient: These frozen operator/phase identities could support later algebra, but do not identify the source's A(q,p), fixed psi, constrained T, C or M_s. They carry no complete claim of this atom. The broad quantum search display | [mathlib] query=wigner|\\bmana\\b|ququint|criticalDirection|phasePoint|phase_point|normali[sz].*perturb|perturb.*normali[sz]; all .lean files under .lake/packages/mathl ; hits=0 ; insufficient: rg exited 1 with no matches. This is a textual absence in the pinned source, not a semantic enumeration of all equivalent encodings. | [mathlib] query=\\bmana\\b|\\bWigner\\b|\\bLDL\\b|WignerFunction|wigner_function|phasePoint|phase_point|ququint|stabilizer.*state|magic.*state ; hits=3 ; insufficient: The full Analysis/Matrix/LDL.lean file was read. Its constructions and theorems take hS : S.PosDef; they decompose an already positive-definite S and do not establish positive definiteness of the concrete -M_s, explicit | [mathlib] query=posDef_diagonal_iff|posDef.*conjugate|posDef_iff; direct reads of Matrix/PosDef.lean ; hits=5 ; insufficient: These are genuine reusable implications. They require the source's explicit diagonal positivity, invertibility and branch identification, which the inspected D5 declarations do not supply. None alone carries this atom's | [mathlib] query=strictMonoOn_log|log_lt_log|sq_pos_of_ne_zero|div_neg_of_neg_of_pos; norm_add_sq; eventually_lt; eventually_all; abs_sum_le_sum_abs ; hits=8 ; insufficient: These support the scalar, norm, finite-sign and logarithm steps after the source-specific certificate is proved. They do not prove stationarity, the sign of C, or the coordinate realization. The proposed composition was | [third-party] query=GitHub API /search/code?q=Wigner+language%3ALean&per_page=20 and /search/repositories?q=quantum+language%3ALean&per_page=20 through NyxID ; hits=0 ; insufficient: Both attempts returned HTTP 400 from the broker, with credential states failed and pending_auth respectively. No GitHub code/repository search response was obtained; these empty hits are unavailable evidence, not a negat | [third-party] query=Tavily: Lean theorem prover discrete Wigner mana ququint LDL ; hits=3 ; insufficient: The returned excerpts concern random-matrix spectral limits, asymptotic quantum hypothesis testing or introductory material. None supplies the target five-dimensional Wigner state or its local strict-descent certificate. | [third-party] query=Tavily: Lean 4 quantum mechanics library PhysLean Wigner function; site:physlean.com Wigner quantum state ; hits=4 ; insufficient: The quantum-information hit is a library-description excerpt without the requested theorem. The project-ideas pages describe proposed physics formalizations; the Wigner article is prose rather than a Lean declaration. No | [third-party] query=Tavily: site:github.com Lean Wigner mana quantum; then /extract of the three Lean 4 project pages ; hits=5 ; insufficient: Directly extracted pages describe qubit gates/Pauli/stabilizer codes, matrix/circuit/no-cloning/uncertainty foundations, and simulation respectively. The first two pages advertise v4.26.0-rc2 and v4.16.0 rather than this | [third-party] query=Tavily: site:arxiv.org/html/2512.19657 mana logarithm Wigner ; hits=1 ; insufficient: This supports the intended definition, not a Lean proof of the ququint local result. The source-to-Lean binding and the v2 paper contents were not checked. REQUIRED STATEMENT (inlined): Required concrete statement, with proposed names only and no claim of elaboration: ququint_wigner_LDL_certificate. Set V := EuclideanSpace Complex (ZMod 5), using its Hilbert norm, not the sup norm on an unbundled function space. Let zeta=Complex.exp(2*pi*I/5), psi=(1,1,zeta^3,1,zeta^2)/sqrt(5), and A(q,p)[x,y]=if x+y=2*q then zeta^((p*(x-y)).val) else 0. Define W(v,z)=(1/5)*Re(v^H*A(z)*v), L(v)=sum_z abs(W(v,z)), Z0={z | W(psi,z)=0}, T={phi | psi^H*phi=0 and forall z in Z0, Re(psi^H*A(z)*phi)=0} as the real submodule of V. Let S=sum_(z notin Z0) sign(W(psi,z))*A(z) and C(phi)=sum_(z notin Z0) sign(W(psi,z))*W(phi,z)+sum_(z in Z0) abs(W(phi,z))-L(psi)*norm(phi)^2. Put R=sqrt(10+2*sqrt(5)) and K=Q(R) as its actual embedded real subfield. The theorem must conclude (forall z, (A z).IsHermitian) AND sum_z A z=5*I AND norm(psi)=1 AND Z0={(0,3),(1,3),(2,4),(3,1),(4,4)} AND S*psi=5*L(psi)*psi, together with concrete witnesses e, Q, M, U and d as follows. e is a real LinearEquiv from (Fin 4 -> Real) onto T. Q(z) is a symmetric real 4x4 matrix obtained by pulling back the independently defined Wigner form through e; prove forall z a, dotProduct a ((Q z).mulVec a)=W((e a).val,z), with its entries in K. Define M(s) independently as sum_(z notin Z0) sign(W(psi,z))*Q(z)+sum_(z in Z0) signOfBool(s(z))*Q(z)-L(psi)*Gram(e), where signs range over Z0 -> Bool, signOfBool true=1 and signOfBool false=-1, and Gram(e) is the real Hilbert Gram matrix of the basis e. Prove the corresponding norm Gram identity and thus the complete branch identity forall s a, dotProduct a ((M s).mulVec a)=sum_(z notin Z0) sign(W(psi,z))*W((e a).val,z)+sum_(z in Z0) signOfBool(s(z))*W((e a).val,z)-L(psi)*norm((e a).val)^2. For explicit U : (Z0 -> Bool) -> Matrix (Fin 4) (Fin 4) K and d : (Z0 -> Bool) -> (Fin 4 -> K), prove forall s, IsUnit (U s) AND (forall i j, i<j -> U s i j=0) AND (forall i, 0 < (d s i : Real)) AND -(M s)=realMatrix(U s)*Matrix.diagonal(fun i => (d s i : Real))*Matrix.transpose(realMatrix(U s)). realMatrix here means entrywise inclusion K -> Real; Z0 in binder types means its subtype, and the set equality supplies its five-element enumeration. All concrete entries, invertibility, factorization equalities and pivot signs must be proved from the fixed data, not passed as assumptions. This is a Lean-like specification of the missing certificate and coordinate facts, not an existing declaration and not a proof term. The companion pure-state binding must fix mana(v)=Real.log(L(v)), or prove the actual change of base strictly increasing. Define pert(phi,epsilon)=norm(psi+epsilon*phi)^(-1) * (psi+epsilon*phi) using real scalar multiplication; its exact L variation is to be derived from this certificate by the steps in reentry_condition. WHY A LOCAL CONSTRUCTION WOULD BE HOLLOW (inlined): The mathematical assertion can only be established by proving the actual source-specific algebra and inequalities. A new declaration with hypotheses C(phi)<0 or forall s, (-M s).PosDef, or a structure field containing the target expansion or 128 positive pivots, would only project an assumption. LDL.lower_conj_diag already requires positive definiteness, so applying it to -M_s cannot establish that premise. Choosing arbitrary positive diagonal data and defining M_s from the resulting product would redefine the source's independently fixed Wigner forms. Replacing W or L by an expression engineered to equal the target fraction would likewise change the problem. The existing general matrix and logarithm lemmas are useful after explicit state, coordinate, sign, and normalization facts are proved; they do not synthesize those facts. This records a presently missing verified prerequisite, not a claim that constructing it is mathematically impossible."
    reentry_condition: "Provide a frozen D5 theorem, or a theorem in the pinned library, with the concrete ququint_wigner_LDL_certificate statement specified in missing_statement: it must construct the real coordinate equivalence for the actual T, identify each of the 32 branch matrices with the actual Wigner quadratic form, prove the actual state's normalization and stationarity, and certify all 32 invertible lower-triangular factorizations with all 128 positive quartic-field pivots as conclusions. The phase-point operators, W, L, psi and M_s must be defined independently of those positivity conclusions. Then apply Matrix.posDef_diagonal_iff and Matrix.IsUnit.posDef_star_right_conjugate_iff to obtain (-M_s).PosDef. For each nonzero phi in T, write phi=e(a), use injectivity to get a != 0, and choose each sign from the sign of W_phi at the corresponding zero point (either sign at zero). The certificate's branch equality makes C(phi) exactly a^T*M_s*a; Matrix.PosDef.dotProduct_mulVec_pos therefore gives C(phi)<0. Expand the fixed Hermitian quadratic W at psi+epsilon*phi. Its signed linear term vanishes by S*psi=5*L(psi)*psi and psi^H*phi=0, and its zero-point linear terms vanish by membership in T. Apply ContinuousAt.eventually_lt to the finitely many nonzero W_psi values and Filter.eventually_all to obtain one delta>0 preserving their signs on abs(epsilon)<delta. Use norm_add_sq and orthogonality to obtain norm(psi+epsilon*phi)^2=1+epsilon^2*norm(phi)^2, and W's quadratic homogeneity to derive, for real epsilon with 0<abs(epsilon)<delta, L(pert(phi,epsilon))-L(psi)=epsilon^2*C(phi)/(1+epsilon^2*norm(phi)^2). The denominator is positive and epsilon^2>0, so div_neg_of_neg_of_pos gives strict descent. The certified sum(A)=5I implies sum(W_v)=norm(v)^2, hence L(v)>=1 on normalized states by Finset.abs_sum_le_sum_abs; apply Real.log_lt_log using the explicit mana(v)=Real.log(L(v)) binding (or a proved strictly increasing change of logarithm base). Mere non-strict monotonicity is not enough. Finally use the coordinate equivalence's nonzero basis direction, continuity of pert at zero and the strict comparisons for arbitrarily small nonzero epsilon to obtain the stated nonminimum and nonflat conclusions along T. Reentry requires these concrete certificate and binding obligations to be discharged and the resulting composite declaration checked before a coverage claim."
