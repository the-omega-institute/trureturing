  quarantine:
    justification: "[1. Evidence and search scope] At repository HEAD 953f98b36387d7a4822b88ed04c47f943e953060, the target residual-open YAML has coverage_gids: [] and receipts containing only empty scribe and unresolved_subitems lists; cover_disposition is absent. The CAS text and QUANTUM-REALITY.md lines 19800-19980 were read directly, including the specific state psi=(1,1,zeta^3,1,zeta^2)/sqrt(5), the 25 phase-point operators, W, L, Z0 and T. Empty coverage alone was not used to infer zero carriage. D5 search for '\\bmana\\b|\\bWigner\\b|\\bLDL\\b|WignerFunction|wigner_function|criticalDirection|critical_direction|phasePoint|phase_point|discrete.*phase|negative.?definite' found WignerYanaseSpectrum and the negative-definite text in ConfluentNegativeJetBlock and ExactStickyReduction. All three Lean files and their frozen state slices were read. Further searches for normalized perturbations, ququints, the paper identifier, and phase-point terminology found no source-specific declaration; a quantum-directory search located WeylDisplacement and WeylPhaseArithmetic, whose public statements and frozen state slices were also read. Pinned mathlib was searched in .lake/packages/mathlib; lake-manifest.json and the package HEAD both identify db584cd6d46c92f209a44c0f1c829460d327499d, with Lean v4.33.0. The Wigner/mana/ququint/normalized-perturbation query returned no matches; the LDL query located LDL.lower_conj_diag. Matrix positivity, logarithm, finite-filter and inner-product searches located the exact declarations named in searches below, whose relevant statement text was read. Network access was available through NyxID/Tavily: four Lean-ecosystem searches were actually run, followed by extraction of the inQWIRE/LeanQuantum, guest2180/lean4-quantum and Anderssorby/Quantum.lean project pages. GitHub API attempts returned HTTP 400 for credential states failed and pending_auth, so those attempts supplied no code-search evidence. Initial Tavily calls without an explicit JSON content type returned HTTP 422; the recorded successful searches used Content-Type: application/json. [2. Near misses and their shortfalls] D5.S3.Constants.WignerYanaseSpectrum.wy_contraction_spectrum_strict_order only orders five constants involving log(2); it supplies no Wigner state, direction constraint, coefficient C, or perturbation identity. D5.S3.Analytic.ReflectedSpectrum.ConfluentNegativeJetBlock.confluent_negative_jet_block proves (-G).PosDef and an inertia count only from H.PosDef, IsUnit L, G.IsHermitian and G=-(L^H*H*L); none of the 32 source matrices or their positive diagonal factors is provided. Its index-lower-bound companion has the same unmet premises. D5.S3.Weil.ZetaLinear.ExactStickyReduction.exact_sticky_reduction transfers nonnegativity and negative inertia across an abstract Schur complement under nonnegativity, symmetry and inverse hypotheses; it provides neither a negative value for this C nor any source-specific block identification. D5.S3.Quantum.Algebra.WeylDisplacement.displacement_mul/displacement_sq and D5.S3.Quantum.Algebra.WeylPhaseArithmetic.windowRoot_pow_mod/windowRoot_pow_val_add are cyclic operator and phase arithmetic, without the source phase-point kernel, psi, T or a sign certificate. These are reusable preliminaries, not carriers of any complete load-bearing clause of this atom. Mathlib's LDL.lower_conj_diag is especially unsuitable as a positivity witness: its parameter hS : S.PosDef already assumes the property sought for S=-M_s. Matrix.posDef_diagonal_iff, Matrix.IsUnit.posDef_star_right_conjugate_iff and Matrix.PosDef.dotProduct_mulVec_pos can consume an explicit certificate but do not supply its entries, invertibility, 128 strict pivot inequalities or Wigner-coordinate binding. Real.log_lt_log requires both a positive smaller argument and an already established strict L comparison; it does not produce either for this state. The finite-filter and norm identities do not provide source stationarity or matrix negativity. External near hits were a Wigner semicircle-law poster (random-matrix spectral limits, not discrete Wigner quasiprobabilities), a generalized quantum Stein lemma formalization (asymptotic hypothesis testing, not the concrete local coefficient), and the three extracted quantum-library pages. inQWIRE/LeanQuantum describes qubit gates, Pauli algebra and stabilizer codes, and advertises Lean v4.26.0-rc2; guest2180/lean4-quantum describes matrix/circuit, no-cloning and uncertainty foundations and advertises Lean v4.16.0; Anderssorby/Quantum.lean describes a quantum-computing simulation project. None of those inspected pages presents the five-dimensional constrained-direction theorem or its concrete LDL data. The PhysLean search returned project ideas and unrelated generated build documentation, not a matching theorem. These are page-level findings, not a claim that every file of those repositories was searched. [3. Missing prerequisite] The required new fact is a concrete ququint Wigner-coordinate and LDL certificate: for the fixed A and psi, prove Hermiticity, sum(A)=5I, norm(psi)=1, the stated five-element Z0 and S*psi=5*L(psi)*psi; construct a real linear equivalence from Real^4 onto the actual constrained space T and source-derived matrices M_s for all 32 signs; prove every independently constructed -M_s equals U_s*diagonal(d_s)*transpose(U_s), with U_s invertible lower triangular and every one of the 128 embedded quartic-field pivots strictly positive. The Lean-like signature and exact branch identity are spelled out in missing_statement. This certificate, not an abstract PosDef hypothesis, is what the existing library can consume. [4. Why direct synthesis would be empty] Introducing a structure whose fields are C(phi)<0, (-M_s).PosDef, the desired perturbation equality or the positive pivots, and projecting those fields, would assume the requested result or its entire numerical burden. Defining M_s from arbitrary LDL factors, or redefining W/L to satisfy the fraction, would lose the source's fixed objects. Calling LDL.lower_conj_diag with hS=(-M_s).PosDef is circular for this purpose. A real construction and proof may be possible, but no such construction was verified in the searched frozen repository; this is not a mathematical impossibility claim. [5. Honest limits] This is a read-only declaration and source audit. No Lean elaboration, kernel run, make preflight/gate/lean/lean-report, or lake command was performed. The proposed certificate, its matrices and rational interval proofs, the composition into the complete atom, third-party code-level completeness, and pin compatibility remain assumed_unverified as itemized below. The external paper search did retrieve the conventional definition mana=log(sum(abs(W))) in arXiv:2512.19657v1 equations (2.48)/(2.51); a typed binding to this repository's future pure-state W API still has to be supplied. On the inspected frozen declarations, no complete source-specific clause is carried, so missing-prerequisite is the proposed classification."
    reentry_condition: "Provide a frozen D5 theorem, or a theorem in the pinned library, with the concrete ququint_wigner_LDL_certificate statement specified in missing_statement: it must construct the real coordinate equivalence for the actual T, identify each of the 32 branch matrices with the actual Wigner quadratic form, prove the actual state's normalization and stationarity, and certify all 32 invertible lower-triangular factorizations with all 128 positive quartic-field pivots as conclusions. The phase-point operators, W, L, psi and M_s must be defined independently of those positivity conclusions. Then apply Matrix.posDef_diagonal_iff and Matrix.IsUnit.posDef_star_right_conjugate_iff to obtain (-M_s).PosDef. For each nonzero phi in T, write phi=e(a), use injectivity to get a != 0, and choose each sign from the sign of W_phi at the corresponding zero point (either sign at zero). The certificate's branch equality makes C(phi) exactly a^T*M_s*a; Matrix.PosDef.dotProduct_mulVec_pos therefore gives C(phi)<0. Expand the fixed Hermitian quadratic W at psi+epsilon*phi. Its signed linear term vanishes by S*psi=5*L(psi)*psi and psi^H*phi=0, and its zero-point linear terms vanish by membership in T. Apply ContinuousAt.eventually_lt to the finitely many nonzero W_psi values and Filter.eventually_all to obtain one delta>0 preserving their signs on abs(epsilon)<delta. Use norm_add_sq and orthogonality to obtain norm(psi+epsilon*phi)^2=1+epsilon^2*norm(phi)^2, and W's quadratic homogeneity to derive, for real epsilon with 0<abs(epsilon)<delta, L(pert(phi,epsilon))-L(psi)=epsilon^2*C(phi)/(1+epsilon^2*norm(phi)^2). The denominator is positive and epsilon^2>0, so div_neg_of_neg_of_pos gives strict descent. The certified sum(A)=5I implies sum(W_v)=norm(v)^2, hence L(v)>=1 on normalized states by Finset.abs_sum_le_sum_abs; apply Real.log_lt_log using the explicit mana(v)=Real.log(L(v)) binding (or a proved strictly increasing change of logarithm base). Mere non-strict monotonicity is not enough. Finally use the coordinate equivalence's nonzero basis direction, continuity of pert at zero and the strict comparisons for arbitrarily small nonzero epsilon to obtain the stated nonminimum and nonflat conclusions along T. Reentry requires these concrete certificate and binding obligations to be discharged and the resulting composite declaration checked before a coverage claim."
