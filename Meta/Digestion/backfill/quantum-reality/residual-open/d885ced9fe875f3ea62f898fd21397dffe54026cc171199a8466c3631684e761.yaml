  quarantine:
    justification: "Read-only review at HEAD=origin/dev aca3daaadae4263a3523256fbd52d15957542e1b confirms zero carried complete load-bearing clauses for this atom in the audited D5 checkout. Its YAML was read and parsed with Ruby YAML.safe_load: receipts has only scribe, unresolved_subitems and chain_atoms; cover_disposition is absent and coverage_gids is empty. (1) Executed retrieval, in order: D5 searches included `confluent_negative_jet_block|wigner|\\bmana\\b|LDL|sqrt.?\\(?10|141[._]4`, then the tighter `wigner|\\bmana\\b|\\bLDL\\b|\\bLDLT\\b|sqrt\\s*\\(?10|20\\s*\\*\\s*.*\\^\\s*2\\s*\\+\\s*80`, `ququint|W_psi|W_φ|W_ψ|wigner|\\bmana\\b|critical.*pure.*state|magic.*state`, and generic negative-definiteness/inertia patterns. The broad case-insensitive LDL substring also matched unrelated foldl/oldLedger names; that was corrected to word boundaries before assessing candidates. Relevant declarations read were D5.S3.Analytic.ReflectedSpectrum.ConfluentNegativeJetBlock.confluent_negative_jet_block, its index_lower_bound companion, Constants.WignerYanaseSpectrum.wy_contraction_spectrum_strict_order, Constants.Cyclotomy.RealSubfield.real_cyclotomic_generator_adjoin_eq_sqrt_five, SpectralTopology.FiniteSpectralLocalizer.posIndex_neg_eq_negIndex, Weil.ZetaLinear.ExactStickyReduction.exact_sticky_reduction and Weil.ZetaLinear.PoleCapacityRankOne.pole_capacity_rank_one. Frozen state shards for all five corresponding module families plus the owner were read; the owner's stored statement_id is sha256:3dc65c69f312f74b735fb82f0ba74dfc93aa058d906a6bfe27d24c0daafb9796. The source atom and QUANTUM-REALITY.md lines 19775-19965 were read, including the independent A, psi, W, ell, Z0, T and M_s definitions. Pinned mathlib was searched in .lake/packages/mathlib/Mathlib; lake-manifest.json and the package HEAD both give db584cd6d46c92f209a44c0f1c829460d327499d (v4.33.0). `wigner|\\bmana\\b|magic.state|clifford.stabilizer|sqrt\\s*\\(10\\s*\\+\\s*2` returned no matches. The LDL/Cholesky/PosDef query found LDL.lower_conj_diag, Matrix.posDef_diagonal_iff and Matrix.IsUnit.posDef_star_left_conjugate_iff; their source statements and inherited parameters were read, together with Matrix.IsUnit.posDef_star_right_conjugate_iff, Matrix.PosDef.dotProduct_mulVec_pos and Real.log_lt_log. A further radical/quartic-polynomial pattern over both D5 and mathlib returned no matches. Network access was available through NyxID. A Tavily search for `Lean theorem Wigner mana LDL quantum magic formalization` returned five web results, including the Stanford SURIM poster Formalizing Wigner's Semicircle Law in Lean, the Generalized Quantum Stein's Lemma formalization paper, and duckki/quantum-computing-lean. The submitted query `site:github.com Lean \"Wigner\" \"mana\"` returned a normalized query `Lean Wigner mana` and five results, including unitaryfoundation/stabrank plus unrelated text lists. `site:github.com \"lean\" \"LDL\" \"ququint\"` returned normalized `lean LDL ququint`, five results including QuantConnect/lean-cli, fpvandoorn/lean-links and leodemoura/lean; no displayed result supplied this certificate. `site:github.com/leanprover-community/physlib Wigner mana stabilizer` returned normalized `Wigner mana stabilizer` with an empty results array. These are web-index results, not an exhaustive source audit. Direct GitHub Lean-code search `Wigner language:Lean` through api-github and api-github-2 returned HTTP 400, error_code 1000, despite CLI exit 0, so neither is a zero-hit code search. The first Tavily request returned HTTP 422; the subsequent request with explicit application/json returned actual results. (2) Near misses and precise shortfalls: the frozen congruence owner assumes hH : H.PosDef, hL : IsUnit L, hG : G.IsHermitian and hFactor : G = -(L.conjTranspose * H * L), then concludes (-G).PosDef and an exact negative index. It is a reusable prerequisite for a future proof, expressly not a carried clause: it proves none of the 32 source factorizations or 128 positive pivots and binds no A, psi, Z0, T or Wigner functional. Its lower-bound companion has the same assumptions; its one-dimensional example uses H=L=1 and G=-1, not any of the specified four-dimensional M_s. posIndex_neg_eq_negIndex exchanges inertia counts of an already Hermitian matrix; exact_sticky_reduction assumes a nonnegative symmetric complementary block and its right inverse; pole_capacity_rank_one bounds the change under a positive rank-one update. None supplies the concrete matrices or their strict negativity. wy_contraction_spectrum_strict_order orders five scalar expressions in log(2), so its Wigner name does not concern the discrete Wigner transform. real_cyclotomic_generator_adjoin_eq_sqrt_five identifies the fifth-cyclotomic real generator with Q(sqrt(5)); it neither identifies the required quartic field Q(R) nor certifies any matrix coefficients or pivots. Mathlib LDL.lower_conj_diag inherits hS : S.PosDef and builds noncomputable Gram-Schmidt factors; applying it to -M_s first needs exactly the missing positivity, and it provides no explicit K coefficient tables or rational pivot intervals. The two PosDef conjugation iff lemmas require invertibility and a positive diagonal input, while posDef_diagonal_iff only converts supplied pivot inequalities. dotProduct_mulVec_pos requires established PosDef. Real.log_lt_log requires both a positive lower argument and an already strict inequality of arguments; these source-specific Wigner facts are still absent. Online results concern semicircle spectral measures, a different quantum asymptotic theorem, basic gates/states, or numerical stabilizer-rank routines as described in snippets; none displayed a Lean declaration for this fixed ququint family. Full third-party sources and their pins were not inspected. (3) Missing prerequisite shape: fix the source's psi=(1,1,zeta^3,1,zeta^2)/sqrt(5), W(v,z)=Re(v^*A(z)v)/5 and ell=sum abs W independently. Supply explicit B0 and tables lower,pivot over K=Q(sqrt(10+2*sqrt(5))), certified at the isolated quartic root. The finite theorem must state `forall s : Fin 5 -> Bool, UnitLowerTriangular(lower s) /\\ (-M s = lowerR s * Matrix.diagonal (pivotR s) * (lowerR s).transpose) /\\ (forall i : Fin 4, 0 < pivotR s i)`, with M_s computed from the source Q_z and G, not defined by the product. Companion frozen bridges must certify the five zero points, norm(psi)=1, S*psi=5*ell(psi)*psi, a bijective Real^4 coordinate map onto T, C(coord a)=max_s(a^T*M_s*a), and for every phi in T a delta>0 giving the exact normalized-change identity for 0<abs(eps)<delta. The the REQUIRED STATEMENT section below field specifies these objects, quantifiers and the field/interval obligations in detail. (4) A new wrapper is insufficient: packaging PosDef, the factorization, pivot positivity, or the desired local identity as assumptions would assume the missing content; redefining either M_s or ell to make the equations hold would change the subject. New independently checked finite certificates and algebraic Wigner bridges are required, not a restatement of the congruence contract. (5) Honesty boundary: no Lean/LSP/kernel checks, compilation, gate, numerical recomputation of the 128 pivots, or independent verification of the paper was performed. The proposed Lean-shaped interfaces and composition are unelaborated specifications; third-party source completeness, pin compatibility and formal certification are unverified and enumerated in assumed_unverified. This record certifies the audited absence of a frozen source-specific carrier, not truth or falsity of the unproved source claim. SEARCH TRAIL (inlined; no external field is referenced): [D5] query=rg -n -i 'confluent_negative_jet_block|wigner|\\bmana\\b|LDL|sqrt.?\\(?10|141[._]4' D5 --glob '*.lean'; followed by word-boundary LDL/LDLT and ququint/Wi ; hits=3 ; insufficient: The owner's complete signature assumes all certificate premises; its companion does likewise, and the 1x1 example is unrelated. The Wigner-Yanase theorem is a scalar log(2) ordering. Broad case-insens | [D5] query=rg -n -i 'wigner|\\bmana\\b|\\bldl\\b|ldlt|quartic|cyclotomic|negative.?definite' D5 --glob '*.lean'; exact radical/quartic follow-up ; hits=1 ; insufficient: This theorem concerns Q(sqrt(5)) and the fifth-cyclotomic real generator. Other quartic/cyclotomic name matches concern unrelated polynomials or characters. It supplies no Q(R) identification, matrix | [D5] query=rg -l -i 'confluent_negative_jet_block|negative.?definite|NegDef|\\(-.*\\)\\.PosDef' D5 --glob '*.lean'; read relevant resulting declarations ; hits=3 ; insufficient: Respectively exchanges inertia of a Hermitian matrix, reduces a quadratic form assuming a nonnegative symmetric invertible complementary block, and bounds a rank-one update. These are generic linear a | [mathlib] query=rg -n -i 'wigner|\\bmana\\b|magic.state|clifford.stabilizer|sqrt\\s*\\(10\\s*\\+\\s*2' .lake/packages/mathlib/Mathlib --glob '*.lean' ; hits=0 ; insufficient: No matches (rg exit 1). Searched the installed package whose HEAD equals manifest pin db584cd6d46c92f209a44c0f1c829460d327499d; no compilation was performed. | [mathlib] query=rg -n -i 'wigner|\\bmana\\b|\\bLDL\\b|\\bLDLT\\b|cholesky|posDef_diagonal|posDef_star_left_conjugate_iff' .lake/packages/mathlib/Mathlib --glob '*.lean'; re ; hits=6 ; insufficient: LDL results inherit hS : S.PosDef and construct noncomputable factors after positivity. The remaining APIs consume positive pivot/invertibility or PosDef facts, none of which is proved for the specifi | [mathlib] query=rg -n 'log_lt_log|strictMonoOn_log|log_pos' .lake/packages/mathlib/Mathlib/Analysis/SpecialFunctions/Log/Basic.lean; read lines 140-161 ; hits=3 ; insufficient: Scalar logarithm monotonicity requires positivity and a strict inequality of arguments. It does not establish the exact Wigner perturbation formula or ell descent for this state. | [third-party] query=NyxID GitHub /search/code?q=Wigner+language%3ALean&per_page=100 via api-github and api-github-2 ; hits=0 ; insufficient: Both returned HTTP 400/error_code 1000, with the CLI reporting exit 0. No code-search response was obtained; hits=[] means no retrievable result, not a successful empty search. | [third-party] query=Tavily: Lean theorem Wigner mana LDL quantum magic formalization ; hits=3 ; insufficient: Five web results; these three relevant snippets concern semicircle measures, Generalized Quantum Stein's Lemma and basic quantum gates/states. No displayed result states the required matrix certificat | [third-party] query=Tavily submitted: site:github.com Lean \"Wigner\" \"mana\"; response query: Lean Wigner mana ; hits=1 ; insufficient: Five results, four unrelated text collections and one snippet advertising discrete-Wigner/mana routines and stabilizer-rank bounds. The snippet supplies no Lean proof of the specified ququint certific | [third-party] query=Tavily submitted: site:github.com \"lean\" \"LDL\" \"ququint\"; response query: lean LDL ququint ; hits=5 ; insufficient: Five web results: trading-engine tooling, Lean resource links, an old prover repository, metaprogramming text and Vue resources. None displayed a theorem about this certificate. request_id b4fdaeaa-70 | [third-party] query=Tavily submitted: site:github.com/leanprover-community/physlib Wigner mana stabilizer; response query: Wigner mana stabilizer ; hits=0 ; insufficient: Successful JSON response had results=[] (request_id 9d16332c-6169-41dd-a2c1-75b579e8ee90). This is bounded web-index retrieval, not a source-level or exhaustive Physlib/Lean ecosystem audit. REQUIRED STATEMENT (inlined): Specification only: all identifiers introduced below are proposed interfaces, not existing or elaborated Lean declarations. Fix the source objects independently of any certificate: indices q,p,x,y in ZMod 5; zeta = exp(2*pi*I/5); A(q,p)[x,y] = if x+y=2*q then zeta^(p*(x-y)) else 0 (with the cyclic exponent convention); psi = (1,1,zeta^3,1,zeta^2)/sqrt(5); W(v,q,p) = Re(v^* A(q,p) v)/5; ell(v) = sum(q,p) abs(W(v,q,p)); Z0 = {z | W(psi,z)=0}; T = {phi | psi^*phi=0 and forall z in Z0, Re(psi^* A(z) phi)=0}. The state norm is the Euclidean norm on Complex^5. Set C(phi) = sum(z not in Z0) sign(W(psi,z))*W(phi,z) + sum(z in Z0) abs(W(phi,z)) - ell(psi)*norm(phi)^2. Fix R = Real.sqrt (10 + 2 * Real.sqrt 5) and K = IntermediateField.adjoin Rat {R} inside Real. Supply concrete coefficient tables B0 : Matrix (Fin 10) (Fin 4) K, lower : (Fin 5 -> Bool) -> Matrix (Fin 4) (Fin 4) K, and pivot : (Fin 5 -> Bool) -> Fin 4 -> K, with entries explicitly given by rational expressions in R. Certify all denominators, p(R)=0 for p(X)=X^4-20*X^2+80, and that R is the unique root in the rational interval (3,4). For the field-identification portion also prove Module.finrank Rat K = 4 and K = Rat(2*cos(2*pi/20)), interpreted inside Real as the maximal real twentieth-cyclotomic field. None of these assertions is to be a structure field assumed by the final result. Let b be B0 mapped into Real, Dphase = diag(1,1,zeta^3,1,zeta^2), coord(a) = Dphase*(r+I*t) where (r,t)=b*a. Prove coord maps Real^4 linearly and bijectively onto the independently defined T. Let H(z) be the standard realification of Dphase^* A(z) Dphase, G=b^T*b, Q(z)=b^T*H(z)*b/5, and M(s)=sum(z not in Z0) sign(W(psi,z))*Q(z) + sum(j : Fin 5) sigma(s j)*Q(zeroPoint j) - ell(psi)*G, where sigma(false)=-1, sigma(true)=1 and zeroPoint lists (0,3),(1,3),(2,4),(3,1),(4,4). M is defined by these Wigner data, never by the LDL product. The essential finite theorem has the near-Lean shape: theorem critical_ququint_ldl_certificate : forall s : Fin 5 -> Bool, (forall i j : Fin 4, i < j -> lower s i j = 0) /\\ (forall i : Fin 4, lower s i i = 1) /\\ (-M s = lowerR s * Matrix.diagonal (pivotR s) * (lowerR s).transpose) /\\ (forall i : Fin 4, 0 < pivotR s i). Here lowerR and pivotR are the canonical maps of the fixed K tables into Real. It must exhibit 32 factorizations and 128 pivot inequalities, with explicit rational interval certificates at the isolated root, and derive IsUnit (lowerR s) and (M s).IsHermitian from these concrete data. Companion source bridges must also be frozen, since no current declaration supplies them: theorem critical_ququint_wigner_data : norm(psi)=1 /\\ Z0={the five listed points} /\\ ell(psi)=1+2*sqrt(5)/5 /\\ (forall v, sum z, W(v,z)=norm(v)^2) /\\ S*psi=(5*ell(psi))*psi, where S=sum(z not in Z0) sign(W(psi,z))*A(z). theorem critical_ququint_reduction : forall a : Fin 4 -> Real, C(coord a)=max(s : Fin 5 -> Bool) dotProduct a (M s *v a). The maximum is over the nonempty finite set of all 32 assignments. Finally theorem critical_ququint_local_change : forall phi, phi in T -> exists delta : Real, 0 < delta /\\ forall eps : Real, 0 < abs eps -> abs eps < delta -> ell(normalized(psi+eps*phi))-ell(psi)=eps^2*C(phi)/(1+eps^2*norm(phi)^2). The radius may depend on phi. Prove this last equality from the fixed-state stationarity equation, vanishing cross terms on Z0, preservation of the nonzero Wigner signs for small eps, and norm(psi+eps*phi)^2=1+eps^2*norm(phi)^2. Negative definiteness, C(phi)<0, the local equality, and the requested descent are not permitted as input assumptions. WHY A LOCAL CONSTRUCTION WOULD BE HOLLOW (inlined): This is a missing proof obligation, not a claim of mathematical impossibility. Applying the existing congruence theorem with H = diagonal(pivot s), L = transpose(lower s), and G = M s still requires the very positive pivots, invertibility, Hermitian property and factorization that the source asks to certify for its fixed matrices. A structure whose fields assert these facts, C(phi)<0, or the perturbation identity would merely assume the content. Defining M s to be minus an LDL product would replace the matrices independently obtained from A, psi and B; defining ell(normalized(...)) to be the displayed rational expression would replace the sum of absolute Wigner values. Generic LDL existence starts from PosDef and is circular for establishing this positivity. Honest progress requires new explicit algebraic tables with proved identities and inequalities plus the fixed-state Wigner bridges. This seat is expressly read-only and has neither constructed nor checked those witnesses."
    reentry_condition: "Provide frozen D5 declarations or exact-pin library theorems with the concrete statements specified in missing_statement: first the fixed-state Wigner data and coordinate bridge, and the explicit K-valued lower/pivot tables proving all 32 independently defined identities `-M s = lowerR s * diagonal(pivotR s) * transpose(lowerR s)` and all 128 strict pivot inequalities, with triangular/unit-diagonal and field/interval certificates as conclusions. Also provide the source-specific maximum identity and the quantified local-change equality; a conditional contract that leaves any of these facts assumed does not meet reentry. With those proofs, apply Matrix.posDef_diagonal_iff to the proved pivots, derive IsUnit(lowerR s) from the unit triangular certificate, and apply Matrix.IsUnit.posDef_star_right_conjugate_iff plus the factorization to obtain (-M s).PosDef over Real. The audited D5 congruence owner is reusable after the real-to-Complex entrywise bridge: instantiate m=4, H=diagonal(pivotC s), L=(lowerC s).conjTranspose, G=MC s, using Hermitian symmetry, invertibility and the negative factorization derived from the new certificates. This is the point where its premises become discharged; it is not currently a carried clause. For phi in T with phi != 0, the bijective coordinate map yields a != 0. Matrix.PosDef.dotProduct_mulVec_pos gives a^T*M_s*a<0 for every s. The maximum over the finite nonempty set of 32 assignments is therefore strictly negative; substitute the new maximum bridge to obtain the atom's first boxed inequality C(phi)<0. For each such phi, the new local-change theorem supplies delta>0. Whenever 0<abs(eps)<delta, eps^2>0 and 1+eps^2*norm(phi)^2>0, so its exact quotient is strictly negative, yielding the second box. Use the proved sum_z W(v,z)=norm(v)^2 on normalized states to obtain ell(normalized(...))>=1, then Real.log_lt_log converts the strict ell inequality to strict log-mana descent. Quantification remains only over this T and sufficiently small nonzero real eps, with delta allowed to depend on phi. On reentry, parse the current atom receipts again: any newly present cover_disposition routes this atom to withheld; discovery of an already frozen complete source-specific subclause routes it back to multi-clause-guard. Neither event authorizes deleting a receipt."
