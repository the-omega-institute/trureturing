ion by exp(-I*3*x), followed by Complex.ofReal_cos, gives exactly exp(-I*(3/2)*omega*n0(v)*t)*Real.cos(omega*n0(v)*t/2). The checked Complex.norm_exp_ofReal_mul_I then also supplies the ideal factor's unit modulus and the displayed absolute-cosine norm consequence. These are explicit specialization and scalar normalization steps, not a claim that a clock-specific theorem was compiled in this seat. uncarried: the selected frozen statement does not provide the initial-phase derivative as a calibrated clock rate, its identification nbar=(3/2)*n0, or the squared clock law (99.2). The missing objects are a real-time clock process, a local phase or initial-frequency readout, and its link to n0=sqrt(r0). Formula (99.3) further needs a typed Lorentz bilinear form g0 with the source's response identity -g0((1,v),(1,v))=r0(v), the positive rescaling operation, and the signature-preservation and calibrated-response link for (9/4)*g0. Section 92 explicitly supplies paper assumptions r0>0, vanishing third derivatives and negative-definite Hessian; these are not obtained from matrix positivity. The final dynamical clause needs an actual normalized superposition, a time where the reduced density is mixed, and the proof that no deterministic Hamiltonian unitary sends that pure input to this mixed output. The marginal identity alone does not state those facts. In addition, the displayed energy-gap assumption does not explicitly exclude omega=0: at omega*n0(v)=0 the computed factor is identically 1, so the mixed-output witness requires a nondegenerate clock gap. Whether that restriction is an intended standing convention remains ASSUMED-UNVERIFIED. scope gap: the owner quantifies finite coordinate matrices and arbitrary complex record data at a fixed evaluation; the source additionally quantifies real time and velocity, fixes a physical clock calibration, invokes a Lorentz response geometry, and compares entire reduced dynamics with deterministic unitary evolution. Arbitrary complex 