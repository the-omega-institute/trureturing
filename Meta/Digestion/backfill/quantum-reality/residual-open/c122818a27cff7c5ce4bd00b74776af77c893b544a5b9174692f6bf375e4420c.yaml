    justification: "复核基线为 HEAD=origin/dev=137902d871de503a1f70b1dddb744560bdf8202b。本 atom 的 YAML 与 CAS 全文已读，coverage_gids 为空，receipts 无 cover_disposition，且无 chain_atoms。已读 docs/develop/theory/QUANTUM-REALITY.md 的 17000-17380 行：123.1 给初始乘积态、局域演化后的 σ_m、各节点 Hermitian 读数及共同谱区间；123.1/123.2 给实际过去域与重叠计数；124.1 给平均算子和量子方差界。这些源前提不能被遗漏，但其正文证明也不等于已有冻结 Lean 载体。以实际节点族的联合经典测量律、无偏性、样本方差等于量子方差、具体常数尾界为完整承重内容，本次未确认任何一项已经被冻结 D5 声明完整接通。分层检索及近似命中如下。① 实跑 rg -n -i 'snapshot|chebyshev|r_sample|sample.*variance|quantum.*variance|joint.*distribution|born|recordWeight_sum' D5/S3/Quantum D5/S3/Observer D5/S0 -g '*.lean'，又以 '\\bvariance\\b|covariance.*sum|sum.*covariance|joint.*distribution|r_sample|joint.*pvm' 搜 Quantum、Observer、QuantumStates、QuantumChannels，并在全 D5 扩查 snapshot、chebyshev、协方差求和和联合 PVM/分布。完整读取 D5.S3.Quantum.Measurement.SharpMeasurementCompatibility.sharp_measurement_compatibility，其冻结状态片已读：第一合取只为两个已经给定的有限 PVM，在 IsRecordMeasurement P/Q 下证明联合 PVM 存在与交叉投影可交换等价；它没有从原文 R_x 构造整个节点族的谱 PVM，也没有 Born 概率空间或矩恒等式。私有 finite_sharp_joint_iff_commute 不能另计公开载体。D5.S3.Observer.Conditioning.recordWeight_sum 给已给 PVM 的复数 trace 权重之和；D5.S3.Quantum.FiniteDimensional.born_probability_skeleton 给已给正 trace-one 状态的投影权重归一化、可加和非负性。这两模块的冻结状态文件存在，但它们没有把本 atom 的各 R_x、σ_m、样本值和概率律组织为一个定理。D5.S3.Observer.Conditioning.TargetVisibilityMinimumVariance.target_visibility_minimum_variance 假定各向同性协方差并优化可见性估计器，模型及前提都不是过去域重叠模型。D5.S0.Diagonal.TypicalDensity.binomial_upper_tail_kl 需要 0<p<q<1 的二项分布，不能给可能相关的节点偷添独立二项抽样。扩大 'product.*state|state.*product|tensor.*trace|trace.*tensor|cov.*zero|expectation.*factor|snapshot|local.*commut' 检索后，已读 D5.S3.Quantum.Dynamics.ProductDynamicsLocalSupport.product_pullback_local_support：它研究分量线性映射的张量积对支撑扇区的保持，没有实际多节点局部门电路、Born 律或量子协方差常数界；MultifactorCorrelationSectorDecomposition 的已读部分是 Hermitian 张量扇区分解及维数，不是统计矩。还读实了冻结 D5.S3.Quantum.Measurement.StaticEffectSequentialSeparation.same_effects_different_two_step_joint_law：它构造相同 effects 的投影/翻转 qubit Kraus 仪器，并给两步权重 0 与 1。它能支持一般的后续测量谨慎性，但没有将该 qubit 实验识别为本 atom 的 R_x、σ_m 和允许的节点测量操作，亦无这里的无偏性、方差和尾界；不能据此宣称本模型的一次统计证书或其完整通信/持续读取限定已经被承载。② 钉版 mathlib 的 manifest 与实际 HEAD 均为 db584cd6d46c92f209a44c0f1c829460d327499d。实跑包含 'measure.*dev.*mean|meas.*chebyshev|joint.*spectral|simultaneous.*diagonal' 的全库检索，并定点列出 Variance.lean 与 JointEigenspace.lean 的声明。已读 ProbabilityTheory.meas_ge_le_variance_div_sq：在有限测度、MemLp X 2 μ、0<c 下给 μ{ω|c≤|Xω-μ[X]|}≤ENNReal.ofReal(variance X μ/c²)；这是可用的通用 Chebyshev，但没有证明此处 μ[X]=r_Q(m) 或 variance≤Δ_R²*b_Q/N_Q。ProbabilityTheory.variance_sum / variance_sum' 把有限和的方差展开为协方差双和，不要求独立性，但要先有该经典概率空间及 MemLp，且不产生量子矩身份或过去域重叠计数界。LinearMap.IsSymmetric.iSup_iInf_eq_top_of_commute 与 directSum_isInternal_of_pairwise_commute 给可交换对称线性映射的联合本征空间分解，未连接有限矩阵节点嵌入、全族 PVM、正 trace-one 状态的 Born 测度以及样本矩。③ 网络可用；经 NyxID/Tavily 实搜 'Lean quantum commuting observables joint measurement Born probability variance Chebyshev site:github.com'，命中 https://github.com/inQWIRE/LeanQuantum，已提取主页，其现有内容列门和 Pauli/stabilizer 代数，而 Measurement and observables、Density matrices and mixed states 被列作计划项；因此主页没有供给所需快照定理。另搜 'site:github.com/leanprover-community/physlib commuting measurement variance expectation' 返回空 results。'Lean4 \"relative entropy\" github' 命中的 https://github.com/Timeroot/Lean-QuantumInfo 主页声明并入 Physlib，介绍有限维量子信息及 Stein 型极限定理，不能据此认作本局域网络快照/因果重叠界的实现。这里核验的是搜索响应和主页，未把索引空结果当作 Physlib 无此数学内容的证明。具体缺失前置为：拟新增并冻结 local_snapshot_born_moments（以下是陈述模式，尚未经过 Lean elaboration）：在原文的有限节点张量积模型中，Λ 有限，各局部 Hilbert 空间有限维且非零，Q : Finset Λ 非空；σ_0=⊗x σ_x，各 σ_x 正且 trace=1，U_m 是给定局部门序列的幺正乘积，σ_m=U_m σ_0 U_m†。R_x 必须是节点 Hermitian 算子的规范张量嵌入，并满足 r_- I≤R_x≤r_+ I，0<r_-<r_+；P_m(x) 由 {x} 沿该门序列逆向递归，将与当前支持相交的门支持并入，不能作为预设协方差界的别名。置 N=(Q.card:ℝ)、Δ=(r_+-r_-)/2、b=max_{x∈Q} #{y∈Q | P_m(x)∩P_m(y)≠∅}、Rbar=N⁻¹ • ∑x∈Q R_x、r=(Matrix.trace (σ_m*Rbar)).re。结论构造有限测量结果类型 Ω、全节点族的联合谱 PVM J : Ω → Matrix H H ℂ、实本征值 v_x : Ω → ℝ，证明 IsRecordMeasurement J 且 ∀x∈Q, R_x=∑ω (v_x ω:ℂ) • J ω；由它定义而非假设 μ=∑ω ENNReal.ofReal((Matrix.trace(σ_m*J ω)).re) • Measure.dirac ω 和 Y ω=N⁻¹*∑x∈Q v_x ω，并证明 IsProbabilityMeasure μ ∧ MemLp Y 2 μ ∧ (∫ω, Y ω ∂μ)=r ∧ ProbabilityTheory.variance Y μ=(Matrix.trace(σ_m*(Rbar-(r:ℂ)•1)^2)).re ∧ ProbabilityTheory.variance Y μ≤Δ^2*(b:ℝ)/N。最后一项须从乘积初态、逆向门支持及谱界推导：不相交 P_m 的量子协方差为零，全部协方差绝对值和≤N*b*Δ^2；不能把这些矩等式、零协方差或总和界当作输入合同。不能就地用空壳造出载体的理由为：通用 Chebyshev 在已有概率空间、均值与方差时能直接使用，但本 atom 的随机变量必须是实际节点 R_x 的本征值测量平均。把一个任意经典随机变量命名为该平均，或让结构体带有 mean_eq_r、variance_eq_quantum、variance_bound 字段，只是假设待证身份与数值界；把 b 定义为足以使不等式成立的数也替换了原文过去域重叠计数。新定理若仅接受这些等式与界为假设，再调用 Chebyshev，就是用户排除的合同推论。需要先证明联合谱/Born 分布及局域动力学矩桥，不能用命名或重定义代替；本只读席不新增也不冻结 Lean 声明。诚实边界：未运行 Lean、LSP、编译、Lake 或任何仓库门，未作全库声明级语义穷尽；未实现源文有限张量模型、局部门支持递归与既有 D5 表示的类型对应，未核验拟议声明的语法、类型类和矩阵/线性映射转换；未审查外部项目完整源码、证明状态、许可和钉版兼容性。量子例子的测量后扰动及合法通信仍只作为原文适用范围限定保留，本席没有形式证明本模型的汇总协议或永久读取性质。零承载判定限定于已实际检索与读取的候选，未以普通定理可在前提齐备后应用冒充已完成具体实例。"
    reentry_condition: "提供并冻结一条 D5 或钉版库定理，其陈述为：在原文有限非空 Q、有限节点张量空间、乘积密度态 σ_0、具体局部门电路 U_m、规范嵌入的节点 Hermitian R_x 及共同谱界 0<r_-<r_+ 下，由逆向门支持递归构造 P_m(x)，令 N=|Q|、b=max_{x∈Q}#{y∈Q:P_m(x)∩P_m(y)≠∅}、Δ=(r_+-r_-)/2、Rbar=N⁻¹∑x∈Q R_x、r=Re trace(σ_m Rbar)，构造整个节点族的联合谱 PVM J 与实本征值 v_x，证明 R_x=∑ω v_x(ω)Jω；由真实 Born 权重定义 μ{ω}=ENNReal.ofReal(Re trace(σ_m Jω)) 与 Yω=N⁻¹∑x∈Q v_x(ω)，证明 IsProbabilityMeasure μ、MemLp Y 2 μ、∫Y dμ=r、variance Y μ=Re trace(σ_m(Rbar-rI)^2)≤Δ²*b/N。局部支持不交时协方差为零和协方差和界必须从乘积态、门支持与谱界导出，不能将目标矩等式及界列为假设。取得该桥后，把构造的 μ/Y 接回原文联合测量/平均，直接得到无偏式及量子方差身份；对任意 ε>0 应用 ProbabilityTheory.meas_ge_le_variance_div_sq，重写 μ[Y]=r，再用 ε²>0 下除法保序与 ENNReal.ofReal 的单调性，得到 μ{ω:ε≤|Yω-r|}≤ENNReal.ofReal(Δ²*b/(N*ε²))，即 (124.5)。证明应保持一次同刻测量的作用域；汇总仍服从原文合法通信约束，不能从概率定理推出无扰或永久读取。复入时核准源对象身份及该公开冻结声明的可调用性。"
