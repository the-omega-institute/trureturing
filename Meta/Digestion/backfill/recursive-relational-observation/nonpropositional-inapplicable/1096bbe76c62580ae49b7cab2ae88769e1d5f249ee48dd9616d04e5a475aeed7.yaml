    justification: 'Pinned upstream closure by Convex.sum_mem, Finset.sum_fiberwise, ConvexOn.map_sum_le, Finset.sum_nonneg, Finset.sum_eq_zero_iff_of_nonneg, StrictConvexOn.map_sum_eq_iff_of_pos, mul_eq_zero, Finset.sum_mul, mul_left_cancel₀, funext, Finset.sum_add_distrib, Finset.mul_sum. m_i in K: On F_i use w(j)=q_j/p_i, x(j)=u_j. Surjectivity and positive q imply p_i>0, all w(j)>0, sum w=1 and sum w*x=m_i. Thus every required hypothesis is supplied by 82.1; d_j>0 is never assumed. J_Phi equals the displayed sum of fiber gaps and is nonnegative: Partition sum_j q_j Phi(u_j) by r and cancel p_i. Jensen at K,F_i,w,x gives each bracket nonnegative; multiplication by p_i>0 and summation gives the total inequality. Strict zero gap iff fiberwise equality: Positive p_i reduces zero total to zero fiber gaps. Strict Jensen with strictly positive reference weights w(j)=q_j/p_i gives equality iff all u_j in F_i agree. Actual posterior weights are not used, including when a_i=0. Fiberwise equality iff u=Pi u iff d=Ed: A fiber constant h_i has weighted average h_i because sum w=1. Conversely Pi u=m composed with r is fiberwise constant. Since d_j=q_j*u_j and (Ed)_j=q_j*m_(r j), cancellation of q_j>0 gives the second equivalence. Affine invariance and no Phi(1)=0 requirement: For all real alpha,beta, sum_F_i w(j)*(alpha*u_j+beta)=alpha*m_i+beta. This cancels in every fiber gap; the scratch probe checks precisely this identity. Convexity alone does not force the zero locus; affine gaps vanish; common zero sets impose no common numeric scale or pointwise unequal values: Affine generators have zero fiber gaps. One two-point fiber with q=(1/2,1/2), d=(1,0) has u=(2,0), giving a non-recoverable zero gap for an affine generator. Strict zero sets were established above. Positive scaling of a strictly convex generator scales the gaps; affine shifts preserve all gap values. These explain all stated boundaries without a new mathematical declaration. No usable frozen project GID was found for this general statement in the searched D5 declarations; no new Lean declaration is introduced.'
