  nonpropositional:
    justification: 本 leaf 的全部数学子句由钉版 Mathlib db584cd6d46c92f209a44c0f1c829460d327499d 的既有声明实例化及规范化闭合，proof_shape=bind-only，admission_basis=none；解释性边界为非命题作用域说明。源谱分解由 Matrix.IsHermitian.spectral_theorem、Matrix.IsHermitian.eigenvectorBasis / Matrix.IsHermitian.mulVec_eigenvectorBasis 提供；E 与 1-E 的正性在归一特征向量上给 0≤λ≤1，Matrix.posSemidef_diagonal_iff、Real.mul_self_sqrt 与 CFC.sqrt_unique 将源谱根式与实际 CFC.sqrt(E-E²) 对齐。Commute.mul_nonneg、CFC.sqrt_nonneg / CFC.sqrt_mul_sqrt_self、Commute.cfcₙ_nnreal 给根的三个性质；Matrix.IsHermitian.fromBlocks、Matrix.fromBlocks_multiply / Matrix.fromBlocks_conjTranspose 及代数规范化给大空间投影。K=range R 的真实成员见证为 k=Rv 时 u+(1-E)v；LinearMap.restrict / LinearMap.coe_restrict_apply、LinearMap.IsSymmetric.restrict_invariant 与 Module.End.pow_restrict 给限制的自伴幂等性和首坐标压缩 E。LinearMap.IsSymmetric.adjoint_eq、LinearMap.range_self_comp_adjoint、LinearMap.ker_self_comp_adjoint、LinearMap.finrank_range_adjoint、LinearMap.finrank_range_le 处理秩、核与所有实际有限维竞争投影的下界；Matrix.rank_self_mul_conjTranspose / Matrix.rank_le_card_width 为同一矩阵读法。Real.sqrt_ne_zero 与 λ∈[0,1] 给源文非零特征值指标；CFC.sqrt_zero 处理零缺陷和零空间。有限事件部分保留完整假设：X 有限非空，μx>0，Σμx=1，q 满射，pb=ΣXb μx，P 为指定纤维平均，Q 为乘以 1_A。Finset.sum_pos、Finset.sum_nonneg 和 Finset.sum_le_sum_of_subset_of_nonneg 给 pb>0 与 0≤ab≤1。Matrix.posDef_diagonal_iff 及 Matrix.toNormedAddCommGroup / Matrix.toInnerProductSpace 提供 diag(μ) 的实际加权内积；也可按 Real.sq_sqrt / Real.sqrt_pos 用 √μ 坐标等距运输。Finset.sum_fiberwise、Finset.sum_eq_single_of_mem、Real.sq_sqrt 与 orthonormal_iff_ite 验证 e_b=1_Xb/√pb 正交归一；对每个纤维常值 u，逐点展开 u=Σb √pb·c_b(u)·e_b 给张成，再应用 OrthonormalBasis.mk。有限和同样给 P²=P、range P=U、P 自伴；指标逐点给 Q²=Q、Q 自伴。实际平均公式给 Pe_b=e_b 及 P(1_Ae_b)=ab e_b，故真实压缩 E 的对角元为 ab，缺陷为 ab(1-ab)。Matrix.rank_diagonal、Matrix.rank_eq_finrank_range_toLin、RCLike.ofReal_eq_zero 与 0≤ab≤1 给 rank D=card{b|0<ab<1}；Finset.sum_pos_iff_of_nonneg 和 Finset.sum_filter_add_sum_filter_not 将严格中间值对齐满支撑下纤维两侧均非空，计数不含 pb 权重。原 U⊥ 可较大、不得据一份效应重建 X/所有事件乘法/原实验、分别扩张不产生共同表示或联合律、以及不引入量子动力或取得信息成本，均仅界定本结论范围，不新增负向 Lean 定理。仓内未识别到覆盖本整项的冻结 GID；ObservationRankEquality 的已冻结 Gram 秩结论不能充当扩张和事件桥的整项 coverage。本结算不声称已运行组合的 Lean elaborate、kernel 或构建。
