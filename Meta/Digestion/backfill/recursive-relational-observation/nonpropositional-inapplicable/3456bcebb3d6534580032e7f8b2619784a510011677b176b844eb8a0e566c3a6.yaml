    justification: 'Under the inherited RRO70.1 hypotheses: an arbitrary probability space, finite ambient-measurable partitions and refinement modulo null sets, surviving cells of positive mass, and P0={X}. Use actual complex L2, q_i the actual MeasureTheory.indicatorConstLp indicator of C_i with value 1, H_L=span(range q), and Hobs=topologicalClosure(iSup H_L), equal to closure of the increasing union by Submodule.coe_iSup_of_directed. MeasureTheory.L2.inner_def and RCLike.inner_apply give the conjugate-first integral. MeasureTheory.L2.inner_indicatorConstLp_one_indicatorConstLp_one, orthonormal_iff_ite, nonzero-scaling span equality, Module.Basis.span and Module.Basis.toOrthonormalBasis retain the actual normalized indicators. OrthonormalBasis.orthogonalProjectionOnto_apply_eq_sum and MeasureTheory.L2.inner_indicatorConstLp_one give the displayed cell average. The exact cell-plus-ambient-null generators form a pi-system; cell/null/univ integrals, MeasureTheory.VectorMeasure.ext_of_generateFrom and MeasureTheory.ae_eq_condExp_of_forall_setIntegral_eq identify that average with complex conditional expectation (the definition MeasureTheory.condExp). MeasureTheory.MemLp.integrable, MeasureTheory.MemLp.condExpL2_ae_eq_condExp, MeasureTheory.indicatorConstLp_coeFn and MeasureTheory.Lp.ext identify the L2 maps. This complete mathematical realization uses upstream declarations only; no usable accepted project GID or combination owns these finite-cell and null-augmented CE assertions. Settlement follows CLAUDE 3.2. Carrier-search scope: D5 declarations for finite partitions/cell averages, conditional expectation, span/finrank and nested projections, including the finite-partition-cell-measure, orthogonal-complement-projection and innovation-energy alternatives; no usable frozen project GID or combination for this whole leaf was found in that scope.'
