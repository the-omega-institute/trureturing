    justification: "RRO proposition 140.7 under definition 140.0 has fixed R >= 1, k >= 2 and actual histories forbidding k consecutive ones. The actual window uses D5/S3/ObserverMemory/Trajectories/ZeroRunWordGeometry definitions Complete and transport and D5/S3/ObserverMemory/Trajectories/LongestZeroSelectorResponse.candidates; no frozen project theorem GID carries the whole initialization assertion. Pinned Mathlib db584cd6d46c92f209a44c0f1c829460d327499d supplies the finite-set, ordered-list, stream and first-match facts. Equation 140.17 and all following proof and boundary clauses are accounted for as follows. Starting with empty queue and ell = R, fold the exact 140.3 state-only update over the permitted actual R-window reads in oldest-to-newest order. List.foldl_hom, List.foldl_map, Stream'.append_take, Stream'.get_append_left, Stream'.get_append_right and Stream'.take_get identify every n-read window with R-n zeros followed by those n actual bits; at n = R the actual queue, ell and transport phases are obtained. The zero padding supplies no endpoint one. The queue update is the finite-set candidate filter and insertion identity, with List.Pairwise.eq_of_mem_iff recovering the chronological list and actual transport cardinal parity supplying phases. Neither full old history nor a retained bit window is an input to the persistent update. Precise j is separately the least actual zero offset: Nat.find_eq_iff and Nat.find_lt_iff give its first-zero specification and j < k. An explicitly permitted backward callback on Fin k is searched using List.find? on List.ofFn id; List.find?_ofFn_eq_some_of_injective proves the evaluator returns that actual first zero, and List.length_range proves the read addresses 0 through j have length j+1 <= k. This supplies an evaluated finite read/stop certificate rather than assuming the desired acquired-count equality. Nat.find_comp_succ gives the continuing j update, zero resetting to 0 and a legal one incrementing by 1. For R < k-1, the actual histories h_m(n) = decide(n < m) with m = R and m = k-1 have the same all-one R-window but different j and different next-one legality; R = 2 and k = 4 specializes to actual endings 011 and 0111. Actual read permission, truthful bit agreement and initial calibration remain acquisition prerequisites. The storage formula counts persistent fields only; it provides no peak workspace, time, arbitrary history access or concrete optimality conclusion."
