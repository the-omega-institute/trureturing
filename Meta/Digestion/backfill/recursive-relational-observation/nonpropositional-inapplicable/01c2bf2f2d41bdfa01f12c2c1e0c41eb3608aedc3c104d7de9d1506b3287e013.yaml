    justification: Upstream-only propositional settlement of all RRO119.2 statement clauses. Pinned Mathlib db584cd6d46c92f209a44c0f1c829460d327499d closes the clauses by direct applications and normalization; no suitable frozen project GID is available. For the actual K_delta,0 and its transpose with every real 0<delta<=1/2, finite matrix expansion establishes mass, pi and slow eigenmodes, the ring annihilator and the actual gd recurrence. Monotone.seq_le_seq on three-coordinate tuples gives positive r and nonnegative D; its scalar specialization gives D_(n+2)>=(1-sigma)*b^n>0. Equivalently, Module.End.aeval_apply_of_mem_apply_eq_smul on the actual transposed-kernel endomorphism cubed and Matrix.toLin'_pow yield the three-residue orbit formula. sub_dvd_pow_sub_pow and polynomial evaluation give H|p_L and the simultaneous p_L(1)=1, p_L(lambda)=-3 construction. Power inequalities and coefficient normalization give exact support {0,1,2,L}, signs ---+ and norm (G+r_L)/(1-r_L). Finset.abs_sum_le_sum_abs and Finset.sum_eq_zero_iff_of_nonneg give weak duality and equality contacts for every real competitor. Matrix.det_fin_three normalizes the actual ring minor to +/-c*(delta^2/9+7*c^2); Matrix.linearIndependent_rows_of_det_ne_zero and the mass/gd evaluations yield four-contact independence, hence uniqueness in both directions and their intersection. Mass and gd contradict feasibility for L=0,1,2. tendsto_pow_atTop_nhds_zero_of_lt_one, a finite residue bound and Filter.Tendsto.div give the strict positive gap and limit as L tends to infinity; ordered-field normalization gives strict horizon decrease. No extra recurrence, independence, actual-law or optimality premise is assumed.
