    justification: "Pinned upstream closure by Finset.sum_div, Finset.sum_mul, Finset.mul_sum, Matrix.mul_assoc, Convex.sum_mem, Finset.sum_fiberwise, Finset.sum_sub_distrib, ConvexOn.map_sum_le, Finset.sum_le_sum, mul_le_mul_of_nonneg_left, Finset.sum_comm, ConvexOn.le_slope_of_hasDerivAt, ConvexOn.slope_le_of_hasDerivAt, Finset.sum_nonneg, Finset.single_le_sum, Finset.min'_le. Likelihood kernel and invariance: Set L_jk=T_jk*q_k/q_j. Nonnegativity is immediate. Stationarity gives sum_k L_jk=(Tq)_j/q_j=1, column stochasticity gives sum_j q_j*L_jk=q_k. Conjugating TE=ETE by the invertible positive diagonal D_q gives L Pi=Pi L Pi. Only definitions and finite matrix/field normalization are used. All likelihood coordinates lie in K, and z is fiberwise constant: Set v=Lu and z=L Pi u. Pi and every row of L use nonnegative normalized weights, so u,Pi u,v,z,Pi v lie in K. The conjugated family-preservation identity yields Pi z=z, hence z is constant on each F_i. Input Bregman identity: sum_F_i q_j*(u_j-m_i)=0 because p_i*m_i=a_i. Expand b(u_j,m_i); the derivative term is a fiber constant times zero. Summing gives sum_j q_j*b(u_j,(Pi u)_j)=J_Phi(d). This is also the checked fiber identity with v=u,z=m_i. Joint Jensen contraction: Take E=Real x Real, beta=Real, s=K x K, f=b, t=Finset.univ:J, weights w=L j, points k=(u_k,(Pi u)_k). Jensen gives b(v_j,z_j)<=sum_k L_jk*b(u_k,(Pi u)_k). Multiply by q_j and sum; q-invariance gives sum_j q_j*b(v_j,z_j)<=J_Phi(d). The exact product-space substitution and weighted contraction compile in ReuseChecks.lean. Output split and the strengthened inequality: On F_i let vbar_i=sum_F_i q_j*v_j/p_i=(CTd)_i/p_i and zbar_i=z_j. Fiber constancy and D_q z=TEd give p_i*zbar_i=(CTEd)_i=(SCd)_i. The checked finite identity expands sum_F_i q_j*b(v_j,zbar_i) into [sum_F_i q_j*Phi(v_j)-p_i*Phi(vbar_i)]+p_i*b(vbar_i,zbar_i). Sum over i and substitute the preceding contraction to obtain exactly J_Phi(Td)+sum_i p_i*b((CTd)_i/p_i,(SCd)_i/p_i)<=J_Phi(d). Coarse term nonnegative and monotonicity: For s,t in K split t<s, t=s, s<t. The appropriate convex secant inequality at t, multiplied by the positive secant length, yields b(s,t)>=0. C1 on the open containing interval supplies DifferentiableAt at t, including zero. Multiply by p_i>0, sum, and discard the nonnegative coarse term. The scratch tangent-support proof compiles. Uniform interval and finite terms for every probability d: Finite nonempty J and positive q give qmin>0 and qmin<=q_j. Nonnegative normalized d gives d_j<=1. Thus 0<=u_j=d_j/q_j<=1/q_j<=1/qmin. All later coordinates remain in K by convex-combination membership. Positive reference denominators and finite derivatives make every displayed finite sum a real number; no actual-support division is introduced. Attached citations and KL boundary: Chafai and Raginsky are provenance, not additional hypotheses. The proof's final boundary is retained: t*log(t) at zero does not have the assumed finite derivative, so this result does not supply the separately cited zero-support KL theorem. Every displayed proof identity is accounted for above. No usable frozen project GID was found for this general statement in the searched D5 declarations; no new Lean declaration is introduced."
