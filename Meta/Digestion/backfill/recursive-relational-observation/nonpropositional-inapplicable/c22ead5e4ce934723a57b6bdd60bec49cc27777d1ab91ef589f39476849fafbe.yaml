    justification: 'Upstream-only bind settlement of the full fair-phase clause of139.9. In pinned Mathlib db584cd6d46c92f209a44c0f1c829460d327499d use MeasurePreserving.skew_product with base identity on the entire relation path and fiber Bool with (PMF.uniformOfFintype Bool).toMeasure. For each integer t, A_t is the same original A_0 xor the finite parity of c_i=1-r_i along the interval from0 to t; negative t uses the reversed interval and xor is its own inverse. Finite fold/append and xor normalization verify the displayed recurrence, including t=-1 and0. The path parity is measurable by finite coordinate projections. For every fixed path its xor translation preserves the uniform Bool law: PMF.toMeasure_map, PMF.map_apply, PMF.uniformOfFintype_apply, tsum_fintype and Fintype.sum_bool reduce the two fiber masses to1/2. Thus the pushforward (r,A_0) to (r,A_t) is the same product law for every integer t. This gives a constant fair conditional law given the full path and justifies Z_t=(j_t,A_t) as a definition. No stationarity, mixing, Markov or null-history pointwise uniqueness assertion is covered. No project GID is needed or available for this complete elementary phase clause; zero new Lean declarations.'
