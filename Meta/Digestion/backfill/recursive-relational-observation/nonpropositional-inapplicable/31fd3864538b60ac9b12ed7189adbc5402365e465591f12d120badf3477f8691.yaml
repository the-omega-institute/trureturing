    justification: 命题仅由钉版 Mathlib 的 LinearMap.range_adjoint_comp_self、LinearMap.finrank_range_adjoint、Submodule.map_eq_range_iff、Submodule.span_induction、LinearMap.IsSymmetric.pow、LinearMap.adjoint_inner_right 和 LinearMap.isPositive_linearIsometryEquiv_conj_iff，经定义展开、Gram 配对与秩接口、块算子构造和标量规范化闭合；仓内无完整覆盖本命题的冻结 GID。对 r≥1，普通平坦蕴含全部未来唯一；规范 C 的核为零时，在全体正实现及严格正定竞争类中都得到充要条件。零谱例 C=[[1,1],[1,1]]、J=(1,0) 的前四矩为 (1,1,2,4)，普通两秩为 2、1，移位两秩为 1、1，仍对任意维数的正竞争实现保持全部未来唯一，因此允许零谱时普通平坦不是必要条件。
