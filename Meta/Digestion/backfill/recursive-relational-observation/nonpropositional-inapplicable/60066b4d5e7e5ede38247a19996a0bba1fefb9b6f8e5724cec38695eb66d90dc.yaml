    justification: "Pinned-upstream-only propositional settlement under CLAUDE 3.2 / spec 11.21 (#8049), not a claim that this proof is nonmathematical. Mathlib is pinned by lake-manifest.json at db584cd6d46c92f209a44c0f1c829460d327499d. No usable frozen project declaration GID was found for this isolated arbitrary-input finite-sum implication pair in the supplied bounded D5 Observer/Linear, LinearMemory, Hankel and convolution/suffix search; the frozen quotient descent/observability declarations do not state or supply a needed premise of this leaf. This is a scoped no-GID fact, not a global theorem-nonexistence claim.\nRetain the surrounding 68.1/68.2 data: any field K, finite-dimensional K-spaces V,H including zero spaces, B:H->V, C:V->H, D:H->H, M_j=B.comp(D^j).comp(C); F_n(u)=sum_{i:Fin n} M_(n-1-i.val)(u i). A and closed-loop initial states impose no restriction on these arbitrary input strings. The numbered 1 and 3 refer to their single for-every-m equivalence binder in the statement parent; neither condition is asserted unconditionally here.\nFor each natural m, condition 1 is T(m): forall j>=m, M_j=0. Condition 3 is S(m): forall n and u,u':Fin n->V, (forall i, n-m<=i.val -> u i=u' i) -> F_n(u)=F_n(u'). The Nat threshold is max(0,n-m), retaining precisely the last min(m,n) positions. T(m)->S(m) applies Finset.sum_congr with both finite sets Finset.univ and summands M_(n-1-i.val)(u i), M_(n-1-i.val)(u' i). If n-m<=i.val use the supplied input equality. Otherwise i.val<n-m and i.val<n imply m<=n-1-i.val; the corresponding map is zero by T(m). LinearMap.comp_apply and zero-map evaluation discharge both summands.\nFor S(m)->T(m), take arbitrary j>=m and v:V, set n=j+1, u i=if i.val=0 then v else 0, and u' i=0. Since 0<n-m, every required suffix coordinate is nonzero and the strings agree there. Instantiate S(m) with exactly these strings. Finset.sum_eq_single_of_mem with a=0:Fin(j+1), s=Finset.univ, Finset.mem_univ and map_zero evaluates F_n(u)=M_j(v); Finset.sum_congr and map_zero evaluate F_n(u')=0. Natural subtraction reduces n-1-0 to j. LinearMap.ext gives M_j=0 from equality for every v. The displayed difference equation is additive normalization of this equality. Finset.sum_congr and Finset.sum_eq_single_of_mem are the existing additive declarations generated by @[to_additive] on Finset.prod_congr and Finset.prod_eq_single_of_mem in Mathlib/Algebra/BigOperators/Group/Finset/Basic.lean.\nAt n=0 the sums are empty; for n<=m the threshold is zero and agreement is on the entire string; for m=0 no valid index meets n<=i.val, so the suffix premise is vacuous and all-input output independence forces every coefficient to vanish. No positive dimension, positive m, orbit restriction, quotient equivalence, cutoff existence or minimum is assumed or concluded by this isolated leaf. The next leaf retains the actual quotient-dependent minimum/zero argument and needs project coverage."
