    justification: 'Pinned Mathlib db584cd6d46c92f209a44c0f1c829460d327499d closes this complete clause by instantiation and normalization; no applicable frozen project declaration GID supplies it. proof_shape=bind-only; admission_basis=none; escape_witness=none. For each integer k>=2, put m=(k-2).toNat: Int.toNat_of_nonneg gives k=m+2, with block lengths m+2 and m+1 positive. Actual bits are ZMod 2, identified with Bool by finTwoEquiv (0=false, 1=true), and actual sequences are Nat->ZMod 2. Equiv.toHomeomorphOfDiscrete, Homeomorph.piCongrRight and Homeomorph.subtype transport the product and subspace topologies and the literal forbidden-block predicates. K means for every j there is no constant window x(j+i), i:Fin(m+2); Y means for every j the labels c(j+i), i:Fin(m+1), are not all 1. R(x)(n) is the equality indicator, whose four binary cases give R(x)(n)=1-(x(n+1)-x(n)); C(x)(n)=1-x(n). Define the actual reconstruction F(b,c)(n)=b+sum(i in Finset.range n)(1-c(i)). Finset.sum_range_succ gives F(b,c)(0)=b and F(b,c)(n+1)=F(b,c)(n)+(1-c(n)), the stated XOR recurrence. Substituting this into the equality-indicator formula gives R(F(b,c))=c. Finset.eq_sum_range_sub with G=ZMod 2, f=x and arbitrary n gives F(x(0),R(x))=x; AddCommGroup is the existing ZMod 2 instance. Fin.liftFun_iff_succ with n=m+1, alpha=ZMod 2, r=Eq, its equality-transitivity instance, and f(i)=x(j+i) equates all adjacent equalities with a constant length-(m+2) window; comparing i with 0 uses Fin.pos_iff_ne_zero, and casts/successors normalize to j+i and j+i+1. Thus R(x) is in Y iff x is in K, F(b,c) is in K for every c in Y, and the two actual inverse identities give surjectivity and unique anchored reconstruction. Any sequence satisfying the displayed recurrence has R(x)=c by the same binary identity, so recurrence uniqueness also follows from the left inverse. Subtracting the two Finset.eq_sum_range_sub specializations when R(x)=R(y) gives y(n)-x(n)=y(0)-x(0); ZMod.neg_eq_self_mod_two makes this the stated constant XOR delta and its step equality. Binary exhaustiveness gives R(x)=R(y) iff y=x or y=C(x). The same normalization gives F(1-b,c)=C(F(b,c)), R(C(x))=R(x), preservation of K and C(C(x))=x. At coordinate 0, 1-x(0) differs from x(0), so complementary points are distinct and each fiber consists exactly of F(0,c) and F(1,c). continuous_apply, continuous_pi, Continuous.sub and Continuous.add give continuity of R and C in the product topology using the existing discrete ZMod topology and its continuous operations. Finset.sum_congr gives exact dependence of F(b,c)(n) only on b and c(i) for i<n, including the empty prefix n=0. continuous_finsetSum with s=Finset.range n and summands p->1-p.2(i), then continuous_pi, gives continuity of F on ZMod 2 times the sequence product; Continuous.comp, Continuous.prodMk and Continuous.subtype_mk give the restricted maps. These maps and the two proved inverses assemble Theta(x)=(x(0),R(x)) as a Homeomorph with inverse F; Theta(C(x))=(1-x(0),R(x)). The actual group Multiplicative(ZMod 2) acts on K by g*x=(n->g.toAdd+x(n)); R is invariant by cancellation, so the action preserves K. Addition supplies one_smul and mul_smul. The group has exactly two elements, and ofAdd(1) is nonidentity with square 1 and acts exactly as C. Each action map is continuous by coordinatewise addition, and continuous_prod_of_discrete_left gives the joint continuous action. MulAction.orbitRel_apply and MulAction.mem_orbit_iff, followed by the two group cases and the fiber equivalence, identify this genuine complement-orbit setoid with Setoid.ker R. Function.RightInverse.homeomorph applied to the actual continuous restricted R and continuous section c->F(0,c), whose right-inverse equation was proved above, yields the kernel-quotient homeomorphism. Homeomorph.Quotient.congrRight transports along the proved orbit/kernel equality; its composite sends [x] exactly to R(x) and has the quotient topology. For each j, the constant-window cylinder is open: IsOpen.preimage of the discrete equality diagonal under the two evaluations, followed by isOpen_iInter_of_finite over Fin(m+2). IsOpen.isClosed_compl and isClosed_iInter give closed K. Finite.compactSpace, Function.compactSpace, IsClosed.isCompact and isCompact_iff_compactSpace give compact K; Quotient.compactSpace gives compactness of its actual orbit quotient. The discrete alphabet, Pi.t2Space and the subtype instance give Hausdorff Y. The all-zero c lies in Y for every m because Fin(m+1) contains 0 and 0!=1; both F(0,c) and F(1,c) are explicit distinct K witnesses. At k=2 (m=0), Fin.eq_zero on the length-one window and binary exhaustiveness give Y={0 forever}; Finset.sum_const and normalization give F(b,0)(n)=b+(n:ZMod 2). The left inverse then gives K exactly the two alternating sequences, so all universal image, fiber, reconstruction and topological quotient conclusions include k=2.'
