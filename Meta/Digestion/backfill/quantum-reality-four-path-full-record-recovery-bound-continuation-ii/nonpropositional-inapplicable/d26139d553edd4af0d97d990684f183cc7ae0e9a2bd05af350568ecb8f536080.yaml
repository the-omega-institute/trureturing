    justification: "Upstream-only disposition of the complete mathematical scalar Theorem 47.2, including the actual maximum over the original continuous closed triangle. Mathlib is pinned by lake-manifest.json to 56a005855ea17e0b0958f73ec801ae140b0a1679. Exact suppliers: Real.sqrt_nonneg, Real.sq_sqrt, Real.sqrt_mul, Real.sqrt_div, Real.sqrt_le_iff, Real.sqrt_lt, Real.sqrt_pos, Real.cos_pi_div_eight, Real.sin_pi_div_eight, sq_nonneg, mul_nonneg, mul_pos, Real.continuous_sqrt, isCompact_Icc, IsCompact.prod, IsCompact.inter_right, isClosed_le, and IsCompact.exists_isMaxOn, together with ordered-field normalization and continuity of sums, products and quotients with nonzero denominators. No fitting project GID supplies this whole envelope; the unprescribed-pair FourPathQuadraticMajorant and unitary matrix-distance FourPathWeightedEqualityRemainder do not. No project coverage, new wrapper or GID is claimed. Use exactly (46.10)-(46.13) and (47.1), both original rows +(h,c,h,s) and -(s,h,c,h), every 0<x<1 and q in [0,1], p=1-q, on T_x={(X,Y) in [0,1]^2 : sqrt(X)+sqrt(Y)>=1+x}. No source theorem is assumed as an unverified Lean supplier: the 46.3 scalar identities and strict cone are expanded into the pinned root/order suppliers and their complete normalization correspondence. Namely r=sqrt(X), z=sqrt(Y) lie in [x,1] with rz>=x; XY>=x^2>0, A=X-x^2>=0, B=1-Y>=0, H=A-xB>=0, Delta=4LH-(H+LB)^2>=0 and F^2=(1-X)B Delta/(4XY). The nonnegative-product strict-cone certificate is 4x^2XY(K^2BH-F^2)=B[4LH y^2(XY-x^2)+4LH x^2A+x^2(1-X)(A+B)^2]. B>0 implies H>0 and A>0; B=0 gives F=K sqrt(BH)=0. Signs and the recovery radicands derive from this same domain, with x,y,R0,C0,mu positive at both population endpoints. The two recovery-square expansions and 2z0(z0-z)=z0^2-z^2+(z-z0)^2 give all five terms of (46.19) by square completion, using L*D_sigma/(4mu*x^2)=nu-tc^2/(4mu). For the exact first gain coefficient, R0^2-R^2=k(aH+R0 B)>=0 gives 0<=R<=R0. Divide only by R0+R>0 to obtain R0-R>=kB/2. Thus sqrt(p)*(R-R0)^2/(2R0)>=sqrt(p)*k^2*B^2/(8R0). For the coherent gain, handle B=0 directly. If B>0, first derive H>0 and set w=(H+LB)^2/(4LH) in [0,1]. Root order and 1-X<=y^2, XY>=x^2 give F<=K sqrt(BH)*sqrt(1-w). The identity 2(1-sqrt(1-w))-w=(1-sqrt(1-w))^2>=0 gives K sqrt(BH)-F>=K(H+LB)^2 sqrt(B)/(8L sqrt(H)). The minimum inequality in (47.5) requires no differentiated optimization: for u=sqrt(3H), v=sqrt(LB), (u^2+3v^2)^2-16u*v^3=(u-v)^2(u^2+2u*v+9v^2)>=0. Signed root/product normalization therefore yields exactly K sqrt(BH)-F>=2Ly*B^2/(3sqrt(3)*x). Equivalently the substitution t=sqrt(3z/L)>0 in (47.5) uses (t^2+3)^2-16t=(t-1)^2(t^2+2t+9)>=0. The B=0 case uses neither division by B nor H. Multiplying by sqrt(q)*ell*m/C0=m*sqrt(q)/y and combining the fourth and third remainder terms gives exactly Cgain=sqrt(p)*k^2/(8R0)+2m*sqrt(q)*L/(3sqrt(3)*x), with no loss of its original constants. Drop only the remaining nonnegative squares. For delta=L*D_sigma/(4mu*x^2), eta=max(0,-delta), the result is Gamma-Gamma0<=eta*B-Cgain*B^2. Cgain>0: at q=0 the first summand is positive, and at q>0 the second is positive, including q=1. Square completion eta*B-Cgain*B^2=eta^2/(4Cgain)-Cgain*(B-eta/(2Cgain))^2 supplies the second pointwise inequality with exactly J=eta^2/(4Cgain). For the actual I=max_{T_x}(Gamma-Gamma0), apply IsCompact.exists_isMaxOn to the nonempty compact set T_x and the ContinuousOn function Gamma-Gamma0. Compactness follows from the product of the two compact real intervals [0,1] intersected with the closed superlevel set of the continuous root sum. The corner (x^2,1) belongs to T_x and gives Gamma-Gamma0=0. On all T_x, XY>=x^2>0 makes the denominator 2sqrt(XY) in Z nonzero; root continuity, including at zero radicands and C=0, and sum/product/nonzero-quotient continuity give the required ContinuousOn premise. Hence the original continuous maximum is attained and satisfies 0<=I<=J; no finite enumeration, surrogate maximum or assumed attainment replaces it. At q=0, nu=k/2>0 and D_sigma>0 give eta=J=I=0; at q=1 positivity of the coherent coefficient preserves the argument. D_sigma>=0 likewise gives J=I=0, without adding a new equality classification. This records the supplied complete source-level upstream/normalization justification via the canonical writer, not a fresh Lean exact application, kernel proof, content admission or completed new-math consensus. Both original rows, all closed-triangle boundaries, B=0, X=1 with B>0, aligned/repeated pairs, q=0, q=1 and C=0 are retained. No nu/D_sigma sign, p>0, q>0, C>0 or level cutoff is assumed. The numeric maximum and scalar signs here do not certify 47.1's joint whole-feedback realization, 46.1-46.2 actual-unitary correspondence, or 47.3 actual-pure-input transport/true-distance statement. Those remain unresolved, as do downstream equality lifts, mixed-effect comparisons and unrestricted first-loss classification. The original one common feedback scalar and coupled recoveries are not replaced by independent choices."
