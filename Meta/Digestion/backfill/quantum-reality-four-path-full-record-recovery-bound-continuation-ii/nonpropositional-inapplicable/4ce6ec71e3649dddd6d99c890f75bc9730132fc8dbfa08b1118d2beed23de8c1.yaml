    justification: 'Upstream-only disposition of the complete mathematical scalar Theorem 46.3, under CLAUDE.md 1.2/3.2 and SPEC A17. Mathlib is pinned by lake-manifest.json to 56a005855ea17e0b0958f73ec801ae140b0a1679. Suppliers: Real.sqrt_nonneg, Real.sq_sqrt, Real.sqrt_mul, Real.sqrt_div, Real.sqrt_le_iff, Real.sqrt_lt, Real.sqrt_pos, Real.cos_pi_div_eight, Real.sin_pi_div_eight, sq_nonneg, mul_nonneg and mul_pos, with ordered-field identities and signed square comparison. No fitting frozen project GID supplies the whole prescribed-trace strict-cone/five-term conjunction: FourPathQuadraticMajorant.four_path_quadratic_majorant has an unprescribed complex-pair telescope; FourPathWeightedEqualityRemainder.weighted_equality_remainder supplies a different unitary matrix-distance remainder. Neither is claimed as coverage. No new wrapper/GID is required. Correspondence uses exactly (46.10)-(46.13), both rows +(a,b,ell,m)=(h,c,h,s) and -(s,h,c,h), h=1/sqrt(2), c=cos(pi/8), s=sin(pi/8), k=b-a, p=1-q. Trigonometric radical values and root order give 0<s<h<c, hence 0<a<b and ell>m>0. For every 0<x<1, q in [0,1], L=1+x and y=sqrt(1-x^2), the entire closed triangle gives r=sqrt(X), z=sqrt(Y) in [x,1], r+z>=L, rz>=r+z-1>=x by (1-r)(1-z)>=0; thus XY>=x^2>0 and A=X-x^2>=0, B=1-Y>=0. Delta=((r+z)^2-L^2)(L^2-(r-z)^2)>=0, since |r-z|<=1<L. Expanding gives Delta=4XY-(L^2-X-Y)^2=4LH-(A+B)^2 with H=A-xB>=0. These derive |Z|<=1 and the sign conditions for F=sqrt((1-X)(1-Y))*sqrt(1-Z^2), including F>=0. Root-product normalization gives exactly F^2=(1-X)B Delta/(4XY). For K=sqrt(L)*y/x the denominator-cleared certificate is 4x^2XY(K^2BH-F^2)=B[4LH y^2(XY-x^2)+4LH x^2A+x^2(1-X)(A+B)^2]. Every summand is nonnegative, so signed square comparison gives F<=K sqrt(BH). If B>0, A+B>0 and Delta>=0 imply H>0, and A=H+xB>0 makes the middle summand positive. This includes X=1, where F=0. If B=0, F=K sqrt(BH)=0. Thus equality holds exactly at B=0, with strictness on every B>0 boundary or interior point, including aligned centers and repeated pairs. The R radicand is (a+bx)^2+ak(1-X)+bk(Y-x^2)>0; the C radicand is ell^2(1-X)+m^2(1-Y)+2ell*m*F>=0. Hence all root rewrites are legitimate even when C=0. R0=ax+b>0, C0=ell*y>0 and mu=(ak sqrt(p)/R0+ell sqrt(q)/y)/2>0, including q=0 and q=1 since p+q=1. Expansion gives R^2=R0^2-akA-bkB and C^2=C0^2-ell^2A+m^2B+2ell*m*F. Apply 2z0(z0-z)=z0^2-z^2+(z-z0)^2 with (z,z0)=(R,R0),(C,C0) and weights sqrt(p),sqrt(q). Substituting A=H+xB gives mu H+nu B-sqrt(q)*ell*m*F/C0 plus the two recovery squares. Since sqrt(q)*ell*m*K/C0=tc and L*D_sigma/(4mu*x^2)=nu-tc^2/(4mu), square completion gives all five terms of (46.19), with their original coefficients: mu(sqrt(H)-tc sqrt(B)/(2mu))^2; L*D_sigma*B/(4mu*x^2); sqrt(q)*ell*m*(K sqrt(BH)-F)/C0; sqrt(p)*(R-R0)^2/(2R0); sqrt(q)*(C-C0)^2/(2C0). This is the supplied clause-complete source-level upstream/normalization correspondence, recorded by the canonical bookkeeping writer; it is not an elaborated exact application or a fresh kernel proof. The proposition is mathematical despite this existing receipt category. No sign of nu or D_sigma, positive p or q, C>0, X<1, or level 13/4 restriction is added. Whole-feedback reconstruction/actual unitary realization in 46.1-46.2, arbitrary-U transport, true-distance interpretations, equality lifts, mixed-input and first-loss claims are not supplied by these scalar identities and remain separate unresolved obligations. No independent recoveries are substituted.'
