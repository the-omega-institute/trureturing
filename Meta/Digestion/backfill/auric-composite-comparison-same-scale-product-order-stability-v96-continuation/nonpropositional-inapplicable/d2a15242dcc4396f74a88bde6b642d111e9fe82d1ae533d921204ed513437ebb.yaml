    justification: 'Pure pinned-upstream consequence with no project frozen GID covering the complete original statement; no new Lean declaration or escape witness. Inline the already accounted Q97.1-Q97.3 route on BOTH original finite positive Frobenius spaces, with arbitrary complete original ONBs, original ordered references, the same tagged unaveraged report Gamma, lambda=lambda_star, eta=Gamma^(1/4), and the actual Q97.8 Riesz bracket C. In particular retain h<=5*sigma/3<=U*eta, C alternating and annihilating the original unit, skewness of C_a, norm(C)_bil<=K+1, norm(F_C)_tri<=3*K*U*eta, and norm(E)_tri<=G*eta as derived intermediate consequences, not extra assumptions on the original data. Commutativity of S cancels the six terms of the cyclic left-multiplication commutators. Thus lambda*J_C(a,b,c)=E(a,b)c+E(b,c)a+E(c,a)b and norm_add_le gives lambda*norm(J_C)_tri<=3*G*eta. Alternation gives [C_a,C_b]c-C(C(a,b),c)=-J_C(a,b,c), hence [L_a,L_b]+lambda*[C_a,C_b]=E(a,b)-lambda*J_C(a,b,-); ContinuousLinearMap.opNorm_le_bound gives the source 4*G*eta bound. No exact Jacobi identity is assumed. Use LinearMap.BilinMap.baseChange and baseChange_tmul for S and C on Complex tensor[Real] J, and the canonical tensor flip to the original J tensor[Real] Complex. TensorProduct.inner_tmul, norm_tmul, commIsometry, OrthonormalBasis.tensorProduct, Complex.orthonormalBasisOneI, Module.Basis.baseChange and baseChange_repr_tmul, and EuclideanSpace.norm_sq_eq identify exactly the original standard complex Hilbert metric: x=a+i*b has norm(x)^2=norm(a)^2+norm(b)^2 and star(x)=a-i*b. This is an isometric coordinate identification, not a replacement norm. Set mu=S_complex-i*sqrt(lambda)*C_complex as a continuous complex bilinear map, without installing an associative algebra structure. The original strict unit and star anti-multiplicativity follow by bilinearity, symmetry of S and alternation/unit annihilation of C. The original Frobenius identity makes S_a self-adjoint; skewness of C_a and conjugate scalar action on adjoints make S_a-i*sqrt(lambda)*C_a self-adjoint for real a. ContinuousLinearMap.eq_adjoint_iff and the adjoint StarModule laws then give (L_x^mu)^dagger=L_(x^star)^mu for every complex x. Expand the associator on real a,b,c. Its real part is S(S(a,b),c)-S(a,S(b,c))-lambda*C(C(a,b),c)+lambda*C(a,C(b,c))=-E(a,c)b-lambda*J_C(a,b,c). Its imaginary coefficient is sqrt(lambda)*(F_C(a;b,c)+F_C(c;a,b)). Therefore the real-input bound is (4*G+6*K*sqrt(K)*U)*eta using Real.sq_sqrt, Real.sqrt_le_sqrt, ContinuousLinearMap.le_opNorm2 and triangle inequalities. For ALL complex inputs expand a+i*b in each slot. The original Hilbert identity gives norm(a)+norm(b)<=sqrt(2)*norm(x); four bilinear terms cost at most 2, and eight trilinear terms cost at most 2*sqrt(2)<3. Finite sum expansion, norm_sum_le, norm_smul, Real.sq_sqrt, LinearMap.mkContinuous2_norm_le and ContinuousMultilinearMap.opNorm_le_bound yield norm(mu)_bil,H<=2*(K+sqrt(K)*(K+1))=M and norm(A_mu)_tri,H<=3*(4*G+6*K*sqrt(K)*U)*eta=V*eta exactly. The Unicode Lean declarations le_opNorm₂ and mkContinuous₂_norm_le are intended by le_opNorm2 and mkContinuous2_norm_le above. All adaptation consists of upstream applications, finite algebra/coordinate expansion and normalization. This accounting does not assert a new compiled kernel proof, exact associativity away from eta=0, a quantitative Ulam repair, or any later metric/cone stability conclusion.'
