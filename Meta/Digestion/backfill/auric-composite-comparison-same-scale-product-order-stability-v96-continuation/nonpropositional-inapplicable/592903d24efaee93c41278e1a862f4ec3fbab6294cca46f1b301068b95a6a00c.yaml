    justification: Pure pinned-upstream consequence, with no project frozen GID covering the complete original statement. Inline the Q97.1 derivation from the original tagged report, not an assumed symmetry bound. Apply MultilinearMap.alternatization and MultilinearMap.alternatization_apply to t(x,y,z)=inner(B(x,y),z), using its last-two-slot skewness; the normalized six-term alternatization is exactly the source cyclic average phi. Compose with the original Pe(x)=x-inner(e,x)*e. InnerProductSpace.toDual, InnerProductSpace.toDual_symm_apply and InnerProductSpace.continuousLinearMapOfBilin_apply give the unique original Riesz C. The two cyclic differences cost 2*sigma/3; the three single-e projection terms cost sigma/3 each and all repeated-e terms vanish. ContinuousLinearMap.opNorm_le_bound and ContinuousLinearMap.opNorm_le_bound₂ give h=norm(C-B)_bil <= 5*sigma/3 <= 2*sigma = U*eta <= 1. Alternation gives C(e,x)=C(x,e)=0 and skewness of C_x; norm_add_le gives norm(C)_bil <= K+1. Subtract the exact original B derivation identity and apply ContinuousLinearMap.le_opNorm₂ and ContinuousMultilinearMap.opNorm_le_bound to obtain norm(F_C)_tri <= 3*K*h <= 3*K*U*eta. No free bracket, extra data or stronger algebra premise is used.
