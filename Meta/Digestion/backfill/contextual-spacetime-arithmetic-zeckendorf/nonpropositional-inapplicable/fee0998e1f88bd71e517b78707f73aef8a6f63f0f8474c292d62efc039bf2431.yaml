  nonpropositional:
    justification: Explanatory proof of 343.2 with the same Fibonacci indexing G_n=fib(n+2). The displayed modular maps (a,b)->(b,a+b) and (a,b)->(b-a,a) are inverse. Finite injective dynamics supplies a positive period at (0,1); semiconjugacy of natural and modular iteration gives the exact pair (fib m,fib(m+1)). The resulting divisibility propagates to every multiple of the period by Nat.fib_dvd, including the d=1 single-state case with period 1. Cofinality and the three-step parity formulas are already covered. No equality with a uniquely selected period is asserted.
