    justification: Explanatory proof of Theorem 359.2 with infinitely many active coordinates. The continuous injective golden coordinate map gives T1. ReadoutTopology.result gives nonisolation at every point. A countably generated neighbourhood filter at the specified point yields a punctured-neighbourhood sequence, contradicting the frozen eventual-equality characterization. A compact subspace embeds into the metrizable golden-coordinate product; sequential compactness and the same characterization force finiteness. A finite neighbourhood in a T1 space would give an open singleton. No global first-countability assumption replaces the pointwise assertion.
