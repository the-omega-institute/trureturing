  nonpropositional:
    justification: Explanatory proof of Corollary 363.4. A zero capacity forces the corresponding coordinate of every capacity point to zero, so its contributions to the finite character, mass and extension series vanish. For finite active set, B=X is finite discrete and the mass is a finite sum of finite terms; the full necessity and uniform-series sufficiency of 363.3 give the unique continuous extension. The empty active set gives a single total zero state and the zero extension. Infinite active sets retain the same mass criterion.
