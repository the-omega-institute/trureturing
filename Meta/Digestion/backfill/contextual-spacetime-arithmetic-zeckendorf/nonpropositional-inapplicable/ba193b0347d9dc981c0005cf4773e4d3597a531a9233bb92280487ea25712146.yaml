    justification: Explanatory proof of Theorem 359.3. Restriction to the finite active set and extension by zero are inverse, supplying B=X and the product cardinality. The finite Hausdorff coordinate product is discrete, and adjoining probes preserves discreteness. Each singleton is compact and open and generates the neighbourhood filter. The empty active set gives one total zero function on the natural numbers. There is no additional specified construction or stronger quantifier range.
