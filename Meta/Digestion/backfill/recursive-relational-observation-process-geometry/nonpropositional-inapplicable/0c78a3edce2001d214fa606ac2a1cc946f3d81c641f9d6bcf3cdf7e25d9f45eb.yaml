    justification: Pure pinned-upstream closure, no applicable frozen project GID. The actual partial countdown has Nat states, root 0, tick legal iff n>0, constant Unit label and successor n-1. Its exact behavior is present on a path iff length<=n. Residual after legal p is countdown(n-length p), by Quiver.Path.length_comp and natural-number normalization. Set.finite_Iic, Set.Finite.image and Set.Finite.subset bound every individual residual set. Function.Semiconj.iterate_right and Nat.succ_iterate supply paths of every length; legality separates different countdowns, and Infinite.of_injective gives infinite global residual union. The same family therefore has no one finite controller by the family criterion. No infinite Fintype specialization.
