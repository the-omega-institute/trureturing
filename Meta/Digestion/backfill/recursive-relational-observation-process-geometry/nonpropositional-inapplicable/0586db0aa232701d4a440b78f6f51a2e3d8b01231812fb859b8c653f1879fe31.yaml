    justification: "Upstream-only bind-only settlement under current CLAUDE 3.2; pinned Mathlib db584cd6d46c92f209a44c0f1c829460d327499d. No project GID is available for this exact arbitrary typed partial-writer substitution in the audited D5 interfaces; direct frozen dependencies are empty. H is independently the prefix-closed path readout/edge-label structure of Process 2.1, not an M-tree. Use CategoryTheory.Paths.liftNatTrans in Hom(X,Y)=X -> Option(List(tagged dependent edge events) × Y), with history-prefix functor p |-> (v |-> some([],p.comp v)) and component run(next,s,p). Its edge square unfolds one recursive run step. CategoryTheory.Functor.map_comp then gives run(next,s,u.comp v)=run(next,s,u).bind(fun (tr,t) => run(next,t,v).map(fun (tr',z) => (tr++tr',z))). Category/history-functor laws normalize with Option laws, List.append_assoc and Quiver.Path.comp_assoc; no desired intertwining conclusion is assumed in their fields. Define beta.read by mapping q over run and beta.label by prefix-run followed by next-edge label. Coordinate normalization gives sigma_u(beta(s))=beta(T_u(s)), including absence and ordered labels. The exact H.run_source is itself a supplied Paths.liftNatTrans specialization. The substitutions compile using only propext, Classical.choice and Quot.sound. No new Lean, finite I/alphabet/readout, decidability, computable enumeration, acquisition assumption or sink state is needed. Complete (a): residual states at j are {g:H_j | exists legal u:i->j, sigma_u(h)=g}. Closure is Quiver.Path.comp_assoc after expanding sigma. Restrict H.next and retain root, domain, labels and types; subtype-inclusion path naturality gives exact all-path behavior. Every residual is reached by its witnessing legal path. The tagged reachable implementation maps onto the tagged residual set via (j,t) |-> (j,beta(t)); residual witnesses and successful run supply surjectivity. Finite.of_injective restricts a finite TOTAL implementation to reachable states; Finite.of_surjective supplies necessity. The literal residual carrier supplies sufficiency. Source relations at every legal reachable residual transfer by the run identity and Option.map_injective on subtype inclusion, preserving common domains, successors and ordered traces."
