    justification: Definition 21.13 fixes A, R_lambda, v_lambda and E_lambda for a finite complex Hermitian positive semidefinite K, b and real c. These are stipulated expressions, not an additional theorem; the final sentence specifies that evaluation remains on the original A. The only implicit well-definedness premise, invertibility of K + lambda I for lambda > 0 (including dimension zero), is supplied by pinned Mathlib Matrix.PosDef.diagonal, Matrix.PosDef.posSemidef_add and Matrix.PosDef.isUnit. No frozen project GID states these four definitions, and SchurMinimum.schur_quadratic_is_least is not claimed as their coverage. This receipt does not settle 21.14 or 21.15.
