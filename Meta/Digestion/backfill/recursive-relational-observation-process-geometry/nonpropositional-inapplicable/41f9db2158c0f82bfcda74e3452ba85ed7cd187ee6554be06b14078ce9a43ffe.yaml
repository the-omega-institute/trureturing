    justification: 'This is the complete coexistence paragraph following ProcessGeometry 27.18a, not the parent assertion for every finite-mean prior. Its existence clauses are bind-only specializations, with no new Lean admission and no frozen project GID for the complete paragraph. The separate theorem 27.6 settlement is unchanged. Use exactly mu_R=ProbabilityTheory.cond volume [1/4,1/2] and mu=mu_R.map(projIcc 0 1), with b=p=1/2 and a=1-p=1/2. The source is ((mu.prod Bernoulli(1/2)) compProd (armKernel prod armKernel)).prod nu. Both arms use the SAME sampled Q and root; nu is the arbitrary original independent seed probability law. Normalization, infinite support, 0<Q<1 almost everywhere, and the nonnegative reciprocal bound I<=2 are discharged. MeasureTheory.lintegral_map identifies the unitInterval reciprocal integral with the original real-prior integral. Durable source suppliers are D5/S3/Observer/ProbabilisticClosure/TrajectoryLaws/HasLawTrajectory.has_law_traj_measure (per-declaration statement_id sha256:8b17a872b3e7fac2aeee7117d2e4c632944d238af49d11b65b258003cbe12fa6) and D5/S3/Observer/ProbabilisticClosure/TrajectoryLaws/MarkovPrefixMass.markov_chain_law_map_prefix_apply_singleton (per-declaration statement_id sha256:ceba603b788590b7e5f7cf036e0d43e16b5e85797e974ebc93e2a503afddbc0f). These are declaration IDs, not module state pins. Remaining suppliers are pinned Mathlib at db584cd6d46c92f209a44c0f1c829460d327499d, including MeasureTheory.lintegral_iSup, MeasureTheory.integral_toReal, MeasureTheory.integrable_toReal_of_lintegral_ne_top, ENNReal.tsum_geometric, MeasureTheory.tendsto_integral_of_dominated_convergence, MeasureTheory.hasSum_integral_of_dominated_convergence, MeasureTheory.integral_pos_iff_support_of_nonneg, MeasureTheory.Integrable.of_bound, tsum_nonneg, Polynomial.eq_zero_of_infinite_isRoot, MeasureTheory.Measure.support_subset_of_isClosed, Matrix.posDef_gram_iff_linearIndependent, Matrix.rank_mul_eq_right_of_det_ne_zero, Matrix.rank_of_det_ne_zero, Matrix.rank_mul_le_left, Matrix.rank_le_width and Cardinal.mk_eq_aleph0. Temporary diagnostics only instantiate these suppliers and normalize the concrete evaluator, conditional-measure, list, polynomial and moment definitions; they are not new durable suppliers. The controller maintains one active Unit state, emits left from that state, and preserves the state after replies. Its output and update functions take no old history or clock. Its causal acquisition adapter ignores the required history parameter. The environment interpreter stops immediately on a mark and represents terminal modes explicitly; its cap is a verification horizon, not a free controller clock. One fixed policy serves all horizons, and acquired records are prefix-consistent. Actual cost is the acquired reply-list length, including the marked query; C_N=min(N,tau) with tau=sup_N C_N. At every code index n (source m=n+1), the original-seed odd/odd zero-replay event at depth 2(n+1) is empty because all pulls are left, so lambda_n=0. The coefficient integrand is (1-q)^2*q^n/2, bounded between zero and one, integrable, and positive almost everywhere. Thus v_n>0. The actual extended cost is finite and its real mean is 2*I-1/2<=7/2. For every measurable waiting policy on that SAME source, 0<=lambda_n<=1, the correction series is absolutely summable, and every lambda_n*v_n is nonnegative. The actual mean formula gives mean(pi)>=mean(always-left). Finite I is discharged before using ordinary expectations; no two infinite quantities are subtracted. Under the SAME prior and root law, each fixed root-output convention has countably infinitely many actual positively reachable predictive profiles. Actual histories h_k are 2k left-zero acquisitions. Column j uses the same legal left test for 2j interactions and the full transcript event containing active readouts, left actions, zero replies, cost one for each query and halt=false. Its conditional probability is M_(k+j)/M_k under the original source. Every r-by-r actual matrix has rank r, and any factorization through d coordinates implies r<=d. r=0 is included; j=0 is the empty transcript event with mass one. No unrelated prior or abstract probability table is substituted. The singleton control solves the mean-cost direction task; it does not decode all test probabilities: actual profile rows 0 and 1 differ while its active state is identical. The final sentence is a scope qualification. Existence for a fixed prior, even with a finite integer hard-coded when applicable, does not provide an algorithm accepting arbitrary approximate prior representations or deciding whether Nstar is finite. No algorithmic impossibility is asserted. The parent universal theorem and general Nstar/sign-change claims are not settled by this coexistence witness.'
