    justification: "Upstream-only bind-only settlement under current CLAUDE 3.2; pinned Mathlib db584cd6d46c92f209a44c0f1c829460d327499d. No project GID is available for this exact arbitrary typed partial-writer substitution in the audited D5 interfaces; direct frozen dependencies are empty. H is independently the prefix-closed path readout/edge-label structure of Process 2.1, not an M-tree. Use CategoryTheory.Paths.liftNatTrans in Hom(X,Y)=X -> Option(List(tagged dependent edge events) × Y), with history-prefix functor p |-> (v |-> some([],p.comp v)) and component run(next,s,p). Its edge square unfolds one recursive run step. CategoryTheory.Functor.map_comp then gives run(next,s,u.comp v)=run(next,s,u).bind(fun (tr,t) => run(next,t,v).map(fun (tr',z) => (tr++tr',z))). Category/history-functor laws normalize with Option laws, List.append_assoc and Quiver.Path.comp_assoc; no desired intertwining conclusion is assumed in their fields. Define beta.read by mapping q over run and beta.label by prefix-run followed by next-edge label. Coordinate normalization gives sigma_u(beta(s))=beta(T_u(s)), including absence and ordered labels. The exact H.run_source is itself a supplied Paths.liftNatTrans specialization. The substitutions compile using only propext, Classical.choice and Quot.sound. No new Lean, finite I/alphabet/readout, decidability, computable enumeration, acquisition assumption or sink state is needed. Complete (b): in any reachable exact implementation take t |-> beta(t) into the residual subtype, transporting beta(s0)=h by equality. The one-edge beta equation proves preservation of initial state, root, two-sided legality, label and update. Residual witnesses prove surjectivity. Equal endpoints of legal arrival paths give equal residuals by behavior intertwining. For an arbitrary initial/update-preserving candidate, Paths.liftNatTrans forces its value at every reachable path endpoint, proving uniqueness. No such initial/update-only uniqueness is claimed off the reachable carrier. Setoid.quotientKerEquivRange on the tagged factor supplies the optional quotient/image presentation without finiteness. Cardinal.lift_mk_le_lift_mk_of_surjective supplies general cardinal minimality; Nat.card_le_card_of_surjective gives the finite tagged total bound. ControlledBehaviorUniversality and ReachableBehaviorMinimality are not used with false finite-source hypotheses. The source's total-version reference is attribution; the partial typed labeled adaptation is included above."
