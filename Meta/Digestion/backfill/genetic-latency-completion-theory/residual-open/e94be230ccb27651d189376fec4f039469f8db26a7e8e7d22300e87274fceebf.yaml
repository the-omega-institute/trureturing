  quarantine:
    justification: "At repository HEAD df917d01752f22da70e95c214184aaea1185c83d, the target CAS, selected Lean files and frozen-state membership were read. Carried: the first conjunct of D5/S3/ConceptDynamics/EmpiricalIdentifiability.empirical_identifiability is the equivalence between unique quotient factorization and constancy on all protocol-outcome fibers; its right-to-left implication carries the source clause about every target determined by the full target profile, with outcomes taken as that target family. D5/S3/ConceptDynamics/SufficiencyQuotient/TargetFamilyMinimalQuotient.target_family_minimal_quotient states unique descent of every target component through Quotient (Setoid.ker (jointReadout targets)), plus ker readout <= ker profile and ker readout <= ker projection, under its explicit sufficient hypothesis. Taking readout to be the joint profile supplies the component factors by coordinate evaluation; arbitrary readout sufficiency is not being claimed. D5/S3/ConceptDynamics/Experiment/FiniteInterventionExtraction.finite_intervention_extraction states that, for models Fin n and a supplied family separating every target-distinct pair, there is a finite selected intervention set retaining that separation. This carries the generic finite-extraction clause at that stated carrier, not an unverified encoding of every genetic experiment. Uncarried: the actual state comparisons x_aa R0 x_ab and not (x_ab R0 x_bb); x_aa R0 x_ab and not (x_aa RS x_ab); x_aa RS x_ab and not (x_aa RT x_ab); and x_aa RT x_ab and not (x_ab RT x_bb). The selected statements contain no source realization rho, current-language/process/target comparison bridge, or assumptions yielding these particular outcomes. They also do not establish that the source's three kernels are nested from the seven arbitrary data items alone. Scope gap: quotient universality and conditional finite separation describe what follows from profile agreement and separation premises, not which alleles agree in a given context. More fundamentally, if the source's '则' is read as a conjunction for one fixed dataset, it asserts both RS-equivalence and its negation, and both RT-equivalence and its negation, for the same aa/ab pair. No sound unconditional theorem can carry that reading. Treating the four headings as alternative classification definitions needs an explicit source correction, not a silent reinterpretation. Actual near-miss retrieval used `rg -n -i 'digest:.*(genetic|dominance|latent|recessive)|theorem (empirical_identifiability|target_family_minimal_quotient|finite_intervention_extraction|fixed_observation_dominance_asymmetric|experimental_quotient_characterization)' D5/ -g '*.lean'`. The opened D5/S3/ConceptDynamics/RefinementGeometry/FixedObservationDominanceAsymmetry.fixed_observation_dominance_asymmetric defines dominates from one fixed joint profile of realized Sym2 genotypes, but concludes dominates a b -> not (dominates b a), not dominates a b itself or any RS/RT assertions. The opened D5/S3/ConceptDynamics/InterventionLaws/ExperimentalQuotientCharacterization.experimental_quotient_characterization specializes quotient facts to List Action experiment traces and likewise supplies no genetic-state classification. Same-source absorbed-closed sibling 2c7390cd3a211e269ccc1c562573630928b765c5642758fb3b552350c3b77ad2 was read in full; its displayed implication is a dominance-asymmetry assertion and its exact proof sentence is '前者给出 ab 与 bb 不等价；后者却要求二者等价，矛盾。证毕。'. Its coverage_gids names FixedObservationDominanceAsymmetry.fixed_observation_dominance_asymmetric. The contradiction there is between an assumed dominance and an assumed reverse dominance, used to prove a conditional negation; here the uncorrected text itself places opposite RS and RT assertions after the same '则'. ASSUMED-UNVERIFIED: no compiler, kernel, axiom-closure or Scribe execution was run; the profile-setoid transport, finite-model reindexing, possible heterogeneous-response encoding and genetic instantiations were not elaborated; no exhaustive external search was performed. The guard therefore preserves the valid generic quotient/extraction clauses without promoting the incompatible state clauses."
    reentry_condition: "First append a source erratum specifying that the four headings are alternative classifications, or give separate explicitly scoped datasets and hypotheses for each heading. The unchanged conjunctive CAS has no sound theorem that could close it. For the corrected source, provide a frozen D5 or pinned-library bridge with an independently defined genotype realization, a typed monoid action, current and target observation families, and their joint profiles P0, PS and PT. Establish R0 = ker P0, RS = ker PS, RT = ker PT, and prove RT <= RS <= R0 from explicit observation-inclusion/determination hypotheses justified by that source. State the four corrected classification equivalences exactly: current dominance iff R0(aa,ab) and not R0(ab,bb); dynamic reveal iff R0(aa,ab) and not RS(aa,ab); target reveal iff RS(aa,ab) and not RT(aa,ab); completed dominance iff RT(aa,ab) and not RT(ab,bb). Do not assert their simultaneous existence from arbitrary data. Prove that the PT-kernel quotient agrees with the empirical quotient of the target family, then apply the first-conjunct equivalence of D5/S3/ConceptDynamics/EmpiricalIdentifiability.empirical_identifiability to every fiber-constant property, and D5/S3/ConceptDynamics/SufficiencyQuotient/TargetFamilyMinimalQuotient.target_family_minimal_quotient to the joint profile using coordinate factors. For finite candidate models, supply a reindexing by Fin n, the experiment-readout encoding, and the exact separation hypothesis, then apply D5/S3/ConceptDynamics/Experiment/FiniteInterventionExtraction.finite_intervention_extraction and transport the selected family back. Reentry requires the resulting public statements to cover the corrected atom clause by clause; source correction and generic owner composition alone must not be reported as a proof of the unchanged contradictory atom."
    blocker_class: multi-clause-guard
