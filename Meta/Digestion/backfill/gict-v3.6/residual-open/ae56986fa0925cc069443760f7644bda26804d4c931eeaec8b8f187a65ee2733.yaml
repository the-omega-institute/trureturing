  quarantine:
    justification: 'The whole theorem is only partially supported: frozen D5 owners `GoldenContinuedFraction.golden_ratio_continued_fraction`, `BinarySimplestTail`, `RationalSpectrum`, `GoldenHyperbolicAxis`, `GoldenModularStandardPair`, `GoldenJonesMatching`, `CyclicWindowRevival`, `GoldenRevivalScore`, and `RevivalSpectrum` supply isolated continued-fraction, matrix, cyclic-revival, and golden-limit clauses, but no public owner constructs the two source window families and jointly proves their update, center, finite-tower, clock, K0, pricing, register, revival, and classification columns; moreover, the words `候查件升证书` are a status annotation rather than a mathematical proposition. Retrieval receipts: D5 search `Sturmian|unique trace|Gleason|double tower|continued.fraction|golden_ratio_continued_fraction|hyperbolic.*trace|trace.*hyperbolic|revival` over `D5/S0`, `D5/S1`, and `D5/S3` found the listed partial owners and missed the whole table and its required bridges. Pinned Mathlib search `Effros.Shen|Sturmian|unique trace|crossed product|Gleason|continued fraction|terminates_iff_rat` found generic continued-fraction infrastructure and `GenContFract.terminates_iff_rat`, while the Gleason hits concern topology and Haar measure; it missed the combined operator-algebra, tower, K-theory, trace-pricing, and register result. A17 GitHub Lean code searches for `EffrosShen` and `Sturmian` exited 0 with respectively no hits and unrelated hits, with no reusable whole-statement theorem. The local proof assessment could apply the isolated frozen facts but could not connect them on the source carriers; completing every public clause would require assuming the absent cross-mechanism bridges or defining a table record by its target fields, contrary to whole-statement and non-hollowness rules.'
    reentry_condition: Construct canonical Lean carriers for both source window families and prove the public bridges among their update dynamics, crossed-product centers, finite towers, clocks, K0 groups, pricing laws, register decompositions, and revival laws; then state a mathematical replacement for the status-marked readout-certificate clause.
    blocker_class: multi-clause-guard
