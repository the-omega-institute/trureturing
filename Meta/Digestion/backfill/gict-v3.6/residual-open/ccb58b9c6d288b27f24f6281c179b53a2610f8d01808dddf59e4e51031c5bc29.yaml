    justification: "Whole-atom multi-clause guard after immediate source-scope review, D5 and pinned-library retrieval, ecosystem attempt, and local encoding assessment. Definition 3.2 immediately defines the golden word as `s_n`, but Theorem 3.4 instead forms `P_T(z) = sum_{n <= T} f_n z^n` with an undefined sequence `f_n`; the source supplies no equation identifying `f_n` with `s_n` or any other carrier. The clauses also leave the meanings and quantifiers of the finite peak relation `~ T*sinc`, `Bragg direction`, `non-Bragg direction`, `zero-free arc exactly one mean spacing`, and the normalization of `1 - O(log T/T)` unstated. D5 searches `Bragg|Denjoy|Koksma|zero.free arc|Sturmian.*exponential|finite.*diffraction` found only partial canonical owners in S3/Fourier/WindowDiffraction, S3/Fourier/WindowDiffractionExtinction, and golden-word/model-set/three-gap families; they provide diffraction coefficients, extinction, cut-and-project, and spacing facts but no finite polynomial theorem with all four clauses. Pinned Mathlib searches found irrational circle-rotation/ergodicity and polynomial Bernstein infrastructure, but no Denjoy-Koksma inequality, finite Sturmian exponential-sum `O(log T)` theorem, or zero-free-arc theorem; all other pinned packages missed. A17 grep.app Lean-code searches were attempted but returned a Vercel security checkpoint, so ecosystem retrieval is recorded as wait-for-capability. The local proof attempt stops before elaboration: no faithful Lean goal can be authored without inventing the undefined coefficients, Bragg/non-Bragg quantifiers, arc normalization, and exact asymptotic predicates, and substituting the nearby `s_n` by guess would violate carrier fidelity. The source's fuller discussion elsewhere gives only asymptotic convergence and numerical evidence, not an in-scope definition that repairs this atom. Clause (d) and the width `6.182` certificate are empirical remarks outside theorem coverage."
    reentry_condition: "Define the coefficient sequence `f_n` in the theorem's source scope, bind every asymptotic variable and limit regime, define Bragg and non-Bragg directions and the unit-circle arc metric/mean-spacing normalization, separate the empirical sharpness observations from the theorem, and provide a frozen Denjoy-Koksma/Bernstein bridge proving the four resulting public clauses on that exact carrier."
    blocker_class: multi-clause-guard
