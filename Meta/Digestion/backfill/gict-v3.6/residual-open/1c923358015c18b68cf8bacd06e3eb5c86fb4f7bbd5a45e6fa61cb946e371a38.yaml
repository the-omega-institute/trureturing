  quarantine:
    justification: "The whole theorem is only partially supported: frozen D5 owners `AllPrimeRegisterExactSequence.all_prime_register_short_exact`, `GoldenGaloisScalarCompletion.golden_galois_scalar_completion`, and `ReflectionFixedPointContrast.reflection_mirror_fixed_locus_contrast` respectively supply the all-prime profinite kernel, golden conjugation fixed scalars, and the reflection/mirror fixed loci, but no public owner connects mod-5 folding to that kernel, defines or proves the stated information-conservation/localizability contrast, states that the solenoid cannot recover zeta-annihilated information, or constructs the complexified tower whose branch orthogonality and product cancellation jointly hide the fiber. Retrieval receipts: D5 searches `profinite|solenoid|p-adic|prime.?fiber|critical.?line|zeta.*zero|involution|fixed.?line|branch.?orthogon|product.?cancel|information.*conserv|localiz` found the three partial owners plus generic zero symmetry and prime-adic decomposition, while body-shape searches `mod.*5.*profinite|profinite.*mod.*5|solenoid.*zeta|zeta.*solenoid|branch.*orthogon|fractional.*frequenc` missed every required bridge. Pinned Mathlib searches `solenoid|profinite integers|pontryagin.*rat|riemann.*zeta|critical line|reflection.*fixed|branch.*orthogon|product.*cancel` found `riemannZetaZeros`, the functional equation, and the unproved proposition `RiemannHypothesis`, but no solenoid, cross-mechanism bridge, tower, or cancellation result. A17 GitHub Lean code searches for `profinite solenoid`, `branch orthogonality`, `zeta critical line`, and `p-adic solenoid` returned zero hits. The local probe `/private/tmp/w72a13-atom2-probe.lean` exited 0 and directly compiled all three available frozen components; completing the remaining public clauses would require inventing undefined information predicates or assuming the missing tower and zeta bridges, violating whole-statement and non-hollowness rules."
    reentry_condition: "Define the source's mod-5 folding and conserved/localizable information semantics, construct the complexified solenoid tower and its branch decomposition, and prove public bridges from folding to its profinite kernel and from zeta multiplication to the critical-line hidden fiber, including the stated orthogonality and product-cancellation mechanism."
    blocker_class: multi-clause-guard
