  quarantine:
    justification: "Whole-theorem coverage is split and incomplete. Clause matrix: C1 `zeta(beta)/zeta(k*beta)` arithmetic occupation-capping ladder is uncovered; frozen `D5/S3/Quantum/FockSpace/FiniteOccupationPartitionFunctions` proves finite abstract bounded-occupation product identities but no zeta quotient or arithmetic ladder. C2a adjacent-exclusion k-bonacci combinatorics is carried exactly by `D5/S0/Tower/DBonacci/Names.dbonacci_name_card`; C2b `lambda_k -> 2` is carried exactly by `D5/S0/Tower/DBonacci/PerronRoot.dbonacciPerronRoot_tendsto_two`; C2c `2 - lambda_k ~ 2^(-k)` is uncovered, while `D5/S0/Tower/DBonacci/PerronRoot.two_sub_dbonacciPerronRoot_eq_inv_pow` carries only the exact identity `2 - lambda_k = lambda_k^(-k)` and the elaboration probe `/private/tmp/w73a34-rate-attempt-elaboration.log` exited 2 at the remaining ratio-limit goal; C2d the seven-level and `n=15` progressive count certificates are uncovered. C3a capped `m` colours with nearest-neighbour exclusion, its recurrence, and characteristic polynomial `lambda^2 = lambda + m` are carried by `D5/S1/Eigenstructure/MixedExclusionSpectrum.mixed_exclusion_recurrence_and_two_color_spectrum`; C3b the `m=1` golden specialization has partial exact ingredients in that owner and `D5/S0/Tower/DBonacci/PerronRoot.dbonacciPerronRoot_two_eq_goldenRatio`, but no public bridge identifies the two carriers; C3c the Rydberg-blockade dictionary is uncovered; C3d `m=2` has the same entropy as free binary while being nonconjugate is uncovered; C3e `trace(M^n)-2^n=(-1)^n` for positive periods and C3f spectrum `{2,-1,0}` are carried by the MixedExclusion owner; C3g the eight-level exact certificate is uncovered. C4a exclusion-growth rate equals constrained-channel Shannon capacity, C4b golden-window `RLL(1,infinity)` capacity, C4c `RLL(2,7)` capacity, and C4d the algebraic `K0` / statistical partition / coding-capacity triple identity are uncovered. C5 `D^2+V^2=1` for normalized pure records is carried by `D5/S3/Quantum/PureState/RecordCoherenceComplementarity.pure_record_distinguishability_coherence_complementarity`. The exchange-sign/spin-statistics sentence is a scope annotation saying the QFT bridge is absent, not a proved mathematical clause. The separately paragraphed wall after Theorem 6.50 is a repository/status-layer annotation outside the named theorem and is not a mathematical clause. Retrieval included the required D5/S3 query `kbonacci|MixedExclusion|lambda_k|2 - lambda|goldenLadder|capped`, full reads of the carrying modules, and searches for zeta capping, RLL/Shannon capacity, Rydberg, nonconjugacy, entropy, count certificates, and the three-way bridge. Because quarantine cannot coexist with nonempty `coverage_gids`, the carrying GIDs are recorded here and `coverage_gids` remains empty rather than overstating whole-atom absorption."
    reentry_condition: "Freeze public theorems for the arithmetic zeta capping ladder, the seven-level/`n=15` certificates, the asymptotic ratio `(2-lambda_k)/2^(-k) -> 1`, the mixed-to-golden and Rydberg bridges, `m=2` entropy equality plus nonconjugacy and eight-level certificate, the constrained-channel/RLL capacity equalities, and the algebra/statistics/coding triple identity; then assemble them with the six named frozen carrier theorems into one public whole-statement theorem."
    blocker_class: multi-clause-guard
