    justification: "Retrieval preceded quarantine. D5 queries `Bunce-Deddens|crossed product|KTheory|UHF|maximal abelian|QPE|matrix tensor` found only partial finite-window owners: `CovariantCommutator.window_two_covariant_commutator_witness` proves address read/update noncommutation, `WindowGeneration.window_generated_full_matrix_and_prime_power_factors` and `PrimePowerTensorTower.prime_power_tensor_factor_decomposition` prove the finite full-matrix and prime-power tensor clauses, and `RecordFixedCenter.record_fixed_center_eq_block_scalars` proves a different finite direct-product center. No D5 declaration constructs `C(Sigma_S) crossedProduct_tau Z`, Bunce-Deddens fibers, the three infinite subalgebras and conditional expectations, operator K-groups, or their comparison map. Pinned Mathlib queries `Bunce-Deddens|CrossedProduct|crossed product|KTheory|K-theory|UHF|maximal abelian|MASA|quantum phase estimation|QPE` found no relevant operator-algebra declaration; its only `K-theory` text hit is an unrelated quadratic-form comment. All Lake-resolved non-Mathlib packages were searched for the same terms and exited 1. External GitHub Lean searches for `Bunce Deddens`, `CStar crossed product`, and `operator K-theory` each returned HTTP 401, so that external capability is `wait-for-capability`. The local proof attempt can assemble the frozen finite window clauses but stops because the crossed-product C-star algebra, its continuous-field/Bunce-Deddens identification, and operator K-theory functors are absent. Independently, the public clause `QPE = binary tower's algorithmic incarnation` has no in-scope definition of QPE, incarnation, or an equivalence relation, so inventing one would be definitional substitution; a finite-only deposit would leave most named clauses uncovered."
