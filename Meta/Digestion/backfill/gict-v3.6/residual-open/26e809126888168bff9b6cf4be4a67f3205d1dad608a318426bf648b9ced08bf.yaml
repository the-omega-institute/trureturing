  quarantine:
    justification: 'Whole-atom coverage is partial. Publicly covered clauses are: finite Fourier matrix units by `MatrixUnitCertificate.matrix_unit_eq_single`, `matrix_unit_mul`, and `matrix_units_sum_diagonal`; finite-window full-matrix generation and prime-power factorization by `WindowGeneration.window_generators_adjoin_top` and `window_generated_full_matrix_and_prime_power_factors`; and `U^M = z * 1` by `CentralWinding.winding_shift_pow_card` with `windingPhaseObservable` as the scalar phase field. Publicly uncovered clauses are: matrix units globally in a Bunce-Deddens algebra and the canonical UHF inclusion; the general wrap decomposition `U = sum E_(r+1,r) + E_(0,M-1) U^M`; exact defect operator norm `1`; exact normalized p-norm `M^(-1/p)`; and the faithful determinant-winding/K1 receipt. The source phrases `measure is free, topology is priceless`, `forgetting the winding pole equals observer-topology coarsening`, and `p = infinity is the unique ledger keeper` are non-propositional because no in-scope carrier defines their comparisons or uniqueness. Retrieval receipts: D5 queries `CentralWinding|MatrixUnitCertificate|WindowGeneration` found exactly the three partial owners; `Bunce|Deddens|UHF|inductive[ -]?limit|direct[ -]?limit`, shift/matrix-unit/wrap-decomposition patterns, norm patterns, and `K1|windingNumber|det.*wind` missed the required carriers and bridges. Pinned Mathlib queries for Bunce-Deddens/UHF, Schatten norms, winding-number APIs, literal KTheory, C-star limits, and determinant-winding links missed exact support. Reachable GitHub Lean repository searches for Bunce-Deddens, uniformly hyperfinite, Schatten norm, operator K-theory, and winding number returned zero repositories; grep.app code search returned HTTP 429 and is recorded as `wait-for-capability`. The corrected local probe `/private/tmp/w73a22-owner-composition.lean` exited 0 for precisely the finite matrix-unit, window-generation, and winding-power fragments, and could not proceed on the other clauses without inventing absent BD/UHF, defect-norm, topology, or K1 semantics.'
    reentry_condition: Expose canonical Bunce-Deddens and UHF carriers with their inclusion and global matrix units, prove the general wrap decomposition, define the source defect and its operator and normalized p-norms, and provide a faithful determinant-winding/K1 bridge; separately, the source must supply formal carriers for the three qualitative phrases or move them outside the named theorem.
    blocker_class: multi-clause-guard
