    justification: Retrieval preceded quarantine. D5 queries `blockwise|direct sum|mutually unbiased|MUB|pinching|entropy chain|Maassen|Uffink` found the canonical `D5/S3/Quantum/Tomography/MutuallyUnbiasedDiagonalPlanes.mutually_unbiased_diagonal_planes`, `D5/S3/Quantum/Divergence/VonNeumannEntropyPinching.von_neumann_entropy_pinching`, and finite entropy chain/mixture declarations, but no per-block MUB von Neumann entropy uncertainty theorem; the pinching module digest explicitly records entropy monotonicity, data processing, MUB collapse, and Maassen-Uffink bounds as not covered, while `PinchingIncreasesEntropy` requires an explicit relative-entropy nonnegativity premise and proves it only in dimension one. Pinned Mathlib queries `mutually unbiased|Maassen|Uffink|entropic uncertainty|pinching entropy|von Neumann entropy` exited 1 with no hit. All Lake-resolved non-Mathlib packages were searched for the same terms and exited 1. External GitHub Lean code search was attempted for `Maassen Uffink`, `mutually unbiased entropy`, and `vonNeumannEntropy pinching`, but each request returned HTTP 401, so that external capability is `wait-for-capability`. The local proof decomposition can derive the canonical MUB pinching-composition identity and the classical central entropy-chain aggregation, but stops at the absent general lemma `S(P_Z rho) + S(P_X rho) >= log d + S(rho)` on `DensityState (Fin d)`; assuming that inequality would replace rather than prove the atom's hard quantum clause.
    reentry_condition: Expose and freeze the general finite-dimensional MUB pinching entropy uncertainty theorem on the canonical `RankOneContext`, `DensityState`, `basisMeasurement`, and `vonNeumannEntropy` objects, including the hypotheses needed to turn measured Hermitian matrices back into density states; then aggregate it over finite central blocks and state equality supportwise (`p i != 0`) or supply a source-authorized full-support hypothesis, since zero-weight blocks cannot be forced to saturate by global equality.
