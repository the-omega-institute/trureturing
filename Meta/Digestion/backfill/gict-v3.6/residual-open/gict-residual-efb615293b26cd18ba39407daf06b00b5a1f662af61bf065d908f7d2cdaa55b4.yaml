    justification: "The whole theorem requires a canonical golden tiling hull, its first Cech cohomology computation, the K0 group and trace of the associated crossed-product C-star algebra, and bridges identifying that trace range with both Bragg frequencies and spectral gap labels. Retrieval receipts: D5 searches `gap.?label|bragg|trace.?image|trace.?range|frequency.?module|cohomolog|anderson|putnam|hull|diffraction|spectral.?gap` found the golden coordinate ring, model-set lattice, and window Fourier amplitude but missed every required hull, K0-trace, and Bragg/gap-label owner; frozen-owner searches `GapLabeling|Bragg|Cohomolog|TraceImage|TraceRange|FrequencyModule` missed. Pinned Mathlib searches `KTheory|K-Theory|Grothendieck.*group|CStar.*K|projection.*monoid|Murray.*von Neumann` and `Cech.*cohom|Anderson.*Putnam|tiling.*cohom|hull.*cohom|gap.*label|bragg` found generic Grothendieck groups, C-star projections, and Cech complexes but no operator K-theory, tiling-hull computation, or gap-labeling theorem. A17 GitHub Lean code searches for `gap labeling`, `Bragg`, `KTheory CStar`, and `Anderson Putnam` returned no hits. The local Lean probe `/private/tmp/w72a13-atom1-probe.lean` exited 0 for the available golden embedding and lattice-range facts and generic APIs, but no honest term can connect them to the absent hull and K0 objects; postulating those bridges would place the atom's conclusions in hypotheses."
    reentry_condition: "Add canonical definitions of the golden tiling hull and associated crossed-product C-star algebra, prove its first Cech cohomology is Z squared, construct operator K0 with its induced trace, and prove the Bellissard and Bragg identifications of that trace range."
    blocker_class: missing-prerequisite
