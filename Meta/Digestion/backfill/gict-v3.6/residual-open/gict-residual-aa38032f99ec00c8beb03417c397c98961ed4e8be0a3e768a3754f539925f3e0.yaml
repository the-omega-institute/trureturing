    justification: "The named theorem requires a canonical completed-zeta Hessenberg-Toeplitz operator, its characteristic-polynomial coefficient identity, a spectral-accumulation criterion in terms of the two least-modulus roots, an origin-window predicate equivalent to RiemannHypothesis, a boundary-channel consequence of disk zero-freedom, and an off-line-zero intrusion theorem that recovers the intruder modulus. Retrieval receipts: D5 searches `hessenberg|toeplitz|origin.?window|two.*minimal.*modul|minimal.*root|spectral.*accumul|characteristic.*polynomial.*coefficient|window.*intrud|jacobi.*depth` and body shapes `xiReading|origin.*window|small.*lambda|boundary.*channel|off.?line.*zero.*modul` found the canonical `CompletedZeta.xiReading`, generic charpoly modules, and unrelated Toeplitz/Jacobi families, but no source operator or any required spectral/window bridge. Pinned Mathlib searches `hessenberg|toeplitz|characteristic polynomial|power series.*inverse|minimal.*root|root.*modulus|spectral accumulation|riemann hypothesis` found `Matrix.charpoly`, `Matrix.mem_spectrum_iff_isRoot_charpoly`, `PowerSeries.coeff_inv`, and the unproved proposition `RiemannHypothesis`, but no Hessenberg construction, minimal-root asymptotics, or RH window criterion. A17 GitHub Lean code searches for `Hessenberg Toeplitz`, `spectral accumulation`, `minimal modulus roots`, and `RiemannHypothesis Hessenberg` returned zero hits. The local probe `/private/tmp/w72a13-atom3-probe.lean` exited 0 for the canonical xi reflection, generic matrix-spectrum/charpoly equivalence, inverse-series coefficients, and zeta APIs, but there is no honest term for any public theorem clause without first constructing and proving the absent operator and spectral bridges. The numerical injection results and detector price table are empirical certificate remarks outside the named theorem, and the wall is a status annotation."
    reentry_condition: "Construct the canonical xi-centered Hessenberg-Toeplitz finite sections and origin-window predicate, then prove the determinant/coefficient identity, the equal-minimal-root spectral accumulation criterion, both directions of the RH window equivalence, the zero-free boundary-channel consequence, and the off-line intrusion/modulus-recovery theorem."
