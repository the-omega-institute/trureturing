    justification: "Retrieval preceded quarantine. D5 name/body-shape queries `monodromy|profinite.*completion|fundamental.*group|simply.*connected|covering.*trivial|winding.*number|pole.*winding|branch.*address|global.*gauge|projection.ker|hidden.*fiber` found partial owners only: `D5/S1/Solenoid/ExactSequence.congruence_solenoid_short_exact` identifies compatible congruence data with the universal-solenoid projection kernel, and `D5/S1/Solenoid/StreamlineDecomposition.existsUnique_normalized_streamline` gives one normalized lift plus a constant hidden offset for real paths; no D5 theorem constructs the source root tower over the critical-strip image or identifies its monodromy generator, critical-line traversal, pole winding, profinite fiber, and infinity readout in one public statement. Pinned Mathlib searches `IsSimplyConnected|exists_continuousOn_pow_eq|exists_continuousOn_eqOn_exp_comp|existsUnique_continuousMap_lifts|monodromy|fundamentalGroup.*circle|windingNumber|root.*tower|inverse.*limit.*root` found exact partial hits `Complex.exists_continuousOn_eqOn_exp_comp`, `Complex.exists_continuousOn_pow_eq`, and `IsCoveringMap.existsUnique_continuousMap_lifts`, but no inverse-limit root tower, punctured-plane winding classification, profinite completion bridge, critical-line loop comparison, or point-at-infinity readout. Reachable GitHub Lean searches `monodromy SimplyConnectedSpace`, `profinite completion winding`, `root tower`, `fundamental group circle`, and `exists_continuousOn_pow_eq` found the partial `deancureton/sphere-six-complex` punctured-complex fundamental-group and integer-circle winding bridge at immutable head `9d84af84f1ec2d0db76edb53b29bef235ec56af9`; it depends on Lean 4.34.0-rc1 and a Mathlib fork `97d303eb50436be7c4bac4388bdb49459ae9140b`, unlike this repository's Lean 4.31.0 and Mathlib `fabf563a7c95a166b8d7b6efca11c8b4dc9d911f`, and still lacks the root-tower/profinite and critical-line/infinity clauses. Local probe `/private/tmp/w72b19-atom5-probe.lean` imported and elaborated all D5 and Mathlib partial prerequisites, then exited 1 with unknown identifiers for `criticalStripRootTowerTrivialization`, `poleWindingGenerator_eq_criticalLineTraversal`, `rootTowerHiddenFiberEquivProfiniteIntegers`, and `rootTowerReadoutAtInfinity`; defining any of these bridges as its own target would violate the definitional-substitution ban."
    reentry_condition: "Construct the canonical inverse-limit root-cover tower over the source critical-strip image, prove normalized global trivialization from its simply connected zero-and-infinity-free image, identify the pole loop and full critical-line traversal with the same integer monodromy generator, prove the tower fiber is canonically equivalent to the profinite completion of that winding group, and define and verify the source readout at the compactification point infinity."
