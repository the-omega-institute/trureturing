  quarantine:
    justification: Retrieval preceded quarantine. The named theorem needs the onsite Fibonacci tight-binding Hamiltonian on the source hull, a spectral-gap predicate for that operator, an integrated density of states constructed from spectral projections, the hull C*-algebra K0 trace image `Z + Z*phi`, and the Bellissard bridge sending gap IDS values into that image modulo one. D5 searches `gap.?label|IntegratedDensityOfStates|IsSpectralGap|GapLabel(Group|ing)?|FibonacciHamiltonian|tightBinding|onsitePotential|densityOfStates|spectralProjection.*trace|K0.*trace` hit the canonical golden mechanical word and unrelated finite DBonacci combinatorial gap labels, but missed every operator/IDS/K0 bridge owner. Pinned Mathlib searches hit abstract `spectrum`, self-adjoint C*-spectrum facts, and continuous functional calculus, but missed integrated density of states, quasiperiodic/tight-binding Hamiltonians, operator-algebra K-theory trace images, and gap labeling. A17 GitHub Lean searches for `gap labeling`, `integrated density of states`, `Fibonacci Hamiltonian`, and `quasicrystal Lean theorem prover` returned no candidate. Local probe `/private/tmp/w72d20-atom3-probe.lean` resolved the golden word and abstract spectrum APIs, then exited 1 on unknown identifiers `FibonacciTightBindingHamiltonian`, `IntegratedDensityOfStates`, `fibonacci_hull_k0_trace_range`, and `fibonacci_gap_labeling`; assuming any of these as a premise would hollow out the theorem. The source's N=3000 nine-of-nine/error-band/run-157 certificate is an empirical remark outside the named theorem.
    reentry_condition: Provide frozen D5 or A17-admissible constructions of the Fibonacci onsite tight-binding operator and its IDS, together with the hull C*-algebra K0 trace-range computation and a gap-labeling theorem proving that every spectral-gap IDS lies in `Z + Z*phi` modulo one; then instantiate that theorem on the canonical golden word.
    blocker_class: missing-prerequisite
