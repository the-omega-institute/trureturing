  quarantine:
    justification: "Retrieval preceded quarantine. D5 search (MonoidHom or AddMonoidHom on Rat, adele, Pontryagin, solenoid, quasi-character, zero thread, critical unitary) found UniversalSolenoid, SolenoidCharacter.continuous_solenoid_characters_are_rational, CharacterCompletionDuality.character_completion_duality, and OfflineZeroCharacter.offline_zero_character_unitary_iff, but no additive equivalence from the rational adele quotient to UniversalSolenoid, no classification of rational complex quasi-characters as a real radial exponent times that quotient, and no public whole-statement theorem connecting every zeta-zero thread to those characters. Pinned Mathlib search in .lake/packages/mathlib (AdeleRing, principalSubgroup, PontryaginDual Rat, rational character, quotient AdeleRing) and live Loogle/LeanSearch queries found NumberField.AdeleRing, NumberField.AdeleRing.principalSubgroup, general PontryaginDual infrastructure, and unrelated finite or p-adic character results, but no adelic-quotient/solenoid equivalence or rational quasi-character classification. Third-party GitHub Lean code searches (AdeleRing.principalSubgroup, UniversalSolenoid, IsoAdeleDual, PontryaginDuality Adele) found DawidLipin/Project_Tate_Thesis at commit 3ee6c0354aab553192b6c8dc3b3be1b82d5415f5; its IsoAdeleDual file explicitly says work in progress and contains sorry in the required surjectivity/closed-range bridge, and its Lean v4.7.0-rc2 plus mathlib eaede86 differs from this repository's v4.31.0 plus mathlib fabf563, so it supplies no admissible exact theorem. Local proof attempt /private/tmp/w72d19-active-probe.lean typechecked the carrier NumberField.AdeleRing Z Rat modulo NumberField.AdeleRing.principalSubgroup Z Rat, then exact? failed to close an AddEquiv to UniversalSolenoid."
    reentry_condition: "A frozen D5 or admissible sorry-free upstream development supplies the canonical additive equivalence between NumberField.AdeleRing Z Rat modulo its principal subgroup and UniversalSolenoid, the full rational-to-nonzero-complex quasi-character decomposition with real exponent and unitary phase, and the public bridge identifying zeta-zero threads and their conserved charge with those canonical characters."
