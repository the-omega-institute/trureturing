d/ComplexPowerSolenoidDecomposition:187 complexPowerThreadEquiv plus logarithmic_charge_conservation and phaseSolenoid. These now carry the complex-thread radial/phase decomposition and must be reused. Pinned Mathlib db584cd6d46c92f209a44c0f1c829460d327499d searches (principalSubgroup, strongApprox, fractionalPart, addChar, adele character; exit 0) found AdeleRing/principalSubgroup, PadicInt.toZModPow and local integer-domain character APIs, but no global quotient identification. Live Loogle AdeleRing and LeanSearch adele-quotient/solenoid queries returned generic APIs (HTTP exit 0). GitHub searches AdeleRing.principalSubgroup, UniversalSolenoid, IsoAdeleDual, PontryaginDuality Adele and Padic toAddCircle (exit 0) yielded no new exact owner. Tate HEAD remains 3ee6c0354aab553192b6c8dc3b3be1b82d5415f5; IsoAdeleDual.lean:179,185 still has sorry in dense/closed range feeding LocalHatIsoAdd:214; Lean v4.7.0-rc2/mathlib eaede86aa7777630a3826cd8f3fbf0cbaafa53e6, license=null in repository metadata and no LICENSE in its tree, so reuse permission is unverified. Substantive local construction /private/tmp/consensus-rnd/sshx/w73c47/attempt-1/atom2-probe.lean (final exit 1; adjacent log) constructs chi(1/m) as the canonical ComplexPowerThread, applies the frozen charge conservation and polar map, constructs p-adic residue circle phases and proves their additive/natural-value laws, and applies the frozen ExactSequence.residueCircle_cast_mul owner to prove chart compatibility. Its one unsolved goal is: \u22a2 \u2203 psi, Continuous \u21d1psi \u2227 \u2200 (k : \u2115) (x : \u2124_[p]), psi (\u2191x / \u2191p ^ k) = (residuePhase p k) x; here psi : \u211a_[p] \u2192+ AddCircle (1 : \u211d). The successfully printed declarations have exactly [propext, Classical.choice, Quot.sound]. Scoping: the full prerequisite still requires continuous local-field character gluing, transport to the valuation-completion carrier, restricted-product phase assembly with principal-rational cancellation, and an exact-kernel/surjectivity proof; a feasible first slice is the canonical local-field character extending these compatible residue charts, consumed by the later adelic pairing."
