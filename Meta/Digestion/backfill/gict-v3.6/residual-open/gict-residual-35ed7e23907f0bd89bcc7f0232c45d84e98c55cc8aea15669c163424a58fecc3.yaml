  quarantine:
    justification: "The whole theorem is only partially supported. Frozen D5 owners `GoldenArcFirstReturn.golden_arc_first_return_gap_set_encard_eq_two`, `GoldenCubePeriodsInternal.golden_adjacent_gap_is_fib`, and `RevivalSpectrum.fibonacci_return_ratio_tendsto` prove that every positive golden rotation-gap cylinder has exactly two first-return times, each adjacent golden occurrence gap is some Fibonacci number, and consecutive Fibonacci ratios tend to the golden ratio. They do not prove that the two return values for each cylinder are consecutive Fibonacci numbers on one common index, and no canonical golden finite-layer algebra realizes the direct sum of the two stated full matrix blocks or connects it to the cyclic winding-clock replacement. Retrieval receipts: D5 searches `two.?tower|Fibonacci.*return|return.*Fibonacci|return.?time|Sturmian|Kakutani|three.?gap|Bratteli|matrix.*Fibonacci|consecutive.*Fibonacci` found the three partial owners, golden return-word exactness, and the three-gap port; body-shape searches `Matrix.*Nat.fib|DirectSum.*fib|finite.*layer.*fib|encard.*2.*fib|first.?return.*consecutive` missed the required algebra and consecutive-pair theorem. Pinned Mathlib searches `Sturmian|Fibonacci.*return|return.*Fibonacci|two.?tower|Kakutani|Bratteli|Effros.?Shen|three.?gap` found only ordinary Fibonacci identities, `tendsto_fib_succ_div_fib_atTop`, and unrelated Riesz-Markov-Kakutani material; generic matrix block-diagonal APIs do not construct the source tower. A17 GitHub Lean code searches for `Fibonacci return words`, `two tower Fibonacci`, `Sturmian return time`, `Effros Shen`, and `Bratteli Fibonacci` returned zero hits. The local probe `/private/tmp/w72a13-atom5-probe.lean` exited 0 and directly compiled the three partial owners. Defining the finite layer to be the desired matrix product would install the conclusion by definition and violate the definitional-substitution ban. The `{13,21}` numerical frequency certificate is an empirical remark outside the named theorem."
    reentry_condition: "Construct the canonical finite golden branch from its Zeckendorf/adic dynamics, prove its finite algebra decomposes into the two Fibonacci-sized full matrix blocks, prove each cylinder's two return times are one consecutive Fibonacci pair with the stated frequency law, and connect that double clock publicly to the cyclic winding and three-distance constructions."
    blocker_class: multi-clause-guard
