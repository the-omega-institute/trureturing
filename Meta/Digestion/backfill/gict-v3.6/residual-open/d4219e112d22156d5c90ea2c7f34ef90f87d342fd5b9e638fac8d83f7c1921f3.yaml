    justification: "The whole theorem is only partially supported. Frozen D5 owners `LocalDeterministicCHSHSeparation.local_deterministic_chsh_separation`, `ZetaGibbs.partition_function_toReal_eq_riemannZeta`, and `ZetaPrimeProductCommonBoundary.zeta_prime_product_common_boundary` prove a general finite-fiber CHSH contrast and the zeta Gibbs partition/common boundary, but not on the asserted prime-lattice Bost-Connes carrier. No owner states the three-layer continuous-equals-statistical theorem, identifies continuous time with modular/thermal flow by an exact KMS identity, normalizes an action cell to a symbolic Planck scale, constructs the primon/Bost-Connes algebra as a Fock space, or supplies the boost/Q-axis and Unruh bridge. Retrieval receipts: D5 searches `KMS|modular.?flow|thermal.?time|CHSH|Bell.*violat|Kochen|Specker|primon|Bost.?Connes|Fock|second.?quant|partition.*zeta|critical.?temperature|Unruh|boost.*axis|continuous.*statistical` found only the CHSH and zeta partial owners plus unrelated constants; bridge searches `prime.*CHSH|CHSH.*prime|prime.*Bell|Bost.?Connes|primon|Unruh|boost.*Q|action.*scale` missed. Pinned Mathlib searches with the same mathematical names found only `Mathlib.Algebra.Star.CHSH` and unrelated Bell-number/Fock-string hits, with no KMS, Bost-Connes, Kochen-Specker, Unruh, or second-quantization owner. A17 GitHub Lean code searches for `KMS modular flow`, `Bost Connes`, `Unruh`, `primon`, and `Kochen Specker CHSH` returned zero hits. The local probe `/private/tmp/w72a13-atom4-probe.lean` exited 0 and directly compiled the frozen CHSH separation, zeta partition identity, and critical partition divergence, but the remaining public clauses cannot be obtained without the missing carriers and bridges. The fitted condensation slope 1.0008 is an empirical remark; rejection of a numerical Planck value and the final wall are status annotations rather than theorem conjuncts."
    reentry_condition: "Construct a canonical prime-register Bost-Connes system with modular flow, KMS law, Fock realization, and symbolic action-scale normalization; connect its prime fibers publicly to the existing CHSH/Kochen-Specker separation and zeta partition boundary; and formalize the stated dual, measure, scale, and relativistic Unruh/Q-axis bridges."
