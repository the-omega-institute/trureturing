  quarantine:
    justification: Retrieval preceded quarantine. D5 search `CHSH|Tsirelson|measurement.?depend|setting.?depend|total variation|S_max|sqrt 2|0.1381|2 + 6` hit the frozen standard CHSH owners `bell_chsh_value`, `bell_chsh_state_expectation_is_greatest`, `classical_chsh_bound_is_exact`, and `local_deterministic_chsh_separation`, plus generic total-variation utilities, but missed a setting-indexed hidden-variable joint law, a measurement-dependence budget on its conditional laws, a public `S_max`, and the claimed price theorem. Pinned Mathlib search under `.lake/packages/mathlib/Mathlib` hit algebraic CHSH bounds, square-root lemmas, and `irrational_sqrt_two`, but missed a measurement-dependent Bell price model or theorem. Reachable A17/GitHub Lean searches `CHSH language:Lean`, `measurement dependence language:Lean`, `measurementDependent language:Lean`, and `2 + 6 CHSH language:Lean` found only standard Bell developments and no matching dependence-price result; Loogle likewise had no declaration match. The corrected local Lean probe exited 0 after an initial syntax-only exit 1 and proves `2 + 6*delta = 2*sqrt 2` iff `delta = (2*sqrt 2 - 2)/6`, proves this threshold is not exactly `0.1381`, and bounds it between `0.13805` and `0.13815`; thus the source's exact decimal equality is false and `0.1381` is only a rounded value. The central clause `S_max(delta) = 2 + 6*delta` cannot be stated faithfully without the missing joint-law model, while `setting and ledger grids decide truth`, `no tendency is an alias of lambda*`, `local will is refuted and global will isolated`, and `the whole is decided at the spectral layer by choosing the menu` are not propositions on source-defined carriers. A threshold-only module would omit public clauses of this single atom.
    reentry_condition: Add a public Bell model comprising a joint law on settings, hidden variables, and outcomes; its four setting-conditional hidden-variable laws; a source-defined total-variation measurement-dependence parameter; a public supremum `S_max`; and a proof `S_max(delta) = 2 + 6*delta`. Also add formal carriers and predicates for every setting/ledger, lambda-star, local/global-will, and spectral-menu status clause, and revise the threshold text to an exact radical equality with `0.1381` explicitly marked as rounded; then deposit one theorem exposing every clause publicly.
    blocker_class: multi-clause-guard
