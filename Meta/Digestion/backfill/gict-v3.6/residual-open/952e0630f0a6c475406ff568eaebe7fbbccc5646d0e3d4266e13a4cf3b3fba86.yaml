    justification: "Retrieval preceded quarantine. D5 queries `topologically free|crossed product|crossedProduct|fixed algebra|invariant function|orbit closure|minimal action|common coordinate|classical kernel|center algebra` found no crossed-product carrier or whole-statement owner; the nearest frozen results are `D5/S3/Quantum/Algebra/CovariantCommutator`, whose own audit says pinned searches found no crossed-product theorem, and `D5/S1/Words/Complexity/GoldenSubshiftMinimalAction`, which supplies only the golden minimal-action premise. Pinned Mathlib queries `crossed.?product|crossedProduct|topologically.?free|fixed.?point.?algebra|invariant.?subalgebra|center.*invariant` over `.lake/packages/mathlib/Mathlib` found no C-star crossed-product construction or center theorem; only base C-star and continuous-map infrastructure was present. Reachable GitHub Lean searches `crossed product language:Lean`, `crossedProduct language:Lean`, and repository query `Lean C-star crossed product` exited 0; the sole code hit was an unrelated Hopf-algebra crossed product and no C-star result or A17 port candidate was found. The local proof decomposition reaches the golden minimality premise and generic covariant commutator identities, but stops before elaboration because no public type represents `C(X)` crossed by the integer action; therefore the source-carrier equality `Z(C(X) crossed-product Z) = C(X)^tau`, its cyclic and golden center specializations, and the iff common-coordinate criterion cannot be stated without inventing the canonical crossed product or assuming the conclusions."
