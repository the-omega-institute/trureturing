    justification: 'Pinned upstream reuse only; mathlib db584cd6d46c92f209a44c0f1c829460d327499d. No frozen project GID supplies the complete statement at its full generality. Bindings: isCompact_Icc, IsCompact.exists_isMinOn, Finset.single_le_sum, le_csInf, csInf_le, norm_sub_sq_real, inner_sum, inner_smul_right, real_inner_smul_left, real_inner_le_norm, Finset.sum_sub_distrib, Finset.sum_nonneg, Finset.sum_eq_zero_iff_of_nonneg, mul_eq_zero, norm_eq_zero, sub_eq_zero, inner_eq_one_iff_of_norm_eq_one, Finset.sum_smul, Finset.sum_eq_zero, Finset.sum_ite_eq, norm_add_eq_sqrt_iff_real_inner_eq_zero, Real.sq_sqrt, Real.sqrt_nonneg, norm_add_sq_real, norm_smul, Fin.sum_univ_two. Global value and exact minimizer set for all finite dictionary sizes, support of every joint-sample optimum, and the exact strictly positive faithful-dictionary gap. Parameters and premise discharge: Compact box Icc 0 (constant norm(x)^2/(2*lambda)) contains zero. Finite-coordinate energy is continuous. isCompact_Icc and exists_isMinOn give a minimizer; outside-box codes cost more than energy(0) by single_le_sum. Thus the feasible infimum is attained, including the empty-index case. norm_sub_sq_real, inner_sum and inner_smul give radial excess = half squared residual + lambda*sum c_i*(1-inner(e,D_i)); all terms nonnegative by real_inner_le_norm and unit norms. Zero excess forces each active D_i=e by sum_eq_zero_iff_of_nonneg and inner_eq_one_iff_of_norm_eq_one; residual zero forces total mass n-lambda. Conversely any such nonnegative splitting attains the floor. Positive mass forces an aligned entry; a single supported coordinate gives the converse. Empty dictionaries have neither aligned entry nor radial equality. Pythagoras gives norm(u+v)=sqrt(2), cost(0)=0; positive weights force both radial equalities, hence exactly dictionaries containing u,w. Canonical [u,w] attains the lower value over all finite sizes. Every optimal joint-sample code has total mass sqrt(2)-lambda and support only on w entries. Orthogonal square completion for [u,v] gives 2*lambda-lambda^2 at u+v; exact weighted gap is p_AB*lambda*(2-sqrt(2)-lambda/2)>0 using sqrt(2)<3/2 and 0<lambda<1.'
