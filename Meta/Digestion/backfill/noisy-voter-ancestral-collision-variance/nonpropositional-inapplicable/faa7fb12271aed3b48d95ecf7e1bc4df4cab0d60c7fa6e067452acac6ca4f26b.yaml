    justification: Definitions of the repetition indicators, W_t, the source-collision indicators, C_t and the natural unordered-pair multiplicities. The finite counting identity is a direct application of pinned Mathlib Finset.card_eq_sum_card_fiberwise to s={i in Finset.Icc 1 t | a_i != b_i}, f(i)={a_i,b_i}, and the finite target f(s). Its maps-to premise is Finset.mem_image_of_mem. The fiber cardinalities are exactly m_e; all pairs outside f(s) have zero multiplicity by definition. Finset.card_filter and card(Icc 1 t)=t identify card(s)=t-C_t. Empty sums give the stated t=0 convention. This closes only the definitions and finite fiber-count identity, not any compound variance assertion.
