    justification: "Complete original periodic-tree IP.9, including setup, RP5, both RP6 congruences, distinctness and the proof's intermediate identities. For every integer ell>1 with Odd ell and chi(ell)=legendreSym 5 ell=-1, including ell=3 and every odd composite inert base, and every natural k>=0, B_(ell,k) is the actual positive exact integer quotient Nat.fib(ell^(k+1))/Nat.fib(ell^k). Nat.fib_dvd, Nat.fib_pos, Nat.mul_div_cancel' and Nat.div_pos supply divisibility, exact multiplication and positivity; no prime assumption on ell is introduced. lambda5(x) means ((x^4-1)/5) mod 5, with exact integer division before reduction, never inversion of 5. Pure pinned-upstream mathematical reuse: lake-manifest.json pins Mathlib 56a005855ea17e0b0958f73ec801ae140b0a1679. LinearRecurrence.eq_iff_eqOn_range_order applied over ZMod 25, with Nat.fib_zero, Nat.fib_one and Nat.fib_add_two, identifies the Fibonacci sequence with 2*n*(2^(-1))^n*(1+5*6^(-1)*(n-1)*(n-2)); n-1 and n-2 here are ring differences and 2 and 6 are units modulo 25. Its recurrence and two initial values are polynomial normalization. ZMod.pow_card_sub_one_eq_one at prime 5, ZMod.intCast_eq_intCast_iff, ZMod.natCast_eq_natCast_iff, exact division and modular powers/cancellation give RP1 and RP2: lambda5(x*y)=lambda5(x)+lambda5(y), lambda5(x^h)=h*lambda5(x), lambda5(2)=3, lambda5(1+5*u)=4*u, and lambda5(F_n)=lambda5(n)+1-n^2 for positive n coprime to 5. The lift formula lambda5(x+5*t)-lambda5(x)=4*x^3*t modulo 5 is polynomial normalization, hence (x mod 5,lambda5(x)) determines a unit modulo 25. legendreSym.eq_pow at prime 5 gives ell^2=-1 modulo 5, so ell and all its power-index Fibonacci numbers are units at 5. At the two actual power indices, exact quotient cancellation gives lambda5(B_(ell,k))=lambda5(ell)-ell^(2*k)*(ell^2-1)=lambda5(ell)-3*(-1)^k modulo 5 (RP5). All k have B_(ell,k)=ell*(-1)^((ell-1)/2) modulo 5, a nonzero residue, by the same normalized Fibonacci formula; oddness suffices also for composite ell. For every natural j>=0, B_(ell,2*j)=F_ell and B_(ell,2*j+1)=-4*F_ell modulo 25 (both RP6 congruences), anchored by the exact identity B_(ell,0)=F_ell since F_1=1. The lambda5 values alternate with odd-minus-even difference 1 modulo 5; multiplication by -4 preserves residue modulo 5 and adds lambda5(-4)=1 (equivalently use its positive unit representative 21 modulo 25). Uniqueness of the unit lift gives both all-j residues; they are distinct because their difference is -5*F_ell, nonzero modulo 25 as F_ell is a unit at 5. The separate original explanation for prime ell>=7 uses existing frozen D5/S3/Arith/Primes/FibonacciPrimePowerLayer.fibonacci_prime_power_layer, statement_id sha256:7c43dad53d5775a89e4268698a44a8fc25fea5b6bf5afa9905bbc6cf0a643a1c, with q=ell and s=k+1, for factors' exact ranks and exponents' initial depths. That citation applies only to that explanatory specialization; it supplies no coverage of full native RP5/RP6 or of composite bases. No applicable repository frozen GID covers this complete native mathematical unit. This is source-level upstream reuse accounting through the existing nonpropositional receipt schema, not fresh compiled exact-application evidence, new Lean truth or frozen coverage."
