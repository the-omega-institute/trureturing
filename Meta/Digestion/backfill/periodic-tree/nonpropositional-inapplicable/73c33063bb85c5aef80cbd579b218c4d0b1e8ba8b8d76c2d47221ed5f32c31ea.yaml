    justification: "Upstream-only propositional closure under CLAUDE.md 3.2 at the lake-manifest.json Mathlib revision 56a005855ea17e0b0958f73ec801ae140b0a1679. No project frozen GID is available for the complete combination. proof_shape: bind-only; admission_basis: none. This is an accounting reuse correspondence, not a compiled Lean proof or a kernel-verification claim. The propositional scope is not discarded merely because the atom begins Proof.\n\nRoots and unit-square fibers: for A=ZMod(p^e), send a root x of x^2=-1 to Units.mkOfMulEqOne x (-x), since x*(-x)=1 by substitution and ring normalization. Unit coercion is the inverse; Subtype.ext and Units.ext reduce the inverse laws to reflexivity and transport the square equation. Thus the root subtype is equivalent to {u:Aˣ | u^2=-1}. If empty, its cardinal is zero; otherwise choose u0 and instantiate MonoidHom.fiberEquivKer at powMonoidHom 2 and u0. Substituting u0^2=-1 identifies the target fiber, and the kernel is {u | u^2=1}. Suppliers: Units.mkOfMulEqOne, Units.val_mkOfMulEqOne (Mathlib/Algebra/Group/Units/Defs.lean:292), powMonoidHom (Mathlib/Algebra/Group/Hom/Basic.lean:38), MonoidHom.fiberEquivKer (Mathlib/GroupTheory/Coset/Basic.lean:474), Nat.card_congr, Nat.card_eq_fintype_card and subtype/unit extensionality. Constructors, existing fiber equivalence, algebraic and logical normalization supply the maps and inverse laws without a surviving new atomic fact.\n\nOdd/even prime powers: install ZMod.isCyclic_units_of_prime_pow p hp hp2 e for odd prime p, then specialize IsCyclic.card_pow_eq_one_le at exponent 2>0 and transport by the preceding equivalence to R(p^e)<=2. At p=2,e=1 the two representatives give exactly root 1 and R(2)=1 by finite normalization. At e>=2, 4 divides 2^e; ZMod.castHom sends an alleged root to a root modulo 4. For integer representative b, ZMod.intCast_eq_intCast_iff' makes its square residue 3 modulo 4, while Int.sq_emod_four makes it b%2 with 0<=b%2<2, a contradiction by integer normalization. Suppliers: ZMod.isCyclic_units_of_prime_pow (Mathlib/RingTheory/ZMod/UnitsCyclic.lean:198), IsCyclic.card_pow_eq_one_le (Mathlib/GroupTheory/SpecificGroups/Cyclic/Subgroup.lean:246), ZMod.castHom, ZMod.natCast_val, ZMod.intCast_eq_intCast_iff' (Mathlib/Data/ZMod/Basic.lean), Int.sq_emod_four (Mathlib/Algebra/Ring/Int/Parity.lean:137), Int.emod_nonneg, Int.emod_lt_of_pos. This uses the existing cyclic-kernel bound and transport/finite normalization, not an IsDomain instance for composite ZMod or new Hensel content.\n\nExact CRT root product: for d>1, d!=0, ZMod.equivPi d and its exact factorization/pairwise-coprime suppliers transport x^2=-1 to pointwise equations by ring-hom laws; injectivity and funext_iff give the converse. Equiv.subtypeEquiv followed by Equiv.subtypePiEquivPi identifies the roots with the product of prime-power root subtypes. Nat.card_congr and Nat.card_pi give R(d)=product(p in d.primeFactors,R(p^factorization d p)). Prime-factor membership supplies primality and positive exponent. Finset.prod_le_prod and Finset.prod_const with the previous bounds yield R(d)<=2^d.primeFactors.card. Suppliers: ZMod.equivPi (Mathlib/Data/ZMod/QuotientRing.lean:98), Equiv.subtypeEquiv, Equiv.subtypePiEquivPi (Mathlib/Logic/Equiv/Basic.lean:263,413), Nat.card_congr, Nat.card_pi (Mathlib/SetTheory/Cardinal/Finite.lean:89,239), Finset.prod_le_prod, Finset.prod_const, Nat.prime_of_mem_primeFactors and positive factorization on prime support. This is restriction of existing ring and subtype/Pi equivalences, with no new CRT/cardinality theorem.\n\nExact coefficient 64: partition d.primeFactors into S={p | p<17} and L={p | 17<=p}. Finite primality normalization gives S subset {2,3,5,7,11,13}, so Finset.card_le_card gives card S<=6. For p in L, 2^4=16<=p, and Real.rpow_le_rpow at exponent 1/4 plus rpow/pow normalization gives 2<=p^(1/4). For p in S, p^(1/4)>=1. Product monotonicity gives 2^omega(d)<=2^card S*product(p in L,p^(1/4))<=64*(product(p in d.primeFactors,p))^(1/4)<=64*d^(1/4). The last step uses Nat.prod_primeFactors_dvd d and Nat.le_of_dvd with d>0. Equivalently the scalar check is (2^omega(d))^4<=16^6*d=64^4*d. No squarefree hypothesis is inserted. Suppliers: Finset filter partition/cardinality/product identities, Finset.card_le_card, Finset.prod_le_prod, Finset.prod_le_prod_of_subset_of_one_le, Nat.prod_primeFactors_dvd (Mathlib/Data/Nat/Factorization/Basic.lean:349), Nat.le_of_dvd, Real.rpow_le_rpow, Real.rpow_le_rpow_iff, Real.rpow_mul, Real.rpow_natCast_mul (Mathlib/Analysis/SpecialFunctions/Pow/Real.lean), and finite primality/rational-power normalization at cutoff 17. All atomic comparisons are finite enumeration, product-order instances and real-power normalization.\n\nFibonacci growth, summability and the exact all-index tail: let a=3/2,r=3/4. For j=n+2 the existing Axis supplier goldenRatio_pow_div_le_fib_succ at K=n+1, after cancellation of positive phi, yields phi^n<=fib(n+2); 3/2<=phi follows from phi>1 and phi^2=phi+1 by scalar normalization. For a purely manifest-upstream correspondence, inline that supplier body: Real.goldenRatio_mul_fib_succ_add_fib K with Nat.fib_le_fib_succ gives phi^(K+1)<=(phi+1)*fib(K+1)=phi^2*fib(K+1), and cancellation gives the same inequality. Thus no frozen-project premise is required. Power monotonicity gives a^n<=fib(n+2). For f=fib(n+2)>0 the root bound yields R(f)/f<=64*f^(-3/4). Real.rpow_le_rpow_of_nonpos gives f^(-3/4)<=(a^(-3/4))^n; a^(-3/4)<=r reduces by nonnegative fourth powers and rpow normalization to 8/27<=81/256, hence R(fib j)/fib j<=64*r^(j-2). Reindex all j>J by j=J+1+k with inverse k=j-J-1. For every integer J>=3 all denominators exceed one and terms are nonnegative. The majorant is 64*r^(J-1)*r^k. hasSum_geometric_of_lt_one, multiplication by the fixed coefficient, Summable.of_nonneg_of_le, Summable.tsum_le_tsum and Equiv.tsum_eq give summability and the full tail <=64*r^(J-1)/(1-r)=256*(3/4)^(J-1)=T_J. Suppliers: Real.goldenRatio_mul_fib_succ_add_fib, Real.goldenRatio_sq, Real.goldenRatio_pos, Real.one_lt_goldenRatio, Nat.fib_le_fib_succ; Real.rpow_le_rpow_of_nonpos, Real.rpow_natCast_mul, Real.rpow_mul and power monotonicity; hasSum_geometric_of_lt_one, tsum_geometric_of_lt_one (Mathlib/Analysis/SpecificLimits/Basic.lean:317,330); Summable.of_nonneg_of_le (Mathlib/Topology/Algebra/InfiniteSum/ENNReal.lean:532); Summable.tsum_le_tsum (to_additive of Multipliable.tprod_le_tprod in InfiniteSum/Order.lean:133); Equiv.tsum_eq (to_additive of Equiv.tprod_eq in InfiniteSum/Basic.lean:553). The Axis supplier correspondence is D5.S3.Axis.AxisConvergence.goldenRatio_pow_div_le_fib_succ, statement_id sha256:bb0d619899e098af2eea62b0d59a4fab5442e67a09e5efa556425fe12b2c7076; only its displayed upstream body is needed here. No new induction, reproof artifact or wrapper is introduced. The infinite conclusion is existing comparison/geometric/reindexing machinery applied to the normalized ratio bound.\n\nThis correspondence preserves every proposition in this proof/tail atom: odd/even prime-power roots, exact CRT product, exact-64 radical bound, Fibonacci growth, summability and the explicit T_J tail for every integer J>=3. No new Lean or kernel credit is claimed."
