    justification: CLAUDE.md section 3.2 upstream-only closure, no usable frozen project GID. Every clause of Theorem 5.3 is an application of pinned Mathlib plus finite-sum, coordinate and rank normalization for finite-dimensional REAL inner-product spaces K,U,V. Retain the same prescribed K in all models, k=finrank R K, p=finrank R U, q=finrank R V, and a contraction C:V to U. Put T=id-C.adjoint.comp C. LinearMap.isSymmetric_adjoint_comp_self, LinearMap.IsSymmetric.sub and LinearMap.adjoint_inner_right give symmetry and inner(Tv,v)=norm(v)^2-norm(Cv)^2>=0. In stdOrthonormalBasis R V, LinearMap.toMatrixOrthonormal, LinearMap.posSemidef_toMatrix_iff and Matrix.nonneg_iff_posSemidef transfer T to a nonnegative REAL matrix. CFC.sqrt_nonneg, CFC.sqrt_mul_sqrt_self and CFC.sqrt_unique supply its positive real square root; transfer back to obtain D.adjoint=D and D.comp D=T. LinearMap.ker_adjoint_comp_self applied to D gives ker D=ker T, including singular and zero-dimensional cases. With L2 sums via WithLp.instProdInnerProductSpace and WithLp.prod_inner_apply, H_C=K directsum U directsum range D has the actual old isometries i_A(k,u)=(k,u,0) and i_B(k,v)=(k,Cv,Dv). Equality of these actual vectors is exactly k=l, u=Cv, Dv=0. Hence their full intersection is the range of the injective map K times N to H_C, (k,v) maps to (k,Cv,0), where N=ker T. For v,w in N, C.adjoint(Cw)=w, so inner(Cv,Cw)=inner(v,w); LinearMap.isometryOfInner gives the isometric restriction and injectivity. LinearMap.finrank_range_of_inj, Module.finrank_prod and LinearMap.finrank_le_finrank_of_injective give intersection dimension k+m and m=finrank R N<=min(p,q). LinearMap.finrank_range_add_finrank_ker for D gives finrank(range D)+m=q, hence finrank H_C=k+p+q-m, with the natural subtraction justified by that additive equality. The dimension is the JOINTLY GENERATED space H_C, not unused directions of an arbitrary ambient space. For every integer r with 0<=r<=min(p,q), n=r.toNat, take E=EuclideanSpace R (Fin n). Initial-coordinate injections into stdOrthonormalBasis R U and V, Module.Basis.constr, Orthonormal.comp and LinearMap.isometryOfOrthonormal give actual isometries j_U:E to U and j_V:E to V. Set C=j_U.comp(j_V.adjoint). LinearIsometry.adjoint_comp_self', LinearMap.adjoint_comp, LinearIsometry.norm_toContinuousLinearMap_le and ContinuousLinearMap.opNorm_comp_le show C is a contraction and C.adjoint.comp C=j_V.comp(j_V.adjoint)=P with P^2=P. LinearMap.range_self_comp_adjoint and IsIdempotentElem.range_eq_ker give ker(id-P)=range j_V; LinearMap.finrank_range_of_inj and finrank_euclideanSpace_fin give m=n. This realizes every requested integer with the unchanged old spaces and prescribed K, including n=0 and zero U or V. For arbitrary old embeddings with these mixed pairings, restrict to their generated span; LinearEquiv.extendOfIsometry and LinearEquiv.extendOfIsometry_eq transport the same generator Gram identities and intersection, preserving the old embeddings. If U or V is zero the contraction is uniquely zero. For C=0, D=id and N=0, so the residual images are orthogonal, intersection is exactly i(K) and joint dimension k+p+q is maximal over choices; minimal for fixed cross readings still means jointly spanning. LinearMap.IsSymmetric.apply_eigenvectorBasis, LinearMap.sq_singularValues_fin and LinearMap.singularValues_nonneg identify N with the unit-singular directions. A full finite cross Gram table specifies all entries of C in the fixed orthonormal bases; this is an internal comparison-space conclusion and does not reconstruct raw archives. No new Lean declaration, wrapper, project GID or first freeze is required, and no other atom's receipt is asserted.
