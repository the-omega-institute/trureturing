    justification: CLAUDE.md section 3.2 upstream-only closure, no usable frozen project GID. Definition 5.1 uses already-given finite-dimensional real Hilbert comparison spaces. Its joint-model and jointly-spanning minimality clauses are definitions; its orthogonal splitting is Submodule.orthogonalDecomposition on the prescribed common subspaces, with U and V their orthogonal complements. For the original-label example retain L0(X) as the INTEGER zero-mass Finsupp module, not a real vector space. A nonempty S=A intersect B supplies s0 in S. Finsupp.lmapDomain and Finsupp.linearCombination_comp_lmapDomain extend integer coefficients by zero and preserve total mass; Finsupp.mapDomain_injective gives the inclusions. For the already-given additive representations T_X with q_X(r)=norm(T_X(r))^2, agreement of q_A and q_B on the included L0(S) identifies the integer kernels N_Z. Submodule.liftQ and Submodule.ker_liftQ_eq_bot yield injective additive quotient maps. For e_s=delta_s-delta_s0, real_inner_eq_norm_mul_self_add_norm_mul_self_sub_norm_sub_mul_self_div_two gives the identical Gram tables of T_A(e_s) and T_B(e_s) from q(e_s), q(e_t), q(e_s-e_t). Finsupp.linearCombination on the REAL zero-mass carrier V_S and finite inner-product sum normalization extend these Gram tables to equal real bilinear forms. Use their FULL real radical N=ker F_A=ker F_B, not the real span of N_Z; LinearMap.BilinForm.apply_apply_same_eq_zero_iff identifies this radical with the zero quadratic locus. LinearMap.quotKerEquivRange, Submodule.liftQ, NormedAddCommGroup.induced, InnerProductSpace.induced and LinearMap.isometryOfInner give the common real quotient V_S/N and linear isometric embeddings into both old spaces. The integer quotient maps additively and isometrically into it, and cast coefficients pull N back to N_Z. If old spaces are already real quotients, Submodule.mapQ, Submodule.ker_mapQ and Submodule.mapQ_apply give the same embeddings from the inclusion's comap-kernel identity. The images are the real spans of anchored shared-label differences, closed by finite dimensionality. Identify them as the prescribed K and apply orthogonal decomposition. This preserves the nonempty common anchor, the original integer comparison readings and the distinction between prescribed K and the full image intersection. Empty-overlap relative affine placement is unspecified; no Theorem 5.2 classification is settled by this request.
