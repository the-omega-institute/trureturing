    justification: "Upstream-only reuse under CLAUDE.md section 3.2; no usable complete frozen project GID is identified for this clause-complete classification. The pinned Mathlib revision is 56a005855ea17e0b0958f73ec801ae140b0a1679. For finite-dimensional real inner product spaces K, U and V, WithLp.instProdInnerProductSpace and WithLp.prod_inner_apply represent both old orthogonal sums using WithLp 2, including zero spaces. Given old isometric embeddings agreeing on K and jointly spanning the actual ambient H, ContinuousLinearMap.adjoint and ContinuousLinearMap.adjoint_inner_right recover the same model's residual map C=a.adjoint composed with b. ContinuousLinearMap.opNorm_le_bound and ContinuousLinearMap.opNorm_comp_le give norm C at most one without assuming a zero-domain isometry has operator norm one. Old orthogonality and agreement on K give every mixed inner product, and norm_add_sq_real gives the full squared-sum identity with arbitrary k,l,u,v. Conversely, for every real contraction C, use a fresh algebraic synonym of K x U x V with semidefinite form B((k,u,v),(l,x,y)) = inner(k,l)+inner(u,x)+inner(v,y)+inner(u,Cy)+inner(Cv,x). Its positivity is the completed-square identity norm(k)^2+norm(u+Cv)^2+norm(v)^2-norm(Cv)^2 and the pointwise contraction bound; its remaining core laws are real inner-product/map normalization. PreInnerProductSpace.Core, InnerProductSpace.Core.toSeminormedAddCommGroup and InnerProductSpace.ofCore supply the core-induced seminorm, and the SeparationQuotient inner-product instance supplies its real normed quotient. SeparationQuotient.mkCLM, SeparationQuotient.inner_mk_mk and LinearMap.isometryOfInner give both full old isometric embeddings, common-K agreement and the prescribed mixed readout. SeparationQuotient.surjective_mk and representative decomposition give joint spanning; SeparationQuotient.instModuleFinite and FiniteDimensional.proper_real give a finite-dimensional complete real model. ext_inner_left recovers the input C. For two models with equal C, their linear generator maps from the same algebraic K x U x V are surjective by joint spanning and agree in norm by the squared-sum identity. LinearEquiv.extendOfIsometry applied to LinearEquiv.refl and these two generator maps gives a SURJECTIVE linear isometric equivalence; LinearEquiv.extendOfIsometry_eq gives both old-embedding intertwining equations. Generator surjectivity gives uniqueness. Conversely an intertwining isometry preserves the residual mixed pairing, so ext_inner_left identifies C. The residual block is positive exactly for contractions: specialize u=-Cv for necessity and use the same completed square for sufficiency. This preserves arbitrary shared K, zero and singular residual cases, and permitted extra intersection; it assumes neither full intersection=K, positive defect nor an injective raw generator. The quotient realization replaces the source proof's defect-square-root presentation without changing its classification conclusion. This is source-level upstream accounting, not a new exact compiled project theorem, kernel result, axiom report or coverage GID."
