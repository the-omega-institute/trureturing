  nonpropositional:
    justification: 'Upstream-only closure; no existing frozen project GID supplies the complete appendix. For arbitrary finite index types I,J and Hermitian PSD complex matrices D,E, use the already settled canonical quotient realizations and labels vD(i)=[e_i],vE(j)=[e_j]. The direct-sum family in WithLp 2 (H_D x H_E) is Sum.elim (i |-> (vD(i),0)) (j |-> (0,vE(j))). WithLp.prod_inner_apply gives its diagonal Gram blocks D,E and zero cross blocks; LinearMap.span_inl_union_inr, Submodule.map_span and WithLp.linearEquiv give span=top. Matrix.posSemidef_gram supplies positivity of this block kernel. For tensors Matrix.PosSemidef.kronecker gives positivity of D tensor E. TensorProduct.inner_tmul gives inner(vD(i) tensor vE(j),vD(k) tensor vE(l))=D(i,k)*E(j,l), exactly Matrix.kronecker_apply. Submodule.map2_span_span (Lean name Submodule.map₂_span_span), TensorProduct.map₂_mk_top_top_eq_top and Set.image2 of the two label ranges give span of the labelled tensor family=top. Module.Finite.tensorProduct and FiniteDimensional.complete give completeness; no completed infinite-dimensional tensor product is substituted. Apply LinearEquiv.extendOfIsometry to the identity on (I x J ->0 complex), with the two Finsupp.linearCombination maps for canonical quotient labels of D tensor E and for vD(i) tensor vE(j). Finsupp.range_linearCombination and span=top supply both dense-range hypotheses. Norm equality follows by norm_eq_sqrt_re_inner and expansion of the two finite linear combinations using equal Gram entries (sum_inner, inner_sum, inner_smul_left, inner_smul_right). LinearEquiv.extendOfIsometry_eq at Finsupp.single (i,j) 1 gives the canonical labelled unitary; LinearMap.ext_on_range gives uniqueness. The identical construction on I sum J gives the labelled direct-sum unitary. These upstream applications and normalization have no escape content. All suppliers are pinned Mathlib revision 56a005855ea17e0b0958f73ec801ae140b0a1679. None assumes positive definiteness, nonzero rank or nonempty index, so zero, singular, empty and one-empty-factor cases are included. Comparison realizations may have arbitrary Hilbert carrier; finite dimensionality is derived from the finite spanning family, not added as a hypothesis. The final sentence is a scope restriction: the construction requires a specified positive coherence kernel; graph adjacency/existence data alone do not specify its entries. It asserts no unconditional physical-universe claim. Zero new Lean, Scribe or GID is retained.'
