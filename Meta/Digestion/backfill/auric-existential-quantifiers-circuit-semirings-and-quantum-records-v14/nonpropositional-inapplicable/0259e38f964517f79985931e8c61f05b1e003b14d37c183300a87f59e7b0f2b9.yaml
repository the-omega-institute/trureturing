  nonpropositional:
    justification: 'Upstream-only closure under CLAUDE.md section 3.2; no repository declaration GID is available. The Boolean semiring is represented by WithZero PUnit, using PUnit.commRing (Mathlib.Algebra.Ring.PUnit) and WithZero.instSemiring (Mathlib.Algebra.Ring.WithZero), at pinned mathlib revision 56a005855ea17e0b0958f73ec801ae140b0a1679. Its zero is none and its one is some PUnit.unit, so addition is OR and multiplication is AND. The Bool ring from Mathlib.Algebra.Ring.BooleanRing has XOR addition and is not the target here. For any nontrivial semiring S, put epsilon(a) = if a = 0 then 0 else 1. Unfolding this function and the four fields of RingHom (Mathlib.Algebra.Ring.Hom.Defs), its zero and one laws follow from zero_ne_one. Its addition law is exactly (a+b != 0 iff a != 0 or b != 0); by classical propositional normalization and zero_add/add_zero this is equivalent to forall a b, a+b=0 implies a=0 and b=0. Its multiplication law is exactly (a*b != 0 iff a != 0 and b != 0); by the same normalization and zero_mul/mul_zero this is equivalent to forall a b, a*b=0 implies a=0 or b=0. Equivalently, use noZeroDivisors_iff, mul_eq_zero and mul_ne_zero_iff from Mathlib.Algebra.GroupWithZero.Defs for the multiplicative clause. Both directions use only the defining homomorphism fields, these identities, and Boolean/propositional normalization. The natural-number example uses Nat.add_eq_zero_iff and mul_eq_zero. The nonnegative-real example uses add_eq_zero_iff_of_nonneg after coercing to Real, Subtype.ext, and mul_eq_zero; the semiring and no-zero-divisors structures are the pinned Mathlib.Data.NNReal.Defs and Mathlib.Algebra.Order.Nonneg instances. Complex addition violates the first condition by add_neg_cancel (1 : Complex) and one_ne_zero. For any unital semiring homomorphism h from Complex to WithZero PUnit, RingHom.map_add, RingHom.map_zero and RingHom.map_one would give 0 = 1 + h(-1). The two possible values 0 and 1 of h(-1) both make the right side 1, contradicting zero_ne_one. Thus even an arbitrary unital homomorphism is excluded, not only epsilon. The concluding circuit interpretation uses this scalar cancellation obstruction: a record keeping only the nonzero status of each summand cannot preserve coherent summation. It asserts no additional physical realization or complexity bound. All propositional clauses are instances, logical assembly or normalization of pinned upstream facts; there is no non-binding escape witness and no external named open-problem resolution. This receipt records reuse, not a newly kernel-verified repository theorem or a new freeze.'
