  quarantine:
    justification: "Carried: I opened D5/S3/ConceptDynamics/Refinement/SemanticResourceSeparation.lean and read D5.S3.ConceptDynamics.Refinement.SemanticResourceSeparation.semantic_sufficiency_can_exceed_finite_resources, whose frozen membership is evidenced by Golden/Frozen/state/D5/S3/ConceptDynamics/Refinement/SemanticResourceSeparation.lean.json (stored module statement_id sha256:51fd5eb089e07d8d02f73a0320b2854330937bbf9caf9521de428c558f13dad2). The owner D5/S3/ConceptDynamics/Refinement/SemanticResourceSeparation.semantic_sufficiency_can_exceed_finite_resources carries the two conclusion clauses jointly, under the same existential target: Refines target readout and Not (ResourceRefines cost budget target readout). Its precise scope is [Fintype Y], [Nonempty Y], [Fintype (Set.range readout)], allowed : Finset (B -> Y), allowed_iff_budget : forall factor, factor ∈ allowed <-> cost factor <= budget, and allowed.card < Fintype.card Y ^ Fintype.card (Set.range readout). The proof restricts allowed maps to the realized image, selects a missing image-function, sets target(x) to that function at readout(x), and uses a chosen fallback in Y to extend it to all of B. Thus this is conditional carriage of the semantic/resource separation argument in the finite nonempty target model, not unconditional coverage of the atom. Uncarried: the atom's stated assumptions do not impose finiteness or nonemptiness of Y, so the infinite-Y case and the empty-Y boundary remain outside that owner; in particular the latter is an extension obligation, not just a missing Fintype instance. The source context I read at docs/develop/theory/FORMAL_CONCEPT_DYNAMICS.md, section 374, explicitly defines semantic sufficiency using f : B_C -> Y and resource sufficiency using f in A_r(B_C,Y). Consequently the source already uses whole-codomain factor maps; it would be inaccurate to claim its allowed algorithms are necessarily only image-domain functions. What is still absent from the inspected bridge is a typed identification of this source class with allowed and the equivalence between membership and ResourceCost <= budget; finite program codes, if used instead, require a denotation map and a bound on the cardinality of its image. Scope gap: the source counts maps Im(C) -> Y but concludes whole-B_C semantic factorization for a Y with no explicit guard in this atom; the owner supplies that extension by [Nonempty Y] and performs a finite natural-number count. One cannot silently replace the source relation with factorization through Set.rangeFactorization C. Near misses: I actually ran rg -n -i 'semantic.*resource|resource.*separat|more_targets|allowedRestrictions|allowed_iff_budget' D5/ -tlean and rg -n 'theorem|def|abbrev' D5/S3/ConceptDynamics/Refinement/*.lean, then opened the candidates. D5/S3/ConceptDynamics/Refinement/ResourceRefinementComposition.resource_refinement_compose composes two supplied resource-factorization witnesses under composition_bound and combine_mono; it does not produce a missing target from a counting inequality. D5/S3/ConceptDynamics/Refinement/ResourceAsymmetricConceptEquivalence.ordinary_equivalence_does_not_imply_resource_equivalence assumes a finite permutation and costAsymmetry, hence is not separation for arbitrary C and a finite allowed class. D5/S3/ConceptDynamics/Refinement/InductiveSufficiency.inductive_sufficiency_criterion characterizes fiber constancy as factorization through the realized image without a target-nonemptiness assumption, but neither supplies resource nonrealizability nor the whole-B_C extension. The actual pinned-library search rg -n 'card_lt_iff_ne_univ|factorsThrough_iff' .lake/packages/mathlib/Mathlib/ found Function.factorsThrough_iff in Mathlib/Logic/Function/Basic.lean, whose statement I opened and which also requires [Nonempty] of the target. I also opened Fintype.card_fun and Finset.card_lt_iff_ne_univ: they are finite counting primitives, not an arbitrary-Y separation theorem. Cardinal.power_def in Mathlib/SetTheory/Cardinal/Defs.lean and Cardinal.mk_le_of_surjective in Mathlib/SetTheory/Cardinal/Order.lean, located with the cardinal search recorded in evidence_commands and then opened, provide general cardinal counting ingredients but no automatic extension or program-model bridge. Same-source contrast: I cat-read the entire CAS blobs and absorbed-closed YAMLs of 34e9d35bf66b5e34880b2a93a6fa430ad6e4c9edb14d70a8f2e3deeb8d555eb5 and 4c2b714cb3985bd4de5c58bf02d1c1c78bb6cfe342f2143ce0b84383c00d59f2. Both YAMLs point to D5/S3/ConceptDynamics/Refinement/SemanticResourceSeparation.semantic_sufficiency_can_exceed_finite_resources. The whole text of 34e9d35bf66b5e34880b2a93a6fa430ad6e4c9edb14d70a8f2e3deeb8d555eb5 is \"* 允许算法类 (\\mathcal A_r) 有限；\". It records that assumption, whereas this parent also contains finite Im(C), the strict inequality, the same-target positive and negative conclusions, and their proof. The second sibling actually contains \"则 (T) 语义上通过 (C) 因子化，但不存在资源预算 (r) 内的因子程序。 (\\square)\" as well as the inequality and both displayed conclusions; it starts at the inequality bullet and omits the parent's title and its two preceding finiteness bullets. It is not a finite-nonempty-Y restatement, and its observed absorbed-closed assignment supplies no additional assumption for the parent. Honesty: ASSUMED-UNVERIFIED items are listed explicitly below. In particular no Lean elaboration or compilation, axiom audit, or executable theorem-composition check was run; the proposed boundary counterexample and reentry statements are paper-level obligations, not frozen results. The search establishes candidate scope mismatches in the inspected files, not nonexistence of every possible theorem or proof in the repository or external ecosystem."
    reentry_condition: "Provide a frozen D5 theorem, or a pinned-library theorem with a checked instantiation, with this explicit statement: for arbitrary X, B, Y in a common universe, C : X -> B, finite I := Set.range C, finite A : Finset (B -> Y), and H : (A.card : Cardinal) < Cardinal.mk Y ^ Cardinal.mk I, the proposition (exists T : X -> Y, Refines T C and not (exists f : B -> Y, f ∈ A and T = f composed with C)) is equivalent to Nonempty (B -> Y). For the forward direction, extract the semantic factor; for the reverse direction, restrict A to I, use Cardinal.power_def and Cardinal.mk_le_of_surjective to obtain a missing image-function, and extend it off I using an inhabitant of B -> Y. Supply a typed source interpretation identifying C, A_r(B_C,Y), and the source resource relation, including the membership/budget equivalence if ResourceRefines is used; if A_r consists of codes, first pass through its denotation image and prove the image cardinal bound. For finite nonempty Y, compose this interpretation with the existing owner D5/S3/ConceptDynamics/Refinement/SemanticResourceSeparation.semantic_sufficiency_can_exceed_finite_resources by supplying allowed_iff_budget and converting the strict count to Fintype.card; use the new arbitrary-Y theorem for the remaining cases. Both branches must produce the same target's semantic and negative resource clauses, with factors on B_C. To release the original atom, also discharge Nonempty (B_C -> Y) from an explicitly verified source premise, or resolve the source boundary by an explicit correction/refutation process: check and freeze the proposed X = Empty, B_C = Unit, Y = Empty, A_r = empty case, where the image-function count is 0^0 = 1 > 0 but Unit -> Empty has no map. If confirmed, this refutes the unguarded whole-codomain formulation; merely adding Nonempty Y in a new theorem or changing C to its range is not coverage of the unchanged atom. A corrected source can explicitly require Nonempty (B_C -> Y) (Nonempty Y suffices), after which the stated theorem and existing owner give its separation conclusion. No new theorem should be required to prove an unguarded false extension statement."
