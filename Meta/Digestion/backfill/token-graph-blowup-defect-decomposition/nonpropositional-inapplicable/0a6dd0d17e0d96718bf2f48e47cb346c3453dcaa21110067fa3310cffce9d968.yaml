    justification: 'Additional-hypothesis convention, not a theorem asserting existence of a flat least eigenvector for every H: az=lambda*z and all coordinate moduli equal to one are assumed. The only normalization consequence, norm(z)^2=m on EuclideanSpace Complex (Fin m), follows directly from pinned Mathlib EuclideanSpace.norm_sq_eq, the assumed coordinate norms, and the finite sum of m ones (Fintype.card_fin). No project GID supplies a stronger existence assertion, and none is claimed. The distinction from mere least-eigenvector existence is a restriction of the admitted premise, not a proved availability claim. This settlement closes the premise/normalization convention only; it supplies no Boolean defect identity or density theorem.'
