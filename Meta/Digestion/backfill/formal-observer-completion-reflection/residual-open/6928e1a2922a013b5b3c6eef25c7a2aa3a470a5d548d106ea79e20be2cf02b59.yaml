  quarantine:
    justification: "将 atom 6928e1a2922a013b5b3c6eef25c7a2aa3a470a5d548d106ea79e20be2cf02b59（133. 自适应 prime-quantum 实验）作 multi-clause-guard：D5/S3/ConceptDynamics/ExperimentDesign/ThreeStateAdaptiveEarlyStopping.three_state_adaptive_early_stopping_strict_advantage 在与 CAS 相同的 0<epsilon<1/2 下，以 Option Bool 和质量 (1-2epsilon,epsilon,epsilon) 的固定两读出模型，第一主合取项给先验非负归一化，第二、第三项给静态与自适应 transcript 均 Injective，第四项给所有长度<=2 且确有长度 2，第五至第七项给静态期望 2、自适应期望 1+2epsilon 和严格小于静态，完整携带首段的这个例子。未携带逐项为 a_t=(p_t,k_t,b_t,I_t,Phi_t) 的 prime/precision/basis/instrument/动力学准备动作类型及意义；量子状态或通道 theta 的历史条件分布 pi_t(theta)=P(theta|h_t)；由 posterior 和剩余 fiber 选择 prime-time 动作的 policy；满足风险阈值时停止的具体规则。owner 只有固定 Bool 分支和三个 Real 权重，没有相应动作、量子似然、历史 posterior、风险或阈值参数，其一次停止不等于后验风险停止。scope 上 source 后半段没有限定 Theta 有限或量子维数有限，不能借近似承载者增加这些假设，也没有声称所有量子模型均获得相同严格期望优势或必定有限时停止。near misses：D5/S3/Estimation/DataProcessing/AdaptivePosteriorPolicySufficiency.posterior_adaptive_policy_universal_sufficiency 在有限 Theta、joint、PMF kernel 及 Bayes 相容性前提下，从相同 posterior 得任意有限 horizon 后验策略的未来输出律和 Bayes value 相同，已有一般策略原理但没有本五元组与物理实验的连接；D5/S3/Estimation/DecisionRisk/PosteriorStoppingMapErrorBound.posterior_stopping_map_error_bound 以 stoppedHistoryLaw、posteriorAtStop、MAP 及每个已停止历史达到阈值为假设才界定错误概率，没有构造本 source 的停止事件或后验来源；D5/S3/Quantum/Measurement/FiniteKrausInstrumentBornMarginal.finite_kraus_instrument_born_marginal 在有限归一化 Kraus instrument 上给分支 trace=Born probability，没有动作/后验/策略/阈值的合成。按 digest 搜 prime-quantum、instrument、posterior、adaptive policy、stopping 后逐项读取这些命中，再按 prime/quantum 动作定义及 policy 与 Instrument/Kraus/PrimePower、posterior 与 DensityState/QuantumChannel 的结论形状搜索，未定位到所需实例连接；检索范围内的未命中不证明所有表达方式均不存在，零概率历史和风险语义仍为 ASSUMED-UNVERIFIED。已覆盖同族 f43dd2195ee0b016f64aee8591c576599884881b727e7e7c36d92d01220c24ba 只有三状态精确识别、最坏深度及期望优势，没有上述四组量子扩展子句，本 atom 不得复用那条覆盖；另一个已覆盖 91b72c4886943dee61e962b421c5f96ca80f32d54481bfc77b7bbfab9dab43f2 使用 1+epsilon 而非 1+2epsilon，缺少参数与模型识别时也不能直接套用，账面状态不替这些区别作证明。"
    reentry_condition: "再入可提供一条实质的 prime-quantum 实验 content 定理：定义合法动作五元组及各坐标的物理/数学实现、候选状态或通道与历史似然，证明在明确的可条件化历史上 posterior 确为条件分布，并给出由该 posterior/剩余 fiber 选择下一动作及达到指定风险阈值时停止的规则与相应正确性，同时在公开陈述中保留原三状态例子的精确识别、最坏深度和 1+2epsilon<2。若采用有限 Theta 或有限 Kraus 模型，须证明它承载 source 的实际适用域，或先拆分/修订 source，不能以未提供的有限性、Bayes 相容性或已达到停止阈值假设替原句作答；不得扩张为原文没声称的普遍均值优势或无条件终止。预登记实际量子似然到历史 Bayes 更新/风险判据的非平凡实现证明为 5⁗ 逃逸见证，核验其在已 elaborate 依赖闭包与活推导路径中不可被冻结定理的实例化、投影和合取替代，然后由 orchestrator 逐条 re-cover。另一条路径是把三状态数值例子拆出按现 owner 绑定，把五元组、条件 posterior、动作选择和阈值停止另作具名数学义务；定义和研究方案性文字按其真实类别显式处置，不能单独包装定义或拼接现有 posterior/instrument 定理来凑 deposit。"
