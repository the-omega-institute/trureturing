  quarantine:
    justification: "对 CAS atom fae2b1691e28152f5a58aa12c73064930a176c86a764b98c84b3ecd0d579d47b『有限集合实例』设置 multi-clause-guard。已携带的是有限观察历史部分：冻结 GID D5/S3/Observer/Separation/FiniteHistoryStability.finite_history_stability 的第1项为 R_(m+1) <= R_m，第2项为 c_m <= c_(m+1)，第3、4项为 R_d = R_infinity 及 d <= n 时 R_n = R_infinity，第5、6项为 d <= c_d-c_0 <= |X|-c_0，d 是 observationStabilityDepth。该签名只要求 [Fintype X] 和 update : X -> X、readout : X -> Q，允许空 X、无限 Q 和非满射 readout；不能把前置模块的非空、有限输出、满射限制误归给此 owner。未携带的子句分别为：(a) 任意 partition 的绝对类数 <= |X|，此公开包只有 Nat 减法差额界，不能仅凭该差额界直接宣称绝对类数界；(b) 每次严格精化至少增加一个类，公开第2项只有 <=，类型没有 coarse/fine/StrictlyRefines 参数；(c) 任意严格精化链的增长次数有限，owner 只量化同一 update/readout 生成的历史链。精确增类声明实际位于冻结 GID D5/S3/ConceptDynamics/Refinement/StrictRefinementBound.range_card_strictly_increases，其 [Finite X]、StrictlyRefines coarse fine 假设推出 Nat.card(range coarse) < Nat.card(range fine)；同模块 strict_refinement_steps_le_card_sub_initial_image 则给出一般链的 steps <= |X|-|range(readout 0)|，两者均没有无限未来关系等式，不能与主 owner 合拼为单条覆盖。其它 near misses 是 D5/S3/Observer/Separation/FiniteObservationRefinementBound.finite_observation_refinement_and_stability_bound，另加 [Fintype O]、[Nonempty Y] 和 readout 满射，且绝对类数界 class_count_le_state_count 是 private；D5/S3/Observer/Budget/FiniteFutureSplitBudget.finite_future_split_budget 只给组合对数与类数亏额两个步数界；D5/S3/Observer/Prediction/FiniteStabilityClassBound.finite_stability_class_bound 只给历史稳定及无限未来商类数差额，不含一般严格增类蕴含。检索以 D5 的 finite/refinement/class-bound digest 粗筛并核对 StrictlyRefines、Nat.card(Set.range ...) 和 observationClassCount 的结论形状；这不是声称仓库缺少严格精化概念。已覆盖同族 fc9cc27bc8352c03d1d038c89545fcb2080670271b88bdf9225bb441cf5794a5 只断言有限历史达到无限未来关系；bed2bb6e1ae36a2579f8e1862ea93a35b4e627fb2d8bcc747374e65149f205fe 另断言历史稳定与差额界；本 atom 多出 (a)、(b) 的一般子句，故本 atom 不得复用那两条覆盖。"
    reentry_condition: "由 dispatcher 组织 source 拆分并重新摄入：把固定 update/readout 的有限历史细化、达到无限未来关系、稳定深度与类数差额界拆成一个可直接绑定 D5/S3/Observer/Separation/FiniteHistoryStability.finite_history_stability 的 atom；把任意 partition 的绝对类数界、StrictlyRefines 的逐步严格增类、一般严格精化链步数界分别拆为独立 atom，逐项核对公开载体，其中增类和链步数可分别核对 StrictRefinementBound.range_card_strictly_increases 与 strict_refinement_steps_le_card_sub_initial_image，绝对类数界不得引用 private helper。若坚持原 atom 不拆，须有一条公开 content 定理在不增加 source 假设的前提下同时陈述上述全部项，并为首次冻结预登记、验证符合 CLAUDE.md 5⁗ 的活推导路径逃逸见证后再 re-cover；单纯把现有 GID 合取打包属于 bind-only，不能把该打包本身当作逃逸内容。"
    blocker_class: multi-clause-guard
