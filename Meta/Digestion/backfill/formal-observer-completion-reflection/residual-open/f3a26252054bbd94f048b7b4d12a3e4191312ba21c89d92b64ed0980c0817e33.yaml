  quarantine:
    justification: "对 CAS atom f3a26252054bbd94f048b7b4d12a3e4191312ba21c89d92b64ed0980c0817e33『原理81.1（Born 配对）』设置 multi-clause-guard。主冻结 GID D5/S3/Quantum/FiniteDimensional.born_probability_skeleton 在有限复矩阵、rho.PosSemidef 和 Matrix.trace rho=1 下，公开第1项为 bornProbability rho 1=1，第2项为对任意矩阵 P,Q 的二项可加，第3项只在 star P=P、P*P=P 时给非负；bornProbability 的独立冻结定义为 trace(rho*P)。这些假设在 source 对有限维投影骨架的说明中已经出现，故只将该明确子句列为已携带。纯态秩一约化由另一冻结 GID D5/S3/Observer/BornReduction.rank_one_pure_state_modulus_square_reduction 携带，其两条 rank-one 表示假设推出 recordWeight=复数嵌入的模平方；签名没有额外向量归一假设。这是分散承载，不是单一覆盖。未携带逐项为：(a) 一般效果的非负性，因一般 0<=E<=I 不要求幂等，而主 owner 要求幂等；(b) 每个设置的 sum_a p(a|x,rho)=1，因主 owner 没有设置、结果族或完备性 binder，p(I)=1 不能直接替代该结论，且 CAS 未明确求和论域和 sum_a E_(a|x)=I；(c) 状态仿射性，因主 owner 固定 rho；(d) 完整效果参数的仿射性，因二项可加没有标量混合律；(e) 将混态概率、纯态约化及双边仿射性同时陈述的一条公开定理。near misses：D5/S3/Observer/Conditioning.recordWeight_sum 只对 IsRecordMeasurement 的有限完备正交投影族证明权重和等于 trace；D5/S3/Observer/Conditioning/RankOneBornPairingWeight.rank_one_born_pairing_weight 额外限定纯态与秩一分支，三项只有模平方、trace 配对和 unread 条件混合；D5/S3/Quantum/Measurement/FiniteKrausInstrumentBornMarginal.finite_kraus_instrument_born_marginal 只有规范化 Kraus 构造的分支 trace 等于 effect Born 权重；D5/S3/Quantum/Completion/OperationalReadoutQuotientRepresentation.operational_readout_quotient_representation 第3项确有 DensityState 混合的 readout 仿射等式，不能声称仓库没有状态仿射性，但它没有 (a)、(b)、(d) 与纯态约化的公开合取；D5/S3/Quantum/Measurements/VisibleStateSpaceDimension.visible_state_space_compact_convex_dimension 给的是读数像紧凸性与维数，不是这些概率恒等式。以上候选来自 born/effect/affine/measurement 的 digest 与 trace、smul、bornProbability、recordWeight 的形状检索，均已读取公开陈述。已覆盖同族 atom 94a6a295b48d6a63bf435348090cdae5efe3215b86f279a5531663ffe88a3dd6 只有秩一约化、配对角色和未读混合，本 atom 还要求 (a)-(d)，故本 atom 不得复用那条覆盖。"
    reentry_condition: "由 dispatcher 拆分 source：有限维 PSD 迹一状态的投影骨架、纯态秩一约化、一般完备效果族的概率性质、状态仿射性、效果仿射性各自成为可独立核对的 atom；前两项分别核对 born_probability_skeleton 和 rank_one_pure_state_modulus_square_reduction，一般效果族须先明确结果集合、0<=E<=I 与 sum_a E_(a|x)=I，不能用正交投影前提代替一般效果。状态仿射性可先核对 OperationalReadoutQuotientRepresentation 的同域读数律。若不拆，须提供一条公开 content 定理同时包括 trace 配对、所有合法混态及完整效果族上的非负/归一、两个参数各自的仿射等式和 pure/rank-one 的模平方约化，所有额外条件都须来自澄清后的 source；首次冻结前还须预登记并验证符合 CLAUDE.md 5⁗ 的活推导路径逃逸见证，然后 re-cover。仅合并现有骨架、rank-one 定理及 trace 线性包装不构成逃逸内容。"
