    justification: Upstream-only / all-bind-only under CLAUDE 3.2, with zero new Lean. The full Theorem 2.1, including its three actual-factor branches and critical-exponent conclusion, follows by the following explicit correspondence to existing Lean List/Finset and pinned mathlib primitives, not from a missing compiled project GID. For an arbitrary palindrome p of length at least two write p=[a,b]++q. List.Palindrome.reverse_eq and List.reverse_cons/append_assoc give p=reverse(q)++[b,a]. If a is in S, writing p=[a]++u gives p[a]p=reverse(u)++[a,a,a]++u. If a is not in S, Finset.card_sdiff_of_subset and Finset.card_eq_one applied to S subset B and card S=card B-1 identify B minus {a} with S. Thus when b=a, pp=reverse(q)++[a,a,a,a]++q; when b differs from a, b is in S and p[b]p=reverse(q)++[b,a,b,a,b]++q. These equations instantiate the existing List.IsInfix existential append definition and infix transitivity, so every claimed short word is a factor of the actual infinite x from the original occurrence assumptions, not a standalone model word. List.hasPeriod_iff_getElem? reduces the length-three/four constant words to positive least period one, and the length-five alternating word to period two with period one excluded by a!=b; the least-positive-period characterization and finite index normalization give exponents 3,4,5/2. Membership of each actual factor in the defining critical-exponent supremum then gives E(x)>=5/2. The complete arbitrary-p inference uses only these reverse/append identities, finite-set cardinality, explicit finite-position normalization and supremum projection; no new non-normalization escape witness is identified. This is a source-level reuse classification and accounting receipt, not a compiled proof or an assertion of a new frozen theorem. It does not settle the adjacent morphic fixed-point or asymptotic-exponent claims, does not assume richness, and adds no word framework, coverage GID or numerical-instance wrapper.
