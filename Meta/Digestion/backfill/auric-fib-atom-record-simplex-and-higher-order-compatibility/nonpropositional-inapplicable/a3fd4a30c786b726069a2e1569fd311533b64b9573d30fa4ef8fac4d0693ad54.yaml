    justification: Pure pinned-upstream reuse of the complete original theorem 14.1 under its unchanged governing context 1acefe307200a6985959b47193e51ae4723e6c545e2a829874631b4a24cc7248. No frozen project GID supplies this whole atom's probability-law, moment and pairing claims. D5/S3/Arith/FibonacciAtomic/LiteralWindowEnd.Window, .bits, .first and .last (module statement_id sha256:cb846093e952f2dd142e840b5ba2ec0fa76ecc9e282397d2b26d8c8e0db8a7a1) supply only the existing actual label carrier and its defining occupancies, not coverage of these claims. In source order (zero,low,middle,high,ends), the unchanged weights are (1-X-Y-Z+k,X-k,Z,Y-k,k), x=first, y=last, z=the middle-bit indicator, and the shifts are (0,u,w,v,u+v). Their finite enumeration, nonnegativity and total mass one at every feasible k, including zero weights at the endpoints of the nondegenerate feasible interval, are definitional and finite-sum normalization of the supplied model. No label-execution, native realization or acquisition conclusion is used. All proposition clauses reuse Mathlib at lake-manifest.json revision 56a005855ea17e0b0958f73ec801ae140b0a1679 with leanprover/lean4:v4.35.0. PMF.ofFintype, PMF.map_ofFintype, PMF.toMeasure.isProbabilityMeasure, ProbabilityTheory.IndepFun.map_prod_eq_prod_map_map, MeasureTheory.Measure.prod_sum_left, MeasureTheory.Measure.dirac_prod, MeasureTheory.Measure.prod_smul_left, MeasureTheory.Measure.map_sum, MeasureTheory.Measure.map_smul and MeasureTheory.Measure.map_map give the actual independent-label/noise record R=xu+yv+zw+Xi as the five translated-noise mixture in Euclidean dimension D>=1. The common noise probability law is fixed independently of k. MeasureTheory.charFun_map_const_add, MeasureTheory.charFun_zero, MeasureTheory.continuous_charFun and MeasureTheory.Measure.ext_of_charFun give its four-corner difference factor. Module.Dual.exists_forall_ne_zero_of_forall_exists and inner_self_ne_zero supply one common direction a with both inner products nonzero when u and v are nonzero; HasDerivAt.ofReal_comp, HasDerivAt.cexp, HasDerivAt.eventually_ne, eventually_ne_nhds, Filter.Eventually.exists and nhdsGT_neBot supply a sufficiently small nonzero frequency where that factor is nonzero. Finite-sum algebra then gives family constancy iff u=0 or v=0, and separation of every distinct feasible pair otherwise. This includes collinear or opposite u,v, coincident shifts and arbitrary w, without moment, Gaussian or globally nonvanishing characteristic-function assumptions. Under exactly the additional zero-mean and finite-second-moment noise assumptions, MeasureTheory.MemLp.of_bound, MeasureTheory.MemLp.comp_fst, MeasureTheory.MemLp.comp_snd, MeasureTheory.MemLp.add, MeasureTheory.MemLp.continuousLinearMap_comp, MeasureTheory.MemLp.integrable and MeasureTheory.MemLp.integrable_mul supply the L2/L1 and coordinate-product obligations. MeasureTheory.integral_finsetSum_measure, MeasureTheory.integral_smul_measure, MeasureTheory.integral_map, MeasureTheory.integral_dirac and ProbabilityTheory.covariance_eq_sub reduce the mean, second-moment and covariance formulas to the unchanged five weights. hasDerivAt_const, hasDerivAt_id, HasDerivAt.const_mul, HasDerivAt.add_const, HasDerivAt.hasDerivWithinAt and HasDerivWithinAt.congr give the constant mean Xu+Yv+Zw, second-moment and covariance slope uv^T+vu^T, and the nonzero quadratic-readout slope 2(a^T u)(a^T v) for the same a, with derivatives within the feasible domain at its endpoints. No law outside the feasible probability domain is assumed. The original pairing clause retains only L1 noise, the supplied integrable products, pairwise noise independence, zero means and independence from the relevant labels. ProbabilityTheory.IndepFun.comp, ProbabilityTheory.IndepFun.integrable_mul and ProbabilityTheory.IndepFun.integral_mul_eq_mul_integral, together with PMF.map_ofFintype and the same map/integral identities, give the full individual marginal laws depending only on X and Y and