    justification: 钉版 Mathlib 56a005855ea17e0b0958f73ec801ae140b0a1679 的既有声明闭合本项。标准二维 Pauli 矩阵和四个归一化符号向量定义 rho、E 与 q。Real.sq_sqrt、Real.sqrt_pos 给出归一化，Matrix.posSemidef_conjTranspose_mul_self 与 Matrix.PosSemidef.smul 通过精确 Gram 恒等式证明每个效应正半定；Matrix.mul_apply、Matrix.conjTranspose_apply 和 Complex.I_sq 的有限矩阵运算给出效应和为单位、复 trace 本身为指定实概率式，以及三个坐标的反演。未把实部等式代替完整 trace。 本完整子句仓内无可用冻结 GID；仅使用纯上游结算路线，零新增 Lean 声明。
