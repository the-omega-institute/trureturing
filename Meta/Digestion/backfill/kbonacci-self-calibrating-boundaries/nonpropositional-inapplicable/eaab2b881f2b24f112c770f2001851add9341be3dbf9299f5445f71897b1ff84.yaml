  nonpropositional:
    justification: 'All propositional clauses are supplied by pinned mathlib v4.33.0 (db584cd6d46c92f209a44c0f1c829460d327499d): Ideal.add_eq_sup, Submodule.mem_sup, Submodule.mem_iInf, Ideal.add_mem_iff_left, Submodule.sub_mem_iff_left and additive normalization. There is no available frozen project GID for this complete relation. Take R=Polynomial A for arbitrary CommRing A, r>=2, old ideals I_i (i<r), their intersection J, and one common old representative P0. mem_iInf and subtraction membership identify all old representatives as P0+J. add_eq_sup and mem_sup give u-P0 in I_new+J iff there are a in I_new and b in J with a+b=u-P0. The same x=P0+b satisfies every old coordinate and x-u=-a in I_new. Conversely a=u-x and b=x-P0 give that decomposition from a common extension x. Any other old representative P0prime differs from P0 by an element of J, hence of I_new+J; add_mem_iff_left/sub_mem_iff_left give representative independence. No comaximality, field, principal ideal, or pairwise CRT assumption is added. The final paragraph states the boundary against replacing the intersection by pairwise sums and refers to the separate Chapter 8 counterexample; that counterexample is not settled here. No new Lean.'
