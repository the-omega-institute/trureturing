    justification: "Upstream-only bind-only inference at mathlib 56a005855ea17e0b0958f73ec801ae140b0a1679 (Lean v4.35.0); no project GID owns the complete arbitrary-field equivalence. For every field K, n>=2, symmetric H, prescribed j and lambda, Matrix.eval_charpoly and Matrix.exists_mulVec_eq_zero_iff convert each characteristic root to a nonzero kernel witness for S=lambda*I-H and its actual principal submatrix on {i // i != j}. Forward: restrict a nonzero kernel vector whose j coordinate is zero; subtype sum decomposition preserves the kernel equation and nonzeroness, and the same upstream criterion yields both roots. Reverse: bind x!=0 in ker S and v!=0 in the deleted kernel; extend v by zero using Function.extend Subtype.val v 0. Function.Injective.extend_apply / Function.extend_apply' and Fintype.sum_subtype_add_sum_subtype give y!=0, y j=0 and S*vec y=Pi.single j gamma, where gamma=(S*vec y) j. Matrix.IsSymm.sub/smul and Matrix.IsSymm.dotProduct_mulVec_comm, followed by dotProduct_single and field normalization, give x j*gamma=0. For gamma=0 select y; for gamma!=0 select x. This uses existing existential witnesses, coordinate substitution, logical selection and finite-sum/field normalization; it adds no independently nonbinding fact, does not assume simplicity, real/Hermitian positivity, algebraic closure or characteristic different from two. Existing project private forward lemmas are not claimed to cover the converse. No new D5 declaration, first freeze or coverage GID is introduced. This digestion receipt is not a new Lean proof or current exact-application compilation."
