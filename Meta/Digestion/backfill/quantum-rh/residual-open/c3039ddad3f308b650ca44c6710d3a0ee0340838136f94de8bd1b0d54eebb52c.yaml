  quarantine:
    justification: 'A probe seat closed all three clauses against the pinned library in 554 seconds and stopped without a module, so an independent first freeze is not available under CLAUDE.md 3.2. Clause 9, that an instruction is executable exactly when the exponent vector dominates the denominator, closes in one term: exact hc.symm.dvd_mul_right.trans (Nat.factorization_le_iff_dvd hv hn).symm, against Mathlib/Data/Nat/Factorization/Defs.lean:161. Clause 10, that execution translates the vector by the numerator minus the denominator, closes against factorization_mul at the same file line 155. Clause 11 is stated as the set identity D_i equals the dominance region of v_i minus the union of the earlier ones, which is definitional unfolding: the probe closes it with simp only over Set.mem_sdiff and Set.mem_iUnion. The orchestrator proposed clause 11 as the escape witness on the reading that instruction priority carries operational content; the formal statement carries none, and the probe source is the evidence. Third-party Lean formalizations of FRACTRAN exist and were located by the same probe: pimlu/fractran, whose tree holds fractran-lean/Fractran/Basic.lean, and sanchace/FRACTRAN. Under spec A17.2 an exact third-party hit admits only dependency or transplant, never reproof.'
    reentry_condition: Reopen only if one of these appears. A content module elsewhere needs these three statements as named companion results, in which case they land inside that module under CLAUDE.md 3.2 exit b rather than on their own. Or the source volume advances past the one-step characterization to a claim that is not definitional, for instance a reachability or halting statement over programs rather than over a single instruction. Or a decision is taken to depend on or transplant one of the two third-party carriers, which requires carrying its full license text and is a separate question from this record.
    blocker_class: multi-clause-guard
