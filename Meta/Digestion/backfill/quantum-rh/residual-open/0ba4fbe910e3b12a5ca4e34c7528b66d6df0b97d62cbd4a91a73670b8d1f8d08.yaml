  quarantine:
    justification: "Read-only reassessment at HEAD=origin/dev=685e83157841d6151cd3f8c754af6acd33014aca. The actual YAML and CAS, QUANTUM-RH.md 17595-17755 and 17750-17965 were read. They fix a(n)=ArithmeticFunction.vonMangoldt n-1 for positive integers, the exact real dyadic-window weights, and the requested constant term. coverage_gids is empty; receipts contains no cover_disposition; no chain_atoms is present. This is not a child-migration issue. No inspected frozen theorem supplies the actual centered second moment, the stated constant-order D_self expansion or its actual leading equivalent. (1) D5: a recursive search for 'vonMangoldt|chebyshevPsi|chebyshevTheta|primeNumberTheorem|prime.number.theorem|subexponential|polynomialGrowth|polynomial_growth|logarithmic.*energy|energy.*logarithmic' identified the zeta/PNT directories and related coefficient bridges. Declaration searches for PNT, Chebyshev, Mangoldt and psi, together with 'selfEnergy|self_energy|diagonal.*(asympt|constant)|polynomial.*energy|energy.*polynomial|off.?diagonal', did not return a concrete D_self theorem. StrongPNTPrefix was inspected via its full top-level declaration listing and its provenance header: it is explicitly only the prefix through ZerosBound; the remainder of StrongPNT and its MediumPNT import were not ported. Its declarations AnalyticOn.norm_le_of_norm_le_on_sphere, borelCaratheodory', DerivativeBound, LogOfAnalyticFunction and ZerosBound are complex-analytic estimates, not an asymptotic for Chebyshev.psi or a sum of squared von Mangoldt coefficients. Its frozen state has statement ID sha256:655f1370ecba2f879be0561bcdb4616c9c6c078bd0b440a1bbc2b5a515a34d5f. The recursive 'ChebyshevMertens|cheb1d|cheb2a' search found only the structure and its enclosing hypothesis bundle in D5/S3/Weil/ZetaCore/Hypotheses. Directly read ChebyshevMertens.cheb1d assumes sum Lambda(n)^2 <= C*x*log x; cheb2a assumes the different weighted estimate sum Lambda(n)^2/n=(log x)^2/2+O(log x). The module is frozen (sha256:8f329c6f0aeb1ab4b7fc77ee661625f25abbf81cd410343d897c183b345d1db5), but structure projections require a supplied ChebyshevMertens witness and do not establish the specific arithmetic premise. Even the displayed bounds have neither the unweighted second term -x nor an o(x) remainder. The comment about an upstream Chebyshev proof is provenance, not a local witness. ClassicExplicitFormula.vonMangoldt_div_sqrt was directly read; it only rewrites Lambda(n)/sqrt n as Lambda(n)*n^(-1/2). PrimeArchimedeanEnergyIdentity.prime_archimedean_energy_identity, also read, concerns a Weil test function and weighted translation energies, not the centered dyadic diagonal sum. None carries a complete clause merely because it contains a prime coefficient or an energy. (2) Pinned mathlib: manifest and actual package HEAD are db584cd6d46c92f209a44c0f1c829460d327499d. Recursive NumberTheory searches for 'prime.number.theorem|vonMangoldt.*(asymp|isLittleO|isBigO|tendsto|sq)|sum.*vonMangoldt|psi.*(isLittleO|tendsto)|chebyshev.*(asymp|tendsto)' found Chebyshev and LSeries helpers. The subsequent whole-Mathlib search 'vonMangoldt.*(square|second|centered)|centered.*[Mm]angoldt|sum.*[Mm]angoldt.*(sq|pow|asymp)|prime.number.theorem' returned only the Nonvanishing module's description of PNT prerequisites. Chebyshev.psi was read and has exactly the positive-integer Ioc 0 floor(x) indexing. Chebyshev.psi_le_const_mul_self gives psi(x)<=(log 4+4)*x for x>=0, not psi(x)=x+o(x). Chebyshev.isBigO_psi_sub_theta_sqrt, found in the declaration list, controls the difference between first-moment prime-power and prime sums, not the required second-moment expansion. ArithmeticFunction.vonMangoldt_apply_prime, vonMangoldt_apply_pow and vonMangoldt_le_log are pointwise facts; they do not give the asymptotic main term. sum_mul_eq_sub_sub_integral_mul was read in NumberTheory/AbelSummation.lean: it requires a differentiable weight and integrable derivative and expresses a weighted sum in terms of the actual partial-sum function; it does not establish that function's asymptotics. intervalIntegral.integral_one_div_of_pos was read and the FTC declaration integral_eq_sub_of_hasDerivAt was located. They support the final elementary integration only after the arithmetic remainder is controlled. In particular, the bare first-order PNT psi(t)=t+o(t) is not by itself enough for obtaining the constant second term by multiplying its endpoint error by log t; one needs sufficient quantitative decay or a direct second-moment theorem. (3) Network was available: NyxID/Tavily query 'Lean prime number theorem von Mangoldt square sum StrongPNT PrimeNumberTheoremAnd' returned classical prose pages (Wikipedia, Exeter, StackExchange and other PNT notes), none a Lean declaration. Requested query 'site:github.com \"PrimeNumberTheoremAnd\"', echoed as 'PrimeNumberTheoremAnd', found AlexKontorovich/PrimeNumberTheoremAnd, its Mertens issue 1330, Rectangle.lean, and math-inc/strongpnt. The first project describes formalizing PNT with a classical error term; the latter advertises a strong-PNT formalization. These are genuine upstream candidates to inspect, not evidence that the needed theorem is already in the pinned repository. Targeted extraction of the exact StrongPNT.lean revision 6a380f0c4658c04a420a9eb00b1ed62a1e3fde01 returned its file metadata, imports and opening analytic lemma, not the final PNT theorem or its proof closure; extraction of the guessed math-inc main/StrongPNT/PNT5_StrongPNT.lean URL returned 404, so no source content from that path is claimed. The initial search requests lacking explicit JSON Content-Type returned HTTP 422; corrected requests succeeded. The missing arithmetic prerequisite has the concrete statement, with proposed notation only: put S2(t)=sum n in Finset.Ioc 0 (Nat.floor t), (ArithmeticFunction.vonMangoldt n)^2 and psi(t)=Chebyshev.psi t, both as Real-valued functions of Real t. Require theorem mangoldt_second_moment_with_linear_term : ((fun t => S2(t)-(t*Real.log t-t)) =o[Filter.atTop] (fun t : Real => t)) AND ((fun t => psi(t)-t) =o[Filter.atTop] (fun t : Real => t)). These are conclusions about the actual arithmetic function, with no RH assumption and no assumed PNT/second-moment fields. A sufficiently strong pinned upstream PNT together with a proved partial-summation and higher-prime-power bridge is an acceptable way to produce this theorem; a wrapper merely assuming these two remainders is not. From it the independently defined B(t)=sum n in Ioc 0 floor(t), (Lambda(n)-1)^2 has B(t)=t*log t-2*t+o(t), since B=S2-2*psi+floor(t) and floor(t)-t=O(1). A new declaration that takes this B expansion as an input, defines D_self to equal the target expression, or assumes RH would respectively assume the arithmetic work, change the object, or strengthen an unconditional claim. New substantive estimates can establish it, but the inspected generic algebra and integral APIs do not supply them by naming or projection. ASSUMED-UNVERIFIED: no Lean/LSP elaboration, compiler, Lake, numerical experiment or repository gate was run; the proposed theorem syntax, floor/coercion bindings, sum-integral exchange and little-o transport have not been typechecked. The external final PNT declarations, proof/axiom closures, licenses and pin compatibility remain unverified. The zero-carrier judgment is limited to the actual search scope and statement reads, not an exhaustive semantic absence result."
    reentry_condition: Provide a frozen D5 theorem or pinned-library theorem proving, unconditionally for the actual Lambda=ArithmeticFunction.vonMangoldt, both (sum_(1<=n<=t) Lambda(n)^2 - (t*log t-t))=o(t) and (Chebyshev.psi(t)-t)=o(t) as real t tends to +infinity. A quantitative upstream PNT may discharge this after a proved Abel-summation and higher-prime-power reduction; the two desired estimates cannot simply be input fields. Define B(t) using the actual sum of (Lambda(n)-1)^2 over Finset.Ioc 0 floor(t), and expand it to S2(t)-2*psi(t)+floor(t). The new theorem and the floor bound give R(t)=B(t)-(t*log t-2*t)=o(t). Retain the actual weight W_X(n,n)=integral_(X..2X) 1_{x<n<=2x}/x^2 dx and D_self(X)=sum_(1<=n<=4X) (Lambda(n)-1)^2*W_X(n,n). Finite sum/integral interchange and the exact strict/non-strict endpoints give D_self(X)=integral_(X..2X) (B(2*x)-B(x))/x^2 dx. For every epsilon>0, R=o(id) supplies a threshold above which |R(t)|<=epsilon*t, hence the absolute remainder integral is <=3*epsilon*log 2 for every sufficiently large X; this proves o(1) uniformly over the moving interval. Integrate (log x+2*log 2-2)/x using the antiderivative (log x)^2/2+(2*log 2-2)*log x and intervalIntegral.integral_eq_sub_of_hasDerivAt, with derivative and interval-integrability obligations discharged. Expansion at X and 2X yields exactly (log 2)*log X+(5/2)*(log 2)^2-2*log 2+o(1). Finally divide by (log 2)*log X, use log 2>0 and log X tending to infinity, and obtain the atom's leading equivalent. Check the concrete arithmetic and weight bindings before a coverage claim.
    blocker_class: missing-prerequisite
