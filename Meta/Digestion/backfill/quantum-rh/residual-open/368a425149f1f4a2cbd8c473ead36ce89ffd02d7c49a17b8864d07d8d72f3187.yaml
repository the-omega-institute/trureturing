  quarantine:
    justification: "Read-only reassessment at HEAD=origin/dev=685e83157841d6151cd3f8c754af6acd33014aca. The actual YAML/CAS and QUANTUM-RH.md 15055-15330, 13300-13450 and 16075-16270 were read. The source uses actual primes, a fixed h>0, a signed piecewise-linear kernel, and cumulative energy on 0..L. The off-diagonal bound is one-sided; it is not an absolute-value bound. receipts has no cover_disposition and the entry has no chain_atoms, so no structural migration obstruction is being relabeled. coverage_gids is empty. The substantive conditional clauses are: the actual off-diagonal polynomial upper bound implies RH (including the quadratic special case), and the resulting RH forces linear total energy and the stated negative quadratic cancellation. No inspected frozen declaration establishes any of those actual-object implications. (1) D5: recursive searches for 'selfEnergy|self_energy|diagonal.*(asympt|constant)|polynomial.*energy|energy.*polynomial|off.?diagonal', for 'laplace.*(energy|mean|prime)|energy.*laplace|fixed.scale.*(mean|energy)|polynomial.*(rh|riemann|zero)|energy.*(growth|exponent)', and for 'limsup|subexponential|polynomial|growth.rate|growth.exponent|mean.square|diagonal|self.*term|Mertens' in the zeta/PNT directories produced adjacent Weil forms and finite zero-window criteria, not the source's E_h/Eoff_h growth bridge. D5/S3/Weil/ZetaBridge/PrimeArchimedeanEnergyIdentity.prime_archimedean_energy_identity and D5/S3/Weil/ZetaBridge/FixedScaleWeilQuadraticForm.fixed_scale_weil_quadratic_form were read. Their frozen states were read (statement IDs sha256:9092310d32c9920c1da92e037927e13434d3a5a71f2ab50dae10597a1fccd1bd and sha256:d62bd624a123df9d827e1d72205ba88d61ae907cf215223e94f5419ae1046dc6). They express a zero-side Weil form for a supplied WeilTestFunction, support bound and convergence premises, not the cumulative square of this prime-only filter. PrimeJumpDecomposition defines arithmeticJumpEnergy as a sum of Lambda(n)/sqrt(n) times translationEnergy f(log n), including prime powers; this is a different object from the pair sum weighted by log(p)log(q)/sqrt(pq). There is no proved identification of that form with the source energy in the inspected declarations. D5/S3/Weil/ZetaLinear/FiniteInversePoissonCriterion.finite_inverse_poisson_rh_criterion was inspected with its FinitePoissonWindow, inversePoissonSum and BoundedOnReal definitions. It concerns an arbitrary fixed finite reflected zero window and pointwise boundedness on all real times; it does not control an L-dependent cumulative prime energy or the infinite zeta-zero family. No truncation limit or actual-prime identity is supplied by that criterion. Its frozen state is sha256:ea1d1742d5554e2652394f368186e638ab6f0f41f07bd3f21e6d7585284e541d. D5/S3/Weil/ZetaBridge/RightHalfStripRiemannReduction.golden_right_half_strip_implies_rh was read completely and is frozen (sha256:0c230a6759a124696a2512db419424da8cec03eefde3f5514acdc29e7f51bce3). It proves RH from hRight excluding actual zeta zeros with 1/2<Re rho<1. This is a useful final reduction, but the atom's analytic work is precisely obtaining such zero exclusion from its concrete energy bound. Leaving hRight in the binder carries no complete clause here. The separate ChebyshevMertens search found cheb2a only as a structure field, not a proof of the actual prime-kernel diagonal asymptotic. (2) Pinned mathlib: manifest and package HEAD both give db584cd6d46c92f209a44c0f1c829460d327499d. The recursive query 'subexponential|polynomial.*energy|energy.*polynomial|off.?diagonal.*(zeta|riemann)|energy.*riemann|riemann.*energy' returned only explanatory uses of subexponential in Analytic/ConvergenceRadius and SpecialFunctions/CompareExp; no actual prime-energy theorem appeared. Direct inspection of Real.isLittleO_log_id_atTop and Real.tendsto_pow_log_div_mul_add_atTop supplies the scalar logarithm-over-linear limit. These facts do not connect a prime filter to zeta poles. LSeries/Nonvanishing provides riemannZeta_ne_zero_of_one_le_re, whose scope is Re s>=1, not the open right half of the critical strip. Chebyshev.psi_le_const_mul_self is only a coarse first-moment upper bound, not Ediag_h=(A_h/2)L^2+O_h(L). Generic positivity of a squared integral also contains no relation to RH. (3) Network was available. NyxID/Tavily query 'Lean Riemann hypothesis polynomial energy prime pair off diagonal Laplace' returned arXiv 2404.00583v1, Wikipedia/Clay RH descriptions, a Conrey survey and a social page; none displayed a Lean declaration for this filter. Requested query 'site:github.com Lean \"Riemann\" \"energy\"', echoed as 'Lean Riemann energy', found GitHub topic pages and ryanncode/tensor-sieve. A targeted extraction of the latter described p-adic shifts, combinatorial Laplacians and numerical spectral plots, not this piecewise-linear kernel or a checked energy-to-zero theorem. No theorem is attributed to that project on the strength of its prose. Initial requests lacking explicit JSON Content-Type returned HTTP 422 and supplied no search evidence; corrected requests succeeded. The concrete missing prerequisite is provisionally prime_window_energy_spectral_diagonal_bridge. Define e_h=Real.exp(h/2), let w_h be zero outside [0,4] and affine between the five knots with values (0,e_h,-1-e_h,1,0), and define k_h(s)=h*w_h(s/h). For each actual prime p put a_p=log p/sqrt p; D_h(T)=sum_p a_p*k_h(log p-T). Compact support makes the sum finite at each T. Let E_h(L)=integral_(0..L) D_h(T)^2 dT, Ediag_h(L)=sum_p a_p^2*integral_(0..L) k_h(log p-T)^2 dT, and Eoff_h(L)=sum_(p!=q) a_p*a_q*integral_(0..L) k_h(log p-T)*k_h(log q-T) dT, where the latter is an ordered-pair sum and the sums can be implemented over primes <=exp(L+4h) for L>=0. Put A_h=integral_Real k_h(s)^2 ds and Delta=sSup({0} union {abs(Re rho-1/2) | riemannZeta rho=0, 0<Re rho, Re rho<1}); adjoining 0 makes nonemptiness explicit and no maximum-attainment assumption is allowed. Require a frozen theorem, for every h>0, concluding: A_h=h^3*(e_h^2+(2/3)*e_h+1)>0; for L>=0, 0<=E_h(L) and E_h(L)=Ediag_h(L)+Eoff_h(L); (fun L => Ediag_h(L)-(A_h/2)*L^2)=O[atTop](fun L:Real=>L); Filter.limsup (fun L => Real.log(1+E_h(L))/L) atTop=2*Delta, with the boundedness obligations of this real limsup discharged; and RiemannHypothesis -> (fun L=>E_h(L))=O[atTop](fun L:Real=>L). These are conclusions for the fixed arithmetic definitions, not inputs named diagonalLaw, spectralLaw or rhLinear. This bridge is strictly prior to the atom's use of a one-sided bound on Eoff. Its nontrivial analytic content includes connecting the filter's Laplace transform to the actual prime logarithmic derivative, excluding cancellation at each right-half-strip zeta zero, and controlling the relevant infinite-zero and prime-power terms; a generic finite-window lemma does not supply those facts. A local theorem assuming the growth-index identity and diagonal/linear laws would only package missing concrete inputs; a record with RH as a field would assume the conclusion. Replacing actual primes by independent random coefficients or defining Eoff as a convenient polynomial changes the problem. New analytic proofs can establish the prerequisite, but it cannot be manufactured from the inspected conditional interfaces. ASSUMED-UNVERIFIED: no Lean/LSP elaboration, compiler, Lake, numerical experiment or repository gate was run; no analytic derivation of the source's growth-index theorem was independently proved in this seat; the proposed kernel, finite-sum realizations, limsup details, prime-power reduction and final composition are specifications, not checked Lean terms. Third-party full source, proof/axiom closures, licensing and pin compatibility were not audited. Zero-carrier confirmation is limited to the executed searches and actual statement inspections."
    reentry_condition: Provide and freeze a concrete D5 theorem, or provide a theorem in the pinned library, for the actual-prime definitions e_h=exp(h/2), w_h affine through (0,e_h,-1-e_h,1,0) at 0,1,2,3,4 and zero outside [0,4], k_h(s)=h*w_h(s/h), D_h(T)=sum_p (log p/sqrt p)*k_h(log p-T), E_h(L)=integral_(0..L) D_h(T)^2, and the corresponding diagonal and ordered unequal-prime-pair integrals. For h>0 it must conclude A_h=integral k_h^2=h^3*(e_h^2+2*e_h/3+1)>0, 0<=E_h=Ediag_h+Eoff_h on L>=0, Ediag_h-(A_h/2)*L^2=O_h(L), limsup_(L->infinity) log(1+E_h(L))/L=2*Delta, and RH -> E_h=O_h(L), where Delta is the supremum of 0 together with the absolute critical-line displacements of actual zeta zeros in 0<Re rho<1. The bridge must prove its arithmetic and analytic laws from those definitions, without assuming them or RH. Given it and the atom's eventual one-sided bound Eoff_h(L)<=C*(1+L)^A with real A>=0, replace C by max(C,0) if necessary and combine the diagonal estimate to obtain 0<=E_h(L)<=K*(1+L)^M for some K>=0, M=max(A,2). For sufficiently large L, squeeze log(1+E_h(L))/L between 0 and (log(1+K)+M*log(1+L))/L; use Real.isLittleO_log_id_atTop (or tendsto_pow_log_div_mul_add_atTop with n=1) to obtain limit and limsup zero. The certified identity gives Delta=0. A right-half-strip zero would have positive displacement <=Delta, so the resulting exclusion supplies hRight to D5/S3/Weil/ZetaBridge/RightHalfStripRiemannReduction.golden_right_half_strip_implies_rh. Use the bridge's RH implication to get E_h=O_h(L), then subtract its diagonal law through E_h=Ediag_h+Eoff_h to obtain Eoff_h+(A_h/2)*L^2=O_h(L). The special bound C_h*L^2 fits the premise with A=2 after enlarging its constant. Keep the hypothesis one-sided and h fixed; verify all concrete bindings before coverage.
