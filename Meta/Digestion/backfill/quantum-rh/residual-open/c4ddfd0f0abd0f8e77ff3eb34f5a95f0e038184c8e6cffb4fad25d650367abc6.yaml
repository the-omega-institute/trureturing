  quarantine:
    justification: "Read-only reassessment at repository HEAD 4d4d47682bb25506ff6b0b69c1bd58d05a0b4071: the CAS and residual-open YAML were read; coverage_gids, scribe and unresolved_subitems are empty, and receipts contain neither cover_disposition nor chain_atoms. This is a mathematical prerequisite gap, not an unclosed child ledger. (1) D5 search: actually ran rg -n 'Mertens|mertens|sum_prime_log|diagonalEnergy|diagonal_energy|w_E|J_h|linear.*integral|integral.*linear' D5 --glob '*.lean', the broader case-insensitive pattern 'affine.*(sq|square|integral)|integral.*(affine|interpol|sq)|piecewise.*(sq|integral)|diagonal.*energy|energy.*diagonal', and 'cheb2a|ChebyshevMertens' across D5. Read D5/S3/PrimeGaps/EulerProducts.lean and D5/S3/Weil/ZetaCore/Hypotheses.lean. The frozen EulerProducts GID, statement_id sha256:c338d1c3c7d23d86ff8f41544f0b2968f75d3b4162d278c200108e6a8710543f, contains LongGapsBetweenPrimes.sum_prime_log_div_le: for natural N>=1, sum over p in N.primesLE of log(p)/p <= log(N)+log(4). This carries only the upper half of the atom's complete two-sided real-cutoff Mertens clause; it has no bounded lower remainder. LongGapsBetweenPrimes.log_le_eulerProduct_one bounds an Euler product below by log(N), a different expression, and supplies no missing weighted-sum lower bound. Zeta23.ChebyshevMertens.cheb2a is a structure field asserting an O(log x) remainder for sum of vonMangoldt(n)^2/n over all n<=x. The D5 search found that structure and its input slot, not a proof constructing it; even a proved instance would additionally need removal of higher prime powers. Other integral-pattern hits concern different kernels or likelihood functions; no read declaration states the affine endpoint-square formula, this four-segment kernel norm, full-support response integral, prime-only log-square asymptotic, the two boundary estimates, or diagonal-energy asymptotic. (2) Pinned mathlib search: checked .lake/packages/mathlib at db584cd6d46c92f209a44c0f1c829460d327499d; rg with 'mertens|sum_prime_log|robin|5040|causal.profile|gamma_causal|r_J' in NumberTheory and Dynamics found no matching analytic theorem, and the whole-Mathlib name search added only irrelevant names and polynomial terminology. Read Chebyshev and AbelSummation candidates located by 'sum.*log|log.*sum|theta.*[Ll]og|isBigO', and Integrals/Basic candidates located by 'integral.*(sq|pow)|integral.*(add_mul|mul_add|affine)'. Chebyshev.theta_le_log4_mul_x and theta_ge give coarse theta bounds; isBigO_psi_sub_theta_sqrt compares prime-power and prime sums, and primeCounting_eq_theta_div_log_add_integral is a conversion identity. None states the required sharp coefficient-one Mertens remainder. sum_mul_eq_sub_sub_integral_mul is an exact Abel identity under differentiability and integrability assumptions, not an estimate on its prime coefficient sums. integral_pow evaluates monomials and can help prove the elementary affine-square identity after expansion and integral linearity; it does not state any of this atom's complete kernel or energy clauses. (3) Network access was available and used through NyxID/Tavily. Actual queries included 'Lean4 Mertens theorem sum log p over p formalization github', 'site:github.com Lean Mertens PrimeNumberTheoremAnd', and 'PrimeNumberTheoremAnd Mertens first theorem log prime github'. Results included rishigajjala/erdos-796-lean and AlexKontorovich/PrimeNumberTheoremAnd. Retrieved https://github.com/rishigajjala/erdos-796-lean, its docs/REFERENCES.md and lake-manifest.json: the README names Erdos796.mertensM_lt_933_div_1000, a bound on the Meissel-Mertens constant, while the references credit an imported Goldmakher/Abel route and the manifest pins PrimeNumberTheoremAnd to 80c12dfd932e99874e004d65537c57ef6421ff2b with mathlib v4.30.0. That is a useful upstream lead, not a verified weighted-prime theorem on our pin. A retrieval attempt for PrimeNumberTheoremAnd/Mertens.lean at that commit returned a GitHub 404 page, so no declaration was read there. Search also located upstream issue 1694 mentioning sum_prime_div_eq and reciprocal-prime bounds; these are a different weight and the issue text is not a checked proof. No external candidate was imported or treated as a frozen local carrier. (4) The central missing unconditional statement is: writing A(x)=sum over p in (Nat.floor x).primesLE of Real.log(p)/(p:Real), prove 'exists C : Real, 0 <= C and forall x : Real, 2 <= x -> abs (A x - Real.log x) <= C', with no RH, ChebyshevMertens instance, or remainder bound as a hypothesis. The source objects must also remain literal: E=exp(h/2); w_E is zero outside [0,4] and affine between node values (0,E,-1-E,1,0) at 0,1,2,3,4; k_h(s)=h*w_E(s/h); J_h is its unscaled square integral. Prove 'forall a b : Real, integral_0^1 (((1-t)*a+t*b)^2) dt = (a^2+a*b+b^2)/3', then J_h=E^2+(2/3)*E+1 and, for h>0 and 4*h<=log p<=L, integral_0^L k_h(log p-T)^2 dT=h^3*J_h. For the actual finite prime sum D_h(L)=sum_{p<=exp(L+4*h)} (log p)^2/p * integral_0^L k_h(log p-T)^2 dT, the target remainder is 'forall h>0, exists C_h>=0, exists L_h, forall L>=L_h, abs (D_h L - (h^3*J_h/2)*L^2) <= C_h*L'. The accompanying weighted-prime remainder and both endpoint bounds must be proved for these objects. (5) A short wrapper taking Mertens, kernel identities or the final remainder as fields would assume the missing conclusions; defining D_h directly as its claimed quadratic would change the original prime sum. Elementary polynomial integration is in principle provable from the library, but it does not fill the unconditional arithmetic gap. Zero complete carrier is confirmed relative to the actual search runs and declarations read, not as an impossibility claim. ASSUMED-UNVERIFIED: no compilation, elaboration or fresh axiom audit was run; no exhaustive search of all equivalent encodings was performed; the proposed Lean-like goals and compositions are not compiled; external snippets, declarations not retrieved, transitive proof closure, and compatibility of the v4.30.0 upstream dependency with our pin remain unverified."
    reentry_condition: Provide a frozen D5 or pinned-library theorem proving, for the actual prime sum A(x)=sum_{p in (Nat.floor x).primesLE} log(p)/p, 'exists C>=0, forall x>=2, abs(A(x)-log(x))<=C', without an analytic estimate supplied as an input. A proved uniform lower bound log(N)-C<=A(N), N>=2, is also sufficient when composed with LongGapsBetweenPrimes.sum_prime_log_div_le and a proved floor-to-real cutoff bound. Then apply pinned sum_mul_eq_sub_sub_integral_mul on [2,exp(L)], with c(n)=if n.Prime then log(n)/n else 0 and f(t)=log(t), discharging differentiability and integrability on the positive interval and accounting for p=2, to prove 'exists C>=0, exists L0, forall L>=L0, abs(sum_{p<=exp L} (log p)^2/p - L^2/2)<=C*L'. On the source-defined four-segment w_E with nodes (0,E,-1-E,1,0), E=exp(h/2), use integral_pow, integral linearity and interval splitting to freeze the full affine-square identity, J_h=E^2+(2/3)*E+1, and the change-of-variables formula integral_0^L k_h(log p-T)^2 dT=h^3*J_h when 4*h<=log p<=L. Prove the response square integral is between 0 and h^3*J_h for every p and vanishes outside the stated compact support. For fixed h>0 and L>=max(1,4*h), the finitely many p<exp(4*h) give a uniform initial deficit bound C0(h); Mertens gives A(exp(L+4*h))-A(exp L)<=4*h+2*C, hence the upper boundary weighted sum is at most (L+4*h)*(4*h+2*C), and its energy is bounded by h^3*J_h times this quantity. These frozen estimates yield the atom's O_h(1) initial boundary and O_h(L) final boundary, and composing them with the weighted-prime asymptotic yields abs(D_h(L)-(h^3*J_h/2)*L^2)<=C_h*L for all sufficiently large L. Reentry requires the actual definitions and the proved estimates, not a record of assumed remainder bounds.
