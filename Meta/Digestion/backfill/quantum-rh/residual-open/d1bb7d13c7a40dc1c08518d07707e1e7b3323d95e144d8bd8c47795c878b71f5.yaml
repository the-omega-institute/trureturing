  quarantine:
    justification: carried:本 PR 冻结的 D5/S3/Constants/Moments/CoefficientDrivenJacobiCharacteristicPolynomial.coefficient_driven_jacobi_characteristic_polynomial(statement_id sha256:5cdb63926b6c555ed7617ccaa94d8539c8c877d09b4c7d148c5910b2b052cc8e,冻结事件 sha256:1cd22d540f10e36b8ada8b8eb60420e16d8088bc9d02074070e50b15a4d4b26a)承载原文的这一段:「按 1,x,...,x^(d-1) 的顺序正交化,得到首一正交多项式 p_j。记 h_j=L(p_j^2)>0。乘以 x 在该基底中具有三对角形式……其中 beta_j=h_j/h_(j-1)>0。……乘法算子的特征多项式就是 q。」形式化经由显式的系数伴随算子、Gram-Schmidt 基、三对角矩阵、相邻系数 1 与 h_j/h_(j-1)、正性,以及 charpoly = q。逃逸见证是同模块内的具名中间命题族 orthogonal_power_basis_orthogonal、orthogonal_power_basis_monic、jacobi_tridiagonal、jacobi_subdiagonal_one、jacobi_entry_eq_inner_div 与 multiplication_matrix_charpoly,它们在公开证明第 336 至 365 行被逐条使用,处于活推导路径上;删去它们后,钉版 mathlib 的 gramSchmidt 与 LDL 只给正交化或分解,冻结的 D5 也没有对 q 的特征多项式识别,故不能靠绑定与规范化得到该 slice。 uncarried:原文本条还有七段本模块未承载:①「在 H_d^str 下,可以仅由 c_1,...,c_d,通过有限次四则运算、正平方根与线性方程求解,构造 w_1,...,w_(2d-1)>0」;②「使 P=C_w」;③「alpha_j=L(x p_j^2)/h_j」;④「定理 4 保证 q 的根全部为正,所以 K>0」;⑤「接着对这个正三对角矩阵作 Cholesky 分解」;⑥「w_1=alpha_0,w_(2j)=beta_j/w_(2j-1),w_(2j+1)=alpha_j-w_(2j),且正定性保证全部权重严格为正」;⑦「K=L_w L_w^T,从而 P(v)=det(I+vK)=det(I+v L_w^T L_w)=C_w(v)」。另有第八段是 G_d 半正定但不严格正定时的退化分支,原文自述可能需要断开的链、平方自由分解与显式保留重数,本模块亦未承载。 假设披露(席位主动申报,orchestrator 复核 Blueprint 确认):公开定理把乘法算子的自伴性作为显式前提 hSymmetric,并未由系数或矩量递推另行推导;Blueprint 中同样写明该前提。故本条承载的是「给定自伴性之后的三对角化与特征多项式识别」,不是「自伴性本身」。 scope gap:冻结定理量化的是给定严格正 Hankel 数据与自伴前提时乘法算子的矩阵形状与特征多项式;原文子句量化的是由系数出发构造全部 2d-1 个严格正权重并得到 P=C_w 的整条链,两者不是同一陈述,不能合报为整条覆盖。 near misses:席位在钉版 mathlib db584cd6d4 实跑 rg -n -i cholesky 加 gram 点 schmidt 加 jacobi 点 matrix 加 orthogonal 点 polynomial,只命中通用的 gramSchmidt 与 LDL.lowerInv_eq_gramSchmidtBasis 与 LDL.lower_conj_diag,未命中 Cholesky 或正交多项式与 Jacobi 特征多项式的定理;探针席在 D5 的 23041 行声明索引里精确命中 hankel_jacobi_coefficient_pos、finite_stieltjes_operator_realization、power_sums_determine_split_characteristic_polynomial,但它们分别只给行列式定义的 Hankel 系数正性、给定节点与权重的 Stieltjes 实现、以及两组谱幂和已在前提中相等时的 Newton 比较。 账目先决:实读该条目在 origin/dev 上 coverage_gids 为空、receipts 无 chain_atoms、无 quarantine、无 cover_disposition。 门的自动覆盖已被撤回:cover 的五项前置在本条上全部满足,故 make deposit 的内建 cover 把整条 atom 迁入 absorbed-closed 并写入整条覆盖边,门退出 0 而语法层多子句守卫未拒绝;这是同一形态第八次(前七次见 issue 5844),调用方据 origin/dev 逐字节还原该条目。 诚实边界:Lean 与 Scribe 由 codex 席位 impl-jacobi 产出,自报 make lean 退出 0 且 print axioms 只报 propext 与 Classical.choice 与 Quot.sound、无 sorryAx;逃逸见证与探针席在实施之前预登记的拟议见证一致;零评审席;orchestrator 未重跑 kernel、未重算公理闭包、未复跑上游检索。
    reentry_condition: 当出现一条冻结定理,其陈述为原文整条链——在严格正 Hankel 形式下仅由 c_1 到 c_d 经有限次四则运算、正平方根与线性方程求解构造出全部严格正的 w_1 到 w_(2d-1),并证 P=C_w——时重审。接线路径:本次冻结的 coefficient_driven_jacobi_characteristic_polynomial 提供由系数到 Jacobi 三对角矩阵与 charpoly=q 的一段;还需 ①由矩量递推推出自伴性,消去本模块的 hSymmetric 前提;②alpha_j 的表达式;③引定理 4 的根正性得到 K 正定(仓内对应载体是 D5/S3/Constants/NewtonHankelRealRootCriterion.negative_real_roots_iff_newtonHankel_posSemidef,已冻结);④正三对角矩阵的 Cholesky 分解;⑤权重递推与其严格正性;⑥det(I+vK) 到 C_w 的恒等式;⑦G_d 退化时的分支。不得以本 slice 直接覆盖整条 atom:deposit 门的自动覆盖曾在此写出一条不忠实的整条边,已由调用方撤回。
