    justification: carried:本 PR 冻结的 D5/S3/Constants/Moments/CoefficientDrivenJacobiCharacteristicPolynomial.coefficient_driven_jacobi_characteristic_polynomial(statement_id sha256:5cdb63926b6c555ed7617ccaa94d8539c8c877d09b4c7d148c5910b2b052cc8e,冻结事件 sha256:1cd22d540f10e36b8ada8b8eb60420e16d8088bc9d02074070e50b15a4d4b26a)承载原文的这一段:「按 1,x,...,x^(d-1) 的顺序正交化,得到首一正交多项式 p_j。记 h_j=L(p_j^2)>0。乘以 x 在该基底中具有三对角形式……其中 beta_j=h_j/h_(j-1)>0。……乘法算子的特征多项式就是 q。」形式化经由显式的系数伴随算子、Gram-Schmidt 基、三对角矩阵、相邻系数 1 与 h_j/h_(j-1)、正性,以及 charpoly = q。逃逸见证是同模块内的具名中间命题族 orthogonal_power_basis_orthogonal、orthogonal_power_basis_monic、jacobi_tridiagonal、jacobi_subdiagonal_one、jacobi_entry_eq_inner_div 与 multiplication_matrix_charpoly,它们在公开证明第 336 至 365 行被逐条使用,处于活推导路径上;删去它们后,钉版 mathlib 的 gramSchmidt 与 LDL 只给正交化或分解,冻结的 D5 也没有对 q 的特征多项式识别,故不能靠绑定与规范化得到该 slice。 第二承载者(PR lane/math/pf0907f):D5/S3/Constants/Moments/PositiveJacobiCholesky.positive_jacobi_cholesky(冻结事件 sha256:4cf140889a13bd53fa34a60194561d17924e684dd10e53e10c2db61a8b4d681c)承载原文的第 ⑤ 段「接着对这个正三对角矩阵作 Cholesky 分解」、第 ⑥ 段的权重递推 w1=alpha0、w(2j)=beta_j/w(2j-1)、w(2j+1)=alpha_j-w(2j) 及全部 2d-1 个权重严格为正,以及第 ⑦ 段中的 K=L_w 乘 L_w 转置 与 det(I+vK)=det(I+v L_w 转置乘 L_w)=C_w(v)。第 ④ 段**只**承载「正特征根蕴含正定」这一步谱论,q 在该层是 K 的特征多项式,根正性与矩阵对称性**明确作为前提**;席位并未调用 Newton 判据从 Hankel 或系数数据推出根正性,且已**移除未使用的 Newton import**,故第 ④ 段不是从系数前提去假设化的整句。逃逸见证是私有具名命题 jacobi_cholesky_weight_positivity(源码第 209 行):证递归主元与全部权重严格为正;公开证明第 293 行取其结论,第 337 行用于全部权重正性,第 356 行用于满足冻结的 forbidden_neighbour_determinant 的非负权重前提;其活路径经第 220 行的 jacobi_pivot_eq_cholesky_sq 按主元指标归纳,把主元识别为非零 Cholesky 对角元的平方。反事实:冻结前置只给**已给定权重**的行列式恒等式,钉版 mathlib 的 LDL 只给一般分解;两者都不给递归主元与分解主元的识别,不用该归纳就无法仅由实例化、投影与规范化证明递归差项为正、全部除数非零。承载来源如实说明:本模块由上一席被宿主 OOM 杀掉前留下的 112 行草稿续做;续做席保留了草稿的 LDL 构造与三对角强归纳框架,修正了 diagonal_transpose 的引理名与 sum_eq_single 分支,并如实记录草稿第一次实跑 make lean 返回 2、绝未把未验证草稿当作已通过。 uncarried:原文本条还有七段本模块未承载:①「在 H_d^str 下,可以仅由 c_1,...,c_d,通过有限次四则运算、正平方根与线性方程求解,构造 w_1,...,w_(2d-1)>0」;②「使 P=C_w」;③「alpha_j=L(x p_j^2)/h_j」;④「定理 4 保证 q 的根全部为正,所以 K>0」;⑤「接着对这个正三对角矩阵作 Cholesky 分解」;⑥「w_1=alpha_0,w_(2j)=beta_j/w_(2j-1),w_(2j+1)=alpha_j-w_(2j),且正定性保证全部权重严格为正」;⑦「K=L_w L_w^T,从而 P(v)=det(I+vK)=det(I+v L_w^T L_w)=C_w(v)」。另有第八段是 G_d 半正定但不严格正定时的退化分支,原文自述可能需要断开的链、平方自由分解与显式保留重数,本模块亦未承载。 假设披露(席位主动申报,orchestrator 复核 Blueprint 确认):公开定理把乘法算子的自伴性作为显式前提 hSymmetric,并未由系数或矩量递推另行推导;Blueprint 中同样写明该前提。故本条承载的是「给定自伴性之后的三对角化与特征多项式识别」,不是「自伴性本身」。 scope gap:冻结定理量化的是给定严格正 Hankel 数据与自伴前提时乘法算子的矩阵形状与特征多项式;原文子句量化的是由系数出发构造全部 2d-1 个严格正权重并得到 P=C_w 的整条链,两者不是同一陈述,不能合报为整条覆盖。 near misses:席位在钉版 mathlib db584cd6d4 实跑 rg -n -i cholesky 加 gram 点 schmidt 加 jacobi 点 matrix 加 orthogonal 点 polynomial,只命中通用的 gramSchmidt 与 LDL.lowerInv_eq_gramSchmidtBasis 与 LDL.lower_conj_diag,未命中 Cholesky 或正交多项式与 Jacobi 特征多项式的定理;探针席在 D5 的 23041 行声明索引里精确命中 hankel_jacobi_coefficient_pos、finite_stieltjes_operator_realization、power_sums_determine_split_characteristic_polynomial,但它们分别只给行列式定义的 Hankel 系数正性、给定节点与权重的 Stieltjes 实现、以及两组谱幂和已在前提中相等时的 Newton 比较。 账目先决:实读该条目在 origin/dev 上 coverage_gids 为空、receipts 无 chain_atoms、无 quarantine、无 cover_disposition。 门的自动覆盖已被撤回:cover 的五项前置在本条上全部满足,故 make deposit 的内建 cover 把整条 atom 迁入 absorbed-closed 并写入整条覆盖边,门退出 0 而语法层多子句守卫未拒绝;这是同一形态第八次(前七次见 issue 5844),调用方据 origin/dev 逐字节还原该条目。 诚实边界:Lean 与 Scribe 由 codex 席位 impl-jacobi 产出,自报 make lean 退出 0 且 print axioms 只报 propext 与 Classical.choice 与 Quot.sound、无 sorryAx;逃逸见证与探针席在实施之前预登记的拟议见证一致;零评审席;orchestrator 未重跑 kernel、未重算公理闭包、未复跑上游检索。 承载进度更新:第 ⑤⑥ 段与第 ⑦ 段的行列式恒等现已由第二承载者证出,第 ④ 段承载其谱论一步。仍未承载:①由 c1 到 cd 经有限次四则运算与正平方根构造全部权重的整条构造;②把原始系数定义的 P 与该行列式识别(即 P=C_w 整句);③alpha_j 的矩量表达式;④由 Newton 判据从 Hankel 或系数数据推出根正性,以及首一基 Jacobi 矩阵与对称平方根 Jacobi 矩阵的连接;⑦中 P(v)=det(I+vK) 的归一化与倒数多项式恒等;以及 G_d 半正定但不严格正定时的退化分支与重数保留。 第三承载者(PR 6004 落地 Lean 与 Scribe、本 PR 冻结):D5/S3/Constants/Moments/CoefficientMultiplicationTraceMoments(冻结事件 sha256:ea80e9f6934fbf60a4e9e7441351521be7f858c2303cdc8056dc08b316bbe503,模块 statement_id sha256:387a1805ef12dd72827ef874d8590eacfb09080f13f450aa55ff7946e6b5a47a)承载第 4 段所需的共享原始矩量接口,而非第 4 段整句。公开定理 coefficient_multiplication_trace_pow_eq_rootPowerMoment(statement_id sha256:18b7c25698b2b0d38518bac5bcc3ff06a3d924c36ac8313d441db330f6654173,源码第 174 行)证:对任意实系数多项式 q 与任意根列 roots 满足 q 复化后等于诸 X 减 C roots j 之积,对每个 n 都有 coefficientMultiplicationMatrix q 的 n 次幂的迹除以次数等于 rootPowerMoment roots n;不要求单射、实根、正性或非零根,重根按代数重数计入,指数含零。派席 brief 曾写设 q 首一,实施发现该假设多余并去掉,是加强而非偏离。其逃逸见证取第 5 撇 4 条第二形态:公开结论本身由具名构造 rootKrylov(源码第 108 行)产出,配三条证书 root_krylov_det(第 112 行,第 182 行消费)、root_krylov_intertwines(第 127 行,第 184 行消费)、root_bidiagonal_power_diagonal(第 158 行,第 189 行消费);活路径为行列式为一的 Krylov 矩阵把复化系数矩阵共轭成对角为根的双对角阵,再算其幂的迹。反事实由调用方自跑三条读数复核:coefficientMultiplicationMatrix 在 D5 中除其定义模块外零命中,即系数侧与根侧此前零类型化边;companion_trace_hankel_quadratic_identity 讲的是 Newton-Hankel 矩阵的二次型展开而非迹的幂,不是同一陈述;rootPowerMoment 只定义根侧的量,不给桥。故仅靠实例化、投影与规范化得不到本定理,所需的是一个保重数的相似变换。 第四承载者(PR 6013 落地 Lean 与 Scribe、本 PR 冻结):D5/S3/Constants/Moments/GramSchmidtCoefficientField(冻结事件 sha256:59db01d28f2ed50e2dc144bc7b1e3f673b3ce7ca5d89a0881f10c70483d7d0c9,模块 statement_id sha256:7a683775277e9c4358e5d5d61689ab15ff75634c2d12c93b8e954f55c4a8d4b9)承载第 1 段的坐标层归纳内核,而非第 1 段整条构造。公开定理 gram_schmidt_coordinates_mem_coefficient_field(statement_id sha256:934fd0274f3e32b79ab24cca07c6f2b1c48db995eeab9a19d59a977ee67694ff,源码第 88 行)证:在幂基的内积由 coefficientHankelValue 施于归一化迹矩量给出这一假设下,Gram-Schmidt 基在幂基下的每个坐标都属于 Subfield.closure 系数值域。首一与正次数假设经证明多余,已去掉。判形为 content 的理由是展开投影后归属性仍需对每个更早的 Gram-Schmidt 向量的归纳假设(含它们之间的内积),而枚举出的二十六条冻结公开声明不经绑定或一级规范化给不出该不变量;其直接冻结依赖只有两条定义 coefficientMultiplicationMatrix 与 coefficientHankelValue,零冻结定理依赖。该席被明确要求若发现需要第三承载者即停手不得重证,它两者皆未做,而是把迹与 Hankel 的恒等式收成假设 hinner 并写明应用边界:只持有根矩量的调用者须先补上迹与根的桥再应用本定理。故两个承载者正交,不重复。 该席同时明确不主张的事项如下,一并入账:不主张 alpha、beta 或 jacobiWeights 的子域归属;不主张标准正交坐标的域闭包或平方根闭包;不主张可执行有理表达式语法或独立的分母定理;hinner 与实内积空间是假设,并非由首一性或根假设构造得来。 选题过程如实记账:本轮由一个只读探针席对本 atom 剩余六条子句排序,该席枚举了六个相关文件共三十六条公开声明并逐条排除,判定其中五条为 bind-only,只有第 4 段与第 1 段的内核有内容;调用方原本倾向第 3 段的 alpha_j 矩量表达式,被该探针推翻。两次冻结时门的 cover 步均以 COVER_INVALID 拒绝并报 PLAYBOOK_DEPOSIT_FROZEN_UNCOVERED,故未写入任何 coverage 边,atom 仍为 residual-open。诚实边界:两个模块的 Lean 与 Scribe 均由 codex 单席产出,逃逸见证均与派席前预登记逐字一致;orchestrator 亲验两次 make lean 退出码 0、^error 行数 0、模块 sorry 计数 0、构建日志 sorryAx 出现 0 次、各条 print axioms 输出只有 propext 与 Classical.choice 与 Quot.sound;零评审席;未重跑 kernel、未重算公理闭包。 承载进度更新(第三、第四承载者后):第 4 段的共享原始矩量接口与第 1 段的坐标层归纳内核现已证出;仍未承载的是第 1 段由系数经有限次四则运算与正平方根构造全部权重的整条构造、第 2 段 P 等于 C_w 整句、第 3 段 alpha_j 的矩量表达式、第 4 段中 Newton 判据的应用与两种 Jacobi 矩阵的连接、第 7 段的归一化与倒数多项式恒等,以及 G_d 退化分支与重数保留;探针席判上述其中五项为 bind-only,按第 5 撇 4 条 c 款其合法出路是消化或写成有内容模块内的具名伴随引理,不是单独 deposit。
    reentry_condition: 当出现一条冻结定理,其陈述为原文整条链(在严格正 Hankel 形式下仅由 c_1 到 c_d 经有限次四则运算、正平方根与线性方程求解构造出全部严格正的 w_1 到 w_(2d-1),并证 P 等于 C_w)时重审。已承载的分段:由系数到 Jacobi 三对角矩阵与特征多项式识别(第一承载者)、Cholesky 分解与权重递推及其严格正性与行列式恒等(第二承载者)、迹矩量与根幂和的桥即第 4 段的共享原始矩量接口(第三承载者)、Gram-Schmidt 坐标落在系数生成子域的归纳内核即第 1 段的坐标层不变量(第四承载者)。剩余各段中有五项已被探针席判为 bind-only,判据写在 justification 末段,不应为它们单独派实施席。仍需的实质工作是把坐标层不变量推到 alpha、beta 与全部权重的子域归属并处理正平方根闭包,以及 G_d 退化时的断链、平方自由分解与重数保留。不得以任一单段直接覆盖整条 atom:deposit 门的自动覆盖曾在此写出一条不忠实的整条边,已由调用方撤回;本轮两次冻结时门均以 COVER_INVALID 拒绝、未再发生。
