    justification: Every quantitative clause of this proof is supplied by pinned Mathlib under the surrounding analytic boundary hypotheses a>0, F analytic on a neighborhood of the closed disk, F(0)=1, and f(t)=Re F(a*exp(it))>=0. Polynomial.leadingCoeff_le_mahlerMeasure, Polynomial.logMahlerMeasure_eq_log_MahlerMeasure and Real.log_nonneg give average(log norm P)>=0 for every monic complex P. MeromorphicOn.intervalIntegrable_log, Polynomial.intervalIntegrable_mahlerMeasure, AnalyticOnNhd.eqOn_zero_or_eventually_ne_zero_of_preconnected and ae_restrict_le_codiscreteWithin supply the log integrability and a.e. positivity needed by ConvexOn.map_average_le at exp, applied to log f + 2*log norm P. Nonzero f follows from AnalyticAt.harmonicAt_re and InnerProductSpace.HarmonicOnNhd.circleAverage_eq with F(0)=1. Average linearity, Real.exp_add, Real.exp_log and Real.exp_le_exp give both displayed inequalities. Polynomial.monic_X_pow_sub and le_csInf then give the common lower bound for the infimum for every N, including N=0; Function.Periodic.intervalIntegral_add_eq and Function.Periodic.intervalIntegrable₀ give the same normalized result on [-pi,pi]. No project GID supplies this analytic chain (仓内无 GID). This proof receipt asserts the displayed infimum argument, not attainment of the minimum in the preceding definition and not a proof of RH.
