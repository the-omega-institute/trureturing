    justification: 'Pinned Mathlib 56a005855ea17e0b0958f73ec801ae140b0a1679. Upstream declarations: LinearMap.smulRight_apply, Module.End.mul_apply, Matrix.vecMulVec_mul_vecMulVec, add_mul, mul_sub. Represent z phi_z by the rank-one endomorphism phi_z.smulRight z. Its square evaluates to phi_z(z) times itself and is zero by the alternating-form hypothesis. Expanding both (I+z phi_z)(I-z phi_z) and the reverse product gives I. The remaining sentences specify experiment/reset conventions and define D_z and nu(z), without an additional existence or recovery claim. Searched all D5 sources including private declarations by relation-collapse/irreflexivity, square-zero block and integer-power, rank-one trace and polarization shapes; read the relevant QuadraticForms, Observer, ObserverMemory and S0/Observation owners. No frozen declaration was found supplying an actual subgoal at the full stated commutative-ring or arbitrary-relation scope. Gerzon field-only weighted symmetric-form trace helpers do not cover arbitrary alternating rank-one maps over every commutative ring; MatrixTracePowerSum is size two, not the general block formula.'
