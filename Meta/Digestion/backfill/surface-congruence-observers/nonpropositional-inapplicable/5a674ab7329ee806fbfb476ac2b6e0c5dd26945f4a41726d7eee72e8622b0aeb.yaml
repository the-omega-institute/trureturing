    justification: 'Upstream-only bind-only proposition; not a claim that the source text lacks mathematical assertions. Pinned mathlib revision 56a005855ea17e0b0958f73ec801ae140b0a1679. Upstream declarations: derivedSeries, derivedSeries_succ, derivedSeries_normal, map_derivedSeries_eq, Subgroup.map_commutator, QuotientGroup.lift. The first and second derived subgroups are definitions. The quotient by the second derived subgroup kills its image, so the commutator of the quotient commutator subgroup is trivial by map_derivedSeries_eq and map_commutator; every homomorphism to a metabelian group kills the same subgroup and factors through QuotientGroup.lift. This is the maximal-metabelian characterization, not a new retained theorem. D5 search scope: D5/**/*.lean, including private declarations, searched by dihedral/cardinality/order, group-action orbit/stabilizer and normal set-product, derivedSeries/commutator/quotient, Goursat/simple normal image/joint range, and solvable-perfect subdirect-product shapes; relevant Observer/Dynamics, FiniteGroups/NikolovSegal, Combinatorics/GroupWords, ConceptDynamics/Faithfulness and ObserverMemory/Fusion hits inspected. No frozen theorem supplies an actual subgoal in these generic complete derivations.'
