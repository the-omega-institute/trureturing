    justification: 'Upstream-only bind-only proposition, not a statement that this mathematical text is nonpropositional. Pinned mathlib revision 56a005855ea17e0b0958f73ec801ae140b0a1679. Upstream declarations: Group.IsSolvable.solvable, map_derivedSeries_eq, Group.IsPerfect.derivedSeries_eq_top, QuotientGroup.congr, QuotientGroup.eq, Subgroup.mem_inf, MonoidHom.rangeRestrict_surjective. Apply map_derivedSeries_eq to both surjective projections of the actual joint image at the length supplied by Group.IsSolvable.solvable; Group.IsPerfect.derivedSeries_eq_top makes its perfect-factor projection all of P while its solvable-factor projection is trivial. Multiplication with a lift from the A projection gives the whole A times P, using no new induction. For the outer-action kernel, coordinate projection sends every common inner conjugator to an inner conjugator on A. Conversely, the assumed trivial outer action on P and an inner conjugator a on A supply witnesses a and p; the already established whole joint image contains (a,p), which conjugates both coordinates simultaneously. Characteristic projection kernels ensure these are the actual two coordinate actions. QuotientGroup.congr and QuotientGroup.eq express the induced quotient actions and equality modulo the intersection; Subgroup.mem_inf and product extensionality finish the equivalence. No topological orbit or mapping-class theorem is used. D5 search scope: all D5/**/*.lean including private declarations, searched for IsSolvable, IsPerfect, derivedSeries, commutator, simultaneous inner conjugators, characteristic quotient and subdirect product shapes; relevant Observer/Dynamics, FiniteGroups/NikolovSegal/Sections, SimpleSectionsOfProducts, MinimalNormalStructure and ConceptDynamics/Faithfulness modules inspected. Their surface-twist, simple-section and quotient-class results do not supply an actual subgoal of this generic solvable-perfect argument; no usable frozen GID was found.'
