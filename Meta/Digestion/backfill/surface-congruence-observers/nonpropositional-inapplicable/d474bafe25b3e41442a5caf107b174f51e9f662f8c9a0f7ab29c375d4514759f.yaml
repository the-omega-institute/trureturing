  nonpropositional:
    justification: 'Pinned Mathlib 56a005855ea17e0b0958f73ec801ae140b0a1679. Upstream declarations: SymplecticGroup.fromBlocks_mem_iff, Matrix.fromBlocks_multiply, Commute.add_pow, pow_add, zpow_negSucc, Matrix.charpoly_fromBlocks_zero₂₁, Matrix.charpoly_one, Matrix.trace, Fintype.sum_sum_type. Extend the supplied symmetric Q by zero to the full G by G upper block. The symplectic block criterion reduces to transpose Q=Q, and block multiplication gives U^2=0. The binomial formula Commute.add_pow with I and U leaves only powers 0 and 1; every k>=2 term is zero by pow_add and U^2=0. Applying the same formula to I-U, which is the two-sided inverse by block multiplication, and zpow_negSucc covers negative integers without a new induction. The diagonal blocks remain I, so block characteristic polynomials and the trace sum give (X-1)^(2G) and 2G. Searched all D5 sources including private declarations by relation-collapse/irreflexivity, square-zero block and integer-power, rank-one trace and polarization shapes; read the relevant QuadraticForms, Observer, ObserverMemory and S0/Observation owners. No frozen declaration was found supplying an actual subgoal at the full stated commutative-ring or arbitrary-relation scope. Gerzon field-only weighted symmetric-form trace helpers do not cover arbitrary alternating rank-one maps over every commutative ring; MatrixTracePowerSum is size two, not the general block formula.'
