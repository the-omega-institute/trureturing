    justification: 'Pinned Mathlib 56a005855ea17e0b0958f73ec801ae140b0a1679. Upstream declarations: Matrix.trace_add, Matrix.vecMulVec_mul, Matrix.trace_vecMulVec, Matrix.mulVec, Matrix.vecMul, Finset.sum_comm, Fintype.sum_sum_type. Expand (I+z phi_z)(I+U_Q), subtract the baseline, and use the zero diagonal of U_Q. The rank-one trace is phi_z(U_Q z). Expanding the supplied basis pairings and the b-coordinate projection gives exactly -sum_i sum_j nu_i Q_ij nu_j. Only finite-sum distributivity, index interchange and ring normalization are needed, over the original arbitrary commutative ring. Searched all D5 sources including private declarations by relation-collapse/irreflexivity, square-zero block and integer-power, rank-one trace and polarization shapes; read the relevant QuadraticForms, Observer, ObserverMemory and S0/Observation owners. No frozen declaration was found supplying an actual subgoal at the full stated commutative-ring or arbitrary-relation scope. Gerzon field-only weighted symmetric-form trace helpers do not cover arbitrary alternating rank-one maps over every commutative ring; MatrixTracePowerSum is size two, not the general block formula.'
