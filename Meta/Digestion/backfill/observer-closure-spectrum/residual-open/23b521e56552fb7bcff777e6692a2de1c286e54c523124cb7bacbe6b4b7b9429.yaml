    reentry_condition: "先给出覆盖原文所量化控制历史的类型化模型绑定，明确 Control/Public/Hidden/Ledger 的加法群、H/K/L 的加法同态、CovertThroat = H.ker.map K 以及原文 0 对应 ⊥，不得靠任意附加同态假设收窄原文。提供冻结的 D5 或钉版库定理，陈述为：在这个已绑定模型中，存在 f : H.range → Hidden 使每个 u 满足 K u = f (H.rangeRestrict u)，当且仅当存在 g : H.range →+ Hidden 使 K = g.comp H.rangeRestrict。由它与 D5/S3/Observer/Agency/PublicRecoveryCriterion.public_recovery_criterion 的前三项复合得到原文普通函数版本的三项等价，并由第四项得到加入账本后的核像包含。另给出原文实际历史系统的类型化记账映射 record : Hist → AuditedHist、遗忘映射 forget 和输运 before/after，证明 forget (record h) = h 且 after (record h) = before h；将 H、L、K 绑定到这些对象，明确作者/动作归因目标 A，证明新增观测的歧义对集合 {(h,h') | H h = H h' ∧ L h = L h' ∧ A h ≠ A h'} 包含于旧集合 {(h,h') | H h = H h' ∧ A h ≠ A h'}。这项关系包含可接 D5/S3/ConceptDynamics/SensorFamilies/PairReadoutKernelIntersection.pair_readout_kernel_eq_intersection；它与输运不变式共同补上历史解释。所有绑定与子句逐项具备后，再由 orchestrator 检查是否解除 quarantine。"
