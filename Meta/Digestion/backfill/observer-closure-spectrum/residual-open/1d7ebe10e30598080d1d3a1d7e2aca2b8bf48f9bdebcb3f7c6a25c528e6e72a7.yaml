    reentry_condition: "Freeze a theorem at general `H` and operator space `O` stating `[H,O] ⊆ O -> forall t, forall A in O, U_H(-t) A U_H(t) in O`, for example by an exponential-series or Lie-closure argument, then re-cover every clause of this atom."
