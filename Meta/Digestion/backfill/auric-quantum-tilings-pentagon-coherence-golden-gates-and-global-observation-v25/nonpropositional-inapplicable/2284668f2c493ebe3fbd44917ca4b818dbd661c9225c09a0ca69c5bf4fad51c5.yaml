    justification: "Pure upstream-only proposition settlement under SPEC 11.21; no usable frozen repository GID supplies the complete conjunction. Mathlib is pinned by lake-manifest.json to 56a005855ea17e0b0958f73ec801ae140b0a1679 (v4.35.0). The following is source-level instantiation/projection/normalization, not a freshly compiled Lean proof or a mathematical coverage edge. There are zero new or first-frozen D5 declarations and no D5 supplier dependency.\nPremises from definition 6.1 and proposition 6.3: complex inner-product input/output fibers, unitary transport U, the same unit input psi, real theta, z=Complex.exp ((theta:Complex)*Complex.I), x=U psi, y=z smul x. The specified balanced plus-port amplitude is (x+y)/2 with Born norm-squared readout. LinearIsometryEquiv.norm_map supplies norm(x)=1. For the source unitary matrix coordinates, Matrix.mem_unitaryGroup_iff', Matrix.star_mulVec, Matrix.dotProduct_mulVec, Matrix.vecMul_vecMul, EuclideanSpace.inner_eq_star_dotProduct and inner_self_eq_norm_sq rewrite star(U mulVec psi) dot (U mulVec psi) to star(psi) dot psi using U conjugateTranspose * U=1; taking real parts and nonnegative norms gives the same normalization. These are equivalent representations of the stated unitary premise, not an added assumption.\nComplex.norm_exp_ofReal_mul_I supplies norm(z)=1; Complex.exp_ne_zero gives z nonzero; Complex.exp_re with coercion/multiplication normalization gives z.re=Real.cos theta. norm_smul gives norm(y)=1. Projectivization.mk_eq_mk_iff' instantiated over Complex with v=y, w=x and scalar witness z gives equal rays; the norm-one endpoints are nonzero. The same substitution works for every nonzero input by injectivity of U; the zero vector has no projective ray.\nnorm_add_sq, inner_smul_right, inner_self_eq_norm_sq_to_K and norm_smul give inner(x,z smul x)=z and norm(x+y)^2/4=(2+2*z.re)/4=(1+Real.cos theta)/2 by scalar normalization. Division by 2 means multiplication by the scalar (1/2:Complex), whose squared norm supplies 1/4. The equal branch weights and readport convention are stipulated in the source; if the balanced splitter description is expanded, Real.sq_sqrt at 2 normalizes the product of its two 1/sqrt(2) factors to 1/2.\nFor actual normalized retained records r0,r1 in a complex inner-product space R, set g=inner(r0,r1) and use the same x and y in Aplus=(x tensor r0 + y tensor r1)/2. TensorProduct.inner_tmul and TensorProduct.norm_tmul together with norm_add_sq, inner_smul_right, inner_self_eq_norm_sq_to_K and norm_smul give inner(x tensor r0,y tensor r1)=z*g and Pplus=(1+(z*g).re)/2. Identical effective records r0=r1 of norm one give g=1 and precisely the coherent formula. Orthogonal retained records give g=0 and Pplus=1/2 independently of theta. This closes the archive cross-term clause in the actual joint vector, rather than inferring it from ray equality. Real.cos_zero and Real.cos_pi give plus probabilities 1 and 0 at theta=0 and theta=pi with the same U, psi and identical records, establishing that a phase can change the output, not that every phase does.\nCoherent elimination of distinguishing records is the source condition on the effective recombination state; no deterministic archive-only unitary merging orthogonal records is asserted. Orthogonal-record phase independence concerns the readport marginal, not all joint measurements. Without unit norm, norm preservation, balanced weights and this Born/readport model the displayed numerical probability is not claimed. The operational tail about external absolute time, port directions, path words, phase references, causal records and only substituting already equivalent paths states contextual scope; it asserts no additional physical-ontology theorem or arbitrary path equivalence. The specified source bytes have sha256 d3b4e9d70daa53328fcbaaf5177d2885aafcb86aeec57f7c060ed4e76f19a1c6."
