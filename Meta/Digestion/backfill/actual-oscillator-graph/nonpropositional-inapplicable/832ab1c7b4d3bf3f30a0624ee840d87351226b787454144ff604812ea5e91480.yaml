    justification: Definition 1.3 fixes positive physical parameters and defines the width, quadratic differential expression, physical Hermite formula, energies and probabilists Hermite convention; it asserts no eigenfunction, norm, orthogonality, totality or graph theorem. Reuse the public PhysicalHermiteTests.width and value with d, h := hbar, m and w := omega; SchwartzCutoffGraph.differential uses a j := h^2/(2*m j) and b j := m j*w j^2/2. The energy expression is the existing finite sum in PhysicalHermiteTests.physical_hermite_tests and PhysicalGraphClosure.physical_graph_closure. The displayed Hermite recursion and empty sum/product rules specify the polynomial and finite-index conventions, including d = 0, rather than a separate theorem. This settles the original definitions only; Hermite lowering, physical-basis properties and the explicit dimension-zero graph objective remain separate propositions.
