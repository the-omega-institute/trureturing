    justification: Definition 2.1 introduces the actual L2 Hilbert space, Schwartz embedding J, the operator S, its finite physical Hermite span restriction T, and the compact-test predicate Weak. These are definitions, not an assertion of graph equality, closability or existence of a physical Hilbert basis. The existing public SchwartzWeakAdjoint.Hilbert, schwartzOperator and Weak give the L2 space, actual embedded Schwartz operator and compact-test relation, using the full SchwartzCutoffGraph.differential sum. The finite restriction is the existing C := Submodule.span complex (Set.range e), T := S.domRestrict C construction in PhysicalGraphClosure.physical_graph_closure, whose physical-basis hypotheses are not discharged here. The stipulation imposes no separate square-integrability on the two differential summands. The adjacent cutoff and full-graph propositions are separate obligations.
