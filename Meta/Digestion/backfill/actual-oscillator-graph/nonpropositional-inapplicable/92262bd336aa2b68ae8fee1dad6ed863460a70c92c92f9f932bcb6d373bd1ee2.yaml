  nonpropositional:
    justification: "Upstream-only propositional closure under CLAUDE.md 3.2 at the lake-manifest.json Mathlib revision 56a005855ea17e0b0958f73ec801ae140b0a1679. No project frozen GID is available for this complete product-cutoff statement; no new project theorem GID is needed or proposed. proof_shape: bind-only; admission_basis: none. This is a source-level reuse correspondence used for accounting, not a compiled classification, Lean proof or kernel/coverage result.\n\nFull quantification and exact same product: every d:N, h>0, coordinate m_j>0 and w_j>0, every complex Schwartz phi on EuclideanSpace R (Fin d), and a fixed smooth scalar chi equal to 1 on [-1,1] with support in [-2,2]. No norm<=1, nonnegativity, basis, Carmichael or numeric-instance premise is added. The correspondence covers any such real-valued chi; the same scalar-multiplication and real-derivative suppliers also cover the complex-valued scalar reading. Set R_N=N+1>0, r_N=R_N^(-1), Q(x)=product_j chi(x_j), theta_N(x)=Q(r_N smul x). Coordinate evaluation and multiplication normalize this to exactly product_j chi(x_j/R_N), and Q(0)=1 including the empty product. With chiS=HasCompactSupport.toSchwartzMap chi, take M=max(1,SchwartzMap.seminorm R 0 0 chiS); then norm(theta_N(x))<=M^d. M is used only for bounds: chi and theta are never amplitude-rescaled. Suppliers: HasCompactSupport.toSchwartzMap (Mathlib/Analysis/Distribution/SchwartzSpace/Basic.lean:546), SchwartzMap.norm_le_seminorm (:448), Finset.norm_prod (Mathlib/Analysis/Normed/Ring/Basic.lean:793), finite-product order bounds and coordinate evaluation.\n\nExact tensor construction and compact smooth products: contDiff_prod applied to chi composed with each continuous linear coordinate projection gives Q smooth. Finset.support_prod_subset places its support in [-2,2]^d. isCompact_univ_pi and the inverse PiLp.homeomorph make that coordinate box compact in the actual Euclidean topology. HasCompactSupport.of_support_subset_isCompact and HasCompactSupport.toSchwartzMap package this exact Q as Schwartz. Scale by r_N!=0 using SchwartzMap.compCLMOfContinuousLinearEquiv. SchwartzMap.smulLeftCLM gives psi_N=theta_N phi as Schwartz; HasCompactSupport.comp_smul and HasCompactSupport.smul_right give compact support in [-2R_N,2R_N]^d. Suppliers: contDiff_prod (Mathlib/Analysis/Calculus/ContDiff/Operations.lean:503), Finset.support_prod_subset (Mathlib/Algebra/BigOperators/GroupWithZero/Finset.lean:44), isCompact_univ_pi (Mathlib/Topology/Compactness/Compact.lean:1172), PiLp.homeomorph (Mathlib/Analysis/Normed/Lp/PiLp.lean:550), additive HasCompactSupport.of_support_subset_isCompact (Mathlib/Topology/Algebra/Support.lean:245), HasCompactSupport.smul_right (:466), HasCompactSupport.comp_smul (Mathlib/Topology/Algebra/ConstMulAction.lean:467), SchwartzMap.compCLMOfContinuousLinearEquiv (SchwartzSpace/Basic.lean:997), SchwartzMap.smulLeftCLM and its apply_apply (:729,:739). No named tensor-Schwartz API or new tensor theorem is needed.\n\nBoth prescribed derivative rates: for k=1,2 choose C_k=SchwartzMap.seminorm R 0 k Q. iteratedFDeriv_comp_const_smul gives exactly D^k(theta_N)(x)=r_N^k smul D^k Q(r_N smul x). SchwartzMap.norm_iteratedFDeriv_le_seminorm gives norm(D theta_N(x))<=C_1/R_N and norm(D^2 theta_N(x))<=C_2/R_N^2. Coordinate first derivatives and repeated-coordinate second derivatives satisfy the same bounds because coordinate basis vectors have norm 1. Constants depend only on the fixed bump and dimension, not N,x,j. Suppliers: iteratedFDeriv_comp_const_smul (Mathlib/Analysis/Calculus/ContDiff/Operations.lean:685), SchwartzMap.norm_iteratedFDeriv_le_seminorm (SchwartzSpace/Basic.lean:438), SchwartzMap.lineDerivOp_apply_eq_fderiv (SchwartzSpace/Deriv.lean:103), SchwartzMap.iteratedLineDerivOp_eq_iteratedFDeriv (:130), SchwartzMap.lineDerivOp_compCLMOfContinuousLinearEquiv (:144). These are existing exact scaling and norm instances, not a new estimate.\n\nExact full physical commutator: set a_j=h^2/(2*m_j), b_j=m_j*w_j^2/2. Apply fderiv_fun_smul twice to theta_N phi: partial_j^2(theta_N phi)=(partial_j^2 theta_N)phi+2(partial_j theta_N)(partial_j phi)+theta_N partial_j^2 phi. In the full finite differential sum the b_j*x_j^2 multiplication terms commute with theta_N and cancel. Finite-sum algebra gives exactly H0(theta_N phi)-theta_N H0(phi)=-sum_j a_j[2(partial_j theta_N)(partial_j phi)+(partial_j^2 theta_N)phi], with the original sign and coefficient. Suppliers: fderiv_fun_smul (Mathlib/Analysis/Calculus/FDeriv/Mul.lean:108) twice; SchwartzSpace/Deriv.lean directional derivative identifications and linearity; expansion of D5/S3/Quantum/Analysis/SchwartzCutoffGraph.differential (:41), distributivity and commutativity. Local hprod/hD are inlined, not claimed as new reusable declarations.\n\nArbitrary-bound squared DCT and actual vector convergence: for every Schwartz u let q_N=theta_N-1 and F_N(x)=norm(q_N(x) smul u(x))^2. Q continuous, Q(0)=1 and r_N tending to zero give q_N(x) tending to zero. Each F_N is continuous and thus a.e. strongly measurable, and 0<=F_N(x)<=(M^d+1)^2*norm(u(x))^2. This majorant is integrable by SchwartzMap.memLp at 2 volume and MemLp.integrable_norm_pow. MeasureTheory.tendsto_integral_filter_of_dominated_convergence applied to these squared errors gives integral F_N tending to zero; SchwartzMap.norm_toLp' at p=2 and continuity of sqrt give J((theta_N-1)u) tending to zero in the actual Hilbert space. Take u=phi for the first required actual L2 limit with the exact psi_N above. Suppliers: MeasureTheory.tendsto_integral_filter_of_dominated_convergence (Mathlib/MeasureTheory/Integral/DominatedConvergence.lean:68), which accepts an arbitrary integrable majorant; SchwartzMap.memLp (SchwartzSpace/Basic.lean:1307), SchwartzMap.norm_toLp' (:1326), SchwartzMap.hasTemperateGrowth (:537), SchwartzMap.smulLeftCLM (:729), MemLp.integrable_norm_pow (Mathlib/MeasureTheory/Function/L1Space/Integrable.lean:212), Integrable.const_mul and Real.continuous_sqrt. q_N is temperate by subtracting the constant function. No finite total-volume assumption is used.\n\nActual differential-image convergence for the same sequence: apply the preceding DCT instance also to u=H0(phi), Schwartz by the differential definition. For each j apply squared DCT with q_N=partial_j theta_N, u=partial_j phi and majorant C_1^2*norm(u)^2, and with q_N=partial_j^2 theta_N, u=phi and majorant C_2^2*norm(phi)^2. The rate bounds and R_N>=1 give domination and pointwise zero limits. J is the actual SchwartzMap.toLpCLM/toLp 2 volume. Its linearity, the exact full commutator and tendsto_finsetSum give J(H0(psi_N)-H0(phi)) tending to zero. Thus both J(psi_N) tending to J(phi) and J(H0(psi_N)) tending to J(H0(phi)) hold for that same exact product sequence. Suppliers are the same public pinned DCT, Schwartz derivative closure, SchwartzMap.memLp, SchwartzMap.norm_toLp', SchwartzMap.toLpCLM and finite-sum/linear Tendsto rules. No separate nonsmooth derivative/potential integrability hypothesis is introduced, and no stronger norm-one scaled theorem is substituted.\n\nDimension zero: Fin 0 is empty, so Q=theta_N=1, psi_N=phi, H0=0 and the commutator is the empty sum. The coordinate box is the whole singleton space and compact. Both actual L2 limits are constant-sequence limits. First and second Frechet derivatives of the constant cutoff vanish, so C_1=C_2=0 is allowed; coordinate bounds are vacuous. Actual volume is the unit Dirac measure. Suppliers: empty products/sums, derivatives of constants, compact empty-coordinate product and PiLp.volume_euclideanSpace_eq_dirac (Mathlib/MeasureTheory/Measure/Haar/InnerProductSpace.lean:142). No positivity or energy division fails at d=0.\n\nAfter expansion of the physical differential sum, every clause is supplied by these existing declarations and finite-sum/algebraic normalization. Theorem-form 2.3 and its existing coverage are untouched. This receipts.nonpropositional settlement records upstream-only accounting; it adds no Lean declaration, wrapper, GID, proof, first freeze, dependency admission or kernel-verification credit."
