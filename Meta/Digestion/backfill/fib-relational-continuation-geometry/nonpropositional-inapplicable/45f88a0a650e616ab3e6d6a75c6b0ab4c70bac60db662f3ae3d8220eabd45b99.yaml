  nonpropositional:
    justification: Coefficient/resource-scope clarification with no new Lean declaration. A unital map from ZMod m to a field can exist only when the field characteristic divides m; for composite m its prime characteristic p is smaller than m, so the distinct residue p and zero can be identified. The elementary example ZMod 4 -> ZMod 2 maps 2 and 0 to 0, by pinned ZMod cast laws and normalization. Such an output map need not be injective, unlike E_p in the prime-recoding child, so it does not identify all original continuation responses. The dimension lemmas used in the linear children have Field hypotheses; they state no minimal module dimension over a composite residue ring. The deterministic task counts reachable behavior classes, while the linear task measures the span with common transitions and two scalar outputs; finite field carrier size does not turn these two resources into the same invariant. The unchanged source defines outputs as legality/quantity pairs, never a one-hot vector for each residue. This is the original applicability boundary, not a new positive composite-ring theorem, finite-bit claim or alteration of the source.
