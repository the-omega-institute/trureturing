    justification: 'This proof paragraph adds no independent mathematical content beyond the explicit bind-only routes of this decomposition. The prime-recoding child supplies E_p, D_p and the castState/List.foldl_hom correspondence on all words, including the legality channel. The deterministic children specialize frozen ImmediateWindowStateCapacity.result to m=5 and m=2 with 2<=m and normalize capacity(m)=2*m^2/gcd(m,2)+1 to 51 and 5; output encoding/decoding preserves the same states and complete continuation task. The linear children give the full joint matrices and all-field substitutions: six for every field of characteristic different from two, including ZMod 5 and Q, and four over characteristic two, including ZMod 2; these are the original integer-induced tasks. For the displayed identity, w_k=[middle]++replicate k zero reaches atomicBlock(3*k+1), so the quantity conjunct of frozen GraftAffineClosure.result at H=1, w=atomicBlock(3*k+1), j=3*k+1 gives q*S^k*beta=q*M^(3*k+1)*alpha=Nat.fib(3*k+4) after fold/iterate normalization and casts. Nat.fib_add_two_strictMono and the empty continuation separate all k in the actual reachable all-word behavior quotient, as mapped explicitly in the rational child. Consequently no fixed finite integer encoding width can contain all these distinct exact current quantities: a fixed finite bit alphabet/length has a finite value range, whereas this injective natural family is infinite. Six rational coordinates bound the number of registers, not their integer magnitudes. Keep all original finite words, the source guard, absorbing invalid state, zero unit bit, empty input, padding, chronological order and both outputs. No rational parity lift, End restriction, one-hot encoding, composite-ring rank result or uniform bit bound is asserted. Accounting records source-level reuse, not a newly compiled theorem.'
