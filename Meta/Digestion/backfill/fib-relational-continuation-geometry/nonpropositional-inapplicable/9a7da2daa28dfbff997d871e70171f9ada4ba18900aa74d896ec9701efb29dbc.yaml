    justification: 'Source-level all-bind-only reuse for the actual all-word rational task, not for a parity lift or a linear span. Set X=ImmediateWindowStateCapacity.RawState 0, anchor=Some(false,(0,0)), and readout(None)=(0,0), readout(Some(s,x))=(1,(quantity x : Q)). The existing integerFieldTask Q is precisely this readout after the original chronological raw reader. Take M=(FreeMonoid Window)^op, with op(w) acting by List.foldl rawTransition along w; List.foldl_append supplies the action law, because op(u)*op(v)=op(v++u). Hence the existing ReachableBehaviorMinimality.ReachableBehaviorQuotient, futureBehavior and behaviorClass specialize to the reachable original states modulo equality of every continuation output f_Q(w++v). The unrestricted canonical_reachable_behavior_factor and every_reachable_behavior_class_is_reachable apply to reachable realizations of this same task; finite_state_minimality is not invoked with an infinite carrier. For k in N, let w_k=[middle]++List.replicate k zero. All its letters are legal, the seam stays false, and its reached composition is clock^[k](0,1)=step^[3*k+1](1,0)=atomicBlock(3*k+1). List.foldl_replicate, Function.iterate_mul/iterate_add_apply and step/clock/atomicBlock definitions give these equalities. Apply the quantity/atomic-block conjunct of frozen D5/S3/Arith/FibonacciAtomic/GraftAffineClosure.result with H=1, w=atomicBlock(3*k+1), j=3*k+1; cast the resulting natural quantity identity through ZMod 0=Z and into Q. Thus the actual current output is (1,(Nat.fib(3*k+4):Q)) for every k. Pinned Nat.fib_add_two_strictMono with index 3*k+2, StrictMono.injective, and injectivity of the natural-number cast into Q distinguish all k. Quotient.exact and evaluation of equal futureBehavior profiles at the empty continuation therefore make k |-> behaviorClass anchor readout (op w_k) injective. Infinite.of_injective gives an infinite actual reachable all-word behavior quotient. All source guards, invalid absorption, legal zero versus invalid output, empty word, high null padding, zero unit bit and high-to-low chronology remain in force. The claim is not that all vectors in a six-dimensional span are actual states, and it does not use only null-restricted continuation equivalence. These are exact source substitutions and upstream fold/iterate/quotient consequences; no fresh compiled application or new Lean declaration is claimed.'
