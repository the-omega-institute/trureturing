    justification: Source-level all-bind-only application of pinned linear algebra to the complete source matrices; zero new Lean. The clause has p=5; the same substitution works for every field K with ringChar K != 2, including ZMod 5 and Q. In the source's state order (a0,b0,c0,a1,b1,c1), let U_d(a,b,c)=(a+2*b+d_a*c,2*a+3*b+d_b*c,c). For source blocks h0,h1 the five chronological updates are null:(U_0(h0+h1),0), [2]:(0,U_(1,0)(h0+h1)), [3]:(U_(0,1)(h0+h1),0), [25]:(0,U_(2,1)(h0)), [5]:(U_(1,1)(h0),0). Initial state is ((0,0,1),0); output is (c0+c1,2*a0+3*b0+2*a1+3*b1). Thus guard-forbidden source blocks vanish, a live state has one occupied block with c=1, invalid states are absorbing zero, and both legality and quantity are retained. List.foldl_hom with this homogeneous embedding, and the existing chronological wordMap definition, gives the exact integerFieldTask K on every finite word, including empty and high null padding; finrank K (Fin 6 -> K)=6 is the upper bound. Use prefixes [],[3],[5],[2],[3][2],[5][2]. Their reach matrix is P=diag(P0,P1), P0=[[0,0,1],[0,1,1],[1,1,1]], P1=[[1,3,4],[0,3,5],[1,1,1]], det P0=-1, det P1=1, det P=-1. Use the legality of [5], quantity of [5], quantity of [5]null, legality of null[5], quantity of null[5], quantity of null[5]null as six scalar continuation tests. With R=[[0,0,1],[8,13,5],[34,55,21]] and A0=[[1,2,0],[2,3,0],[0,0,1]], their observation matrix is O=[[R,0],[R*A0,R*A0]], where R*A0=[[0,0,1],[34,55,5],[144,233,21]]. Definition expansion and ring normalization give det R=-2 and det O=-4. The actual joint response minor, tests as rows and prefixes as columns, is O*P=[[1,1,1,0,0,0],[5,18,26,0,0,0],[21,76,110,0,0,0],[1,1,1,1,1,1],[5,60,94,39,272,416],[21,254,398,165,1152,1762]], with determinant 4, not -4. Ring.two_ne_zero applied to ringChar K != 2 makes 4 nonzero. In any competing representation on V the same minor factors as observe(reach j), where reach j=L_(prefix j)(initial) and observe(v)_i=selectedOutput_i(C(L_(suffix i)v)); word concatenation follows List.foldl_append/List.reverse_append. Matrix.linearIndependent_cols_of_det_ne_zero, LinearIndependent.of_comp and LinearIndependent.fintype_card_le_finrank then give 6 <= finrank K V. For the source joint Hankel span, instantiate the same linear observation map into functions on all suffix/output-coordinate pairs; span_le and finrank_range_le give the upper bound, the finite minor the lower bound. This keeps arbitrary words and both outputs, and imposes no composite-ring module-rank claim. All finite matrix identities here are direct source substitutions and normalization, not separately compiled evidence or a new mathematical-content claim.
