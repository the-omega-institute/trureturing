    justification: "Retrieval preceded quarantine. Source clause (docs/develop/theory/PZG_BEDC.md:4005) asks for the golden-fiber peak asymptotic |P_T(exp(2 pi i nu_m))| = T |cHat_m| (1 + o(1)), deriving the error from uniform convergence of Birkhoff averages for the Riemann-integrable interval-window observable; its final E_T/T band is an empirical remark. D5 search (peak height, Birkhoff, unique ergodicity, Fourier coefficient, asymptotic amplitude, finiteSignal, goldenMechanicalWord) found the canonical golden word primitives and finite Fourier/autocorrelation identities, but no pointwise or uniform golden-rotation average theorem and no canonical cHat_m declaration; the parent FiniteAutocorrelation module explicitly says the asymptotic peak law remains outside its partial closure. Pinned Mathlib search (.lake/packages/mathlib; equidistribution, uniform distribution, Weyl, irrational rotation, Birkhoff convergence, Riemann-integrable average) found AddCircle.ergodic_add_left, birkhoffAverage, uniformEquicontinuous_birkhoffAverage, and generic closedness/difference lemmas, but no equidistribution theorem or Birkhoff convergence for the discontinuous window observable. Third-party LeanSearch/Loogle queries returned only the same generic Birkhoff API, dense irrational rotations, and Fourier-integral facts; GitHub Lean-code searches for Equidistributed, Weyl equidistribution, and irrational-rotation Birkhoff convergence found only google-deepmind/formal-conjectures definitions IsEquidistributed and IsEquidistributedModuloOne, with no proving theorem. Local Lean API probe (exit 0) confirms ergodicity and generic equicontinuity are available but do not yield the required orbit-average limit; taking that Tendsto statement as a new hypothesis would restate the source theorem instead of proving it. Reentry w73c47 refreshed D5/Scribe queries (peak height, Birkhoff, unique ergodicity, Fourier coefficient, asymptotic amplitude, finiteSignal, goldenMechanicalWord; exit 0) and pinned Mathlib db584cd6d46c92f209a44c0f1c829460d327499d Dynamics/MeasureTheory/Fourier searches (exit 0): WindowDiffraction.window_fourier_amplitude and WindowDiffractionExtinction.golden_window_fourier_amplitude_ne_zero already carry the positive-mode amplitude, while no uniform window-average owner was found. Live Loogle birkhoffAverage and LeanSearch irrational-rotation interval-average queries returned generic APIs (HTTP exit 0). GitHub Equidistributed, Weyl equidistribution, and birkhoffAverage irrational searches (exit 0) found a new A17 candidate: rwst/lean-code at ce1619b6418dc263efb911b11ad09409c2083d80, CC0-1.0, Lean v4.34.0-rc2/mathlib 169f50d4fb7ca23e1c486157044cd42fdf839361; its AddCircleWeyl.lean:55,276,289 proves continuous averages and arc bump integral bounds, and BertinPisot/UniformDistribution.lean:518 proves irrational linear Weyl sums. The latter file contains unrelated custom axioms, so only a checked selected proof closure may be ported. Local construction /private/tmp/consensus-rnd/sshx/w73c47/attempt-1/atom1-probe.lean (exit 1; log adjacent) successfully ports the Weyl-sum proof, applies continuous convergence, and constructs upper/lower golden arc integral estimates with standard three-axiom closures, then stops at the exact goal: \u22a2 |(\u2211 n \u2208 Finset.range N, (Set.Ico (1 - D5.S1.Words.goldenMechanicalSlope) 1).indicator (fun x => 1) (Int.fract (\u03b8 + \u2191n * Real.goldenRatio))) / \u2191N - D5.S1.Words.goldenMechanicalSlope| < \u03b5. The log preserves the verbatim Unicode goal and context; available cutoffs control only the unshifted continuous probes. Scoping: the full prerequisite additionally needs uniform translation control, a half-open weighted-window boundary estimate, and the canonical signal/shifted-coefficient bridge; a feasible first slice is the selected A17.2 circle Weyl port (the 296-line AddCircleWeyl file compiles unchanged here, exit 0), before the uniform discontinuous-observable layer."
    reentry_condition: "Admit the selected standard-axiom closure of rwst/lean-code ce1619b6418dc263efb911b11ad09409c2083d80 AddCircleWeyl and irrational linear Weyl sums via A17.2, then supply a uniform-translation estimate for the continuous circle approximants and a boundary-strip squeeze for their half-open character-weighted window; use WindowDiffraction for the shifted interval coefficient identification."
