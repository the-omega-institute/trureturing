  quarantine:
    justification: "Retrieval preceded quarantine. Source clause (docs/develop/theory/PZG_BEDC.md:1105) says analytic continuation through an imaginary-axis arc forces all but finitely many transported candidates to cancel, and publicly identifies every cancellation as either NR, an exact scaled off-line nontrivial zeta-zero relation implying negation of RH in an infinite scaled lattice, or T, infinitely many exact zeros of the axis Hecke-Mahler factors. D5 search (scaledZeroPattern, tailZeroCollision, lineCondition, alternateCondition, cancellation channel, scaled zeta zeros, Hecke-Mahler collision, theorem/6.60) found the frozen ConditionalNaturalBoundary.conditional_natural_boundary_and_gate and ScaledPoleAccumulation.scaled_candidate_poles_tendsto, but the former leaves both channels as arbitrary Prop-valued binders and assumes their pointwise classification, while theorem 6.60 and its channel-exhaustion clause remain open; no declaration defines the predicates on the source carrier or proves the RH/scaled-lattice consequence. Pinned Mathlib search (.lake/packages/mathlib; RiemannHypothesis, riemannZetaZeros, scaled zeros, analytic cancellation) found the canonical RH definition, mem_riemannZetaZeros, zeta nonvanishing facts, and generic analytic/meromorphic neighborhood lemmas, but no scaled-zero or Hecke-Mahler channel theorem. Third-party LeanSearch/Loogle queries returned only RiemannHypothesis, elementary zeta zero/nonzero facts, and generic meromorphic eventual-analyticity; GitHub Lean-code search found only mathlib copies of RiemannHypothesis and no scaledZeroPattern/tailZeroCollision declarations. Local Lean projection probe (exit 0) confirms the frozen theorem proves the generic eventual disjunction, but after unfolding its public signature the source-specific NR definition, T definition, RH consequence, and infinite-lattice assertion are absent, so binding would leave public subclauses uncovered."
    reentry_condition: "Formalize theorem 6.60(ii) on canonical zeta-zero, Witt-scale, and Hecke-Mahler-factor primitives, including the NR implication to not RiemannHypothesis and the required infinite scaled pattern, then instantiate the frozen generic gate theorem so every source-specific channel clause appears publicly."
    blocker_class: multi-clause-guard
