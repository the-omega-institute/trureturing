  quarantine:
    justification: "Retrieval preceded quarantine. Source clause (docs/develop/theory/PZG_BEDC.md:910-912) asks for the structural-zero slope identity Z_qc'(s*) = 2 phi^2 zeta(1/2) zeta(phi/2) exp(H2(s*)) and appends a numerical window certificate. D5 search (H2, structuralZero, eulerGerm derivatives, slope, and GoldenGermSecondOrderFactorization) found only the open X_Frontier objects and the closed golden_germ_second_order_factorization, whose public statement gives a pointwise G3 factorization plus summability but no differentiability or value theorem for G3/H2 at s*. Pinned Mathlib search (.lake/packages/mathlib; riemannZeta derivatives, reciprocal derivative, and product derivative) found differentiableAt_riemannZeta, ArithmeticFunction.LSeries_vonMangoldt_eq_deriv_riemannZeta_div, deriv_riemannZeta_zero, deriv_mul, and inverse-derivative lemmas, but no theorem for the repository-specific residual Euler factor or requested slope value. Third-party LeanSearch/Loogle queries for product zeros, reciprocal poles, and zeta derivatives returned only generic deriv_mul, HasDerivAt.fun_inv, and zeta differentiability/log-derivative hits; no exact germ result. Local Lean API probe compiled the frozen theorem type and confirmed it exposes no DifferentiableAt G3, G3 value, canonical H2, or derivative equality, so a proof cannot cross from the pointwise factorization to the requested slope without inventing a target-defined H2. Reentry w73b46 item 1 is bind-only from GoldenGermSecondOrderFactorization.golden_germ_second_order_factorization, GoldenGermSecondNormalizedFactorRegularity.golden_germ_second_normalized_factor_regularity and its frozen private real_second_normalized_local_factor_ne_zero, together with Mathlib Complex.summable_log_one_add_of_summable, Complex.cexp_tsum_eq_tprod, differentiable_riemannZeta₁, riemannZeta₁_one and HasDerivAt product/chain rules; D5 and Scribe regularity/structural-zero searches found those later carriers, pinned Mathlib Log/Summable and Harmonic/ZetaAsymp searches hit the named APIs, loogle query '\"riemannZeta₁\"' exited 0 with 5 hits, leansearch query 'derivative of the reciprocal of the Riemann zeta function at its pole' exited 0 with 5 generic hits, A17 GitHub query '\"germLocalFactor\" language:Lean' exited 0 with no hits, and /private/tmp/consensus-rnd/sshx/w73b46/attempt-1/atom1-probe.lean exited 0 checking residual differentiability at s*, log-sum assembly conditional on local nonzero factors and the regularized product derivative (the reciprocal uses riemannZeta₁ because Mathlib's point value at 1 is nonzero), so this is admissible only as a companion inside a content module."
    reentry_condition: A frozen canonical residual-factor/H2 construction lands with differentiability at s*, its exact value there, and a derivative theorem for the continued golden germ that yields the symbolic slope identity without defining H2 from the target equation.
