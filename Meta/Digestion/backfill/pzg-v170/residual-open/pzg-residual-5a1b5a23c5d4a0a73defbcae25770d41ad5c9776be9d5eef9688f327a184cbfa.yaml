  quarantine:
    justification: "Retrieval preceded quarantine. Source theorem (docs/develop/theory/PZG_BEDC.md:1929-1935) defines the recursive internalization tower and publicly requires four linked clauses on that same carrier: layerwise auditability, an expressible but undecidable closure sentence plus strict semantic exterior at every layer, semantic-to-open/closed layer shift, and impossibility of an unindexed self-applicable absolute closure predicate; the header itself records layerwise arithmeticization as open O-2. D5 search (internalization tower, semantic layer, OpenLedger, property object, incompleteness, truth predicate, arithmeticization) found valid partial owners PropertyObject.property_object_components_bijective, SemanticLayerShift.semantic_layer_shift_bijective, ClosureUndecidable.closure_reading_unreachable/empty_ledger_reading_unreachable, and SyntaxSemanticsBoundary.same_layer_predicates_not_enumerable, but none defines a common recursive tower or relates its layer-indexed syntax, provability, audit, and used-property semantics; conjoining these independent abstractions would leave clauses (i), (ii), and (iv) disconnected from T_n. Pinned Mathlib search (.lake/packages/mathlib; incompleteness, provability predicate, formal theory, Goedel, Tarski) found partial-recursive code, Rice's theorem, Cantor diagonalization, and Goedel's beta function, whose own module says formalized first incompleteness is future work; it has no first-incompleteness theorem or layer-relative tower bridge. Third-party LeanSearch/Loogle found only Mathlib theory completeness vocabulary, Rice's theorem, and Cantor surjectivity. GitHub Lean-code search found FormalizedFormalLogic/Foundation.first_incompleteness and related provability results, but Foundation pins Lean v4.33.0 and mathlib db584cd6 while this repository pins v4.31.0 and mathlib fabf563a, so A17.2 rules out dependency form; the upstream theorem also requires a supplied referenceable theory, diagonalization, consistency, and Kreisel condition and does not construct or arithmeticize this source tower. Local Lean probe (exit 0) confirms all partial D5 declarations elaborate independently but share no layer-indexed tower binder, expressibility relation, or provability carrier."
    reentry_condition: "Construct a canonical recursive internalization tower on the repository property-object and residual-ledger carriers, arithmeticize every layer as a referenceable consistent formal theory with its provability relation, and prove the relative incompleteness/strict-semantic-exterior and absolute-closure clauses on that same tower; then combine those results with the existing semantic layer-shift owner."
