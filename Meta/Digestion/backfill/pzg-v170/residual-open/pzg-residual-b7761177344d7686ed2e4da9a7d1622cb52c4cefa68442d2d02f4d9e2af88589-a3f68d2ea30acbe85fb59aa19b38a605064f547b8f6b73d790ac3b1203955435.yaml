  quarantine:
    justification: "Retrieval preceded quarantine. Source clause (docs/develop/theory/PZG_BEDC.md:4005) asks for the golden-fiber peak asymptotic |P_T(exp(2 pi i nu_m))| = T |cHat_m| (1 + o(1)), deriving the error from uniform convergence of Birkhoff averages for the Riemann-integrable interval-window observable; its final E_T/T band is an empirical remark. D5 search (peak height, Birkhoff, unique ergodicity, Fourier coefficient, asymptotic amplitude, finiteSignal, goldenMechanicalWord) found the canonical golden word primitives and finite Fourier/autocorrelation identities, but no pointwise or uniform golden-rotation average theorem and no canonical cHat_m declaration; the parent FiniteAutocorrelation module explicitly says the asymptotic peak law remains outside its partial closure. Pinned Mathlib search (.lake/packages/mathlib; equidistribution, uniform distribution, Weyl, irrational rotation, Birkhoff convergence, Riemann-integrable average) found AddCircle.ergodic_add_left, birkhoffAverage, uniformEquicontinuous_birkhoffAverage, and generic closedness/difference lemmas, but no equidistribution theorem or Birkhoff convergence for the discontinuous window observable. Third-party LeanSearch/Loogle queries returned only the same generic Birkhoff API, dense irrational rotations, and Fourier-integral facts; GitHub Lean-code searches for Equidistributed, Weyl equidistribution, and irrational-rotation Birkhoff convergence found only google-deepmind/formal-conjectures definitions IsEquidistributed and IsEquidistributedModuloOne, with no proving theorem. Local Lean API probe (exit 0) confirms ergodicity and generic equicontinuity are available but do not yield the required orbit-average limit; taking that Tendsto statement as a new hypothesis would restate the source theorem instead of proving it."
    reentry_condition: "A pinned D5, Mathlib, or admissible third-party theorem lands proving equidistribution/unique-ergodic convergence for the irrational golden rotation with the source interval-window observable, together with the canonical Fourier coefficient cHat_m needed to identify the limit and derive the norm asymptotic."
    blocker_class: missing-prerequisite
