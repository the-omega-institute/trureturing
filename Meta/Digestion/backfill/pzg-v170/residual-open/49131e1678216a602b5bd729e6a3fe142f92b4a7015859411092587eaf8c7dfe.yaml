  quarantine:
    justification: "Retrieval preceded quarantine. Frozen D5 owners cover the numerical half: `CodingFingerprint` gives the canonical quotient, all three exact fingerprint values and pairwise distinctness; `DecimalBounds` gives rigorous 1.170820 and 2.092100 rounding bounds; `EncodingSensitivity.coding_fingerprint_is_encoding_sensitive` gives the S0 indexed injectivity. Whole-atom binding/deposit is blocked by the remaining source clauses `zeta layer encoding-blind` and `bottom layer directly loads into the analytic layer`: the frozen EncodingSensitivity Scribe explicitly disclaims any zeta-layer identification. D5 searches `abscissa|absolute convergence|zeta.*blind|encoding.*blind|quasicrystal.*abscissa|fingerprint.*analytic|fingerprint.*heat` hit `PrimeSpectrumHeatAbscissa.prime_spectrum_heat_abscissa`, `GoldenDisplacementFaceHeatAbscissa.faceLength_heat_abscissa_exact`, and Mathlib-backed zeta owners, but missed a Tribonacci heat spectrum, coding-indexed zeta family, and fingerprint-to-abscissa theorem; exact owner searches `tribonacci_coding_heat_abscissa|coding_indexed_zeta_abscissa_invariant|coding_fingerprint_to_heat_abscissa` missed. Pinned Mathlib hit `LSeries.abscissaOfAbsConv_one`, but has no domain-specific coding family or Tribonacci analytic bridge. A17 GitHub searches for `Tribonacci IsHeatAbscissa`, `abscissaOfAbsConv tribonacci`, `coding fingerprint Tribonacci`, `tribonacci lean4`, and `quasicrystal zeta lean` found no candidate; the sole broad quasicrystal-zeta code hit was an auto-generated claim ledger with no theorem. Local probe `/private/tmp/w72d20-atom2-probe.lean` resolved all six partial owners and exited 1 only on the three missing bridge identifiers. Defining a constant zeta-abscissa family or a linear-by-construction Tribonacci spectrum would make the resisted clauses tautological, so a numerical/S0 wrapper would be knowingly partial."
    reentry_condition: "Provide frozen canonical analytic objects constructed from each source coding, including a Tribonacci prime spectrum with global growth and exact heat abscissa, a coding-indexed zeta carrier whose abscissa invariance is proved from decoding rather than defined constant, and a public theorem transporting the bottom coding fingerprints into those analytic abscissae; then aggregate these with the existing exact-value, rounding, distinctness, and S0 sensitivity owners."
    blocker_class: multi-clause-guard
