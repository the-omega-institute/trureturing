  quarantine:
    justification: "Retrieval preceded quarantine. Source clause (docs/develop/theory/PZG_BEDC.md:910-912) asks for the structural-zero slope identity Z_qc'(s*) = 2 phi^2 zeta(1/2) zeta(phi/2) exp(H2(s*)) and appends a numerical window certificate. D5 search (H2, structuralZero, eulerGerm derivatives, slope, and GoldenGermSecondOrderFactorization) found only the open X_Frontier objects and the closed golden_germ_second_order_factorization, whose public statement gives a pointwise G3 factorization plus summability but no differentiability or value theorem for G3/H2 at s*. Pinned Mathlib search (.lake/packages/mathlib; riemannZeta derivatives, reciprocal derivative, and product derivative) found differentiableAt_riemannZeta, ArithmeticFunction.LSeries_vonMangoldt_eq_deriv_riemannZeta_div, deriv_riemannZeta_zero, deriv_mul, and inverse-derivative lemmas, but no theorem for the repository-specific residual Euler factor or requested slope value. Third-party LeanSearch/Loogle queries for product zeros, reciprocal poles, and zeta derivatives returned only generic deriv_mul, HasDerivAt.fun_inv, and zeta differentiability/log-derivative hits; no exact germ result. Local Lean API probe compiled the frozen theorem type and confirmed it exposes no DifferentiableAt G3, G3 value, canonical H2, or derivative equality, so a proof cannot cross from the pointwise factorization to the requested slope without inventing a target-defined H2."
    reentry_condition: "A frozen canonical residual-factor/H2 construction lands with differentiability at s*, its exact value there, and a derivative theorem for the continued golden germ that yields the symbolic slope identity without defining H2 from the target equation."
