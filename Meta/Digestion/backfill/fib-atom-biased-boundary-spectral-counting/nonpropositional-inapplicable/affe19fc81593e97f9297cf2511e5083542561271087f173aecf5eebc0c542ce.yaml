    justification: 'Interpretive scope and applicability commentary for Definition 4.1: the global trace and comparison clock do not specify a spatial metric, pointwise heat-kernel dimension, state dimension or physical realization. Physical-space, physical-clock and native-operation correspondences remain separate assumptions. The exclusions of a precise counting coefficient, bounded additive remainder and derivative-log limit delimit what the stated bounds assert; they supply none of those bridges and assert no impossibility theorem. The definition and numeric doubling corollary are retained in sibling 9f2ab4b9bcb4f95764c71a8a037c305f3ca5ccd33cca665762c836e669901248 and are not settled by this receipt.'
