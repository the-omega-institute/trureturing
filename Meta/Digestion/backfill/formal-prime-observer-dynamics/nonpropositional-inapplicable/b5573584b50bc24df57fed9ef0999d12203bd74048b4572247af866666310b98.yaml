    justification: 'Upstream-only closure, pinned Mathlib 56a005855ea17e0b0958f73ec801ae140b0a1679: for a measurable deterministic readout q, ProbabilityTheory.Kernel.deterministic q hq is a Markov kernel by ProbabilityTheory.Kernel.isMarkovKernel_deterministic and evaluates to Measure.dirac (q x) by ProbabilityTheory.Kernel.deterministic_apply. Measurability is the statistical-kernel context premise, not a new conclusion. D5 search covered all public/private declarations for Dirac, deterministic kernels, measurable maps, Markov instances and experimental embeddings; OutputStateRandomnessSeparation proves degeneracy of PMF.pure and special Boolean observations, while GarblingIncreasesBayesRisk.blackwellDominates_map states a garbling relation, neither supplying a subgoal in this general deterministic-kernel embedding.'
