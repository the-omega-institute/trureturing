    justification: 'Upstream-only closure, pinned Mathlib 56a005855ea17e0b0958f73ec801ae140b0a1679: Nat.clog_le_iff_le_pow and Nat.le_pow_clog characterize the least k with N <= p^k for prime p (1<p); Real.natCeil_logb_natCast identifies that least natural exponent with the natural ceiling of log_p N. The enclosing section fixes prime p and the positive finite window N. D5 search covered all public/private Lean declarations, with cutoff/first-threshold, clog, ceiling/logb, p-adic depth, prime powers and capacity shapes; FiveModePredictiveLawGeometry.Core.cutoff_first_nonstrict concerns a logistic minority threshold and supplies no subgoal of this exact exponent minimum. FiniteIdentificationOutputCapacity bounds family cardinality but does not prove this least-exponent identity.'
