    justification: "Definitions and upstream-only conventions: H, phi, D and the actual induced residual are the frozen SimpleGraph.harmonicIndex and D5.S3.Combinatorics.Graph.AdjacentSupportPayment.degreeDefect, harmonicDefect and residual. Both sums range over unordered edgeFinset elements, so isolated vertices supply no summands; coefficients and subtraction are rational. For every actual edge, positivity of both endpoint degrees is supplied by SimpleGraph.Adj.degree_pos_left and SimpleGraph.Adj.degree_pos_right in pinned Mathlib 56a005855ea17e0b0958f73ec801ae140b0a1679, Mathlib/Combinatorics/SimpleGraph/Finite.lean. The residual is G.induce on the full retained subtype, including isolates, and uses that graph's degree. No new mathematical assertion, certificate or independent numerical identity remains in this definition atom."
