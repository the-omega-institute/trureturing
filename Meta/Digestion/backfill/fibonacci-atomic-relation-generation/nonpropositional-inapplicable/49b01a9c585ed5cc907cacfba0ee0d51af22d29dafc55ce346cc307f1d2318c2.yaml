    justification: CLAUDE.md 3.2 upstream-only bind-only settlement; pinned Mathlib db584cd6d46c92f209a44c0f1c829460d327499d. QuotientAddGroup.quotientKerEquivOfRightInverse applied to q(a,b)=2a+3b and its right inverse n->(-n,n) identifies Q with Z; AddSubgroup.mem_zmultiples_iff and integer normalization identify ker(q)=Z(3,-2), with e=[(-1,1)], qbar(e)=1, qbar(alpha)=2 and qbar(beta)=3. The subtype of natural multiples of e is the least zero/successor-closed subset, by Set.MapsTo.iterate and add_right_iterate. Equiv.ofBijective, Equiv.commSemiring and Equiv.ringEquiv transport the natural-number semiring along eta(n)=n*e. The compiled exact application verifies ambient zero, one=e, successor, addition and the multiplication recurrence. Function.Semiconj.iterate_right, Nat.succ_iterate, add_right_iterate and map_natCast additionally prove that any multiplication satisfying the source zero/successor recursion equals this transported multiplication. Thus eta is the asserted semiring isomorphism and e, alpha, beta correspond to 1, 2, 3. No extra hypothesis, new mathematical declaration, repository GID or coverage edge is asserted.
