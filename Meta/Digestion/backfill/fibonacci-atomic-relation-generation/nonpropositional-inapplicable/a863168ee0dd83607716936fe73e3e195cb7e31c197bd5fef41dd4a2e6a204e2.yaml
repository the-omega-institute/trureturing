    justification: 'CLAUDE.md 3.2 upstream-only bind-only settlement; pinned Mathlib db584cd6d46c92f209a44c0f1c829460d327499d. Exact declarations: LinearMap.quotKerEquivOfSurjective, LinearMap.quotKerEquivOfSurjective_apply_mk. Take q(a,b)=2a+3b on Z^2. A right inverse is n -> (-n,n). The kernel is Z(3,-2): with 2a+3b=0 take t=a+b and normalize a=3t,b=-2t; the reverse inclusion normalizes to zero. Apply the first isomorphism theorem. e=(-1,1) maps to 1 and the displayed decomposition and 2e,3e follow by linear normalization. No frozen repository GID for this quotient was found.'
