    justification: 'Upstream-only bind-only settlement under CLAUDE.md section 3.2: for every positive natural n and real cutoff w>=1, interpret C_w(n) and R_w(n) as the finite products of p^n.factorization(p) over n.primeFactors with p<=w and w<p. Nat.prod_primeFactors_pow_factorization together with Finset.prod_filter_mul_prod_filter_not gives n=C_w(n)*R_w(n). Prime.dvd_finsetProd_iff, Nat.prime_of_mem_primeFactors, Nat.Prime.dvd_of_dvd_pow and Nat.prime_dvd_prime_iff_eq show that no prime p<=w divides R_w(n), supplying the genuine roughness clause. The distinction from an arbitrary complementary divisor is definitional, not a universal inequality between these objects. Pinned mathlib revision 56a005855ea17e0b0958f73ec801ae140b0a1679 (v4.35.0). No usable frozen GID was found in the all-D5 public/private shape search for prime-factor reconstruction, prime-support splitting, smooth/rough factors and finite-product divisibility, including D5/S3/Arith/FibonacciAtomic, D5/S3/Factorization, D5/S3/Weil/GronwallUpperEnvelope, D5/S3/Arith/Robin/GoldenCongruenceRobin, D5/S3/Arith/Primes/FibonacciFiniteSupportSieve, and D5/S3/Arith/Congruence/BorsPanarioWangArithmeticComplexity. Reconstruction and splitting inside local have blocks do not expose reusable declarations; the reviewed frozen upper bounds and specialized Fibonacci sieve conclusions do not supply this universal natural-number factorization. The generic RationalIntervalExpression.checked_expression_encloses and cutoff_first_nonstrict checks do not supply any missing prime-factor reconstruction or divisibility subgoal. Exact arbitrary-n and real-w application compiled successfully via make lean; no D5 declaration is retained.'
