    justification: 'CLAUDE.md 3.2 upstream-only bind-only settlement; pinned Mathlib db584cd6d46c92f209a44c0f1c829460d327499d. Exact declarations: Matrix.matrix_eq_sum_single, Matrix.mul_fin_two, Algebra.subset_adjoin, Subalgebra.mul_mem, Subalgebra.sub_mem, Subalgebra.add_mem. In the subalgebra generated by M and D=E12, normalize D*M-D=E11, M*E11=E21, I-E11=E22. Algebra.subset_adjoin and the subalgebra closure rules give all four units. Matrix.matrix_eq_sum_single writes every matrix as their scalar linear combination, over both Z and ZMod n. J=I+(I-2M)*D is another finite matrix normalization. No frozen repository GID carries this exact generation assertion. Scalar closure uses Subalgebra.algebraMap_mem; ZMod.intCast_surjective identifies scalar coefficients in the mod-n generated Z-algebra.'
