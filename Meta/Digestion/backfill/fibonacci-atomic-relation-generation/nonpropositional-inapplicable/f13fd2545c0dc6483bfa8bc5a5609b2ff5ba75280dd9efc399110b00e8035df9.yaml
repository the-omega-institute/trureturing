    justification: Upstream-discharge under CLAUDE.md 3.2; this is a propositional reuse receipt, not a Lean truth declaration. For arbitrary positive A,B the multiplication equivalence on Coprime(v,A/u) has inverse (gcd(d,A),d/gcd(d,A)). Nat.dvd_gcd_mul_iff_dvd_mul, Nat.dvd_of_mul_dvd_mul_left and Nat.mul_div_cancel' establish quotient divisibility; Nat.coprime_div_gcd_div_gcd establishes the seam; Nat.gcd_mul_left and the given coprimality establish the inverse identities. Equiv.sum_comp and Real.mul_rpow reindex the existing partition and weight definitions at exponent 1. Every clause is a direct upstream application or normalization. There is no existing frozen project theorem carrying the arbitrary noncoprime seam, so no project coverage GID and no new bind-only declaration.
