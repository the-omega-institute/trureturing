    justification: 钉版 mathlib 56a005855ea17e0b0958f73ec801ae140b0a1679；无可用仓内冻结 GID。ProbabilityTheory.strong_law_ae、ProbabilityTheory.iIndepFun.comp、ProbabilityTheory.IdentDistrib.comp、ProbabilityTheory.IdentDistrib.integral_eq、MeasureTheory.integral_finsetSum、MeasureTheory.integral_indicator_one、MeasureTheory.Integrable.of_bound、MeasureTheory.ae_all_iff 供应同批三元组乘积指标、期望、无偏性、同时强大数收敛、六类频率与全部(52.16)约束；有限表项和逆矩阵仅用有限决定与代数规范化。对本节实际有限系统的路径，Function.IsPeriodicPt.iterate_mod_apply 供应从时刻1起的二周期；Ergodic.ae_eq_const_of_ae_eq_comp_ae、MeasureTheory.integral_map、Finset.sum_range_sub 和标准常数除以自然数极限供应平稳遍历时的平均极限、c01=c12及1/N边界差。这里只核验本节有限模型的结论，不声称已形式化一般Birkhoff定理。MeasureTheory.Measure.map_add、MeasureTheory.Measure.map_smul、MeasureTheory.Measure.map_dirac'、MeasureTheory.integral_add_measure、MeasureTheory.integral_dirac 与 ENNReal.inv_two_add_inv_two 核验三种真实二点概率律：旧四期望相同而联合矩不同，故不存在统一后处理；const路径律平稳但路径平均0或1而总体联合矩1/2，once路径律非平稳、初始联合矩(0,1/2)，长平均遗失初始跃迁；混批特征可得负类质量，漂移采样可破坏旧无偏性。权限、读取噪声必须进入实际模型是适用范围说明。
