    justification: 'Pure pinned-upstream closure proposed from source inspection, with zero new Lean. Mathlib is pinned to 56a005855ea17e0b0958f73ec801ae140b0a1679. No frozen D5 GID matching the entire atom was identified in the searched public/private declarations; C129ParaboloidSlice.paraboloid_slice concerns a scalar predicate only, CartesianVariance.psd_entry_bound only necessity, and LinGProperty.offDiagonal_eq_zero only a boundary. For real Z>0,r,X,Y,kappa and complex w,q,z, set ell=Complex.normSq(w)/Z-(r-X-Y), h=X-Complex.normSq(q)/Z, a=kappa-ell, b=h-kappa, delta=z-w*conj(q)/Z. The source specializes r=1-Z. Apply Matrix.PosSemidef.fromBlocks₁₁ with A=[Z], B=[w,q], D=[[r-X-Y+kappa,conj(z)],[z,X-kappa]]. Matrix.PosDef.diagonal and Matrix.PosDef.isUnit supply the scalar pivot and nonempty_invertible_iff_isUnit supplies its Invertible instance. Matrix.inv_subsingleton, Ring.inverse_eq_inv, matrix multiplication and complex normalization give S=[[a,conj(delta)],[delta,b]]. Reindexing uses Matrix.posSemidef_submatrix_equiv. Necessity follows from Matrix.PosSemidef.diag_nonneg, Matrix.PosSemidef.det_nonneg and Matrix.det_fin_two: a,b>=0 and Complex.normSq(delta)<=a*b. For sufficiency, when a>0 apply the same Schur equivalence to [a] with B=[conj(delta)], obtaining scalar b-Complex.normSq(delta)/a>=0 by div_le_iff₀; use Matrix.posSemidef_diagonal_iff and .mpr. If a=0, Complex.normSq_nonneg and Complex.normSq_eq_zero force delta=0, so the diagonal criterion applies without division. This also covers b=0, both zero, and determinant equality. Consequently M PSD iff ell<=kappa<=h and the full complex disk inequality, in both directions. For v0=conj(w)/sqrt(Z), v1=conj(q)/sqrt(Z), Complex.normSq_eq_conj_mul_self, Real.sq_sqrt, Real.sqrt_pos and field normalization give residual diagonals a,b and (v v^dagger)10=w*conj(q)/Z, hence R10=delta. For a pure rho=psi psi^dagger with Z=Complex.normSq(psi2)>0, v_i*conj(v_j)=rho_ij*Z/(sqrt(Z)^2)=rho_ij, so the full R=0 and z=w*conj(