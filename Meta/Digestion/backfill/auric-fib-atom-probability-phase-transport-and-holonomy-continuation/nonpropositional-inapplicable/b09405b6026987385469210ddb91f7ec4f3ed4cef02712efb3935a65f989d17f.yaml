  nonpropositional:
    justification: "Upstream-only mathematical reuse under CLAUDE.md 3.2; this is a propositional proof ingredient, not an assertion that it lacks mathematical meaning. For every finite nonempty connected readout graph, retain all vertices I and all named edges E with endpoints s,t. Let rho be PSD with rho_ii=p_i>0 for every i and |C_e|^2=p_(s(e))*p_(t(e)) for every named edge, with reported orientation C_e=rho_(t(e),s(e)). Set V=CFC.sqrt rho. Matrix.PosSemidef.nonneg, CFC.sqrt_nonneg, IsSelfAdjoint.of_nonneg and CFC.sqrt_mul_sqrt_self give V^H*V=rho. inner_matrix_col_col gives every Gram entry and ||e_i||^2=p_i, so every Gram column is nonzero. norm_inner_eq_norm_iff gives collinearity on each saturated edge. Projectivization.mk_eq_mk_iff' and SimpleGraph.reachable_iff_reflTransGen with Relation.reflTransGen_le_of_equivalence_of_le, applied to equality of projective points, give one common nonzero column line on the whole graph. At any root r, phi_i=rho_ir/sqrt(p_r) gives rho_ij=phi_i*conj(phi_j) and |phi_i|^2=p_i for all i,j. Matrix.rank_vecMulVec_le, Matrix.rank_eq_finrank_span_cols and Module.finrank_pos_iff_exists_ne_zero give rank exactly one. For every fixed pure target psi with all matching diagonals and all matching complex edges, and every pure representative phi of rho, q_i=phi_i/psi_i has modulus one and every edge gives conj(q_(s(e)))*q_(t(e))=1. The same relation-closure theorem gives one common scalar zeta of modulus one with phi=zeta*psi; consequently every projector entry agrees with the target. Parallel and reversed named edges retain their observations through the same Hermitian entries; a singleton graph is included. The contextual trace-one hypothesis normalizes the representatives; the rank and outer-product argument does not need it. Unit-diagonal rescaling rho_ij/sqrt(p_i*p_j) and the known diagonal unitary transfer only the Gram equality mechanism of C-29.3, not its whole-channel identity conclusion. Cycle phases alone do not assert modulus saturation. Strict positivity and nonemptiness are retained: no zero-support extension or empty-graph rank-one assertion is made. These declarations belong to pinned Mathlib v4.35.0 at 56a005855ea17e0b0958f73ec801ae140b0a1679. No existing frozen project GID owning the complete compound source statement is available. This is a source-level upstream-reuse receipt, not a newly compiled exact project theorem; no new Lean declaration, helper, module, Scribe/Reg wrapper, first freeze, deposit or coverage GID is supplied. Only proof ingredient 11.4 is settled; proposition 11.3 remains a separate weighted three-by-three PSD Schur-complement obligation including both directions and zero residual diagonals, and the existing closed state of theorem 11.5 is preserved."
