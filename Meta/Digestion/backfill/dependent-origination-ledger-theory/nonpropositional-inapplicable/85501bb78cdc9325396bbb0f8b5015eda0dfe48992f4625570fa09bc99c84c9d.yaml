    justification: Pure upstream-only binding at mathlib revision 56a005855ea17e0b0958f73ec801ae140b0a1679 and its pinned Lean dependencies; no usable frozen repository GID for the exact source-ledger longest-path obligation. The archived FiniteCausalPaths result has additional HF, attribute and time hypotheses and is not this source statement. For the actual finite ledger node subtype V={p // p in N_L}, its actual selected-witness edge relation E is acyclic. Relation.TransGen gives the strict reachability relation on this same V; transitivity and acyclicity instantiate partialOrderOfSO. For each actual E-path ending at the given v, RelSeries.ofLE with Relation.TransGen.single transports it to an LTSeries on V, preserving the path and its EDGE count by the definition of ofLE. LTSeries.length_lt_card and Fintype.card_coe give length < |N_L|, hence length <= |N_L|-1 by Nat normalization. The zero-edge path at the actual v makes the set of path lengths nonempty; these lengths are bounded in the finite initial interval, so their maximum is the source depth and csSup_le gives the same bound. This uses neither an arbitrary topological index nor a node in an empty ledger. The final source remark merely distinguishes this per-ledger bound from an additional unbounded-chain hypothesis and does not assert the latter. All operations are upstream instantiation, projection and normalization. No new Lean statement or fresh compiled exact-application claim is made.
