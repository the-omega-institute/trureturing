    justification: "Pure upstream-only binding at mathlib revision 56a005855ea17e0b0958f73ec801ae140b0a1679 and its pinned Lean dependencies; no usable frozen repository GID supplies this complete original truth-table model. FiniteSupportPatternRealization and KernelRelativeDependencyEmptiness are restricted images and are not substituted for the source model. Use FirstOrder.Language.Term Nat with exactly the original finite Boolean connective tags, their arities and ordered children, Bool as the structure, and all full Nat-to-Bool valuations. FirstOrder.Language.Term.listEncode_injective and FirstOrder.Language.Term.listDecode_encode_list preserve that entire syntax; its Encodable instance, Encodable.encode_injective, Encodable.encodek and String.length_replicate supply a faithful string realization text(t)=String.replicate (Encodable.encode t) c and the total decoder (Encodable.decode s.length).getD (Term.var 0). Formula strings are the range, not a quotient or a bounded-variable language. For every original formula t, D_t=t.varFinset, A_t=(D_t -> Bool), and e_t(a)=(t.restrictVar id).realize a. The actual submitted proof is (s,T) with T any Finset (A_s x Bool); C_s=Finset.univ.image (fun a => (a,e_s(a))). The finite checker accepts exactly when s=t, T=C_s and all output components of T are true; mismatched tags, incomplete tables and incorrect rows fail. Finset.mem_image and Finset.forall_mem_image normalize this to every a:A_t satisfying e_t(a)=true. FirstOrder.Language.Term.realize_restrictVar, with restriction of arbitrary full valuations in one direction and Function.extend Subtype.val a (fun _ => false) plus Function.Injective.extend_apply in the other, identifies this with all full valuations realizing t as true. Finite function-space enumeration includes the unique empty assignment for empty D_t. Thus the accepted image is ALL tautologies of the original syntax, rather than a chosen symbol family or assumed acceptance law. Set.infinite_of_injective_forall_mem applies to n mapped to or(var n,neg(var n)); constructor injectivity and Boolean normalization give an infinite subset of that same image. Set ax=refs=permitted=empty. Soundness is the forward image implication, consistency follows at an inhabited valuation, and every proved t has its actual accepted table as a singleton certified support with empty references and acyclicity by empty-relation normalization. These establish the source assumptions rather than taking SourceLaws on faith. On the faithful formula-string realization take address h=id and binding B=id; every formula has an expression (its text, arbitrary String name, its actual complete table), without requiring acceptance. Interpretation decodes text, keeps the proof table and ignores the name. Replicate lengths give infinitely many names, and renaming preserves interpretation and acceptance. Legal ledgers retain exactly their finite certified nodes, disjoint registered frontier O, actual chosen tables and their derived edges; admissible transformations remain all total witness-preserving extensions, not a selected subclass. Existing repository kernel/ledger definitions serve only as interfaces. No new Lean, Scribe or Reg declaration, local semantic induction, frozen whole-claim GID, or fresh compiled check is asserted. In this same full model with infinite provable image take P=or(var 0,neg(var 0)), N_L={P}, its actual accepted complete two-row table as the selected witness, E_L=empty, and O_L=empty. The four exact source readouts at this node are (false,false,true,false): dependent origination fails because the selected witness has empty refs; dependency emptiness fails because this actual qualified table has both refs and ax empty, contradicting the source universal over qualified proofs; expression provision holds using P's text, any String name and its actual table; middle fails because its dependency-emptiness conjunct fails. Its persistence conjunct holds for EVERY admissible total transformation by witness-preserving node extension. Definition unfolding and Boolean/finite-set normalization give these readouts, refuting only the claim that every chapter-2 realization has all four predicates at every ledger node. This is no refutation of scripture, historical or semantic equivalence, cosmology, liberation, or empirical causal theory."
