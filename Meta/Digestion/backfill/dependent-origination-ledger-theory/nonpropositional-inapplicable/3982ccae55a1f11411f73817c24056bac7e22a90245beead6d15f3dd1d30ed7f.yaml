  nonpropositional:
    justification: Upstream-only definitional/logical closure; no project coverage GID. With the fixed kernel, permission set and readouts, Q(pi) means K(pi,P) = acc and ax(pi) is a subset of the permission set (Convention 2.1). The definition is forall pi, Q(pi) implies (refs(pi) != empty or ax(pi) != empty). Lean v4.35.0 Init/PropLemmas.lean not_exists and Init/Classical.lean Classical.not_and_iff_not_or_not and Classical.not_not, with logical reassociation, equate this to absence of a qualified proof with both readouts empty. Set.empty_subset in Mathlib/Data/Set/Basic.lean at mathlib 56a005855ea17e0b0958f73ec801ae140b0a1679 makes every accepted proof with empty ax qualified, yielding exactly the stated absence of an accepted proof with empty ax and empty refs. If there is no qualified proof, not_exists gives forall pi, not Q(pi), so the conditional universal is vacuous and supplies no proof-existence claim. The comparison with 不待异法 is a restricted naming convention, not an additional theorem. Zero new Lean.
