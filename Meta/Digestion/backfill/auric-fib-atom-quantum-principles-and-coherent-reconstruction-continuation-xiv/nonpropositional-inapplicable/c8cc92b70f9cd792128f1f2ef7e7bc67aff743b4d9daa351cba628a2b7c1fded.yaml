    justification: Applicability annotation for the fixed canonical pulse fibre, not a general classification. The positive statement that whole curves determine the original weighted generators, and hence the original left products L_q T_qt, is direct reuse of pinned Mathlib hasDerivAt_exp_smul_const, HasDerivAt.hasDerivWithinAt, HasDerivWithinAt.congr_of_mem, uniqueDiffOn_Icc_zero_one and UniqueDiffWithinAt.eq_deriv at zero, followed by the unchanged original block rules and cancellation of the nonzero alpha and c. This does not assume equality outside [0,1]. The need for the canonical J plus zero response, fixed positive metric and original isometries is an explicit applicability limit; no assertion of general rank two at every vertex, parallel kernels or flat active transport is settled. References to later ready results retain their own hypotheses and are not new proof claims here. Endpoint aliasing is the existing exponential periodicity boundary (Complex.exp_two_pi_mul_I and NormedSpace.map_exp), not generator uniqueness from endpoint samples. This receipt records that scope only; it does not claim a proof of the excluded general classification or of any unassigned later atom.
