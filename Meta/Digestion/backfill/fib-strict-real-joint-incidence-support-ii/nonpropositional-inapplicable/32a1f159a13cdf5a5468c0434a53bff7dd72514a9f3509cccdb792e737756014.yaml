    justification: Upstream-only algebraic proposition, not a nonpropositional definition. For arbitrary commutative-ring coefficients, H=A_f^2*K_4*d^2+(A_f^2*K_3-A_f*B_f*K_4)*d+A_f^2*K_2-A_f*B_f*K_3+(B_f^2-A_f*C_f)*K_4 gives A_f^3*K-(alpha*d+zeta)=H*f by commutative-ring normalization. Mathlib Polynomial.C_add, Polynomial.C_sub, Polynomial.C_mul, Polynomial.C_pow and the ring laws (mul_add, add_mul, sub_eq_add_neg) supply the coefficient normalization; dvd_def supplies divisibility with that explicit H. Polynomial.eval_add, Polynomial.eval_mul and Polynomial.eval_pow transfer it to every finite common root without dividing by A_f or d; eq_div_iff isolates d when alpha is nonzero. Pinned mathlib revision 56a005855ea17e0b0958f73ec801ae140b0a1679. Searched all D5/**/*.lean, including private declarations, for resultant, sylvester, quadratic/quartic linear remainder, polynomial division and the displayed coefficient pattern. LevensPascalian private resultants concern degrees 24 and 23 of a fixed different polynomial; forward-difference and interpolation results do not supply this ring identity. No usable frozen project GID was found in that searched scope.
