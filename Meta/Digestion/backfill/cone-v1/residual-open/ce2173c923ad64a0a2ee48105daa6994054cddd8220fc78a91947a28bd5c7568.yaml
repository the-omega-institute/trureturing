as t approaches 0 from above. boundaryPinchingFee substitutes r=1-2*t*x into the quadratic model. It carries the source's fee clause ONLY MODULO the uncarried identification in row 11. | Premises: 0 <= x.\nRow 6. Source: x → 0 予纯态对数律 | Public correspondence: Primary conjunct 2 states Tendsto transitionCorrection (nhdsWithin 0 (Ioi 0)) (nhds 1), the premise-free pure endpoint of the scalar transition profile. This is not an independent identification with the source fee. | Premises: none.\nRow 7. Source: x → ∞ 予 t·ln(2/u) | Public correspondence: Primary conjunct 3 states that transitionLeading (doorGap r/(2*y)) y tends atTop to Real.log (2/doorGap r). It is the large-coordinate profile; no composition with the fixed-x fee ratio in conjunct 1 is asserted. | Premises: r < 1.\nRow 8. Source: 即混态常数 c(r) = r·artanh(r)/2·δ² | Public correspondence: Primary conjunct 4 proves the quadratic model's fixed-radius delta^2 coefficient; it carries the source's fee clause ONLY MODULO row 11. Primary conjunct 5, via mixed_end_constants_bridge, proves the coefficient ratio 2*r*Real.artanh r / Real.log (2/(1-r)) tends to 1 as r approaches 1 from below. The 即 reading is this asymptotic equivalence, not equality at fixed r. | Premises: 0 < r and r < 1 for the model coefficient; r approaches 1 from below for the coefficient bridge.\nRow 9. Source: 跨越区验票比值 1.0000→0.9946 [数] | Public correspondence: UNCARRIED: no public Lean conjunct. 计算实验,不形式化. The durable multi-clause-guard retains this numerical report and requires source errata demoting it to a remark or certified numerical content connected to the fee. | Premises: none.\nRow 10. Source: 判读:对数从手抖尺度计到门缝尺度为止;确定性关门,关着的门临近才贵。 | Public correspondence: Primary conjuncts 2 and 3 describe the scalar profile's endpoint scales, and conjunct 5 describes gate-closing coefficient equivalence. Applying the model fee limits to the source fee remains conditional on row 11. The remaining wording is interpretive prose, not an additional formal proposition. | Premises: the separate endpoint and gate-closing regimes of the cited conjuncts.\nRow 11. Source: fee = H₂(λ+tr...) 之一阶展开 | Public correspondence: UNCARRIED: the identification of the source's tilted-pinching fee (entropy argument λ + t·r…) with the quadratic model H2((1−r)/2 + r t) − H2((1−r)/2); no public declaration states it. quadraticPinchingFee defines only that model, and boundaryPinchingFee merely substitutes r=1−2tx. | Premises: none.\nThe fixed-coordinate ratio and large-coordinate profile are separate regimes and are not composed into one limit. The source sentence `跨越区验票比值 1.0000→0.9946 [数]` is a computational report and is uncarried as `计算实验,不形式化`; the cover writer has no unresolved-subitem input for this report because the evaluator records no gap, so adding a coverage edge would incorrectly project the atom as absorbed-closed."
