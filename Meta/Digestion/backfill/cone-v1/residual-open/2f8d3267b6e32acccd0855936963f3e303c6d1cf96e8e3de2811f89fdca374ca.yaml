  quarantine:
    justification: "Retrieval preceded quarantine. D5 query `kubo.?mori|path identity|path.*entropy|relative.*entropy.*path|rightLogarithmicPathEnergy|logarithmicPath|km.*metric|bogoliubov` found no exact path identity; it found the public theorem `D5/S3/Divergence/LogDerivTrace.trace_mul_logDeriv` for source lemma 3.1 and the different `D5/S3/Divergence/MeanKernels/BelavkinStaszewskiPath.belavkin_staszewski_path`. Pinned Mathlib queries `kubo.?mori|bogoliubov|relative entropy.*integral|frechet.*log|deriv.*log` and `HasFDeriv...CFC.log` found scalar and complex logarithm derivatives and generic resolvent differentiation but no matrix-log Frechet derivative or Umegaki path theorem. Reachable GitHub Lean queries `Kubo-Mori`, `Kubo Mori`, and `Frechet CFC.log` all exited 0 with no hits. The local proof decomposition reuses `trace_mul_logDeriv` but stops at the absent public theorem identifying `CFC.log` differences or directional derivatives with `LogDerivTrace.logDeriv` along positive-definite affine segments; the related matrix-log integral lemmas in `BelavkinStaszewskiPath` are private and specialized, so recreating them would violate the private-owner SSOT rule. Reentry w73b45 refreshed origin/dev at 4a87f777b0 and repeated the same D5/Scribe-title and pinned-Mathlib patterns (each exit 0, same near misses). Loogle query `\"CFC.log\", HasFDerivAt` HTTP 200 exit 0 hits 0; LeanSearch query `Frechet derivative of the logarithm of a positive definite matrix CFC.log resolvent integral` HTTP 200 exit 0 returned eight scalar-derivative or definition hits after correcting a query-list HTTP 422 request. GitHub `Kubo-Mori`, `Kubo Mori`, and `Frechet CFC.log` Lean queries again exit 0 hits 0; `\"CFC.log\" \"HasDerivAt\" language:Lean` exit 0 found QuAIR/Lean-QIT at c1d59b133b56e3d79efb11ee46a728d290f761f5, Apache-2.0, TraceLogBridge.lean:112, a power-parameter limit, not the matrix-direction derivative. A17 near miss leanprover-community/physlib at 6a09b2d1761a0d4430083045a247eb121d8da260, Apache-2.0, QuantumInfo/ForMathlib/HermitianMat/LogExp.lean:399 `HermitianMat.tendsto_logApprox` proves a finite-resolvent limit on its own carrier; no derivative or uniform interchange is stated there. Local probe /private/tmp/consensus-rnd/sshx/w73b45/attempt-1/atom1-probe.lean exit 1 compiled inverse_affine_derivative, segment_trace_cancellation using the frozen trace owner, and resolvent_kernel_norm, then stopped at the exact goal `⊢ Integrable (Function.uncurry fun x y => ((1 - x) • sigma + x • rho + y • 1)⁻¹ * (rho - sigma) * ((1 - x) • sigma + x • rho + y • 1)⁻¹) ((volume.restrict (Set.Ioc 0 1)).prod (volume.restrict (Set.Ioi 0)))`. The source also permits supported semidefinite states, so a positive-definite prerequisite alone needs a support-restriction and boundary-limit bridge before whole-atom coverage. Scope: this prerequisite needs an admitted logarithm-integral carrier plus uniform parameter estimates; a feasible first slice is the A17.2 carrier bridge for physlib.tendsto_logApprox together with a public uniform shifted-resolvent bound, preserving the frozen private owners."
    reentry_condition: "Admit the pinned physlib HermitianMat.tendsto_logApprox result through A17.2 with a proved bridge to CFC.log, and construct a public uniform shifted-resolvent bound over positive-definite affine segments yielding joint Bochner integrability and parameter differentiation; use these to identify the affine logarithm derivative with D5.S3.Divergence.LogDerivTrace.logDeriv and its trace interchange without duplicating frozen private helpers, then supply the supported-semidefinite boundary bridge before covering the full atom."
    blocker_class: missing-prerequisite
