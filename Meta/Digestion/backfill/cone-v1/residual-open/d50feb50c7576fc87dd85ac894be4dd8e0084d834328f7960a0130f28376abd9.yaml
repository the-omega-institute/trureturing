  quarantine:
    justification: "Retrieval preceded quarantine. D5 query `kubo.?mori|petz|monotone metric|monotonicity.*metric|metric.*monotonicity|quantum.*dpi|relative entropy.*channel` found no exact owner; `D5/S3/Quantum/Divergence/QuantumRelativeEntropyDefectComposition.relative_entropy_defect_composition` is only an algebraic telescoping law, while `D5/S3/Divergence/LogDerivTrace.trace_mul_logDeriv` supplies source lemma 3.1 but not path differentiation or channel contraction. Pinned Mathlib queries `kubo.?mori|bogoliubov|monotone.*metric|matrix.*log.*deriv|logDeriv|completelyPositive.*trace` found scalar logarithmic derivatives and channel primitives but neither the positive-matrix path theorem nor Petz metric monotonicity. Reachable GitHub Lean queries `Kubo-Mori monotone` and `monotone metric Petz` exited 0 with no hits; `quantum relative entropy data processing` exited 0 and found Physlib's substantive `sandwichedRenyiEntropy_DPI_eq_one`, but that inequality contains neither the source's Kubo-Mori integral equality nor its pointwise nonnegative integrand. The local proof decomposition preserves affine segments immediately, then stops at two absent public results: theorem 3.2's matrix-log path identity and monotonicity of the Kubo-Mori quadratic form under arbitrary completely positive trace-preserving maps. Reentry w73g1: the inherited D5/Scribe and pinned Mathlib queries were rerun with exit 0 and no exact carrier; the new SupportAwareRelativeEntropy carrier and BelavkinStaszewskiPath private matrix_log_eq_integral_path supply neither differentiation nor contraction, and Loogle query `\"CFC.log\", HasDerivAt` returned zero hits (exit 0). Probe /private/tmp/consensus-rnd/sshx/w73g1/attempt-1/atom1-probe.lean (v4 log atom1-probe-v4.log, exit 1) proves affine preservation, trace cancellation, and the matrix inverse directional derivative, then stops at `HasDerivAt (fun s => CFC.log (m + s • X)) (∫ (t : ℝ) in Set.Ioi 0, (m + t • 1)⁻¹ * X * (m + t • 1)⁻¹) 0` under m.PosDef and X.IsHermitian. GitHub queries `Kubo-Mori monotone` and `monotone metric Petz` again returned no hits (each exit 0); the known DPI owner is leanprover-community/physlib@6a09b2d1761a0d4430083045a247eb121d8da260, QuantumInfo/Entropy/DPI.lean:1386 sandwichedRenyiEntropy_DPI_eq_one, Apache-2.0, with A17.2 admission tracked by #5555. The prerequisite exceeds this seat because uniform CFC-log differentiation, its second-variation identification with the resolvent quadratic form, and support reduction for possibly singular channel outputs are absent; a feasible first slice proves the uniform matrix-log directional derivative using the frozen integral representation."
    reentry_condition: "First expose the CFC.log directional derivative on positive-definite matrices with a proved locally uniform resolvent bound and integral interchange; combine it with the frozen trace identity to obtain the affine-path formula, and after A17.2 admission of the Physlib DPI owner under issue 5555 prove the second-variation/support bridge yielding pointwise Kubo-Mori contraction for the canonical FiniteStateChannel carrier."
    blocker_class: missing-prerequisite
