  quarantine:
    justification: "Retrieval preceded quarantine. D5 queries `spectral width|symmetric logarithmic|right logarithmic|rld|sld|commut.*relative|mean kernel|harmonic.*arithmetic` found no exact owner; `D5/S3/Divergence/MeanKernels/BelavkinStaszewskiPath.rightLogarithmicPathEnergy` supplies only the right-logarithmic path primitive and `LogarithmicMeanSandwich` supplies only scalar non-strict kernel inequalities. Pinned Mathlib queries `simultaneous.*diagonal|commute.*diagonal|Rellich|analytic.*eigen|hermitian.*commute|Hiai|Petz|measured.*relative|regulari.*relative` found standard commutation/CFC lemmas and a joint-eigenspace framework but no symmetric-logarithmic path energy, strict integrated-kernel equality criterion, analytic Hermitian path theorem, measured-relative-entropy regularization, or Hiai-Petz limit. Reachable GitHub Lean queries `Kubo-Mori commute`, `symmetric logarithmic divergence`, `simultaneously diagonalizable Hermitian`, and `Hiai-Petz` all exited 0 with no hits. The local proof route can reuse the frozen right-logarithmic path and scalar mean bound, but stops before constructing the source's symmetric-logarithmic path on the exact density-matrix carrier and before proving zero width iff matrix commutation; the atom's conditional tensor-limit clause additionally lacks measured-divergence and regularization primitives. Source definition 0.1 permits singular density matrices, while theorem 3.9 does not impose positive definiteness and its reciprocal kernels are undefined at zero eigenvalues, so the repaired statement must also encode a full-rank domain or a canonical extended-value convention."
    reentry_condition: "First repair the source scope by requiring positive-definite density matrices or defining canonical extended SLD/RLD path divergences on boundary states; then freeze the symmetric-logarithmic path primitive, the strict width-zero iff commutation theorem, and the measured-divergence regularization/Hiai-Petz result needed by the conditional tensor-limit clause."
    blocker_class: missing-prerequisite
