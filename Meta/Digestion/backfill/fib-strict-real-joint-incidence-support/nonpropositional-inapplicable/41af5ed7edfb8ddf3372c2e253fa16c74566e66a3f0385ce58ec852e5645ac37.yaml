    justification: Upstream-only commutative-ring algebra, including the degree-drop specializations; this is not a nonpropositional definition. The displayed H gives A^3*G=H*F+alpha*y+beta by ring normalization. Polynomial.resultant and Polynomial.sylvester specify the fixed degree-(2,4) determinant. Matrix.det_succ_row_zero, Fin.sum_univ_succ, Matrix.submatrix_apply, Fin.succAbove and Fin.addCases expand its explicit 6-by-6 matrix, after Polynomial.coeff_add, Polynomial.coeff_C_mul, Polynomial.coeff_X_pow, Polynomial.coeff_X and Polynomial.coeff_C normalize the entries. Commutative-ring normalization gives A*beta^2-B*alpha*beta+C*alpha^2=A^3*resultant(F,G;2,4). Polynomial.eval_add, Polynomial.eval_mul and Polynomial.eval_pow evaluate the first identity at any common root to obtain alpha*y+beta=0. The identity Z=alpha^2*F+(A*beta-A*alpha*y-B*alpha)*(alpha*y+beta) then gives Z=0 without dividing by A, so leading-degree drops are included. Pinned mathlib revision 56a005855ea17e0b0958f73ec801ae140b0a1679. Searched all D5/**/*.lean, including private declarations, for resultant, Sylvester, arbitrary commutative-ring quadratic/quartic remainders and the coefficient pattern. Fixed degree-24/23 LevensPascalian resultants and specialized radical-polynomial identities do not supply this degree-(2,4) identity; the ordered real Taylor remainder inequality is a different mathematical shape. No usable frozen project GID was found in that searched scope.
