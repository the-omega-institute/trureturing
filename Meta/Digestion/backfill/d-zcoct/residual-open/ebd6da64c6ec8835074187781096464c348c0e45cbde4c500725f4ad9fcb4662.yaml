    justification: "w73c50: source 12.1 on the finite complex square-zero algebra requires the factorial-weighted moment-to-cumulant formula, the independent reverse partition formula, and M=exp K with K defined as log M. Nonempty A is in scope from section 12. D5 search cumulant|moment.*partition|partition.*moment|mobius (exit 0) found Analytic/SeriesInequalities/PartitionMobiusInversion.partition_mobius_moment_cumulant_inversion, which assumes hrelation and the closed coefficient hmu and has no finite exp/log conclusion; its reverse conjunct specializes hrelation at top, so it cannot bind the whole source theorem. Body-shape search MvPolynomial.*Ideal.Quotient|Ideal.span.*X.*^2|nilpotent.*exp (exit 0) found Observer/InfiniteSourceAugmentationIdeal, an integer-indexed infinite square-zero carrier, not a finite logarithm coefficient theorem. Pinned Mathlib searches moebius|mu_eq_neg_sum|stirling and stirling|card.*(filter|partition)|sum.*factorial in Order/Partition and Combinatorics/Enumerative (exit 0) found IncidenceAlgebra.moebius_inversion_bot, mu_eq_neg_sum_Ioc_of_ne, Finpartition.card_mono, and Nat.stirlingSecond, but no closed finite-partition coefficient or coarsening-count bridge. loogle: \"moebius\" exit 0 HTTP 200 hits 58. leansearch: The Mobius function of the finite partition lattice is minus one to the number of blocks minus one times factorial of that number exit 0 HTTP 200 hits 5, generic mu definitions only. A17 GitHub code search Finpartition moebius (exit 0) hits 0; cumulant partition (exit 0) hits 1 unrelated large-deviation file; partition factorial mu (exit 0) hits 10. The relevant external near miss TauCetiProject/TauCeti 0731f4cccd3ab513abd910829dce53ca94b586f2, Apache-2.0, TauCeti/Combinatorics/Enumerative/Partition/Basic.lean:45 prod_map_factorial_indiscrete concerns integer partitions, not the set-partition incidence coefficient (raw fetch exit 0, full file read). Local construction /private/tmp/consensus-rnd/sshx/w73c50/attempt-1/atom2-probe.lean exit 1 uses the frozen locally finite order and coefficient primitives, proves the one-block case, and reduces the strict-coarsening induction step via mu_eq_neg_sum_Ioc_of_ne. Exact unsolved goal: ⊢ -∑ q ∈ Ioc p ⊤, (-1) ^ (#q.parts - 1) * ↑(#q.parts - 1).factorial = (-1) ^ (#p.parts - 1) * ↑(#p.parts - 1).factorial. The induction hypothesis applies only to strict coarsenings of p. No new content theorem was completed. Independently, the finite nilpotent logarithm coefficient and exponential closure must be derived from the source algebra, not supplied as hrelation. No source refutation is claimed."
    reentry_condition: "Provide the equivalence between coarsenings of p and partitions of its block set, its block-number count by Nat.stirlingSecond, and the signed factorial cancellation needed for the incidence recursion. Then admit coefficient extraction for powers in the finite complex square-zero algebra and inverse finite exp/log series on its nilpotent augmentation ideal, so the source moments and cumulants instantiate the frozen incidence theorem without assuming hrelation or hmu."
