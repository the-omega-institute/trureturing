nite complex channel carrier, not the weighted offline l2 analysis. These are partial carriers. (5) `只有正性没有完备性，可能保留盲核。`: the common-kernel equality and conditional dimension-capacity witness are partial carriers only; neither public statement provides the source single-channel positive-square and nonzero blind-mode pair. Positivity alone supplies no common-kernel triviality. (6) `只有很多测试但没有统一下界，负缺陷可能逃向无限尾部。`: `D5/S3/Weil/ZetaAnalytic/FiniteWindowGlobalBoundary.finite_window_positive_global_boundary` (Lean:30, public statement sha256:4322ee2c0124f3fb16fe52ec8d986f73b40f52fd7bc8738e3bc7629a4f4e0ef1) concludes positive local unit-sphere infima and `Tendsto floor atTop (nhds 0)` for a continuous real-linear sampling map. It assumes monotone windows, nonempty unit windows, positive finite-window frame bounds, unit admissible probes, and `probeEnergyVanishes`; it does not construct a jointly separating infinite family or prove the supplied probe limit. Additional public near misses: `D5/S3/Observer/Linear/LeastSquaresReconstructionNoiseBound.least_squares_reconstruction_noise_bound` (Lean:38) gives reconstruction error under a supplied finite-dimensional frame inequality and normal equation; `D5/S3/Weil/ZetaAnalytic/WhiteFloorSamplingDuality.white_floor_sampling_frame_duality` (Lean:31) gives equality of white-floor supremum and unit sampling infimum under a supplied spectral identity; `D5/S3/Analytic/Adelic/FiniteToroidalFrameReconstruction.finite_toroidal_frame_reconstruction` (Lean:50) reconstructs xi from a finite compact-window twist frame. None states the complete offline-mode contrast. Retrieval receipts: git grep of D5 and Blueprint Scribe text/titles on the pinned origin/dev, with `frame|Frame|下界|lower.?bound|RobustFrameBounds|robust_observer_frame_bounds|PositiveWeightedReadoutGramKernel|FiniteWindowGlobalBoundary|analysis.?operator|分析算子|blind|盲核|tail|尾部|injective|kernel|核`, exit 0 (17120 matching lines); public Lean and corresponding Scribe reads exit 0; exact D