  quarantine:
    justification: "Whole-atom multi-clause guard after predecessor and D5 carrier audit. On the restricted slice `delta != 0` and `gamma != 0`, frozen owner `D5/S3/Zeros/SymmetricPolynomial/FullSymmetryNonlocalization.full_symmetry_not_fixed_line_localization` carries the source quartic through conjunct `F = offCriticalQuartic delta gamma`; entire differentiability through `Differentiable Complex F`; reflection and conjugation through the two components of `HasFullZetaSymmetry F`; the zero set through `forall s, F s = 0 iff s in sourceZeros delta gamma`; four distinct zeros through `(sourceZeros delta gamma).card = 4`; off-line zeros through `forall s, F s = 0 -> s.re != criticalAbscissa`; and non-localization through the top-level negation of the universal implication from entire full symmetry to `FixedLineLocalization`. Source-vs-owner scope gap: the owner requires `gamma != 0` and asserts cardinality four, while the source allows `gamma = 0`, where the displayed roots collide and `sourceZeros delta 0` has cardinality below four, so that public statement cannot cover the source's arbitrary-gamma clause. The last source clause `RH iff J rho = rho for every nontrivial zero` is uncarried. Near misses: pinned Mathlib `RiemannHypothesis` defines localization by `riemannZeta` zeros, trivial-zero exclusion, pole exclusion, and real part one half, but states no mirror criterion; `D5/S3/Weil/ReflectionLedger.mirror_reversal_spec` identifies the mirror fixed locus pointwise but does not state RH or quantify zeta zeros; `D5/S3/Zeros/Symmetry/RiemannStabilizerFreeOrbit.riemann_stabilizer_free_orbit` gives only the forward implication from RH to `Zeta23.reflect rho = rho`; and `D5/S3/Zeros/Symmetry/ZeroSymmetryAction.all_nontrivial_zeros_critical_iff_mirror_indices_fixed` assumes a supplied `ZeroData` enumeration and states index fixedness, not Mathlib RH iff pointwise mirror fixedness for raw `riemannZeta` zeros. The rejected attempt `D5/S3/Zeros/SymmetricPolynomial/SymmetryNonlocalizationRiemannStabilizer.full_symmetry_nonlocalization_and_rh_stabilizer` was retracted because its named helpers `offCriticalQuartic_zero_height_factorization` and `offCriticalQuartic_zero_displacement_factorization` are frozen-definition unfolding plus ring, simp, and linear normalization, leaving its public theorem bind-only under CLAUDE.md rule 5⁗."
    reentry_condition: "Provide a content theorem whose public statement covers the gamma-arbitrary exact zero set, including degenerate root collisions, and the equivalence between Mathlib `RiemannHypothesis` and pointwise mirror fixedness for every nontrivial `riemannZeta` zero, with a genuine rule-5⁗ escape witness, then re-cover this atom; alternatively add source errata imposing `gamma != 0` on the polynomial clauses and split the RH clause into a separate atom, then re-cover the applicable clauses."
    blocker_class: multi-clause-guard
