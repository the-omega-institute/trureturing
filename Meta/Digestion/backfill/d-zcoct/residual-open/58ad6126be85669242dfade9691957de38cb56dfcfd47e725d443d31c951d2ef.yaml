  quarantine:
    justification: "carried：原文独立断言“另一方面，项目已经机器证明：任意一个非实离线零点都会产生某个 Weil 测试，使完整零点和严格为负；其他所有零点不能永久抵消它。”这一完整承重子句由已打开的 D5/S3/Weil/ZetaBridge/OffLineNonrealZeroNegativeWeilSquare.lean 中公开声明 D5/S3/Weil/ZetaBridge/OffLineNonrealZeroNegativeWeilSquare.offLineNonrealZero_yields_negative_weil_square（Lean 名 D5.S3.Weil.ZetaBridge.OffLineNonrealZeroNegativeWeilSquare.offLineNonrealZero_yields_negative_weil_square）承载。实际陈述为给定 Z : ZeroData、n : Nat、(Z.zero n).re ≠ criticalAbscissa 和 (Z.zero n).im ≠ 0，存在 g : WeilTestFunction 及 hZero : SymmetricConvergent Z (convolutionSquare g)，使 (zeroSum Z (convolutionSquare g) hZero).re < 0；负测试与收敛见证在结论中产出。已读 ZeroSum.lean：ZeroData 是实际 classicalZeta 非平凡零点的无重复穷尽枚举，含解析重数、两种对称与局部有限性；又读 TestFunctions.lean：WeilTestFunction 是偶、光滑、紧支撑复值实变量函数。 同文件的 D5/S3/Weil/ZetaBridge/OffLineNonrealZeroNegativeWeilSquare.burnol_power_tail_bound 明确给出整个 zeroOrbit 补集的可和性与 (1/4)^(N+1) 乘全枚举绝对和的界；主定理证明把目标轨道实部固定为 -4*multiplicity，并令完整补集范数小于 4*multiplicity，因此已承载的“不抵消”是完整收敛零点和结论，未被缩成有限截断。实读其冻结状态片，statement_id 为 sha256:90539c2b035d2ceb220b05d96a638e3d2e172370807cdfbb52932f8c0736b264。 另读 D5/S3/Weil/ZeroInfinitude/ExplicitFormulaObstruction.lean 的 D5.S3.Weil.ZeroInfinitude.ExplicitFormulaObstruction.nonempty_zeroData，实际结论 Nonempty ZeroData 且无额外假设，状态片存在；因此枚举存在性不列缺口。已读且确认冻结的 D5/S3/Weil/Separator/WeilSquarePositivityCriterion.weilSquarePositivity_implies_rh 实际接受 Z 与 ∀ g hZero, 0 ≤ (zeroSum Z (convolutionSquare g) hZero).re，推出 RiemannHypothesis。它是后续接线的支持定理，本记录的完整承载依据仍是上述负分离子句。 uncarried：尚未核到原文 W、Q_W 与仓内 WeilTestFunction/zeroSum 的保真类型化接线，尤其需要对每个仓内测试 g 给出进入原文 W 的对象 iota g，并证明 Q_W(iota g)=(zeroSum Z (convolutionSquare g) hZero).re，对所有收敛见证成立。尚未核到一条冻结声明在原文给定的 S、有限递增 prime/constellation 投影 P_N→I、D_0=P_0、D_N=P_N-P_(N-1)、非负 B、平方和等式及单位球上一致收敛这些假设下，完成 Q_W≥0、排除非实离线零点、RH 的整条链。还缺“只从 prime、prime-power、constellation、Archimedean 数据构造且不读取零点位置”的可核接口，以及不循环借用待证 Weil 正性定义的单位球/收敛语义。S、投影和展开在本 atom 中是原文假设；这里要求忠实类型化与接线，不要求无条件构造它们，也不把原文改成无条件 RH 证明。 scope gap：主 owner 的作用域是实际 ζ 的离线非实零点到完整负 Weil 平方测试；原文另含原始算术 Hilbert 空间中给定正创新展开的条件推论。支持 owner 的 hPos 是仓内 zeroSum 的全测试正性，原文 Q_W≥0 尚不能在未核身份的情况下填入它。多个冻结声明已有各自的数学内容，但尚无覆盖此 atom 全部实质子句的单条对应声明。 near misses：实际运行 rg -n 'innovation|Innovation|orthogonal.*expansion|uniform.*converg|positive.*expansion|Q_W|Weil.*form' D5/S3/Weil D5/S3/Analytic/ZetaObservation --glob '*.lean' --max-columns 200，并 cat D5/S3/Weil/ZetaBridge/PrimeArchimedeanEnergyIdentity.lean；其 prime_archimedean_energy_identity 给出边界能量、Archimedean 能量、算术跳跃能量减去质量阈值的等式及 Poincare 不等式等价，需要 hSupport、hZero、hArch，未给原文投影创新平方和或非负 B。实际用 sed -n '185,235p' D5/S3/Weil/ZetaBridge/FixedScaleWeilQuadraticForm.lean 读其 fixed_scale_weil_quadratic_form，结论是固定窗口 Fourier 乘子形式及正性测试等价，未证明该乘子形式非负，也未类型化 S/P_N。实际 cat D5/S3/Weil/Separator/WeilSquarePositivityCriterion.lean，确认 hPos 留在假设位。实际运行 rg -n 'tsum_nonneg' .lake/packages/mathlib/Mathlib/Topology/Algebra/InfiniteSum --glob '*.lean' --max-columns 180，并 sed -n '150,176p' .lake/packages/mathlib/Mathlib/Topology/Algebra/InfiniteSum/Order.lean；钉版库的 tsum_nonneg 可用于已给平方和的非负性，未建立 Q_W 与 zeroSum 的身份。所有未命中断言限于这些实际检索范围。 同族对照采用 (a)：实际运行 ls -1 Meta/Digestion/backfill/d-zcoct/absorbed-closed/ | wc -l 得 9，运行 rg -l '^ quarantine:' Meta/Digestion/backfill/d-zcoct/residual-open --glob '*.yaml' | wc -l 得 10。已 cat 同卷 absorbed-closed/4042ad0449ad9965ca7febe5b89fe10c144476d8f2b01128591bd12854ec0f57.yaml 及 cat Meta/Digestion/atoms/sha256/4042ad0449ad9965ca7febe5b89fe10c144476d8f2b01128591bd12854ec0f57 全文；原句逐字为：“该正性由整数权重直接产生，不依赖 RH，也不依赖 Weil 正性。” 该兄弟还明写整数权重平方和、半范数、商掉零半范数并完成为算术 Hilbert 空间。已用 sed -n '185,215p' D5/S3/Analytic/ZetaObservation/ArithmeticStatePositivity.lean 核实其 arithmetic_positivity 的整数加权平方和正性、半范数和完备化合取。子句级差别是：该兄弟的正性属于 s>1 的归一化整数权重状态 omega_sigma；本 atom 需要把 W 中的 Weil 二次型经 S 接到正创新平方和，再接完整 ζ 零点和。整数权重状态正性及其 Hilbert 完成不能充当这一缺失身份。 账目先决已用 cat Meta/Digestion/backfill/d-zcoct/residual-open/58ad6126be85669242dfade9691957de38cb56dfcfd47e725d443d31c951d2ef.yaml 核实：coverage_gids 为空，receipts 仅有 scribe: [] 和 unresolved_subitems: []，没有 cover_disposition。本席按 lean4 只读审阅方式在 HEAD 725798583c7e