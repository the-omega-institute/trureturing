  quarantine:
    justification: "At repository HEAD df917d01752f22da70e95c214184aaea1185c83d, the CAS, its surrounding recurrence statement in docs/develop/theory/D-ZCOCT.md, actual owner statements and frozen-state slices were read. Carried: D5/S3/Weil/EulerProduct.single_address_reading_spec has two explicit conjuncts: for prime p and k != 0, singleAddressReading (p^k) = Real.log p; and for not IsPrimePow n, singleAddressReading n = 0. The definition singleAddressReading is ArithmeticFunction.vonMangoldt, so the second conjunct carries the conditional non-prime-power zero rule and the first, at k=1, carries Lambda(p)=log p. D5/S3/Weil/PrimeAddress/PrimeAddress.zeta_has_no_silent_prime_address states singleAddressReading (p^k) != 0 under those prime/exponent hypotheses, carrying the nonzero prime-value clause needed for the eventual contradiction. The GID really includes both PrimeAddress path components even though its Lean namespace has one. Additional retrieved partial carrier D5/S3/ArithUnits/FiniteWindowResidues.finite_window_residues_realizable gives a simultaneous representative below the product for supplied nonzero pairwise-coprime moduli and residues. This carries the generic CRT existence step after its inputs are supplied, not their prime-pair construction or the requirement N >= N0. Uncarried: choosing 2r distinct primes, proving pairwise coprimality of a_j*b_j, choosing arbitrarily late N with a_j*b_j dividing N+j, proving each such N+j has two distinct prime divisors and hence is not a prime power, and composing that zero block with the assumed eventual recurrence to refute it. These arithmetic-block and recurrence bridges are absent from the selected public statements. Scope gap: pointwise von Mangoldt rules and a bounded representative for already-given congruences do not assert arbitrarily long, arbitrarily late zero intervals or rule out a fixed-order eventual recurrence. The surrounding source explicitly quantifies fixed r, coefficients and N0 with Lambda(n+r)=sum_{j<r} c_j Lambda(n+j) for n>=N0. Actual searches included `rg -n -i 'vonMangoldt.*recurr|recurr.*vonMangoldt|mangoldt.*zero.*block' D5/ .lake/packages/mathlib/Mathlib/ -g '*.lean'` (exit 1, no matches in that lexical scope) and the broader D5 chineseRemainder/owner-name search recorded in the commands quoted in this record. Near misses read in source: D5/S3/Weil/PrimePoleTerms.primeSummand_eq_zero_of_not_primePow is a weighted-test summand zero rule; .primeSummand_hasFiniteSupport obtains finite support from the test's compact support, not eventual vanishing of Lambda. D5/S3/Weil/GoldenCriticalSpectrum/EulerPronyArithmeticRealization.finite_euler_shift_trace_eq_vonMangoldt_dirichlet_window describes a finite address sum sampled in the Mellin parameter base+time*step, not the sequence Lambda(n) under integer shifts. FiniteWindowResidues supplies no prime-pair selection or late shift. The pinned library is not missing all remaining elementary ingredients: at mathlib db584cd6d46c92f209a44c0f1c829460d327499d, the opened ArithmeticFunction.vonMangoldt_pos_iff proves strict positivity exactly on prime powers, Nat.exists_infinite_primes n provides p>=n prime, and LinearRecurrence.eq_iff_eqOn_range_order gives equality of two solutions from equal initial data. Thus log p>0, late primes and generic zero propagation must not be advertised as absent library mathematics; their source-specific composition is still not supplied by the selected D5 owners. Same-source absorbed-closed sibling 4042ad0449ad9965ca7febe5b89fe10c144476d8f2b01128591bd12854ec0f57 was read in full. It says '将零半范数观察量商掉并完成，得到算术 Hilbert 空间：' and '该正性由整数权重直接产生，不依赖 RH，也不依赖 Weil 正性。'; it also displays the exact normalized squared-observable series and seminorm identity. Its coverage_gids binds D5/S3/Analytic/ZetaObservation/ArithmeticStatePositivity.arithmetic_positivity, whose statement was opened and includes positivity, the series, seminorm, zero-norm criterion, density and completion. Those clauses concern a zeta-weighted space of bounded observables, unlike this atom's unbounded-index CRT/recurrence argument; the sibling is not reduced to a positivity-only assertion. ASSUMED-UNVERIFIED: no Lean compiler/kernel/axiom or Scribe checks were run; no source-specific zero-block construction, recurrence transport or complex-coefficient specialization was elaborated; no exhaustive ecosystem nonexistence search was performed. These verified partial carriers justify quarantine, not whole-atom closure."
    reentry_condition: "Provide a frozen D5 or pinned-library construction theorem with the following statement: for every r B : Nat there exist N >= B and a b : Fin r -> Nat such that all 2r primes (indexed by Fin r x Bool) are pairwise distinct, the moduli a j * b j are nonzero and pairwise coprime, and forall j, a j * b j divides N+j and not IsPrimePow (N+j). Its proof should explicitly construct residues for -j modulo a j*b j, use D5/S3/ArithUnits/FiniteWindowResidues.finite_window_residues_realizable (or pinned Nat.chineseRemainderOfFinset), and shift the solution by multiples of the positive product to reach B. Compose its last clause with D5/S3/Weil/EulerProduct.single_address_reading_spec.2 to obtain forall j<r, Lambda(N+j)=0. With B=N0, translate the assumed eventual recurrence into LinearRecurrence.IsSolution for u(k)=Lambda(N+k), or its scalar cast in the source's declared coefficient field. Apply pinned LinearRecurrence.eq_iff_eqOn_range_order to u and the zero solution to get forall k, u(k)=0. Obtain p>=N+1 from pinned Nat.exists_infinite_primes, and contradict this with D5/S3/Weil/PrimeAddress/PrimeAddress.zeta_has_no_silent_prime_address at k=1. Recover the source's explicit positive log value using EulerProduct.single_address_reading_spec.1 and pinned ArithmeticFunction.vonMangoldt_pos_iff. The resulting public statement must refute existence of r, c : Fin r -> K and N0 satisfying the displayed recurrence for every n>=N0, with the coefficient field/casts explicit; handle r=0 by its empty sum, since the source does not exclude it. Reentry requires the prime-selection, two-divisor, arbitrarily-late block and eventual-recurrence clauses as well as the final contradiction, not merely an uninstantiated CRT theorem or a Mellin-window identity."
    blocker_class: multi-clause-guard
