    justification: "Whole-atom multi-clause guard after retrieval. The analytic clauses have a near owner on current origin/dev: `D5/S3/Analytic/Boundary/LogMomentJetFromDyadicCount.summable_log_moment_of_dyadic_count` proves summability for m+1<k from exact dyadic shell counts, but its own statement and Scribe disclose that it specializes the source's real beta cumulative Vinogradov bound to an integer-k dyadic estimate and it does not state the jet table or concluding geometry. D5/current-origin searches `counting function|partial summation|logarithmic moment|boundary.*jet|osculating|differentiability.*depth` found that near owner and unrelated jet modules, but no definition of the source's boundary orbit, osculating circle, or differentiability depth. Pinned Mathlib searches `Abel summation|counting function|summable.*log|osculating|boundary.*jet|curvature.*circle` found Abel-summation and generic series infrastructure but no named carrier or theorem for the clauses `二阶 jet 有限，可定义密切圆`, `四元素数构型是...第一个自然拥有经典二阶边界几何的对象`, or the boxed `构型阶数控制其边界轨道的可微深度`. Reachable GitHub Lean searches `osculatingCircle` and `osculating circle` returned no code hits. Local carrier probe `/private/tmp/w73c26-atom2-carrier-probe.lean` (log `/private/tmp/w73c26-atom2-probe.log`) exited 1 with unknown identifiers `BoundaryOrbit`, `BoundaryLogJet`, `OsculatingCircle`, and `DifferentiabilityDepth`. Binding the near owner would therefore omit public clauses, while inventing definitions would violate the qualitative-remark and no-definitional-substitution rules."
    reentry_condition: "The source or a frozen canonical owner must define the boundary orbit, its logarithmic jets and differentiability depth, and a classical osculating-circle predicate with the regularity and nondegeneracy hypotheses needed for existence; then provide a whole statement that derives every table row and both boxed consequences from the real-beta cumulative counting hypothesis, or revise the atom boundary to the analytic summability clause alone."
