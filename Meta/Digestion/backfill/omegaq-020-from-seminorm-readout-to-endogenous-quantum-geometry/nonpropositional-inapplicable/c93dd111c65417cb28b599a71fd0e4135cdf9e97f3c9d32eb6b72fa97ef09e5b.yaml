    justification: "Upstream-only reuse, proof_shape bind-only, admission_basis none; no project GID and no new Lean declaration. Mathlib is pinned at 56a005855ea17e0b0958f73ec801ae140b0a1679. The domain is an arbitrary real vector space A with Seminorm p and arbitrary real bilinear m satisfying p(m x y)=p(x)*p(y). No ring, associativity, original positive definiteness, inner product, dimension or faithfulness assumption is used.\n\nSeminorm's existing map_zero, map_add_le_add, map_neg_eq_map and map_smul_eq_mul give the Submodule with carrier {x | p x=0}. Two triangle inequalities give p(x+n)=p(x) for p(n)=0. Exact multiplicativity gives p(m x n)=p(m n x)=0, so this same null submodule is two-sided for m. These are direct instances and normalization of the stated axioms.\n\nUse the literal Submodule quotient A/N, not an isomorphic replacement. Install the seminormed group from p.toAddGroupSeminorm and its compatible real normed-space structure. Mathlib Analysis.Normed.Group.Quotient supplies Submodule.Quotient.seminormedAddCommGroup, Submodule.Quotient.normedAddCommGroup and Submodule.Quotient.normedSpace. N is closed as the zero fiber of the resulting continuous norm. QuotientAddGroup.norm_mk and Metric.infDist_eq_iInf identify norm([x]) with p(x): for every n in N, dist(x,n)=p(x-n)=p(x), and N contains zero. Thus the existing quotient norm is exactly the original readout on every original representative, including zero-seminorm vectors and the zero quotient.\n\nApply LinearMap.liftQ2 (Lean identifier liftQ with subscript 2: liftQ₂) to m.compr₂ N.mkQ. Its two kernel premises are precisely the two ideal facts above via Submodule.Quotient.eq. LinearMap.liftQ₂_mk gives M([x],[y])=[m(x,y)] for the same original representatives. Quotient induction and norm([x])=p(x) transfer the exact multiplicative norm identity to all quotient elements; no associative algebra structure is introduced.\n\nOnly for the optional E plus readable-unit clause, choose original x with p(x)>0. Then [x] is nonzero by Submodule.Quotient.eq. The two nonnegative readable-unit defects have sum zero, so each lies in N; the same quotient equality gives M([e],[y])=[y] and M([y],[e])=[y] for every y. Cancelling the positive p(x) in norm(M([e],[x]))=norm([e])*p(x)=p(x) yields norm([e])=1. Nontriviality and unit norm are consequences, never premises. If E is absent, the zero quotient remains in scope and no unit-norm-one conclusion is made.\n\nThis receipt records complete upstream reduction and textual digestion only; it is not a new kernel-verified exact application or frozen mathematical theorem."
