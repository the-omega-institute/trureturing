    justification: 'The prepared environment and measured basis are fixed model data. The testable isometry and unitary-extension assertions are upstream-only consequences: expand the displayed K0 and K1 to obtain diagonal effects diag(1,0,1/2,0,1) and diag(0,1,1/2,1,0), whose sum is I5; Real.sq_sqrt and finite matrix/inner-product normalization establish completeness and measurement orthonormality. LinearIsometry.extend and LinearIsometry.extend_apply extend the resulting isometry from H5 tensor span(f0) to H5 tensor H2, with finite-dimensional square-isometry surjectivity supplying the unitary realization. Taking the specified bras gives exactly A0,A1. No suitable project GID is needed for this concrete normalization and upstream extension; no new theorem or physical-realization claim is introduced.'
