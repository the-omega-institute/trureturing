    justification: 'Definition 1.2 fixes the actual embedding, Kraus operators, environment preparation, measurement basis and logical coordinates. Its nonpropositional model and scope clauses are distinguished from its testable identities. Every testable identity is upstream-only: finite effect and orthogonality normalization using Real.sq_sqrt, LinearIsometry.extend with LinearIsometry.extend_apply for the finite-dimensional unitary extension, and Matrix.exp_conj, Matrix.exp_diagonal, Complex.exp_mul_I, Real.cos_pi_div_six and Real.sin_pi_div_six for the fixed exponential expression. The four canonical children retain all displayed data and identities. No suitable project GID is required for these fixed-data and upstream-only clauses; no new Lean, fairness theorem or measurable terminal model is asserted.'
