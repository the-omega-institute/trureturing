  nonpropositional:
    justification: "Upstream-only closure of all Recovery 8.5 mathematical clauses under its complete 8.1-8.3 source contract: one history-only policy, finite nonempty common source relation, finite actual responses, history-dependent legal queries/stops, natural query and terminal fees, and a legal free stop at every possible history. No existing frozen project GID covers the whole raw minimax statement; FiniteHorizonReachability supplies only a related strategy characterization. At pinned Mathlib db584cd6d46c92f209a44c0f1c829460d327499d, List.append_right_injective/List.append_cancel_left and constructor equality make distinct first-response full-history cones disjoint. Function.Injective.extend_apply, with codomain the entire legal Policy type, glues one continuation per observed response; the root uses the common first query and off-cone histories use the given free stop. Raw configurations carry the SAME immutable source and retain full trace, terminal implementation label and query fees. Constructor equations give semiconjugacy on each invariant cone and for the trace/fee prefix map; Function.Semiconj.iterate_right, Function.iterate_succ_apply, Function.iterate_fixed and Function.iterate_invariant give exact complete-run equality. Hence the gluing preserves every source output/loss, adds exactly one query and its fee, and charges the selected terminal fee once. Restriction uses the same selector on every actual response fiber. Equiv.sigmaSubtypeFiberEquiv reindexes the original sources by actual responses, with no independent resampling. Taking infima over these exact attainable-map equalities and applying iSup_iInf_eq_of_finite gives the Bellman recurrence without center or policy attainment. Horizon zero permits immediate affordable stopping; an attempted query times out. Empty affordable-query infimum is ENNReal top, never Real.sInf(empty). exists_eq_ciInf_of_finite applies only to a nonempty finite query index or the nonempty stop-plus-query value choice. The legal free stop has finite worst loss on a finite source set, so values are finite and nonnegative. exists_lt_of_ciInf_lt supplies the proof's approximate continuations, and the same gluing preserves their exact budgets and horizon. Enlarged budget or horizon retains the same stopped runs; ciInf_mono_of_forall_exists gives value monotonicity. Zero-fee enabling queries are retained, chronological histories are not collapsed to candidate sets, duplicate terminal outputs may have distinct fees, and arbitrary legal center sets need not attain their infimum. All steps use these upstream facts, source hypotheses and normalization; no new Lean declaration, freeze or project truth claim is made. The chain parent's own closure is not asserted."
