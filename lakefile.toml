name = "trureturing"
version = "0.1.0"
keywords = ["mathematics", "formalization"]
defaultTargets = ["Trureturing"]
testDriver = "omegaAudit"

# Keep canonical Lean compiler processes single-threaded. Lake documents
# weakLeanArgs as execution-only arguments excluded from build traces; -j1 is
# forwarded by Lean/Shell to ShellOptions.numThreads.
weakLeanArgs = ["-j1"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "Trureturing"
roots = ["Trureturing", "D5"]
globs = ["Trureturing", "D5.+"]

[[lean_lib]]
name = "OmegaInit"
srcDir = "src"

[[lean_lib]]
name = "OmegaMathlib"
srcDir = "src"

[[lean_lib]]
name = "OmegaMath"
srcDir = "src"

[[lean_lib]]
name = "OmegaChecks"
srcDir = "src"

[[lean_lib]]
name = "OmegaChecks.InitCompiler"
srcDir = "src"

[[lean_lib]]
name = "OmegaBuild"
srcDir = "src"
roots = ["OmegaBuild.Commands"]

[[lean_exe]]
name = "omegaBackendPlan"
root = "OmegaBuild.Plan"
srcDir = "src"

[[lean_exe]]
name = "omegaAudit"
root = "OmegaChecks.Audit"
srcDir = "src"
