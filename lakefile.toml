name = "trureturing"
version = "0.1.0"
keywords = ["mathematics", "formalization"]
defaultTargets = ["Trureturing", "OmegaMath", "OmegaD5"]

# Keep canonical Lean compiler processes single-threaded. Lake documents
# weakLeanArgs as execution-only arguments excluded from build traces; -j1 is
# forwarded by Lean/Shell to ShellOptions.numThreads.
weakLeanArgs = ["-j1"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "Trureturing"
roots = ["Trureturing", "D5"]
globs = ["Trureturing", "D5.+"]

[[lean_lib]]
name = "OmegaInit"
srcDir = "src"

[[lean_lib]]
name = "OmegaMath"
srcDir = "src"

# The narrower D5.Omega prefix is resolved before the earlier D5 library.
[[lean_lib]]
name = "OmegaD5"
srcDir = "src"
roots = ["D5.Omega"]
globs = ["D5.Omega.+"]

[[lean_lib]]
name = "OmegaChecks"
srcDir = "src"
