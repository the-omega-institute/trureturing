name = "trureturing"
version = "0.1.0"
keywords = ["mathematics", "formalization"]
defaultTargets = ["Trureturing", "LeanInformationAudit"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0"

[[lean_lib]]
name = "Trureturing"
roots = ["Trureturing", "D5"]
globs = ["Trureturing", "D5.+"]

[[lean_lib]]
name = "LeanInformationAudit"
srcDir = "tools/lean-inspector"
roots = ["LeanInformationAudit"]
globs = ["LeanInformationAudit.+"]
