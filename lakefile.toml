name = "trureturing"
version = "0.1.0"
keywords = ["mathematics", "formalization"]
defaultTargets = ["Trureturing", "LeanInformationAudit"]
moreLeanArgs = ["-Dweak.compilerOrigin=true"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0"

[[require]]
name = "leanInspector"
path = "tools/lean-inspector"

[[lean_lib]]
name = "Trureturing"
needs = ["leanInspector/compilerInput"]
roots = ["Trureturing", "D5"]
globs = ["Trureturing", "D5.+"]

[[lean_lib]]
name = "LeanInformationAudit"
needs = ["leanInspector/compilerInput"]
srcDir = "tools/lean-inspector"
roots = ["LeanInformationAudit"]
globs = ["LeanInformationAudit.+"]

[[lean_lib]]
name = "LeanInformationAuditAnalysis"
needs = ["leanInspector/compilerInput"]
srcDir = "tools/lean-inspector"
roots = ["LeanInformationAuditAnalysis"]
globs = ["LeanInformationAuditAnalysis.+"]
