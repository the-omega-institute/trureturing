name = "trureturing"
version = "0.1.0"
keywords = ["mathematics", "formalization"]
defaultTargets = ["Trureturing"]

# Keep canonical Lean compiler processes single-threaded. Lake documents
# weakLeanArgs as execution-only arguments excluded from build traces; -j1 is
# forwarded by Lean/Shell to ShellOptions.numThreads.
weakLeanArgs = ["-j1"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[require]]
name = "omegamath"
git = "https://github.com/the-omega-institute/omegamath"
rev = "b3556e3c80f0d13ca66f812e578f5541ae0e36cb"

[[lean_lib]]
name = "Trureturing"
roots = ["Trureturing", "D5"]
globs = ["Trureturing", "D5.+"]
