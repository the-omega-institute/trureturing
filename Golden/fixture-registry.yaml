schema_version: 1
root_files:
  - ".gitignore"
  - "AGENTS.md"
  - "CLAUDE.md"
  - "Directory.Build.props"
  - "Directory.Packages.props"
  - "Makefile"
  - "README.md"
  - "Trureturing.lean"
  - "global.json"
  - "lake-manifest.json"
  - "lakefile.toml"
  - "lean-toolchain"
governance_documents:
  - "Generated/FILEMAP.md"
  - "Meta/FILEMAP.toml"
  - "docs/CONTRIBUTING.md"
  - "docs/GOVERNANCE.md"
  - "docs/develop/spec/golden-ledger-repo-spec.md"
agent_files:
  - "CONTEXT.md"
  - "adversary.md"
artifact_kinds:
  json:
    profile: structured-json
    selectors:
      - "check"
      - "legacy"
      - "quote"
      - "result"
      - "run"
    path_selectors:
      - "formal"
      - "values"
  yaml:
    profile: structured-yaml
    selectors:
      - "result"
      - "run"
      - "spec"
    path_selectors:
      - "experiments"
      - "formal"
