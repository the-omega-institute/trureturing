schema = "stratalint-perf-budget-v1"

[[budgets]]
id = "local-m5-gate-total"
mode = "warn-only"
venue = "local"
os = "Darwin"
arch = "arm64"
cpu_class = "Apple M5"
workload_id = "local-harness-gate"
kind = "timing"
stage = "total"
metric = "p95_seconds"
limit_seconds = 1950
owner = "harness/performance"
review_due = "2026-11-20"
remediation = "Run make -C tools perf-report, inspect ~/.stratalint-perf/events.jsonl for same-cohort receipts, and profile the slowest gate stages."
false_positive_window_days = 14
false_positive_rate_percent = "unmeasured"
rollback_criteria = "Keep or restore warn-only when the rolling false-positive rate is unmeasured or at least 5 percent."
source = "2026-08-14 recalibration: events.jsonl same-cohort receipts, n=185, med=324s, p95=1614s, load<=1.0 filter; old 2026-07-20 baseline architecture retired."

