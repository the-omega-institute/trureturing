rollback_criteria = "Keep or restore warn-only when the rolling false-positive rate is unmeasured or at least 5 percent."
source = "2026-08-15 recalibration: PerfReportBuilder passed-only, all-history, Apple M5 cohort - n=50, med=1363s, p95=3336s; limit = p95 +~15%. WARN at this limit means p95 grew beyond the 2026-08-15 snapshot. Note: comparator has no time window or load filter; earlier mixed-status receipts (2026-08-14 version) misdescribed the measured population."

