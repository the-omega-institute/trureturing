<svg xmlns="http://www.w3.org/2000/svg" width="360" height="560" viewBox="0 0 360 560" role="img" aria-labelledby="title description">
  <title id="title">From inquiry to reusable knowledge and the next question</title>
  <desc id="description">Ask a question, test hypotheses, check a proof or refutation, and keep a reusable result. Dashed paths return unresolved questions from testing, proof checking or results to the next inquiry.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="360" height="560" fill="#ffffff"/>
  <g fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)">
    <path id="question-to-test" d="M180 82 V124"/>
    <path id="test-to-check" d="M180 188 V228"/>
    <path id="check-to-result" d="M180 292 V332"/>
    <g stroke-dasharray="5 4">
      <path id="result-to-open" d="M180 396 V438"/>
      <path id="test-to-open" d="M270 156 H316 Q328 156 328 168 V478 Q328 490 316 490 H284"/>
      <path id="check-to-open" d="M270 260 H290 Q302 260 302 272 V453 Q302 465 290 465 H234"/>
      <path id="open-to-question" d="M76 490 H44 Q32 490 32 478 V62 Q32 50 44 50 H90"/>
    </g>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" stroke-width="1.5">
    <g id="question">
      <rect x="90" y="18" width="180" height="64" rx="32" fill="#edf2f7" stroke="#475569"/>
      <text x="180" y="44" fill="#172033"><tspan x="180">Ask a precise</tspan><tspan x="180" dy="24">question</tspan></text>
    </g>
    <g id="test">
      <rect x="90" y="124" width="180" height="64" fill="#edf2f7" stroke="#475569"/>
      <text x="180" y="150" fill="#172033"><tspan x="180">Compute and</tspan><tspan x="180" dy="24">test hypotheses</tspan></text>
    </g>
    <g id="check">
      <rect x="90" y="228" width="180" height="64" fill="#e2f3ec" stroke="#28745b"/>
      <text x="180" y="254" fill="#133f32"><tspan x="180">Check a proof</tspan><tspan x="180" dy="24">or refutation</tspan></text>
    </g>
    <g id="result">
      <rect x="90" y="332" width="180" height="64" fill="#e2f3ec" stroke="#28745b"/>
      <path d="M98 332 V396 M262 332 V396" stroke="#28745b"/>
      <text x="180" y="358" fill="#133f32"><tspan x="180">Keep a reusable</tspan><tspan x="180" dy="24">result</tspan></text>
    </g>
    <g id="open">
      <path d="M180 438 L284 490 L180 542 L76 490 Z" fill="#fff4d6" stroke="#95651b" stroke-dasharray="5 4"/>
      <text x="180" y="484" fill="#553a10"><tspan x="180">What remains</tspan><tspan x="180" dy="24">open?</tspan></text>
    </g>
  </g>
</svg>
