kind = "package"
name = "theory-selfgrowth"
persistence_class = "stateless_adapter"

# Theory self-growth producer (CLAUDE.md rule 22 open-driven flywheel).
# Reconciles from a package-owned periodic tick, with idle-detector.system_idle retained as
# a secondary wakeup, and emits at most one open request for the frontier-generation workflow.
# Authoritative truth-DAG eligibility remains downstream; this adapter never edits truth nodes.
#
# HOST-package constraint: uses ONLY publishable libraries (contract) + framework-injected
# globals (exec_sync to read FKST_GITHUB_REPO, raise to produce the event). It does NOT
# use forge/devloop/workflow_internal (platform-internal, not published to host packages)
# — egress stays with the platform: github-proxy performs the actual `gh issue create` and
# dedups on `dedup_key`.

[code]
root = "."

[lib_deps]
libraries = ["contract"]

[event_deps]
packages = ["idle-detector", "github-proxy"]
