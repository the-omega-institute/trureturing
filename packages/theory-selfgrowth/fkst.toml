kind = "package"
name = "theory-selfgrowth"
persistence_class = "stateless_adapter"

# Theory self-growth producer (CLAUDE.md 第22条 open-driven flywheel).
# Subscribes to the platform idle broadcast (idle-detector.system_idle) and emits ONE
# deduped issue routing to the existing `frontier-generation` workflow ("decide WHAT to
# prove next"). The codex reasoning over the frozen truth-DAG + literature happens
# DOWNSTREAM in that workflow; this producer only fires the idle->generate transaction
# and never touches a frozen node (conservative extension).
#
# HOST-package constraint: uses ONLY publishable libraries (contract) + framework-injected
# globals (exec_sync to read FKST_GITHUB_REPO and check open requests, raise to produce
# the event). It does NOT use forge/devloop/workflow_internal (platform-internal, not
# published to host packages) — github-proxy performs the actual `gh issue create` and
# generation-scoped `dedup_key` replay handling.

[code]
root = "."

[lib_deps]
libraries = ["contract"]

[event_deps]
packages = ["idle-detector", "github-proxy"]
