kind = "package"
name = "theory-selfgrowth"
persistence_class = "stateless_adapter"

# Theory self-growth producer (CLAUDE.md 第22条 open-driven flywheel).
# Subscribes to the platform idle broadcast (idle-detector.system_idle) and, when
# the D5 frontier has no open generation request, emits exactly ONE deduped issue
# routing to the existing `frontier-generation` workflow ("decide WHAT to prove next").
# The codex reasoning over the frozen truth-DAG + literature happens DOWNSTREAM in
# that workflow; this producer only fires the idle->generate transaction. Modeled on
# the `archaudit` package (idle-subscribed issue producer), minus the codex judgment
# pipeline (deterministic dedup + emit only).

[code]
root = "."

[lib_deps]
libraries = ["contract", "workflow", "forge", "devloop"]

[event_deps]
packages = ["idle-detector", "github-proxy"]
