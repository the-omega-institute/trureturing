name: agent-oactc-next-truth-lean

on:
  push:
    branches:
      - agent/work/oactc-circle-phase-refinement-v1-20260902

permissions:
  contents: read

jobs:
  validate:
    if: contains(github.event.head_commit.message, '[oactc-next-truth-lean]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/work/oactc-circle-phase-refinement-v1-20260902
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install pinned Lean toolchain
        run: tools/scripts/workflow/install-lean-toolchain.sh lean-toolchain --github-path "$GITHUB_PATH"
      - name: Restore Lean dependencies
        run: lake update
      - name: Build next OACTC truth owners
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          : > diagnostics/summary.tsv
          failed=0
          modules=(
            D5.S3.Observer.GoldenPrimeCircle.GoldenRationalCirclePhaseInjectivity
            D5.S3.Analytic.GoldenTomography.FinitePositiveRationalCircleTomography
            D5.S3.Observer.Separation.TemporalSeparationUnderRefinement
            D5.S3.Analytic.EulerTails.PrimeDepthSummabilityWindow
          )
          for module in "${modules[@]}"; do
            safe="${module//./_}"
            lake build "$module" > "diagnostics/${safe}.log" 2>&1
            status=$?
            cat "diagnostics/${safe}.log"
            printf '%s\t%s\n' "$module" "$status" >> diagnostics/summary.tsv
            if [ "$status" -ne 0 ]; then failed=1; fi
          done
          printf '%s\n' "$failed" > diagnostics/failed
          exit 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oactc-next-truth-lean-diagnostics-r2
          path: diagnostics
          if-no-files-found: error
          retention-days: 3
      - name: Enforce successful builds
        run: |
          cat diagnostics/summary.tsv
          test "$(cat diagnostics/failed)" = "0"
