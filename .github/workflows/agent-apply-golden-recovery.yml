name: agent-apply-golden-recovery

on:
  push:
    branches:
      - agent/formalize/golden-prime-circle-tomography-v3

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/formalize/golden-prime-circle-tomography-v3
          fetch-depth: 0
      - name: Apply recovered formalization payload
        run: |
          tar -xzf .agent/recovery.tar.gz -C .
          rm -rf .agent
          rm -f .github/workflows/agent-apply-golden-recovery.yml
          git config user.name 'AlyciaBHZ'
          git config user.email '50111876+AlyciaBHZ@users.noreply.github.com'
          git add -A
          git commit -m 'formalize: recover golden prime circle truth source'
          git push origin HEAD:agent/formalize/golden-prime-circle-tomography-v3
