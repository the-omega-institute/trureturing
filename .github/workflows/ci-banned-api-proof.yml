name: CI banned-api-proof

on:
  pull_request:
    branches: [dev, 'integration-**']
    types: [opened, synchronize, reopened]
  push:
    branches: [dev, 'integration-**']

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-banned-api-proof-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  banned-api-proof:
    uses: ./.github/workflows/ci-unit.yml
    with:
      unit: banned-api-proof
      command: make -C tools compile-proof PROOF=banned-api-proof
