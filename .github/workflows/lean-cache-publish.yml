name: Verify the cache Release runner

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize]

permissions: {}

jobs:
  publish:
    name: Verify the cache Release runner
    runs-on: runner-for-trureturing-cache-release-publish
    timeout-minutes: 5
    steps:
      - name: Read the runner architecture and available resources
        run: |
          uname -m
          nproc
          free -b
          df -B1 / "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
