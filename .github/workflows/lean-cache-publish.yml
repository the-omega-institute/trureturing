            Reg.D5.S3.ConceptDynamics.Coding.DecoderPeak
            Reg.D5.S3.ConceptDynamics.Coding.DecoderReplay
            Reg.D5.S3.ConceptDynamics.Coding.DecoderStartup
            Reg.D5.S3.ConceptDynamics.Coding.IncomingLiftAmbiguityCriterion
            Reg.D5.S3.ConceptDynamics.Coding.ResetNativeIntegerChart
            Reg.D5.S3.ConceptDynamics.ObservationTopology.HarmonicSensors.SixDimensionalSharpGeometry
            Reg.D5.S3.Estimation.SequentialDecisionRisk.FiniteSupportPosteriorMoment
            Reg.D5.S3.Estimation.SequentialDecisionRisk.FiniteWeightedSubsetNegativeAssociation
            Reg.D5.S3.Factorization.GoldenCubicBlockNonFifthPower
            Reg.D5.S3.Observer.LinearMemory.FiniteWordReachability
            Reg.D5.S3.Observer.ProbabilisticClosure.TrajectoryLaws.UnifilarPairSurvival
            Reg.D5.S3.ObserverMemory.Algorithms.TwoBankInstalledWord
            Reg.D5.S3.Quantum.Analysis.PhysicalHeatGenerator
            Reg.D5.S3.Quantum.Dynamics.LaplacianPeakTransferTrees
            Reg.D5.S3.Quantum.Entanglement.ElegantJointMeasurementNoiseBounds
            Reg.D5.S3.Quantum.Entanglement.SteeringEllipsoidCHSH
            Reg.D5.S3.Quantum.Entanglement.SteeringEllipsoidFullyEntangledFraction
            Reg.D5.S3.Quantum.Fibers.FiniteRectangleTransport
            Reg.D5.S3.Quantum.Information.ActualPureQubitCostInfimum
            Reg.D5.S3.Quantum.Information.ActualQubitChordObstruction
            Reg.D5.S3.Quantum.Magic.NonlocalNonstabilizernessHaarMean
            Reg.D5.S3.Quantum.Thermal.DynamicCoolingParallelTieUniqueness
            Reg.D5.S3.QuantumBounds.LocalPerceptionCHSH
            Reg.D5.S3.QuantumBounds.RebitExclusionDistance
            Reg.Support.DecoderPeakCohort
            Reg.Support.DecoderReplayCohort
            Reg.Support.DecoderStartupCohort
          )
          make lean-report-scoped \
            LEAN_REPORT=.lake/build/stratalint/upgrade-compatibility-scoped-report.json \
            LEAN_TARGETS="${compatibility_roots[*]}" \
            2>&1 | tee build/lean-cache/compatibility-probe.log
      - name: Export compatibility diagnostics and scoped report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathlib-upgrade-compatibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .lake/build/stratalint/upgrade-compatibility-scoped-report.json*
            .lake/build/stratalint/upgrade-compatibility-scoped-report.json.logs/
            build/lean-cache/compatibility-probe.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
