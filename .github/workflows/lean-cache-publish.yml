            D5.S3.Factorization.GoldenCubicBlockNonFifthPower
            D5.S3.Observer.LinearMemory.FiniteWordReachability
            D5.S3.Observer.ProbabilisticClosure.TrajectoryLaws.UnifilarPairSurvival
            D5.S3.ObserverMemory.Algorithms.TwoBankInstalledWord
            D5.S3.QuadraticForms.GerzonEqualityParameterIdentity
