# Lean 构建缓存的发布(#2542 步骤 C 的 producer 侧)。
#
# 它**不是** required check：归档是加速器，**不构成独立的 admission 证据**，它的失败
# 也永不该让 dev 的门变红。
#
# 【这里曾写「永不进信任链、永不能让任何判词从红变绿」，那句话是假的】三席独立评审
# （#2729）判定它按字面不成立：归档发布的 .olean 会被 consumer 侧的 Lake 当作构建输入
# 复用，canonical 报告又从那个 olean 环境读声明，故**发布者位于 admission 下方**。
# 详见 tools/scripts/worktree/lean-cache-publish.sh 头部的勘误段。
#
# 为什么是独立文件而不是 ci.yml 里的一个 job：
# project build 层只走 Releases：本 workflow 先取同 config 的上一份 Release 作增量种子，
# 再用 `lake build` 校准到本次 schedule 对应的 dev commit，最后发布新的内容地址。
# Release 不存在或不可用时，`lake exe cache get` 加冷构建仍能建立第一份归档。
# 它不读写 Actions project-build cache，避免每个 sources 地址占一份约 1.8 GB 的仓库缓存。
#
#   1. `lean-report-input.sh:135-140` 把 ci.yml 中 `lean-inspect:` 到 `baseline-admission:`
#      的**切片文本**折进 Lean 报告的输入闭包，并解析其中的脚本引用。发布脚本若出现在那段里，
#      改它一行就会让每一份 canonical Lean 报告作废、本地与 CI 全量重算。
#   2. `Cf10WorkflowSeparatesLeanInspectionFromDotnetAdmission` 禁止 `baseline-admission:`
#      到文件末尾的切片出现 `.lake` / `elan` / `lake build`。
#   两段切片首尾相接，覆盖了 ci.yml 中 lean-inspect 之后的全部文本。
#   3. 加进 ci.yml 会把它推到 922 行，越过 SL-003 的 800 行硬线；第 8 条要的是裂桶，不是抬阈值。
# 三条一致指向同一个结论：发布是独立关注点，就该住在自己的文件里。
name: Lean build cache publication

# 【触发形态：2026-08-21 owner 定「做成定时的就行」】
#   理由（owner 原话）：「反正缓存没那么热，人家本地也更新」——
#   消费侧本就会用 `lake build` 补差量，故发布不必跟住每一次 dev 推进。
#   这同时解掉两个此前无解的读数：
#     ① 触发间隔 5–11 分钟（dev 约 16 提交/小时）< 单次 run 60 分钟 ⇒ 追不平，且会
#        持续堆积 6–12 个并发 run 挤占 runner 额度；定时后二者都不复存在。
#     ② project build 层不再随每次 dev push 写入 Actions cache；schedule 是 Release
#        build 层的唯一 writer，消费者也只从该层读取。
#   `0 */6 * * *` 曾是 policy-override（非派生值），案号 #2634，退出条件为
#   「命中率实测数据齐备后重定」。**该条件已于 2026-08-23 履行，#2634 已 CLOSED。**
#   重定的依据不再是「本次裁决」，而是这组实测：在一棵 `.lake` 完全不存在的冷 lane 上
#   绕开 donor 直取 release，exact 未命中、`prefix` 回落取到约 6 小时前那份
#   （归档 producer 与当时 dev 相距 108 提交、22 个 `.lean` 变更）：
#     fetch 5m08s（其中绝大部分是 1.47 GiB 下载与该 lane 首次的 lake 依赖包克隆）；
#     随后 `make lean` **1m18s**，重编 **19 / 1513** 个模块，`EXIT=0`。
#   即 6 小时陈旧只值 78 秒补编，而每收紧一档周期就多一份 1.456 GiB 归档。故周期
#   维持 `0 */6 * * *`。相邻成功运行的实测间隔为 5h08m–7h05m（触发延迟 35–100 分钟），
#   最长约 7 小时，仍在同一量级。
#   单样本；按 owner 明示的「较为新、较为热即可，不追求绝对」采一条，未重复采样。
#
# 【只许 schedule：手动触发曾在这里，是被拿掉的，不是忘了加】
#
#   这个归档发布的 .olean 会被 consumer 侧的 Lake 当作构建输入复用，canonical Lean
#   报告又从那个 olean 环境读声明 —— 即发布者位于 admission 下方。三席独立评审
#   （#2729）判定：原先文件头那句「永远不进 admission 信任链」按字面不成立。
#
#   `workflow_dispatch` 是该信任面上唯一一条**未过 dev push 门**的 writer 路径：
#   `gh workflow run --ref` 选择的是**那个分支上的 workflow 版本**，所以在 job 内
#   检查 `github.ref` 不构成机器边界 —— 非 base 版本可以删掉自己的检查。有写权者
#   因此可在未合并分支改 workflow / publisher / 打包内容后 dispatch，并把结果持久化
#   到全仓 release namespace。manifest digest 由同一 writer 自报，摘要校验挡不住它。
#
#   边界只能是触发集合本身，故这里只留 `schedule`。代价是验证要等下一个 6 小时窗口；
#   那是这条边界的价钱，不是疏漏。
#
#   〔2026-08-29：`ContentsWriteWorkflowClosureTests` 曾钉住此形状（加回任何手动/推送触发，
#   或出现第二个 `contents: write` 的 workflow 即判红），已随 workflow 测试禁令（CLAUDE.md
#   器律⑦′）整体删除。**此形状此后没有机器钉子。** 理由是那族测试只能校验 workflow
#   长什么样、校验不了它会不会执行（`if: false` 判例：16 个测试全过）。改这里请自行评审。〕
on:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

# 【并发形态：定时之后不需要 concurrency 组】
#
# 此前这里有一段基于误诊的历史：两个 run 的 `conclusion: cancelled` 被当成并发组取消，
# 据此连改三轮（`cancel-in-progress: false` → 整体移除 concurrency），取消照旧。
# 真因是 `timeout-minutes: 45`（GitHub 对超时的 conclusion 也是 `cancelled`，
# 该字段不区分两者）：32479993734 跑 45m19s、32480023451 跑 45m17s，
# 都被杀在 `Build when no cache layer was available`。
#
# 改定时之后，堆积的前提本身消失了：每 6 小时一次，单次 run 远短于该间隔，
# 不会出现此前「触发 5–11 分钟 / run 60 分钟 ⇒ 常驻 6–12 个并发」的局面。
# 故此处**不设** concurrency 组；万一手动触发撞车，由 `publish` 动词的幂等性吸收
# —— 同一内容地址已发布时它 no-op 退出。

jobs:
  # 认证配额探测(#2814 PR-Q)。**advisory:不改任何 required check,不被任何 job 依赖。**
  #
  #   立 CI 侧冷编译门的前置,是知道 base-owned token 做那三次产地核验够不够配额。
  #   两席都禁止用「5000/hour」这类文档常数代替实测 header —— 故这里只做三次真调用,
  #   把 `X-RateLimit-*` 原样打进日志,不判任何东西。
  #
  #   为什么放在这个 workflow 而不是新建文件:`.github` 在 RepositoryPathPolicy 里是
  #   **白名单**,新增控制工件要在 `tools/` 下具名登记,而 `tools/` 在 Lean 报告输入闭包
  #   里 —— 两行常量换一次全量报告重算(2026-08-21 实测 84 分钟)。本 workflow 已登记,
  #   且**不在**该闭包内(闭包只含 `ci.yml`,见 `lean-report-input.sh:108`),故零连带成本。
  #
  #   **已知的作用域限制**:本 job 跑在 `schedule` 事件下,而 C 门要用的核验发生在
  #   `pull_request_target` 下。两者的配额桶是否同一个,正是本探测要回答的问题之一 ——
  #   读数里的 `X-RateLimit-Resource` 会说明它是按什么维度计的。**在读到之前不得假定相同。**
  publish:
    name: Publish the Lean build cache
    # 这一条防的是**仓库配置漂移**，不是分支选择的 workflow 代码。
    #
    #   schedule 跑在「当时的默认分支」上，而默认分支是仓库设置，可以被改。改掉之后
    #   这个 job 会在一棵不是 dev 的树上发布缓存，而 tag 与 manifest 会把那次产出写成
    #   正常产物。此条件在那一刻取到 false，job 不执行。
    #
    #   **它不是边界。** 边界是触发集合本身（只有 schedule）—— 一个由分支选出的 workflow
    #   版本可以删掉自己的这行条件，故它挡不住那类改动，别把它当防线读。
    #   〔2026-08-29：曾由 ContentsWriteWorkflowClosureTests 钉住触发集合，该测试已随
    #   workflow 测试禁令删除；此后无机器钉子。〕
    #
    #   〔本条曾被删过一次：我判「schedule-only ⟹ github.ref 恒为 refs/heads/dev，
    #     恒真的量不构成判据」。那个「恒」是错的 —— 我把仓库配置排除在状态空间之外了。
    #     评审席指出后恢复。〕
    if: github.ref == 'refs/heads/dev'
    # 定时触发下没有 `github.event.workflow_run` 上下文；留着该条件会让 job 永远被跳过。
    # 「不给失败的推送留缓存」由内容地址本身保证：地址取自这一刻 dev 的实际输入；
    # 消费侧只取同 config 的 exact/prefix Release，再由 Lake 按 trace 补齐差量。
    runs-on: ubuntu-24.04-arm
    # 【超时形态：2026-08-21 读实际日志后勘正】
    #   此前两个 run 的 `conclusion: cancelled` 被我误读为「并发组取消」，据此连打三四个
    #   补丁改 `concurrency`，取消照旧。真因是**这个数字**：GitHub 对 `timeout-minutes`
    #   到点的 conclusion 就是 `cancelled`，与并发取消在该字段上无法区分。
    #   读数：32479993734 跑 45分19秒、32480023451 跑 45分17秒，两者都被杀在构建步骤；
    #   从零 `lake build` 实测 40 分钟以上，加 checkout/toolchain/address/cache-restore
    #   的前置开销即越过 45 分。
    #   取 120：为上述自建实测留约 3 倍余量（GitHub 该字段上限 360）。
    #   Release miss 时仍需容纳冷构建，故保留该余量。
    timeout-minutes: 120
    # 检出到 `candidate/`，与消费侧传给发布脚本的 repository 根及归档内部布局一致。
    steps:
      - name: Check out the commit that was published
        id: checkout-publish
        uses: actions/checkout@v4
        with:
          path: candidate
          # 显式写出本次运行的事件 SHA。**这不是修复，是把已有行为写明**：
          # actions/checkout 在缺省下取的就是触发事件的 ref/SHA，schedule 事件下即
          # github.sha，所以不写 `ref` 也不会检出「更晚的分支 tip」。写出来的理由是
          # 下游的 producer_commit_sha 直接取自 GITHUB_SHA，让这条绑定在文件里可读、
          # 可审计，而不必靠读者知道 checkout 的缺省语义（#2729 判决第 2 条）。
          ref: ${{ github.sha }}
          # 定时触发下 github.sha 即默认分支 HEAD（dev 当前 tip）；
          # `github.event.workflow_run.head_sha` 在此事件下为空，留着会检出错误的树。
          # 剥夺步骤要对 HEAD^1 做烟测，而这里检出的是一个已合入的普通提交，
          # 不是 merge ref；默认的 fetch-depth: 1 只取一个提交，父提交不可达。
          fetch-depth: 2

      - name: Strip checkout remote state
        if: steps.checkout-publish.outcome == 'success'
        shell: bash
        env:
          CHECKOUT_PATH: candidate
        run: |
          set -euo pipefail
          git -C "$CHECKOUT_PATH" remote remove origin
          git -C "$CHECKOUT_PATH" for-each-ref --format='delete %(refname)' refs/remotes/ |
            git -C "$CHECKOUT_PATH" update-ref --stdin
          remote_count="$(git -C "$CHECKOUT_PATH" remote | wc -l)"
          remote_ref_count="$(git -C "$CHECKOUT_PATH" for-each-ref --format='%(refname)' refs/remotes/ | wc -l)"
          if [[ "$remote_count" -ne 0 || "$remote_ref_count" -ne 0 ]]; then
            printf '%s\n' "checkout still exposes remotes or remote-tracking refs" >&2
            exit 1
          fi
          head_sha="$(git -C "$CHECKOUT_PATH" rev-parse HEAD)"
          base_sha="$(git -C "$CHECKOUT_PATH" rev-parse HEAD^1)"
          test -n "$head_sha"
          test -n "$base_sha"

      - name: Install the pinned Lean toolchain
        shell: bash
        env:
          TOOLCHAIN_FILE: ${{ github.workspace }}/candidate/lean-toolchain
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/candidate/tools/scripts/workflow/install-lean-toolchain.sh" \
            "${TOOLCHAIN_FILE}" --github-path "$GITHUB_PATH"

      - name: Resolve this commit's Lean input addresses
        id: addr
        shell: bash
        run: |
          set -euo pipefail
          helper="$GITHUB_WORKSPACE/candidate/tools/scripts/worktree/lean-cache-input.sh"
          test -x "${helper}"
          input_address="$("${helper}" address --repository "$GITHUB_WORKSPACE/candidate")"
          [[ "$input_address" =~ ^[0-9a-f]{64}\ [0-9a-f]{64}$ ]]
          read -r sources_sha256 config_sha256 <<< "$input_address"
          echo "config_sha256=${config_sha256}" >> "$GITHUB_OUTPUT"
          echo "sources_sha256=${sources_sha256}" >> "$GITHUB_OUTPUT"

      # 依赖层只按 config 寻址，跨 sources 稳定复用；project build 层不再进入 Actions cache。
      - name: Restore the Lean dependency layer
        uses: actions/cache/restore@v4
        with:
          path: |
            candidate/.lake/packages
            candidate/.lake/config
            candidate/.lake/.stratalint-lean-cache-stamp.json
            ~/.cache/mathlib
          key: ${{ runner.os }}-${{ runner.arch }}-lake-deps-v1-${{ steps.addr.outputs.config_sha256 }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-lake-deps-v1-${{ steps.addr.outputs.config_sha256 }}

      # Release 是 project build 层唯一的远端来源。取不到时记为 cold；下一步仍会从
      # mathlib cache / 源码构建，因而首份 Release 不依赖预先存在的 Release。
      - name: Seed from the prior Lean release build layer
        id: release-seed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          publisher="$GITHUB_WORKSPACE/candidate/tools/scripts/worktree/lean-cache-publish.sh"
          test -x "${publisher}"
          if PATH="$HOME/.elan/bin:$PATH" "${publisher}" fetch --repository "$GITHUB_WORKSPACE/candidate"; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "no usable prior Release; build will start from the dependency layer"
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      # 即使 Release 精确命中也运行 Lake 自己的有效性检查；前缀命中时它补齐差量。
      # `compiled_targets` 是新鲜度读数，不是门槛。`lake build` 成功后才允许发布。
      - name: Build and verify the current Lean project layer
        id: build
        shell: bash
        working-directory: candidate
        env:
          BUILD_LOG: ${{ runner.temp }}/verify-build.txt
        run: |
          set -euo pipefail
          if [[ "${{ steps.release-seed.outputs.hit }}" != "true" ]]; then
            lake exe cache get || printf '%s\n' "mathlib cache get returned nonzero; lake build will fill the gaps"
          fi
          lake build 2>&1 | tee "${BUILD_LOG}"
          compiled="$(grep -cE '(Built|Building|Compiling) ' "${BUILD_LOG}" || true)"
          printf 'compiled_targets=%s\n' "${compiled}"
          printf 'olean=%s\n' "$(find .lake/build -name '*.olean' | wc -l | tr -d ' ')"

      - name: Publish the build cache under its content address
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_LOG: ${{ runner.temp }}/publish.txt
        run: |
          set -euo pipefail
          publisher="$GITHUB_WORKSPACE/candidate/tools/scripts/worktree/lean-cache-publish.sh"
          test -x "${publisher}"
          date -u '+publish_started_at=%Y-%m-%dT%H:%M:%SZ' | tee "${PUBLISH_LOG}"
          "${publisher}" publish --repository "$GITHUB_WORKSPACE/candidate" | tee -a "${PUBLISH_LOG}"
          date -u '+publish_finished_at=%Y-%m-%dT%H:%M:%SZ' | tee -a "${PUBLISH_LOG}"
          {
            echo '## Lean build cache'
            echo
            echo '```'
            cat "${PUBLISH_LOG}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
