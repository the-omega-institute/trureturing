name: Lean build cache publication

# Scheduled runs keep the protected-dev Release publication contract.  Manual
# runs are the independent Actions-cache producer: dispatch on the exact
# protected branch ref, provide a 40-hex commit reachable from that branch, and
# allow up to the GitHub-hosted 360-minute job limit.  Example:
# gh workflow run lean-cache-publish.yml --ref dev \
#   -f source_ref=refs/heads/dev -f source_sha="$(git rev-parse dev)"
on:
  pull_request:
    branches: [dev, 'integration-**']
    types: [labeled]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Exact protected source ref (refs/heads/dev or refs/heads/integration-...)'
        required: true
        type: string
        default: refs/heads/dev
      source_sha:
        description: '40-hex commit reachable from source_ref; the producer checks this pin'
        required: true
        type: string
      prewarm_targets:
        description: 'Optional ordered, space-separated registered Lean module roots to prewarm'
        required: false
        type: string
        default: ''

permissions: {}

jobs:
  publish:
    name: Publish the Lean build cache
    permissions:
      contents: write
      actions: write
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 360 || 120 }}
    env:
      STRATALINT_CACHE_WRITES: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Validate the manual source ref and immutable pin
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          WORKFLOW_REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" == "$WORKFLOW_REF" ]] || {
            echo "CACHE_SOURCE_ERROR source_ref must equal the workflow dispatch ref" >&2
            exit 2
          }
          [[ "$SOURCE_REF" =~ ^refs/heads/(dev|integration-[A-Za-z0-9._/-]+)$ ]] || {
            echo "CACHE_SOURCE_ERROR source ref is outside dev/integration protected scope" >&2
            exit 2
          }
          git check-ref-format "$SOURCE_REF" >/dev/null || {
            echo "CACHE_SOURCE_ERROR source ref is not a valid Git ref" >&2
            exit 2
          }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$SOURCE_SHA" != "$(printf '%040d' 0)" ]] || {
            echo "CACHE_SOURCE_ERROR source_sha must be a nonzero 40-hex SHA" >&2
            exit 2
          }
          branch="${SOURCE_REF#refs/heads/}"
          protected="$(gh api "repos/$REPOSITORY/branches/$branch" --jq '.protected')"
          [[ "$protected" == true ]] || {
            echo "CACHE_SOURCE_ERROR source branch is not protected" >&2
            exit 2
          }
          merge_base="$(gh api "repos/$REPOSITORY/compare/$SOURCE_SHA...$branch" --jq '.merge_base_commit.sha')"
          [[ "$merge_base" == "$SOURCE_SHA" ]] || {
            echo "CACHE_SOURCE_ERROR source_sha is not an ancestor of the protected branch" >&2
            exit 2
          }
          {
            echo "STRATALINT_CACHE_SOURCE_REF=$SOURCE_REF"
            echo "STRATALINT_CACHE_SOURCE_COMMIT=$SOURCE_SHA"
            echo "STRATALINT_CACHE_CHECKED_OUT_SHA=$SOURCE_SHA"
            echo "STRATALINT_CACHE_SOURCE_VALIDATED=true"
          } >> "$GITHUB_ENV"
      - name: Validate candidate and strip checkout remote
        env:
          CI_HIT_PATHS: '*'
          CI_PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            export GITHUB_SHA="$STRATALINT_CACHE_CHECKED_OUT_SHA"
          fi
          bash tools/scripts/workflow/ci-entry.sh
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build the Lean producer for the manual seed
        if: github.event_name == 'workflow_dispatch'
        run: make -C tools dotnet DOTNET_PROJECT=tools/StrataLint.Cli/StrataLint.Cli.csproj
      - name: Build the scheduled Release producer
        if: github.event_name == 'schedule'
        run: make -C tools dotnet DOTNET_PROJECT=tools/StrataLint.Lean/StrataLint.Lean.csproj
      - id: keys
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/scripts/worktree/lean_actions.py keys --repository "$GITHUB_WORKSPACE"
      - id: elan
        if: steps.keys.outputs.elan_key != ''
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ~/.elan
          key: ${{ steps.keys.outputs.elan_key }}
      - run: tools/scripts/workflow/install-lean-toolchain.sh lean-toolchain --github-path "$GITHUB_PATH"
      - id: dependency
        if: steps.keys.outputs.dependency_key != ''
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.keys.outputs.dependency_archive_path }}
          key: ${{ steps.keys.outputs.dependency_key }}
          restore-keys: ${{ steps.keys.outputs.dependency_restore_prefix }}
      - id: project
        if: steps.keys.outputs.project_key != ''
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.keys.outputs.project_archive_path }}
          key: ${{ steps.keys.outputs.project_key }}
          restore-keys: ${{ steps.keys.outputs.project_restore_prefix }}
      - name: Restore optional validated seeds
        env:
          DEPENDENCY_KEY: ${{ steps.dependency.outputs.cache-matched-key }}
          PROJECT_KEY: ${{ steps.project.outputs.cache-matched-key }}
          DEPENDENCY_OUTCOME: ${{ steps.dependency.outcome }}
          PROJECT_OUTCOME: ${{ steps.project.outcome }}
        run: python3 tools/scripts/worktree/lean_actions.py restore --repository "$GITHUB_WORKSPACE" --dependency-key "$DEPENDENCY_KEY" --project-key "$PROJECT_KEY" --dependency-outcome "$DEPENDENCY_OUTCOME" --project-outcome "$PROJECT_OUTCOME"
      - name: Prewarm explicitly selected modules for the manual cache
        if: github.event_name == 'workflow_dispatch' && inputs.prewarm_targets != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREWARM_TARGETS: ${{ inputs.prewarm_targets }}
          STRATALINT_ACCEPT_COLD_BUILD: '1'
          STRATALINT_CACHE_WRITES: 'false'
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys

          root = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          sys.path.insert(0, str(root / 'tools/lean-inspector'))
          import scoped

          value = os.environ['PREWARM_TARGETS']
          validated = scoped.parse_targets(value)
          selection = scoped.public.selection.Selection(root)
          selection.validate('lean-report')
          if not set(validated) <= selection.modules().keys():
              raise ValueError('prewarm targets must be registered report modules')
          targets = list(dict.fromkeys(value.split()))
          environment = dict(os.environ)
          producer = subprocess.check_output([
              'bash', str(root / 'tools/scripts/workflow/judge-lean-producer.sh'),
              str(root / 'tools/StrataLint.Cli/bin/Release/net10.0')],
              cwd=root, text=True).strip()
          if producer:
              environment['STRATALINT_LEAN_PRODUCER_DLL'] = producer
          else:
              environment.pop('STRATALINT_LEAN_PRODUCER_DLL', None)
          for module in targets:
              print('CACHE_PREWARM_ROOT module=' + module, flush=True)
              subprocess.run([
                  'make', 'lean-report-scoped', 'LEAN_TARGETS=' + module,
                  'LEAN_REPORT=.lake/build/stratalint/manual-prewarm-' + module + '.json'],
                  cwd=root, env=environment, check=True)
          PY
      - name: Export manual prewarming reports and diagnostics
        if: always() && github.event_name == 'workflow_dispatch' && inputs.prewarm_targets != ''
        uses: actions/upload-artifact@v4
        with:
          name: manual-prewarm-${{ github.run_id }}-${{ github.run_attempt }}
          path: .lake/build/stratalint/manual-prewarm-*.json*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
      - name: Build the report and run the compiled judge
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          STRATALINT_ACCEPT_COLD_BUILD: '1'
        run: |
          producer="$(bash tools/scripts/workflow/judge-lean-producer.sh "$GITHUB_WORKSPACE/tools/StrataLint.Cli/bin/Release/net10.0")"
          if [[ -n "$producer" ]]; then
            export STRATALINT_LEAN_PRODUCER_DLL="$producer"
          else
            unset STRATALINT_LEAN_PRODUCER_DLL
          fi
          make lean-report LEAN_REPORT_CACHE_MISS_POLICY=reuse-or-build
          make compiled-judge-test
      - id: project_snapshot
        name: Prepare the manual project seed
        if: github.event_name == 'workflow_dispatch'
        env:
          STRATALINT_CACHE_WRITES: 'true'
          STRATALINT_REPORT_SUCCEEDED: 'true'
        run: python3 tools/scripts/worktree/lean_actions.py snapshot --repository "$GITHUB_WORKSPACE" --layers project
      - name: Require a usable manual project seed
        if: github.event_name == 'workflow_dispatch'
        env:
          READY: ${{ steps.project_snapshot.outputs.project_ready }}
          SKIP_REASON: ${{ steps.project_snapshot.outputs.project_skip_reason }}
        run: |
          if [[ "$READY" != true ]] && [[ "${STRATALINT_ACTIONS_CACHE_SEEDED:-0}" != 1 || "$SKIP_REASON" != no-build-work ]]; then
            echo "CACHE_SEED_ERROR manual build produced no accepted project seed" >&2
            exit 1
          fi
      - name: Publish the manual project seed
        if: github.event_name == 'workflow_dispatch' && steps.project_snapshot.outputs.project_ready == 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.keys.outputs.project_archive_path }}
          key: ${{ steps.keys.outputs.project_key }}
      - id: dependency_snapshot
        name: Prepare the manual dependency seed
        if: github.event_name == 'workflow_dispatch'
        env:
          STRATALINT_CACHE_WRITES: 'true'
          STRATALINT_CHECK_SUCCEEDED: 'true'
        run: python3 tools/scripts/worktree/lean_actions.py snapshot --repository "$GITHUB_WORKSPACE" --layers dependency
      - name: Verify the manual project cache was published
        if: github.event_name == 'workflow_dispatch' && steps.project_snapshot.outputs.project_ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: ${{ steps.keys.outputs.project_key }}
        run: |
          set -euo pipefail
          saved="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/caches" -f key="$CACHE_KEY" -f ref="$GITHUB_REF")"
          jq -e --arg key "$CACHE_KEY" --arg ref "$GITHUB_REF" \
            'any(.actions_caches[]; .key == $key and .ref == $ref)' <<< "$saved" >/dev/null || {
              echo "CACHE_SEED_ERROR project cache was not published to the producer ref" >&2
              exit 1
            }
      - name: Publish the manual dependency seed
        if: github.event_name == 'workflow_dispatch' && steps.dependency_snapshot.outputs.dependency_ready == 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.keys.outputs.dependency_archive_path }}
          key: ${{ steps.keys.outputs.dependency_key }}
      - name: Publish the manual toolchain seed
        if: github.event_name == 'workflow_dispatch' && steps.elan.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.elan
          key: ${{ steps.keys.outputs.elan_key }}
      - name: Publish the protected-dev Release snapshot
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: make lean-cache-to-github-without-mathlib

  pr-producer:
    name: Produce the pull request Lean cache
    if: github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'lean-cache-produce'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    concurrency:
      group: lean-cache-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      STRATALINT_CACHE_WRITES: 'true'
      STRATALINT_CACHE_PR_PRODUCER: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Validate the pull request merge candidate and strip checkout remote
        env:
          CI_HIT_PATHS: '*'
          CI_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash tools/scripts/workflow/ci-entry.sh
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build the Lean producer for the PR seed
        run: make -C tools dotnet DOTNET_PROJECT=tools/StrataLint.Cli/StrataLint.Cli.csproj
      - id: keys
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/scripts/worktree/lean_actions.py keys --repository "$GITHUB_WORKSPACE"
      - id: elan
        if: steps.keys.outputs.elan_key != ''
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ~/.elan
          key: ${{ steps.keys.outputs.elan_key }}
      - run: tools/scripts/workflow/install-lean-toolchain.sh lean-toolchain --github-path "$GITHUB_PATH"
      - id: dependency
        if: steps.keys.outputs.dependency_key != ''
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.keys.outputs.dependency_archive_path }}
          key: ${{ steps.keys.outputs.dependency_key }}
          restore-keys: ${{ steps.keys.outputs.dependency_restore_prefix }}
      - id: project
        if: steps.keys.outputs.project_key != ''
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.keys.outputs.project_archive_path }}
          key: ${{ steps.keys.outputs.project_restore_key }}
          restore-keys: ${{ steps.keys.outputs.project_restore_prefix }}
      - name: Restore optional validated seeds
        env:
          DEPENDENCY_KEY: ${{ steps.dependency.outputs.cache-matched-key }}
          PROJECT_KEY: ${{ steps.project.outputs.cache-matched-key }}
          PROJECT_RESTORE_KEY: ${{ steps.keys.outputs.project_restore_key }}
          DEPENDENCY_OUTCOME: ${{ steps.dependency.outcome }}
          PROJECT_OUTCOME: ${{ steps.project.outcome }}
        run: python3 tools/scripts/worktree/lean_actions.py restore --repository "$GITHUB_WORKSPACE" --dependency-key "$DEPENDENCY_KEY" --project-key "$PROJECT_KEY" --project-restore-key "$PROJECT_RESTORE_KEY" --dependency-outcome "$DEPENDENCY_OUTCOME" --project-outcome "$PROJECT_OUTCOME"
      - name: Prewarm and inspect the mathlib upgrade resource roots
        env:
          GH_TOKEN: ${{ github.token }}
          STRATALINT_ACCEPT_COLD_BUILD: '1'
          STRATALINT_CACHE_WRITES: 'false'
        run: |
          set -euo pipefail
          unset LEAN_NUM_THREADS
          mkdir -p build/lean-cache
          observe_resources() {
            local delay_pid=''
            trap 'if [[ -n "$delay_pid" ]]; then kill "$delay_pid" 2>/dev/null || true; wait "$delay_pid" 2>/dev/null || true; fi' EXIT
            trap 'exit 0' TERM INT
            while :; do
              printf 'RESOURCE_PROBE_OBSERVATION %s LEAN_NUM_THREADS=%s\n' "$(date -u +%FT%TZ)" "${LEAN_NUM_THREADS:-runtime-default}"
              awk '$1 ~ /^(MemTotal:|MemAvailable:|SwapTotal:|SwapFree:)/' /proc/meminfo || true
              awk '$1 ~ /^(oom_kill|pswpin|pswpout)$/' /proc/vmstat || true
              ps -C lean,lake,inputDiscovery,reportInspector \
                -o pid,ppid,etime,time,pcpu,rss,stat,args --sort=-rss || true
              while read -r lean_pid; do
                [[ "$lean_pid" =~ ^[0-9]+$ ]] || continue
                printf 'LEAN_PROCESS_MEMORY pid=%s\n' "$lean_pid"
                awk '$1 ~ /^(VmHWM:|VmRSS:|RssAnon:|RssFile:|RssShmem:)/' "/proc/$lean_pid/status" 2>/dev/null || true
                lean_cgroup="$(awk -F: '$1 == "0" && $2 == "" {print $3; exit}' "/proc/$lean_pid/cgroup" 2>/dev/null || true)"
                if [[ "$lean_cgroup" == /* ]]; then
                  for memory_file in memory.current memory.peak memory.max memory.events; do
                    memory_path="/sys/fs/cgroup${lean_cgroup%/}/$memory_file"
                    if [[ -r "$memory_path" ]]; then
                      printf 'RESOURCE_SOURCE pid=%s path=%s\n' "$lean_pid" "$memory_path"
                      cat "$memory_path" || true
                    fi
                  done
                fi
              done < <(ps -C lean -o pid= || true)
              for pressure in /proc/pressure/cpu /proc/pressure/memory; do
                if [[ -r "$pressure" ]]; then printf 'RESOURCE_SOURCE %s\n' "$pressure"; cat "$pressure"; fi
              done
              sleep 30 &
              delay_pid=$!
              wait "$delay_pid"
              delay_pid=''
            done
          }
          observe_resources > build/lean-cache/resource-probe.log 2>&1 &
          observer_pid=$!
          trap 'kill "$observer_pid" 2>/dev/null || true; wait "$observer_pid" 2>/dev/null || true' EXIT
          producer="$(bash tools/scripts/workflow/judge-lean-producer.sh "$GITHUB_WORKSPACE/tools/StrataLint.Cli/bin/Release/net10.0")"
          if [[ -n "$producer" ]]; then
            export STRATALINT_LEAN_PRODUCER_DLL="$producer"
          else
            unset STRATALINT_LEAN_PRODUCER_DLL
          fi
          resource_roots=(
            D5.S1.Digit.GoldenBase4TwentyStatePrefixBarrier
            D5.S1.Recurrence.Invariants.CloitreActualExteriorEntrance
            D5.S1.Recurrence.Invariants.CloitreActualDeficitFourBand
            D5.S0.Tower.TribonacciPeriodicNine.EnumerationNineDistinct
          )
          for module in "${resource_roots[@]}"; do
            printf 'RESOURCE_PROBE_ROOT module=%s boundary=start time=%s\n' "$module" "$(date -u +%FT%TZ)"
            make lean-report-scoped \
              LEAN_REPORT=".lake/build/stratalint/upgrade-resource-${module}.json" \
              LEAN_TARGETS="$module"
            printf 'RESOURCE_PROBE_ROOT module=%s boundary=finish time=%s\n' "$module" "$(date -u +%FT%TZ)"
          done
          make lean-report-scoped \
            LEAN_REPORT=.lake/build/stratalint/upgrade-resource-scoped-report.json \
            LEAN_TARGETS="${resource_roots[*]}"
      - name: Export prewarming reports and resource diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathlib-prewarm-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .lake/build/stratalint/upgrade-resource-*.json*
            build/lean-cache/resource-probe.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
      - name: Build the report and run the compiled judge
        env:
          GH_TOKEN: ${{ github.token }}
          STRATALINT_ACCEPT_COLD_BUILD: '1'
        run: |
          set -euo pipefail
          observe_producer() {
            local delay_pid='' cgroup_memory_events=''
            trap 'if [[ -n "$delay_pid" ]]; then kill "$delay_pid" 2>/dev/null || true; wait "$delay_pid" 2>/dev/null || true; fi' EXIT
            trap 'exit 0' TERM INT
            while IFS=: read -r hierarchy controllers cgroup_path; do
              if [[ "$hierarchy" == 0 && -z "$controllers" && "$cgroup_path" == /* ]]; then
                cgroup_memory_events="/sys/fs/cgroup${cgroup_path%/}/memory.events"
                break
              fi
            done < /proc/self/cgroup
            while :; do
              printf 'CACHE_PRODUCER_OBSERVATION %s\n' "$(date -u +%FT%TZ)"
              printf 'RESOURCE_SOURCE /proc/meminfo\n'
              awk '$1 ~ /^(MemTotal:|MemAvailable:|SwapTotal:|SwapFree:)/' /proc/meminfo || true
              printf 'RESOURCE_SOURCE /proc/vmstat\n'
              awk '$1 ~ /^(oom_kill|pswpin|pswpout)$/' /proc/vmstat || true
              printf 'RESOURCE_SOURCE kernel-oom\n'
              if kernel_log="$(sudo -n dmesg --time-format iso 2>/dev/null)"; then
                printf '%s\n' "$kernel_log" | awk '/oom-kill|Out of memory|Killed process|invoked oom-killer|Memory cgroup out of memory/' | tail -n 20 || true
              else
                printf 'RESOURCE_UNAVAILABLE kernel-oom\n'
              fi
              ps -C lean,lake,inputDiscovery,reportInspector \
                -o pid,ppid,etime,time,pcpu,rss,stat,args --sort=-pcpu | head -n 13 || true
              while read -r lean_pid; do
                [[ "$lean_pid" =~ ^[0-9]+$ ]] || continue
                printf 'LEAN_PROCESS_MEMORY pid=%s\n' "$lean_pid"
                awk '$1 ~ /^(VmHWM:|VmRSS:|RssAnon:|RssFile:|RssShmem:)/' "/proc/$lean_pid/status" 2>/dev/null || true
                if [[ -r "/proc/$lean_pid/smaps_rollup" ]]; then
                  awk '$1 ~ /^(Pss:|Private_Clean:|Private_Dirty:|Swap:)/' "/proc/$lean_pid/smaps_rollup" 2>/dev/null || true
                fi
                lean_cgroup="$(awk -F: '$1 == "0" && $2 == "" {print $3; exit}' "/proc/$lean_pid/cgroup" 2>/dev/null || true)"
                printf 'LEAN_PROCESS_CGROUP pid=%s path=%s\n' "$lean_pid" "${lean_cgroup:-UNAVAILABLE}"
                if [[ "$lean_cgroup" == /* ]]; then
                  for memory_file in memory.current memory.peak memory.max memory.events; do
                    memory_path="/sys/fs/cgroup${lean_cgroup%/}/$memory_file"
                    if [[ -r "$memory_path" ]]; then
                      printf 'RESOURCE_SOURCE pid=%s path=%s\n' "$lean_pid" "$memory_path"
                      cat "$memory_path" || true
                    else
                      printf 'RESOURCE_UNAVAILABLE pid=%s path=%s\n' "$lean_pid" "$memory_path"
                    fi
                  done
                fi
              done < <(ps -C lean -o pid= --sort=-pcpu | head -n 12 || true)
              for observation in /proc/pressure/cpu /proc/pressure/memory "$cgroup_memory_events"; do
                if [[ -r "$observation" ]]; then
                  printf 'RESOURCE_SOURCE %s\n' "$observation"
                  cat "$observation"
                else
                  printf 'RESOURCE_UNAVAILABLE %s\n' "${observation:-current-cgroup-memory.events}"
                fi
              done
              phase_file=.lake/build/stratalint/raw-lean-report.json.logs/native-phases.jsonl
              if [[ -f "$phase_file" ]]; then tail -n 1 "$phase_file"; fi
              for lake_log in .lake/build/stratalint/raw-lean-report.json.logs/report.{stdout,stderr}.log; do
                if [[ -f "$lake_log" ]]; then
                  printf 'LAKE_OUTPUT_SOURCE %s\n' "$lake_log"
                  tail -n 3 "$lake_log"
                  printf 'LAKE_ERROR_OUTPUT_SOURCE %s\n' "$lake_log"
                  awk '/error:|✖|"severity"[[:space:]]*:[[:space:]]*"error"/' "$lake_log" | tail -n 20 || true
                fi
              done
              sleep 60 &
              delay_pid=$!
              wait "$delay_pid"
              delay_pid=''
            done
          }
          observe_producer &
          observer_pid=$!
          trap 'kill "$observer_pid" 2>/dev/null || true; wait "$observer_pid" 2>/dev/null || true' EXIT
          producer="$(bash tools/scripts/workflow/judge-lean-producer.sh "$GITHUB_WORKSPACE/tools/StrataLint.Cli/bin/Release/net10.0")"
          if [[ -n "$producer" ]]; then
            export STRATALINT_LEAN_PRODUCER_DLL="$producer"
          else
            unset STRATALINT_LEAN_PRODUCER_DLL
          fi
          make lean-report LEAN_REPORT_CACHE_MISS_POLICY=reuse-or-build
          make compiled-judge-test
      - name: Export producer diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lean-producer-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .lake/build/stratalint/raw-lean-report.json.logs/
            .lake/build/lean-inspector/inputs.json
            .lake/build/lean-inspector/module-inputs.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3
      - name: Export the Lean report bundle
        if: ${{ always() && hashFiles('.lake/build/stratalint/raw-lean-report.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: lean-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: .lake/build/stratalint/raw-lean-report.json*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
      - id: project_snapshot
        name: Prepare the PR project seed
        env:
          STRATALINT_CACHE_WRITES: 'true'
          STRATALINT_REPORT_SUCCEEDED: 'true'
        run: python3 tools/scripts/worktree/lean_actions.py snapshot --repository "$GITHUB_WORKSPACE" --layers project
      - name: Require a usable PR project seed
        env:
          READY: ${{ steps.project_snapshot.outputs.project_ready }}
          SKIP_REASON: ${{ steps.project_snapshot.outputs.project_skip_reason }}
        run: |
          if [[ "$READY" != true ]] && [[ "${STRATALINT_ACTIONS_CACHE_SEEDED:-0}" != 1 || "$SKIP_REASON" != no-build-work ]]; then
            echo "CACHE_SEED_ERROR PR build produced no accepted project seed" >&2
            exit 1
          fi
      - name: Publish the PR project seed
        if: steps.project_snapshot.outputs.project_ready == 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.keys.outputs.project_archive_path }}
          key: ${{ steps.keys.outputs.project_key }}
      - id: dependency_snapshot
        name: Prepare the PR dependency seed
        env:
          STRATALINT_CACHE_WRITES: 'true'
          STRATALINT_CHECK_SUCCEEDED: 'true'
        run: python3 tools/scripts/worktree/lean_actions.py snapshot --repository "$GITHUB_WORKSPACE" --layers dependency
      - name: Verify the PR project cache was published
        if: steps.project_snapshot.outputs.project_ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: ${{ steps.keys.outputs.project_key }}
        run: |
          set -euo pipefail
          saved="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/caches" -f key="$CACHE_KEY" -f ref="$GITHUB_REF")"
          jq -e --arg key "$CACHE_KEY" --arg ref "$GITHUB_REF" \
            'any(.actions_caches[]; .key == $key and .ref == $ref)' <<< "$saved" >/dev/null || {
              echo "CACHE_SEED_ERROR project cache was not published to the producer ref" >&2
              exit 1
            }
      - name: Publish the PR dependency seed
        if: steps.dependency_snapshot.outputs.dependency_ready == 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.keys.outputs.dependency_archive_path }}
          key: ${{ steps.keys.outputs.dependency_key }}
      - name: Publish the PR toolchain seed
        if: steps.elan.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.elan
          key: ${{ steps.keys.outputs.elan_key }}
      - name: Produce the frozen alignment scoped report
        env:
          STRATALINT_ACCEPT_COLD_BUILD: '1'
        run: |
          python3 - <<'PY'
          import sys
          import tempfile
          from pathlib import Path

          root = Path.cwd()
          sys.path.insert(0, str(root / 'tools/lean-inspector'))
          import scoped

          class AlignmentEntry(scoped.Entry):
              def discover(self, roots):
                  inputs = scoped.public.selection.Selection(self.root)
                  inputs.validate('lean-report')
                  if not set(roots) <= inputs.modules().keys():
                      raise ValueError('alignment roots must be registered report modules')
                  utility_file = self.phase('utility', [
                      'dotnet', self.producer, 'lean-utility-input'])
                  utility_scope_file = self.phase('utility-scope', [
                      'dotnet', self.producer, 'lean-utility-input', '--scope'])
                  utilities = scoped.public.read_json(utility_file.read_bytes())
                  utility_inputs = scoped.public.read_json(utility_scope_file.read_bytes())
                  request = self.temporary / 'scope-request.json'
                  selected = self.temporary / 'selected-modules.json'
                  request.write_bytes(scoped.materials.canonical_json(dict(
                      roots=roots, modules=sorted(inputs.modules()),
                      utilities=utilities, utility_inputs=utility_inputs)))
                  self.phase('scope', self.guarded('script', 'run',
                      'leanInspector/reportScope', str(request), str(selected)))
                  scope = scoped.public.read_json(selected.read_bytes())
                  scoped.check_scope(self.root, scope, roots)
                  self.environment['STRATALINT_INSPECTOR_SCOPE_FILE'] = str(selected)
                  self.environment['STRATALINT_INSPECTOR_UTILITY_INPUT'] = str(utility_file)
                  return scope, utilities

          roots = sorted({
              path.relative_to(root / 'Golden/Frozen/state').as_posix()
                  .removesuffix('.lean.json').replace('/', '.')
              for path in (root / 'Golden/Frozen/state').rglob('*.lean.json')
              if (root / path.relative_to(root / 'Golden/Frozen/state')
                  .as_posix().removesuffix('.json')).is_file()
          })
          if not roots:
              raise ValueError('frozen alignment requires nonempty retained roots')
          output = root / '.lake/build/stratalint/frozen-alignment-report.json'
          logs = Path(str(output) + '.logs')
          logs.mkdir(parents=True, exist_ok=True)
          with tempfile.TemporaryDirectory(prefix='frozen-alignment.') as temporary:
              entry = AlignmentEntry(root, temporary, logs)
              entry.provision()
              scoped.produce(entry, output, roots)
          PY
      - name: Export the frozen alignment scoped report
        uses: actions/upload-artifact@v4
        with:
          name: frozen-alignment-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .lake/build/stratalint/frozen-alignment-report.json
            .lake/build/stratalint/frozen-alignment-report.json.sha256
            .lake/build/stratalint/frozen-alignment-report.json.input.attestation
            .lake/build/stratalint/frozen-alignment-report.json.provenance.json
            .lake/build/stratalint/frozen-alignment-report.json.materials.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  compatibility-probe:
    name: Check the mathlib upgrade compatibility roots
    if: github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'mathlib-upgrade-probe'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      STRATALINT_CACHE_WRITES: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Validate the pull request merge candidate and strip checkout remote
        env:
          CI_HIT_PATHS: '*'
          CI_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash tools/scripts/workflow/ci-entry.sh
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build the Lean producer for the PR seed
        run: make -C tools dotnet DOTNET_PROJECT=tools/StrataLint.Cli/StrataLint.Cli.csproj
      - id: keys
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/scripts/worktree/lean_actions.py keys --repository "$GITHUB_WORKSPACE"
      - id: elan
        if: steps.keys.outputs.elan_key != ''
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ~/.elan
          key: ${{ steps.keys.outputs.elan_key }}
      - run: tools/scripts/workflow/install-lean-toolchain.sh lean-toolchain --github-path "$GITHUB_PATH"
      - id: dependency
        if: steps.keys.outputs.dependency_key != ''
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.keys.outputs.dependency_archive_path }}
          key: ${{ steps.keys.outputs.dependency_key }}
          restore-keys: ${{ steps.keys.outputs.dependency_restore_prefix }}
      - id: project
        if: steps.keys.outputs.project_key != ''
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.keys.outputs.project_archive_path }}
          key: ${{ steps.keys.outputs.project_restore_key }}
          restore-keys: ${{ steps.keys.outputs.project_restore_prefix }}
      - name: Restore optional validated seeds
        env:
          DEPENDENCY_KEY: ${{ steps.dependency.outputs.cache-matched-key }}
          PROJECT_KEY: ${{ steps.project.outputs.cache-matched-key }}
          PROJECT_RESTORE_KEY: ${{ steps.keys.outputs.project_restore_key }}
          DEPENDENCY_OUTCOME: ${{ steps.dependency.outcome }}
          PROJECT_OUTCOME: ${{ steps.project.outcome }}
        run: python3 tools/scripts/worktree/lean_actions.py restore --repository "$GITHUB_WORKSPACE" --dependency-key "$DEPENDENCY_KEY" --project-key "$PROJECT_KEY" --project-restore-key "$PROJECT_RESTORE_KEY" --dependency-outcome "$DEPENDENCY_OUTCOME" --project-outcome "$PROJECT_OUTCOME"
      - name: Compile and inspect the compatibility roots
        env:
          GH_TOKEN: ${{ github.token }}
          STRATALINT_ACCEPT_COLD_BUILD: '1'
        run: |
          set -euo pipefail
          unset LEAN_NUM_THREADS
          mkdir -p build/lean-cache
          producer="$(bash tools/scripts/workflow/judge-lean-producer.sh "$GITHUB_WORKSPACE/tools/StrataLint.Cli/bin/Release/net10.0")"
          if [[ -n "$producer" ]]; then
            export STRATALINT_LEAN_PRODUCER_DLL="$producer"
          else
            unset STRATALINT_LEAN_PRODUCER_DLL
          fi
          compatibility_roots=(
            D5.S3.Weil.ZetaPntBase.AdditiveCombination
            D5.S3.Weil.ZetaPntBase.ResidueRectangles
            D5.S3.Analytic.Interpolation.OEISA394578RatioRefutation
            D5.S3.Arith.Robin.GoldenCongruenceRobin
            D5.S3.Combinatorics.Orthogonality.ThetaRepresentationNonconvex
            D5.S3.Estimation.SequentialDecisionRisk.NativeBernoulliFactoryCriticalMoment
            D5.S3.Observer.ProbabilisticClosure.TrajectoryLaws.NativeBorelFiniteCompleteObstruction
            D5.S3.Observer.ProbabilisticClosure.TrajectoryLaws.NativeBorelFiniteProducts
            D5.S3.Observer.ProbabilisticClosure.TrajectoryLaws.NativeBorelKilledPaths
            D5.S3.Quantum.Entanglement.FullySeparableExchangeObstruction
            D5.S3.Quantum.Hiai.GeometricTraceConvexity
            D5.S3.Zeros.ObserverCriteria.StopLossWeakCurvature
          )
          make lean-report-scoped \
            LEAN_REPORT=.lake/build/stratalint/upgrade-compatibility-scoped-report.json \
            LEAN_TARGETS="${compatibility_roots[*]}" \
            2>&1 | tee build/lean-cache/compatibility-probe.log
      - name: Check the additive tactic domains and equation operations
        env:
          STRATALINT_ACCEPT_COLD_BUILD: '1'
        run: |
          set -euo pipefail
          cat > build/lean-cache/additive-compatibility.lean <<'LEAN'
          import D5.S3.Weil.ZetaPntBase.AdditiveCombination
          set_option autoImplicit false

          example {A : Type*} [AddGroup A] (a b : A) (h : a = b) : a = b := by
            additive_combination (norm := simp [h]) h

          example {A : Type*} [AddGroup A] (a b c : A) (h : a = b) :
              a + c = b + c := by
            additive_combination (norm := (change (a + c - (b + c)) -
              ((a + c) - (b + c)) = 0; exact sub_self _)) (h + c)

          example {R : Type*} [Ring R] (a b c d : R) (h : a = b) (k : c = d) :
              a * c = b * d := by
            additive_combination (h * k)

          example {R : Type*} [DivisionRing R] (a b c d : R) (h : a = b) (k : c = d) :
              a / c = b / d := by
            additive_combination (h / k)

          example {R : Type*} [DivisionRing R] (a b : R) (h : a = b) :
              a⁻¹ = b⁻¹ := by
            additive_combination (h⁻¹)

          example {R : Type*} [Ring R] [IsReduced R] (a b : R) (h : a = b) :
              a = b := by
            additive_combination (norm := simp [h]) (exp := 2) h

          elab "additive_two_test " e:term : tactic =>
            Mathlib.Tactic.LinearCombinationPrime.elabAdditiveCombination
              e none none (some e) true

          example {A : Type*} [AddCommGroup A] (a b : A) (h : a = b) : a = b := by
            additive_two_test h
          LEAN
          bash tools/scripts/worktree/lean-cache-run.sh lake env lean \
            build/lean-cache/additive-compatibility.lean
      - name: Export compatibility diagnostics and scoped report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathlib-upgrade-compatibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .lake/build/stratalint/upgrade-compatibility-scoped-report.json*
            .lake/build/stratalint/upgrade-compatibility-scoped-report.json.logs/
            build/lean-cache/compatibility-probe.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
