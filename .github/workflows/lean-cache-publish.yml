# Lean 构建缓存的发布(#2542 步骤 C 的 producer 侧)。
#
# 它**不是** required check，也不属于 admission：归档是加速器，永不进信任链，
# 它的存在永不能让任何判词从红变绿，它的失败也永不该让 dev 的门变红。
#
# 为什么是独立文件而不是 ci.yml 里的一个 job：
# 【2026-08-21 实测勘正】本 workflow 原本设计为「不新增构建」：读取 admission 流水线
# 刚写进 Actions cache 的两级缓存，直接打包发布。**该前提已被实测推翻** ——
# `workflow_run` 触发的运行**读不到 `push` 事件写入的 cache**：前缀逐字符匹配、
# cache 就在 `refs/heads/dev`（dev 即 default branch）、写入早于读取一小时以上，
# 三次运行一致报 `Cache not found`（32453224135 / 32457210655 / 32461241477）。
# GitHub 文档称 workflow_run 可读 default branch 作用域的 cache，与实测不符；此处以实测为准。
#
# 故改为：cache 命中就用（快速路径，若日后作用域问题消失即自动生效），
# **未命中则自己构建** —— `lake exe cache get` 取 mathlib 走外部 CDN，不受 Actions cache
# 作用域限制。代价是这个 job 会花十几分钟自行构建；它不在任何 required check 内，慢不阻塞任何人。
#
#   1. `lean-report-input.sh:135-140` 把 ci.yml 中 `lean-inspect:` 到 `baseline-admission:`
#      的**切片文本**折进 Lean 报告的输入闭包，并解析其中的脚本引用。发布脚本若出现在那段里，
#      改它一行就会让每一份 canonical Lean 报告作废、本地与 CI 全量重算。
#   2. `Cf10WorkflowSeparatesLeanInspectionFromDotnetAdmission` 禁止 `baseline-admission:`
#      到文件末尾的切片出现 `.lake` / `elan` / `lake build`。
#   两段切片首尾相接，覆盖了 ci.yml 中 lean-inspect 之后的全部文本。
#   3. 加进 ci.yml 会把它推到 922 行，越过 SL-003 的 800 行硬线；第 8 条要的是裂桶，不是抬阈值。
# 三条一致指向同一个结论：发布是独立关注点，就该住在自己的文件里。
name: Lean build cache publication

# 【触发形态：2026-08-21 owner 定「做成定时的就行」】
#   理由（owner 原话）：「反正缓存没那么热，人家本地也更新」——
#   消费侧本就会用 `lake build` 补差量，故发布不必跟住每一次 dev 推进。
#   这同时解掉两个此前无解的读数：
#     ① 触发间隔 5–11 分钟（dev 约 16 提交/小时）< 单次 run 60 分钟 ⇒ 追不平，且会
#        持续堆积 6–12 个并发 run 挤占 runner 额度；定时后二者都不复存在。
#     ② `workflow_run` 读不到 `push` 写的 cache（见文件头实测）；`schedule` 跑在
#        默认分支上，作用域**可能**正常 —— 未测，改完看首个 run 的 cache-hit 即知。
#   `0 */6 * * *` 是 policy-override（非派生值）：owner=仓库 τ=0 owner，
#   依据=本次裁决，退出条件=命中率实测数据齐备后重定，案号见 #2634。
#   `workflow_dispatch` 用于不等 6 小时立刻验证。
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

# 【并发形态：定时之后不需要 concurrency 组】
#
# 此前这里有一段基于误诊的历史：两个 run 的 `conclusion: cancelled` 被当成并发组取消，
# 据此连改三轮（`cancel-in-progress: false` → 整体移除 concurrency），取消照旧。
# 真因是 `timeout-minutes: 45`（GitHub 对超时的 conclusion 也是 `cancelled`，
# 该字段不区分两者）：32479993734 跑 45m19s、32480023451 跑 45m17s，
# 都被杀在 `Build when no cache layer was available`。
#
# 改定时之后，堆积的前提本身消失了：每 6 小时一次，单次 run 远短于该间隔，
# 不会出现此前「触发 5–11 分钟 / run 60 分钟 ⇒ 常驻 6–12 个并发」的局面。
# 故此处**不设** concurrency 组；万一手动触发撞车，由 `publish` 动词的幂等性吸收
# —— 同一内容地址已发布时它 no-op 退出。

jobs:
  publish:
    name: Publish the Lean build cache
    # 定时触发下没有 `github.event.workflow_run` 上下文；留着该条件会让 job 永远被跳过。
    # 「不给失败的推送留缓存」由内容地址本身保证：地址取自这一刻 dev 的实际输入，
    # 发布的产物与该地址绑定，消费侧按地址取，取不到就本地补 —— 不存在“发布了坏缓存”。
    runs-on: ubuntu-24.04-arm
    # 【超时形态：2026-08-21 读实际日志后勘正】
    #   此前两个 run 的 `conclusion: cancelled` 被我误读为「并发组取消」，据此连打三四个
    #   补丁改 `concurrency`，取消照旧。真因是**这个数字**：GitHub 对 `timeout-minutes`
    #   到点的 conclusion 就是 `cancelled`，与并发取消在该字段上无法区分。
    #   读数：32479993734 跑 45分19秒、32480023451 跑 45分17秒，两者都被杀在同一步
    #   `Build when no cache layer was available`；从零 `lake build` 实测 40 分钟以上，
    #   加 checkout/toolchain/address/cache-restore 的前置开销即越过 45 分。
    #   取 120：为上述自建实测留约 3 倍余量（GitHub 该字段上限 360）。
    #   这是**为取得第一份端到端读数**而放宽，不是终态：真正的修法是让上游 job 把已构建
    #   的产物交给本 workflow（artifact 跨 run 可读），从而根本不必自建。
    timeout-minutes: 120
    steps:
      - name: Check out the commit that was published
        id: checkout-publish
        uses: actions/checkout@v4
        with:
          # 定时触发下检出默认分支 HEAD（即 dev 当前 tip）；
          # `github.event.workflow_run.head_sha` 在此事件下为空，留着会检出错误的树。
          # 剥夺步骤要对 HEAD^1 做烟测，而这里检出的是一个已合入的普通提交，
          # 不是 merge ref；默认的 fetch-depth: 1 只取一个提交，父提交不可达。
          fetch-depth: 2

      - name: Strip checkout remote state
        if: steps.checkout-publish.outcome == 'success'
        shell: bash
        env:
          CHECKOUT_PATH: .
        run: |
          set -euo pipefail
          git -C "$CHECKOUT_PATH" remote remove origin
          git -C "$CHECKOUT_PATH" for-each-ref --format='delete %(refname)' refs/remotes/ |
            git -C "$CHECKOUT_PATH" update-ref --stdin
          remote_count="$(git -C "$CHECKOUT_PATH" remote | wc -l)"
          remote_ref_count="$(git -C "$CHECKOUT_PATH" for-each-ref --format='%(refname)' refs/remotes/ | wc -l)"
          if [[ "$remote_count" -ne 0 || "$remote_ref_count" -ne 0 ]]; then
            printf '%s\n' "checkout still exposes remotes or remote-tracking refs" >&2
            exit 1
          fi
          head_sha="$(git -C "$CHECKOUT_PATH" rev-parse HEAD)"
          base_sha="$(git -C "$CHECKOUT_PATH" rev-parse HEAD^1)"
          test -n "$head_sha"
          test -n "$base_sha"

      - name: Install the pinned Lean toolchain
        shell: bash
        env:
          TOOLCHAIN_FILE: ${{ github.workspace }}/lean-toolchain
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/tools/scripts/workflow/install-lean-toolchain.sh" \
            "${TOOLCHAIN_FILE}" --github-path "$GITHUB_PATH"

      - name: Resolve this commit's Lean input addresses
        id: addr
        shell: bash
        run: |
          set -euo pipefail
          helper="$GITHUB_WORKSPACE/tools/scripts/report/lean-report-input.sh"
          test -x "${helper}"
          read -r address producer_sha256 sources_sha256 config_sha256 \
            < <("${helper}" address --repository "$GITHUB_WORKSPACE")
          echo "config_sha256=${config_sha256}" >> "$GITHUB_OUTPUT"
          echo "sources_sha256=${sources_sha256}" >> "$GITHUB_OUTPUT"

      # 复用 admission 流水线刚写进去的两级缓存。命中即无需重建；未命中说明这个地址
      # 还没有构建产物，此时无可发布，下一步安静记录而不失败。
      - name: Restore the Lean dependency layer
        uses: actions/cache/restore@v4
        with:
          path: |
            .lake/packages
            .lake/config
            .lake/.stratalint-lean-cache-stamp.json
            ~/.cache/mathlib
          key: ${{ runner.os }}-${{ runner.arch }}-lake-deps-v1-${{ steps.addr.outputs.config_sha256 }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-lake-deps-v1-${{ steps.addr.outputs.config_sha256 }}

      - name: Restore the Lean build layer
        id: build
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: ${{ runner.os }}-${{ runner.arch }}-lake-build-v1-${{ steps.addr.outputs.config_sha256 }}-${{ steps.addr.outputs.sources_sha256 }}
          # ci.yml 的对应步骤带同样的前缀回退：config 未变时，同一 config 下的任一 build 层
          # 都是可用的增量起点。首个真实运行漏了这两行，于是 exact key 未命中即判无可发布。
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-lake-build-v1-${{ steps.addr.outputs.config_sha256 }}-

      # 缓存未命中时自己构建。`lake exe cache get` 取 mathlib 的 olean 走外部 CDN，
      # 与 Actions cache 的作用域无关，所以这条路在 workflow_run 下也走得通。
      - name: Build when no cache layer was available
        id: selfbuild
        if: steps.build.outputs.cache-hit != 'true' && steps.build.outputs.cache-matched-key == ''
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get || printf '%s\n' "mathlib cache get returned nonzero; lake build will fill the gaps"
          lake build
          printf 'olean=%s\n' "$(find .lake/build -name '*.olean' | wc -l | tr -d ' ')"
          echo "built=true" >> "$GITHUB_OUTPUT"

      # 前缀回退可能取到**同一 config 但不同 sources** 的 build 层。直接发布会把内容不符的
      # 归档挂到当前内容地址下 —— 那是这条链路最危险的失败模式，因为消费者按地址取，
      # 拿到的字节却不是那个地址该有的。
      #
      # 故发布前用 lake 自己判：把归档喂给 `lake build`，**零编译**才说明它与当前源码相符。
      # 判据只认 `Built`/`Building`/`Compiling` 计数为 0；有任何一项非零即内容不符，不发布。
      #
      # 这一步**只守缓存恢复那条路径**：自建路径刚构建完，零编译是恒真的，
      # 拿恒真的量当判据等于没判（本仓「恒值判据」之诫），故自建时跳过它、直接发布。
      - name: Verify the restored build matches this commit
        id: verify
        if: steps.build.outputs.cache-hit == 'true' || steps.build.outputs.cache-matched-key != ''
        shell: bash
        env:
          BUILD_LOG: ${{ runner.temp }}/verify-build.txt
        run: |
          set -euo pipefail
          lake build 2>&1 | tee "${BUILD_LOG}"
          compiled="$(grep -cE '(Built|Building|Compiling) ' "${BUILD_LOG}" || true)"
          printf 'compiled_targets=%s\n' "${compiled}"
          if [[ "${compiled}" -eq 0 ]]; then
            echo "matches=true" >> "$GITHUB_OUTPUT"
          else
            echo "matches=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the build cache under its content address
        if: steps.verify.outputs.matches == 'true' || steps.selfbuild.outputs.built == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_LOG: ${{ runner.temp }}/publish.txt
        run: |
          set -euo pipefail
          publisher="$GITHUB_WORKSPACE/tools/scripts/worktree/lean-cache-publish.sh"
          test -x "${publisher}"
          date -u '+publish_started_at=%Y-%m-%dT%H:%M:%SZ' | tee "${PUBLISH_LOG}"
          "${publisher}" publish --repository "$GITHUB_WORKSPACE" | tee -a "${PUBLISH_LOG}"
          date -u '+publish_finished_at=%Y-%m-%dT%H:%M:%SZ' | tee -a "${PUBLISH_LOG}"
          {
            echo '## Lean build cache'
            echo
            echo '```'
            cat "${PUBLISH_LOG}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record that no build artifacts were available to publish
        if: steps.verify.outputs.matches != 'true' && steps.selfbuild.outputs.built != 'true'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Lean build cache: no archive for this address'
            echo
            echo 'The build layer for this exact content address is absent from the cache,'
            echo 'so this run has nothing to republish. Consumers resolve their cache from'
            echo 'a donor worktree or a local build, as they do for any address that has'
            echo 'not been published.'
          } >> "$GITHUB_STEP_SUMMARY"
