            D5.S3.Quantum.Magic.NonlocalNonstabilizernessHaarMean
            D5.S3.Quantum.Thermal.DynamicCoolingParallelTieUniqueness
            D5.S3.QuantumBounds.Designs.CrossFrameRankTwoMinimum
            D5.S3.QuantumBounds.LocalPerceptionCHSH
            D5.S3.QuantumBounds.RebitExclusionDistance
            D5.S3.QuantumChannels.PauliThreeWeightBayesianInverseUniqueness
            D5.S3.QuantumChannels.QutritStochasticNonunitalRefutation
            D5.S3.Zeros.Jensen.FactorialJensenKernelBound
            Reg.D5.S0.History.Spacetime.HFMemberOccurrences
            Reg.D5.S1.Eigenstructure.FilteredPowerBound
            Reg.D5.S1.Recurrence.Algebraic.HannaLogarithmicPowerClosure
            Reg.D5.S1.Recurrence.Periodic.IntegralEgfTotientPeriod
            Reg.D5.S1.Recurrence.Periodic.ScaledLogColumnPeriodicity
            Reg.D5.S3.Analytic.SeriesInequalities.HNPCorrectionLiftAdvantage
            Reg.D5.S3.Analytic.SeriesInequalities.LorentzCommonGridStability
            Reg.D5.S3.Analytic.SeriesInequalities.OriginalRingEnvelopeScale
            Reg.D5.S3.Analytic.SeriesInequalities.ParametricLorentzJetTransport
            Reg.D5.S3.Arith.Congruence.CohnUniformThreeAdic
            Reg.D5.S3.Arith.FibonacciAtomic.Observer.BoundedPreorderTrial
            Reg.D5.S3.Arith.FibonacciAtomic.Observer.CombLiteralInstallationBounds
            Reg.D5.S3.Arith.FibonacciAtomic.Observer.NativeActiveParityExecution
            Reg.D5.S3.Arith.FibonacciAtomic.Observer.NativeClassRootPadding
            Reg.D5.S3.Arith.FibonacciAtomic.Observer.NativeClassRootSimulation
            Reg.D5.S3.Arith.FibonacciAtomic.Observer.NativePollingAlignment
            Reg.D5.S3.Arith.FibonacciAtomic.Observer.SparseLiteralParityReadLowerBound
