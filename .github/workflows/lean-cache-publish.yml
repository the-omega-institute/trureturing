name: Lean build cache publication

# Protected dev pushes refresh the Actions cache. Pinned manual builds consume it.
# Scheduled runs publish the protected-dev Release.
# Dispatch on the exact protected branch ref with a reachable 40-hex commit, and
# allow up to the GitHub-hosted 360-minute job limit.  Example:
# gh workflow run lean-cache-publish.yml --ref dev \
#   -f source_ref=refs/heads/dev -f source_sha="$(git rev-parse dev)"
on:
  push:
    branches: [dev]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Protected build source (refs/heads/dev or refs/heads/integration-...)'
        required: true
        type: string
        default: refs/heads/dev
      source_sha:
        description: 'Full SHA of a reachable protected commit'
        required: true
        type: string

      operation:
        description: 'Build a protected commit or publish a dev Release (loning only)'
        type: choice
        options: [build, release]
        default: build
      release_seed_tag:
        description: 'Optional exact published Release tag to seed the protected build'
        type: string
      release_seed_producer:
        description: 'Immutable producer commit of release_seed_tag'
        type: string
      regenerate_report_artifacts:
        description: 'Explicitly regenerate all report artifacts, retaining compiled Lean/dependencies'
        type: boolean
        default: false
      shard_history_anchor:
        description: 'Optional exact dev history anchor for the protected sharded build'
        type: string
      native_report_batch_modules:
        description: 'Maximum modules per native extraction process (integer 1..100)'
        type: string
        default: '100'

permissions: {}

# Replace only a pending automatic refresh for the same ref. Manual and
# scheduled runs each get their own workflow group before job-level locking.
concurrency:
  group: lean-cache-publication-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  producer:
    name: Prepare the protected branch Lean build
    permissions:
      contents: read
      actions: read
      pull-requests: read
    if: >-
      (github.event_name == 'push' && github.event.deleted == false && github.ref_protected &&
        github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'build')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    concurrency:
      group: ${{ startsWith(github.ref, 'refs/heads/integration-') && 'lean-cache-integration-producer' || 'lean-cache-producer' }}
      queue: max
      cancel-in-progress: false
    env:
      STRATALINT_CACHE_WRITES: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Validate the manual source ref and immutable pin
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          WORKFLOW_REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" == "$WORKFLOW_REF" ]] || {
            echo "CACHE_SOURCE_ERROR source_ref must equal the workflow dispatch ref" >&2
            exit 2
          }
          [[ "$SOURCE_REF" =~ ^refs/heads/(dev|integration-[A-Za-z0-9._/-]+)$ ]] || {
            echo "CACHE_SOURCE_ERROR source ref is outside dev/integration protected scope" >&2
            exit 2
          }
          git check-ref-format "$SOURCE_REF" >/dev/null || {
            echo "CACHE_SOURCE_ERROR source ref is not a valid Git ref" >&2
            exit 2
          }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$SOURCE_SHA" != "$(printf '%040d' 0)" ]] || {
            echo "CACHE_SOURCE_ERROR source_sha must be a nonzero 40-hex SHA" >&2
            exit 2
          }
          branch="${SOURCE_REF#refs/heads/}"
          protected="$(gh api "repos/$REPOSITORY/branches/$branch" --jq '.protected')"
          [[ "$protected" == true ]] || {
            echo "CACHE_SOURCE_ERROR source branch is not protected" >&2
            exit 2
          }
          merge_base="$(gh api "repos/$REPOSITORY/compare/$SOURCE_SHA...$branch" --jq '.merge_base_commit.sha')"
          [[ "$merge_base" == "$SOURCE_SHA" ]] || {
            echo "CACHE_SOURCE_ERROR source_sha is not an ancestor of the protected branch" >&2
            exit 2
          }
          {
            echo "STRATALINT_CACHE_SOURCE_REF=$SOURCE_REF"
            echo "STRATALINT_CACHE_SOURCE_COMMIT=$SOURCE_SHA"
            echo "STRATALINT_CACHE_CHECKED_OUT_SHA=$SOURCE_SHA"
            echo "STRATALINT_CACHE_SOURCE_VALIDATED=true"
          } >> "$GITHUB_ENV"
      - name: Install the pinned tools release
        if: hashFiles('Meta/tools-release.json', '.github/scripts/install-tools.py') != ''
        run: python3 .github/scripts/install-tools.py
      - name: Fetch the fixed dev history for the shard layout
        if: inputs.shard_history_anchor != '' || (vars.LEAN_CACHE_SHARDS_REF == github.ref_name && vars.LEAN_CACHE_SHARDS_HISTORY_ANCHOR != '')
        env:
          ANCHOR: ${{ inputs.shard_history_anchor || (vars.LEAN_CACHE_SHARDS_REF == github.ref_name && vars.LEAN_CACHE_SHARDS_HISTORY_ANCHOR) || '' }}
        run: |
          [[ "$ANCHOR" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=2002 origin "$ANCHOR"
          [[ "$(git rev-parse FETCH_HEAD)" == "$ANCHOR" ]]
      - name: Validate candidate and strip checkout remote
        env:
          CI_HIT_PATHS: '*'
          CI_PUSH_BEFORE: ${{ github.event.before }}
          CI_PUSH_RANGE: candidate
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            export GITHUB_SHA="$STRATALINT_CACHE_CHECKED_OUT_SHA"
          fi
          bash tools/scripts/workflow/ci-entry.sh
      - name: Produce the Actions cache
        if: github.event_name == 'push' && github.ref_protected && !github.event.deleted
        uses: ./.github/actions/lean-cache-produce
        env:
          STRATALINT_CACHE_WRITES: 'true'
        with:
          shard-history-anchor: ${{ vars.LEAN_CACHE_SHARDS_REF == github.ref_name && vars.LEAN_CACHE_SHARDS_HISTORY_ANCHOR || '' }}
      # A manual pin can predate the push-only writer. Run only restore/build
      # operations against that checkout, including on retries and failures.
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - if: github.event_name == 'workflow_dispatch'
        name: Build the pinned Lean producer with locked dependencies
        run: make -C tools dotnet DOTNET_PROJECT=tools/StrataLint.Lean/StrataLint.Lean.csproj
      - if: github.event_name == 'workflow_dispatch'
        id: keys
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/scripts/worktree/lean_actions.py keys --repository "$GITHUB_WORKSPACE"
      - if: steps.keys.outputs.elan_key != ''
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: ~/.elan
          key: ${{ steps.keys.outputs.elan_key }}
      - if: github.event_name == 'workflow_dispatch'
        run: tools/scripts/workflow/install-lean-toolchain.sh lean-toolchain --github-path "$GITHUB_PATH"
      - id: dependency
        if: steps.keys.outputs.dependency_key != ''
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: ${{ steps.keys.outputs.dependency_archive_path }}
          key: ${{ steps.keys.outputs.dependency_key }}
          restore-keys: ${{ steps.keys.outputs.dependency_restore_prefix }}
      - id: shards
        if: github.event_name == 'workflow_dispatch' && inputs.release_seed_tag == '' && inputs.release_seed_producer == '' && (inputs.shard_history_anchor != '' || (vars.LEAN_CACHE_SHARDS_REF == github.ref_name && vars.LEAN_CACHE_SHARDS_HISTORY_ANCHOR != '')) && hashFiles('.github/actions/lean-cache-shards/action.yml') != ''
        uses: ./.github/actions/lean-cache-shards
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          operation: restore
      - id: project
        if: steps.keys.outputs.project_key != '' && inputs.release_seed_tag == '' && inputs.release_seed_producer == '' && (steps.shards.outputs.available || '0') == '0'
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: ${{ steps.keys.outputs.project_archive_path }}
          key: ${{ steps.keys.outputs.project_restore_key || steps.keys.outputs.project_key }}
          restore-keys: ${{ steps.keys.outputs.project_restore_prefix }}
      - if: github.event_name == 'workflow_dispatch'
        name: Validate the restored build inputs
        env:
          DEPENDENCY_KEY: ${{ steps.dependency.outputs.cache-matched-key }}
          DEPENDENCY_OUTCOME: ${{ steps.dependency.outcome }}
          PROJECT_KEY: ${{ steps.project.outputs.cache-matched-key }}
          REQUESTED_PROJECT_KEY: ${{ steps.keys.outputs.project_restore_key || steps.keys.outputs.project_key }}
          PROJECT_OUTCOME: ${{ steps.project.outcome }}
          SHARDS: ${{ steps.shards.outputs.available || '0' }}
          COMPLETE: ${{ steps.shards.outputs.complete }}
        run: |
          args=(--dependency-key "$DEPENDENCY_KEY" --dependency-outcome "$DEPENDENCY_OUTCOME")
          if [[ "$SHARDS" == 0 ]]; then
            args+=(--project-key "$PROJECT_KEY" --project-restore-key "$REQUESTED_PROJECT_KEY" --project-outcome "$PROJECT_OUTCOME")
          else
            args+=(--layers dependency)
          fi
          python3 tools/scripts/worktree/lean_actions.py restore --repository "$GITHUB_WORKSPACE" "${args[@]}"
          if [[ "$COMPLETE" == true ]]; then echo 'STRATALINT_ACTIONS_CACHE_SEEDED=1' >> "$GITHUB_ENV"; fi
      - if: github.event_name == 'workflow_dispatch' && (inputs.release_seed_tag != '' || inputs.release_seed_producer != '')
        name: Restore the explicitly selected Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_seed_tag }}
          PRODUCER: ${{ inputs.release_seed_producer }}
        run: |
          [[ "$TAG" =~ ^[A-Za-z0-9._-]+$ && "$PRODUCER" =~ ^[0-9a-f]{40}$ && "$PRODUCER" != 0000000000000000000000000000000000000000 ]]
          make lean-cache-from-github-without-mathlib LEAN_CACHE_MODE=candidate LEAN_CACHE_TAG="$TAG" LEAN_CACHE_SOURCE_COMMIT="$PRODUCER"
      - if: github.event_name == 'workflow_dispatch'
        name: Prepare the pinned compiler and reports on this runner
        env:
          GH_TOKEN: ${{ github.token }}
          STRATALINT_ACCEPT_COLD_BUILD: '1'
          LEAN_NUM_THREADS: '1'
          PARTIAL_INDEXED_PROJECT: ${{ (steps.shards.outputs.available || '0') != '0' && steps.shards.outputs.complete != 'true' }}
          STRATALINT_NATIVE_BATCH_MODULES: ${{ inputs.native_report_batch_modules || '100' }}
          STRATALINT_BUILD_TIMEOUT_SECONDS: '21600'
          STRATALINT_LEAN_BUILD_TARGETS: '["leanInspector/LeanInformationAudit","leanInspector/reportInspector","leanInspectorInterface/LeanInformationAuditInterface","reg/Reg","regInspector/LeanInformationAuditRegTests","regInspector/compiledJudgeTests"]'
          REGENERATE: ${{ inputs.regenerate_report_artifacts && '1' || '0' }}
        run: |
          [[ "$STRATALINT_NATIVE_BATCH_MODULES" =~ ^([1-9]|[1-9][0-9]|100)$ ]]
          export STRATALINT_LEAN_PRODUCER_DLL="$GITHUB_WORKSPACE/tools/StrataLint.Lean/bin/Release/net10.0/StrataLint.Lean.dll"
          if [[ -f tools/lean-inspector/LeanInformationAuditRegAnalysis/AuricFib/Main.lean ]]; then
            STRATALINT_LEAN_BUILD_TARGETS="$(jq -c '. + ["regInspector/LeanInformationAuditRegAnalysis.AuricFib.Main","regInspector/auricFibAnalysis"]' <<< "$STRATALINT_LEAN_BUILD_TARGETS")"
          fi
          target=lean-report
          for entry in lean-cache-prepare check-lean-report; do
            if grep -qs "^${entry}:" Makefile tools/consumer/Makefile; then target="$entry"; break; fi
          done
          diagnostics=()
          if [[ -f tools/scripts/report/runner-diagnostics.py ]]; then
            diagnostics=(python3 tools/scripts/report/runner-diagnostics.py --)
          fi
          "${diagnostics[@]}" bash tools/scripts/report/report-supervisor.sh --role lean-cache-slice -- \
            make "$target" FULL_BUILD=1 LEAN_REPORT_CACHE_MISS_POLICY=reuse-or-build REGENERATE_REPORT_ARTIFACTS="$REGENERATE"
          if [[ "$target" != lean-cache-prepare ]]; then
            python3 tools/lean-inspector/publication.py validate .lake/build/stratalint/raw-lean-report.json --repository "$GITHUB_WORKSPACE"
          fi

  scheduled-compile:
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/dev'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci-lean-release-compile.yml
    with:
      sparse-release: ${{ github.ref == 'refs/heads/dev' && vars.LEAN_CACHE_RELEASE_INDEXED_REF == 'dev' && vars.LEAN_CACHE_RELEASE_VOLUMES_REF == 'dev' }}
      source: ${{ github.sha }}
      indexed: ${{ vars.LEAN_CACHE_SHARDS_REF == 'dev' }}

  publish:
    needs: scheduled-compile
    name: Publish the Lean build cache
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/dev'
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    concurrency:
      group: lean-cache-release-publisher
      queue: max
      cancel-in-progress: false
    env:
      EXPECTED_SOURCE_SHA: ${{ github.sha }}
      LEAN_NUM_THREADS: '1'
      STRATALINT_CACHE_WRITES: 'false'
      LEAN_CACHE_RELEASE_SPARSE: ${{ needs.scheduled-compile.outputs.sparse == 'true' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: ${{ needs.scheduled-compile.outputs.history-depth || '2' }}
          persist-credentials: false
      - name: Install the pinned tools release
        run: python3 .github/scripts/install-tools.py
      - name: Validate candidate and strip checkout remote
        env:
          CI_HIT_PATHS: '*'
        run: bash tools/scripts/workflow/ci-entry.sh
      - name: Read the pinned .NET SDK version
        id: dotnet-sdk
        run: |
          version="$(jq -er '.sdk.version' global.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ steps.dotnet-sdk.outputs.version }}
      - name: Build the scheduled Release producer
        run: make -C tools dotnet DOTNET_PROJECT=tools/StrataLint.Lean/StrataLint.Lean.csproj
      - id: keys
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/scripts/worktree/lean_actions.py keys --repository "$GITHUB_WORKSPACE"
      - id: elan
        if: steps.keys.outputs.elan_key != ''
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ~/.elan
          key: ${{ steps.keys.outputs.elan_key }}
      - run: tools/scripts/workflow/install-lean-toolchain.sh lean-toolchain --github-path "$GITHUB_PATH"
      - id: release_seed
        name: Restore Release seeds and compiled layers
        uses: ./.github/actions/lean-cache-release-seed
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          mode: ${{ needs.scheduled-compile.outputs.seed || 'legacy' }}
          previous-base: ${{ needs.scheduled-compile.outputs.base }}
          cache-keys: ${{ toJSON(steps.keys.outputs) }}
      - name: Set the transfer budget for volume publication
        if: github.ref == 'refs/heads/dev' && vars.LEAN_CACHE_RELEASE_VOLUMES_REF == 'dev' && vars.LEAN_CACHE_RELEASE_INDEXED_REF == 'dev' && hashFiles('.github/actions/lean-cache-release-seed/action.yml') != ''
        run: echo 'STRATALINT_LEAN_CACHE_RELEASE_TIMEOUT_SECONDS=21600' >> "$GITHUB_ENV"
      - name: Compile missing Release artifacts
        if: steps.release_seed.outputs.cache-prepared != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LEAN_CACHE_RELEASE_VOLUMES: ${{ vars.LEAN_CACHE_RELEASE_VOLUMES_REF == 'dev' && '1' || '0' }}
          LEAN_CACHE_INDEXED: ${{ vars.LEAN_CACHE_RELEASE_INDEXED_REF == 'dev' && '1' || '0' }}
          STRATALINT_BUILD_TIMEOUT_SECONDS: '21600'
        run: bash .github/actions/lean-cache-release-seed/prepare-compiler.sh
      - name: Publish the protected-dev Release snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          LEAN_CACHE_RELEASE_VOLUMES: ${{ vars.LEAN_CACHE_RELEASE_VOLUMES_REF == 'dev' && '1' || '0' }}
          LEAN_CACHE_INDEXED: ${{ vars.LEAN_CACHE_RELEASE_INDEXED_REF == 'dev' && '1' || '0' }}
          STRATALINT_BUILD_TIMEOUT_SECONDS: '21600'
        run: |
          set -eo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SOURCE_SHA" ]]
          bash .github/actions/lean-compile-layer/measure.sh make lean-cache-to-github-without-mathlib FULL_BUILD=1 \
            LEAN_CACHE_PUBLISH_ONLY=1 |
            tee "$RUNNER_TEMP/lean-cache-publication.log"
      - name: Verify the Release publication for the checked-out commit
        shell: bash
        run: |
          set -eo pipefail
          sed -n 's/^LEAN_CACHE_PUBLISH //p' "$RUNNER_TEMP/lean-cache-publication.log" |
            jq -es --arg producer "$EXPECTED_SOURCE_SHA" '
              length == 1 and (.[0] | (.status == "published" or .status == "exists") and
                .producer_commit_sha == $producer and (.tag | type == "string" and length > 0))'

  manual-release-authorize:
    name: Authorize the manual cache Release
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'release'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Authorize the caller and pin protected dev content
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == loning && "$GITHUB_TRIGGERING_ACTOR" == loning ]] || {
            echo '::error::Only loning may start or rerun manual cache Release publication.'
            exit 1
          }
          [[ "$GITHUB_REF_PROTECTED" == true && "$GITHUB_REF" =~ ^refs/heads/(dev|integration-[A-Za-z0-9._/-]+)$ ]] || {
            echo '::error::Manual cache Release requires a protected dev or integration workflow ref.'
            exit 1
          }
          [[ "$SOURCE_REF" == refs/heads/dev && "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$SOURCE_SHA" != 0000000000000000000000000000000000000000 ]] || {
            echo '::error::Manual cache Release requires source_ref=refs/heads/dev and a nonzero full source_sha.'
            exit 1
          }
          source="$(gh api "repos/$REPOSITORY/branches/dev")"
          jq -e '.name == "dev" and .protected == true' <<< "$source" >/dev/null || {
            echo '::error::The dev source branch must be protected.'
            exit 1
          }
          tip="$(jq -er '.commit.sha' <<< "$source")"
          merge_base="$(gh api "repos/$REPOSITORY/compare/$SOURCE_SHA...$tip" --jq '.merge_base_commit.sha')"
          [[ "$merge_base" == "$SOURCE_SHA" ]] || {
            echo '::error::source_sha must be on the protected dev branch snapshot.'
            exit 1
          }
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  manual-compile:
    needs: manual-release-authorize
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci-lean-release-compile.yml
    with:
      sparse-release: ${{ github.ref == 'refs/heads/dev' && vars.LEAN_CACHE_RELEASE_INDEXED_REF == 'dev' && vars.LEAN_CACHE_RELEASE_VOLUMES_REF == 'dev' }}
      source: ${{ needs.manual-release-authorize.outputs.source_sha }}
      indexed: ${{ github.ref == 'refs/heads/dev' && vars.LEAN_CACHE_SHARDS_REF == 'dev' }}

  manual-release:
    name: Manually publish the Lean build cache
    needs: [manual-release-authorize, manual-compile]
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'release'
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    concurrency:
      group: lean-cache-release-publisher
      queue: max
      cancel-in-progress: false
    env:
      EXPECTED_SOURCE_SHA: ${{ needs.manual-release-authorize.outputs.source_sha }}
      RELEASE_DRIVER: ${{ needs.manual-release-authorize.outputs.source_sha == github.sha && '.' || 'build/release-driver' }}
      LEAN_NUM_THREADS: '1'
      STRATALINT_CACHE_WRITES: 'false'
      LEAN_CACHE_RELEASE_SPARSE: ${{ needs.manual-compile.outputs.sparse == 'true' && '1' || '0' }}
    steps:
      - name: Recheck the actor for this publication attempt
        run: |
          [[ "$GITHUB_ACTOR" == loning && "$GITHUB_TRIGGERING_ACTOR" == loning ]] || {
            echo '::error::Only loning may start or rerun manual cache Release publication.'
            exit 1
          }
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.manual-release-authorize.outputs.source_sha }}
          fetch-depth: ${{ needs.manual-compile.outputs.history-depth || '2' }}
          persist-credentials: false
      - name: Install the pinned tools release
        if: hashFiles('Meta/tools-release.json', '.github/scripts/install-tools.py') != ''
        run: python3 .github/scripts/install-tools.py
      - name: Validate candidate and strip checkout remote
        env:
          CI_HIT_PATHS: '*'
          RELEASE_SOURCE_SHA: ${{ needs.manual-release-authorize.outputs.source_sha }}
        run: GITHUB_SHA="$RELEASE_SOURCE_SHA" bash tools/scripts/workflow/ci-entry.sh
      - name: Read the pinned .NET SDK version
        id: dotnet-sdk
        run: |
          version="$(jq -er '.sdk.version' global.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ steps.dotnet-sdk.outputs.version }}
      - name: Build the manual Release producer
        run: make -C tools dotnet DOTNET_PROJECT=tools/StrataLint.Lean/StrataLint.Lean.csproj
      - id: keys
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/scripts/worktree/lean_actions.py keys --repository "$GITHUB_WORKSPACE"
      - id: elan
        if: steps.keys.outputs.elan_key != ''
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ~/.elan
          key: ${{ steps.keys.outputs.elan_key }}
      - run: tools/scripts/workflow/install-lean-toolchain.sh lean-toolchain --github-path "$GITHUB_PATH"
      - id: release_seed
        name: Restore Release seeds and compiled layers
        if: hashFiles('.github/actions/lean-cache-release-seed/action.yml') != ''
        uses: ./.github/actions/lean-cache-release-seed
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          mode: ${{ needs.manual-compile.outputs.seed || (github.ref == 'refs/heads/dev' && vars.LEAN_CACHE_SHARDS_REF == 'dev' && 'auto' || 'legacy') }}
          previous-base: ${{ needs.manual-compile.outputs.base }}
          cache-keys: ${{ toJSON(steps.keys.outputs) }}
      # Manual publication can check out a dev commit predating the local action.
      - id: dependency
        if: hashFiles('.github/actions/lean-cache-release-seed/action.yml') == '' && steps.keys.outputs.dependency_key != ''
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.keys.outputs.dependency_archive_path }}
          key: ${{ steps.keys.outputs.dependency_key }}
          restore-keys: ${{ steps.keys.outputs.dependency_restore_prefix }}
      - id: project
        if: hashFiles('.github/actions/lean-cache-release-seed/action.yml') == '' && steps.keys.outputs.project_key != ''
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.keys.outputs.project_archive_path }}
          key: ${{ steps.keys.outputs.project_key }}
          restore-keys: ${{ steps.keys.outputs.project_restore_prefix }}
      - name: Restore the pinned source's legacy seeds
        if: hashFiles('.github/actions/lean-cache-release-seed/action.yml') == ''
        env:
          DEPENDENCY_KEY: ${{ steps.dependency.outputs.cache-matched-key }}
          PROJECT_KEY: ${{ steps.project.outputs.cache-matched-key }}
          DEPENDENCY_OUTCOME: ${{ steps.dependency.outcome }}
          PROJECT_OUTCOME: ${{ steps.project.outcome }}
        run: python3 tools/scripts/worktree/lean_actions.py restore --repository "$GITHUB_WORKSPACE" --dependency-key "$DEPENDENCY_KEY" --project-key "$PROJECT_KEY" --dependency-outcome "$DEPENDENCY_OUTCOME" --project-outcome "$PROJECT_OUTCOME"
      - name: Set the transfer budget for volume publication
        if: github.ref == 'refs/heads/dev' && vars.LEAN_CACHE_RELEASE_VOLUMES_REF == 'dev' && vars.LEAN_CACHE_RELEASE_INDEXED_REF == 'dev' && hashFiles('.github/actions/lean-cache-release-seed/action.yml') != ''
        run: echo 'STRATALINT_LEAN_CACHE_RELEASE_TIMEOUT_SECONDS=21600' >> "$GITHUB_ENV"
      - name: Check out the publication tools pin for a historical source
        if: env.RELEASE_DRIVER != '.'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: build/release-driver
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/install-tools.py
            /.github/actions/lean-cache-release-seed/prepare-compiler.sh
            /.github/actions/lean-compile-layer/measure.sh
            /Meta/tools-release.json
      - name: Install the compiler-only publisher for the historical checkout
        if: env.RELEASE_DRIVER != '.'
        run: python3 build/release-driver/.github/scripts/install-tools.py
      - name: Compile missing Release artifacts
        if: steps.release_seed.outputs.cache-prepared != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          STRATALINT_BUILD_TIMEOUT_SECONDS: '21600'
          LEAN_CACHE_RELEASE_VOLUMES: ${{ vars.LEAN_CACHE_RELEASE_VOLUMES_REF == 'dev' && '1' || '0' }}
          LEAN_CACHE_INDEXED: ${{ github.ref == 'refs/heads/dev' && vars.LEAN_CACHE_RELEASE_INDEXED_REF == 'dev' && hashFiles('.github/actions/lean-cache-release-seed/action.yml') != '' && '1' || '0' }}
        run: bash "$RELEASE_DRIVER/.github/actions/lean-cache-release-seed/prepare-compiler.sh"
      - name: Publish the protected-dev Release snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          STRATALINT_BUILD_TIMEOUT_SECONDS: '21600'
          LEAN_CACHE_RELEASE_VOLUMES: ${{ vars.LEAN_CACHE_RELEASE_VOLUMES_REF == 'dev' && '1' || '0' }}
          LEAN_CACHE_INDEXED: ${{ github.ref == 'refs/heads/dev' && vars.LEAN_CACHE_RELEASE_INDEXED_REF == 'dev' && hashFiles('.github/actions/lean-cache-release-seed/action.yml') != '' && '1' || '0' }}
        run: |
          set -eo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SOURCE_SHA" ]]
          args=(publish --repository . --mode production --no-build)
          if [[ "$LEAN_CACHE_INDEXED" == 1 ]]; then args+=(--indexed); fi
          bash "$RELEASE_DRIVER/.github/actions/lean-compile-layer/measure.sh" \
            bash "$RELEASE_DRIVER/tools/scripts/worktree/lean-cache-publish.sh" "${args[@]}" |
            tee "$RUNNER_TEMP/lean-cache-publication.log"
      - name: Verify the Release publication for the checked-out commit
        shell: bash
        run: |
          set -eo pipefail
          sed -n 's/^LEAN_CACHE_PUBLISH //p' "$RUNNER_TEMP/lean-cache-publication.log" |
            jq -es --arg producer "$EXPECTED_SOURCE_SHA" '
              length == 1 and (.[0] | (.status == "published" or .status == "exists") and
                .producer_commit_sha == $producer and (.tag | type == "string" and length > 0))'
