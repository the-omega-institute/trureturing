name: Lean build cache publication

on:
  workflow_dispatch:

permissions: {}

jobs:
  compatibility-probe:
    name: Verify mathlib upgrade against the prepared dev union
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      STRATALINT_CACHE_WRITES: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Validate the pull request merge candidate and strip checkout remote
        env:
          CI_HIT_PATHS: '*'
          CI_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash tools/scripts/workflow/ci-entry.sh
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build the Lean producer for the PR seed
        run: make -C tools dotnet DOTNET_PROJECT=tools/StrataLint.Cli/StrataLint.Cli.csproj
      - id: keys
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/scripts/worktree/lean_actions.py keys --repository "$GITHUB_WORKSPACE"
      - id: elan
        if: steps.keys.outputs.elan_key != ''
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ~/.elan
          key: ${{ steps.keys.outputs.elan_key }}
      - run: tools/scripts/workflow/install-lean-toolchain.sh lean-toolchain --github-path "$GITHUB_PATH"
      - id: dependency
        if: steps.keys.outputs.dependency_key != ''
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.keys.outputs.dependency_archive_path }}
          key: ${{ steps.keys.outputs.dependency_key }}
          restore-keys: ${{ steps.keys.outputs.dependency_restore_prefix }}
      - id: project
        if: steps.keys.outputs.project_key != ''
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.keys.outputs.project_archive_path }}
          key: ${{ steps.keys.outputs.project_restore_key }}
          restore-keys: ${{ steps.keys.outputs.project_restore_prefix }}
      - name: Restore optional validated seeds
        env:
          DEPENDENCY_KEY: ${{ steps.dependency.outputs.cache-matched-key }}
          PROJECT_KEY: ${{ steps.project.outputs.cache-matched-key }}
          PROJECT_RESTORE_KEY: ${{ steps.keys.outputs.project_restore_key }}
          DEPENDENCY_OUTCOME: ${{ steps.dependency.outcome }}
          PROJECT_OUTCOME: ${{ steps.project.outcome }}
        run: python3 tools/scripts/worktree/lean_actions.py restore --repository "$GITHUB_WORKSPACE" --dependency-key "$DEPENDENCY_KEY" --project-key "$PROJECT_KEY" --project-restore-key "$PROJECT_RESTORE_KEY" --dependency-outcome "$DEPENDENCY_OUTCOME" --project-outcome "$PROJECT_OUTCOME"
      - name: Compile and inspect the compatibility roots
        env:
          GH_TOKEN: ${{ github.token }}
          STRATALINT_ACCEPT_COLD_BUILD: '1'
        run: |
          set -euo pipefail
          unset LEAN_NUM_THREADS
          mkdir -p build/lean-cache
          producer="$(bash tools/scripts/workflow/judge-lean-producer.sh "$GITHUB_WORKSPACE/tools/StrataLint.Cli/bin/Release/net10.0")"
          if [[ -n "$producer" ]]; then
            export STRATALINT_LEAN_PRODUCER_DLL="$producer"
          else
            unset STRATALINT_LEAN_PRODUCER_DLL
          fi
          compatibility_roots=(
            D5.S0.History.Spacetime.HFMemberOccurrences
            D5.S1.Eigenstructure.FilteredPowerBound
            D5.S1.Recurrence.Algebraic.HannaLogarithmicPowerClosure
            D5.S1.Recurrence.Periodic.IntegralEgfTotientPeriod
            D5.S1.Recurrence.Periodic.ScaledLogColumnPeriodicity
            D5.S1.Words.Episturmian.BoundedPowers
            D5.S1.Words.Episturmian.DiophantineExponentCriterion
            D5.S1.Words.Episturmian.MorphicDecomposition
            D5.S1.Words.MBonacciSentinelDesubstitution
            D5.S1.Words.ReturnWords.GoldenArcFirstReturnCore
            D5.S3.Analytic.Probability.BernoulliTriangularLimits
            D5.S3.Analytic.Probability.UniformCDFConvergence
            D5.S3.Analytic.SeriesInequalities.HNPCorrectionLiftAdvantage
            D5.S3.Analytic.SeriesInequalities.LorentzCoefficientRemainder
            D5.S3.Analytic.SeriesInequalities.LorentzCommonGridStability
            D5.S3.Analytic.SeriesInequalities.LorentzLocalCoefficientKernel
            D5.S3.Analytic.SeriesInequalities.OriginalRingEnvelopeScale
            D5.S3.Analytic.SeriesInequalities.ParametricLorentzJetTransport
            D5.S3.Arith.Additive.FibonacciSuperAccessibility
            D5.S3.Arith.Additive.SunWeightedDistinctSums
            D5.S3.Arith.Congruence.CohnUniformThreeAdic
            D5.S3.Arith.FibonacciAtomic.Observer.BoundedPreorderTrial
            D5.S3.Arith.FibonacciAtomic.Observer.CombLiteralInstallationBounds
            D5.S3.Arith.FibonacciAtomic.Observer.NativeActiveParityExecution
            D5.S3.Arith.FibonacciAtomic.Observer.NativeClassRootPadding
            D5.S3.Arith.FibonacciAtomic.Observer.NativeClassRootSimulation
            D5.S3.Arith.FibonacciAtomic.Observer.NativePollingAlignment
            D5.S3.Arith.FibonacciAtomic.Observer.NativeSerialDepth
            D5.S3.Arith.FibonacciAtomic.Observer.SparseLiteralParityReadLowerBound
            D5.S3.Arith.GoldenResource.ForcedInventoryLeastMaximum
            D5.S3.Arith.Robin.EulerLayerInventoryGrowth
            D5.S3.Combinatorics.Graph.PrefixReversal.NativeCircleComplement
            D5.S3.Combinatorics.Graph.PrefixReversal.NativeCircleOwnership
