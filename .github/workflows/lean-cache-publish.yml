name: Lean build cache publication

on:
  push:
    branches: [dev]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Protected build source (refs/heads/dev or refs/heads/integration-...)'
        required: true
        type: string
        default: refs/heads/dev
      source_sha:
        description: 'Full SHA of a reachable protected commit'
        required: true
        type: string

      operation:
        description: 'Build a protected commit or publish a dev Release (loning only)'
        type: choice
        options: [build, release]
        default: build
      release_seed_tag:
        description: 'Optional exact local candidate Release for the long build'
        type: string
      release_seed_producer:
        description: 'Immutable producer commit of release_seed_tag'
        type: string
      regenerate_report_artifacts:
        description: 'Explicitly regenerate all report artifacts, retaining compiled Lean/dependencies'
        type: boolean
        default: false
      native_report_batch_modules:
        description: 'Maximum modules per native extraction process (integer 1..100; full report scope unchanged)'
        type: string
        default: '100'

permissions:
  contents: write
  actions: write
  pull-requests: read

jobs:
  run:
    uses: the-omega-institute/trureturing-tools/.github/workflows/lean-cache-publish.yml@3178c75d57a098d042573bae760802fa8ba83bf6
    with:
      source_ref: ${{ inputs.source_ref || '' }}
      source_sha: ${{ inputs.source_sha || '' }}
      operation: ${{ inputs.operation || '' }}
      release_seed_tag: ${{ inputs.release_seed_tag || '' }}
      release_seed_producer: ${{ inputs.release_seed_producer || '' }}
      regenerate_report_artifacts: ${{ inputs.regenerate_report_artifacts || false }}
      native_report_batch_modules: ${{ inputs.native_report_batch_modules || '' }}
