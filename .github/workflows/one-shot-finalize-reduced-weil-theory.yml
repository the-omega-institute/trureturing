name: One-shot finalize reduced Weil theory

on:
  push:
    branches:
      - lane/math/rh-canonical-zero-data-nonvacuity-20260903

permissions:
  contents: write

concurrency:
  group: one-shot-finalize-reduced-weil-theory
  cancel-in-progress: false

jobs:
  finalize:
    if: github.repository == 'the-omega-institute/trureturing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: lane/math/rh-canonical-zero-data-nonvacuity-20260903

      - name: Append theory and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          theory='docs/develop/theory/RH_RESEARCH_LANE_THEORY.md'
          staged='docs/develop/theory/.pr5065-reduced-weil-append.tmp'
          marker='## [PR #5065] REDUCED_WEIL_OBSERVER_AND_MULTI_ORBIT_NEGATIVITY'
          if ! grep -Fq "$marker" "$theory"; then
            cat "$staged" >> "$theory"
          fi
          rm -f \
            "$staged" \
            .github/workflows/one-shot-append-mirror-krein-theory.yml \
            .github/workflows/one-shot-append-krein-second-layer.yml \
            .github/workflows/one-shot-finalize-reduced-weil-theory.yml
          git config user.name 'Lexa'
          git config user.email '50111876+AlyciaBHZ@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'theory: append mirror Krein and reduced Weil observer chain'
            git push origin HEAD:lane/math/rh-canonical-zero-data-nonvacuity-20260903
          fi
