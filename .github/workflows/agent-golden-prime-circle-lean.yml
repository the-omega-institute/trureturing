name: agent-golden-prime-circle-lean

on:
  push:
    branches:
      - agent/prover/golden-prime-circle-critical-spectrum

permissions:
  contents: read

jobs:
  validate:
    if: contains(github.event.head_commit.message, '[golden-prime-circle-lean]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/prover/golden-prime-circle-critical-spectrum
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install pinned Lean toolchain
        run: tools/scripts/workflow/install-lean-toolchain.sh lean-toolchain --github-path "$GITHUB_PATH"
      - name: Restore Lean dependencies
        run: lake update
      - name: Build golden prime-circle modules
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          : > diagnostics/summary.tsv
          failed=0
          modules=(
            D5.S3.Analytic.Zeta.GoldenSpectrum.GoldenCriticalCoordinate
            D5.S3.PrimeObserver.ChargeTomography.GoldenC2ChargeTomography
            D5.S3.Analytic.Zeta.GoldenEuler.GoldenLocalEulerFactorTrichotomy
            D5.S3.PrimeObserver.GoldenScale.GoldenLogScaleCharacter
            D5.S3.Analytic.Zeta.GoldenSpectrum.ReflectionPairTransfer
            D5.S3.PrimeObserver.ChargeTomography.SharedChargeDifferentShells
            D5.S3.Observer.Bridges.InvolutionIntertwinerParity
          )
          for module in "${modules[@]}"; do
            safe="${module//./_}"
            log="diagnostics/${safe}.log"
            echo "===== $module ====="
            lake build "$module" > "$log" 2>&1
            status=$?
            cat "$log"
            printf '%s\t%s\n' "$module" "$status" >> diagnostics/summary.tsv
            if [ "$status" -ne 0 ]; then
              failed=1
            fi
          done
          printf '%s\n' "$failed" > diagnostics/failed
          exit 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-prime-circle-lean-diagnostics
          path: diagnostics
          if-no-files-found: error
          retention-days: 3
      - name: Enforce successful module builds
        shell: bash
        run: |
          cat diagnostics/summary.tsv
          test "$(cat diagnostics/failed)" = "0"
