    with:
      unit: tests-cache-native

  tests-cache-release:
    needs: [detect, source]
    if: ${{ !cancelled() && needs.detect.result == 'success' && (!fromJSON(needs.detect.outputs.hits || '{}').current || needs.source.outputs.continuation == 'true') && fromJSON(needs.detect.outputs.hits || '{}')['tests-cache-release'] }}
    uses: ./.github/workflows/ci-unit.yml
    with:
      unit: tests-cache-release

  tests-ci-entry:
    needs: [detect, source]
    if: ${{ !cancelled() && needs.detect.result == 'success' && (!fromJSON(needs.detect.outputs.hits || '{}').current || needs.source.outputs.continuation == 'true') && fromJSON(needs.detect.outputs.hits || '{}')['tests-ci-entry'] }}
    uses: ./.github/workflows/ci-unit.yml
    with:
      unit: tests-ci-entry

  tests-cli:
    needs: [detect, source]
    if: ${{ !cancelled() && needs.detect.result == 'success' && (!fromJSON(needs.detect.outputs.hits || '{}').current || needs.source.outputs.continuation == 'true') && fromJSON(needs.detect.outputs.hits || '{}')['tests-cli'] }}
    uses: ./.github/workflows/ci-unit.yml
    with:
      unit: tests-cli

  tests-declared-template:
    needs: [detect, source]
    if: ${{ !cancelled() && needs.detect.result == 'success' && (!fromJSON(needs.detect.outputs.hits || '{}').current || needs.source.outputs.continuation == 'true') && fromJSON(needs.detect.outputs.hits || '{}')['tests-declared-template'] }}
    uses: ./.github/workflows/ci-unit.yml
    with:
      unit: tests-declared-template


  tests-engine:
    needs: [detect, source]
    if: ${{ !cancelled() && needs.detect.result == 'success' && (!fromJSON(needs.detect.outputs.hits || '{}').current || needs.source.outputs.continuation == 'true') && fromJSON(needs.detect.outputs.hits || '{}')['tests-engine'] }}
    uses: ./.github/workflows/ci-unit.yml
    with:
      unit: tests-engine

  tests-filemap:
    needs: [detect, source]
    if: ${{ !cancelled() && needs.detect.result == 'success' && (!fromJSON(needs.detect.outputs.hits || '{}').current || needs.source.outputs.continuation == 'true') && fromJSON(needs.detect.outputs.hits || '{}')['tests-filemap'] }}
    uses: ./.github/workflows/ci-unit.yml
    with:
      unit: tests-filemap

  tests-instruction-contract:
    needs: [detect, source]
    if: ${{ !cancelled() && needs.detect.result == 'success' && (!fromJSON(needs.detect.outputs.hits || '{}').current || needs.source.outputs.continuation == 'true') && fromJSON(needs.detect.outputs.hits || '{}')['tests-instruction-contract'] }}
    uses: ./.github/workflows/ci-unit.yml
    with:
      unit: tests-instruction-contract

  tests-lean:
    needs: [detect, source]
    if: ${{ !cancelled() && needs.detect.result == 'success' && (!fromJSON(needs.detect.outputs.hits || '{}').current || needs.source.outputs.continuation == 'true') && fromJSON(needs.detect.outputs.hits || '{}')['tests-lean'] }}
    uses: ./.github/workflows/ci-unit.yml
    with:
