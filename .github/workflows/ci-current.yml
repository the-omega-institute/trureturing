name: CI

on:
  pull_request:
    branches: [dev, 'integration-**']
    types: [opened, synchronize, reopened]
  push:
    branches: [dev, 'integration-**']

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  checks:
    uses: the-omega-institute/trureturing-tools/.github/workflows/ci-current.yml@3178c75d57a098d042573bae760802fa8ba83bf6

  required:
    needs: checks
    if: always()
    permissions: {}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Report the required check
        env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success
