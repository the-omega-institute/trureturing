name: CI

# The one CI workflow. `detect` lists the changed paths once and decides from
# the unit patterns in Meta/ci-units.json which units the change hits; every unit is a
# job that runs only when hit, and `required` is the one required check: it is
# green when detection succeeded and every unit ran exactly when hit and passed.
# Detection validates and routes the complete changed-path list without a path-count cutoff.

on:
  pull_request:
    branches: [dev, 'integration-**']
    types: [opened, synchronize, reopened]
  push:
    branches: [dev, 'integration-**']

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    outputs:
      hits: ${{ steps.detect.outputs.hits }}
      report: ${{ steps.detect.outputs.report }}
      delta: ${{ steps.detect.outputs.delta }}
      theory: ${{ steps.detect.outputs.theory }}
    steps:
      # Commits and trees only, and only the entry scripts in the working tree.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            tools/scripts/workflow
            Meta/ci-units.json
          persist-credentials: false
      - id: entry
        name: Verify the candidate and list the changed paths
        env:
          CI_HIT_PATHS: '*'
          CI_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_PUSH_BEFORE: ${{ github.event.before }}
          CI_CHANGED_PATHS_FILE: ${{ runner.temp }}/changed-paths
        run: bash tools/scripts/workflow/ci-entry.sh
      - id: detect
        name: Decide which units the change hits
        env:
          CI_BASE: ${{ steps.entry.outputs.base }}
        run: python3 tools/scripts/workflow/ci_detect.py --contract --changed "$RUNNER_TEMP/changed-paths"

  # A phase of selected current, not another CI_UNITS entry. Native Actions
  # releases independent units after this narrow source prerequisite completes.
  source:
    needs: detect
    if: fromJSON(needs.detect.outputs.hits || '{}').current
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    outputs:
      source_status: ${{ steps.prefix.outputs.source_status }}
      continuation: ${{ steps.prefix.outputs.continuation }}
      judge_key: ${{ steps.judge_key.outputs.key }}
      compute_remaining: ${{ steps.remainder.outputs.compute_remaining }}
    env:
      CACHE_WRITES: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/heads/integration-'))) || github.event_name == 'pull_request' }}
      CI_PUSH_BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the candidate and list the changed paths
        env:
          CI_HIT_PATHS: '*'
          CI_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_PUSH_BEFORE: ${{ github.event.before }}
          CI_CHANGED_PATHS_FILE: ${{ runner.temp }}/changed-paths
        run: bash tools/scripts/workflow/ci-entry.sh
      # The judge cache key binds the resolved SDK, the build recipe and the
      # paths and blob ids of the tracked judge compile inputs listed in
      # JUDGE_INPUTS (git glob pathspecs: the project directories of the CLI
      # and its references, explicit copied/embedded runtime inputs, analyzer
      # files and inherited build configuration). It is taken before anything is
      # built; an exact hit skips the build.
      - name: Read the pinned .NET SDK version
        id: dotnet-sdk
        run: |
          version="$(jq -er '.sdk.version' global.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ steps.dotnet-sdk.outputs.version }}
          cache: true
          cache-dependency-path: |
            tools/StrataLint.Cli/packages.lock.json
            tools/StrataLint.Configuration/packages.lock.json
            tools/StrataLint.Engine/packages.lock.json
            tools/StrataLint.Engineering/packages.lock.json
            tools/StrataLint.Runtime/packages.lock.json
            tools/StrataLint.FileMap/packages.lock.json
            tools/StrataLint.Lean/packages.lock.json
            tools/StrataLint.Scribe/packages.lock.json
            tools/StrataLint.TestEvidence/packages.lock.json
            tools/Trureturing.Truth/packages.lock.json
      - id: judge_key
        env:
          JUDGE_INPUTS: |
            .editorconfig
            .globalconfig
            Directory.Build.*
            Directory.Packages.props
            NuGet.Config
            NuGet.config
            nuget.config
            global.json
            tools/Architecture/BannedSymbols*.txt
            tools/Architecture/ScribeScriptAllowlist.txt
            tools/StrataLint.Scribe/Vendor/Katex/katex.min.js
            tools/scripts/worktree/worktree_*.py
            tools/StrataLint.Cli/**/*.cs
            tools/StrataLint.Cli/*.csproj
            tools/StrataLint.Cli/packages.lock.json
            tools/StrataLint.Cli/.editorconfig
            tools/StrataLint.Cli/.globalconfig
            tools/StrataLint.Cli/Directory.Build.*
            tools/StrataLint.Cli/Directory.Packages.props
            tools/StrataLint.Configuration/**/*.cs
            tools/StrataLint.Configuration/*.csproj
            tools/StrataLint.Configuration/packages.lock.json
            tools/StrataLint.Configuration/.editorconfig
            tools/StrataLint.Configuration/.globalconfig
            tools/StrataLint.Configuration/Directory.Build.*
            tools/StrataLint.Configuration/Directory.Packages.props
            tools/StrataLint.Engineering/**/*.cs
            tools/StrataLint.Engineering/*.csproj
            tools/StrataLint.Engineering/packages.lock.json
            tools/StrataLint.Engineering/.editorconfig
            tools/StrataLint.Engineering/.globalconfig
            tools/StrataLint.Engineering/Directory.Build.*
            tools/StrataLint.Engineering/Directory.Packages.props
            tools/StrataLint.Runtime/**/*.cs
            tools/StrataLint.Runtime/*.csproj
            tools/StrataLint.Runtime/packages.lock.json
            tools/StrataLint.Runtime/.editorconfig
            tools/StrataLint.Runtime/.globalconfig
            tools/StrataLint.Runtime/Directory.Build.*
            tools/StrataLint.Runtime/Directory.Packages.props
            tools/StrataLint.Engine/**/*.cs
            tools/StrataLint.Engine/*.csproj
            tools/StrataLint.Engine/packages.lock.json
            tools/StrataLint.Engine/.editorconfig
            tools/StrataLint.Engine/.globalconfig
            tools/StrataLint.Engine/Directory.Build.*
            tools/StrataLint.Engine/Directory.Packages.props
            tools/StrataLint.FileMap/**/*.cs
            tools/StrataLint.FileMap/*.csproj
            tools/StrataLint.FileMap/packages.lock.json
            tools/StrataLint.FileMap/.editorconfig
            tools/StrataLint.FileMap/.globalconfig
            tools/StrataLint.FileMap/Directory.Build.*
            tools/StrataLint.FileMap/Directory.Packages.props
            tools/StrataLint.Lean/**/*.cs
            tools/StrataLint.Lean/*.csproj
            tools/StrataLint.Lean/packages.lock.json
            tools/StrataLint.Lean/.editorconfig
            tools/StrataLint.Lean/.globalconfig
            tools/StrataLint.Lean/Directory.Build.*
            tools/StrataLint.Lean/Directory.Packages.props
            tools/StrataLint.Scribe/**/*.cs
            tools/StrataLint.Scribe/*.csproj
            tools/StrataLint.Scribe/packages.lock.json
            tools/StrataLint.Scribe/.editorconfig
            tools/StrataLint.Scribe/.globalconfig
            tools/StrataLint.Scribe/Directory.Build.*
            tools/StrataLint.Scribe/Directory.Packages.props
            tools/StrataLint.TestEvidence/**/*.cs
            tools/StrataLint.TestEvidence/*.csproj
            tools/StrataLint.TestEvidence/packages.lock.json
            tools/StrataLint.TestEvidence/.editorconfig
            tools/StrataLint.TestEvidence/.globalconfig
            tools/StrataLint.TestEvidence/Directory.Build.*
            tools/StrataLint.TestEvidence/Directory.Packages.props
            tools/Trureturing.Truth/**/*.cs
            tools/Trureturing.Truth/*.csproj
            tools/Trureturing.Truth/packages.lock.json
            tools/Trureturing.Truth/.editorconfig
            tools/Trureturing.Truth/.globalconfig
            tools/Trureturing.Truth/Directory.Build.*
            tools/Trureturing.Truth/Directory.Packages.props
        run: |
          sdk="$(dotnet --version)"
          [[ "$sdk" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || { echo "unexpected SDK version '$sdk'" >&2; exit 2; }
          recipe="$(python3 tools/scripts/workflow/ci_checks.py judge-recipe | sha256sum | cut -c1-16)"
          specs=()
          while IFS= read -r spec; do [[ -n "$spec" ]] && specs+=(":(glob)$spec"); done <<< "$JUDGE_INPUTS"
          listing="$RUNNER_TEMP/judge-inputs"
          git ls-files -s -z -- "${specs[@]}" > "$listing"
          [[ -s "$listing" ]] || { echo "judge inputs select no tracked file" >&2; exit 2; }
          inputs="$(sha256sum < "$listing" | cut -c1-64)"
          echo "key=judge-${{ runner.os }}-${{ runner.arch }}-sdk$sdk-$recipe-$inputs" >> "$GITHUB_OUTPUT"
      - id: judge
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: |
            tools/StrataLint.Cli/bin/Release/net10.0
            tools/StrataLint.Scribe/bin/Release/net10.0
          key: ${{ steps.judge_key.outputs.key }}
      - id: compute_budget
        name: Initialize the cumulative current compute allowance
        run: |
          budget="$RUNNER_TEMP/current-compute-seconds"
          python3 tools/scripts/workflow/ci_compute.py init "$budget" 120
          echo "STRATALINT_CI_COMPUTE_BUDGET=$budget" >> "$GITHUB_ENV"
      - id: prefix
        name: Check the selected source prerequisite
        env:
          JUDGE_HIT: ${{ steps.judge.outputs.cache-hit }}
        run: python3 tools/scripts/workflow/ci_checks.py current prerequisite
      # Handoff only to a continuation that still consumes the judge.
      - if: ${{ !cancelled() && env.CACHE_WRITES == 'true' && steps.prefix.outputs.continuation == 'true' && (needs.detect.outputs.report == 'true' || steps.prefix.outputs.source_status != 'accepted') && steps.prefix.outputs.judge_ready == 'true' && steps.judge.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            tools/StrataLint.Cli/bin/Release/net10.0
            tools/StrataLint.Scribe/bin/Release/net10.0
          key: ${{ steps.judge_key.outputs.key }}
      - id: remainder
        name: Carry the remaining current compute allowance
        if: ${{ !cancelled() && steps.compute_budget.outcome == 'success' }}
        run: python3 tools/scripts/workflow/ci_compute.py export-current "$STRATALINT_CI_COMPUTE_BUDGET" >> "$GITHUB_OUTPUT"

  # Lean report, current-tree rules and Scribe checks; on pull requests also the
  # delta rules against B = first parent of the event merge commit. The report is
  # built once and consumed by both rule sets inside this one job.
  current:
    needs: [detect, source]
    if: ${{ !cancelled() && needs.detect.result == 'success' && fromJSON(needs.detect.outputs.hits || '{}').current && needs.source.outputs.continuation == 'true' }}
    runs-on: ubuntu-24.04-arm
    # Platform wall-clock cap, separate from the shared 120-minute compute allowance.
    timeout-minutes: 360
    outputs:
      lean_required: ${{ needs.detect.outputs.report }}
      unit: ${{ steps.checked.outputs.unit }}
      project_seed_available: ${{ steps.project_published.outcome == 'success' || (steps.lean_report.outcome == 'success' && steps.project_snapshot_push.outcome == 'success' && steps.project_snapshot_push.outputs.project_skip_reason == 'no-build-work' && env.STRATALINT_ACTIONS_CACHE_SEEDED == '1') }}
    env:
      # This job writes project seeds only on dev/integration pushes.
      # Dependency and elan writes also use the PR's own merge-ref scope.
      CACHE_WRITES: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/heads/integration-'))) || github.event_name == 'pull_request' }}
      REPORT: .lake/build/stratalint/raw-lean-report.json
      CLI: tools/StrataLint.Cli/bin/Release/net10.0/StrataLint.dll
      SCRIBE: tools/StrataLint.Scribe/bin/Release/net10.0/StrataLint.Scribe.dll
      # The judge build recipe: the build step runs it and the judge cache key hashes it.
      CI_PUSH_BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the candidate and list the changed paths
        env:
          CI_HIT_PATHS: '*'
          CI_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_PUSH_BEFORE: ${{ github.event.before }}
          CI_CHANGED_PATHS_FILE: ${{ runner.temp }}/changed-paths
        run: bash tools/scripts/workflow/ci-entry.sh
      # The judge cache key binds the resolved SDK, the build recipe and the
      # paths and blob ids of the tracked judge compile inputs listed in
      # JUDGE_INPUTS (git glob pathspecs: the project directories of the CLI
      # and its references, explicit copied/embedded runtime inputs, analyzer
      # files and inherited build configuration). It is taken before anything is
      # built; an exact hit skips the build.
      - name: Read the pinned .NET SDK version
        id: dotnet-sdk
        run: |
          version="$(jq -er '.sdk.version' global.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ steps.dotnet-sdk.outputs.version }}
          cache: true
          cache-dependency-path: |
            tools/StrataLint.Cli/packages.lock.json
            tools/StrataLint.Configuration/packages.lock.json
            tools/StrataLint.Engine/packages.lock.json
            tools/StrataLint.Engineering/packages.lock.json
            tools/StrataLint.Runtime/packages.lock.json
            tools/StrataLint.FileMap/packages.lock.json
            tools/StrataLint.Lean/packages.lock.json
            tools/StrataLint.Scribe/packages.lock.json
            tools/StrataLint.TestEvidence/packages.lock.json
            tools/Trureturing.Truth/packages.lock.json
      - id: judge
        if: needs.detect.outputs.report == 'true' || needs.source.outputs.source_status != 'accepted'
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: |
            tools/StrataLint.Cli/bin/Release/net10.0
            tools/StrataLint.Scribe/bin/Release/net10.0
          key: ${{ needs.source.outputs.judge_key }}
      - id: prepared
        name: Adopt a matching PR preparation for this event
        if: needs.detect.outputs.report == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/scripts/worktree/lean_pr_cache.py adopt --repository "$GITHUB_WORKSPACE"
      - id: keys
        if: needs.detect.outputs.report == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/scripts/worktree/lean_actions.py keys --repository "$GITHUB_WORKSPACE"
      - id: elan
        if: steps.keys.outputs.elan_key != ''
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ~/.elan
          key: ${{ steps.keys.outputs.elan_key }}
      - id: toolchain
        if: needs.detect.outputs.report == 'true'
        run: tools/scripts/workflow/install-lean-toolchain.sh lean-toolchain --github-path "$GITHUB_PATH"
      - id: dependency
        if: steps.prepared.outputs.adopted != 'true' && steps.keys.outputs.dependency_key != ''
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.keys.outputs.dependency_archive_path }}
          key: ${{ steps.keys.outputs.dependency_key }}
          restore-keys: ${{ steps.keys.outputs.dependency_restore_prefix }}
      - id: project
        if: steps.prepared.outputs.adopted != 'true' && steps.keys.outputs.project_key != ''
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.keys.outputs.project_archive_path }}
          key: ${{ steps.keys.outputs.project_restore_key }}
          restore-keys: ${{ steps.keys.outputs.project_restore_prefix }}
      - id: lean_seeds
        if: needs.detect.outputs.report == 'true'
        name: Restore optional Lean build seeds
        env:
          DEPENDENCY_KEY: ${{ steps.dependency.outputs.cache-matched-key }}
          PROJECT_KEY: ${{ steps.project.outputs.cache-matched-key }}
          PROJECT_RESTORE_KEY: ${{ steps.keys.outputs.project_restore_key }}
          DEPENDENCY_OUTCOME: ${{ steps.dependency.outcome }}
          PROJECT_OUTCOME: ${{ steps.project.outcome }}
        run: python3 tools/scripts/worktree/lean_actions.py restore --repository "$GITHUB_WORKSPACE" --dependency-key "$DEPENDENCY_KEY" --project-key "$PROJECT_KEY" --project-restore-key "$PROJECT_RESTORE_KEY" --dependency-outcome "$DEPENDENCY_OUTCOME" --project-outcome "$PROJECT_OUTCOME"
      - id: compute_budget
        name: Resume the cumulative current compute allowance
        env:
          COMPUTE_REMAINING: ${{ needs.source.outputs.compute_remaining }}
        run: |
          budget="$RUNNER_TEMP/current-compute-seconds"
          python3 tools/scripts/workflow/ci_compute.py resume-current "$budget" "$COMPUTE_REMAINING"
          echo "STRATALINT_CI_COMPUTE_BUDGET=$budget" >> "$GITHUB_ENV"
      - id: current_prepare
        name: Prepare judge and selected test dependencies
        if: needs.detect.outputs.report == 'true' || needs.source.outputs.source_status != 'accepted'
        env:
          JUDGE_HIT: ${{ steps.judge.outputs.cache-hit }}
        run: python3 tools/scripts/workflow/ci_checks.py current prepare
      - id: build_judge
        name: Build the judge
        if: ${{ !cancelled() && (needs.detect.outputs.report == 'true' || needs.source.outputs.source_status != 'accepted') && steps.compute_budget.outcome == 'success' && steps.judge.outputs.cache-hit != 'true' }}
        run: python3 tools/scripts/workflow/ci_checks.py current build-judge
      - name: Theory-only file and capacity checks
        if: needs.detect.outputs.report == 'false' && needs.source.outputs.source_status != 'accepted'
        env:
          CI_PUSH_BEFORE: ${{ github.event.before }}
        run: python3 tools/scripts/workflow/ci_checks.py current check-delta
      - id: lean_report
        name: Build the Lean report
        if: ${{ !cancelled() && steps.lean_seeds.outcome == 'success' && steps.compute_budget.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          # This supervisor also encloses preparation; compute phases share the file above.
          STRATALINT_BUILD_TIMEOUT_SECONDS: '21600'
          STRATALINT_FIB_REGRESSIONS_SELECTED: ${{ fromJSON(needs.detect.outputs.hits || '{}')['tests-fib'] }}
        run: |
          rc=0
          python3 tools/scripts/workflow/ci_checks.py current lean-report || rc=$?
          if [[ "$rc" != 0 ]]; then
            echo "::error title=Lean report failed::Inspect the preceding error. A missing compatible native seed requires the independent lean-cache-produce long job; wait for its successful exact-head production and retry."
          fi
          exit "$rc"
      - name: Verify production source binding artifacts
        if: ${{ !cancelled() && needs.detect.outputs.report == 'true' && steps.lean_report.outcome == 'success' && (steps.judge.outputs.cache-hit == 'true' || steps.build_judge.outcome == 'success') && steps.current_prepare.outcome == 'success' && fromJSON(needs.detect.outputs.hits || '{}')['tests-declared-template'] }}
        env:
          CI_DOTNET_PREPARED: '1'
          FOURIER_BRIDGE_SOURCE_ARTIFACTS: ${{ github.workspace }}/.lake/build/lean-inspector/modules
        run: python3 tools/scripts/workflow/ci_checks.py current source-evidence
      - name: Scribe content
        if: ${{ !cancelled() && needs.detect.outputs.report == 'true' && steps.lean_report.outcome == 'success' && (steps.judge.outputs.cache-hit == 'true' || steps.build_judge.outcome == 'success') }}
        run: python3 tools/scripts/workflow/ci_checks.py current scribe
      - name: Current-tree rules
        if: ${{ !cancelled() && needs.detect.outputs.report == 'true' && steps.lean_report.outcome == 'success' && (steps.judge.outputs.cache-hit == 'true' || steps.build_judge.outcome == 'success') }}
        run: python3 tools/scripts/workflow/ci_checks.py current check-current
      - name: Delta rules
        if: ${{ !cancelled() && needs.detect.outputs.report == 'true' && needs.detect.outputs.delta == 'true' && steps.lean_report.outcome == 'success' && (steps.judge.outputs.cache-hit == 'true' || steps.build_judge.outcome == 'success') }}
        run: python3 tools/scripts/workflow/ci_checks.py current check-delta
      - name: Run the compiled audit checks
        if: ${{ !cancelled() && needs.detect.outputs.report == 'true' && steps.lean_report.outcome == 'success' && (steps.judge.outputs.cache-hit == 'true' || steps.build_judge.outcome == 'success') && fromJSON(needs.detect.outputs.hits || '{}')['tests-lean'] }}
        run: python3 tools/scripts/workflow/ci_checks.py current compiled-audit
      # A successful judge build can be published after ready diagnostics,
      # independently of their verdicts or report validity.
      - if: ${{ !cancelled() && steps.build_judge.outcome == 'success' && env.CACHE_WRITES == 'true' && steps.judge.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            tools/StrataLint.Cli/bin/Release/net10.0
            tools/StrataLint.Scribe/bin/Release/net10.0
          key: ${{ needs.source.outputs.judge_key }}
      - id: project_snapshot_push
        name: Prepare the project seed
        if: ${{ !cancelled() && env.CACHE_WRITES == 'true' && steps.lean_report.outcome == 'success' }}
        continue-on-error: true
        env:
          STRATALINT_CACHE_WRITES: ${{ env.CACHE_WRITES }}
          STRATALINT_REPORT_SUCCEEDED: 'true'
        run: python3 tools/scripts/worktree/lean_actions.py snapshot --repository "$GITHUB_WORKSPACE" --layers project
      - id: project_save
        name: Publish the push project seed
        if: ${{ !cancelled() && steps.project_snapshot_push.outcome == 'success' && steps.project_snapshot_push.outputs.project_ready == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.keys.outputs.project_archive_path }}
          key: ${{ steps.keys.outputs.project_key }}
      - id: project_published
        name: Confirm the push seed is available to automatic production
        if: ${{ !cancelled() && github.event_name == 'push' && steps.project_snapshot_push.outputs.project_ready == 'true' && steps.project_save.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: ${{ steps.keys.outputs.project_key }}
        run: |
          saved="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/caches" -f key="$CACHE_KEY" -f ref="$GITHUB_REF")"
          jq -e --arg key "$CACHE_KEY" --arg ref "$GITHUB_REF" \
            'any(.actions_caches[]; .key == $key and .ref == $ref)' <<< "$saved" >/dev/null
      # Dependency and elan caches follow successful checks.
      - id: snapshot
        if: ${{ success() && needs.detect.outputs.report == 'true' && env.CACHE_WRITES == 'true' }}
        continue-on-error: true
        env:
          STRATALINT_CACHE_WRITES: ${{ env.CACHE_WRITES }}
          STRATALINT_CHECK_SUCCEEDED: 'true'
        run: python3 tools/scripts/worktree/lean_actions.py snapshot --repository "$GITHUB_WORKSPACE" --layers dependency
      - if: ${{ success() && steps.snapshot.outcome == 'success' && steps.snapshot.outputs.dependency_ready == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.keys.outputs.dependency_archive_path }}
          key: ${{ steps.keys.outputs.dependency_key }}
      - name: List toolchains in the elan cache
        if: ${{ success() && env.CACHE_WRITES == 'true' && steps.toolchain.outcome == 'success' }}
        continue-on-error: true
        run: bash tools/scripts/workflow/elan-cache-inventory.sh "$HOME/.elan"
      - if: ${{ success() && env.CACHE_WRITES == 'true' && steps.toolchain.outcome == 'success' && steps.elan.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ~/.elan
          key: ${{ steps.keys.outputs.elan_key }}

      - id: checked
        name: Confirm selected current checks succeeded
        run: echo 'unit=current' >> "$GITHUB_OUTPUT"

  # Reuse a validated seed when no build work occurred, or publish the increment.
  # Missing usable seeds still get the long producer outside required checks.
  cache-producer:
    name: Produce the protected push Lean cache
    needs: current
