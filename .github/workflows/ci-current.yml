  tests-script:
    needs: [detect, source]
    if: ${{ !cancelled() && needs.detect.result == 'success' && (!fromJSON(needs.detect.outputs.hits || '{}').current || needs.source.outputs.continuation == 'true') && fromJSON(needs.detect.outputs.hits || '{}')['tests-script'] }}
    uses: ./.github/workflows/ci-unit.yml
    with:
      unit: tests-script


  tests-truth-release:
    needs: [detect, source]
    if: ${{ !cancelled() && needs.detect.result == 'success' && (!fromJSON(needs.detect.outputs.hits || '{}').current || needs.source.outputs.continuation == 'true') && fromJSON(needs.detect.outputs.hits || '{}')['tests-truth-release'] }}
    uses: ./.github/workflows/ci-unit.yml
    with:
      unit: tests-truth-release

  tests-workflow-script:
    needs: [detect, source]
    if: ${{ !cancelled() && needs.detect.result == 'success' && (!fromJSON(needs.detect.outputs.hits || '{}').current || needs.source.outputs.continuation == 'true') && fromJSON(needs.detect.outputs.hits || '{}')['tests-workflow-script'] }}
    uses: ./.github/workflows/ci-unit.yml
    with:
      unit: tests-workflow-script

  tests-worktree-contract:
    needs: [detect, source]
    if: ${{ !cancelled() && needs.detect.result == 'success' && (!fromJSON(needs.detect.outputs.hits || '{}').current || needs.source.outputs.continuation == 'true') && fromJSON(needs.detect.outputs.hits || '{}')['tests-worktree-contract'] }}
    uses: ./.github/workflows/ci-unit.yml
    with:
      unit: tests-worktree-contract

  # The one required check. It always runs, so a failed or cancelled unit, or a
  # failed detection, is red rather than skipped.
  required:
    if: always()
    needs: [detect, source, banned-api-proof, capability-proof, current, filemap, selftest, tests-architecture, tests-cache, tests-cache-native, tests-cache-release, tests-ci-entry, tests-cli, tests-declared-template, tests-engine, tests-filemap, tests-instruction-contract, tests-lean, tests-lean-cache-script, tests-playbook-script, tests-pr-script, tests-repository-configuration, tests-repository-contract, tests-repository-filemap, tests-repository-topology, tests-scribe, tests-script, tests-truth-release, tests-workflow-script, tests-worktree-contract]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/install-tools.py
            /Meta/tools-release.json
            /Meta/ci-units.json
          persist-credentials: false
      - name: Install the pinned tools release
        run: python3 .github/scripts/install-tools.py
      - env:
          NEEDS: ${{ toJSON(needs) }}
          HITS: ${{ needs.detect.outputs.hits }}
        run: python3 tools/scripts/workflow/ci_required.py
