  tests-lean-cache-script:
    needs: [detect, source]
    if: ${{ !cancelled() && needs.detect.result == 'success' && (!fromJSON(needs.detect.outputs.hits || '{}').current || needs.source.outputs.continuation == 'true') && fromJSON(needs.detect.outputs.hits || '{}')['tests-lean-cache-script'] }}
    uses: ./.github/workflows/ci-unit.yml
    with:
