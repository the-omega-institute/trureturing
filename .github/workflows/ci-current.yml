name: CI

# The one CI workflow. `detect` lists the changed paths once and decides from
# the unit patterns written below which units the change hits; every unit is a
# job that runs only when hit, and `required` is the one required check: it is
# green when detection succeeded and every unit ran exactly when hit and passed.
# A change of more than 3000 paths fails detection and must be split.

on:
  pull_request:
    branches: [dev, 'integration-**']
    types: [opened, synchronize, reopened]
  push:
    branches: [dev, 'integration-**']

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    outputs:
      hits: ${{ steps.detect.outputs.hits }}
    steps:
      # Commits and trees only, and only the entry scripts in the working tree.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: tools/scripts/workflow
          persist-credentials: false
      - name: Verify the candidate and list the changed paths
        env:
          CI_HIT_PATHS: '*'
          CI_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_PUSH_BEFORE: ${{ github.event.before }}
          CI_CHANGED_PATHS_FILE: ${{ runner.temp }}/changed-paths
        run: bash tools/scripts/workflow/ci-entry.sh
      - id: detect
        name: Decide which units the change hits
        env:
          # One section per unit job below, named by its job id; [*] applies to
          # every unit. `*` also matches `/`, `?` matches one character and a
          # leading `!` excludes a path from that unit.
          CI_UNITS: |
            # Shared: patterns of every unit.
            [*]
            */.editorconfig
            */.globalconfig
            */Directory.Build.*
            */Directory.Packages.props
            */NuGet.Config
            */NuGet.config
            */global.json
            */nuget.config
            .editorconfig
            .github/*
            .gitignore
            .globalconfig
            Directory.Build.*
            Directory.Packages.props
            Golden/gate-authority-roots.toml
            Makefile
            Meta/Digestion/atomizers.toml
