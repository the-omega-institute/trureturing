name: CI current

# Lean report, current-tree rules and Scribe checks; on pull requests also the
# delta rules against B = first parent of the event merge commit. The report is
# built once and consumed by both rule sets inside this one job.

on:
  pull_request:
    branches: [dev, 'integration-**']
    types: [opened, synchronize, reopened]
  push:
    branches: [dev, 'integration-**']

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-current-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # This workflow is the only writer of the Lean dependency, project and elan
  # caches: dev/integration pushes and the PR's own merge-ref scope.
  CACHE_WRITES: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/heads/integration-'))) || github.event_name == 'pull_request' }}
  REPORT: .lake/build/stratalint/raw-lean-report.json
  CLI: tools/StrataLint.Cli/bin/Release/net10.0/StrataLint.dll
  SCRIBE: tools/StrataLint.Scribe.Documents/bin/Release/net10.0/StrataLint.Scribe.Documents.dll
  # The judge build recipe: the build step runs it and the judge cache key hashes it.
  JUDGE_BUILD_ARGS: tools/StrataLint.Cli/StrataLint.Cli.csproj --configuration Release -p:RestoreLockedMode=true -nologo

jobs:
  current:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - id: current_unit
        name: Resolve current inputs
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: python3 tools/scripts/workflow/ci_units.py resolve current --paths-file "$RUNNER_TEMP/current-hit-paths" --workflow-ref "$WORKFLOW_REF" >> "$GITHUB_OUTPUT"
      - id: entry
        name: Check current inputs
        env:
          CI_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_PUSH_BEFORE: ${{ github.event.before }}
          CI_CHANGED_PATHS_FILE: ${{ runner.temp }}/changed-paths
          CI_HIT_PATHS_FILE: ${{ runner.temp }}/current-hit-paths
        run: bash tools/scripts/workflow/ci-entry.sh
      - id: delta_unit
        name: Resolve delta inputs
        if: github.event_name == 'pull_request' && steps.entry.outputs.hit == 'true'
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: python3 tools/scripts/workflow/ci_units.py resolve delta --paths-file "$RUNNER_TEMP/delta-hit-paths" --workflow-ref "$WORKFLOW_REF" >> "$GITHUB_OUTPUT"
      - id: delta_entry
        name: Check delta inputs
        if: github.event_name == 'pull_request' && steps.entry.outputs.hit == 'true'
        env:
          CI_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_HIT_PATHS_FILE: ${{ runner.temp }}/delta-hit-paths
        run: bash tools/scripts/workflow/ci-entry.sh
      - name: Validate entry results
        env:
          HIT: ${{ steps.entry.outputs.hit }}
          DELTA_OUTCOME: ${{ steps.delta_entry.outcome }}
          DELTA_HIT: ${{ steps.delta_entry.outputs.hit }}
        run: |
          case "$HIT" in true|false) ;; *) echo "CI_ENTRY_ERROR hit output is '$HIT'" >&2; exit 2 ;; esac
          if [[ "$DELTA_OUTCOME" == success ]]; then
            case "$DELTA_HIT" in true|false) ;; *) echo "CI_ENTRY_ERROR delta hit output is '$DELTA_HIT'" >&2; exit 2 ;; esac
          fi
      # The judge cache key binds the resolved SDK, the build recipe and the
      # registered compile inputs of the judge (`ci_units.py fingerprint judge`:
      # the project's registered closure, Blueprint definitions included, plus the
      # analyzer files, embedded resources and root build configuration listed in
      # Meta/ci-units.json). It is taken before anything is built; an exact hit
      # skips the build.
      - if: steps.entry.outputs.hit == 'true'
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - id: judge_key
        if: steps.entry.outputs.hit == 'true'
        run: |
          sdk="$(dotnet --version)"
          [[ "$sdk" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || { echo "unexpected SDK version '$sdk'" >&2; exit 2; }
          recipe="$(printf '%s' "$JUDGE_BUILD_ARGS" | sha256sum | cut -c1-16)"
          inputs="$(python3 tools/scripts/workflow/ci_units.py fingerprint judge)"
          [[ "$inputs" =~ ^[0-9a-f]{64}$ ]] || { echo "unexpected judge fingerprint '$inputs'" >&2; exit 2; }
          echo "key=judge-${{ runner.os }}-${{ runner.arch }}-sdk$sdk-$recipe-$inputs" >> "$GITHUB_OUTPUT"
      - id: judge
        if: steps.entry.outputs.hit == 'true'
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: |
            tools/StrataLint.Cli/bin/Release/net10.0
            tools/StrataLint.Scribe.Documents/bin/Release/net10.0
          key: ${{ steps.judge_key.outputs.key }}
      - id: keys
        if: steps.entry.outputs.hit == 'true'
        run: python3 tools/scripts/worktree/lean_actions.py keys --repository "$GITHUB_WORKSPACE"
      - id: elan
        if: steps.entry.outputs.hit == 'true' && steps.keys.outputs.elan_key != ''
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ~/.elan
          key: ${{ steps.keys.outputs.elan_key }}
      - id: toolchain
        if: steps.entry.outputs.hit == 'true'
        run: tools/scripts/workflow/install-lean-toolchain.sh lean-toolchain --github-path "$GITHUB_PATH"
      - id: dependency
        if: steps.entry.outputs.hit == 'true' && steps.keys.outputs.dependency_key != ''
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.keys.outputs.dependency_archive_path }}
          key: ${{ steps.keys.outputs.dependency_key }}
          restore-keys: ${{ steps.keys.outputs.dependency_restore_prefix }}
      - id: project
        if: steps.entry.outputs.hit == 'true' && steps.keys.outputs.project_key != ''
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.keys.outputs.project_archive_path }}
          key: ${{ steps.keys.outputs.project_key }}
          restore-keys: ${{ steps.keys.outputs.project_restore_prefix }}
      - name: Restore optional Lean build seeds
        if: steps.entry.outputs.hit == 'true'
        env:
          DEPENDENCY_KEY: ${{ steps.dependency.outputs.cache-matched-key }}
          PROJECT_KEY: ${{ steps.project.outputs.cache-matched-key }}
          DEPENDENCY_OUTCOME: ${{ steps.dependency.outcome }}
          PROJECT_OUTCOME: ${{ steps.project.outcome }}
        run: python3 tools/scripts/worktree/lean_actions.py restore --repository "$GITHUB_WORKSPACE" --dependency-key "$DEPENDENCY_KEY" --project-key "$PROJECT_KEY" --dependency-outcome "$DEPENDENCY_OUTCOME" --project-outcome "$PROJECT_OUTCOME"
      - name: Build the Lean report
        if: steps.entry.outputs.hit == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          STRATALINT_ACCEPT_COLD_BUILD: '1'
        run: make lean-report
      - name: Build the judge
        if: steps.entry.outputs.hit == 'true' && steps.judge.outputs.cache-hit != 'true'
        run: dotnet build $JUDGE_BUILD_ARGS
      # The judge outputs are a function of the keyed sources, so they are saved
      # as soon as the build succeeds.
      - if: ${{ success() && steps.entry.outputs.hit == 'true' && env.CACHE_WRITES == 'true' && steps.judge.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            tools/StrataLint.Cli/bin/Release/net10.0
            tools/StrataLint.Scribe.Documents/bin/Release/net10.0
          key: ${{ steps.judge_key.outputs.key }}
      - name: Current-tree rules
        if: steps.entry.outputs.hit == 'true'
        run: dotnet "$CLI" check-current --candidate-lean-report "$REPORT"
      - name: Scribe content
        if: ${{ !cancelled() && steps.entry.outputs.hit == 'true' }}
        env:
          CHANGED_PATHS: ${{ runner.temp }}/changed-paths
        # Markdown formulas are judged for the documents this change touches;
        # without a base commit the entry writes no path list and every document
        # is judged.
        run: |
          if [[ -f "$CHANGED_PATHS" ]]; then
            tools/scripts/workflow/scribe-content-checks.sh "$REPORT" "$SCRIBE" "$CHANGED_PATHS"
          else
            tools/scripts/workflow/scribe-content-checks.sh "$REPORT"
          fi
      - name: Delta rules
        if: ${{ !cancelled() && steps.delta_entry.outputs.hit == 'true' }}
        run: |
          rc=0
          dotnet "$CLI" check-delta --protected-base "$(git rev-parse HEAD^1)" --candidate-lean-report "$REPORT" || rc=$?
          # Exit 3: protected-surface change (SL-022) with every content check passed.
          if [ "$rc" -eq 3 ]; then echo "::notice title=SL-022::protected surface change; content checks passed"; exit 0; fi
          exit "$rc"
      # Caches are written only after every check above succeeded; the snapshot
      # program decides per layer whether the archive is ready to publish.
      - id: snapshot
        if: ${{ success() && steps.entry.outputs.hit == 'true' && env.CACHE_WRITES == 'true' }}
        continue-on-error: true
        env:
          STRATALINT_CACHE_WRITES: ${{ env.CACHE_WRITES }}
          STRATALINT_CHECK_SUCCEEDED: 'true'
        run: python3 tools/scripts/worktree/lean_actions.py snapshot --repository "$GITHUB_WORKSPACE"
      - if: ${{ success() && steps.snapshot.outcome == 'success' && steps.snapshot.outputs.project_ready == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.keys.outputs.project_archive_path }}
          key: ${{ steps.keys.outputs.project_key }}
      - if: ${{ success() && steps.snapshot.outcome == 'success' && steps.snapshot.outputs.dependency_ready == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.keys.outputs.dependency_archive_path }}
          key: ${{ steps.keys.outputs.dependency_key }}
      - if: ${{ success() && steps.entry.outputs.hit == 'true' && env.CACHE_WRITES == 'true' && steps.toolchain.outcome == 'success' && steps.elan.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ~/.elan
          key: ${{ steps.keys.outputs.elan_key }}
