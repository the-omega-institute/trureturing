name: CI capability-proof

on:
  pull_request:
    branches: [dev, 'integration-**']
    types: [opened, synchronize, reopened]
  push:
    branches: [dev, 'integration-**']

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-capability-proof-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  capability-proof:
    uses: ./.github/workflows/ci-unit.yml
    with:
      unit: capability-proof
      command: make -C tools compile-proof PROOF=capability-proof
