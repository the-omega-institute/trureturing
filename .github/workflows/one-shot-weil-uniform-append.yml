name: One-shot uniform Weil source reconciliation
on:
  push:
    branches:
      - lane/math/rh-canonical-zero-data-nonvacuity-20260903
    paths:
      - .github/workflows/one-shot-weil-uniform-append.yml
permissions:
  contents: write
concurrency:
  group: one-shot-weil-uniform-append-5065
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.repository == 'the-omega-institute/trureturing' && github.ref == 'refs/heads/lane/math/rh-canonical-zero-data-nonvacuity-20260903'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Reconcile proof sources and append theory preserving its existing bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/one-shot-weil-uniform-append.py
          branch='lane/math/rh-canonical-zero-data-nonvacuity-20260903'
          git fetch origin "$branch"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" || { echo 'Concurrent branch change; refusing to overwrite'; exit 1; }
          git add D5/S3/Weil/ZetaBridge/OffLineNonrealZeroNegativeWeilSquare.lean D5/S3/Weil/ZetaBridge/FiniteEvenWeilOddInterpolation.lean D5/S3/Weil/ZetaBridge/MultiOrbitBurnolUniformRemainder.lean docs/develop/theory/RH_RESEARCH_LANE_THEORY.md .github/workflows/one-shot-weil-uniform-append.yml .github/scripts/one-shot-weil-uniform-append.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'formalize: reconcile uniform Weil proof sources and append preserved theory'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD
