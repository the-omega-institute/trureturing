name: validate-chronological-tensor-hopf

on:
  push:
    branches:
      - lane/math/chronological-tensor-hopf
    paths:
      - 'D5/S3/Observer/Chronology/**'
      - 'Blueprint/D5/S3/Observer/Chronology/**'
      - '.github/workflows/validate-chronological-tensor-hopf.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: lane/math/chronological-tensor-hopf

      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"

      - name: Compile chronological tensor tranche
        id: compile
        shell: bash
        run: |
          set +e
          mkdir -p tmp/chronological-tensor-validation
          lake build \
            D5.S3.Observer.Chronology.TruncatedTensorSignature \
            D5.S3.Observer.Chronology.TruncatedTensorHopf \
            D5.S3.Observer.Chronology.PrimitiveMagnusLog \
            D5.S3.Observer.Chronology.StepTwoFreeLieBridge \
            > tmp/chronological-tensor-validation/lean.log 2>&1
          status=$?
          printf '%s\n' "$status" > tmp/chronological-tensor-validation/status
          cat tmp/chronological-tensor-validation/lean.log
          exit 0

      - name: Build Scribe with warnings as errors
        shell: bash
        run: |
          set +e
          dotnet build tools/StrataLint.Scribe/StrataLint.Scribe.csproj \
            --configuration Release \
            -warnaserror \
            > tmp/chronological-tensor-validation/scribe.log 2>&1
          status=$?
          printf '%s\n' "$status" > tmp/chronological-tensor-validation/scribe-status
          cat tmp/chronological-tensor-validation/scribe.log
          exit 0

      - name: Publish exact diagnostics to validation branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AlyciaBHZ'
          git config user.email '50111876+AlyciaBHZ@users.noreply.github.com'
          git add -f tmp/chronological-tensor-validation/lean.log \
            tmp/chronological-tensor-validation/status \
            tmp/chronological-tensor-validation/scribe.log \
            tmp/chronological-tensor-validation/scribe-status
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'ci: record chronological tensor validation'
          git push origin HEAD:refs/heads/tmp/chronological-tensor-validation --force

      - name: Enforce validation result
        shell: bash
        run: |
          test "$(cat tmp/chronological-tensor-validation/status)" = 0
          test "$(cat tmp/chronological-tensor-validation/scribe-status)" = 0
