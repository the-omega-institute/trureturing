name: Agent append C-IRPT section 40

on:
  push:
    branches:
      - agent/tmp-constructive-irpt-append-20260817

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify payload, append section 40, and self-clean
        shell: bash
        run: |
          set -euo pipefail

          target='docs/develop/theory/QUANTITATIVE_DIAGONALIZATION_OBSERVER_COMPLETION.md'
          payload_dir='.agent_tmp/cirpt_section40'
          workflow='.github/workflows/agent-append-cirpt-section40.yml'
          expected_b64_sha='83352a2754092eb50db1cf016c1c0365d24ba09ea2a0d8e86930f7d028f8fb30'
          expected_md_sha='7b0f19431c724b55e69f2a19f7d656286ec48c1f869f97eb5572b9913b5d5427'

          parts=(
            "$payload_dir/part_00.b64"
            "$payload_dir/part_01.b64"
            "$payload_dir/part_02.b64"
            "$payload_dir/part_03.b64"
            "$payload_dir/part_04.b64"
            "$payload_dir/part_05.b64"
            "$payload_dir/part_06.b64"
          )

          test -f "$target"
          test -f "$workflow"
          for p in "${parts[@]}"; do test -f "$p"; done

          printf '%s  %s\n' 'd9c503369cb5ac824e868760f8d127bdb7d6b63306e157d3e6e6a683650461e4' "${parts[0]}" | sha256sum -c -
          printf '%s  %s\n' 'ae8ec1bc70ca15798ea1d913095891786b778149f9e01e84ac24d5b20a579d97' "${parts[1]}" | sha256sum -c -
          printf '%s  %s\n' 'b147d8791ed3f6e773a7e8130f75fde56bdd5a0d1760d9f98954090a94e880ee' "${parts[2]}" | sha256sum -c -
          printf '%s  %s\n' 'fa8811ac66e059ed1994397e566808e0f98c78e65e27ecef4d4a0cffce22ef69' "${parts[3]}" | sha256sum -c -
          printf '%s  %s\n' 'bc95bf50c09a7fdfce8178b066b09f500a725249452e2541fe94582a4e263c35' "${parts[4]}" | sha256sum -c -
          printf '%s  %s\n' 'c9f15a45a6e10ad34d723c2410255643a195875a8023240f6b71c6af29c3778a' "${parts[5]}" | sha256sum -c -
          printf '%s  %s\n' '256c2d92a68b26a297a3c0711db35a3d58f377f0e2240c79cab75f227d200759' "${parts[6]}" | sha256sum -c -

          cat "${parts[@]}" > /tmp/cirpt_section40.b64
          test "$(wc -c < /tmp/cirpt_section40.b64)" -eq 24388
          printf '%s  %s\n' "$expected_b64_sha" /tmp/cirpt_section40.b64 | sha256sum -c -

          base64 --decode /tmp/cirpt_section40.b64 > /tmp/cirpt_section40.md.gz
          gzip -dc /tmp/cirpt_section40.md.gz > /tmp/cirpt_section40.md
          printf '%s  %s\n' "$expected_md_sha" /tmp/cirpt_section40.md | sha256sum -c -

          old_sha="$(sha256sum "$target" | awk '{print $1}')"
          old_bytes="$(wc -c < "$target")"
          old_lines="$(wc -l < "$target")"

          test "$(grep -c '^# 40\. 追加：构造性无领域公理的界面—余量过程论$' "$target" || true)" -eq 0

          python3 - "$target" /tmp/cirpt_section40.md "$old_sha" "$old_bytes" <<'PY'
          import hashlib
          import pathlib
          import sys

          target = pathlib.Path(sys.argv[1])
          appendix = pathlib.Path(sys.argv[2]).read_bytes()
          expected_old_sha = sys.argv[3]
          expected_old_bytes = int(sys.argv[4])

          old = target.read_bytes()
          assert len(old) == expected_old_bytes
          assert hashlib.sha256(old).hexdigest() == expected_old_sha

          if old.endswith(b"\n\n"):
              separator = b""
          elif old.endswith(b"\n"):
              separator = b"\n"
          else:
              separator = b"\n\n"

          new = old + separator + appendix
          heading = "# 40. 追加：构造性无领域公理的界面—余量过程论".encode()
          assert new[:len(old)] == old
          assert new.count(heading) == 1
          assert new.count(b"## 40.87 ") == 1

          target.write_bytes(new)
          reread = target.read_bytes()
          assert reread[:len(old)] == old
          assert len(reread) > len(old)

          print(f"old_sha={expected_old_sha}")
          print(f"old_bytes={len(old)}")
          print(f"new_bytes={len(reread)}")
          print(f"appended_bytes={len(reread)-len(old)}")
          print(f"new_sha={hashlib.sha256(reread).hexdigest()}")
          PY

          git diff --check
          numstat="$(git diff --numstat -- "$target")"
          additions="$(printf '%s\n' "$numstat" | awk '{print $1}')"
          deletions="$(printf '%s\n' "$numstat" | awk '{print $2}')"
          test -n "$additions"
          test "$deletions" = '0'

          new_lines="$(wc -l < "$target")"
          printf 'old_lines=%s\nnew_lines=%s\nadditions=%s\ndeletions=%s\n' \
            "$old_lines" "$new_lines" "$additions" "$deletions"

          rm -rf .agent_tmp
          rm -f "$workflow"

          git config user.name 'the-omega-institute-agent'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'docs(theory): append constructive definition-only IRPT'
          git push origin HEAD
