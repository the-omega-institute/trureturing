name: auto-update-branch

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-update-branch-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update-branches:
    name: Update auto-merge branches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Update behind auto-merge pull requests
        shell: bash
        run: |
          set -euo pipefail
          IFS=/ read -r owner repository <<< "$GITHUB_REPOSITORY"

          pages="$(
            gh api graphql --paginate --slurp \
              -F owner="$owner" \
              -F name="$repository" \
              -f query='query($owner: String!, $name: String!, $endCursor: String) {
                repository(owner: $owner, name: $name) {
                  pullRequests(
                    first: 100
                    after: $endCursor
                    states: OPEN
                    baseRefName: "dev"
                  ) {
                    nodes {
                      number
                      headRefOid
                      mergeable
                      mergeStateStatus
                      autoMergeRequest { enabledAt }
                    }
                    pageInfo { hasNextPage endCursor }
                  }
                }
              }'
          )"
          candidates="$(
            jq -r '.[]
              | .data.repository.pullRequests.nodes[]
              | select(
                  .autoMergeRequest != null
                  and .mergeable == "MERGEABLE"
                  and .mergeStateStatus == "BEHIND"
                )
              | [.number, .headRefOid]
              | @tsv' <<< "$pages"
          )"

          if [[ -z "$candidates" ]]; then
            echo "No behind auto-merge pull requests."
            exit 0
          fi

          failed=0
          while IFS=$'\t' read -r number head_sha; do
            if output="$(
              gh api \
                --method PUT \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "repos/$GITHUB_REPOSITORY/pulls/$number/update-branch" \
                -f expected_head_sha="$head_sha" 2>&1
            )"; then
              message="$(jq -r '.message // "update accepted"' <<< "$output")"
              printf 'PR #%s update-branch: accepted (%s)\n' "$number" "$message"
            elif [[ "$output" == *"(HTTP 422)"* ]] \
              && grep -Eiq 'already (up[- ]to[- ]date|up to date)|not behind' <<< "$output"; then
              printf 'PR #%s update-branch: already up to date (HTTP 422)\n' "$number"
            else
              detail="$(tr '\n' ' ' <<< "$output")"
              printf 'PR #%s update-branch: failed (%s)\n' "$number" "$detail"
              failed=1
            fi
          done <<< "$candidates"

          exit "$failed"
