name: Verify a published Lean module shard

on:
  workflow_call:
    inputs:
      source:
        required: true
        type: string
      exact:
        description: Require artifacts from the exact source
        type: boolean
        default: false
      staged:
        description: Verify the unpublished candidate of this kind
        type: boolean
        default: false
      kind:
        description: Compiler or report publication to verify
        type: string
        default: ''

permissions: {}

jobs:
  recover:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      STRATALINT_CACHE_WRITES: 'false'
      CACHE_SCOPE: D5.S3.Quantum.AURICOmega.RationalBlochTetrahedron
      IMPORT_SCOPE: D5.S3.VertexAlgebra.TwistedGround.BinaryGauss
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source }}
          fetch-depth: 2
          persist-credentials: false
      - name: Install the pinned tools release
        run: python3 .github/scripts/install-tools.py
      - id: entry
        if: ${{ !inputs.exact }}
        name: Validate source and select cache transport changes
        env:
          CI_HIT_PATHS: |
            .github/actions/lean-cache-shards/*
            .github/workflows/cache-release-publish.yml
            .github/workflows/report-release-publish.yml
            .github/workflows/ci-lean-generation-compile.yml
            .github/workflows/ci-lean-module-publication.yml
            .github/workflows/ci-publication-verify.yml
            .github/workflows/ci-lean-module-verify.yml
            .github/scripts/install-tools.py
            Meta/tools-release.json
          CI_PUSH_BEFORE: ${{ github.event.before }}
          CI_PUSH_RANGE: optional
        run: bash tools/scripts/workflow/ci-entry.sh
      - if: steps.entry.outputs.hit == 'true'
        name: Check read-only cache requests on hits and misses
        run: node --test .github/actions/lean-cache-shards/test-generation.mjs
      - if: inputs.exact || steps.entry.outputs.hit == 'true'
        id: keys
        run: python3 tools/scripts/worktree/lean_actions.py keys --repository "$GITHUB_WORKSPACE" --layers dependency
      - if: inputs.exact || steps.entry.outputs.hit == 'true'
        uses: actions/cache/restore@v5
        with:
          path: ~/.elan
          key: ${{ steps.keys.outputs.elan_key }}
      - if: inputs.exact || steps.entry.outputs.hit == 'true'
        run: tools/scripts/workflow/install-lean-toolchain.sh lean-toolchain --github-path "$GITHUB_PATH"
      - if: inputs.exact || steps.entry.outputs.hit == 'true'
        id: dependency
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.keys.outputs.dependency_archive_path }}
          key: ${{ steps.keys.outputs.dependency_key }}
          restore-keys: ${{ steps.keys.outputs.dependency_restore_prefix }}
      - if: inputs.exact || steps.entry.outputs.hit == 'true'
        name: Restore Lean dependencies
        env:
          DEPENDENCY_KEY: ${{ steps.dependency.outputs.cache-matched-key }}
          DEPENDENCY_OUTCOME: ${{ steps.dependency.outcome }}
          STRATALINT_ACCEPT_COLD_BUILD: '1'
        run: |
          python3 tools/scripts/worktree/lean_actions.py restore --repository "$GITHUB_WORKSPACE" --layers dependency --dependency-key "$DEPENDENCY_KEY" --dependency-outcome "$DEPENDENCY_OUTCOME"
      - if: inputs.exact || steps.entry.outputs.hit == 'true'
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: false
      - if: inputs.exact || steps.entry.outputs.hit == 'true'
        name: Check the clean compiler and report destinations
        run: |
          report=".lake/build/lean-inspector/modules/$CACHE_SCOPE.zip"
          test ! -e ".lake/build/lib/lean/${CACHE_SCOPE//.//}.olean"
          test ! -e "$report"
          test ! -e "$report.hash"
          test ! -e "$report.trace"
      - if: inputs.exact
        name: Select the compiler inputs of the report scope
        env:
          PUBLICATION_KIND: ${{ inputs.kind }}
        run: |
          case "$PUBLICATION_KIND" in
            compiler) printf '%s\n' "$CACHE_SCOPE" "$IMPORT_SCOPE" > "$RUNNER_TEMP/verification-compilers" ;;
            report)
              make -C tools dotnet DOTNET_PROJECT=tools/StrataLint.Lean/StrataLint.Lean.csproj
              dotnet tools/StrataLint.Lean/bin/Release/net10.0/StrataLint.Lean.dll \
                lean-utility-input --modules --targets "$CACHE_SCOPE" |
                jq -er 'if length > 0 then .[] else error("empty compiler scope") end' > "$RUNNER_TEMP/verification-compilers"
              ;;
            *) exit 2 ;;
          esac
      - if: inputs.exact
        name: Restore compilers from the exact source
        uses: ./.github/actions/lean-cache-shards
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          operation: restore-published
          kind: compiler
          staged: ${{ inputs.staged && inputs.kind == 'compiler' }}
          version: ${{ format('lean-modules-{0}', inputs.source) }}
          targets-file: ${{ runner.temp }}/verification-compilers
      - if: inputs.exact
        name: Verify the compiler delivered by the selected shard
        run: |
          module=".lake/build/lib/lean/${CACHE_SCOPE//.//}.olean"
          test -s "$module"
          if [[ -d .lake/build/lean-inspector/modules ]]; then
            test -z "$(find .lake/build/lean-inspector/modules -type f -print -quit)"
          fi
          sha256sum "$module" > "$RUNNER_TEMP/restored-compiler.sha256"
      - if: inputs.exact && inputs.kind == 'compiler'
        name: Load the restored compiler with Lake
        run: lake --no-build build "+$CACHE_SCOPE:olean" "+$IMPORT_SCOPE:olean"
      - if: (inputs.exact && inputs.kind == 'report') || steps.entry.outputs.hit == 'true'
        name: Restore the selected module through the CI reader
        continue-on-error: ${{ !inputs.exact }}
        uses: ./.github/actions/lean-cache-shards
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          operation: restore-published
          kind: ${{ inputs.kind }}
          staged: ${{ inputs.staged }}
          version: ${{ inputs.exact && format('lean-modules-{0}-report', inputs.source) || '' }}
          targets: ${{ env.CACHE_SCOPE }}
      - if: inputs.exact && inputs.kind == 'report'
        name: Verify the report delivered by the selected shard
        run: |
          report=".lake/build/lean-inspector/modules/$CACHE_SCOPE.zip"
          test -s "$report"
          test -s "$report.hash"
          test -s "$report.trace"
          sha256sum --check "$RUNNER_TEMP/restored-compiler.sha256"
          sha256sum "$report" > "$RUNNER_TEMP/restored-report.sha256"
      - if: inputs.exact && inputs.kind == 'report'
        name: Reuse the restored report with Lake
        shell: bash
        env:
          STRATALINT_ACCEPT_COLD_BUILD: '1'
        run: |
          make lean-report-prepare LEAN_TARGETS="$CACHE_SCOPE"
          make lean-report-scoped LEAN_TARGETS="$CACHE_SCOPE" | tee "$RUNNER_TEMP/report-check.log"
          sha256sum --check "$RUNNER_TEMP/restored-report.sha256"
          sed -n 's/^LEAN_INSPECTOR_SCOPED_WORK //p' "$RUNNER_TEMP/report-check.log" |
            jq -se 'length == 1 and .[0].selected_modules > 0 and .[0].extracted_modules == 0'
      - if: steps.entry.outputs.hit == 'true'
        name: Build the selected module with any recovered inputs
        env:
          STRATALINT_ACCEPT_COLD_BUILD: '1'
        run: |
          make lean LEAN_TARGETS="$CACHE_SCOPE"
          lake --no-build build "$CACHE_SCOPE"
