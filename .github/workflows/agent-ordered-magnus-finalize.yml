name: agent-ordered-magnus-finalize

on:
  push:
    branches:
      - lane/math/ordered-magnus-observability

permissions:
  contents: write

jobs:
  finalize:
    if: contains(github.event.head_commit.message, '[ordered-magnus-finalize]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lane/math/ordered-magnus-observability
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install pinned Lean toolchain
        run: tools/scripts/workflow/install-lean-toolchain.sh lean-toolchain --github-path "$GITHUB_PATH"
      - name: Merge the current dev baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin dev
          git merge --no-edit origin/dev
      - name: Restore Lean dependencies
        run: lake update
      - name: Build all new Lean owners
        shell: bash
        run: |
          set -euo pipefail
          modules=(
            D5.S3.Observer.AgencyHolonomy.SecondMagnusKernelNormSquare
            D5.S3.Observer.AgencyHolonomy.FiniteFourierMagnusCommutator
            D5.S3.Observer.AgencyHolonomy.PairCalibratedSecondMagnusObservability
            D5.S3.Observer.AgencyHolonomy.OrderedTimeSimplexSecondMagnusAverage
          )
          for module in "${modules[@]}"; do
            lake build "$module"
          done
          if grep -R -n -E '(^|[^A-Za-z])sorry([^A-Za-z]|$)' \
              D5/S3/Observer/AgencyHolonomy/SecondMagnusKernelNormSquare.lean \
              D5/S3/Observer/AgencyHolonomy/FiniteFourierMagnusCommutator.lean \
              D5/S3/Observer/AgencyHolonomy/PairCalibratedSecondMagnusObservability.lean \
              D5/S3/Observer/AgencyHolonomy/OrderedTimeSimplexSecondMagnusAverage.lean; then
            echo "new Lean owner contains sorry" >&2
            exit 1
          fi
      - name: Generate Blueprint mirrors and schema-5 freeze events
        shell: bash
        run: |
          set -euo pipefail
          before="$(mktemp)"
          after="$(mktemp)"
          new_freezes="$(mktemp)"
          find Golden/Frozen/accepted -maxdepth 1 -type f -printf '%f\n' | sort > "$before"

          make -C tools dotnet
          make emit
          make lean-report
          dotnet run --project tools/StrataLint.Cli/StrataLint.Cli.csproj \
            --configuration Release -- \
            ledger-append \
            --candidate-lean-report .lake/build/stratalint/raw-lean-report.json
          tools/scripts/agent/scope-freeze-delta.sh origin/dev

          mirrors=(
            Blueprint/D5/S3/Observer/AgencyHolonomy/SecondMagnusKernelNormSquare.md
            Blueprint/D5/S3/Observer/AgencyHolonomy/FiniteFourierMagnusCommutator.md
            Blueprint/D5/S3/Observer/AgencyHolonomy/PairCalibratedSecondMagnusObservability.md
            Blueprint/D5/S3/Observer/AgencyHolonomy/OrderedTimeSimplexSecondMagnusAverage.md
          )
          for path in "${mirrors[@]}"; do
            test -f "$path"
          done

          find Golden/Frozen/accepted -maxdepth 1 -type f -printf '%f\n' | sort > "$after"
          comm -13 "$before" "$after" > "$new_freezes"
          cat "$new_freezes"
          test "$(wc -l < "$new_freezes")" -eq 4
      - name: Append the consolidated RH theory repair
        shell: bash
        run: |
          set -euo pipefail
          theory="docs/develop/theory/RH_RESEARCH_LANE_THEORY.md"
          marker="# 2026-09-01 追加：二阶 Magnus 可观测性与标准 Weil/Pick 主干修订"
          if grep -Fq "$marker" "$theory"; then
            echo "theory appendix already exists" >&2
            exit 1
          fi
          cat <<'EOF' >> "$theory"

---

# 2026-09-01 追加：二阶 Magnus 可观测性与标准 Weil/Pick 主干修订

## 1. 本轮修订的目的

此前统一理论卷已经把素数 Fourier 相位、时间有序 memory cocycle、swap curvature、二阶 Magnus 核、离线反射模、负平方核与 determinant barrier 放入同一研究方向。

本轮修订关闭二阶 Magnus 层内部的四个有限缺口，同时校正中央桥的标准数学接口：

1. 把 alternating two-slot kernel 的范数上界提升为精确平方公式；
2. 把该 kernel 识别为有限 Fourier 代数生成元交换子的精确系数；
3. 给出逐频率对校准时钟下的精确反向可观测性；
4. 给出真实 ordered-time simplex 的闭式平均公式；
5. 复用已经冻结的 `FixedScaleWeilQuadraticForm`，不再重复建立另一套有限 Weil 定义；
6. 将后续中央开放边拆成 holonomy-to-Weil transport、xi-ratio Pick kernel 和 negative-index detection 三段。

本轮只追加这一统一理论卷，不创建节点级 theory 文档。

---

## 2. 精确二阶 Magnus kernel 强度

沿用冻结对象：

\[
K_{p,q}(t_1,t_2)
=
\chi_{\omega_p}(t_1)\chi_{\omega_q}(t_2)
-
\chi_{\omega_q}(t_1)\chi_{\omega_p}(t_2),
\]

其中：

\[
\chi_\omega(t)=e^{-it\omega}.
\]

令半面积：

\[
A_{p,q}(t_1,t_2)
=
(t_1-t_2)\frac{\omega_p-\omega_q}{2}.
\]

新真源 `SecondMagnusKernelNormSquare` 机器证明：

\[
\boxed{
|K_{p,q}(t_1,t_2)|^2
=
4\sin^2 A_{p,q}(t_1,t_2).
}
\]

因此既有上界：

\[
|K_{p,q}|\le 2
\]

现在被识别为 sharp bound。

若 \(\omega_p\ne\omega_q\)，取：

\[
t_1=
\frac{\pi}{\omega_p-\omega_q},
\qquad
t_2=0,
\]

则：

\[
A_{p,q}(t_1,0)=\frac\pi2,
\]

从而：

\[
\boxed{
|K_{p,q}(t_1,0)|^2=4.
}
\]

这给出一个精确的 pairwise faithfulness 结论：任意非零频差都存在显式采样时刻，使 alternating response 达到最大值。

该命题没有给出所有频率对共享的单一时钟。共享时钟属于后续有限 frame 或 ordered-window coercivity 问题。

---

## 3. kernel 已进入真实交换子

设 \(A\) 为复结合代数，有限生成元族为 \(G_p\in A\)，定义 Fourier-valued generator：

\[
H_G(t)
=
\sum_p \chi_{\omega_p}(t)G_p.
\]

新真源 `FiniteFourierMagnusCommutator` 机器证明：

\[
\boxed{
[H_G(t_1),H_G(t_2)]
=
\sum_{p,q}
K_{p,q}(t_1,t_2)G_pG_q.
}
\]

这里：

\[
[X,Y]=XY-YX.
\]

因此 `SecondMagnusSwapCurvature` 中的 alternating kernel 已经不再只是 Magnus 结构类比。它是有限 Fourier 生成元交换子中的精确标量系数。

这关闭了以下有限代数桥：

\[
\boxed{
\text{prime/log-frequency Fourier flow}
\longrightarrow
\text{noncommutative generator}
\longrightarrow
\text{commutator coefficient }K_{p,q}.
}
\]

仍未建立的是：

- Banach 或 Hilbert 空间上的 operator domain；
- Bochner 可积性；
- time-ordered exponential；
- Magnus 级数收敛；
- 无限 prime-power 极限。

---

## 4. 逐频率对校准的精确反向可观测性

对有限频率族 \(\omega:I\to\mathbb R\)，假设 \(\omega\) 单射。对每个有序对定义校准时钟：

\[
T_{p,q}
=
\begin{cases}
0,&p=q,\\
\displaystyle\frac\pi{\omega_p-\omega_q},&p\ne q.
\end{cases}
\]

设 curvature field 为 \(C_{p,q}\in\mathbb C\)，并假设对角为零：

\[
C_{p,p}=0.
\]

定义 pair-calibrated energy：

\[
E_{\mathrm{cal}}(\omega,C)
=
\sum_{p,q}
\left|
K_{p,q}(T_{p,q},0)C_{p,q}
\right|^2.
\]

新真源 `PairCalibratedSecondMagnusObservability` 机器证明：

\[
\boxed{
E_{\mathrm{cal}}(\omega,C)
=
4E_{\mathrm{hol}}(C),
}
\]

其中：

\[
E_{\mathrm{hol}}(C)
=
\sum_{p,q}|C_{p,q}|^2.
\]

并得到：

\[
E_{\mathrm{cal}}(\omega,C)=0
\iff
\forall p,q,\ C_{p,q}=0.
\]

这是一条有限且精确的 reverse-observability theorem。它说明此前只有：

\[
E_{\mathrm{Magnus}}^{(2)}\le4E_{\mathrm{hol}}
\]

并非 kernel 本身缺少反向信息。单点失败来自 resonance 和共同采样协议。允许 pair-adapted clocks 后，完整 off-diagonal curvature 被精确恢复。

