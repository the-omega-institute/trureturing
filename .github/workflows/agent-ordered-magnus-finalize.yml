## 6. 三种可观测性必须分开记账

当前二阶 Magnus 层已经形成三个不同强度的命题。

### 6.1 任意固定两时刻的上界

\[
0\le E^{(2)}(t_1,t_2)
\le4E_{\mathrm{hol}}.
\]

它对所有时刻无条件成立，但可能因 resonance 失去反向界。

### 6.2 pair-adapted 精确恢复

\[
E_{\mathrm{cal}}=4E_{\mathrm{hol}}.
\]

它是 exact reverse bound，但时钟依赖频率对。

### 6.3 ordered common-window 平均

\[
\mathcal A_g(T)
=
T^2-rac{2(1-\cos(gT))}{g^2}.
\]

它使用统一时间窗口，并把反向强制性转化为有限最小频差问题。

后续不得把这三类命题混写为同一个“Magnus positivity”。它们分别对应 pointwise boundedness、adaptive identifiability 和 common-window observability。

