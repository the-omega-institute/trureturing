## 5. ordered-time simplex 的闭式响应

真实二阶 Magnus 项使用有序区域：

\[
0\le t_2\le t_1\le T.
\]

若 integrand 只通过时间差 \(\tau=t_1-t_2\) 进入，则二重有序积分约化为带三角权重的一重积分。

对频差 \(g\in\mathbb R\)，定义：

\[
\mathcal A_g(T)
=
\int_0^T
(T-\tau)
4\sin^2\left(\frac{g\tau}{2}\right)
\,d\tau.
\]

新真源 `OrderedTimeSimplexSecondMagnusAverage` 对 \(g\ne0\) 机器证明：

\[
\boxed{
\mathcal A_g(T)
=
T^2-
\frac{2(1-\cos(gT))}{g^2}.
}
\]

对 \(g=0\)：

\[
\mathcal A_0(T)=0.
\]

对 \(T\ge0\)：

\[
\mathcal A_g(T)\ge0.
\]

这是真正的 ordered-simplex scalar coefficient。它比任意固定两时刻采样更适合下一步统一窗口 coercivity。

由：

\[
0\le1-\cos(gT)\le2
\]

可读出尚待独立冻结的下界：

\[
\mathcal A_g(T)
\ge
T^2-rac4{g^2}.
\]

对有限单射频率族，令：

\[
\Delta_\omega
=
\min_{p\ne q}|\omega_p-\omega_q|>0.
\]

则对所有非对角频率对：

\[
\mathcal A_{\omega_p-\omega_q}(T)
\ge
T^2-rac4{\Delta_\omega^2}.
\]

当：

\[
T>\frac2{\Delta_\omega}
\]

时，右侧严格为正。下一条有限真源应据此建立：

\[
\boxed{
\texttt{FiniteFrequencyOrderedSimplexCoercivity}.
}
\]

其目标形态为：

\[
c_{\omega,T}E_{\mathrm{hol}}(C)
\le
E_{\mathrm{simplex}}(\omega,C;T)
\le
T^2E_{\mathrm{hol}}(C),
\]

其中 \(c_{\omega,T}>0\) 在有限频率分离和充分大公共窗口下成立。

