## 8. Pick/Pontryagin 负指标接口

仓库已经冻结抽象真源：

\[
\boxed{
\texttt{HermitianKernelNegativeSquares}.
}
\]

它已经能够对 Hermitian kernel 的所有有限 Gram 采样定义负平方数。

下一步需要给这个抽象接口输入一个来自 completed xi 的具体函数。标准候选为：

\[
\Theta_\omega(z)
=
\frac{
\xi\left(\frac12-\omega-iz\right)
}{
\xi\left(\frac12+\omega-iz\right)
},
\qquad \omega>0.
\]

对应 half-plane Pick kernel 可取规范化形式：

\[
K_{\Theta_\omega}(z,w)
=
\frac{
1-\Theta_\omega(z)\overline{\Theta_\omega(w)}
}{
-i(z-\overline w)
}.
\]

下一真源命名为：

\[
\boxed{
\texttt{XiRatioPickKernel}.
}
\]

它必须首先证明：

- 定义域与极点排除；
- Hermitian symmetry；
- 对角极限或非对角采样规范；
- reflection compatibility；
- 临界线假设下的 Schur/inner implication；
- 有限 Gram 矩阵与 `HermitianKernelNegativeSquares` 的接口。

随后建立较弱且可验证的检测方向：

\[
\boxed{
\texttt{OfflineZeroPickIndexLowerBound}.
}
\]

目标是：一个被窗口和采样隔离的离线零点轨道产生至少一个有限负方向。

精确计数公式：

\[
\kappa_{\omega,T}
=
N_{\mathrm{off}}(\omega,T)
\]

仍应标记为后续 index theorem，不得提前作为已知结论使用。

---

## 9. determinant 层的正确位置

冻结的 `HorizonEffectiveIndex` 给出有限严格收缩矩阵的 barrier：

\[
\operatorname{Ind}_{\mathrm{hor}}(H)
=
\det(I-H^*H)^{-1}
=
\prod_j(1-\sigma_j^2)^{-1}.
\]

该有限公式目前对一般严格收缩矩阵成立。Hankel 假设尚未承担核心证明。

因此 determinant 层的下一任务不是继续重命名该有限公式，而是：

1. 从具体 xi/Weil symbol 构造 Hankel operator；
2. 建立 finite sections；
3. 证明 Hilbert-Schmidt 或 trace-class 条件；
4. 证明奇异值和负指标在截断极限中稳定；
5. 构造 Fredholm determinant；
6. 比较其零点与 completed xi 的零点。

候选真源为：

\[
\boxed{
\texttt{FiniteIndexLimitStability},
\qquad
\texttt{FredholmHorizonIndexLimit}.
}
\]

---

## 10. 黄金周期的边界校准

离线 monodromy 的双曲判据来自：

\[
4\sinh^2(\delta T)>0
\iff
\delta\ne0
\]

对任意 \(T>0\) 成立。

因此当前黄金周期：

\[
T_\varphi=2\log\varphi
\]

是合法采样周期，但尚未证明它在算术上承重。

在出现下列任一额外性质以前，黄金周期只能作为坐标或规范化选择：

- small-divisor 最优性；
- continued-fraction return 最优性；
- frame lower bound 最优性；
- condition number 极值；
- 与 prime-power frequency comb 的精确耦合；
- 与 Weil/Pick index 的不变量关系。

应先冻结一般周期版本：

\[
\boxed{
\texttt{OfflineZeroMonodromyPeriodIndependence}.
}
\]

只有一般周期定理建立后，才适合定义 `GoldenPeriodOptimalityCriterion`。

