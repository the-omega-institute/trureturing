## 7. 中央算术桥的修订

仓库已经存在并冻结：

\[
\boxed{
\texttt{D5/S3/Weil/ZetaBridge/FixedScaleWeilQuadraticForm}.
}
\]

该真源已经包含：

- convolution-square Weil test；
- von Mangoldt prime-power contribution；
- Archimedean multiplier；
- pole rank-one energy；
- zero-side sum；
- fixed-scale positivity equivalence。

因此不应再建立一套平行的“有限 Weil quadratic form”定义。需要建立的是从当前 chronological holonomy 数据进入该既有标准对象的运输。

修订后的中央链为：

\[
\boxed{
\text{finite Fourier memory/holonomy}
\longrightarrow
\text{admissible Weil test function}
\longrightarrow
\texttt{FixedScaleWeilQuadraticForm}
\longrightarrow
\text{xi-ratio Pick kernel}
\longrightarrow
\text{finite negative index}.
}
\]

第一条新开放边命名为：

\[
\boxed{
\texttt{HolonomyToFixedScaleWeilTransport}.
}
\]

它至少需要提供：

1. 从有限 frequency/curvature coefficients 到 `WeilTestFunction` 的构造；
2. support 半径的精确记账；
3. prime-power 权重与 \(\log n\) 频率的匹配；
4. Gamma 和 pole 项的保留；
5. truncation remainder；
6. holonomy energy 与 fixed-scale Weil form 之间的等式、下界或带误差比较。

在该运输建立前，不应把自定义 holonomy energy 与 zero-side energy 的直接 domination 当成 primitive hard heart。显式公式应作为二者相遇的标准中介。

