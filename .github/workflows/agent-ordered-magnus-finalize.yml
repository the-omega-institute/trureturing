name: agent-ordered-magnus-finalize

on:
  push:
    branches:
      - lane/math/ordered-magnus-observability

permissions:
  contents: write

jobs:
  finalize:
    if: contains(github.event.head_commit.message, '[ordered-magnus-finalize]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lane/math/ordered-magnus-observability
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install pinned Lean toolchain
        run: tools/scripts/workflow/install-lean-toolchain.sh lean-toolchain --github-path "$GITHUB_PATH"
      - name: Merge the current dev baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin dev
          git merge --no-edit origin/dev
      - name: Restore Lean dependencies
        run: lake update
      - name: Build all new Lean owners
        shell: bash
        run: |
          set -euo pipefail
          modules=(
            D5.S3.Observer.AgencyHolonomy.SecondMagnusKernelNormSquare
            D5.S3.Observer.AgencyHolonomy.FiniteFourierMagnusCommutator
            D5.S3.Observer.AgencyHolonomy.PairCalibratedSecondMagnusObservability
            D5.S3.Observer.AgencyHolonomy.OrderedTimeSimplexSecondMagnusAverage
          )
          for module in "${modules[@]}"; do
            lake build "$module"
          done
          if grep -R -n -E '(^|[^A-Za-z])sorry([^A-Za-z]|$)' \
              D5/S3/Observer/AgencyHolonomy/SecondMagnusKernelNormSquare.lean \
              D5/S3/Observer/AgencyHolonomy/FiniteFourierMagnusCommutator.lean \
              D5/S3/Observer/AgencyHolonomy/PairCalibratedSecondMagnusObservability.lean \
              D5/S3/Observer/AgencyHolonomy/OrderedTimeSimplexSecondMagnusAverage.lean; then
            echo "new Lean owner contains sorry" >&2
            exit 1
          fi
      - name: Generate Blueprint mirrors and schema-5 freeze events
        shell: bash
        run: |
          set -euo pipefail
          before="$(mktemp)"
          after="$(mktemp)"
          new_freezes="$(mktemp)"
          find Golden/Frozen/accepted -maxdepth 1 -type f -printf '%f\n' | sort > "$before"

          make -C tools dotnet
          make emit
          make lean-report
          dotnet run --project tools/StrataLint.Cli/StrataLint.Cli.csproj \
            --configuration Release -- \
            ledger-append \
            --candidate-lean-report .lake/build/stratalint/raw-lean-report.json
          tools/scripts/agent/scope-freeze-delta.sh origin/dev

          mirrors=(
            Blueprint/D5/S3/Observer/AgencyHolonomy/SecondMagnusKernelNormSquare.md
            Blueprint/D5/S3/Observer/AgencyHolonomy/FiniteFourierMagnusCommutator.md
            Blueprint/D5/S3/Observer/AgencyHolonomy/PairCalibratedSecondMagnusObservability.md
            Blueprint/D5/S3/Observer/AgencyHolonomy/OrderedTimeSimplexSecondMagnusAverage.md
          )
          for path in "${mirrors[@]}"; do
            test -f "$path"
          done

          find Golden/Frozen/accepted -maxdepth 1 -type f -printf '%f\n' | sort > "$after"
          comm -13 "$before" "$after" > "$new_freezes"
          cat "$new_freezes"
          test "$(wc -l < "$new_freezes")" -eq 4
      - name: Append the consolidated RH theory repair
        shell: bash
        run: |
          set -euo pipefail
          theory="docs/develop/theory/RH_RESEARCH_LANE_THEORY.md"
          appendix=".github/agent-ordered-magnus-theory-appendix.md"
          marker="# 2026-09-01 追加：二阶 Magnus 可观测性与标准 Weil/Pick 主干修订"
          test -f "$appendix"
          if grep -Fq "$marker" "$theory"; then
            echo "theory appendix already exists" >&2
            exit 1
          fi
          cat "$appendix" >> "$theory"
      - name: Enforce append-only scope
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent-ordered-magnus-lean.yml
          rm -f .github/agent-ordered-magnus-theory-appendix.md

          if git diff --unified=0 origin/dev -- \
              docs/develop/theory/RH_RESEARCH_LANE_THEORY.md | \
              grep -E '^-[^-]'; then
            echo "the consolidated theory volume was not append-only" >&2
            exit 1
          fi

          git diff --check
          mapfile -t changed < <(git status --porcelain=v1 | cut -c4- | sort -u)
          printf '%s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "$path" in
              Blueprint/D5/S3/Observer/AgencyHolonomy/SecondMagnusKernelNormSquare.md|\
              Blueprint/D5/S3/Observer/AgencyHolonomy/FiniteFourierMagnusCommutator.md|\
              Blueprint/D5/S3/Observer/AgencyHolonomy/PairCalibratedSecondMagnusObservability.md|\
              Blueprint/D5/S3/Observer/AgencyHolonomy/OrderedTimeSimplexSecondMagnusAverage.md|\
              docs/develop/theory/RH_RESEARCH_LANE_THEORY.md|\
              .github/workflows/agent-ordered-magnus-lean.yml|\
              .github/agent-ordered-magnus-theory-appendix.md)
                ;;
              Golden/Frozen/accepted/*.json)
                ;;
              *)
                echo "unexpected generated or deleted path: $path" >&2
                exit 1
                ;;
            esac
          done
      - name: Commit generated truth artifacts and theory repair
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "formalize: freeze ordered Magnus observability"
          git push origin HEAD:lane/math/ordered-magnus-observability
