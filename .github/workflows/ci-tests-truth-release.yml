name: CI tests-truth-release

on:
  pull_request:
    branches: [dev, 'integration-**']
    types: [opened, synchronize, reopened]
  push:
    branches: [dev, 'integration-**']

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-tests-truth-release-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests-truth-release:
    uses: ./.github/workflows/ci-unit.yml
    with:
      command: make -C tools test TEST_PROJECT=tools/tests/StrataLint.TruthRelease.Tests/StrataLint.TruthRelease.Tests.csproj
      paths: |
        .editorconfig
        .github/*
        .gitignore
        Blueprint/D5/S3/Midline/GoldenSpectralMarker.md
        Blueprint/D5/S3/Midline/GoldenSpectralMarker.scribe.cs
        D5/S3/Midline/GoldenSpectralMarker.lean
        Directory.Build.props
        Directory.Packages.props
        Golden/Projection/*
        Golden/gate-authority-roots.toml
        Makefile
        Meta/Digestion/atomizers.toml
        Meta/FILEMAP.*.toml
        Meta/FILEMAP.toml
        Meta/ReportConsumers/*
        Meta/ReportProducers/*
        Meta/ci-checks.json
        Meta/ci-resources.json
        Meta/engineering-projects.json
        Meta/judge-seed.json
        Meta/package-materials.json
        Reg/lake-manifest.json
        Reg/lakefile.toml
        docs/CONTRIBUTING.md
        docs/GOVERNANCE.md
        global.json
        lake-manifest.json
        lakefile.toml
        lean-report-inputs.json
        lean-toolchain
        tools/ARCHITECTURE.md
        tools/Architecture/*
        tools/Makefile
        tools/StrataLint.Cli/*
        tools/StrataLint.Configuration/*
        tools/StrataLint.Engine/*
        tools/StrataLint.ExecutionEvidence/*
        tools/StrataLint.FileMap/*
        tools/StrataLint.InspectionScope/*
        tools/StrataLint.Lean/*
        tools/StrataLint.ResourcePlanning/*
        tools/StrataLint.Scribe.Documents/*
        tools/StrataLint.Scribe/*.cs
        tools/StrataLint.Scribe/StrataLint.Scribe.csproj
        tools/StrataLint.Scribe/packages.lock.json
        tools/StrataLint.sln
        tools/TOWER.yaml
        tools/TestSupport/StrataLint.CliTestSupport/*
        tools/TestSupport/StrataLint.ConfigurationTestSupport/*
        tools/TestSupport/StrataLint.DigestionTestSupport/*
        tools/TestSupport/StrataLint.ProcessTestSupport/*
        tools/TestSupport/StrataLint.RegistrationTestSupport/*
        tools/TestSupport/StrataLint.TestSupport/*
        tools/Trureturing.Truth/*
        tools/lean-inspector-interface/*
        tools/lean-inspector/*.json
        tools/lean-inspector/*.mjs
        tools/lean-inspector/*/*.sh
        tools/lean-inspector/Census/*
        tools/lean-inspector/LeanInformationAudit/*.py
        tools/lean-inspector/LeanInformationAuditAnalysis/*
        tools/lean-inspector/inspect.sh
        tools/lean-inspector/lakefile.lean
        tools/lean-inspector/materials.py
        tools/lean-inspector/native.py
        tools/lean-inspector/native_image.c
        tools/lean-inspector/publication.py
        tools/lean-inspector/reuse.py
        tools/scripts/*.c
        tools/scripts/*.lean
        tools/scripts/*.metal
        tools/scripts/*.txt
        tools/scripts/agent/gpu5040/*
        tools/scripts/agent/openproblem/TARGET-GATES.md
        tools/scripts/dotnet-test.sh
        tools/scripts/workflow/ci-entry.sh
        tools/tests/Directory.Build.props
        tools/tests/StrataLint.ScriptTests/*.cs
        tools/tests/StrataLint.ScriptTests/*.csproj
