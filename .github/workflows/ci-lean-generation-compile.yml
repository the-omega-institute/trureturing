name: Build Lean module shards

on:
  workflow_call:
    inputs:
      source:
        description: Protected dev commit selected by the publisher
        required: true
        type: string
      kind:
        description: Compiler or report publication
        required: true
        type: string
      matrix:
        description: Workers for the pinned publication plan
        required: true
        type: string

permissions: {}
jobs:
  build:
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    timeout-minutes: 360
    runs-on: ubuntu-24.04-arm
    env:
      FULL_BUILD: '1'
      STRATALINT_ACCEPT_COLD_BUILD: '1'
      STRATALINT_BUILD_TIMEOUT_SECONDS: '21600'
      STRATALINT_LEAN_CACHE_RELEASE_TIMEOUT_SECONDS: '21600'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - run: python3 .github/scripts/install-tools.py
      - uses: actions/download-artifact@v8
        with:
          name: module-plan-${{ github.run_id }}
          path: ${{ runner.temp }}
          digest-mismatch: error
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: false
      - run: make -C tools dotnet DOTNET_PROJECT=tools/StrataLint.Lean/StrataLint.Lean.csproj
      - id: keys
        run: python3 tools/scripts/worktree/lean_actions.py keys --repository "$GITHUB_WORKSPACE" --layers dependency
      - uses: actions/cache/restore@v5
        if: steps.keys.outputs.elan_key != ''
        continue-on-error: true
        with:
          path: ~/.elan
          key: ${{ steps.keys.outputs.elan_key }}
      - run: tools/scripts/workflow/install-lean-toolchain.sh lean-toolchain --github-path "$GITHUB_PATH"
      - id: dependency
        uses: actions/cache/restore@v5
        if: steps.keys.outputs.dependency_key != ''
        continue-on-error: true
        with:
          path: ${{ steps.keys.outputs.dependency_archive_path }}
          key: ${{ steps.keys.outputs.dependency_key }}
          restore-keys: ${{ steps.keys.outputs.dependency_restore_prefix }}
      - name: Prepare the pinned mathlib dependencies
        env:
          GH_TOKEN: ${{ github.token }}
          DEPENDENCY_KEY: ${{ steps.dependency.outputs.cache-matched-key }}
          DEPENDENCY_OUTCOME: ${{ steps.dependency.outcome }}
        run: |
          python3 tools/scripts/worktree/lean_actions.py restore --repository "$GITHUB_WORKSPACE" --layers dependency --dependency-key "$DEPENDENCY_KEY" --dependency-outcome "$DEPENDENCY_OUTCOME"
          bash .github/actions/lean-compile-layer/prepare-dependencies.sh
      - name: Build and checkpoint the assigned publication targets
        env:
          GH_TOKEN: ${{ github.token }}
          STRATALINT_CACHE_WRITES: 'true'
          MODULE_LANE: ${{ matrix.lane }}
          LEAN_NUM_THREADS: '1'
        uses: ./.github/actions/lean-cache-shards
        with:
          kind: ${{ inputs.kind }}
          operation: module-worker
