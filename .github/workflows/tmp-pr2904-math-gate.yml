name: Temporary PR 2904 mathematical gate

on:
  push:
    branches:
      - agent/theorist/finite-package-latent-escape
  pull_request:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: temporary-pr-2904-math-gate
  cancel-in-progress: true

jobs:
  mathematical-gate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/theorist/finite-package-latent-escape
          fetch-depth: 0

      - name: Install pinned SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          tools/scripts/workflow/install-lean-toolchain.sh lean-toolchain --github-path "$GITHUB_PATH"

      - name: Hydrate canonical Lean cache
        shell: bash
        run: |
          set -euo pipefail
          make lean-cache-ensure

      - name: Build scoped mathematical modules
        shell: bash
        run: |
          set -euo pipefail
          lake build D5.S3.ConceptDynamics.DefinitionEscape.DefinitionKernelGalois
          lake build D5.S3.ConceptDynamics.DefinitionEscape.MultiTargetBlindResidual
          lake build D5.S3.ConceptDynamics.DefinitionEscape.RelativeSemanticDiagonal
          lake build D5.S3.ConceptDynamics.DefinitionEscape.WeightedResidualCoverage
          lake build D5.S3.ConceptDynamics.DefinitionEscape.LatentAdequacyCriterion
          lake build D5.S3.ConceptDynamics.DefinitionEscape.QuestionAlgebraDuality
          lake build D5.S3.ConceptDynamics.DefinitionEscape.MinimalTargetDistillation
          lake build D5.S3.ConceptDynamics.DefinitionEscape.RefinementUltrametric
          lake build D5.S3.ConceptDynamics.DefinitionEscape.InverseLimitCompletion
          lake build D5.S3.ConceptDynamics.Coding.ProductiveDiagonalEscapeCriterion

      - name: Run canonical test gate
        shell: bash
        run: |
          set -euo pipefail
          make test
