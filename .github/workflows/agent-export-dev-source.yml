name: agent-export-dev-source

on:
  push:
    branches:
      - agent/scratch/export-dev-20260830-1045

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/scratch/export-dev-20260830-1045
          fetch-depth: 0
      - name: Package repository checkout
        run: |
          archive="$RUNNER_TEMP/trureturing-dev-repository.tar.gz"
          tar -czf "$archive" .
          test -s "$archive"
      - uses: actions/upload-artifact@v4
        with:
          name: trureturing-dev-33954025-repository
          path: ${{ runner.temp }}/trureturing-dev-repository.tar.gz
          if-no-files-found: error
          retention-days: 1
