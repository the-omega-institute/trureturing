name: Measure dependency changes on the delivery base
on:
  push:
    branches: [ops/frozen-rebase-extra-33854]
permissions:
  actions: read
  contents: read
jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.list.outputs.shards }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/frozen-measurement
          persist-credentials: false
      - id: list
        run: python3 -c 'import json; print("shards=" + json.dumps(json.load(open(".github/frozen-measurement/active.json"))))' >> "$GITHUB_OUTPUT"
  measure:
    needs: select
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.shards) }}
    env:
      LEAN_NUM_THREADS: '1'
      STRATALINT_CACHE_WRITES: 'false'
      STRATALINT_ACCEPT_COLD_BUILD: '1'
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: make install-tools
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet build tools/StrataLint.Cli/StrataLint.Cli.csproj -c Release --nologo
      - id: keys
        run: python3 tools/scripts/worktree/lean_actions.py keys --repository "$GITHUB_WORKSPACE"
      - uses: actions/cache/restore@v5
        if: steps.keys.outputs.elan_key != ''
        with:
          path: ~/.elan
          key: ${{ steps.keys.outputs.elan_key }}
      - run: tools/scripts/workflow/install-lean-toolchain.sh lean-toolchain --github-path "$GITHUB_PATH"
      - id: dep
        uses: actions/cache/restore@v5
        if: steps.keys.outputs.dependency_key != ''
        with:
          path: ${{ steps.keys.outputs.dependency_archive_path }}
          key: ${{ steps.keys.outputs.dependency_key }}
          restore-keys: ${{ steps.keys.outputs.dependency_restore_prefix }}
      - env:
          DEPENDENCY_KEY: ${{ steps.dep.outputs.cache-matched-key }}
          DEPENDENCY_OUTCOME: ${{ steps.dep.outcome }}
        run: |
          python3 tools/scripts/worktree/lean_actions.py restore --repository "$GITHUB_WORKSPACE" --layers dependency --dependency-key "$DEPENDENCY_KEY" --dependency-outcome "$DEPENDENCY_OUTCOME"
          bash .github/actions/lean-compile-layer/prepare-dependencies.sh
          python3 .github/frozen-measurement/run.py targets
      - uses: ./.github/actions/lean-cache-shards
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          operation: restore-published
          targets-file: ${{ runner.temp }}/targets
      - run: python3 .github/frozen-measurement/run.py measure
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: frozen-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/results/
          if-no-files-found: ignore
          retention-days: 7
