name: agent-oactc-golden-time-fiber-lean

on:
  push:
    branches:
      - agent/formalize/oactc-golden-time-fiber-tomography-v2-20260831

permissions:
  contents: read

jobs:
  validate:
    if: contains(github.event.head_commit.message, '[oactc-golden-time-lean]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/formalize/oactc-golden-time-fiber-tomography-v2-20260831
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install pinned Lean toolchain
        run: tools/scripts/workflow/install-lean-toolchain.sh lean-toolchain --github-path "$GITHUB_PATH"
      - name: Restore Lean dependencies
        run: lake update
      - name: Build target modules
        shell: bash
        run: |
          mkdir -p diagnostics
          set +e
          lake build \
            D5.S3.Analytic.GoldenTomography.FiniteVandermondeTomography \
            D5.S3.Observer.GoldenCoding.GoldenRationalShellRigidity \
            D5.S3.ObserverMemory.FourierFibers.FiniteCrystalTimeFrequencyBridge \
            D5.S3.ObserverMemory.FourierFibers.TimeShiftSpectralFiberTransport \
            D5.S3.ObserverMemory.FourierFibers.TemporalFiberObserverUpgrade \
            D5.S3.ObserverMemory.FourierFibers.TemporalReflectionBreakVisibility \
            D5.S3.ObserverMemory.FourierFibers.DegenerateModeHiddenFiber \
            D5.S3.ObserverMemory.FourierFibers.SymmetryBreakingObservabilityGain \
            D5.S3.ObserverMemory.FourierFibers.FiniteObservabilityKrylovCriterion \
            D5.S3.ObserverMemory.FourierFibers.GoldenScaleCharacterDeckBlindness \
            D5.S3.ObserverMemory.FourierFibers.SpectralFutureReadoutBridge \
            2>&1 | tee diagnostics/build.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > diagnostics/status
          exit 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oactc-golden-time-fiber-lean-diagnostics
          path: diagnostics
          if-no-files-found: error
          retention-days: 3
      - name: Enforce successful builds
        run: test "$(cat diagnostics/status)" = "0"
