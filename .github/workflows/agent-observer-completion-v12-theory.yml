name: agent-observer-completion-v12-theory

on:
  push:
    branches:
      - agent/theory/observer-completion-reflection-v12-20260829

permissions:
  contents: write

jobs:
  patch-theory:
    if: contains(github.event.head_commit.message, '[observer-v12-theory-followup]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/theory/observer-completion-reflection-v12-20260829
          fetch-depth: 0
      - name: Apply theory follow-up
        run: python .github/scripts/agent-observer-completion-v12-theory-followup.py
      - name: Validate theory structure
        shell: bash
        run: |
          python -m py_compile .github/scripts/agent-observer-completion-v12-theory-followup.py
          python - <<'PY'
          from pathlib import Path
          text = Path('docs/develop/theory/FORMAL_OBSERVER_COMPLETION_REFLECTION.md').read_text(encoding='utf-8')
          required = [
              '**版本：v1.2.1，2026-08-29**',
              '\\operatorname{Hol}_q(w,x)',
              'T(x)=x\\vee\\bigvee_{i\\in I}C_i(x)',
              '接口侧采用“更细信息更大”的顺序',
          ]
          missing = [item for item in required if text.count(item) == 0]
          if missing:
              raise SystemExit(f'missing theory follow-up markers: {missing}')
          if '**版本：v1.2，2026-08-29**' in text:
              raise SystemExit('obsolete v1.2 version marker remains')
          PY
          git diff --check
      - name: Commit theory follow-up
        run: |
          git config user.name "AlyciaBHZ"
          git config user.email "50111876+AlyciaBHZ@users.noreply.github.com"
          git add docs/develop/theory/FORMAL_OBSERVER_COMPLETION_REFLECTION.md
          git commit -m "refine pointed holonomy and common closure direction"
          git push origin HEAD:agent/theory/observer-completion-reflection-v12-20260829
