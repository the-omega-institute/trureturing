name: agent-observer-completion-v12-theory

on:
  push:
    branches:
      - agent/theory/observer-completion-reflection-v12-20260829

permissions:
  contents: write

jobs:
  patch-theory:
    if: contains(github.event.head_commit.message, '[observer-v12-theory]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/theory/observer-completion-reflection-v12-20260829
          fetch-depth: 0
      - name: Apply theory refinement
        run: python .github/scripts/agent-observer-completion-v12-theory.py
      - name: Validate theory structure
        shell: bash
        run: |
          python -m py_compile .github/scripts/agent-observer-completion-v12-theory.py
          python - <<'PY'
          from pathlib import Path
          text = Path('docs/develop/theory/FORMAL_OBSERVER_COMPLETION_REFLECTION.md').read_text(encoding='utf-8')
          required = [
              '**版本：v1.2，2026-08-29**',
              '## 0.1 三类 completion 与 effective-image 纪律',
              '# 1A. 接口运算与 kernel 演算',
              '# 7A. 有限深度完成塔',
              '# 9A. Agency enrichment 与可见环 holonomy',
              '# 13. 记忆商与 effective-image 下降',
              '# 24. 局部 closure、gluing 与公共固定点',
              '# 24A. Structural completion locus 演算',
              '# 27. Lean owner 取址与剩余 frontier',
          ]
          missing = [item for item in required if text.count(item) != 1]
          if missing:
              raise SystemExit(f'missing or duplicated theory markers: {missing}')
          if '保持有向 join，才能保证该迭代稳定' in text:
              raise SystemExit('obsolete directed-join requirement remains')
          PY
          git diff --stat
      - name: Commit theory refinement
        run: |
          git config user.name "AlyciaBHZ"
          git config user.email "50111876+AlyciaBHZ@users.noreply.github.com"
          git add docs/develop/theory/FORMAL_OBSERVER_COMPLETION_REFLECTION.md
          git commit -m "refine observer completion theory before formalization"
          git push origin HEAD:agent/theory/observer-completion-reflection-v12-20260829
