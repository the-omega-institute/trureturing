name: Compile cold Lean Release inputs

on:
  workflow_call:
    inputs:
      strategy:
        description: Automatic, previous Release, or parallel cold build
        type: string
        default: auto
      sparse-volume:
        description: Named verification volume namespace to probe before Actions caches
        type: string
        default: ''
      indexed:
        description: Check the published module index before scheduling a cold build
        type: boolean
        default: false
    outputs:
      seed:
        description: Effective Release seed selection for the checked-out source
        value: ${{ jobs.common.outputs.seed }}
      sparse:
        description: A matching checked Release volume was selected for sparse installation
        value: ${{ jobs.common.outputs.sparse }}
      base:
        description: Selected Release tag, producer and manifest digest
        value: ${{ jobs.common.outputs.base }}

permissions:
  contents: read
  actions: read

jobs:
  common:
    name: Select Release seeds and compile shared imports
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    outputs:
      seed: ${{ steps.route.outputs.seed }}
      sparse: ${{ steps.sparse.outputs.found || 'false' }}
      base: ${{ steps.sparse.outputs.found == 'true' && toJSON(steps.sparse.outputs) || steps.previous.outputs.found == 'true' && toJSON(steps.previous.outputs) || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the tools pinned by the workflow commit
        run: |
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          python3 .github/scripts/install-tools.py
      - id: sparse
        if: inputs.sparse-volume != '' && contains(fromJSON('["auto","release"]'), inputs.strategy)
        uses: ./.github/actions/lean-release-base
        env:
          GH_TOKEN: ${{ github.token }}
          LEAN_CACHE_RELEASE_SPARSE_ONLY: '1'
          LEAN_CACHE_VOLUME_TEST_ID: ${{ inputs.sparse-volume }}
        with:
          operation: select-base
          previous-commit-only: ${{ inputs.strategy == 'release' }}
      - name: Install the pinned Lean header parser for the cache lookup
        if: inputs.indexed && steps.sparse.outputs.found != 'true' && inputs.strategy == 'auto'
        run: tools/scripts/workflow/install-lean-toolchain.sh lean-toolchain --github-path "$GITHUB_PATH"
      - id: indexed
        name: Check whether the published module index covers this checkout
        if: inputs.indexed && steps.sparse.outputs.found != 'true' && inputs.strategy == 'auto'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=tools/scripts/worktree python3 - <<'PYTHON'
          import os
          from pathlib import Path
          from lean_module_cache import checkout_targets
          from lean_module_remote import Remote

          root = Path.cwd()
          index = Remote(root).latest()
          if index is not None:
              _, targets = checkout_targets(root)
              published = index['targets']
              if targets and all(published.get(name, {}).get('key') == target['key']
                                 for name, target in targets.items()):
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                      print('complete=true', file=output)
          PYTHON
      - id: previous
        if: inputs.strategy != 'parallel' && steps.sparse.outputs.found != 'true' && steps.indexed.outputs.complete != 'true'
        uses: ./.github/actions/lean-release-base
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          operation: select-base
          previous-commit-only: ${{ inputs.strategy == 'release' }}
      - id: route
        env:
          INDEXED: ${{ steps.indexed.outputs.complete }}
          PREVIOUS: ${{ steps.sparse.outputs.found == 'true' || steps.previous.outputs.found == 'true' }}
          STRATEGY: ${{ inputs.strategy }}
        run: |
          if [[ "$INDEXED" == true ]]; then
            echo 'seed=auto' >> "$GITHUB_OUTPUT"
          elif [[ "$PREVIOUS" == true ]]; then
            echo 'seed=release' >> "$GITHUB_OUTPUT"
          elif [[ "$STRATEGY" == release ]]; then
            echo 'No compatible published Release for the requested rolling verification.' >&2
            exit 1
          else
            echo 'seed=parallel' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.route.outputs.seed == 'parallel'
        uses: ./.github/actions/lean-compile-layer
        with:
          stage: common

  worker:
    name: Compile exclusive Lean modules (${{ matrix.stage }})
    needs: common
    if: needs.common.outputs.seed == 'parallel'
    strategy:
      fail-fast: false
      matrix:
        stage: [0, 1, 2, 3]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python3 .github/scripts/install-tools.py
      - uses: ./.github/actions/lean-compile-layer
        with:
          stage: ${{ matrix.stage }}
