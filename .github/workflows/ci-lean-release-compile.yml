name: Compile cold Lean Release inputs

on:
  workflow_call:
    inputs:
      source:
        description: Protected commit selected for publication
        required: true
        type: string
      strategy:
        description: Automatic, previous Release, or parallel cold build
        type: string
        default: auto
      publication-mode:
        description: Protected production or integration verification
        type: string
        default: production
      sparse-volume:
        description: Named verification volume namespace to probe before Actions caches
        type: string
        default: ''
      indexed:
        description: Check the sharded Actions seed before scheduling a cold build
        type: boolean
        default: false
    outputs:
      seed:
        description: Effective Release seed selection for the checked-out source
        value: ${{ jobs.common.outputs.seed }}
      sparse:
        description: A matching checked Release volume was selected for sparse installation
        value: ${{ jobs.common.outputs.sparse }}
      base:
        description: Selected Release tag, producer and manifest digest
        value: ${{ jobs.common.outputs.base }}

permissions:
  contents: read
  actions: read

jobs:
  common:
    name: Select Release seeds and compile shared imports
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    outputs:
      seed: ${{ steps.route.outputs.seed }}
      sparse: ${{ steps.sparse.outputs.found || 'false' }}
      base: ${{ steps.sparse.outputs.found == 'true' && toJSON(steps.sparse.outputs) || steps.previous.outputs.found == 'true' && toJSON(steps.previous.outputs) || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      # Historical manual sources continue through their own publication entry.
      - id: support
        shell: bash
        run: |
          if [[ -f .github/actions/lean-compile-layer/action.yml ]]; then
            python3 .github/scripts/install-tools.py
            test -f tools/scripts/worktree/lean_compile_layers.py
            echo 'supported=true' >> "$GITHUB_OUTPUT"
          fi
      - id: sparse
        if: >-
          steps.support.outputs.supported == 'true' && inputs.publication-mode == 'verification' &&
          inputs.sparse-volume != '' && contains(fromJSON('["auto","release"]'), inputs.strategy)
        uses: ./.github/actions/lean-release-base
        env:
          GH_TOKEN: ${{ github.token }}
          LEAN_CACHE_RELEASE_SPARSE_ONLY: '1'
          LEAN_CACHE_VOLUME_TEST_ID: ${{ inputs.sparse-volume }}
        with:
          operation: select-base
          previous-commit-only: ${{ inputs.strategy == 'release' }}
          mode: verification
      - id: keys
        if: steps.support.outputs.supported == 'true' && steps.sparse.outputs.found != 'true' && inputs.strategy == 'auto'
        run: python3 tools/scripts/worktree/lean_actions.py keys --repository "$GITHUB_WORKSPACE"
      - id: indexed
        if: inputs.indexed && steps.keys.outputs.project_key != ''
        uses: ./.github/actions/lean-cache-shards
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          operation: lookup
      - id: native
        if: steps.keys.outputs.project_key != '' && steps.indexed.outputs.complete != 'true'
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: ${{ steps.keys.outputs.project_archive_path }}
          key: ${{ steps.keys.outputs.project_key }}
          restore-keys: ${{ steps.keys.outputs.project_restore_prefix }}
          lookup-only: true
      - id: previous
        if: inputs.strategy != 'parallel' && steps.sparse.outputs.found != 'true' && steps.support.outputs.supported == 'true' && steps.indexed.outputs.complete != 'true' && steps.native.outputs.cache-matched-key == '' && hashFiles('.github/actions/lean-release-base/action.yml') != ''
        uses: ./.github/actions/lean-release-base
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          operation: select-base
          previous-commit-only: ${{ inputs.strategy == 'release' }}
          mode: ${{ inputs.publication-mode }}
      - id: route
        if: steps.support.outputs.supported == 'true'
        env:
          NATIVE: ${{ steps.native.outputs.cache-matched-key }}
          INDEXED: ${{ steps.indexed.outputs.complete }}
          PREVIOUS: ${{ steps.sparse.outputs.found == 'true' || steps.previous.outputs.found == 'true' }}
          STRATEGY: ${{ inputs.strategy }}
        run: |
          if [[ -n "$NATIVE" ]]; then
            echo 'seed=legacy' >> "$GITHUB_OUTPUT"
          elif [[ "$INDEXED" == true ]]; then
            echo 'seed=auto' >> "$GITHUB_OUTPUT"
          elif [[ "$PREVIOUS" == true ]]; then
            echo 'seed=release' >> "$GITHUB_OUTPUT"
          elif [[ "$STRATEGY" == release ]]; then
            echo 'No compatible published Release for the requested rolling verification.' >&2
            exit 1
          else
            echo 'seed=parallel' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.route.outputs.seed == 'parallel'
        uses: ./.github/actions/lean-compile-layer
        with:
          stage: common

  worker:
    name: Compile exclusive Lean modules (${{ matrix.stage }})
    needs: common
    if: needs.common.outputs.seed == 'parallel'
    strategy:
      fail-fast: false
      matrix:
        stage: [0, 1, 2, 3]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - run: python3 .github/scripts/install-tools.py
      - uses: ./.github/actions/lean-compile-layer
        with:
          stage: ${{ matrix.stage }}
