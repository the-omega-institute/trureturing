name: One-shot complete canonical ZeroData

on:
  push:
    branches:
      - lane/math/rh-canonical-zero-data-nonvacuity-20260903

permissions:
  contents: write

concurrency:
  group: one-shot-canonical-zero-data
  cancel-in-progress: false

jobs:
  port-and-assemble:
    if: github.repository == 'the-omega-institute/trureturing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: lane/math/rh-canonical-zero-data-nonvacuity-20260903

      - name: Generate proof-complete Gamma, RvM, ZeroData, blueprints, and theory
        env:
          UPSTREAM_COMMIT: 2bafb8c88f177284a2123b5fefa2ff84e2365eb6
        run: python3 tools/scripts/one-shot-complete-canonical-zero-data.py

      - name: Commit generated sources and remove one-shot automation
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-complete-canonical-zero-data.yml
          rm -f tools/scripts/one-shot-complete-canonical-zero-data.py
          git config user.name "trureturing automation"
          git config user.email "50111876+AlyciaBHZ@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "formalize: complete unconditional canonical zeta ZeroData"
          git push origin HEAD:lane/math/rh-canonical-zero-data-nonvacuity-20260903
