# BOOTSTRAP-NOT-ACTIVE until this workflow and the C# harness exist on dev.
name: admission

on:
  push:
    branches: [dev]
  pull_request_target:
    branches: [dev, 'integration-**']
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# PR 侧按 PR 号分组并取消在途:同一 PR 连续推送时,旧 run 的结论已无意义。
#
# dev push 侧不同:它的必查早已在 PR 上跑过,这一趟**存在的理由就是把缓存写进去**
# (elan、lake build artifacts、canonical Lean report),而三个 save 都在 job 末尾。
# 用 github.ref 分组意味着所有 dev push 共用一个组,于是下一次合并会取消上一次。
#
# 【2026-08-11 勘误】本注释原引「近 30 次 dev push 23 次 cancelled、仅 6 次 success(20%)」
# 并据此断言「缓存几乎从来没被写进去过」——**取样有偏,结论过强**,由第十一轮面板证伪。
# 同口径全窗(最近 100 次 dev push)是 **56 success / 43 cancelled / 1 failure = 56% 成功**;
# 那个 20% 取自最忙的尾窗,不能当普遍前提。缓存**一直在被写入**,只是被取消的那部分没写成。
# 本改动仍然成立(取消是真实且不必要的丢失),但它买到的是「少丢一部分写入」,
# 不是「从不写变成写」。其效果**尚未被测量**:落地后窗口内成功的 PR run 数一度为 0。
#
# 改用 github.sha:每次 dev push 自成一组,彼此既不取消也不排队。
# 代价是这些 run 会跑完而不是中途被杀 —— 它们本来就已启动,增量是其尾段。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# Trust topology: pull_request_target supplies the event context; candidate-owned
# Lean producer and .NET judge inspect candidate content. Candidate engineering is
# only a signal. Admission consumes immutable raw reports from the predecessor job;
# the protected base exists only as the merge-base SHA passed to the gate.
jobs:
  candidate-engineering:
    name: Candidate harness engineering checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate

      - name: Decide candidate engineering scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          engineering_triggers=(
            "tools"
            "Makefile"
            ".github"
            "global.json"
            "Directory.Build.props"
            "Directory.Packages.props"
            "lean-toolchain"
            "lakefile.toml"
            "lake-manifest.json"
            "Golden/Projection"
            "Meta/FILEMAP.toml"
          )
          run="true"
          reason="dev push always runs the union engineering check"
          base_sha="not-applicable"
          changed_count="0"
          matched_count="0"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            run="true"
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request_target" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            git -C candidate fetch --no-tags --quiet origin "$base" 2>/dev/null || true
            if ! base_sha="$(git -C candidate merge-base "$base" "$head" 2>/dev/null)"; then
              printf '%s\n' "cannot resolve fork point between $base and $head" >&2
              exit 1
            fi
            if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
              printf '%s\n' "pull request has no content-addressable merge-base" >&2
              exit 1
            fi
            mapfile -d '' -t changed_paths < <(
              git -C candidate diff --name-only -z --no-renames --diff-filter=ACDMRTUXB "$base_sha" "$head"
            )
            changed_count="${#changed_paths[@]}"
            matched_paths=()
            quoted_path=""
            for path in "${changed_paths[@]}"; do
              printf -v quoted_path '%q' "$path"
              printf 'ENGINEERING_SCOPE_CHANGED %s\n' "$quoted_path"
              for trigger in "${engineering_triggers[@]}"; do
                if [[ "$path" == "$trigger" || "$path" == "$trigger/"* ]]; then
                  printf 'ENGINEERING_SCOPE_MATCHED %s -> %s\n' "$quoted_path" "$trigger"
                  matched_paths+=("$path")
                fi
              done
            done
            matched_count="${#matched_paths[@]}"
            if [[ "$matched_count" -gt 0 ]]; then
              run="true"
              reason="merge-base diff intersects the harness trigger set"
            else
              run="false"
              reason="merge-base diff does not intersect the harness trigger set"
            fi
          else
            run="true"
            reason="unrecognized event fails closed to the full engineering check"
          fi
          printf 'ENGINEERING_SCOPE event=%s run=%s base=%s changed=%s matched=%s reason=%s\n' \
            "$GITHUB_EVENT_NAME" "$run" "$base_sha" "$changed_count" "$matched_count" "$reason"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "event=$GITHUB_EVENT_NAME" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "changed_count=$changed_count" >> "$GITHUB_OUTPUT"
          echo "matched_count=$matched_count" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      - name: Resolve judge binary content address before build outputs exist
        id: judge-address
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          address="${{ hashFiles('candidate/tools/**', 'candidate/Blueprint/**/*.scribe.cs', 'candidate/Directory.*', 'candidate/global.json') }}"
          [[ "$address" =~ ^[0-9a-f]{64}$ ]]
          echo "address=$address" >> "$GITHUB_OUTPUT"

      - name: Resolve pinned Lean toolchain
        id: lean
        if: steps.scope.outputs.run == 'true'
        shell: bash
        env:
          LEAN_TOOLCHAIN_FILE: candidate/lean-toolchain
        run: |
          set -euo pipefail
          test -s "$LEAN_TOOLCHAIN_FILE"
          echo "file=$LEAN_TOOLCHAIN_FILE" >> "$GITHUB_OUTPUT"
          echo "hash=$(sha256sum "$LEAN_TOOLCHAIN_FILE" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Restore elan and pinned Lean toolchain
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-${{ runner.arch }}-elan-${{ steps.lean.outputs.hash }}
          # 前缀回退保留,让候选工程 job 可以复用 inspect job 写入的相近工具链缓存。
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-elan-

      - name: Install pinned Lean toolchain for producer integration tests
        id: install-elan
        if: steps.scope.outputs.run == 'true'
        shell: bash
        env:
          LEAN_TOOLCHAIN_FILE: ${{ steps.lean.outputs.file }}
        run: |
          if [[ ! -x "$GITHUB_WORKSPACE/candidate/tools/scripts/workflow/install-lean-toolchain.sh" ]]; then
            printf '%s\n' "candidate Lean toolchain installer is absent (merge dev to pick it up)" >&2
            exit 1
          fi
          "$GITHUB_WORKSPACE/candidate/tools/scripts/workflow/install-lean-toolchain.sh" "$LEAN_TOOLCHAIN_FILE" --github-path "$GITHUB_PATH"

      - name: Install pinned SDK
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: candidate/global.json

      - name: Restore candidate locked dependencies
        if: steps.scope.outputs.run == 'true'
        run: |
          dotnet restore candidate/tools/tests/CompileFailProof/CompileFailProof.csproj --locked-mode
          dotnet restore candidate/tools/tests/BannedApiCompileFailProof/BannedApiCompileFailProof.csproj --locked-mode

      - name: Build candidate with warnings as errors
        if: steps.scope.outputs.run == 'true'
        run: make -C candidate/tools dotnet

      - name: Run candidate golden and integration tests
        if: steps.scope.outputs.run == 'true'
        run: make -C candidate/tools test

      - name: Run candidate selftest twice and compare bytes
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: make -C candidate/tools selftest

      - name: Prove missing capability does not compile
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set +e
          output="$(dotnet build candidate/tools/tests/CompileFailProof/CompileFailProof.csproj --no-restore --configuration Release 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -F "CS7036" <<<"$output"
          grep -F "MetaClear" <<<"$output"

      - name: Prove banned deterministic APIs do not compile
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          proof="candidate/tools/tests/BannedApiCompileFailProof/BannedApiViolations.cs"
          set +e
          output="$(dotnet build candidate/tools/tests/BannedApiCompileFailProof/BannedApiCompileFailProof.csproj --no-restore --configuration Release 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          mapfile -t expected_lines < <(grep -nF "// banned-api-proof" "$proof" | cut -d: -f1)
          mapfile -t actual_lines < <(
            sed -n 's#.*BannedApiViolations.cs(\([0-9][0-9]*\),[0-9][0-9]*): error RS0030:.*#\1#p' <<<"$output" | sort -nu
          )
          test "${#expected_lines[@]}" -gt 0
          test "${#actual_lines[@]}" -eq "${#expected_lines[@]}"
          test -z "$(grep -F ': error ' <<<"$output" | grep -vF ': error RS0030:' || true)"
          index=0
          for expected_line in "${expected_lines[@]}"; do
            test "${actual_lines[$index]}" = "$expected_line"
            ((index += 1))
          done

      - name: Stage judge binaries for the shared cache (dev push only)
        id: stage-judge
        if: steps.scope.outputs.run == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/dev'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .judge-binaries/cli .judge-binaries/scribe
          dotnet publish candidate/tools/StrataLint.Cli/StrataLint.Cli.csproj \
            --configuration Release --no-build --output .judge-binaries/cli
          dotnet publish candidate/tools/StrataLint.Scribe/StrataLint.Scribe.csproj \
            --configuration Release --no-build --output .judge-binaries/scribe
          test -s .judge-binaries/cli/StrataLint.dll
          test -s .judge-binaries/scribe/StrataLint.Scribe.dll

      - name: Save judge binaries by content address (dev push only)
        if: steps.scope.outputs.run == 'true' && steps.stage-judge.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/cache/save@v4
        with:
          path: .judge-binaries
          key: stratalint-judge-binaries-v1-${{ runner.os }}-${{ steps.judge-address.outputs.address }}

      - name: Save elan toolchain for engineering checks (dev push only)
        if: steps.scope.outputs.run == 'true' && always() && steps.install-elan.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/cache/save@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-${{ runner.arch }}-elan-${{ steps.lean.outputs.hash }}

      - name: Summarize candidate engineering scope
        if: always()
        shell: bash
        env:
          SCOPE_EVENT: ${{ steps.scope.outputs.event }}
          SCOPE_RUN: ${{ steps.scope.outputs.run }}
          SCOPE_BASE: ${{ steps.scope.outputs.base_sha }}
          SCOPE_CHANGED_COUNT: ${{ steps.scope.outputs.changed_count }}
          SCOPE_MATCHED_COUNT: ${{ steps.scope.outputs.matched_count }}
          SCOPE_REASON: ${{ steps.scope.outputs.reason }}
        run: |
          set -euo pipefail
          result="$SCOPE_RUN"
          if [[ -z "$result" ]]; then
            result="unavailable"
          fi
          {
            printf '%s\n' '## Candidate engineering scope'
            printf '\n'
            printf -- '- Event: %s\n' "$SCOPE_EVENT"
            printf -- '- Run engineering: %s\n' "$result"
            printf -- '- Merge-base: %s\n' "$SCOPE_BASE"
            printf -- '- Changed paths: %s\n' "$SCOPE_CHANGED_COUNT"
            printf -- '- Trigger matches: %s\n' "$SCOPE_MATCHED_COUNT"
            printf -- '- Decision: %s\n' "$SCOPE_REASON"
            printf -- '%s\n' '- Detail: see the ENGINEERING_SCOPE_CHANGED and ENGINEERING_SCOPE_MATCHED log lines of the scope step.'
          } >> "$GITHUB_STEP_SUMMARY"

  lean-inspect:
    name: Canonical Lean report production
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    outputs:
      baseline_sha: ${{ steps.base.outputs.sha }}
    steps:
      - name: Check out candidate with history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate

      - name: Resolve judge binary content address before build outputs exist
        id: judge-address
        shell: bash
        run: |
          set -euo pipefail
          address="${{ hashFiles('candidate/tools/**', 'candidate/Blueprint/**/*.scribe.cs', 'candidate/Directory.*', 'candidate/global.json') }}"
          [[ "$address" =~ ^[0-9a-f]{64}$ ]]
          echo "address=$address" >> "$GITHUB_OUTPUT"

      - name: Restore judge binaries
        id: judge-cache
        uses: actions/cache/restore@v4
        with:
          path: .judge-binaries
          key: stratalint-judge-binaries-v1-${{ runner.os }}-${{ steps.judge-address.outputs.address }}

      - name: Resolve dev merge-base content address
        id: base
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request_target" ]]; then
            # 法官取候选的**分叉点**,不是 dev 的当前 tip。dev 在候选在飞期间前进时,
            # tip 上新落地的规则会追溯审判候选没碰过的东西;分叉点让候选只对它出发时
            # 已存在的 harness 负责。这也让法官二进制、冻结账本与旧侧 Lean 报告
            # 取自同一棵树,故不会重演 PR #1144 的两树一报。
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            git -C candidate fetch --no-tags --quiet origin "$base" 2>/dev/null || true
            if ! sha="$(git -C candidate merge-base "$base" "$head" 2>/dev/null)"; then
              printf '%s\n' "cannot resolve fork point between $base and $head" >&2
              exit 1
            fi
            # The fork point is the right base for rules; it is the wrong base for the ground
            # those rules stand on. A branch that departed before the base moved a pin builds
            # against a toolchain that will not exist after the merge, and reports the mismatch
            # as broken mathematics in modules it never touched.
            bash tools/scripts/checks/check-environment-pin-staleness.sh \
              "$base" "$sha" "$head" candidate
          else
            sha="${{ github.event.before }}"
            if [[ -z "$sha" || "$sha" =~ ^0+$ ]]; then
              sha="$(git -C candidate rev-parse "$GITHUB_SHA^")"
            fi
          fi
          if [[ -z "$sha" || "$sha" =~ ^0+$ ]]; then
            printf '%s\n' "event has no content-addressable base SHA" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Resolve candidate canonical Lean report address
        id: lean-report-input
        shell: bash
        run: |
          set -euo pipefail
          helper="$GITHUB_WORKSPACE/candidate/tools/scripts/report/lean-report-input.sh"
          test -x "$helper"
          read -r address _ _ \
            <<< "$("$helper" address --repository "$GITHUB_WORKSPACE/candidate")"
          [[ "$address" =~ ^[0-9a-f]{64}$ ]]
          echo "address=$address" >> "$GITHUB_OUTPUT"
          # 报告地址的原像是 producer(MSBuild 求值的 Cli/Engine Compile 集 + 声明的
          # project/build/lock/global 输入 + inspector)、Lean 源(Trureturing.lean +
          # D5/**/*.lean)与 config(toolchain/lake-manifest/lakefile)三者的清单哈希。

      # 一事不再理:报告是其输入闭包的纯函数,而该闭包已被内容寻址(上一步)。
      # dev push 早已把结果按同一 key 存下(下方 Save 步),theory-ingest 也已在读它;
      # 只有 CI 自己的关键路径从不读 —— 于是每个 PR 重付一次 lake 恢复 + 报告生产
      # (2026-08-11 实测 92s + 83s),哪怕闭包逐字节未变。
      #
      # 安全性不靠这一步:下游 `RawLeanReportArtifact.ReadFile` 会把报告里每个模块的
      # source_sha256 与树逐一对账,不符即抛 INFRASTRUCTURE_FAILURE。一份错的或陈旧的
      # 报告不可能被静默接受,最坏是红,不是假绿。
      - name: Restore canonical Lean report by input address
        id: report-cache
        uses: actions/cache/restore@v4
        with:
          path: .canonical-lean-report-cache
          key: stratalint-canonical-lean-report-v2-${{ steps.lean-report-input.outputs.address }}

      - name: Serve candidate canonical Lean report from the cached address
        id: report-reuse
        if: steps.report-cache.outputs.cache-hit == 'true'
        # 这一步失败必须**回落**到完整生产路径,而不是让整个 job 红:缓存是加速,不是权威。
        # 下面四个重活步骤的守卫是 `outcome != 'success'`,故失败与跳过都会走原路。
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          source="$GITHUB_WORKSPACE/.canonical-lean-report-cache/raw-lean-report.json"
          reports="$RUNNER_TEMP/raw-lean-reports"
          mkdir -p "$reports"
          # verify 需要 .sha256 旁文件(lean-report-input.sh:100),故一并要求存在。
          for suffix in '' .sha256 .input.attestation .provenance.json; do
            test -s "${source}${suffix}"
          done
          helper="$GITHUB_WORKSPACE/candidate/tools/scripts/report/lean-report-input.sh"
          # 缓存条目对候选树重新验一次地址与报告哈希;不符即整体回落,不静默使用。
          "$helper" verify --repository "$GITHUB_WORKSPACE/candidate" --report "$source"
          for suffix in '' .input.attestation .provenance.json; do
            cp "${source}${suffix}" "$reports/candidate-lean-report.json${suffix}"
          done
          printf '%s  %s\n' \
            "$(sha256sum "$reports/candidate-lean-report.json" | cut -d ' ' -f 1)" \
            "candidate-lean-report.json" > "$reports/candidate-lean-report.json.sha256"
          printf '%s\n' "canonical Lean reports served from cached input address" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore elan and pinned Lean toolchains
        if: steps.report-reuse.outcome != 'success'
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-${{ runner.arch }}-elan-${{ hashFiles('candidate/lean-toolchain') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-elan-

      - name: Install pinned Lean toolchains
        id: install-elan
        if: steps.report-reuse.outcome != 'success'
        shell: bash
        run: |
          if [[ ! -x "$GITHUB_WORKSPACE/candidate/tools/scripts/workflow/install-lean-toolchain.sh" ]]; then
            printf '%s\n' "candidate Lean toolchain installer is absent (merge dev to pick it up)" >&2
            exit 1
          fi
          "$GITHUB_WORKSPACE/candidate/tools/scripts/workflow/install-lean-toolchain.sh" candidate/lean-toolchain

      - name: Install pinned SDK for statement projection reconciliation
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: candidate/global.json

      - name: Build Scribe binary on judge cache miss
        if: steps.judge-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .judge-binaries/scribe
          dotnet build candidate/tools/StrataLint.Scribe/StrataLint.Scribe.csproj \
            --configuration Release \
            --output .judge-binaries/scribe

      - name: Restore candidate Lean build artifacts
        if: steps.report-reuse.outcome != 'success'

        uses: actions/cache/restore@v4
        with:
          path: |
            candidate/.lake
            ~/.cache/mathlib
          key: ${{ runner.os }}-${{ runner.arch }}-lake-${{ hashFiles('candidate/lake-manifest.json') }}-${{ hashFiles('candidate/lean-toolchain') }}-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-lake-${{ hashFiles('candidate/lake-manifest.json') }}-${{ hashFiles('candidate/lean-toolchain') }}-

      - name: Produce source-bound canonical Lean reports
        if: steps.report-reuse.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          producer="$GITHUB_WORKSPACE/candidate/tools/lean-inspector/inspect.sh"
          pair_producer="$GITHUB_WORKSPACE/candidate/tools/scripts/lean-report-pair.sh"
          test -x "$producer"
          test -f "$GITHUB_WORKSPACE/candidate/tools/lean-inspector/Inspector.lean"
          test -x "$pair_producer"
          reports="$RUNNER_TEMP/raw-lean-reports"
          mkdir -p "$reports"
          # 只产候选侧。base 只作为 merge-base SHA 传给 admission gate 的 diff 语义,
          # 不再为它编译或上传第二份 Lean 报告。
          "$pair_producer" \
            --producer "$producer" \
            --lake-bin "$HOME/.elan/bin/lake" \
            --candidate-root "$GITHUB_WORKSPACE/candidate" \
            --candidate-output "$reports/candidate-lean-report.json"

      - name: Run complete mathematical content checks
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/raw-lean-reports/candidate-lean-report.json"
          scribe="$GITHUB_WORKSPACE/.judge-binaries/scribe/StrataLint.Scribe.dll"
          test -s "$report"
          test -s "$scribe"
          cd "$GITHUB_WORKSPACE/candidate"
          STRATALINT_LEAN_REPORT="$report" dotnet "$scribe" projections --check --report "$report"
          STRATALINT_LEAN_REPORT="$report" dotnet "$scribe" emit --check
          STRATALINT_LEAN_REPORT="$report" dotnet "$scribe" emit-values --check
          STRATALINT_LEAN_REPORT="$report" dotnet "$scribe" describe-report --check

      - name: Stage candidate canonical Lean report cache
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/raw-lean-reports/candidate-lean-report.json"
          target="$GITHUB_WORKSPACE/.canonical-lean-report-cache/raw-lean-report.json"
          mkdir -p "$(dirname "$target")"
          for suffix in '' .input.attestation .provenance.json; do
            test -s "${source}${suffix}"
            cp "${source}${suffix}" "${target}${suffix}"
          done
          read -r declaredSha256 declaredName < "${source}.sha256"
          reportSha256="$(sha256sum "$target" | cut -d ' ' -f 1)"
          test "$declaredSha256" = "$reportSha256"
          test "$declaredName" = "$(basename "$source")"
          printf '%s  %s\n' "$reportSha256" "$(basename "$target")" > "${target}.sha256"
          "$GITHUB_WORKSPACE/candidate/tools/scripts/report/lean-report-input.sh" verify \
            --repository "$GITHUB_WORKSPACE/candidate" \
            --report "$target"

      # pull_request_target runs get a token without cache-write scope, so this save
      # can only ever fail there: run 31389667812 logged "cache write denied: token has
      # no writable scopes". The two saves below already carry this exact guard; this
      # one was missing it, so every PR attempted a write it could not perform. dev-push
      # runs do write it successfully (run 31389340892).
      # 命中缓存时 elan/lake 目录未被恢复也未被填充,回存会写入空态并污染下一轮;
      # 报告 key 也已存在,重写无意义。三个 save 一律只在真正跑过生产路径时执行。
      - name: Save candidate canonical Lean report (dev push only)
        if: success() && steps.report-reuse.outcome != 'success' && github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/cache/save@v4
        with:
          path: .canonical-lean-report-cache
          key: stratalint-canonical-lean-report-v2-${{ steps.lean-report-input.outputs.address }}

      - name: Upload raw Lean reports and producer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-lean-reports
          path: ${{ runner.temp }}/raw-lean-reports
          if-no-files-found: warn
          retention-days: 7

      # 命中缓存时 elan/lake 目录未被恢复也未被填充,回存会写入空态并污染下一轮;
      # 报告 key 也已存在,重写无意义。三个 save 一律只在真正跑过生产路径时执行。
      - name: Save elan toolchains (dev push only)
        # 不挂在 success() 上:elan 装成功就该存。否则一次下载失败会让 job 红、缓存不写、
        # 下次继续 miss,故障自我延续。
        if: always() && steps.install-elan.outcome == 'success' && steps.report-reuse.outcome != 'success' && github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/cache/save@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-${{ runner.arch }}-elan-${{ hashFiles('candidate/lean-toolchain') }}

      # 命中缓存时 elan/lake 目录未被恢复也未被填充,回存会写入空态并污染下一轮;
      # 报告 key 也已存在,重写无意义。三个 save 一律只在真正跑过生产路径时执行。
      - name: Save Lean build artifacts (dev push only)
        if: success() && steps.report-reuse.outcome != 'success' && github.event_name == 'push' && github.ref == 'refs/heads/dev'
        continue-on-error: true
        timeout-minutes: 12
        uses: actions/cache/save@v4
        with:
          path: |
            candidate/.lake
            ~/.cache/mathlib
          key: ${{ runner.os }}-${{ runner.arch }}-lake-${{ hashFiles('candidate/lake-manifest.json') }}-${{ hashFiles('candidate/lean-toolchain') }}-${{ github.event.pull_request.head.sha || github.sha }}

  baseline-admission:
    name: Content-addressed dev baseline admission
    needs: lean-inspect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEV_BASELINE_SHA: ${{ needs.lean-inspect.outputs.baseline_sha }}
    steps:
      - name: Check out candidate with history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate

      - name: Resolve judge binary content address before build outputs exist
        id: judge-address
        shell: bash
        run: |
          set -euo pipefail
          address="${{ hashFiles('candidate/tools/**', 'candidate/Blueprint/**/*.scribe.cs', 'candidate/Directory.*', 'candidate/global.json') }}"
          [[ "$address" =~ ^[0-9a-f]{64}$ ]]
          echo "address=$address" >> "$GITHUB_OUTPUT"

      - name: Restore judge binaries
        id: judge-cache
        uses: actions/cache/restore@v4
        with:
          path: .judge-binaries
          key: stratalint-judge-binaries-v1-${{ runner.os }}-${{ steps.judge-address.outputs.address }}

      - name: Install pinned SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: candidate/global.json

      - name: Download canonical Lean reports
        uses: actions/download-artifact@v4
        with:
          name: raw-lean-reports
          path: ${{ runner.temp }}/raw-lean-reports

      - name: Verify report content addresses
        shell: bash
        working-directory: ${{ runner.temp }}/raw-lean-reports
        run: |
          set -euo pipefail
          sha256sum -c candidate-lean-report.json.sha256

      - name: Run the harness gate with the candidate's own judge
        shell: bash
        env:
          STRATALINT_TIMING: ${{ runner.temp }}/gate-timing.jsonl
        run: |
          set -euo pipefail
          # 候选用自己的法官审自己的内容。法官程序在 43% 的合并里与 base 逐字节相同,
          # 那些情况下用哪个是恒等的;其余情况新规则本就该立即对自己生效。
          # base 仍然只提供一个 immutable SHA 给 diff 语义,不需要 checkout 或编译 base 代码
          # —— 而正是那次编译让 dev 一坏就谁都进不来
          # (2026-08-13 两次:SL-003 锁死七个在飞 PR;法官自检失败后连修它的 PR 也挡在外面)。
          gate="$GITHUB_WORKSPACE/candidate/.github/scripts/harness-gate.sh"
          if [[ ! -x "$gate" ]]; then
            printf '%s\n' "candidate harness gate is absent" >&2
            exit 1
          elif ! grep -qF -- '--candidate-lean-report' "$gate"; then
            printf '%s\n' "candidate gate cannot consume canonical Lean reports" >&2
            exit 1
          fi
          judge_args=()
          if [[ "${{ steps.judge-cache.outputs.cache-hit }}" == "true" ]]; then
            judge="$GITHUB_WORKSPACE/.judge-binaries/cli/StrataLint.dll"
            test -s "$judge"
            judge_args=(--judge-dll "$judge")
          fi
          set +e
          "$gate" \
            --candidate "$GITHUB_WORKSPACE/candidate" \
            --base "$DEV_BASELINE_SHA" \
            --candidate-lean-report "$RUNNER_TEMP/raw-lean-reports/candidate-lean-report.json" \
            "${judge_args[@]}" \
            2>&1 | tee "$RUNNER_TEMP/gate.log"
          rc="${PIPESTATUS[0]}"
          set -e
          if [[ "$rc" -ne 0 && "$rc" -ne 3 ]]; then
            echo "::error title=harness gate failed::rc=$rc; complete output was emitted above"
            printf '%s\n' "### harness gate FAILED rc=$rc" >> "$GITHUB_STEP_SUMMARY"
            exit "$rc"
          fi
          if [[ "$rc" -eq 3 ]]; then
            printf '%s\n' "### protected-surface change (SL-022); content checks passed" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Upload gate timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-timing
          path: ${{ runner.temp }}/gate-timing.jsonl
          if-no-files-found: warn
          retention-days: 7
