# BOOTSTRAP-NOT-ACTIVE until this workflow and the C# harness exist on dev.
name: admission

on:
  push:
    branches: [dev]
  pull_request_target:
    branches: [dev, 'integration-**']
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# PR 侧按 PR 号分组并取消在途:同一 PR 连续推送时,旧 run 的结论已无意义。
#
# dev push 侧不同:它的必查早已在 PR 上跑过,这一趟**存在的理由就是把缓存写进去**
# (elan、lake build artifacts、canonical Lean report),而三个 save 都在 job 末尾。
# 用 github.ref 分组意味着所有 dev push 共用一个组,于是下一次合并会取消上一次。
#
# 【2026-08-11 勘误】本注释原引「近 30 次 dev push 23 次 cancelled、仅 6 次 success(20%)」
# 并据此断言「缓存几乎从来没被写进去过」——**取样有偏,结论过强**,由第十一轮面板证伪。
# 同口径全窗(最近 100 次 dev push)是 **56 success / 43 cancelled / 1 failure = 56% 成功**;
# 那个 20% 取自最忙的尾窗,不能当普遍前提。缓存**一直在被写入**,只是被取消的那部分没写成。
# 本改动仍然成立(取消是真实且不必要的丢失),但它买到的是「少丢一部分写入」,
# 不是「从不写变成写」。其效果**尚未被测量**:落地后窗口内成功的 PR run 数一度为 0。
#
# 改用 github.sha:每次 dev push 自成一组,彼此既不取消也不排队。
# 代价是这些 run 会跑完而不是中途被杀 —— 它们本来就已启动,增量是其尾段。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# Trust topology: the pull_request_target workflow, Lean producer, and .NET judge
# all come from the content-addressed dev base. Candidate engineering is only a
# signal. Admission consumes immutable raw reports produced in a predecessor job.
jobs:
  candidate-engineering:
    name: Candidate harness engineering checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate

      - name: Resolve pinned Lean toolchain
        id: lean
        shell: bash
        env:
          LEAN_TOOLCHAIN_FILE: candidate/lean-toolchain
        run: |
          set -euo pipefail
          test -s "$LEAN_TOOLCHAIN_FILE"
          echo "file=$LEAN_TOOLCHAIN_FILE" >> "$GITHUB_OUTPUT"
          echo "hash=$(sha256sum "$LEAN_TOOLCHAIN_FILE" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Restore elan and pinned Lean toolchain
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-${{ runner.arch }}-elan-${{ steps.lean.outputs.hash }}

      - name: Install pinned Lean toolchain for producer integration tests
        shell: bash
        env:
          LEAN_TOOLCHAIN_FILE: ${{ steps.lean.outputs.file }}
        run: |
          set -euo pipefail
          toolchain="$(tr -d '\r\n' < "$LEAN_TOOLCHAIN_FILE")"
          test -n "$toolchain"
          if [[ ! -x "$HOME/.elan/bin/elan" ]]; then
            curl --proto '=https' --tlsv1.2 -sSf https://elan.lean-lang.org/elan-init.sh \
              | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          if ! "$HOME/.elan/bin/elan" toolchain list 2>/dev/null | grep -qF "$toolchain"; then
            "$HOME/.elan/bin/elan" toolchain install "$toolchain"
          fi
          "$HOME/.elan/bin/elan" default "$toolchain"
          "$HOME/.elan/bin/lake" --version

      - name: Install pinned SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: candidate/global.json

      - name: Restore candidate locked dependencies
        run: |
          dotnet restore candidate/Meta/StrataLint/CompileFailProof/CompileFailProof.csproj --locked-mode
          dotnet restore candidate/Meta/StrataLint/BannedApiCompileFailProof/BannedApiCompileFailProof.csproj --locked-mode

      - name: Build candidate with warnings as errors
        run: make -C candidate dotnet

      - name: Run candidate golden and integration tests
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request_target" ]]; then
            event=pull-request
            base="${{ github.event.pull_request.base.sha }}"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/dev" ]]; then
            event=dev-push
            base="${{ github.event.before }}"
          else
            printf '%s\n' "unrecognized test-selection event: $GITHUB_EVENT_NAME $GITHUB_REF" >&2
            exit 1
          fi
          git -C candidate diff --name-only "$base" HEAD > "$RUNNER_TEMP/changed-paths.txt"
          make -C candidate test-select EVENT="$event" CHANGED_PATHS_FILE="$RUNNER_TEMP/changed-paths.txt"

      - name: Run candidate selftest twice and compare bytes
        shell: bash
        run: make -C candidate selftest

      - name: Prove missing capability does not compile
        shell: bash
        run: |
          set +e
          output="$(dotnet build candidate/Meta/StrataLint/CompileFailProof/CompileFailProof.csproj --no-restore --configuration Release 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -F "CS7036" <<<"$output"
          grep -F "MetaClear" <<<"$output"

      - name: Prove banned deterministic APIs do not compile
        shell: bash
        run: |
          proof="candidate/Meta/StrataLint/BannedApiCompileFailProof/BannedApiViolations.cs"
          set +e
          output="$(dotnet build candidate/Meta/StrataLint/BannedApiCompileFailProof/BannedApiCompileFailProof.csproj --no-restore --configuration Release 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          mapfile -t expected_lines < <(grep -nF "// banned-api-proof" "$proof" | cut -d: -f1)
          mapfile -t actual_lines < <(
            sed -n 's#.*BannedApiViolations.cs(\([0-9][0-9]*\),[0-9][0-9]*): error RS0030:.*#\1#p' <<<"$output" | sort -nu
          )
          test "${#expected_lines[@]}" -gt 0
          test "${#actual_lines[@]}" -eq "${#expected_lines[@]}"
          test -z "$(grep -F ': error ' <<<"$output" | grep -vF ': error RS0030:' || true)"
          index=0
          for expected_line in "${expected_lines[@]}"; do
            test "${actual_lines[$index]}" = "$expected_line"
            ((index += 1))
          done

  lean-inspect:
    name: Canonical Lean report production
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    outputs:
      baseline_sha: ${{ steps.baseline.outputs.sha }}
    steps:
      - name: Check out candidate with history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate

      - name: Resolve dev baseline content address
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request_target" ]]; then
            sha="${{ github.event.pull_request.base.sha }}"
          else
            sha="${{ github.event.before }}"
            if [[ -z "$sha" || "$sha" =~ ^0+$ ]]; then
              sha="$(git -C candidate rev-parse "$GITHUB_SHA^")"
            fi
          fi
          if [[ -z "$sha" || "$sha" =~ ^0+$ ]]; then
            printf '%s\n' "event has no content-addressable dev baseline" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out content-addressed dev baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.baseline.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: baseline

      - name: Verify baseline checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C baseline rev-parse HEAD)"
          test "$actual" = "${{ steps.baseline.outputs.sha }}"
          printf '%s\n' "Lean producer base content address: $actual" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve candidate canonical Lean report address
        id: lean-report-input
        shell: bash
        run: |
          set -euo pipefail
          helper="$GITHUB_WORKSPACE/baseline/Meta/StrataLint/scripts/report/lean-report-input.sh"
          test -x "$helper"
          read -r address candidateProducer _ \
            <<< "$("$helper" address --repository "$GITHUB_WORKSPACE/candidate")"
          [[ "$address" =~ ^[0-9a-f]{64}$ ]]
          echo "address=$address" >> "$GITHUB_OUTPUT"
          # 报告地址的原像是 producer(MSBuild 求值的 Cli/Engine Compile 集 + 声明的
          # project/build/lock/global 输入 + inspector)、Lean 源(Trureturing.lean +
          # D5/**/*.lean)与 config(toolchain/lake-manifest/lakefile)三者的清单哈希。
          # 两侧同址 ⇒ 两份报告按定义逐字节相同,一份缓存可同时充当两份;不同址则不复用。
          if grep -Fq -- '--baseline)' "$helper" 2>/dev/null; then
            read -r baselineAddress baselineProducer _ \
              <<< "$("$helper" address --repository "$GITHUB_WORKSPACE/baseline" --baseline)"
            [[ "$baselineAddress" =~ ^[0-9a-f]{64}$ ]]
          else
            # The first dev push after this workflow lands executes the predecessor's
            # helper. Preserve that helper's old call shape and disable all reuse.
            read -r baselineAddress baselineProducer _ \
              <<< "$("$helper" address --repository "$GITHUB_WORKSPACE/baseline")"
            [[ "$baselineAddress" =~ ^[0-9a-f]{64}$ ]]
            echo "producer-consistent=false" >> "$GITHUB_OUTPUT"
            echo "pair-reusable=false" >> "$GITHUB_OUTPUT"
            printf '%s\n' "canonical Lean report cache disabled: baseline helper predates expanded producer identity; using full production" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # 地址的 producer 分量取自**候选**树,而实际执行的 producer 取自**基线**树
          # (base-owned 判官拓扑要求如此)。push 事件下 baseline = github.event.before,
          # 即上一个 dev tip(见 `Resolve dev baseline content address`),故一次改动了
          # lean-inspector 的合并会让两者不同:报告由**旧** producer 产出,却按**新** producer
          # 的地址归档 —— 地址声称的输入闭包与实际闭包不符,即第〇节合取②的违反。
          # `lean-report-input.sh verify` 只重算地址、不重跑 producer;`RawLeanReportArtifact`
          # 只核模块集与 source_sha256。二者都拦不住「同一份源、不同 producer 语义」。
          # 故 producer 不一致时既不写也不读该缓存,回落完整生产路径。
          # lean-inspector/ 全史仅改 2 次,其一(953733cb)正是改变 axiom 闭包收集方式的
          # 语义改动 —— 频次低不构成豁免(第 20 条:检测机制绝不降级)。
          if [[ "$candidateProducer" == "$baselineProducer" ]]; then
            echo "producer-consistent=true" >> "$GITHUB_OUTPUT"
          else
            echo "producer-consistent=false" >> "$GITHUB_OUTPUT"
            candidate_prefix="$(printf '%s' "$candidateProducer" | cut -c1-12)"
            baseline_prefix="$(printf '%s' "$baselineProducer" | cut -c1-12)"
            printf '%s\n' "canonical Lean report cache disabled: candidate producer $candidate_prefix != executed baseline producer $baseline_prefix" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$address" == "$baselineAddress" ]]; then
            echo "pair-reusable=true" >> "$GITHUB_OUTPUT"
          else
            echo "pair-reusable=false" >> "$GITHUB_OUTPUT"
          fi

      # 一事不再理:报告是其输入闭包的纯函数,而该闭包已被内容寻址(上一步)。
      # dev push 早已把结果按同一 key 存下(下方 Save 步),theory-ingest 也已在读它;
      # 只有 CI 自己的关键路径从不读 —— 于是每个 PR 重付一次 lake 恢复 + 报告生产
      # (2026-08-11 实测 92s + 83s),哪怕闭包逐字节未变。
      #
      # 安全性不靠这一步:下游 `RawLeanReportArtifact.ReadFile` 会把报告里每个模块的
      # source_sha256 与树逐一对账,不符即抛 INFRASTRUCTURE_FAILURE。一份错的或陈旧的
      # 报告不可能被静默接受,最坏是红,不是假绿。
      - name: Restore canonical Lean report by input address
        id: report-cache
        if: steps.lean-report-input.outputs.pair-reusable == 'true' && steps.lean-report-input.outputs.producer-consistent == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .canonical-lean-report-cache
          key: stratalint-canonical-lean-report-v2-${{ steps.lean-report-input.outputs.address }}

      - name: Serve both canonical Lean reports from the cached address
        id: report-reuse
        if: steps.report-cache.outputs.cache-hit == 'true'
        # 这一步失败必须**回落**到完整生产路径,而不是让整个 job 红:缓存是加速,不是权威。
        # 下面四个重活步骤的守卫是 `outcome != 'success'`,故失败与跳过都会走原路。
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          source="$GITHUB_WORKSPACE/.canonical-lean-report-cache/raw-lean-report.json"
          reports="$RUNNER_TEMP/raw-lean-reports"
          mkdir -p "$reports"
          # verify 需要 .sha256 旁文件(lean-report-input.sh:100),故一并要求存在。
          for suffix in '' .sha256 .input.attestation .provenance.json; do
            test -s "${source}${suffix}"
          done
          helper="$GITHUB_WORKSPACE/baseline/Meta/StrataLint/scripts/report/lean-report-input.sh"
          # 缓存条目对候选树重新验一次地址与报告哈希;不符即整体回落,不静默使用。
          "$helper" verify --repository "$GITHUB_WORKSPACE/candidate" --report "$source"
          "$helper" verify --repository "$GITHUB_WORKSPACE/baseline" --report "$source"
          for side in candidate baseline; do
            for suffix in '' .input.attestation .provenance.json; do
              cp "${source}${suffix}" "$reports/${side}-lean-report.json${suffix}"
            done
            printf '%s  %s\n' \
              "$(sha256sum "$reports/${side}-lean-report.json" | cut -d ' ' -f 1)" \
              "${side}-lean-report.json" > "$reports/${side}-lean-report.json.sha256"
          done
          printf '%s\n' "canonical Lean reports served from cached input address" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore elan and pinned Lean toolchains
        if: steps.report-reuse.outcome != 'success'
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-${{ runner.arch }}-elan-${{ hashFiles('candidate/lean-toolchain', 'baseline/lean-toolchain') }}

      - name: Install pinned Lean toolchains
        if: steps.report-reuse.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -x "$HOME/.elan/bin/elan" ]]; then
            curl --proto '=https' --tlsv1.2 -sSf https://elan.lean-lang.org/elan-init.sh \
              | sh -s -- -y --default-toolchain none
          fi
          default_toolchain=""
          for toolchain_file in candidate/lean-toolchain baseline/lean-toolchain; do
            toolchain="$(tr -d '\r\n' < "$toolchain_file")"
            test -n "$toolchain"
            if ! "$HOME/.elan/bin/elan" toolchain list 2>/dev/null | grep -qF "$toolchain"; then
              "$HOME/.elan/bin/elan" toolchain install "$toolchain"
            fi
            default_toolchain="$toolchain"
          done
          "$HOME/.elan/bin/elan" default "$default_toolchain"
          "$HOME/.elan/bin/lake" --version

      - name: Install pinned SDK for statement projection reconciliation
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: candidate/global.json

      - name: Restore candidate and baseline Lean build artifacts
        if: steps.report-reuse.outcome != 'success'

        uses: actions/cache/restore@v4
        with:
          path: |
            candidate/.lake
            baseline/.lake
            ~/.cache/mathlib
          key: ${{ runner.os }}-${{ runner.arch }}-lake-${{ hashFiles('candidate/lake-manifest.json', 'baseline/lake-manifest.json') }}-${{ hashFiles('candidate/lean-toolchain', 'baseline/lean-toolchain') }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ steps.baseline.outputs.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-lake-${{ hashFiles('candidate/lake-manifest.json', 'baseline/lake-manifest.json') }}-${{ hashFiles('candidate/lean-toolchain', 'baseline/lean-toolchain') }}-

      - name: Produce source-bound canonical Lean reports
        if: steps.report-reuse.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          producer="$GITHUB_WORKSPACE/baseline/Meta/StrataLint/lean-inspector/inspect.sh"
          if [[ ! -x "$producer" || ! -f "$GITHUB_WORKSPACE/baseline/Meta/StrataLint/lean-inspector/Inspector.lean" ]]; then
            if git -C candidate log --format=%H "${{ steps.baseline.outputs.sha }}" -- Meta/StrataLint/lean-inspector/inspect.sh | grep -q .; then
              printf '%s\n' "baseline Lean producer disappeared after its recorded introduction" >&2
              exit 1
            fi
            producer="$GITHUB_WORKSPACE/candidate/Meta/StrataLint/lean-inspector/inspect.sh"
            echo "::warning title=Lean producer bootstrap::The predecessor predates the producer; using canonical dev candidate for its one-time introduction run."
          fi
          pair_producer="$GITHUB_WORKSPACE/baseline/Meta/StrataLint/scripts/lean-report-pair.sh"
          if [[ ! -x "$pair_producer" ]]; then
            if git -C candidate log --format=%H "${{ steps.baseline.outputs.sha }}" -- Meta/StrataLint/scripts/lean-report-pair.sh | grep -q .; then
              printf '%s\n' "baseline Lean report pair helper disappeared after its recorded introduction" >&2
              exit 1
            fi
            pair_producer="$GITHUB_WORKSPACE/candidate/Meta/StrataLint/scripts/lean-report-pair.sh"
            echo "::warning title=Lean report pair bootstrap::The predecessor predates input-address reuse; using the newly admitted helper for its one-time introduction run."
          fi
          reports="$RUNNER_TEMP/raw-lean-reports"
          mkdir -p "$reports"
          "$pair_producer" \
            --producer "$producer" \
            --lake-bin "$HOME/.elan/bin/lake" \
            --candidate-root "$GITHUB_WORKSPACE/candidate" \
            --candidate-output "$reports/candidate-lean-report.json" \
            --baseline-root "$GITHUB_WORKSPACE/baseline" \
            --baseline-output "$reports/baseline-lean-report.json"

      - name: Reconcile pinned statement projections with live Lean report
        shell: bash
        env:
          STRATALINT_REQUIRE_LIVE_REPORT: "1"
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/raw-lean-reports/candidate-lean-report.json"
          target="$GITHUB_WORKSPACE/candidate/.lake/build/stratalint/raw-lean-report.json"
          mkdir -p "$(dirname "$target")"
          cp "$report" "$target"
          dotnet test candidate/Meta/StrataLint/StrataLint.Scribe.Tests/StrataLint.Scribe.Tests.csproj \
            --configuration Release \
            --filter 'FullyQualifiedName~LiveReportMatchesPinnedFixtureWhenAvailable' \
            --verbosity normal

      - name: Stage candidate canonical Lean report cache
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/raw-lean-reports/candidate-lean-report.json"
          target="$GITHUB_WORKSPACE/.canonical-lean-report-cache/raw-lean-report.json"
          mkdir -p "$(dirname "$target")"
          for suffix in '' .input.attestation .provenance.json; do
            test -s "${source}${suffix}"
            cp "${source}${suffix}" "${target}${suffix}"
          done
          read -r declaredSha256 declaredName < "${source}.sha256"
          reportSha256="$(sha256sum "$target" | cut -d ' ' -f 1)"
          test "$declaredSha256" = "$reportSha256"
          test "$declaredName" = "$(basename "$source")"
          printf '%s  %s\n' "$reportSha256" "$(basename "$target")" > "${target}.sha256"
          "$GITHUB_WORKSPACE/baseline/Meta/StrataLint/scripts/report/lean-report-input.sh" verify \
            --repository "$GITHUB_WORKSPACE/candidate" \
            --report "$target"

      # pull_request_target runs get a token without cache-write scope, so this save
      # can only ever fail there: run 31389667812 logged "cache write denied: token has
      # no writable scopes". The two saves below already carry this exact guard; this
      # one was missing it, so every PR attempted a write it could not perform. dev-push
      # runs do write it successfully (run 31389340892).
      # 命中缓存时 elan/lake 目录未被恢复也未被填充,回存会写入空态并污染下一轮;
      # 报告 key 也已存在,重写无意义。三个 save 一律只在真正跑过生产路径时执行。
      - name: Save candidate canonical Lean report (dev push only)
        if: success() && steps.report-reuse.outcome != 'success' && steps.lean-report-input.outputs.producer-consistent == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/cache/save@v4
        with:
          path: .canonical-lean-report-cache
          key: stratalint-canonical-lean-report-v2-${{ steps.lean-report-input.outputs.address }}

      - name: Upload raw Lean reports and producer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-lean-reports
          path: ${{ runner.temp }}/raw-lean-reports
          if-no-files-found: warn
          retention-days: 7

      # 命中缓存时 elan/lake 目录未被恢复也未被填充,回存会写入空态并污染下一轮;
      # 报告 key 也已存在,重写无意义。三个 save 一律只在真正跑过生产路径时执行。
      - name: Save elan toolchains (dev push only)
        if: success() && steps.report-reuse.outcome != 'success' && github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/cache/save@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-${{ runner.arch }}-elan-${{ hashFiles('candidate/lean-toolchain', 'baseline/lean-toolchain') }}

      # 命中缓存时 elan/lake 目录未被恢复也未被填充,回存会写入空态并污染下一轮;
      # 报告 key 也已存在,重写无意义。三个 save 一律只在真正跑过生产路径时执行。
      - name: Save Lean build artifacts (dev push only)
        if: success() && steps.report-reuse.outcome != 'success' && github.event_name == 'push' && github.ref == 'refs/heads/dev'
        continue-on-error: true
        timeout-minutes: 12
        uses: actions/cache/save@v4
        with:
          path: |
            candidate/.lake
            baseline/.lake
            ~/.cache/mathlib
          key: ${{ runner.os }}-${{ runner.arch }}-lake-${{ hashFiles('candidate/lake-manifest.json', 'baseline/lake-manifest.json') }}-${{ hashFiles('candidate/lean-toolchain', 'baseline/lean-toolchain') }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ steps.baseline.outputs.sha }}

  baseline-admission:
    name: Content-addressed dev baseline admission
    needs: lean-inspect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out candidate with history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate

      - name: Check out content-addressed dev baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.lean-inspect.outputs.baseline_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: baseline

      - name: Verify baseline checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C baseline rev-parse HEAD)"
          test "$actual" = "${{ needs.lean-inspect.outputs.baseline_sha }}"
          echo "DEV_BASELINE_SHA=$actual" >> "$GITHUB_ENV"
          printf '%s\n' "Baseline judge content address: $actual" >> "$GITHUB_STEP_SUMMARY"

      - name: Install pinned SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: baseline/global.json

      - name: Download canonical Lean reports
        uses: actions/download-artifact@v4
        with:
          name: raw-lean-reports
          path: ${{ runner.temp }}/raw-lean-reports

      - name: Verify report content addresses
        shell: bash
        working-directory: ${{ runner.temp }}/raw-lean-reports
        run: |
          set -euo pipefail
          sha256sum -c candidate-lean-report.json.sha256
          sha256sum -c baseline-lean-report.json.sha256

      - name: Run the shared baseline harness gate
        shell: bash
        run: |
          set -euo pipefail
          gate="$GITHUB_WORKSPACE/baseline/.github/scripts/harness-gate.sh"
          if [[ ! -x "$gate" ]]; then
            printf '%s\n' "content-addressed baseline harness gate is absent" >&2
            exit 1
          elif ! grep -qF -- '--candidate-lean-report' "$gate"; then
            printf '%s\n' "content-addressed baseline gate cannot consume canonical Lean reports" >&2
            exit 1
          fi
          set +e
          "$gate" \
            --candidate "$GITHUB_WORKSPACE/candidate" \
            --judge-root "$GITHUB_WORKSPACE/baseline" \
            --base "$DEV_BASELINE_SHA" \
            --candidate-lean-report "$RUNNER_TEMP/raw-lean-reports/candidate-lean-report.json" \
            --baseline-lean-report "$RUNNER_TEMP/raw-lean-reports/baseline-lean-report.json" \
            2>&1 | tee "$RUNNER_TEMP/gate.log"
          rc="${PIPESTATUS[0]}"
          set -e
          if [[ "$rc" -ne 0 && "$rc" -ne 3 ]]; then
            echo "::error title=harness gate failed::rc=$rc; complete output was emitted above"
            printf '%s\n' "### harness gate FAILED rc=$rc" >> "$GITHUB_STEP_SUMMARY"
            exit "$rc"
          fi
          if [[ "$rc" -eq 3 ]]; then
            printf '%s\n' "### harness gate emitted an SL-022 conservativity certificate" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
