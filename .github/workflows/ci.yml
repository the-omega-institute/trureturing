# BOOTSTRAP-NOT-ACTIVE until this workflow and the C# harness exist on dev.
name: admission

on:
  push:
    branches: [dev]
  pull_request_target:
    branches: [dev, 'integration-**']
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Trust topology: the pull_request_target workflow, Lean producer, and .NET judge
# all come from the content-addressed dev base. Candidate engineering is only a
# signal. Admission consumes immutable raw reports produced in a predecessor job.
jobs:
  candidate-engineering:
    name: Candidate harness engineering checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate

      - name: Resolve pinned Lean toolchain
        id: lean
        shell: bash
        env:
          LEAN_TOOLCHAIN_FILE: candidate/lean-toolchain
        run: |
          set -euo pipefail
          test -s "$LEAN_TOOLCHAIN_FILE"
          echo "file=$LEAN_TOOLCHAIN_FILE" >> "$GITHUB_OUTPUT"
          echo "hash=$(sha256sum "$LEAN_TOOLCHAIN_FILE" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Restore elan and pinned Lean toolchain
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-${{ runner.arch }}-elan-${{ steps.lean.outputs.hash }}

      - name: Install pinned Lean toolchain for producer integration tests
        shell: bash
        env:
          LEAN_TOOLCHAIN_FILE: ${{ steps.lean.outputs.file }}
        run: |
          set -euo pipefail
          toolchain="$(tr -d '\r\n' < "$LEAN_TOOLCHAIN_FILE")"
          test -n "$toolchain"
          if [[ ! -x "$HOME/.elan/bin/elan" ]]; then
            curl --proto '=https' --tlsv1.2 -sSf https://elan.lean-lang.org/elan-init.sh \
              | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          if ! "$HOME/.elan/bin/elan" toolchain list 2>/dev/null | grep -qF "$toolchain"; then
            "$HOME/.elan/bin/elan" toolchain install "$toolchain"
          fi
          "$HOME/.elan/bin/elan" default "$toolchain"
          "$HOME/.elan/bin/lake" --version

      - name: Install pinned SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: candidate/global.json

      - name: Resolve pinned fkst-framework source
        id: substrate
        shell: bash
        run: |
          set -euo pipefail
          ref="$(tr -d '\r\n' < candidate/.fkst/substrate-ref)"
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out pinned fkst-framework source
        uses: actions/checkout@v4
        with:
          repository: ChronoAIProject/fkst-substrate
          ref: ${{ steps.substrate.outputs.ref }}
          path: fkst-substrate
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore fkst-framework build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fkst-substrate

      - name: Build pinned fkst-framework
        working-directory: fkst-substrate
        run: cargo build -p fkst-framework

      - name: Restore candidate locked dependencies
        run: |
          dotnet restore candidate/Meta/StrataLint/CompileFailProof/CompileFailProof.csproj --locked-mode
          dotnet restore candidate/Meta/StrataLint/BannedApiCompileFailProof/BannedApiCompileFailProof.csproj --locked-mode

      - name: Build candidate with warnings as errors
        run: make -C candidate dotnet

      - name: Run candidate golden and integration tests
        env:
          BIN: ${{ github.workspace }}/fkst-substrate/target/debug/fkst-framework
        run: make -C candidate test

      - name: Run candidate selftest twice and compare bytes
        shell: bash
        run: make -C candidate selftest

      - name: Prove missing capability does not compile
        shell: bash
        run: |
          set +e
          output="$(dotnet build candidate/Meta/StrataLint/CompileFailProof/CompileFailProof.csproj --no-restore --configuration Release 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -F "CS7036" <<<"$output"
          grep -F "MetaClear" <<<"$output"

      - name: Prove banned deterministic APIs do not compile
        shell: bash
        run: |
          proof="candidate/Meta/StrataLint/BannedApiCompileFailProof/BannedApiViolations.cs"
          set +e
          output="$(dotnet build candidate/Meta/StrataLint/BannedApiCompileFailProof/BannedApiCompileFailProof.csproj --no-restore --configuration Release 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          mapfile -t expected_lines < <(grep -nF "// banned-api-proof" "$proof" | cut -d: -f1)
          mapfile -t actual_lines < <(
            sed -n 's#.*BannedApiViolations.cs(\([0-9][0-9]*\),[0-9][0-9]*): error RS0030:.*#\1#p' <<<"$output" | sort -nu
          )
          test "${#expected_lines[@]}" -gt 0
          test "${#actual_lines[@]}" -eq "${#expected_lines[@]}"
          test -z "$(grep -F ': error ' <<<"$output" | grep -vF ': error RS0030:' || true)"
          for index in "${!expected_lines[@]}"; do
            test "${actual_lines[$index]}" = "${expected_lines[$index]}"
          done

  lean-inspect:
    name: Canonical Lean report production
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    outputs:
      baseline_sha: ${{ steps.baseline.outputs.sha }}
    steps:
      - name: Check out candidate with history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate

      - name: Resolve dev baseline content address
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request_target" ]]; then
            sha="${{ github.event.pull_request.base.sha }}"
          else
            sha="${{ github.event.before }}"
            if [[ -z "$sha" || "$sha" =~ ^0+$ ]]; then
              sha="$(git -C candidate rev-parse "$GITHUB_SHA^")"
            fi
          fi
          if [[ -z "$sha" || "$sha" =~ ^0+$ ]]; then
            printf '%s\n' "event has no content-addressable dev baseline" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out content-addressed dev baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.baseline.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: baseline

      - name: Verify baseline checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C baseline rev-parse HEAD)"
          test "$actual" = "${{ steps.baseline.outputs.sha }}"
          printf '%s\n' "Lean producer base content address: $actual" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve candidate canonical Lean report address
        id: lean-report-input
        shell: bash
        run: |
          set -euo pipefail
          helper="$GITHUB_WORKSPACE/baseline/Meta/StrataLint/scripts/report/lean-report-input.sh"
          test -x "$helper"
          read -r address _ <<< "$("$helper" address --repository "$GITHUB_WORKSPACE/candidate")"
          [[ "$address" =~ ^[0-9a-f]{64}$ ]]
          echo "address=$address" >> "$GITHUB_OUTPUT"

      - name: Restore elan and pinned Lean toolchains
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-${{ runner.arch }}-elan-${{ hashFiles('candidate/lean-toolchain', 'baseline/lean-toolchain') }}

      - name: Install pinned Lean toolchains
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -x "$HOME/.elan/bin/elan" ]]; then
            curl --proto '=https' --tlsv1.2 -sSf https://elan.lean-lang.org/elan-init.sh \
              | sh -s -- -y --default-toolchain none
          fi
          default_toolchain=""
          for toolchain_file in candidate/lean-toolchain baseline/lean-toolchain; do
            toolchain="$(tr -d '\r\n' < "$toolchain_file")"
            test -n "$toolchain"
            if ! "$HOME/.elan/bin/elan" toolchain list 2>/dev/null | grep -qF "$toolchain"; then
              "$HOME/.elan/bin/elan" toolchain install "$toolchain"
            fi
            default_toolchain="$toolchain"
          done
          "$HOME/.elan/bin/elan" default "$default_toolchain"
          "$HOME/.elan/bin/lake" --version

      - name: Restore candidate and baseline Lean build artifacts
        uses: actions/cache/restore@v4
        with:
          path: |
            candidate/.lake
            baseline/.lake
            ~/.cache/mathlib
          key: ${{ runner.os }}-${{ runner.arch }}-lake-${{ hashFiles('candidate/lake-manifest.json', 'baseline/lake-manifest.json') }}-${{ hashFiles('candidate/lean-toolchain', 'baseline/lean-toolchain') }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ steps.baseline.outputs.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-lake-${{ hashFiles('candidate/lake-manifest.json', 'baseline/lake-manifest.json') }}-${{ hashFiles('candidate/lean-toolchain', 'baseline/lean-toolchain') }}-

      - name: Produce source-bound canonical Lean reports
        shell: bash
        run: |
          set -euo pipefail
          producer="$GITHUB_WORKSPACE/baseline/Meta/StrataLint/lean-inspector/inspect.sh"
          if [[ ! -x "$producer" || ! -f "$GITHUB_WORKSPACE/baseline/Meta/StrataLint/lean-inspector/Inspector.lean" ]]; then
            if git -C candidate log --format=%H "${{ steps.baseline.outputs.sha }}" -- Meta/StrataLint/lean-inspector/inspect.sh | grep -q .; then
              printf '%s\n' "baseline Lean producer disappeared after its recorded introduction" >&2
              exit 1
            fi
            producer="$GITHUB_WORKSPACE/candidate/Meta/StrataLint/lean-inspector/inspect.sh"
            echo "::warning title=Lean producer bootstrap::The predecessor predates the producer; using canonical dev candidate for its one-time introduction run."
          fi
          pair_producer="$GITHUB_WORKSPACE/baseline/Meta/StrataLint/scripts/lean-report-pair.sh"
          if [[ ! -x "$pair_producer" ]]; then
            if git -C candidate log --format=%H "${{ steps.baseline.outputs.sha }}" -- Meta/StrataLint/scripts/lean-report-pair.sh | grep -q .; then
              printf '%s\n' "baseline Lean report pair helper disappeared after its recorded introduction" >&2
              exit 1
            fi
            pair_producer="$GITHUB_WORKSPACE/candidate/Meta/StrataLint/scripts/lean-report-pair.sh"
            echo "::warning title=Lean report pair bootstrap::The predecessor predates input-address reuse; using the newly admitted helper for its one-time introduction run."
          fi
          reports="$RUNNER_TEMP/raw-lean-reports"
          mkdir -p "$reports"
          "$pair_producer" \
            --producer "$producer" \
            --lake-bin "$HOME/.elan/bin/lake" \
            --candidate-root "$GITHUB_WORKSPACE/candidate" \
            --candidate-output "$reports/candidate-lean-report.json" \
            --baseline-root "$GITHUB_WORKSPACE/baseline" \
            --baseline-output "$reports/baseline-lean-report.json"

      - name: Stage candidate canonical Lean report cache
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/raw-lean-reports/candidate-lean-report.json"
          target="$GITHUB_WORKSPACE/.canonical-lean-report-cache/raw-lean-report.json"
          mkdir -p "$(dirname "$target")"
          for suffix in '' .input.attestation .provenance.json; do
            test -s "${source}${suffix}"
            cp "${source}${suffix}" "${target}${suffix}"
          done
          read -r declaredSha256 declaredName < "${source}.sha256"
          reportSha256="$(sha256sum "$target" | cut -d ' ' -f 1)"
          test "$declaredSha256" = "$reportSha256"
          test "$declaredName" = "$(basename "$source")"
          printf '%s  %s\n' "$reportSha256" "$(basename "$target")" > "${target}.sha256"
          "$GITHUB_WORKSPACE/baseline/Meta/StrataLint/scripts/report/lean-report-input.sh" verify \
            --repository "$GITHUB_WORKSPACE/candidate" \
            --report "$target"

      - name: Save candidate canonical Lean report
        uses: actions/cache/save@v4
        with:
          path: .canonical-lean-report-cache
          key: stratalint-canonical-lean-report-v1-${{ steps.lean-report-input.outputs.address }}

      - name: Upload raw Lean reports and producer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-lean-reports
          path: ${{ runner.temp }}/raw-lean-reports
          if-no-files-found: warn
          retention-days: 7

      - name: Save elan toolchains (dev push only)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/cache/save@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-${{ runner.arch }}-elan-${{ hashFiles('candidate/lean-toolchain', 'baseline/lean-toolchain') }}

      - name: Save Lean build artifacts (dev push only)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/dev'
        continue-on-error: true
        timeout-minutes: 12
        uses: actions/cache/save@v4
        with:
          path: |
            candidate/.lake
            baseline/.lake
            ~/.cache/mathlib
          key: ${{ runner.os }}-${{ runner.arch }}-lake-${{ hashFiles('candidate/lake-manifest.json', 'baseline/lake-manifest.json') }}-${{ hashFiles('candidate/lean-toolchain', 'baseline/lean-toolchain') }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ steps.baseline.outputs.sha }}

  baseline-admission:
    name: Content-addressed dev baseline admission
    needs: lean-inspect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out candidate with history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate

      - name: Check out content-addressed dev baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.lean-inspect.outputs.baseline_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: baseline

      - name: Verify baseline checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C baseline rev-parse HEAD)"
          test "$actual" = "${{ needs.lean-inspect.outputs.baseline_sha }}"
          echo "DEV_BASELINE_SHA=$actual" >> "$GITHUB_ENV"
          printf '%s\n' "Baseline judge content address: $actual" >> "$GITHUB_STEP_SUMMARY"

      - name: Install pinned SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: baseline/global.json

      - name: Download canonical Lean reports
        uses: actions/download-artifact@v4
        with:
          name: raw-lean-reports
          path: ${{ runner.temp }}/raw-lean-reports

      - name: Verify report content addresses
        shell: bash
        working-directory: ${{ runner.temp }}/raw-lean-reports
        run: |
          set -euo pipefail
          sha256sum -c candidate-lean-report.json.sha256
          sha256sum -c baseline-lean-report.json.sha256

      - name: Run the shared baseline harness gate
        shell: bash
        run: |
          set -euo pipefail
          gate="$GITHUB_WORKSPACE/baseline/.github/scripts/harness-gate.sh"
          if [[ ! -x "$gate" ]]; then
            printf '%s\n' "content-addressed baseline harness gate is absent" >&2
            exit 1
          elif ! grep -qF -- '--candidate-lean-report' "$gate"; then
            printf '%s\n' "content-addressed baseline gate cannot consume canonical Lean reports" >&2
            exit 1
          fi
          set +e
          "$gate" \
            --candidate "$GITHUB_WORKSPACE/candidate" \
            --judge-root "$GITHUB_WORKSPACE/baseline" \
            --base "$DEV_BASELINE_SHA" \
            --candidate-lean-report "$RUNNER_TEMP/raw-lean-reports/candidate-lean-report.json" \
            --baseline-lean-report "$RUNNER_TEMP/raw-lean-reports/baseline-lean-report.json" \
            2>&1 | tee "$RUNNER_TEMP/gate.log"
          rc="${PIPESTATUS[0]}"
          set -e
          if [[ "$rc" -ne 0 && "$rc" -ne 3 ]]; then
            echo "::error title=harness gate failed::rc=$rc; complete output was emitted above"
            printf '%s\n' "### harness gate FAILED rc=$rc" >> "$GITHUB_STEP_SUMMARY"
            exit "$rc"
          fi
          if [[ "$rc" -eq 3 ]]; then
            printf '%s\n' "### harness gate emitted an SL-022 conservativity certificate" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
