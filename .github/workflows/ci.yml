# BOOTSTRAP-NOT-ACTIVE until this workflow and the C# harness exist on dev.
name: admission

on:
  push:
    branches: [dev, integration-ci-pfci-tests]
  pull_request_target:
    branches: [dev, 'integration-**']
    types: [opened, synchronize, reopened]

permissions:
  contents: read
# PR 侧按 PR 号分组并取消在途:同一 PR 连续推送时,旧 run 的结论已无意义。
#
# dev push 侧不同:它的必查早已在 PR 上跑过,这一趟**存在的理由就是把缓存写进去**
# (elan、Lean dependencies、canonical Lean report),而三个 save 都在 job 末尾。
# 用 github.ref 分组意味着所有 dev push 共用一个组,于是下一次合并会取消上一次。
#
# 【2026-08-11 勘误】本注释原引「近 30 次 dev push 23 次 cancelled、仅 6 次 success(20%)」
# 并据此断言「缓存几乎从来没被写进去过」——**取样有偏,结论过强**,由第十一轮面板证伪。
# 同口径全窗(最近 100 次 dev push)是 **56 success / 43 cancelled / 1 failure = 56% 成功**;
# 那个 20% 取自最忙的尾窗,不能当普遍前提。缓存**一直在被写入**,只是被取消的那部分没写成。
# 本改动仍成立,但买到的是「少丢一部分写入」而非「从不写变成写」;效果**尚未被测量**(成功 PR run 一度为 0)。
# 改用 github.sha:每次 dev push 自成一组,彼此既不取消也不排队。
# 代价是这些 run 会跑完而不是中途被杀 —— 它们本来就已启动,增量是其尾段。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# Trust topology: pull_request_target keeps workflow text on the base branch. The
# candidate-owned Lean producer and .NET judge inspect GitHub's post-merge tree
# (candidate plus the current dev parent). Candidate engineering is only a signal.
# Admission consumes immutable raw reports from the predecessor job; the protected
# base is the checked merge commit's first-parent SHA passed to the gate. The
# workflow itself retains an unfiltered floor for engineering and root inputs.
jobs:
  candidate-engineering:
    name: Candidate harness engineering checks
    runs-on: ubuntu-24.04-arm
    # 20 分钟对本 job 已结构性不足:凡改动命中 tools/** 者,EngineeringScope 的测试选择器
    # 选中 0 个、回退 full,跑满全部测试套件,实测 20–21 分钟(#3940)。
    # 证据:PR #3943(生产 +4/-4、新增测试实测 221ms)连续五次 CANCELLED
    # (20m04 / 20m15 / ~21m / ~21m / ~21m);同期 dev 上 13–19 分钟通过的 run 全部 0 行
    # tools/ 改动,选择器能裁剪。dev 自身亦出现过一次 CANCELLED(50a319d9c,20m13s)。
    # 30 分钟给 full scope 留约 50% 余量;同文件的 Lean report job 预算已是 45 分钟。
    timeout-minutes: 30
    steps:
      - name: Wait for the GitHub merge ref
        if: github.event_name == 'pull_request_target'
        run: "set -euo pipefail\nfor attempt in {1..25}; do\n  timestamp=\"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\"\n  printf '%s poll=%s/25\\n' \"$timestamp\" \"$attempt\"\n  if git ls-remote --exit-code \"https://github.com/${{ github.repository }}.git\" \"refs/pull/${{ github.event.pull_request.number }}/merge\" >/dev/null 2>&1; then exit 0; fi\n  sleep 5\ndone\nprintf '%s\\n' \"merge ref absent after 125s (conflicted PR or still computing)\"\nexit 0"
      - name: Check out candidate
        id: checkout-merge
        continue-on-error: ${{ github.event_name == 'pull_request_target' }}
        uses: actions/checkout@v4
        with: { ref: "${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}", fetch-depth: 0, persist-credentials: false, path: candidate }
      - name: Strip checkout remote state
        if: steps.checkout-merge.outcome == 'success'
        shell: bash
        env:
          CHECKOUT_PATH: candidate
        run: |
          set -euo pipefail
          git -C "$CHECKOUT_PATH" remote remove origin
          git -C "$CHECKOUT_PATH" for-each-ref --format='delete %(refname)' refs/remotes/ |
            git -C "$CHECKOUT_PATH" update-ref --stdin
          remote_count="$(git -C "$CHECKOUT_PATH" remote | wc -l)"
          remote_ref_count="$(git -C "$CHECKOUT_PATH" for-each-ref --format='%(refname)' refs/remotes/ | wc -l)"
          if [[ "$remote_count" -ne 0 || "$remote_ref_count" -ne 0 ]]; then
            printf '%s\n' "checkout still exposes remotes or remote-tracking refs" >&2
            exit 1
          fi
          head_sha="$(git -C "$CHECKOUT_PATH" rev-parse HEAD)"
          base_sha="$(git -C "$CHECKOUT_PATH" rev-parse HEAD^1)"
          test -n "$head_sha"
          test -n "$base_sha"
      - name: Fail closed when merge result is unavailable
        if: always() && steps.checkout-merge.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request_target" ]]; then
            printf '%s\n' "cannot check out GitHub merge ref refs/pull/${{ github.event.pull_request.number }}/merge; conflicted pull requests have no merge result, so admission fails closed" >&2
          else
            printf '%s\n' "cannot check out push commit $GITHUB_SHA; admission fails closed" >&2
          fi
          exit 1
      - name: Install candidate-pinned SDK for candidate build and tests
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: candidate/global.json
      - name: Resolve judge binary content address before build outputs exist
        id: judge-address
        shell: bash
        run: |
          set -euo pipefail
          source_address="${{ hashFiles('candidate/tools/**', 'candidate/Blueprint/**/*.scribe.cs', 'candidate/Directory.*', 'candidate/.editorconfig', 'candidate/global.json') }}"
          workflow_ref=HEAD
          if [[ "$GITHUB_EVENT_NAME" == "pull_request_target" ]]; then workflow_ref=HEAD^1; fi
          workflow_address="$(git -C candidate rev-parse "${workflow_ref}:.github/workflows/ci.yml")"
          source_address="$(printf 'sources=%s\nworkflow=%s\n' "$source_address" "$workflow_address" | sha256sum | cut -d ' ' -f 1)"
          candidate/tools/scripts/workflow/judge-content-address.sh "$source_address" >> "$GITHUB_OUTPUT"
      - name: Restore judge binaries and candidate build outputs
        id: judge-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .judge-binaries
            candidate/tools/**/bin
            candidate/tools/**/obj
          key: stratalint-judge-binaries-v2-${{ runner.os }}-${{ steps.judge-address.outputs.runtime }}-${{ steps.judge-address.outputs.address }}
      - name: Resolve pinned Lean toolchain
        id: lean
        shell: bash
        env:
          LEAN_TOOLCHAIN_FILE: candidate/lean-toolchain
        run: |
          set -euo pipefail
          test -s "$LEAN_TOOLCHAIN_FILE"
          echo "file=$LEAN_TOOLCHAIN_FILE" >> "$GITHUB_OUTPUT"
          echo "hash=$(sha256sum "$LEAN_TOOLCHAIN_FILE" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore elan and pinned Lean toolchain
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-${{ runner.arch }}-elan-${{ steps.lean.outputs.hash }}
          # 前缀回退保留,让候选工程 job 可以复用 inspect job 写入的相近工具链缓存。
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-elan-
      - name: Install pinned Lean toolchain for producer integration tests
        id: install-elan
        shell: bash
        env:
          LEAN_TOOLCHAIN_FILE: ${{ steps.lean.outputs.file }}
        run: |
          if [[ ! -x "$GITHUB_WORKSPACE/candidate/tools/scripts/workflow/install-lean-toolchain.sh" ]]; then
            printf '%s\n' "candidate Lean toolchain installer is absent (merge dev to pick it up)" >&2
            exit 1
          fi
          "$GITHUB_WORKSPACE/candidate/tools/scripts/workflow/install-lean-toolchain.sh" "$LEAN_TOOLCHAIN_FILE" --github-path "$GITHUB_PATH"
      - name: Run canonical candidate engineering judgment
        id: engineering
        shell: bash
        env:
          EVENT: ${{ github.event_name == 'pull_request_target' && 'PR' || 'push' }}
        run: make -C candidate/tools engineering
      - name: Signal PR head branch grammar
        if: github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'dev'
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: "set +e\nvalidation_output=\"$(dotnet run --project candidate/tools/StrataLint.Cli/StrataLint.Cli.csproj --configuration Release --no-build --no-launch-profile -- worktree validate-branch --branch \"$HEAD_REF\")\"\nvalidation_exit=$?\nset -e\nhead_ref=\"$HEAD_REF\"\nprintf '%s\\n' \"$validation_output\"\ncase \"$validation_exit\" in\n  0)\n    expected_status=canonical\n    ;;\n  1)\n    expected_status=BRANCH_GRAMMAR_NONCONFORMING\n    ;;\n  *)\n    printf 'BRANCH_GRAMMAR_SIGNAL detector_status=failed exit=%s\\n' \"$validation_exit\" >&2\n    exit \"$validation_exit\"\n    ;;\nesac\nif ! jq -e -s --arg expected_status \"$expected_status\" --arg head_ref \"$HEAD_REF\" 'length == 1 and .[0].event == \"branch_validation\" and .[0].status == $expected_status and .[0].branch == $head_ref and (.[0].canonical == ($expected_status == \"canonical\"))' <<< \"$validation_output\" >/dev/null; then\n  printf 'BRANCH_GRAMMAR_SIGNAL detector_status=invalid_output exit=%s\\n' \"$validation_exit\" >&2\n  exit 1\nfi\nsummary_format='PR head branch \"%s\" has canonical branch grammar status \"%s\". Nonconforming names are advisory; detector faults fail closed.\\n'\nif [[ \"$validation_exit\" -eq 1 ]]; then\n  printf '%s' '::warning title=PR head branch grammar::'\n  printf \"$summary_format\" \"$HEAD_REF\" \"$expected_status\"\nfi\nprintf 'BRANCH_GRAMMAR_SIGNAL status=%s head_ref=%s\\n' \"$expected_status\" \"$HEAD_REF\"\nprintf \"$summary_format\" \"$HEAD_REF\" \"$expected_status\" >> \"$GITHUB_STEP_SUMMARY\"\n"
      - name: Audit repository capacity after merge
        if: github.event_name == 'push' && !cancelled()
        shell: bash
        run: make -C candidate/tools capacity-audit REPOSITORY="$GITHUB_WORKSPACE/candidate"
      - name: Stage judge binaries for the shared cache (dev push only)
        id: stage-judge
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .judge-binaries/cli .judge-binaries/scribe
          dotnet publish candidate/tools/StrataLint.Cli/StrataLint.Cli.csproj \
            --configuration Release --output .judge-binaries/cli
          dotnet publish candidate/tools/StrataLint.Scribe.Documents/StrataLint.Scribe.Documents.csproj \
            --configuration Release --output .judge-binaries/scribe
          test -s .judge-binaries/cli/StrataLint.dll
          test -s .judge-binaries/scribe/StrataLint.Scribe.Documents.dll
          printf '%s\n%s\n' \
            'schema=stratalint-dotnet-binary-source-address-v1' \
            'source_address=${{ steps.judge-address.outputs.address }}' \
            > .judge-binaries/cli/StrataLint.dll.source-address
          printf '%s\n%s\n' \
            'schema=stratalint-dotnet-binary-source-address-v1' \
            'source_address=${{ steps.judge-address.outputs.address }}' \
            > .judge-binaries/scribe/StrataLint.Scribe.Documents.dll.source-address
      - name: Save judge binaries and candidate build outputs by content address (dev push only)
        if: steps.engineering.outcome == 'success' && steps.stage-judge.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/cache/save@v4
        with:
          path: |
            .judge-binaries
            candidate/tools/**/bin
            candidate/tools/**/obj
          key: stratalint-judge-binaries-v2-${{ runner.os }}-${{ steps.judge-address.outputs.runtime }}-${{ steps.judge-address.outputs.address }}
      - name: Save elan toolchain for engineering checks (dev push only)
        if: always() && steps.install-elan.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/cache/save@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-${{ runner.arch }}-elan-${{ steps.lean.outputs.hash }}
      - name: Summarize candidate engineering scope
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git -C candidate rev-parse HEAD^1)"
          {
            printf '%s\n' '## Candidate engineering scope'
            printf '\n'
            printf -- '- Event: %s\n' "$GITHUB_EVENT_NAME"
            printf -- '- Protected base: %s\n' "$base_sha"
            printf -- '%s\n' '- Selected projects: see the ENGINEERING_TEST_PROJECT log lines of the project-scoped engineering test step.'
          } >> "$GITHUB_STEP_SUMMARY"

  lean-inspect:
    name: Canonical Lean report production
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    outputs:
      baseline_sha: ${{ steps.base.outputs.sha }}
    steps:
      - name: Wait for the GitHub merge ref
        if: github.event_name == 'pull_request_target'
        run: "set -euo pipefail\nfor attempt in {1..25}; do\n  timestamp=\"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\"\n  printf '%s poll=%s/25\\n' \"$timestamp\" \"$attempt\"\n  if git ls-remote --exit-code \"https://github.com/${{ github.repository }}.git\" \"refs/pull/${{ github.event.pull_request.number }}/merge\" >/dev/null 2>&1; then exit 0; fi\n  sleep 5\ndone\nprintf '%s\\n' \"merge ref absent after 125s (conflicted PR or still computing)\"\nexit 0"
      - name: Check out candidate with history
        id: checkout-merge
        continue-on-error: ${{ github.event_name == 'pull_request_target' }}
        uses: actions/checkout@v4
        with: { ref: "${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}", fetch-depth: 0, persist-credentials: false, path: candidate }
      - name: Strip checkout remote state
        if: steps.checkout-merge.outcome == 'success'
        shell: bash
        env:
          CHECKOUT_PATH: candidate
        run: |
          set -euo pipefail
          git -C "$CHECKOUT_PATH" remote remove origin
          git -C "$CHECKOUT_PATH" for-each-ref --format='delete %(refname)' refs/remotes/ |
            git -C "$CHECKOUT_PATH" update-ref --stdin
          remote_count="$(git -C "$CHECKOUT_PATH" remote | wc -l)"
          remote_ref_count="$(git -C "$CHECKOUT_PATH" for-each-ref --format='%(refname)' refs/remotes/ | wc -l)"
          if [[ "$remote_count" -ne 0 || "$remote_ref_count" -ne 0 ]]; then
            printf '%s\n' "checkout still exposes remotes or remote-tracking refs" >&2
            exit 1
          fi
          head_sha="$(git -C "$CHECKOUT_PATH" rev-parse HEAD)"
          base_sha="$(git -C "$CHECKOUT_PATH" rev-parse HEAD^1)"
          test -n "$head_sha"
          test -n "$base_sha"
      - name: Fail closed when merge result is unavailable
        if: always() && steps.checkout-merge.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request_target" ]]; then
            printf '%s\n' "cannot check out GitHub merge ref refs/pull/${{ github.event.pull_request.number }}/merge; conflicted pull requests have no merge result, so admission fails closed" >&2
          else
            printf '%s\n' "cannot check out push commit $GITHUB_SHA; admission fails closed" >&2
          fi
          exit 1
      - name: Install pinned SDK for statement projection reconciliation
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: candidate/global.json
      - name: Resolve judge binary content address before build outputs exist
        id: judge-address
        shell: bash
        run: |
          set -euo pipefail
          source_address="${{ hashFiles('candidate/tools/**', 'candidate/Blueprint/**/*.scribe.cs', 'candidate/Directory.*', 'candidate/.editorconfig', 'candidate/global.json') }}"
          workflow_ref=HEAD
          if [[ "$GITHUB_EVENT_NAME" == "pull_request_target" ]]; then workflow_ref=HEAD^1; fi
          workflow_address="$(git -C candidate rev-parse "${workflow_ref}:.github/workflows/ci.yml")"
          source_address="$(printf 'sources=%s\nworkflow=%s\n' "$source_address" "$workflow_address" | sha256sum | cut -d ' ' -f 1)"
          candidate/tools/scripts/workflow/judge-content-address.sh "$source_address" >> "$GITHUB_OUTPUT"
      - name: Restore judge binaries and candidate build outputs
        id: judge-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .judge-binaries
            candidate/tools/**/bin
            candidate/tools/**/obj
          key: stratalint-judge-binaries-v2-${{ runner.os }}-${{ steps.judge-address.outputs.runtime }}-${{ steps.judge-address.outputs.address }}
      - name: Resolve checked merge result's dev parent
        id: base
        shell: bash
        run: |
          set -euo pipefail
          # PR merge refs and dev push commits both carry their protected base as
          # the checked object's first parent, so the verdict has no event-payload input.
          sha="$(git -C candidate rev-parse HEAD^1)"
          if [[ -z "$sha" || "$sha" =~ ^0+$ ]]; then
            printf '%s\n' "checked object has no content-addressable base SHA" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Resolve candidate canonical Lean report address
        id: lean-report-input
        shell: bash
        run: |
          set -euo pipefail
          helper="$GITHUB_WORKSPACE/candidate/tools/scripts/report/lean-report-input.sh"
          test -x "$helper"
          read -r address producer_sha256 sources_sha256 config_sha256 \
            <<< "$("$helper" address --repository "$GITHUB_WORKSPACE/candidate")"
          [[ "$address" =~ ^[0-9a-f]{64}$ ]]
          [[ "$producer_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$sources_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$config_sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "address=$address" >> "$GITHUB_OUTPUT"
          echo "producer_sha256=$producer_sha256" >> "$GITHUB_OUTPUT"
          echo "sources_sha256=$sources_sha256" >> "$GITHUB_OUTPUT"
          echo "config_sha256=$config_sha256" >> "$GITHUB_OUTPUT"
          # 报告地址的原像是 producer(MSBuild 求值的 Cli/Engine Compile 集 + 声明的
          # project/build/lock/global 输入 + inspector)、Lean 源(Trureturing.lean +
          # D5/**/*.lean)与 config(toolchain/lake-manifest/lakefile)三者的清单哈希。

      # 精确 key 命中仍直接复用;prefix restore 只提供陈旧 delta 基线,不算 cache hit。adapter 与现行 delta 机器重验报告、provenance、materials 与 producer logs;
      # 任一项不可信就不给 cache root,沿原路径全量生产。下游仍逐模块核对 source_sha256,故陈旧报告不能被静默接受。
      - name: Restore canonical Lean report by input address
        id: report-cache
        uses: actions/cache/restore@v4
        with:
          path: .canonical-lean-report-cache
          key: stratalint-canonical-lean-report-v2-${{ steps.lean-report-input.outputs.address }}
          restore-keys: stratalint-canonical-lean-report-v2-
      - name: Serve candidate canonical Lean report from the cached address
        id: report-reuse
        if: steps.report-cache.outputs.cache-hit == 'true'
        # 这一步失败必须**回落**到完整生产路径,而不是让整个 job 红:缓存是加速,不是权威。
        # 下面四个重活步骤的守卫是 `outcome != 'success'`,故失败与跳过都会走原路。
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          source="$GITHUB_WORKSPACE/.canonical-lean-report-cache/raw-lean-report.json"
          reports="$RUNNER_TEMP/raw-lean-reports"
          mkdir -p "$reports"
          validator="$GITHUB_WORKSPACE/candidate/tools/scripts/report/lean-report-bundle-lib.sh"
          # shellcheck source=/dev/null
          source "$validator"
          # 缓存条目对候选树重验十键 provenance、三类 sidecar 与材料 ZIP;
          # 任一不符即整体回落,不静默使用。
          lean_report_bundle_validate \
            "$source" \
            '${{ steps.lean-report-input.outputs.address }}' \
            '${{ steps.lean-report-input.outputs.producer_sha256 }}' \
            '${{ steps.lean-report-input.outputs.producer_sha256 }}' \
            '${{ steps.lean-report-input.outputs.sources_sha256 }}' \
            '${{ steps.lean-report-input.outputs.config_sha256 }}' >/dev/null
          for suffix in '' .input.attestation .provenance.json .materials.zip; do
            cp "${source}${suffix}" "$reports/candidate-lean-report.json${suffix}"
          done
          printf '%s  %s\n' \
            "$(sha256sum "$reports/candidate-lean-report.json" | cut -d ' ' -f 1)" \
            "candidate-lean-report.json" > "$reports/candidate-lean-report.json.sha256"
          printf '%s\n' "canonical Lean reports served from cached input address" >> "$GITHUB_STEP_SUMMARY"
      - name: Restore elan and pinned Lean toolchains
        if: steps.report-reuse.outcome != 'success'
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-${{ runner.arch }}-elan-${{ hashFiles('candidate/lean-toolchain') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-elan-
      - name: Install pinned Lean toolchains
        id: install-elan
        if: steps.report-reuse.outcome != 'success'
        shell: bash
        run: |
          if [[ ! -x "$GITHUB_WORKSPACE/candidate/tools/scripts/workflow/install-lean-toolchain.sh" ]]; then
            printf '%s\n' "candidate Lean toolchain installer is absent (merge dev to pick it up)" >&2
            exit 1
          fi
          "$GITHUB_WORKSPACE/candidate/tools/scripts/workflow/install-lean-toolchain.sh" candidate/lean-toolchain
      - name: Build Scribe binary on judge cache miss
        if: steps.judge-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .judge-binaries/scribe
          dotnet build candidate/tools/StrataLint.Scribe.Documents/StrataLint.Scribe.Documents.csproj \
            --configuration Release \
            --output .judge-binaries/scribe
          test -s .judge-binaries/scribe/StrataLint.Scribe.Documents.dll
          printf '%s\n%s\n' \
            'schema=stratalint-dotnet-binary-source-address-v1' \
            'source_address=${{ steps.judge-address.outputs.address }}' \
            > .judge-binaries/scribe/StrataLint.Scribe.Documents.dll.source-address
      - name: Restore candidate Lean dependency artifacts
        id: lake-deps-cache
        if: steps.report-reuse.outcome != 'success'
        uses: actions/cache/restore@v4
        with:
          path: |
            candidate/.lake/packages
            candidate/.lake/config
            candidate/.lake/.stratalint-lean-cache-stamp.json
            ~/.cache/mathlib
          key: ${{ runner.os }}-${{ runner.arch }}-lake-deps-v1-${{ steps.lean-report-input.outputs.config_sha256 }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-lake-deps-v1-${{ steps.lean-report-input.outputs.config_sha256 }}
      # project 层优先取 Actions cache:它每次 dev push 写一份(约 8 分钟一份),
      # 而 Release 是 `cron: 0 */6 * * *` 且只许 schedule(实测间隔可达 7h05m)。
      # 精确命中结构上不可能(key 含 sources_sha256,每个改 Lean 的候选都不同),
      # 故这里靠 restore-keys 前缀回退取「最近一次 dev push 的 project 层」。
      - name: Restore candidate Lean project build artifacts
        id: lake-build-cache
        if: steps.report-reuse.outcome != 'success'
        uses: actions/cache/restore@v4
        with:
          path: candidate/.lake/build
          key: ${{ runner.os }}-${{ runner.arch }}-lake-build-v1-${{ steps.lean-report-input.outputs.config_sha256 }}-${{ steps.lean-report-input.outputs.sources_sha256 }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-lake-build-v1-${{ steps.lean-report-input.outputs.config_sha256 }}-
      # Release 只作兜底:仅当 Actions 层**连前缀都没回退到**时才取。
      # `lake unpack` 是合并语义(Lake 4.33 Lake/Build/Actions.lean:182-191,无预删除),
      # 无条件执行会让较旧的 Release 按同名路径覆盖较新的 Actions 层,反而增加补编 ——
      # 这正是 #5640 的方向错误,由 τ=0 owner 2026-09-06 指出并纠正。
      # 判据用 cache-matched-key 而非 cache-hit:后者仅精确命中为 true,在此恒假。
      - name: Fetch required Lean release build layer when the Actions layer is absent
        if: steps.report-reuse.outcome != 'success' && steps.lake-build-cache.outputs.cache-matched-key == ''
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'Actions project 层缺席;取 release cache,取回失败即失败,不回落编译'
          PATH="$HOME/.elan/bin:$PATH" candidate/tools/scripts/worktree/lean-cache-publish.sh fetch --repository "$GITHUB_WORKSPACE/candidate"
      - name: Run canonical Lean inspection judgment
        env:
          EVENT: ${{ github.event_name == 'pull_request_target' && 'PR' || 'push' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.workspace }}/candidate
          REPORT: ${{ runner.temp }}/raw-lean-reports/candidate-lean-report.json
          LEAN_INSPECT_EVIDENCE: ${{ runner.temp }}/raw-lean-reports/lean-inspect-segment-evidence.json
          REPORT_CACHE_BUNDLE: ${{ github.workspace }}/.canonical-lean-report-cache/raw-lean-report.json
          REPORT_CACHE_ROOT: ${{ runner.temp }}/canonical-lean-report-delta-cache
          SCRIBE_DLL: ${{ github.workspace }}/.judge-binaries/scribe/StrataLint.Scribe.Documents.dll
          SCRIBE_SOURCE_ADDRESS: ${{ steps.judge-address.outputs.address }}
        shell: bash
        run: make -C candidate lean-inspect
      - name: Stage candidate canonical Lean report cache
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/raw-lean-reports/candidate-lean-report.json"
          target="$GITHUB_WORKSPACE/.canonical-lean-report-cache/raw-lean-report.json"
          mkdir -p "$(dirname "$target")"
          for suffix in '' .input.attestation .provenance.json .materials.zip; do
            test -s "${source}${suffix}"
            cp "${source}${suffix}" "${target}${suffix}"
          done
          read -r declaredSha256 declaredName < "${source}.sha256"
          reportSha256="$(sha256sum "$target" | cut -d ' ' -f 1)"
          test "$declaredSha256" = "$reportSha256"
          test "$declaredName" = "$(basename "$source")"
          printf '%s  %s\n' "$reportSha256" "$(basename "$target")" > "${target}.sha256"
          cp -R "${source}.logs" "${target}.logs" 2>/dev/null || true
          "$GITHUB_WORKSPACE/candidate/tools/scripts/report/lean-report-input.sh" verify \
            --repository "$GITHUB_WORKSPACE/candidate" \
            --report "$target"

      # pull_request_target runs get a token without cache-write scope, so this save can only ever fail there: run 31389667812 logged "cache write denied: token has no writable scopes". The two saves below already carry this exact guard; this one was missing it, so every PR attempted a write it could not perform. dev-push runs do write it successfully (run 31389340892).
      # 命中报告缓存时 elan/lake 目录未被恢复也未被填充,回存会写入空态并污染下一轮;分层 lake cache exact hit 时对应 key 也已存在。三个 save 只在真正跑过生产路径时执行。
      - name: Save candidate canonical Lean report (dev push only)
        if: success() && steps.report-reuse.outcome != 'success' && github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/cache/save@v4
        with:
          path: .canonical-lean-report-cache
          key: stratalint-canonical-lean-report-v2-${{ steps.lean-report-input.outputs.address }}
      - name: Upload raw Lean reports and producer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-lean-reports
          path: ${{ runner.temp }}/raw-lean-reports
          if-no-files-found: warn
          retention-days: 7

      # 命中报告缓存时 elan/lake 目录未被恢复也未被填充,回存会写入空态并污染下一轮;分层 lake cache exact hit 时对应 key 也已存在。三个 save 只在真正跑过生产路径时执行。
      - name: Save elan toolchains (dev push only)
        # 不挂在 success() 上:elan 装成功就该存。否则一次下载失败会让 job 红、缓存不写、
        # 下次继续 miss,故障自我延续。
        if: always() && steps.install-elan.outcome == 'success' && steps.report-reuse.outcome != 'success' && github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/cache/save@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-${{ runner.arch }}-elan-${{ hashFiles('candidate/lean-toolchain') }}

      # 命中报告缓存时 elan/lake 目录未被恢复也未被填充,回存会写入空态并污染下一轮;分层 lake cache exact hit 时对应 key 也已存在。三个 save 只在真正跑过生产路径时执行。
      - name: Save Lean project build artifacts (dev push only)
        if: success() && steps.report-reuse.outcome != 'success' && steps.lake-build-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/dev'
        continue-on-error: true
        timeout-minutes: 12
        uses: actions/cache/save@v4
        with:
          path: candidate/.lake/build
          key: ${{ runner.os }}-${{ runner.arch }}-lake-build-v1-${{ steps.lean-report-input.outputs.config_sha256 }}-${{ steps.lean-report-input.outputs.sources_sha256 }}
      - name: Save Lean dependency artifacts (dev push only)
        if: success() && steps.report-reuse.outcome != 'success' && steps.lake-deps-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/dev'
        continue-on-error: true
        timeout-minutes: 12
        uses: actions/cache/save@v4
        with:
          path: |
            candidate/.lake/packages
            candidate/.lake/config
            candidate/.lake/.stratalint-lean-cache-stamp.json
            ~/.cache/mathlib
          key: ${{ runner.os }}-${{ runner.arch }}-lake-deps-v1-${{ steps.lean-report-input.outputs.config_sha256 }}
  baseline-admission:
    name: Content-addressed dev baseline admission
    needs: lean-inspect
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      DEV_BASELINE_SHA: ${{ needs.lean-inspect.outputs.baseline_sha }}
    steps:
      - name: Wait for the GitHub merge ref
        if: github.event_name == 'pull_request_target'
        run: "set -euo pipefail\nfor attempt in {1..25}; do\n  timestamp=\"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\"\n  printf '%s poll=%s/25\\n' \"$timestamp\" \"$attempt\"\n  if git ls-remote --exit-code \"https://github.com/${{ github.repository }}.git\" \"refs/pull/${{ github.event.pull_request.number }}/merge\" >/dev/null 2>&1; then exit 0; fi\n  sleep 5\ndone\nprintf '%s\\n' \"merge ref absent after 125s (conflicted PR or still computing)\"\nexit 0"
      - name: Check out candidate with history
        id: checkout-merge
        continue-on-error: ${{ github.event_name == 'pull_request_target' }}
        uses: actions/checkout@v4
        with: { ref: "${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}", fetch-depth: 0, persist-credentials: false, path: candidate }
      - name: Strip checkout remote state
        if: steps.checkout-merge.outcome == 'success'
        shell: bash
        env:
          CHECKOUT_PATH: candidate
        run: |
          set -euo pipefail
          git -C "$CHECKOUT_PATH" remote remove origin
          git -C "$CHECKOUT_PATH" for-each-ref --format='delete %(refname)' refs/remotes/ |
            git -C "$CHECKOUT_PATH" update-ref --stdin
          remote_count="$(git -C "$CHECKOUT_PATH" remote | wc -l)"
          remote_ref_count="$(git -C "$CHECKOUT_PATH" for-each-ref --format='%(refname)' refs/remotes/ | wc -l)"
          if [[ "$remote_count" -ne 0 || "$remote_ref_count" -ne 0 ]]; then
            printf '%s\n' "checkout still exposes remotes or remote-tracking refs" >&2
            exit 1
          fi
          head_sha="$(git -C "$CHECKOUT_PATH" rev-parse HEAD)"
          base_sha="$(git -C "$CHECKOUT_PATH" rev-parse HEAD^1)"
          test -n "$head_sha"
          test -n "$base_sha"
      - name: Fail closed when merge result is unavailable
        if: always() && steps.checkout-merge.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request_target" ]]; then
            printf '%s\n' "cannot check out GitHub merge ref refs/pull/${{ github.event.pull_request.number }}/merge; conflicted pull requests have no merge result, so admission fails closed" >&2
          else
            printf '%s\n' "cannot check out push commit $GITHUB_SHA; admission fails closed" >&2
          fi
          exit 1
      - name: Install pinned SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: candidate/global.json
      - name: Resolve judge binary content address before build outputs exist
        id: judge-address
        shell: bash
        run: |
          set -euo pipefail
          source_address="${{ hashFiles('candidate/tools/**', 'candidate/Blueprint/**/*.scribe.cs', 'candidate/Directory.*', 'candidate/.editorconfig', 'candidate/global.json') }}"
          workflow_ref=HEAD
          if [[ "$GITHUB_EVENT_NAME" == "pull_request_target" ]]; then workflow_ref=HEAD^1; fi
          workflow_address="$(git -C candidate rev-parse "${workflow_ref}:.github/workflows/ci.yml")"
          source_address="$(printf 'sources=%s\nworkflow=%s\n' "$source_address" "$workflow_address" | sha256sum | cut -d ' ' -f 1)"
          candidate/tools/scripts/workflow/judge-content-address.sh "$source_address" >> "$GITHUB_OUTPUT"
      - name: Restore judge binaries and candidate build outputs
        id: judge-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .judge-binaries
            candidate/tools/**/bin
            candidate/tools/**/obj
          key: stratalint-judge-binaries-v2-${{ runner.os }}-${{ steps.judge-address.outputs.runtime }}-${{ steps.judge-address.outputs.address }}
      # Since 2025-12-08, pull_request_target evaluates github.sha as the repository default branch (dev) tip S for every PR regardless of its base.
      # The primary key K(S) is therefore tried first for all PRs; it hits when a dev push run has already saved K(S)
      # (a dev push saves only when the entry set changed). restore-keys prefix fallback selects the most recently saved cache otherwise;
      # for PRs whose base is an integration-** branch the entries may not correspond to that base and then miss at the Engine (fail-closed).
      - name: Restore base-side unknown-debt test maps
        id: test-map-cache
        uses: actions/cache/restore@v4
        with:
          path: .stratalint-test-map-cache
          key: stratalint-test-map-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: stratalint-test-map-v1-${{ runner.os }}-
      - name: Snapshot test map cache before the gate
        id: test-map-before
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .stratalint-test-map-cache
          find .stratalint-test-map-cache -maxdepth 1 -type f -name '*.json' -exec sha256sum {} + | sort | sha256sum | cut -d ' ' -f 1 > "$RUNNER_TEMP/test-map-before.sha"
      - name: Download canonical Lean reports
        uses: actions/download-artifact@v4
        with:
          name: raw-lean-reports
          path: ${{ runner.temp }}/raw-lean-reports
      - name: Run canonical admission judgment
        shell: bash
        env:
          EVENT: ${{ github.event_name == 'pull_request_target' && 'PR' || 'push' }}
          REPOSITORY: ${{ github.workspace }}/candidate
          REPORT: ${{ runner.temp }}/raw-lean-reports/candidate-lean-report.json
          LEAN_INSPECT_EVIDENCE: ${{ runner.temp }}/raw-lean-reports/lean-inspect-segment-evidence.json
          JUDGE_DLL: ${{ steps.judge-cache.outputs.cache-hit == 'true' && format('{0}/.judge-binaries/cli/StrataLint.dll', github.workspace) || '' }}
          JUDGE_SOURCE_ADDRESS: ${{ steps.judge-address.outputs.address }}
          TEST_MAP_CACHE_ROOT: ${{ github.workspace }}/.stratalint-test-map-cache
          STRATALINT_TIMING: ${{ runner.temp }}/gate-timing.jsonl
        run: make -C candidate admission
      - name: Prune and fingerprint test map cache after the gate (push only)
        id: test-map-after
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          # keep the 16 newest by mtime(not LRU): fork-point age of the last 40 dev merges was p50<1h / p90 2h / max 3h
          # (2026-09-06, git merge-base age), and dev merges touching derivation inputs ran at
          # 112 per 24h; 16 entries cover the observed maximum. Policy constant, not a capacity
          # derivation; revisit when either reading moves.
          # readings: issue #5458 comment 2026-09-06 (sshx transcript jp0905c); fork-point age via `git merge-base` over the last 40 first-parent dev merges
          find .stratalint-test-map-cache -maxdepth 1 -type f -name '*.json' -printf '%T@ %f\n' | sort -rn | tail -n +17 | cut -d ' ' -f 2- | while read -r stale; do rm -f -- ".stratalint-test-map-cache/$stale"; done
          after="$(find .stratalint-test-map-cache -maxdepth 1 -type f -name '*.json' -exec sha256sum {} + | sort | sha256sum | cut -d ' ' -f 1)"
          before="$(cat "$RUNNER_TEMP/test-map-before.sha")"
          changed=false
          if [[ "$after" != "$before" ]]; then changed=true; fi
          printf 'changed=%s\n' "$changed" >> "$GITHUB_OUTPUT"
          printf 'test-map-cache entries=%s changed=%s\n' "$(find .stratalint-test-map-cache -maxdepth 1 -type f -name '*.json' | wc -l)" "$changed"
      - name: Save test map cache by push SHA (push only, when changed)
        if: always() && github.event_name == 'push' && steps.test-map-after.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .stratalint-test-map-cache
          key: stratalint-test-map-v1-${{ runner.os }}-${{ github.sha }}
      - name: Upload gate timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-timing
          path: ${{ runner.temp }}/gate-timing.jsonl
          if-no-files-found: warn
          retention-days: 7
