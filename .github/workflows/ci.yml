name: admission

on:
  push:
    branches: [dev, 'integration-**']
  pull_request:
    branches: [dev, 'integration-**']
    types: [opened, synchronize, reopened]

permissions:
  contents: read
# PR updates cancel earlier runs for the same PR. Pushes use the ref and commit
# so different branches and later merges retain their checks and cache writes.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: true

# Native pull_request runs the candidate workflow on GitHub's post-merge tree.
# The candidate-owned Lean producer and .NET judge inspect that tree (candidate
# plus the protected first parent). Candidate engineering is only a signal.
# Admission consumes immutable raw reports from the predecessor job; the protected
# base is the checked merge commit's first-parent SHA passed to the gate. The
# workflow itself retains an unfiltered floor for engineering and root inputs.
jobs:
  candidate-engineering:
    name: Candidate harness engineering checks
    runs-on: ubuntu-24.04-arm
    # 20 分钟对本 job 已结构性不足:凡改动命中 tools/** 者,EngineeringScope 的测试选择器
    # 选中 0 个、回退 full,跑满全部测试套件,实测 20–21 分钟(#3940)。
    # 证据:PR #3943(生产 +4/-4、新增测试实测 221ms)连续五次 CANCELLED
    # (20m04 / 20m15 / ~21m / ~21m / ~21m);同期 dev 上 13–19 分钟通过的 run 全部 0 行
    # tools/ 改动,选择器能裁剪。dev 自身亦出现过一次 CANCELLED(50a319d9c,20m13s)。
    # 30 分钟给 full scope 留约 50% 余量;同文件的 Lean report job 预算已是 45 分钟。
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        id: checkout-merge
        uses: actions/checkout@v4
        with: { ref: "${{ github.sha }}", fetch-depth: 0, persist-credentials: false, path: candidate }
      - name: Strip checkout remote state
        if: steps.checkout-merge.outcome == 'success'
        shell: bash
        env:
          CHECKOUT_PATH: candidate
        run: |
          set -euo pipefail
          git -C "$CHECKOUT_PATH" remote remove origin
          git -C "$CHECKOUT_PATH" for-each-ref --format='delete %(refname)' refs/remotes/ |
            git -C "$CHECKOUT_PATH" update-ref --stdin
          remote_count="$(git -C "$CHECKOUT_PATH" remote | wc -l)"
          remote_ref_count="$(git -C "$CHECKOUT_PATH" for-each-ref --format='%(refname)' refs/remotes/ | wc -l)"
          if [[ "$remote_count" -ne 0 || "$remote_ref_count" -ne 0 ]]; then
            printf '%s\n' "checkout still exposes remotes or remote-tracking refs" >&2
            exit 1
          fi
          head_sha="$(git -C "$CHECKOUT_PATH" rev-parse HEAD)"
          base_sha="$(git -C "$CHECKOUT_PATH" rev-parse HEAD^1)"
          test -n "$head_sha"
          test -n "$base_sha"
      - name: Fail closed when candidate checkout is unavailable
        if: always() && steps.checkout-merge.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "cannot check out immutable candidate commit $GITHUB_SHA; admission fails closed" >&2
          exit 1
      - name: Install candidate-pinned SDK for candidate build and tests
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: candidate/global.json
      - name: Resolve judge binary content address before build outputs exist
        id: judge-address
        shell: bash
        run: |
          set -euo pipefail
          source_address="${{ hashFiles('candidate/tools/**', 'candidate/Blueprint/**/*.scribe.cs', 'candidate/Directory.*', 'candidate/.editorconfig', 'candidate/global.json') }}"
          workflow_address="$(git -C candidate rev-parse HEAD:.github/workflows)"
          source_address="$(printf 'sources=%s\nworkflow=%s\n' "$source_address" "$workflow_address" | sha256sum | cut -d ' ' -f 1)"
          candidate/tools/scripts/workflow/judge-content-address.sh "$source_address" >> "$GITHUB_OUTPUT"
      - name: Restore judge binaries and candidate build outputs
        id: judge-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .judge-binaries
            candidate/tools/**/bin
            candidate/tools/**/obj
          key: stratalint-judge-binaries-v2-${{ runner.os }}-${{ steps.judge-address.outputs.runtime }}-${{ steps.judge-address.outputs.address }}
      - name: Resolve pinned Lean toolchain
        id: lean
        shell: bash
        env:
          LEAN_TOOLCHAIN_FILE: candidate/lean-toolchain
        run: |
          set -euo pipefail
          test -s "$LEAN_TOOLCHAIN_FILE"
          echo "file=$LEAN_TOOLCHAIN_FILE" >> "$GITHUB_OUTPUT"
          echo "hash=$(sha256sum "$LEAN_TOOLCHAIN_FILE" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore elan and pinned Lean toolchain
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-${{ runner.arch }}-elan-${{ steps.lean.outputs.hash }}
          # 前缀回退保留,让候选工程 job 可以复用 inspect job 写入的相近工具链缓存。
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-elan-
      - name: Install pinned Lean toolchain for producer integration tests
        id: install-elan
        shell: bash
        env:
          LEAN_TOOLCHAIN_FILE: ${{ steps.lean.outputs.file }}
        run: |
          if [[ ! -x "$GITHUB_WORKSPACE/candidate/tools/scripts/workflow/install-lean-toolchain.sh" ]]; then
            printf '%s\n' "candidate Lean toolchain installer is absent (merge dev to pick it up)" >&2
            exit 1
          fi
          "$GITHUB_WORKSPACE/candidate/tools/scripts/workflow/install-lean-toolchain.sh" "$LEAN_TOOLCHAIN_FILE" --github-path "$GITHUB_PATH"
      - name: Restore candidate locked dependencies
        run: |
          dotnet restore candidate/tools/tests/CompileFailProof/CompileFailProof.csproj --locked-mode
          dotnet restore candidate/tools/tests/BannedApiCompileFailProof/BannedApiCompileFailProof.csproj --locked-mode
      - name: Build candidate with warnings as errors
        id: build-candidate
        if: steps.judge-cache.outputs.cache-hit != 'true'
        run: make -C candidate/tools dotnet
      - name: Stage judge binaries for the shared cache (push only)
        id: stage-judge
        if: steps.build-candidate.outcome == 'success' && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .judge-binaries/cli .judge-binaries/scribe
          dotnet publish candidate/tools/StrataLint.Cli/StrataLint.Cli.csproj \
            --configuration Release --output .judge-binaries/cli
          dotnet publish candidate/tools/StrataLint.Scribe.Documents/StrataLint.Scribe.Documents.csproj \
            --configuration Release --output .judge-binaries/scribe
          test -s .judge-binaries/cli/StrataLint.dll
          test -s .judge-binaries/scribe/StrataLint.Scribe.Documents.dll
      - name: Save judge binaries and candidate build outputs by content address (push only)
        if: steps.build-candidate.outcome == 'success' && steps.stage-judge.outcome == 'success' && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: |
            .judge-binaries
            candidate/tools/**/bin
            candidate/tools/**/obj
          key: stratalint-judge-binaries-v2-${{ runner.os }}-${{ steps.judge-address.outputs.runtime }}-${{ steps.judge-address.outputs.address }}
      - name: Signal PR head branch grammar
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'dev'
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: "set +e\nvalidation_output=\"$(dotnet run --project candidate/tools/StrataLint.Cli/StrataLint.Cli.csproj --configuration Release --no-build --no-launch-profile -- worktree validate-branch --branch \"$HEAD_REF\")\"\nvalidation_exit=$?\nset -e\nhead_ref=\"$HEAD_REF\"\nprintf '%s\\n' \"$validation_output\"\ncase \"$validation_exit\" in\n  0)\n    expected_status=canonical\n    ;;\n  1)\n    expected_status=BRANCH_GRAMMAR_NONCONFORMING\n    ;;\n  *)\n    printf 'BRANCH_GRAMMAR_SIGNAL detector_status=failed exit=%s\\n' \"$validation_exit\" >&2\n    exit \"$validation_exit\"\n    ;;\nesac\nif ! jq -e -s --arg expected_status \"$expected_status\" --arg head_ref \"$HEAD_REF\" 'length == 1 and .[0].event == \"branch_validation\" and .[0].status == $expected_status and .[0].branch == $head_ref and (.[0].canonical == ($expected_status == \"canonical\"))' <<< \"$validation_output\" >/dev/null; then\n  printf 'BRANCH_GRAMMAR_SIGNAL detector_status=invalid_output exit=%s\\n' \"$validation_exit\" >&2\n  exit 1\nfi\nsummary_format='PR head branch \"%s\" has canonical branch grammar status \"%s\". Nonconforming names are advisory; detector faults fail closed.\\n'\nif [[ \"$validation_exit\" -eq 1 ]]; then\n  printf '%s' '::warning title=PR head branch grammar::'\n  printf \"$summary_format\" \"$HEAD_REF\" \"$expected_status\"\nfi\nprintf 'BRANCH_GRAMMAR_SIGNAL status=%s head_ref=%s\\n' \"$expected_status\" \"$HEAD_REF\"\nprintf \"$summary_format\" \"$HEAD_REF\" \"$expected_status\" >> \"$GITHUB_STEP_SUMMARY\"\n"
      - name: Restore locked packages for the engineering test host (a judge cache hit skips the build)
        id: restore-packages
        run: dotnet restore candidate/tools/StrataLint.sln --locked-mode
      - name: Run candidate engineering tests with resource observation
        shell: bash
        run: /bin/bash candidate/tools/scripts/workflow/engineering-test-execution-harness.sh "$GITHUB_WORKSPACE/candidate"

      - name: Run candidate selftest twice and compare bytes
        shell: bash
        run: make -C candidate/tools selftest
      - name: Audit repository capacity after merge
        if: github.event_name == 'push' && !cancelled()
        shell: bash
        run: make -C candidate/tools capacity-audit REPOSITORY="$GITHUB_WORKSPACE/candidate"
      - name: Prove missing capability does not compile
        shell: bash
        run: |
          set +e
          output="$(dotnet build candidate/tools/tests/CompileFailProof/CompileFailProof.csproj --no-restore --configuration Release 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -F "CS7036" <<<"$output"
          grep -F "MetaClear" <<<"$output"
      - name: Prove banned deterministic APIs do not compile
        shell: bash
        run: |
          proof="candidate/tools/tests/BannedApiCompileFailProof/BannedApiViolations.cs"
          set +e
          output="$(dotnet build candidate/tools/tests/BannedApiCompileFailProof/BannedApiCompileFailProof.csproj --no-restore --configuration Release 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          mapfile -t expected_lines < <(grep -nF "// banned-api-proof" "$proof" | cut -d: -f1)
          mapfile -t actual_lines < <(
            sed -n 's#.*BannedApiViolations.cs(\([0-9][0-9]*\),[0-9][0-9]*): error RS0030:.*#\1#p' <<<"$output" | sort -nu
          )
          test "${#expected_lines[@]}" -gt 0
          test "${#actual_lines[@]}" -eq "${#expected_lines[@]}"
          test -z "$(grep -F ': error ' <<<"$output" | grep -vF ': error RS0030:' || true)"
          index=0
          for expected_line in "${expected_lines[@]}"; do
            test "${actual_lines[$index]}" = "$expected_line"
            ((index += 1))
          done
      - name: Save elan toolchain for engineering checks (push only)
        if: always() && steps.install-elan.outcome == 'success' && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-${{ runner.arch }}-elan-${{ steps.lean.outputs.hash }}
      - name: Summarize candidate engineering scope
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git -C candidate rev-parse HEAD^1)"
          {
            printf '%s\n' '## Candidate engineering scope'
            printf '\n'
            printf -- '- Event: %s\n' "$GITHUB_EVENT_NAME"
            printf -- '- Protected base: %s\n' "$base_sha"
            printf -- '%s\n' '- Selected projects: see the ENGINEERING_TEST_PROJECT log lines of the project-scoped engineering test step.'
          } >> "$GITHUB_STEP_SUMMARY"

  lean-inspect:
    name: Canonical Lean report production
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      # 缓存作用域:dev 为空串(key 与既往逐字节相同);integration-* 为「<分支>-」,使前缀回落先取本分支 push 存的层,再回落无作用域前缀。
      CACHE_SCOPE: ${{ startsWith(github.base_ref || github.ref_name, 'integration-') && format('{0}-', github.base_ref || github.ref_name) || '' }}
    outputs:
      baseline_sha: ${{ steps.base.outputs.sha }}
      history_required: ${{ steps.history-plan.outputs.history_required }}
      history_matrix: ${{ steps.history-plan.outputs.history_matrix }}
      history_producer: ${{ steps.history-plan.outputs.history_producer }}
      judge_address: ${{ steps.judge-address.outputs.address }}
      judge_runtime: ${{ steps.judge-address.outputs.runtime }}
      lean_dependency: ${{ steps.lean-input.outputs.dependency_sha256 }}
      lean_config: ${{ steps.lean-input.outputs.config_sha256 }}
      lean_sources: ${{ steps.lean-input.outputs.sources_sha256 }}
      lean_build_snapshot: ${{ steps.lean-input.outputs.build_snapshot_sha256 }}
    steps:
      - name: Check out candidate with history
        id: checkout-merge
        uses: actions/checkout@v4
        with: { ref: "${{ github.sha }}", fetch-depth: 0, persist-credentials: false, path: candidate }
      - name: Strip checkout remote state
        if: steps.checkout-merge.outcome == 'success'
        shell: bash
        env:
          CHECKOUT_PATH: candidate
        run: |
          set -euo pipefail
          git -C "$CHECKOUT_PATH" remote remove origin
          git -C "$CHECKOUT_PATH" for-each-ref --format='delete %(refname)' refs/remotes/ |
            git -C "$CHECKOUT_PATH" update-ref --stdin
          remote_count="$(git -C "$CHECKOUT_PATH" remote | wc -l)"
          remote_ref_count="$(git -C "$CHECKOUT_PATH" for-each-ref --format='%(refname)' refs/remotes/ | wc -l)"
          if [[ "$remote_count" -ne 0 || "$remote_ref_count" -ne 0 ]]; then
            printf '%s\n' "checkout still exposes remotes or remote-tracking refs" >&2
            exit 1
          fi
          head_sha="$(git -C "$CHECKOUT_PATH" rev-parse HEAD)"
          base_sha="$(git -C "$CHECKOUT_PATH" rev-parse HEAD^1)"
          test -n "$head_sha"
          test -n "$base_sha"
      - name: Fail closed when candidate checkout is unavailable
        if: always() && steps.checkout-merge.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "cannot check out immutable candidate commit $GITHUB_SHA; admission fails closed" >&2
          exit 1
      - name: Install pinned SDK for statement projection reconciliation
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: candidate/global.json
      - name: Resolve judge binary content address before build outputs exist
        id: judge-address
        shell: bash
        run: |
          set -euo pipefail
          source_address="${{ hashFiles('candidate/tools/**', 'candidate/Blueprint/**/*.scribe.cs', 'candidate/Directory.*', 'candidate/.editorconfig', 'candidate/global.json') }}"
          workflow_address="$(git -C candidate rev-parse HEAD:.github/workflows)"
          source_address="$(printf 'sources=%s\nworkflow=%s\n' "$source_address" "$workflow_address" | sha256sum | cut -d ' ' -f 1)"
          candidate/tools/scripts/workflow/judge-content-address.sh "$source_address" >> "$GITHUB_OUTPUT"
      - name: Restore judge binaries and candidate build outputs
        id: judge-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .judge-binaries
            candidate/tools/**/bin
            candidate/tools/**/obj
          key: stratalint-judge-binaries-v2-${{ runner.os }}-${{ steps.judge-address.outputs.runtime }}-${{ steps.judge-address.outputs.address }}
      - name: Build candidate tools before Lean report production
        if: steps.judge-cache.outputs.cache-hit != 'true'
        shell: bash
        run: make -C candidate/tools dotnet
      - name: Resolve checked merge result's protected parent
        id: base
        shell: bash
        run: |
          set -euo pipefail
          # Native PR merge commits and dev push commits both carry their protected base as
          # the checked object's first parent, so the verdict has no event-payload input.
          sha="$(git -C candidate rev-parse HEAD^1)"
          if [[ -z "$sha" || "$sha" =~ ^0+$ ]]; then
            printf '%s\n' "checked object has no content-addressable base SHA" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Resolve candidate Lean build input addresses
        id: lean-input
        shell: bash
        run: |
          set -euo pipefail
          helper="$GITHUB_WORKSPACE/candidate/tools/scripts/worktree/lean-cache-input.sh"
          test -x "$helper"
          input_address="$("$helper" address --repository "$GITHUB_WORKSPACE/candidate")"
          [[ "$input_address" =~ ^[0-9a-f]{64}\ [0-9a-f]{64}$ ]]
          read -r sources_sha256 config_sha256 <<< "$input_address"
          echo "sources_sha256=$sources_sha256" >> "$GITHUB_OUTPUT"
          build_snapshot_sha256="$("$helper" build-snapshot-address --repository "$GITHUB_WORKSPACE/candidate")"
          [[ "$build_snapshot_sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "build_snapshot_sha256=$build_snapshot_sha256" >> "$GITHUB_OUTPUT"
          echo "config_sha256=$config_sha256" >> "$GITHUB_OUTPUT"
          dependency_sha256="$("$helper" dependency-address --repository "$GITHUB_WORKSPACE/candidate")"
          [[ "$dependency_sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "dependency_sha256=$dependency_sha256" >> "$GITHUB_OUTPUT"
      - name: Plan historical template evidence with the candidate
        id: history-plan
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          dotnet tools/StrataLint.Cli/bin/Release/net10.0/StrataLint.dll information-template-history plan \
            --protected-base "${{ steps.base.outputs.sha }}" --purpose check \
            --os "${{ runner.os }}" --arch "${{ runner.arch }}" \
            --judge-address "${{ steps.judge-address.outputs.address }}" \
            --config-address "${{ steps.lean-input.outputs.config_sha256 }}" \
            --output "$RUNNER_TEMP/information-template-history-plan.json" --github-output "$GITHUB_OUTPUT"
      - name: Upload required history plan
        if: steps.history-plan.outputs.history_required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: information-template-history-plan
          path: ${{ runner.temp }}/information-template-history-plan.json
          if-no-files-found: error
          retention-days: 7
      - name: Restore elan and pinned Lean toolchains
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-${{ runner.arch }}-elan-${{ hashFiles('candidate/lean-toolchain') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-elan-
      - name: Install pinned Lean toolchains
        id: install-elan
        shell: bash
        run: |
          if [[ ! -x "$GITHUB_WORKSPACE/candidate/tools/scripts/workflow/install-lean-toolchain.sh" ]]; then
            printf '%s\n' "candidate Lean toolchain installer is absent (merge dev to pick it up)" >&2
            exit 1
          fi
          "$GITHUB_WORKSPACE/candidate/tools/scripts/workflow/install-lean-toolchain.sh" candidate/lean-toolchain
      # Dependency olean compatibility follows lean-toolchain + pinned lake-manifest.json.
      # The lakefile only shapes the project layer, whose config_sha256 key stays broader.
      # Prefix restore may cross manifest/toolchain versions; it is a best-effort seed.
      # Lake traces determine validity; the prefix alone guarantees neither correctness
      # nor a warm build within 45 minutes. Normal Lean build, report, and check
      # failures remain terminal.
      - name: Restore candidate Lean dependency artifacts
        id: lake-deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            candidate/.lake/packages
            candidate/.lake/config
            candidate/.lake/.stratalint-lean-cache-stamp.json
            ~/.cache/mathlib
          key: ${{ runner.os }}-${{ runner.arch }}-lake-deps-v2-${{ steps.lean-input.outputs.dependency_sha256 }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-lake-deps-v2-
      # project 层优先取 Actions cache:它每次 dev push 写一份(约 8 分钟一份),
      # 而 Release 是 `cron: 0 */6 * * *` 且只许 schedule(实测间隔可达 7h05m)。
      # 精确命中结构上不可能(key 含 sources_sha256,每个改 Lean 的候选都不同),
      # 故这里靠 restore-keys 前缀回退取「最近一次同作用域 push 的 project 层」,integration-* 先取本分支的,再回落无作用域前缀。
      - name: Restore candidate Lean project build artifacts
        id: lake-build-cache
        uses: actions/cache/restore@v4
        with:
          path: candidate/.lake/build
          key: ${{ runner.os }}-${{ runner.arch }}-lake-build-v1-${{ steps.lean-input.outputs.config_sha256 }}-${{ env.CACHE_SCOPE }}${{ steps.lean-input.outputs.sources_sha256 }}-${{ steps.lean-input.outputs.build_snapshot_sha256 }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-lake-build-v1-${{ steps.lean-input.outputs.config_sha256 }}-${{ env.CACHE_SCOPE }}
            ${{ runner.os }}-${{ runner.arch }}-lake-build-v1-${{ steps.lean-input.outputs.config_sha256 }}-
      # make lean owns optional Release fallback and its transaction budget.
      - name: Build candidate Lean project
        id: lean-build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STRATALINT_ACCEPT_COLD_BUILD: '1'
        shell: bash
        run: |
          set -euo pipefail
          PATH="$HOME/.elan/bin:$PATH" make -C candidate lean
      # Saved on push and pull_request alike: GitHub scopes a pull_request run's caches to that PR
      # (readable by its later runs, invisible to dev/integration pushes), while PR runs still read
      # the base branch's caches. A judge-changing PR therefore pays its rebuild once, not per push.
      - name: Save Lean dependency artifacts
        if: always() && steps.lean-build.outcome == 'success' && steps.lake-deps-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 12
        uses: actions/cache/save@v4
        with:
          path: |
            candidate/.lake/packages
            candidate/.lake/config
            candidate/.lake/.stratalint-lean-cache-stamp.json
            ~/.cache/mathlib
          key: ${{ runner.os }}-${{ runner.arch }}-lake-deps-v2-${{ steps.lean-input.outputs.dependency_sha256 }}
      - name: Produce source-bound canonical Lean reports
        id: candidate-report
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        shell: bash
        run: |
          set -euo pipefail
          producer="$GITHUB_WORKSPACE/candidate/tools/lean-inspector/inspect.sh"
          pair_producer="$GITHUB_WORKSPACE/candidate/tools/scripts/lean-report-pair.sh"
          test -x "$producer"
          test -f "$GITHUB_WORKSPACE/candidate/tools/lean-inspector/Inspector.lean"
          test -x "$pair_producer"
          reports="$RUNNER_TEMP/raw-lean-reports"
          mkdir -p "$reports"
          # 只产受审的 post-merge 侧。base 是同一 merge 对象的受保护第一父提交,
          # 只参与 admission gate 的 diff 语义,不再为它编译或上传第二份 Lean 报告。
          "$pair_producer" \
            --producer "$producer" \
            --lake-bin "$HOME/.elan/bin/lake" \
            --candidate-root "$GITHUB_WORKSPACE/candidate" \
            --candidate-output "$reports/candidate-lean-report.json"
      - name: Look up checked push history address
        id: history-adoption-cache
        if: github.event_name == 'push' && steps.history-plan.outputs.history_required == 'true'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/information-template-cache/${{ steps.history-plan.outputs.history_producer }}/${{ github.sha }}
          key: ${{ steps.history-plan.outputs.history_adoption_key }}
          lookup-only: true
      - name: Adopt the validated checked push report
        id: history-adopt
        if: github.event_name == 'push' && steps.history-plan.outputs.history_required == 'true'
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          dotnet tools/StrataLint.Cli/bin/Release/net10.0/StrataLint.dll information-template-history adopt \
            --plan "$RUNNER_TEMP/information-template-history-plan.json" --revision "$GITHUB_SHA" \
            --report "$RUNNER_TEMP/raw-lean-reports/candidate-lean-report.json" \
            --output "$RUNNER_TEMP/information-template-cache/${{ steps.history-plan.outputs.history_producer }}/$GITHUB_SHA" \
            --cache-root "$RUNNER_TEMP/information-template-cache" --run "${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Save adopted push evidence
        if: ${{ !cancelled() && steps.history-adopt.outcome == 'success' && steps.history-adoption-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/information-template-cache/${{ steps.history-plan.outputs.history_producer }}/${{ github.sha }}
          key: ${{ steps.history-plan.outputs.history_adoption_key }}
      # Save the existing native build snapshot after the report attempt. A
      # report failure does not revoke successful Lean-build cache supply.
      - name: Save Lean project build artifacts
        if: always() && steps.lean-build.outcome == 'success' && steps.lake-build-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 12
        uses: actions/cache/save@v4
        with:
          path: candidate/.lake/build
          key: ${{ runner.os }}-${{ runner.arch }}-lake-build-v1-${{ steps.lean-input.outputs.config_sha256 }}-${{ env.CACHE_SCOPE }}${{ steps.lean-input.outputs.sources_sha256 }}-${{ steps.lean-input.outputs.build_snapshot_sha256 }}
      - name: Run complete mathematical content checks
        shell: bash
        env:
          STRATALINT_SCRIBE_BASE: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/raw-lean-reports/candidate-lean-report.json"
          scribe="$GITHUB_WORKSPACE/candidate/tools/StrataLint.Scribe.Documents/bin/Release/net10.0/StrataLint.Scribe.Documents.dll"
          test -s "$report"
          test -s "$scribe"
          /bin/bash "$GITHUB_WORKSPACE/candidate/tools/scripts/workflow/scribe-content-checks.sh" \
            "$report" "$scribe"
      - name: Upload raw Lean reports and producer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-lean-reports
          path: ${{ runner.temp }}/raw-lean-reports
          if-no-files-found: warn
          retention-days: 7

      - name: Save elan toolchains (push only)
        # 不挂在 success() 上:elan 装成功就该存。否则一次下载失败会让 job 红、缓存不写、
        # 下次继续 miss,故障自我延续。
        if: always() && steps.install-elan.outcome == 'success' && github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-${{ runner.arch }}-elan-${{ hashFiles('candidate/lean-toolchain') }}

  information-template-history:
    name: Historical template evidence (${{ matrix.revision }})
    needs: lean-inspect
    if: needs.lean-inspect.result == 'success' && needs.lean-inspect.outputs.history_required == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.lean-inspect.outputs.history_matrix) }}
    env:
      CACHE_SCOPE: ${{ startsWith(github.base_ref || github.ref_name, 'integration-') && format('{0}-', github.base_ref || github.ref_name) || '' }}
      HISTORY_PRODUCER: ${{ needs.lean-inspect.outputs.history_producer }}
      HISTORY_REVISION: ${{ matrix.revision }}
    steps:
      - name: Check out candidate with history
        id: checkout-merge
        uses: actions/checkout@v4
        with: { ref: "${{ github.sha }}", fetch-depth: 0, persist-credentials: false, path: candidate }
      - name: Strip checkout remote state
        if: steps.checkout-merge.outcome == 'success'
        shell: bash
        env:
          CHECKOUT_PATH: candidate
        run: |
          set -euo pipefail
          git -C "$CHECKOUT_PATH" remote remove origin
          git -C "$CHECKOUT_PATH" for-each-ref --format='delete %(refname)' refs/remotes/ |
            git -C "$CHECKOUT_PATH" update-ref --stdin
          remote_count="$(git -C "$CHECKOUT_PATH" remote | wc -l)"
          remote_ref_count="$(git -C "$CHECKOUT_PATH" for-each-ref --format='%(refname)' refs/remotes/ | wc -l)"
          if [[ "$remote_count" -ne 0 || "$remote_ref_count" -ne 0 ]]; then
            printf '%s\n' "checkout still exposes remotes or remote-tracking refs" >&2
            exit 1
          fi
          head_sha="$(git -C "$CHECKOUT_PATH" rev-parse HEAD)"
          base_sha="$(git -C "$CHECKOUT_PATH" rev-parse HEAD^1)"
          test -n "$head_sha"
          test -n "$base_sha"
      - name: Fail closed when candidate checkout is unavailable
        if: always() && steps.checkout-merge.outcome != 'success'
        shell: bash
        run: exit 1
      - name: Install pinned SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: candidate/global.json
      - name: Restore candidate judge binaries
        id: judge-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .judge-binaries
            candidate/tools/**/bin
            candidate/tools/**/obj
          key: stratalint-judge-binaries-v2-${{ runner.os }}-${{ needs.lean-inspect.outputs.judge_runtime }}-${{ needs.lean-inspect.outputs.judge_address }}
      - name: Build candidate tools on a judge miss
        if: steps.judge-cache.outputs.cache-hit != 'true'
        run: make -C candidate/tools dotnet
      - name: Select the candidate CLI and an empty private execution directory
        id: cli
        shell: bash
        run: |
          set -euo pipefail
          # Relocate C intact. W can then use the existing Lean-cache archive paths.
          test ! -e producer
          mv candidate producer
          dll="$GITHUB_WORKSPACE/producer/tools/StrataLint.Cli/bin/Release/net10.0/StrataLint.dll"
          if [[ "${{ steps.judge-cache.outputs.cache-hit }}" == true ]]; then
            dll="$GITHUB_WORKSPACE/.judge-binaries/cli/StrataLint.dll"
          fi
          test -s "$dll"
          printf 'dll=%s\n' "$dll" >> "$GITHUB_OUTPUT"
      - name: Download candidate history plan
        uses: actions/download-artifact@v4
        with:
          name: information-template-history-plan
          path: ${{ runner.temp }}/history-plan
      - name: Restore exact historical evidence
        id: history-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/information-template-cache/${{ env.HISTORY_PRODUCER }}/${{ matrix.revision }}
          key: ${{ matrix.cache_key }}
      - name: Validate the restored pair against fresh historical inputs
        id: history-valid
        working-directory: producer
        shell: bash
        run: |
          set -euo pipefail
          status=miss
          if [[ "${{ steps.history-cache.outputs.cache-hit }}" == true ]]; then
            status=invalid
            if dotnet "${{ steps.cli.outputs.dll }}" information-template-history validate \
              --plan "$RUNNER_TEMP/history-plan/information-template-history-plan.json" --revision "$HISTORY_REVISION" \
              --bundle "$RUNNER_TEMP/information-template-cache/$HISTORY_PRODUCER/$HISTORY_REVISION"; then status=hit; fi
          fi
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          printf 'INFORMATION_TEMPLATE_HISTORY cache=%s revision=%s\n' "$status" "$HISTORY_REVISION"
      - name: Prepare private historical content with candidate runtime support
        if: steps.history-valid.outputs.status != 'hit'
        working-directory: producer
        run: >-
          dotnet "${{ steps.cli.outputs.dll }}" information-template-history prepare
          --plan "$RUNNER_TEMP/history-plan/information-template-history-plan.json" --revision "$HISTORY_REVISION"
          --work "$GITHUB_WORKSPACE/candidate"
      - name: Restore pinned Lean toolchains for a miss
        if: steps.history-valid.outputs.status != 'hit'
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-${{ runner.arch }}-elan-${{ hashFiles('producer/lean-toolchain') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-elan-
      - name: Install candidate Lean toolchain for a miss
        if: steps.history-valid.outputs.status != 'hit'
        run: producer/tools/scripts/workflow/install-lean-toolchain.sh producer/lean-toolchain
      # Cache archive versions bind their path list. W is named candidate so
      # these restores seed W directly from the ordinary candidate build caches.
      - name: Restore private Lean dependency seeds
        if: steps.history-valid.outputs.status != 'hit'
        uses: actions/cache/restore@v4
        with:
          path: |
            candidate/.lake/packages
            candidate/.lake/config
            candidate/.lake/.stratalint-lean-cache-stamp.json
            ~/.cache/mathlib
          key: ${{ runner.os }}-${{ runner.arch }}-lake-deps-v2-${{ needs.lean-inspect.outputs.lean_dependency }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-lake-deps-v2-
      - name: Restore private Lean project seeds
        if: steps.history-valid.outputs.status != 'hit'
        uses: actions/cache/restore@v4
        with:
          path: candidate/.lake/build
          key: ${{ runner.os }}-${{ runner.arch }}-lake-build-v1-${{ needs.lean-inspect.outputs.lean_config }}-${{ env.CACHE_SCOPE }}${{ needs.lean-inspect.outputs.lean_sources }}-${{ needs.lean-inspect.outputs.lean_build_snapshot }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-lake-build-v1-${{ needs.lean-inspect.outputs.lean_config }}-${{ env.CACHE_SCOPE }}
            ${{ runner.os }}-${{ runner.arch }}-lake-build-v1-${{ needs.lean-inspect.outputs.lean_config }}-
      - name: Produce a missing pair with W's candidate inspector
        id: history-produce
        if: steps.history-valid.outputs.status != 'hit'
        working-directory: producer
        env:
          STRATALINT_ACCEPT_COLD_BUILD: '1'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PATH="$HOME/.elan/bin:$PATH" dotnet "${{ steps.cli.outputs.dll }}" information-template-history produce \
            --plan "$RUNNER_TEMP/history-plan/information-template-history-plan.json" --revision "$HISTORY_REVISION" \
            --work "$GITHUB_WORKSPACE/candidate" --cache-root "$RUNNER_TEMP/information-template-cache" \
            --output "$RUNNER_TEMP/information-template-cache/$HISTORY_PRODUCER/$HISTORY_REVISION" \
            --run "${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Save completed historical evidence in this event's cache scope
        if: ${{ !cancelled() && steps.history-produce.outcome == 'success' && steps.history-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/information-template-cache/${{ env.HISTORY_PRODUCER }}/${{ matrix.revision }}
          key: ${{ matrix.cache_key }}
      - name: Validate and stage the complete consumer bundle
        working-directory: producer
        run: >-
          dotnet "${{ steps.cli.outputs.dll }}" information-template-history validate
          --plan "$RUNNER_TEMP/history-plan/information-template-history-plan.json" --revision "$HISTORY_REVISION"
          --bundle "$RUNNER_TEMP/information-template-cache/$HISTORY_PRODUCER/$HISTORY_REVISION"
          --output "$RUNNER_TEMP/history-artifact/information-template-history/$HISTORY_REVISION"
      - name: Upload complete historical evidence
        uses: actions/upload-artifact@v4
        with:
          name: information-template-history-${{ matrix.revision }}
          path: ${{ runner.temp }}/history-artifact
          if-no-files-found: error
          retention-days: 7

  baseline-admission:
    name: Content-addressed dev baseline admission
    needs: [lean-inspect, information-template-history]
    if: always()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      DEV_BASELINE_SHA: ${{ needs.lean-inspect.outputs.baseline_sha }}
    steps:
      - name: Require the candidate report and every planned history item
        shell: bash
        env:
          CURRENT_RESULT: ${{ needs.lean-inspect.result }}
          HISTORY_REQUIRED: ${{ needs.lean-inspect.outputs.history_required }}
          HISTORY_RESULT: ${{ needs.information-template-history.result }}
        run: |
          set -euo pipefail
          if [[ "$CURRENT_RESULT" == success &&
            ( ( "$HISTORY_REQUIRED" == false && "$HISTORY_RESULT" == skipped ) ||
              ( "$HISTORY_REQUIRED" == true && "$HISTORY_RESULT" == success ) ) ]]; then
            exit 0
          fi
          printf '::error::report prerequisites failed current=%s history_required=%s history=%s\n' \
            "$CURRENT_RESULT" "$HISTORY_REQUIRED" "$HISTORY_RESULT"
          exit 1
      - name: Check out candidate with history
        id: checkout-merge
        uses: actions/checkout@v4
        with: { ref: "${{ github.sha }}", fetch-depth: 0, persist-credentials: false, path: candidate }
      - name: Strip checkout remote state
        if: steps.checkout-merge.outcome == 'success'
        shell: bash
        env:
          CHECKOUT_PATH: candidate
        run: |
          set -euo pipefail
          git -C "$CHECKOUT_PATH" remote remove origin
          git -C "$CHECKOUT_PATH" for-each-ref --format='delete %(refname)' refs/remotes/ |
            git -C "$CHECKOUT_PATH" update-ref --stdin
          remote_count="$(git -C "$CHECKOUT_PATH" remote | wc -l)"
          remote_ref_count="$(git -C "$CHECKOUT_PATH" for-each-ref --format='%(refname)' refs/remotes/ | wc -l)"
          if [[ "$remote_count" -ne 0 || "$remote_ref_count" -ne 0 ]]; then
            printf '%s\n' "checkout still exposes remotes or remote-tracking refs" >&2
            exit 1
          fi
          head_sha="$(git -C "$CHECKOUT_PATH" rev-parse HEAD)"
          base_sha="$(git -C "$CHECKOUT_PATH" rev-parse HEAD^1)"
          test -n "$head_sha"
          test -n "$base_sha"
      - name: Fail closed when candidate checkout is unavailable
        if: always() && steps.checkout-merge.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "cannot check out immutable candidate commit $GITHUB_SHA; admission fails closed" >&2
          exit 1
      - name: Install pinned SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: candidate/global.json
      - name: Resolve judge binary content address before build outputs exist
        id: judge-address
        shell: bash
        run: |
          set -euo pipefail
          source_address="${{ hashFiles('candidate/tools/**', 'candidate/Blueprint/**/*.scribe.cs', 'candidate/Directory.*', 'candidate/.editorconfig', 'candidate/global.json') }}"
          workflow_address="$(git -C candidate rev-parse HEAD:.github/workflows)"
          source_address="$(printf 'sources=%s\nworkflow=%s\n' "$source_address" "$workflow_address" | sha256sum | cut -d ' ' -f 1)"
          candidate/tools/scripts/workflow/judge-content-address.sh "$source_address" >> "$GITHUB_OUTPUT"
      - name: Restore judge binaries and candidate build outputs
        id: judge-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .judge-binaries
            candidate/tools/**/bin
            candidate/tools/**/obj
          key: stratalint-judge-binaries-v2-${{ runner.os }}-${{ steps.judge-address.outputs.runtime }}-${{ steps.judge-address.outputs.address }}
      # Native pull_request supplies github.sha=M, the checked merge commit. PR
      # restores use its already computed protected parent B=M^1; push restores
      # and saves continue to use github.sha for the pushed commit H. Prefix
      # fallback remains best-effort, while the Engine validates entries against
      # the checked first-parent base.
      - name: Restore base-side unknown-debt test maps
        id: test-map-cache
        uses: actions/cache/restore@v4
        with:
          path: .stratalint-test-map-cache
          key: stratalint-test-map-v1-${{ runner.os }}-${{ github.event_name == 'pull_request' && env.DEV_BASELINE_SHA || github.sha }}
          restore-keys: stratalint-test-map-v1-${{ runner.os }}-
      - name: Snapshot test map cache before the gate
        id: test-map-before
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .stratalint-test-map-cache
          find .stratalint-test-map-cache -maxdepth 1 -type f -name '*.json' -exec sha256sum {} + | sort | sha256sum | cut -d ' ' -f 1 > "$RUNNER_TEMP/test-map-before.sha"
      - name: Download canonical Lean reports
        uses: actions/download-artifact@v4
        with:
          name: raw-lean-reports
          path: ${{ runner.temp }}/raw-lean-reports
      - name: Download planned historical evidence
        if: needs.lean-inspect.outputs.history_required == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: information-template-history-????????????????????????????????????????
          merge-multiple: true
          path: ${{ runner.temp }}/raw-lean-reports
      - name: Download the authoritative history plan
        if: needs.lean-inspect.outputs.history_required == 'true'
        uses: actions/download-artifact@v4
        with:
          name: information-template-history-plan
          path: ${{ runner.temp }}/history-plan
      - name: Validate every downloaded historical bundle
        if: needs.lean-inspect.outputs.history_required == 'true'
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.judge-cache.outputs.cache-hit }}" != true ]]; then make -C tools dotnet; fi
          cli="$GITHUB_WORKSPACE/candidate/tools/StrataLint.Cli/bin/Release/net10.0/StrataLint.dll"
          plan="$RUNNER_TEMP/history-plan/information-template-history-plan.json"
          revisions="$(python3 -c 'import json,sys; print("\n".join(t["revision"] for t in json.load(open(sys.argv[1]))["targets"]))' "$plan")"
          test -n "$revisions"
          while IFS= read -r revision; do
            dotnet "$cli" information-template-history validate --plan "$plan" --revision "$revision" \
              --bundle "$RUNNER_TEMP/raw-lean-reports/information-template-history/$revision"
          done <<< "$revisions"
      - name: Verify report content addresses
        shell: bash
        working-directory: ${{ runner.temp }}/raw-lean-reports
        run: |
          set -euo pipefail
          sha256sum -c candidate-lean-report.json.sha256
      - name: Run the harness gate with the candidate's own judge
        shell: bash
        env:
          STRATALINT_TIMING: ${{ runner.temp }}/gate-timing.jsonl
        run: |
          set -euo pipefail
          # 候选用自己的法官审自己的内容。法官程序在 43% 的合并里与 base 逐字节相同,
          # 那些情况下用哪个是恒等的;其余情况新规则本就该立即对自己生效。
          # base 仍然只提供一个 immutable SHA 给 diff 语义,不需要 checkout 或编译 base 代码
          # —— 而正是那次编译让 dev 一坏就谁都进不来
          # (2026-08-13 两次:SL-003 锁死七个在飞 PR;法官自检失败后连修它的 PR 也挡在外面)。
          gate="$GITHUB_WORKSPACE/candidate/.github/scripts/harness-gate.sh"
          if [[ ! -x "$gate" ]]; then
            printf '%s\n' "candidate harness gate is absent" >&2
            exit 1
          elif ! grep -qF -- '--candidate-lean-report' "$gate"; then
            printf '%s\n' "candidate gate cannot consume canonical Lean reports" >&2
            exit 1
          fi
          # expand 阶段;contract 义务:当 `git branch -r --list 'origin/integration-*'` 中
          # 不再有 base 早于 d4f14b1a4d 的分支时,改回 fail-closed(与 `--candidate-lean-report` 同形);
          # Native pull_request executes the candidate gate directly, so there is
          # no default-branch compatibility window for this option.
          # This is a bounded migration obligation with the stated exit condition;
          # it must not become a second judge path or a permanent compatibility branch.
          cache_args=()
          if grep -qF -- '--test-map-cache-root' "$gate"; then
            cache_args=(--test-map-cache-root "$GITHUB_WORKSPACE/.stratalint-test-map-cache")
          else
            printf '%s\n' "candidate gate predates the test map cache; running without it" >&2
          fi
          judge_args=()
          if [[ "${{ steps.judge-cache.outputs.cache-hit }}" == "true" ]]; then
            judge="$GITHUB_WORKSPACE/.judge-binaries/cli/StrataLint.dll"
            test -s "$judge"
            judge_args=(--judge-dll "$judge")
          fi
          set +e
          "$gate" \
            --candidate "$GITHUB_WORKSPACE/candidate" \
            --base "$DEV_BASELINE_SHA" \
            --candidate-lean-report "$RUNNER_TEMP/raw-lean-reports/candidate-lean-report.json" \
            ${cache_args[@]+"${cache_args[@]}"} \
            "${judge_args[@]}" \
            2>&1 | tee "$RUNNER_TEMP/gate.log"
          rc="${PIPESTATUS[0]}"
          set -e
          if [[ "$rc" -ne 0 && "$rc" -ne 3 ]]; then
            echo "::error title=harness gate failed::rc=$rc; complete output was emitted above"
            printf '%s\n' "### harness gate FAILED rc=$rc" >> "$GITHUB_STEP_SUMMARY"
            exit "$rc"
          fi
          if [[ "$rc" -eq 3 ]]; then
            printf '%s\n' "### protected-surface change (SL-022); content checks passed" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
      - name: Prune and fingerprint test map cache after the gate (push only)
        id: test-map-after
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          # keep the 16 newest by mtime(not LRU): fork-point age of the last 40 dev merges was p50<1h / p90 2h / max 3h
          # (2026-09-06, git merge-base age), and dev merges touching derivation inputs ran at
          # 112 per 24h; 16 entries cover the observed maximum. Policy constant, not a capacity
          # derivation; revisit when either reading moves.
          # readings: issue #5458 comment 2026-09-06 (sshx transcript jp0905c); fork-point age via `git merge-base` over the last 40 first-parent dev merges
          find .stratalint-test-map-cache -maxdepth 1 -type f -name '*.json' -printf '%T@ %f\n' | sort -rn | tail -n +17 | cut -d ' ' -f 2- | while read -r stale; do rm -f -- ".stratalint-test-map-cache/$stale"; done
          after="$(find .stratalint-test-map-cache -maxdepth 1 -type f -name '*.json' -exec sha256sum {} + | sort | sha256sum | cut -d ' ' -f 1)"
          before="$(cat "$RUNNER_TEMP/test-map-before.sha")"
          changed=false
          if [[ "$after" != "$before" ]]; then changed=true; fi
          printf 'changed=%s\n' "$changed" >> "$GITHUB_OUTPUT"
          printf 'test-map-cache entries=%s changed=%s\n' "$(find .stratalint-test-map-cache -maxdepth 1 -type f -name '*.json' | wc -l)" "$changed"
      - name: Save test map cache by push SHA (push only, when changed)
        if: always() && github.event_name == 'push' && steps.test-map-after.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .stratalint-test-map-cache
          key: stratalint-test-map-v1-${{ runner.os }}-${{ github.sha }}
      - name: Upload gate timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-timing
          path: ${{ runner.temp }}/gate-timing.jsonl
          if-no-files-found: warn
          retention-days: 7
