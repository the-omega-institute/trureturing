name: phi-b4-adaptive-state-bound-research

on:
  push:
    branches:
      - agent/research/phi-b4-state-bounds-20260903
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cegis:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        type0: [7, 8, 9, 10, 11]
    steps:
      - uses: actions/checkout@v4
      - name: Build CaDiCaL 3.0.1
        run: |
          git clone --depth 1 --branch rel-3.0.1 \
            https://github.com/arminbiere/cadical.git /tmp/cadical
          cd /tmp/cadical
          ./configure
          make -j2
          sudo install -m 0755 build/cadical /usr/local/bin/cadical
          cadical --version
      - name: Run adaptive exact typed DFAO search
        run: |
          mkdir -p result
          python3 research/phi_b4_bounds_v2.py \
            --states 15 \
            --type0-states ${{ matrix.type0 }} \
            --seed 30 \
            --validation 1000 \
            --batch 4 \
            --max-rounds 10 \
            --timeout 300 \
            --solver cadical \
            --output result/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phi-b4-adaptive-k15-t0-${{ matrix.type0 }}
          path: result
