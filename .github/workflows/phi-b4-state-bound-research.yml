name: phi-b4-state-bound-research

on:
  push:
    branches:
      - agent/research/phi-b4-state-bounds-20260903
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graph:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compute structural graph statistics
        run: |
          python3 research/phi_b4_bounds.py analyze \
            --samples 79 100 150 200 \
            --output phi-b4-graph.json
      - uses: actions/upload-artifact@v4
        with:
          name: phi-b4-graph
          path: phi-b4-graph.json

  cegis:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - { states: 14, type0: 3 }
          - { states: 14, type0: 4 }
          - { states: 14, type0: 5 }
          - { states: 14, type0: 6 }
          - { states: 14, type0: 7 }
          - { states: 14, type0: 8 }
          - { states: 14, type0: 9 }
          - { states: 14, type0: 10 }
          - { states: 14, type0: 11 }
          - { states: 15, type0: 3 }
          - { states: 15, type0: 4 }
          - { states: 15, type0: 5 }
          - { states: 15, type0: 6 }
          - { states: 15, type0: 7 }
          - { states: 15, type0: 8 }
          - { states: 15, type0: 9 }
          - { states: 15, type0: 10 }
          - { states: 15, type0: 11 }
          - { states: 15, type0: 12 }
    steps:
      - uses: actions/checkout@v4
      - name: Install CaDiCaL
        run: |
          sudo apt-get update
          if ! sudo apt-get install -y cadical; then
            git clone --depth 1 --branch rel-2.1.3 \
              https://github.com/arminbiere/cadical.git /tmp/cadical
            cd /tmp/cadical
            ./configure
            make -j2
            sudo install -m 0755 build/cadical /usr/local/bin/cadical
          fi
          cadical --version
      - name: Run exact typed DFAO CEGIS
        run: |
          mkdir -p result
          python3 research/phi_b4_bounds.py cegis \
            --states ${{ matrix.states }} \
            --type0-states ${{ matrix.type0 }} \
            --seed 79 \
            --validation 200 \
            --batch 8 \
            --max-rounds 8 \
            --timeout 600 \
            --output result/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phi-b4-k${{ matrix.states }}-t0-${{ matrix.type0 }}
          path: result
