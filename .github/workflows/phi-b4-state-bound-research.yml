name: phi-b4-exact-state-bound-research

on:
  push:
    branches:
      - agent/research/phi-b4-state-bounds-20260903
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        include:
          - { states: 14, type0: 7 }
          - { states: 14, type0: 8 }
          - { states: 14, type0: 9 }
          - { states: 14, type0: 10 }
          - { states: 15, type0: 7 }
          - { states: 15, type0: 8 }
          - { states: 15, type0: 9 }
          - { states: 15, type0: 10 }
          - { states: 15, type0: 11 }
    steps:
      - uses: actions/checkout@v4
      - name: Build CaDiCaL 3.0.1
        run: |
          git clone --depth 1 --branch rel-3.0.1 \
            https://github.com/arminbiere/cadical.git /tmp/cadical
          cd /tmp/cadical
          ./configure
          make -j2
          sudo install -m 0755 build/cadical /usr/local/bin/cadical
          cadical --version
      - name: Run exact reachable-state search
        run: |
          mkdir -p result
          python3 research/phi_b4_bounds_v3.py \
            --states ${{ matrix.states }} \
            --type0-states ${{ matrix.type0 }} \
            --seed 79 \
            --validation 1000 \
            --batch 4 \
            --max-rounds 6 \
            --timeout 900 \
            --solver cadical \
            --output result/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phi-b4-exact-k${{ matrix.states }}-t0-${{ matrix.type0 }}
          path: result
