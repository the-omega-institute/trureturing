name: agent-export-latest-dev

on:
  push:
    branches:
      - agent/prover/observer-action-spectrum

permissions:
  contents: read

jobs:
  export-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.103
      - name: Package latest dev source
        run: git archive --format=tar.gz --output=trureturing-dev-source.tar.gz HEAD
      - name: Build repository CLI
        run: make -C tools dotnet
      - name: Emit theory candidate audit
        run: make theory-candidates > theory-candidates.txt
      - uses: actions/upload-artifact@v4
        with:
          name: trureturing-dev-audit-${{ github.sha }}
          path: |
            trureturing-dev-source.tar.gz
            theory-candidates.txt
          if-no-files-found: error
          retention-days: 1
