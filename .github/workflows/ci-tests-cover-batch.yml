name: CI tests-cover-batch

on:
  pull_request:
    branches: [dev, 'integration-**']
    types: [opened, synchronize, reopened]
  push:
    branches: [dev, 'integration-**']

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-tests-cover-batch-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests-cover-batch:
    uses: ./.github/workflows/ci-unit.yml
    with:
      run: make -C tools test TEST_PROJECT=tools/tests/StrataLint.CoverBatch.Tests/StrataLint.CoverBatch.Tests.csproj
      paths: |
        .editorconfig
        .github/*
        .gitignore
        D5/S3/Constants/Values.lean
        D5/X_Frontier/ValuesProducer.lean
        Directory.Build.props
        Directory.Packages.props
        Golden/gate-authority-roots.toml
        Golden/values-kernels.toml
        Makefile
        Meta/Digestion/atomizers.toml
        Meta/FILEMAP.*.toml
        Meta/FILEMAP.toml
        Meta/ReportConsumers/*
        Meta/ReportProducers/*
        Meta/ci-checks.json
        Meta/ci-resources.json
        Meta/engineering-projects.json
        Meta/judge-seed.json
        Meta/package-materials.json
        Reg/lake-manifest.json
        Reg/lakefile.toml
        docs/CONTRIBUTING.md
        docs/GOVERNANCE.md
