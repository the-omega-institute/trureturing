name: append Hilbert quotient-remainder theory payload

on:
  push:
    branches:
      - agent/hilbert-orthogonal-quotient-remainder-tower

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hilbert-orthogonal-quotient-remainder-tower
          fetch-depth: 0

      - name: Append the staged Markdown payload
        shell: bash
        run: |
          set -euo pipefail
          target='docs/develop/theory/QUANTITATIVE_DIAGONALIZATION_OBSERVER_COMPLETION.md'
          payload='.github/append-payloads/hilbert-orthogonal-quotient-remainder.md'
          workflow='.github/workflows/temporary-append-hilbert-quotient-remainder.yml'

          if ! grep -Fq '# 28. 追加：Hilbert 正交商余塔、有限切片完成与持续逃逸' "$target"; then
            cat "$payload" >> "$target"
          fi

          git rm "$payload" "$workflow"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git commit -m 'docs(theory): append Hilbert orthogonal quotient-remainder tower'
          git push origin HEAD:agent/hilbert-orthogonal-quotient-remainder-tower
