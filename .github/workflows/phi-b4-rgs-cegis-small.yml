name: phi-b4-rgs-cegis-small

on:
  push:
    branches:
      - agent/research/phi-b4-rgs-symmetry-20260903
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cegis:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - { states: 15, type0: 6, timeout: 300, rounds: 15, batch: 3 }
          - { states: 15, type0: 7, timeout: 300, rounds: 15, batch: 3 }
          - { states: 15, type0: 8, timeout: 300, rounds: 15, batch: 3 }
          - { states: 15, type0: 9, timeout: 300, rounds: 15, batch: 3 }
          - { states: 15, type0: 10, timeout: 300, rounds: 15, batch: 3 }
          - { states: 15, type0: 11, timeout: 300, rounds: 15, batch: 3 }
          - { states: 22, type0: 6, timeout: 120, rounds: 10, batch: 8 }
          - { states: 22, type0: 7, timeout: 120, rounds: 10, batch: 8 }
          - { states: 22, type0: 8, timeout: 120, rounds: 10, batch: 8 }
          - { states: 22, type0: 9, timeout: 120, rounds: 10, batch: 8 }
          - { states: 22, type0: 10, timeout: 120, rounds: 10, batch: 8 }
          - { states: 22, type0: 11, timeout: 120, rounds: 10, batch: 8 }
          - { states: 22, type0: 12, timeout: 120, rounds: 10, batch: 8 }
          - { states: 22, type0: 13, timeout: 120, rounds: 10, batch: 8 }
          - { states: 22, type0: 14, timeout: 120, rounds: 10, batch: 8 }
          - { states: 22, type0: 15, timeout: 120, rounds: 10, batch: 8 }
          - { states: 22, type0: 16, timeout: 120, rounds: 10, batch: 8 }
    steps:
      - uses: actions/checkout@v4
      - name: Install CaDiCaL
        run: |
          sudo apt-get update
          if ! sudo apt-get install -y cadical; then
            git clone --depth 1 --branch rel-2.1.3 \
              https://github.com/arminbiere/cadical.git /tmp/cadical
            cd /tmp/cadical
            ./configure
            make -j2
            sudo install -m 0755 build/cadical /usr/local/bin/cadical
          fi
      - name: Run small-core RGS CEGIS
        run: |
          mkdir -p result
          python3 research/phi_b4_bounds_rgs.py \
            --states ${{ matrix.states }} \
            --type0-states ${{ matrix.type0 }} \
            --seed 20 \
            --validation 200 \
            --batch ${{ matrix.batch }} \
            --max-rounds ${{ matrix.rounds }} \
            --timeout ${{ matrix.timeout }} \
            --output result/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phi-b4-small-k${{ matrix.states }}-t0-${{ matrix.type0 }}
          path: result
