name: agent-reflected-spectrum-artifacts

on:
  push:
    branches:
      - agent/formalize/reflected-spectrum-resolvent-v1-20260901

permissions:
  contents: read

jobs:
  generate:
    if: contains(github.event.head_commit.message, '[reflected-spectrum-artifacts]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/formalize/reflected-spectrum-resolvent-v1-20260901
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install pinned Lean toolchain
        run: tools/scripts/workflow/install-lean-toolchain.sh lean-toolchain --github-path "$GITHUB_PATH"
      - name: Restore Lean dependencies
        run: lake update
      - name: Generate Scribe mirrors and freeze events
        shell: bash
        run: |
          set -euo pipefail
          before="$(mktemp)"
          after="$(mktemp)"
          find Golden/Frozen/accepted -maxdepth 1 -type f -printf '%f\n' | sort > "$before"

          make -C tools dotnet
          make emit
          make lean-report
          dotnet run --project tools/StrataLint.Cli/StrataLint.Cli.csproj \
            --configuration Release -- \
            ledger-append \
            --candidate-lean-report .lake/build/stratalint/raw-lean-report.json
          tools/scripts/agent/scope-freeze-delta.sh origin/dev
          git diff --check

          mkdir -p artifact/tree artifact/diagnostics
          mirrors=(
            Blueprint/D5/S3/Analytic/Adelic/ReflectedGrowthPairEvenOddDecomposition.md
            Blueprint/D5/S3/Analytic/Adelic/NegativeSquareLaplaceResolvent.md
            Blueprint/D5/S3/Analytic/Adelic/EllipticHyperbolicReflectionTrichotomy.md
          )
          for path in "${mirrors[@]}"; do
            test -f "$path"
            cp --parents "$path" artifact/tree/
          done

          find Golden/Frozen/accepted -maxdepth 1 -type f -printf '%f\n' | sort > "$after"
          comm -13 "$before" "$after" > artifact/diagnostics/new-freezes.txt
          test -s artifact/diagnostics/new-freezes.txt
          while IFS= read -r name; do
            test -n "$name"
            cp --parents "Golden/Frozen/accepted/$name" artifact/tree/
          done < artifact/diagnostics/new-freezes.txt

          cp .lake/build/stratalint/raw-lean-report.json artifact/diagnostics/
          git status --short > artifact/diagnostics/status.txt
          git diff --name-status > artifact/diagnostics/diff-name-status.txt
      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reflected-spectrum-generated-artifacts
          path: artifact
          if-no-files-found: error
          retention-days: 3
