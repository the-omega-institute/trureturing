# 集成分支的 Lean 构建缓存 seed(#2814 preseed 的最小形)。
#
# 【为什么必须是 push 触发,而不能改 ci.yml】2026-08-26 实测:在集成分支的 ci.yml 里插入的步骤
# **两次触发都没有进入**该分支 PR 的 pull_request_target run(job 97880197744 / 97886399674,
# 步骤列表第一项都是 Check out candidate)。阳性对照已做:该步骤确在 base 的 ci.yml 第 48 行、
# candidate-engineering job 内、continue-on-error、无 if。⟹ pull_request_target 的 workflow
# 文本取自**默认分支**,不是 PR 的 base 分支。
# 而 **push 事件**的 workflow 取自被推的那个分支(实测 run 32729127146),故本文件在集成分支上生效。
#
# 【它做什么】pin 一改,config_sha256 就是一个从未存在过的新键,ci.yml 的两级 Actions cache
# 必然全未命中;而 ci.yml 的四个 save 全部带 `github.ref == 'refs/heads/dev'` 守卫
# (理由:pull_request_target 的 token 无 cache-write scope,run 31389667812 实测
# "cache write denied")。于是集成分支上没有任何 cache writer —— 这就是 #2814 的死锁。
# 本 workflow 只补这一个缺口:在集成分支的 push 上构建一次,把两级 cache 按**与 ci.yml 逐字
# 相同的 path 与 key**写进去。
#
# 【path 必须逐字相同,不只是 key】actions/cache 按 (key, version) 标识,version 由 path 派生。
# #2677 的判例:写入侧 `candidate/.lake/build`、读取侧 `.lake/build`,key 一字不差却是两个对象。
# 故这里也 checkout 到 `candidate/` 并用 `candidate/.lake/*`。
#
# 【不是 required check,红了不阻塞任何人】它不被任何 job 依赖,也不进 required 集合。
#
# 【退出条件】这是为一次 mathlib 升级而设的临时机制。升级合入 dev 后本文件即删除;
# 若届时未删,即为第 6 条所禁的兼容垫层。
name: integration lean cache seed

on:
  push:
    branches: ['integration-**']

permissions:
  contents: read

jobs:
  seed:
    name: Seed the integration branch Lean cache
    runs-on: ubuntu-24.04-arm
    # 【policy-override —— 这不是派生值,按 CLAUDE.md「量腹而食」条如实申报】
    #   域:本 job 的活性上限。它**不是** `capacity-derived`(没有同单位静态上限 U 与单任务
    #   资源 r 可算),也**不是** `relation-derived`(不证任何已分类端点关系)。故归第三型。
    #   正读数:本机 28 核 darwin-arm64 全量内容层 24.7 分钟(2026-08-26,1888 模块,EXIT=2)。
    #   反读数:CI 同型 runner `ubuntu-24.04-arm` 冷编 run 32493250519 **failure,77 分钟未建完**;
    #          run 32489976662 **cancelled,45 分钟整**(转述自 #2814,非本轮亲测)。
    #   取值:350 是选定的整数,不是从上面任何一个数推出来的;它只需容下"远超 77 分钟"并留在
    #        GitHub 单 job 的 360 分钟硬上限之内。**不要事后为它编一个比值。**
    #   案号:https://github.com/the-omega-institute/trureturing/issues/2814
    #   owner:仓库 τ=0 owner
    #   退出条件:本文件被删除(mathlib 升级合入 dev 后即删);或 #2814 以别的方案关闭。
    #   NOT PERMANENT。
    #
    # 【required lean-inspect 的 45 分钟 fail-closed 预算不动】那是 #2814 三席一致拒绝放大的
    # 东西,也是 `LeanCacheBudgetPolicy.LeanInspectJobBudgetMinutes` 钉住的值;本 job 的预算
    # 与它无关,不共享常数,故不触发 `LeanInspectJobBudgetMatchesTheWorkflow`。
    timeout-minutes: 350
    steps:
      - name: Check out the pushed integration commit
        id: checkout-pushed
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          path: candidate

      - name: Strip checkout remote state
        if: steps.checkout-pushed.outcome == 'success'
        shell: bash
        env:
          CHECKOUT_PATH: candidate
        run: |
          set -euo pipefail
          git -C "$CHECKOUT_PATH" remote remove origin
          git -C "$CHECKOUT_PATH" for-each-ref --format='delete %(refname)' refs/remotes/ |
            git -C "$CHECKOUT_PATH" update-ref --stdin
          remote_count="$(git -C "$CHECKOUT_PATH" remote | wc -l)"
          remote_ref_count="$(git -C "$CHECKOUT_PATH" for-each-ref --format='%(refname)' refs/remotes/ | wc -l)"
          if [[ "$remote_count" -ne 0 || "$remote_ref_count" -ne 0 ]]; then
            printf '%s\n' "checkout still exposes remotes or remote-tracking refs" >&2
            exit 1
          fi
          head_sha="$(git -C "$CHECKOUT_PATH" rev-parse HEAD)"
          base_sha="$(git -C "$CHECKOUT_PATH" rev-parse HEAD^1)"
          test -n "$head_sha"
          test -n "$base_sha"

      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -x "$GITHUB_WORKSPACE/candidate/tools/scripts/workflow/install-lean-toolchain.sh"
          "$GITHUB_WORKSPACE/candidate/tools/scripts/workflow/install-lean-toolchain.sh" candidate/lean-toolchain

      # `make lean` 实际是 `dotnet run ... worktree with-cache-writer -- lake build`
      # (tools/scripts/worktree/lean-cache-run.sh),故这里必须装 .NET SDK,
      # 且要用与 ci.yml 同一份 global.json 钉版。
      - name: Install pinned SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: candidate/global.json

      - name: Resolve the canonical Lean report input address
        id: lean-report-input
        shell: bash
        run: |
          set -euo pipefail
          helper="$GITHUB_WORKSPACE/candidate/tools/scripts/report/lean-report-input.sh"
          test -x "$helper"
          # 只消费后两项;前两项按 shell 惯例以 `_` 前缀标记为有意不用。
          read -r _address _producer_sha256 sources_sha256 config_sha256 \
            <<< "$("$helper" address --repository "$GITHUB_WORKSPACE/candidate")"
          [[ "$sources_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$config_sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "sources_sha256=$sources_sha256" >> "$GITHUB_OUTPUT"
          echo "config_sha256=$config_sha256" >> "$GITHUB_OUTPUT"

      - name: Restore any existing dependency layer
        id: lake-deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            candidate/.lake/packages
            candidate/.lake/config
            candidate/.lake/.stratalint-lean-cache-stamp.json
            ~/.cache/mathlib
          key: ${{ runner.os }}-${{ runner.arch }}-lake-deps-v1-${{ steps.lean-report-input.outputs.config_sha256 }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-lake-deps-v1-${{ steps.lean-report-input.outputs.config_sha256 }}

      - name: Restore any existing project layer
        id: lake-build-cache
        uses: actions/cache/restore@v4
        with:
          path: candidate/.lake/build
          key: ${{ runner.os }}-${{ runner.arch }}-lake-build-v1-${{ steps.lean-report-input.outputs.config_sha256 }}-${{ steps.lean-report-input.outputs.sources_sha256 }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-lake-build-v1-${{ steps.lean-report-input.outputs.config_sha256 }}-

      # 【增量续编】实测:本 runner(`ubuntu-24.04-arm`)在约 76 分钟处砍掉正在跑的步骤,
      # job 级 `timeout-minutes` 无效 —— 两个独立样本 run 32493250519(76m44s)与
      # 32962231614(76m11s),误差 33 秒。而内容层冷编本机 28 核尚需 24.7 分钟,
      # CI 单核编不完,所以**一轮编不完是常态,不是故障**。
      #
      # 故这里保存"进度快照":上一轮编到哪算哪,下一轮 restore 后由 lake 增量续编。
      # 正式 key 只在真正编完(EXIT=0)时才写,避免把半成品当成完整缓存喂给消费侧。
      - name: Restore the newest progress snapshot
        if: steps.lake-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: candidate/.lake/build
          key: ${{ runner.os }}-${{ runner.arch }}-seed-progress-v1-${{ steps.lean-report-input.outputs.config_sha256 }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-seed-progress-v1-${{ steps.lean-report-input.outputs.config_sha256 }}-

      # 【为什么是检查点序列,不是单个 timebox】2026-08-28 实测五个样本:
      # runner 分别在 76.2 / 76.7 / 79.0 / 87.3 / **32.4** 分钟处被回收
      # (`##[error]The runner has received a shutdown signal.`)。
      # 前四个样本曾让我把下界定为 76m 并设 55m timebox —— **第五个样本 32.4m 证伪了它**:
      # 回收不是稳定截止,更像负载相关抢占,任何单一 timebox 都会在某次被跨过。
      #
      # 又因 `continue-on-error` 只吸收 failure、不吸收 cancellation,
      # 被砍时紧随的 `if: always()` 保存步骤会被**跳过**(实测三轮皆然),整轮进度全丢。
      #
      # 故改为 6 个 12 分钟检查点,每个后面紧跟一次 save:
      # 任一时刻被砍,最多丢一个区间(12 分钟),已存的检查点由下一轮 restore-keys 前缀命中。
      # save 实测 0.71GB 约 0.4 分钟,6 次开销约 2.4 分钟,相对 72 分钟构建可忽略。
      - name: Build the pinned Lean content (checkpoint 1/6)
        id: build1
        continue-on-error: true
        shell: bash
        working-directory: candidate
        run: |
          set -uo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          timeout --kill-after=60s 12m make lean
          rc=$?
          printf 'SEED_BUILD checkpoint=1 exit=%s timeboxed=%s\n' "$rc" "$([ "$rc" -eq 124 ] && echo true || echo false)"
          exit "$rc"

      - name: Save the progress snapshot (1/6)
        if: always() && steps.build1.outcome == 'failure' && steps.lake-build-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 12
        uses: actions/cache/save@v4
        with:
          path: candidate/.lake/build
          key: ${{ runner.os }}-${{ runner.arch }}-seed-progress-v1-${{ steps.lean-report-input.outputs.config_sha256 }}-${{ github.run_id }}-01

      - name: Build the pinned Lean content (checkpoint 2/6)
        if: steps.build1.outcome == 'failure'
        id: build2
        continue-on-error: true
        shell: bash
        working-directory: candidate
        run: |
          set -uo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          timeout --kill-after=60s 12m make lean
          rc=$?
          printf 'SEED_BUILD checkpoint=2 exit=%s timeboxed=%s\n' "$rc" "$([ "$rc" -eq 124 ] && echo true || echo false)"
          exit "$rc"

      - name: Save the progress snapshot (2/6)
        if: always() && steps.build2.outcome == 'failure' && steps.lake-build-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 12
        uses: actions/cache/save@v4
        with:
          path: candidate/.lake/build
          key: ${{ runner.os }}-${{ runner.arch }}-seed-progress-v1-${{ steps.lean-report-input.outputs.config_sha256 }}-${{ github.run_id }}-02

      - name: Build the pinned Lean content (checkpoint 3/6)
        if: steps.build2.outcome == 'failure'
        id: build3
        continue-on-error: true
        shell: bash
        working-directory: candidate
        run: |
          set -uo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          timeout --kill-after=60s 12m make lean
          rc=$?
          printf 'SEED_BUILD checkpoint=3 exit=%s timeboxed=%s\n' "$rc" "$([ "$rc" -eq 124 ] && echo true || echo false)"
          exit "$rc"

      - name: Save the progress snapshot (3/6)
        if: always() && steps.build3.outcome == 'failure' && steps.lake-build-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 12
        uses: actions/cache/save@v4
        with:
          path: candidate/.lake/build
          key: ${{ runner.os }}-${{ runner.arch }}-seed-progress-v1-${{ steps.lean-report-input.outputs.config_sha256 }}-${{ github.run_id }}-03

      - name: Build the pinned Lean content (checkpoint 4/6)
        if: steps.build3.outcome == 'failure'
        id: build4
        continue-on-error: true
        shell: bash
        working-directory: candidate
        run: |
          set -uo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          timeout --kill-after=60s 12m make lean
          rc=$?
          printf 'SEED_BUILD checkpoint=4 exit=%s timeboxed=%s\n' "$rc" "$([ "$rc" -eq 124 ] && echo true || echo false)"
          exit "$rc"

      - name: Save the progress snapshot (4/6)
        if: always() && steps.build4.outcome == 'failure' && steps.lake-build-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 12
        uses: actions/cache/save@v4
        with:
          path: candidate/.lake/build
          key: ${{ runner.os }}-${{ runner.arch }}-seed-progress-v1-${{ steps.lean-report-input.outputs.config_sha256 }}-${{ github.run_id }}-04

      - name: Build the pinned Lean content (checkpoint 5/6)
        if: steps.build4.outcome == 'failure'
        id: build5
        continue-on-error: true
        shell: bash
        working-directory: candidate
        run: |
          set -uo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          timeout --kill-after=60s 12m make lean
          rc=$?
          printf 'SEED_BUILD checkpoint=5 exit=%s timeboxed=%s\n' "$rc" "$([ "$rc" -eq 124 ] && echo true || echo false)"
          exit "$rc"

      - name: Save the progress snapshot (5/6)
        if: always() && steps.build5.outcome == 'failure' && steps.lake-build-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 12
        uses: actions/cache/save@v4
        with:
          path: candidate/.lake/build
          key: ${{ runner.os }}-${{ runner.arch }}-seed-progress-v1-${{ steps.lean-report-input.outputs.config_sha256 }}-${{ github.run_id }}-05

      - name: Build the pinned Lean content (checkpoint 6/6)
        if: steps.build5.outcome == 'failure'
        id: build6
        continue-on-error: true
        shell: bash
        working-directory: candidate
        run: |
          set -uo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          timeout --kill-after=60s 12m make lean
          rc=$?
          printf 'SEED_BUILD checkpoint=6 exit=%s timeboxed=%s\n' "$rc" "$([ "$rc" -eq 124 ] && echo true || echo false)"
          exit "$rc"

      - name: Save the progress snapshot (6/6)
        if: always() && steps.build6.outcome == 'failure' && steps.lake-build-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 12
        uses: actions/cache/save@v4
        with:
          path: candidate/.lake/build
          key: ${{ runner.os }}-${{ runner.arch }}-seed-progress-v1-${{ steps.lean-report-input.outputs.config_sha256 }}-${{ github.run_id }}-06

      - name: Report whether this round finished the build
        if: always()
        shell: bash
        run: |
          printf 'SEED_ROUND build_outcome=%s\n' "${{ steps.build6.outcome }}"
          if [ "${{ steps.build6.outcome }}" != "success" ]; then
            printf '%s\n' "this round did not finish; a progress snapshot was saved, push again to continue"
          fi

      - name: Save the dependency layer
        if: steps.build6.outcome == 'success' && steps.lake-deps-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 12
        uses: actions/cache/save@v4
        with:
          path: |
            candidate/.lake/packages
            candidate/.lake/config
            candidate/.lake/.stratalint-lean-cache-stamp.json
            ~/.cache/mathlib
          key: ${{ runner.os }}-${{ runner.arch }}-lake-deps-v1-${{ steps.lean-report-input.outputs.config_sha256 }}

      - name: Save the project layer
        if: steps.build6.outcome == 'success' && steps.lake-build-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 12
        uses: actions/cache/save@v4
        with:
          path: candidate/.lake/build
          key: ${{ runner.os }}-${{ runner.arch }}-lake-build-v1-${{ steps.lean-report-input.outputs.config_sha256 }}-${{ steps.lean-report-input.outputs.sources_sha256 }}
