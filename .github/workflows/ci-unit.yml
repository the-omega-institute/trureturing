name: CI unit

# One CI unit. The calling job runs it only when the change hits the unit; this
# workflow verifies the candidate, prepares the requested tools and runs either
# the unit's test project or its command.

on:
  workflow_call:
    inputs:
      project:
        description: Test project run through make -C tools test; empty for a command unit
        type: string
        default: ''
      command:
        description: Command of a non-test unit, executed from the repository root
        type: string
        default: ''
      dotnet:
        description: Set up the .NET SDK
        type: boolean
        default: true
      cache-dependency-path:
        description: Package locks for the unit's actual build closure
        type: string
        default: '**/packages.lock.json'
      lean:
        description: 'Lean preparation: none, toolchain, or build (toolchain plus build seeds)'
        type: string
        default: none
      timeout-minutes:
        type: number
        default: 150
      probe-unit:
        type: string
        default: unknown

permissions:
  contents: read
  actions: read

jobs:
  unit:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Validate the unit definition
        env:
          PROJECT: ${{ inputs.project }}
          COMMAND: ${{ inputs.command }}
          LEAN: ${{ inputs.lean }}
        run: |
          has_project=false has_command=false
          [[ -z "$PROJECT" ]] || has_project=true
          [[ -z "${COMMAND//[[:space:]]/}" ]] || has_command=true
          [[ "$has_project" != "$has_command" ]] || { echo "CI_UNIT_ERROR set exactly one of project and command" >&2; exit 2; }
          case "$LEAN" in none|toolchain|build) ;; *) echo "CI_UNIT_ERROR lean is '$LEAN'" >&2; exit 2 ;; esac
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Install the probe tracer
        run: |
          set -euo pipefail
          command -v strace >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq strace; }
          strace -V | head -1
          mkdir -p /tmp/probe/trace
          cat > /tmp/probe/shell.sh <<'PROBE_EOF'
          #!/bin/bash
          dir="/tmp/probe/trace/$(date +%s%N)-$$"
          mkdir -p "$dir"
          export UseSharedCompilation=false MSBUILDDISABLENODEREUSE=1 DOTNET_CLI_USE_MSBUILD_SERVER=0
          exec strace -f -ff -qq -y -s 4096 -e trace=%file,getdents64,fchdir,clone,clone3,fork,vfork -e signal=none -o "$dir/t" bash --noprofile --norc -eo pipefail "$1"
          PROBE_EOF
          chmod +x /tmp/probe/shell.sh
          cat > /tmp/probe/strace_extract.py <<'PROBE_EOF'
          #!/usr/bin/env python3
          """Extract repository path accesses from `strace -ff -y` traces.

          Usage: strace_extract.py --repository DIR --traces DIR --unit NAME --output FILE

          Reads every trace file under --traces (one file per traced task, written by
          `strace -f -ff -qq -y -s 4096 -e trace=%file,getdents64,fchdir`) and writes one
          JSON object describing the accesses that fall inside --repository:

            read     paths opened successfully for reading (files)
            write    paths opened with a write or create flag
            stat     paths whose metadata or existence was queried successfully
            missing  paths probed that did not exist (ENOENT / ENOTDIR)
            listed   directories whose entries were read (getdents64)
            exec     executed programs with argv and working directory
          """
          import argparse
          import json
          import os
          import re
          import sys
          from pathlib import Path

          SYSCALL = re.compile(r"^(?P<name>[a-z0-9_]+)\((?P<args>.*)\)\s+=\s+(?P<ret>-?\d+|\?)(?P<rest>.*)$")
          FD_PATH = re.compile(r"^(?:AT_FDCWD|-?\d+)<(?P<path>(?:[^>\\]|\\.)*)>")
          CSTRING = re.compile(r'"((?:[^"\\]|\\.)*)"')
          ERRNO = re.compile(r"^\s*([A-Z0-9_]+)\s")

          AT_CALLS = {
              "openat", "openat2", "newfstatat", "fstatat64", "statx", "faccessat", "faccessat2",
              "readlinkat", "mkdirat", "unlinkat", "utimensat", "fchmodat", "fchownat",
              "name_to_handle_at", "inotify_add_watch", "execveat",
          }
          PLAIN_CALLS = {"open", "stat", "lstat", "access", "readlink", "chdir", "execve", "truncate",
                         "statfs", "getxattr", "lgetxattr", "listxattr", "llistxattr", "creat"}
          WRITE_FLAGS = ("O_WRONLY", "O_RDWR", "O_CREAT", "O_TRUNC", "O_APPEND")


          def unescape(text):
              out = bytearray()
              i = 0
              raw = text.encode("utf-8", "surrogateescape")
              while i < len(raw):
                  c = raw[i]
                  if c != 0x5C:
                      out.append(c)
                      i += 1
                      continue
                  nxt = raw[i + 1:i + 2]
                  if nxt == b"x" and i + 3 < len(raw) + 1:
                      out.append(int(raw[i + 2:i + 4], 16))
                      i += 4
                  elif nxt and nxt in b"01234567":
                      j = i + 1
                      while j < len(raw) and j < i + 4 and raw[j:j + 1] in b"01234567":
                          j += 1
                      out.append(int(raw[i + 1:j], 8))
                      i = j
                  else:
                      mapping = {b"n": 10, b"t": 9, b"r": 13, b"v": 11, b"f": 12, b'"': 34, b"\\": 92}
                      out.append(mapping.get(nxt, nxt[0] if nxt else 92))
                      i += 2
              return out.decode("utf-8", "surrogateescape")


          def split_args(args):
              parts, depth, cur, in_str, esc = [], 0, [], False, False
              for ch in args:
                  if in_str:
                      cur.append(ch)
                      if esc:
                          esc = False
                      elif ch == "\\":
                          esc = True
                      elif ch == '"':
                          in_str = False
                      continue
                  if ch == '"':
                      in_str = True
                  elif ch in "[{(<":
                      depth += 1
                  elif ch in "]})>":
                      depth -= 1
                  elif ch == "," and depth == 0:
                      parts.append("".join(cur).strip())
                      cur = []
                      continue
                  cur.append(ch)
              if cur:
                  parts.append("".join(cur).strip())
              return parts


          def fd_dir(arg):
              m = FD_PATH.match(arg)
              return unescape(m.group("path")) if m else None


          def first_string(arg):
              m = CSTRING.match(arg.strip())
              return unescape(m.group(1)) if m else None


          class Collector:
              def __init__(self, repository):
                  self.repository = os.path.normpath(repository)
                  self.sets = {k: set() for k in ("read", "write", "stat", "missing", "listed")}
                  self.exec = []
                  self.programs = {}
                  self.current_program = None

              def rel(self, absolute):
                  if absolute is None:
                      return None
                  norm = os.path.normpath(absolute)
                  root = self.repository
                  if norm == root:
                      return "."
                  if norm.startswith(root + os.sep):
                      return norm[len(root) + 1:]
                  return None

              def add(self, kind, absolute):
                  rel = self.rel(absolute)
                  if rel is not None:
                      self.sets[kind].add(rel)
                      if self.current_program:
                          self.programs.setdefault(kind + "\t" + rel, set()).add(self.current_program)


          def resolve(base, path):
              if path is None:
                  return None
              if path.startswith("/"):
                  return path
              if base is None:
                  return None
              return os.path.join(base, path)


          def program_label(argv):
              if not argv:
                  return None
              first = os.path.basename(argv[0])
              if first in ("dotnet", "python3", "python", "bash", "sh") and len(argv) > 1:
                  return first + " " + os.path.basename(argv[1])
              return first


          def process_file(trace, col, unresolved, label=None):
              cwd = None
              pending_exec = None
              col.current_program = label
              for raw in trace.open("r", encoding="utf-8", errors="surrogateescape"):
                  line = raw.rstrip("\n")
                  m = SYSCALL.match(line)
                  if not m:
                      continue
                  name, args, ret, rest = m.group("name"), m.group("args"), m.group("ret"), m.group("rest")
                  parts = split_args(args)
                  ok = ret != "?" and not ret.startswith("-")
                  errno = None
                  if not ok:
                      em = ERRNO.match(rest)
                      errno = em.group(1) if em else None
                  # Track the working directory from AT_FDCWD annotations.
                  for part in parts[:1]:
                      if part.startswith("AT_FDCWD<"):
                          cwd = fd_dir(part)
                          if pending_exec is not None and pending_exec.get("cwd") is None:
                              pending_exec["cwd"] = col.rel(cwd) if col.rel(cwd) is not None else cwd
                  if name == "getdents64":
                      if ok and parts:
                          col.add("listed", fd_dir(parts[0]))
                      continue
                  if name == "fchdir":
                      if ok and parts:
                          cwd = fd_dir(parts[0]) or cwd
                      continue
                  if name == "execve" or name == "execveat":
                      path = first_string(parts[0] if name == "execve" else parts[1])
                      argv = CSTRING.findall(parts[1] if name == "execve" else parts[2]) if len(parts) > 1 else []
                      absolute = resolve(cwd, path)
                      entry = {"path": col.rel(absolute) if col.rel(absolute) is not None else path,
                               "argv": [unescape(a) for a in argv], "ok": ok, "cwd": None}
                      if ok:
                          col.exec.append(entry)
                          pending_exec = entry
                          col.current_program = program_label(entry["argv"])
                          col.add("read", absolute)
                      elif errno in ("ENOENT", "ENOTDIR"):
                          col.add("missing", absolute)
                      continue
                  if name == "chdir":
                      path = first_string(parts[0]) if parts else None
                      if ok:
                          cwd = resolve(cwd, path)
                      continue
                  if name in AT_CALLS:
                      if len(parts) < 2:
                          continue
                      base = fd_dir(parts[0])
                      path = first_string(parts[1])
                      if path is None:
                          continue
                      if path == "" and base is not None:
                          absolute = base
                      else:
                          absolute = resolve(base if not path.startswith("/") else None, path)
                          if absolute is None:
                              unresolved.append(line[:300])
                              continue
                  elif name in PLAIN_CALLS:
                      path = first_string(parts[0]) if parts else None
                      absolute = resolve(cwd, path)
                      if absolute is None:
                          if path is not None:
                              unresolved.append(line[:300])
                          continue
                  else:
                      continue
                  if not ok:
                      if errno in ("ENOENT", "ENOTDIR"):
                          col.add("missing", absolute)
                      continue
                  if name in ("openat", "openat2", "open", "creat"):
                      flags = parts[2] if name != "open" and len(parts) > 2 else (parts[1] if len(parts) > 1 else "")
                      if name == "creat" or any(flag in flags for flag in WRITE_FLAGS):
                          col.add("write", absolute)
                      elif "O_DIRECTORY" in flags:
                          col.add("stat", absolute)
                      else:
                          col.add("read", absolute)
                  elif name in ("mkdirat", "unlinkat"):
                      col.add("write", absolute)
                  else:
                      col.add("stat", absolute)


          CLONE = re.compile(r"^(clone3?|vfork|fork)\((?P<args>.*)\)\s+=\s+(?P<ret>\d+)")
          EXECVE = re.compile(r'^execve\("[^"]*", \[(?P<argv>[^\]]*)\]')


          def label_tasks(files):
              """Label each task file with the program its process last executed before the task began."""
              by_tid = {}
              for f in files:
                  name = f.name
                  if name.startswith("t.") and name[2:].isdigit():
                      by_tid[(f.parent, int(name[2:]))] = f
              first_exec = {}
              children = {}
              for (parent_dir, tid), f in by_tid.items():
                  label = None
                  for raw in f.open("r", encoding="utf-8", errors="surrogateescape"):
                      m = EXECVE.match(raw)
                      if m and " = 0" in raw[-12:] or (m and raw.rstrip().endswith("= 0")):
                          argv = [unescape(a) for a in CSTRING.findall(m.group("argv"))]
                          label = program_label(argv)
                          first_exec.setdefault(f, label)
                      c = CLONE.match(raw)
                      if c:
                          children[(parent_dir, int(c.group("ret")))] = label
              labels = {}
              for key, f in by_tid.items():
                  if f in first_exec:
                      labels[f] = None  # its own execve sets the label when reached
                  if key in children:
                      labels[f] = children[key]
              return labels


          def main():
              parser = argparse.ArgumentParser()
              parser.add_argument("--repository", required=True)
              parser.add_argument("--traces", required=True)
              parser.add_argument("--unit", required=True)
              parser.add_argument("--output", required=True)
              args = parser.parse_args()
              col = Collector(args.repository)
              unresolved = []
              files = sorted(p for p in Path(args.traces).rglob("*") if p.is_file())
              labels = label_tasks(files)
              for trace in files:
                  process_file(trace, col, unresolved, labels.get(trace))
              result = {"unit": args.unit, "repository": col.repository, "trace_files": len(files),
                        "unresolved_samples": unresolved[:50], "unresolved": len(unresolved)}
              for key, values in col.sets.items():
                  result[key] = sorted(values)
              seen = set()
              execs = []
              for entry in col.exec:
                  key = json.dumps(entry, sort_keys=True)
                  if key not in seen:
                      seen.add(key)
                      execs.append(entry)
              result["exec"] = execs
              result["programs"] = {k: sorted(v) for k, v in sorted(col.programs.items())}
              Path(args.output).write_text(json.dumps(result, indent=1, sort_keys=True), encoding="utf-8")
              print(f"PROBE_EXTRACT unit={args.unit} files={len(files)} " +
                    " ".join(f"{k}={len(v)}" for k, v in col.sets.items()) + f" exec={len(execs)} unresolved={len(unresolved)}")
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PROBE_EOF
          cat > /tmp/probe/mutations.sh <<'PROBE_EOF'
          #!/bin/bash
          true
          PROBE_EOF
      - name: Verify the candidate
        env:
          CI_HIT_PATHS: '*'
          CI_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_PUSH_BEFORE: ${{ github.event.before }}
        shell: bash /tmp/probe/shell.sh {0}
        run: bash tools/scripts/workflow/ci-entry.sh
      - if: inputs.dotnet
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: ${{ inputs.cache-dependency-path }}
      - id: keys
        if: inputs.lean != 'none'
        env:
          GH_TOKEN: ${{ inputs.lean == 'build' && github.token || '' }}
        shell: bash /tmp/probe/shell.sh {0}
        run: python3 tools/scripts/worktree/lean_actions.py keys --repository "$GITHUB_WORKSPACE"
      - id: elan
        if: inputs.lean != 'none' && steps.keys.outputs.elan_key != ''
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ~/.elan
          key: ${{ steps.keys.outputs.elan_key }}
      - if: inputs.lean != 'none'
        shell: bash /tmp/probe/shell.sh {0}
        run: tools/scripts/workflow/install-lean-toolchain.sh lean-toolchain --github-path "$GITHUB_PATH"
      - id: dependency
        if: inputs.lean == 'build' && steps.keys.outputs.dependency_key != ''
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.keys.outputs.dependency_archive_path }}
          key: ${{ steps.keys.outputs.dependency_key }}
          restore-keys: ${{ steps.keys.outputs.dependency_restore_prefix }}
      - id: project
        if: inputs.lean == 'build' && steps.keys.outputs.project_key != ''
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.keys.outputs.project_archive_path }}
          key: ${{ steps.keys.outputs.project_restore_key }}
          restore-keys: ${{ steps.keys.outputs.project_restore_prefix }}
      - name: Restore optional Lean build seeds
        if: inputs.lean == 'build'
        env:
          DEPENDENCY_KEY: ${{ steps.dependency.outputs.cache-matched-key }}
          PROJECT_KEY: ${{ steps.project.outputs.cache-matched-key }}
          PROJECT_RESTORE_KEY: ${{ steps.keys.outputs.project_restore_key }}
          DEPENDENCY_OUTCOME: ${{ steps.dependency.outcome }}
          PROJECT_OUTCOME: ${{ steps.project.outcome }}
        shell: bash /tmp/probe/shell.sh {0}
        run: python3 tools/scripts/worktree/lean_actions.py restore --repository "$GITHUB_WORKSPACE" --dependency-key "$DEPENDENCY_KEY" --project-key "$PROJECT_KEY" --project-restore-key "$PROJECT_RESTORE_KEY" --dependency-outcome "$DEPENDENCY_OUTCOME" --project-outcome "$PROJECT_OUTCOME"
      - name: Run
        env:
          CI: 'true'
          DOTNET_CLI_UI_LANGUAGE: en-US
          PROJECT: ${{ inputs.project }}
          COMMAND: ${{ inputs.command }}
        shell: bash /tmp/probe/shell.sh {0}
        run: |
          if [[ -n "$PROJECT" ]]; then
            make -C tools test TEST_PROJECT="$PROJECT"
          else
            bash -e -o pipefail -c "$COMMAND"
          fi
      - name: Extract the probe trace
        if: always()
        run: |
          set -euo pipefail
          python3 /tmp/probe/strace_extract.py --repository "$GITHUB_WORKSPACE" --traces /tmp/probe/trace --unit ${{ inputs.probe-unit }} --output /tmp/probe/${{ inputs.probe-unit }}.json
          git -C "$GITHUB_WORKSPACE" ls-files -z > /tmp/probe/${{ inputs.probe-unit }}.tracked
          tar -C /tmp/probe -cf - trace | zstd -T0 -3 -q -o /tmp/probe/${{ inputs.probe-unit }}.trace.tar.zst
          ls -la /tmp/probe
      - name: Upload the probe trace
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: probe3-${{ inputs.probe-unit }}
          path: |
            /tmp/probe/*.json
            /tmp/probe/*.tracked
            /tmp/probe/*.trace.tar.zst
            /tmp/probe/mutations/**
          retention-days: 5
          if-no-files-found: error
