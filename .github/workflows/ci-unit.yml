name: CI unit

# One independent CI unit. The manifest owns its inputs and tool requirements.
# Callers supply commands for non-test units. When no registered path changed, the
# remaining steps are skipped and the job succeeds.

on:
  workflow_call:
    inputs:
      unit:
        description: Unit id registered in Meta/ci-units.json
        required: true
        type: string
      command:
        description: Command for a non-test unit, executed from the repository root
        required: false
        type: string
        default: ''
      timeout-minutes:
        type: number
        default: 30

permissions:
  contents: read
  actions: read

jobs:
  unit:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - id: unit
        name: Resolve registered unit
        env:
          UNIT: ${{ inputs.unit }}
        run: python3 tools/scripts/workflow/ci_units.py resolve "$UNIT" --paths-file "$RUNNER_TEMP/hit-paths" >> "$GITHUB_OUTPUT"
      - id: entry
        name: Check registered inputs
        env:
          CI_HIT_PATHS_FILE: ${{ runner.temp }}/hit-paths
          CI_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_PUSH_BEFORE: ${{ github.event.before }}
        run: bash tools/scripts/workflow/ci-entry.sh
      - name: Validate entry result and command
        env:
          HIT: ${{ steps.entry.outputs.hit }}
          COMMAND: ${{ inputs.command }}
          TEST: ${{ steps.unit.outputs.test }}
        run: |
          case "$HIT" in true|false) ;; *) echo "CI_ENTRY_ERROR hit output is '$HIT'" >&2; exit 2 ;; esac
          case "$TEST" in
            true) [[ -z "$COMMAND" ]] || { echo "CI_ENTRY_ERROR test unit command must be empty" >&2; exit 2; } ;;
            false) [[ -n "${COMMAND//[[:space:]]/}" ]] || { echo "CI_ENTRY_ERROR non-test unit command is empty" >&2; exit 2; } ;;
            *) echo "CI_ENTRY_ERROR test output is '$TEST'" >&2; exit 2 ;;
          esac
      - if: steps.entry.outputs.hit == 'true' && steps.unit.outputs.dotnet == 'true'
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - id: keys
        if: steps.entry.outputs.hit == 'true' && steps.unit.outputs.lean != 'none'
        run: python3 tools/scripts/worktree/lean_actions.py keys --repository "$GITHUB_WORKSPACE"
      - id: elan
        if: steps.entry.outputs.hit == 'true' && steps.unit.outputs.lean != 'none' && steps.keys.outputs.elan_key != ''
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ~/.elan
          key: ${{ steps.keys.outputs.elan_key }}
      - if: steps.entry.outputs.hit == 'true' && steps.unit.outputs.lean != 'none'
        run: tools/scripts/workflow/install-lean-toolchain.sh lean-toolchain --github-path "$GITHUB_PATH"
      - id: dependency
        if: steps.entry.outputs.hit == 'true' && steps.unit.outputs.lean == 'build' && steps.keys.outputs.dependency_key != ''
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.keys.outputs.dependency_archive_path }}
          key: ${{ steps.keys.outputs.dependency_key }}
          restore-keys: ${{ steps.keys.outputs.dependency_restore_prefix }}
      - id: project
        if: steps.entry.outputs.hit == 'true' && steps.unit.outputs.lean == 'build' && steps.keys.outputs.project_key != ''
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.keys.outputs.project_archive_path }}
          key: ${{ steps.keys.outputs.project_key }}
          restore-keys: ${{ steps.keys.outputs.project_restore_prefix }}
      - name: Restore optional Lean build seeds
        if: steps.entry.outputs.hit == 'true' && steps.unit.outputs.lean == 'build'
        env:
          DEPENDENCY_KEY: ${{ steps.dependency.outputs.cache-matched-key }}
          PROJECT_KEY: ${{ steps.project.outputs.cache-matched-key }}
          DEPENDENCY_OUTCOME: ${{ steps.dependency.outcome }}
          PROJECT_OUTCOME: ${{ steps.project.outcome }}
        run: python3 tools/scripts/worktree/lean_actions.py restore --repository "$GITHUB_WORKSPACE" --dependency-key "$DEPENDENCY_KEY" --project-key "$PROJECT_KEY" --dependency-outcome "$DEPENDENCY_OUTCOME" --project-outcome "$PROJECT_OUTCOME"
      - name: Run
        if: steps.entry.outputs.hit == 'true'
        env:
          CI: 'true'
          DOTNET_CLI_UI_LANGUAGE: en-US
          TEST: ${{ steps.unit.outputs.test }}
          PROJECT: ${{ steps.unit.outputs.project }}
          COMMAND: ${{ inputs.command }}
        run: |
          if [[ "$TEST" == true ]]; then
            [[ -z "$COMMAND" ]] || { echo "CI_ENTRY_ERROR test unit command must be empty" >&2; exit 2; }
            make -C tools test TEST_PROJECT="$PROJECT"
          else
            [[ -n "${COMMAND//[[:space:]]/}" ]] || { echo "CI_ENTRY_ERROR non-test unit command is empty" >&2; exit 2; }
            bash -e -o pipefail -c "$COMMAND"
          fi
