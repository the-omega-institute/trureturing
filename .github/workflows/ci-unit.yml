name: CI unit

# One CI unit. The calling job runs it only when the change hits the unit; this
# workflow verifies the candidate, prepares the requested tools and runs either
# the unit's test project or its command.

on:
  workflow_call:
    inputs:
      unit:
        description: Unit identity in Meta/ci-units.json
        type: string
        required: true
      timeout-minutes:
        description: Cumulative compute allowance after CI preparation; the platform job cap is separate
        type: number
        default: 120
    outputs:
      unit:
        description: Identity emitted only after the declared unit succeeds
        value: ${{ jobs.unit.outputs.unit }}

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  unit:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    outputs:
      unit: ${{ steps.run.outputs.unit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the candidate
        env:
          CI_HIT_PATHS: '*'
          CI_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_PUSH_BEFORE: ${{ github.event.before }}
        run: bash tools/scripts/workflow/ci-entry.sh
      - id: definition
        env:
          UNIT: ${{ inputs.unit }}
        run: python3 tools/scripts/workflow/ci_checks.py describe "$UNIT"
      - name: Read the pinned .NET SDK version
        id: dotnet-sdk
        if: fromJSON(steps.definition.outputs.definition)['dotnet']
        run: |
          version="$(jq -er '.sdk.version' global.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - if: fromJSON(steps.definition.outputs.definition)['dotnet']
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ steps.dotnet-sdk.outputs.version }}
          cache: true
          cache-dependency-path: ${{ fromJSON(steps.definition.outputs.definition)['cache-dependency-path'] }}
      - id: prepared
        name: Adopt a matching PR preparation for this event
        if: fromJSON(steps.definition.outputs.definition)['lean'] == 'build'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/scripts/worktree/lean_pr_cache.py adopt --repository "$GITHUB_WORKSPACE"
      - id: keys
        if: fromJSON(steps.definition.outputs.definition)['lean'] != 'none'
        env:
          GH_TOKEN: ${{ fromJSON(steps.definition.outputs.definition)['lean'] == 'build' && github.token || '' }}
        run: python3 tools/scripts/worktree/lean_actions.py keys --repository "$GITHUB_WORKSPACE"
      - id: elan
        if: fromJSON(steps.definition.outputs.definition)['lean'] != 'none' && steps.keys.outputs.elan_key != ''
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ~/.elan
          key: ${{ steps.keys.outputs.elan_key }}
      - if: fromJSON(steps.definition.outputs.definition)['lean'] != 'none'
        run: tools/scripts/workflow/install-lean-toolchain.sh lean-toolchain --github-path "$GITHUB_PATH"
      - id: dependency
        if: steps.prepared.outputs.adopted != 'true' && fromJSON(steps.definition.outputs.definition)['lean'] == 'build' && steps.keys.outputs.dependency_key != ''
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.keys.outputs.dependency_archive_path }}
          key: ${{ steps.keys.outputs.dependency_key }}
          restore-keys: ${{ steps.keys.outputs.dependency_restore_prefix }}
      - id: project
        if: steps.prepared.outputs.adopted != 'true' && fromJSON(steps.definition.outputs.definition)['lean'] == 'build' && steps.keys.outputs.project_key != ''
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.keys.outputs.project_archive_path }}
          key: ${{ steps.keys.outputs.project_restore_key }}
          restore-keys: ${{ steps.keys.outputs.project_restore_prefix }}
      - name: Restore optional Lean build seeds
        if: fromJSON(steps.definition.outputs.definition)['lean'] == 'build'
        env:
          DEPENDENCY_KEY: ${{ steps.dependency.outputs.cache-matched-key }}
          PROJECT_KEY: ${{ steps.project.outputs.cache-matched-key }}
          PROJECT_RESTORE_KEY: ${{ steps.keys.outputs.project_restore_key }}
          DEPENDENCY_OUTCOME: ${{ steps.dependency.outcome }}
          PROJECT_OUTCOME: ${{ steps.project.outcome }}
        run: python3 tools/scripts/worktree/lean_actions.py restore --repository "$GITHUB_WORKSPACE" --dependency-key "$DEPENDENCY_KEY" --project-key "$PROJECT_KEY" --project-restore-key "$PROJECT_RESTORE_KEY" --dependency-outcome "$DEPENDENCY_OUTCOME" --project-outcome "$PROJECT_OUTCOME"
      - name: Restore selected .NET dependencies
        if: fromJSON(steps.definition.outputs.definition).dotnet
        env:
          UNIT: ${{ inputs.unit }}
        run: python3 tools/scripts/workflow/ci_checks.py unit "$UNIT" --prepare
      - name: Initialize the shared compute allowance
        env:
          COMPUTE_MINUTES: ${{ inputs.timeout-minutes }}
        run: |
          [[ "$COMPUTE_MINUTES" =~ ^[1-9][0-9]*$ && "$COMPUTE_MINUTES" -le 360 ]] || { echo 'CI_UNIT_ERROR compute minutes must be 1..360' >&2; exit 2; }
          budget="$RUNNER_TEMP/unit-compute-seconds"
          python3 tools/scripts/workflow/ci_compute.py init "$budget" "$COMPUTE_MINUTES"
          echo "STRATALINT_CI_COMPUTE_BUDGET=$budget" >> "$GITHUB_ENV"
      - id: run
        name: Run
        env:
          CI: 'true'
          CI_DOTNET_PREPARED: ${{ fromJSON(steps.definition.outputs.definition).dotnet && '1' || '0' }}
          DOTNET_CLI_UI_LANGUAGE: en-US
          UNIT: ${{ inputs.unit }}
        run: python3 tools/scripts/workflow/ci_checks.py unit "$UNIT"
