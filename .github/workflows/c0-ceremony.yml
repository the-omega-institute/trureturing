# C0 ceremony: explicitly renew a PR's projections with candidate-side tooling.
# A separate write-capable job applies only the two admitted projection files.
name: c0-ceremony

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to renew
        required: true
        type: number

permissions: {}

concurrency:
  group: c0-ceremony-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  renew:
    name: Renew C0 ceremony projections
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head_ref: ${{ steps.pr.outputs.head_ref }}
      head_repo: ${{ steps.pr.outputs.head_repo }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
    steps:
      - name: Freeze PR identities
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::pr_number must be a positive integer"
            exit 2
          }
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          state="$(jq -r '.state' <<<"$pr")"
          base_ref="$(jq -r '.base.ref' <<<"$pr")"
          base_sha="$(jq -r '.base.sha' <<<"$pr")"
          head_ref="$(jq -r '.head.ref' <<<"$pr")"
          head_sha="$(jq -r '.head.sha' <<<"$pr")"
          head_repo="$(jq -r '.head.repo.full_name // empty' <<<"$pr")"
          [[ "$state" == "open" ]] || {
            echo "::error::PR #$PR_NUMBER is not open"
            exit 1
          }
          [[ "$base_ref" == "dev" ]] || {
            echo "::error::PR #$PR_NUMBER does not target dev"
            exit 1
          }
          [[ "$head_repo" == "$GITHUB_REPOSITORY" ]] || {
            echo "::error::C0 ceremony can only commit to same-repository PR branches"
            exit 1
          }
          git check-ref-format --branch "$head_ref" >/dev/null
          {
            echo "base_sha=$base_sha"
            echo "head_ref=$head_ref"
            echo "head_repo=$head_repo"
            echo "head_sha=$head_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Check out frozen PR head
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pr.outputs.head_repo }}
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate

      - name: Resolve frozen merge base
        id: merge-base
        shell: bash
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          actual="$(git -C candidate rev-parse HEAD)"
          [[ "$actual" == "$HEAD_SHA" ]] || {
            echo "::error::candidate checkout does not match frozen PR head"
            exit 1
          }
          if ! git -C candidate cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git -C candidate fetch --no-tags origin "$BASE_SHA"
          fi
          merge_base="$(git -C candidate merge-base "$HEAD_SHA" "$BASE_SHA")"
          git -C candidate merge-base --is-ancestor "$merge_base" "$HEAD_SHA"
          echo "sha=$merge_base" >> "$GITHUB_OUTPUT"
          printf '%s\n' "C0 base merge-base: $merge_base" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve pinned Lean toolchain
        id: lean
        shell: bash
        env:
          LEAN_TOOLCHAIN_FILE: candidate/lean-toolchain
        run: |
          set -euo pipefail
          test -s "$LEAN_TOOLCHAIN_FILE"
          echo "file=$LEAN_TOOLCHAIN_FILE" >> "$GITHUB_OUTPUT"
          echo "hash=$(sha256sum "$LEAN_TOOLCHAIN_FILE" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Restore elan and pinned Lean toolchain
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-${{ runner.arch }}-elan-${{ steps.lean.outputs.hash }}

      - name: Restore mathlib cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/mathlib
          key: ${{ runner.os }}-${{ runner.arch }}-c0-mathlib-${{ hashFiles('candidate/lake-manifest.json', 'candidate/lean-toolchain') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-c0-mathlib-
            ${{ runner.os }}-${{ runner.arch }}-lake-

      - name: Install pinned Lean toolchain
        shell: bash
        env:
          LEAN_TOOLCHAIN_FILE: ${{ steps.lean.outputs.file }}
        run: |
          set -euo pipefail
          toolchain="$(tr -d '\r\n' < "$LEAN_TOOLCHAIN_FILE")"
          test -n "$toolchain"
          if [[ ! -x "$HOME/.elan/bin/elan" ]]; then
            curl --proto '=https' --tlsv1.2 -sSf https://elan.lean-lang.org/elan-init.sh \
              | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          if ! "$HOME/.elan/bin/elan" toolchain list 2>/dev/null | grep -qF "$toolchain"; then
            "$HOME/.elan/bin/elan" toolchain install "$toolchain"
          fi
          "$HOME/.elan/bin/elan" default "$toolchain"
          "$HOME/.elan/bin/lake" --version

      - name: Install pinned SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: candidate/global.json

      - name: Reconcile trust root with candidate tooling
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          make c0-reconcile-trust-root

      - name: Enforce write-path whitelist
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          changed=()
          while IFS= read -r -d '' path; do
            changed+=("$path")
          done < <({
            git diff --name-only --no-renames -z HEAD
            git ls-files --others --exclude-standard -z
          })
          bad=()
          for path in "${changed[@]}"; do
            case "$path" in
              Meta/StrataLint/TOWER.yaml|Meta/StrataLint/Golden/c0-inaugural-conservative-certificate.json) ;;
              *) bad+=("$path") ;;
            esac
          done
          if [[ "${#bad[@]}" -ne 0 ]]; then
            echo "::error::c0-reconcile-trust-root touched paths outside the whitelist"
            printf '%s\n' "${bad[@]}"
            exit 1
          fi
          output="$RUNNER_TEMP/c0-output"
          mkdir -p \
            "$output/Meta/StrataLint/Golden" \
            "$output/Meta/StrataLint"
          cp Meta/StrataLint/TOWER.yaml \
            "$output/Meta/StrataLint/TOWER.yaml"
          cp Meta/StrataLint/Golden/c0-inaugural-conservative-certificate.json \
            "$output/Meta/StrataLint/Golden/c0-inaugural-conservative-certificate.json"

      - name: Upload renewed projections
        uses: actions/upload-artifact@v4
        with:
          name: c0-reconciled-${{ steps.pr.outputs.head_sha }}
          path: ${{ runner.temp }}/c0-output
          if-no-files-found: error
          retention-days: 1

  commit:
    name: Commit renewed C0 ceremony projections
    needs: renew
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Verify frozen PR head is current
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          FROZEN_HEAD_SHA: ${{ needs.renew.outputs.head_sha }}
        run: |
          set -euo pipefail
          current_head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          [[ "$current_head" == "$FROZEN_HEAD_SHA" ]] || {
            echo "::error::PR head moved while the C0 ceremony was running"
            exit 1
          }

      - name: Check out frozen PR head for commit
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.renew.outputs.head_repo }}
          ref: ${{ needs.renew.outputs.head_sha }}
          fetch-depth: 0
          path: candidate

      - name: Download renewed projections
        uses: actions/download-artifact@v4
        with:
          name: c0-reconciled-${{ needs.renew.outputs.head_sha }}
          path: renewed

      - name: Commit back to PR branch
        shell: bash
        env:
          HEAD_REF: ${{ needs.renew.outputs.head_ref }}
        run: |
          set -euo pipefail
          mapfile -d '' -t artifact_paths < <(
            find renewed -type f -print0 | sort -z
          )
          expected=(
            renewed/Meta/StrataLint/Golden/c0-inaugural-conservative-certificate.json
            renewed/Meta/StrataLint/TOWER.yaml
          )
          [[ "${#artifact_paths[@]}" -eq "${#expected[@]}" ]]
          for index in "${!expected[@]}"; do
            [[ "${artifact_paths[$index]}" == "${expected[$index]}" ]]
          done
          cp renewed/Meta/StrataLint/TOWER.yaml \
            candidate/Meta/StrataLint/TOWER.yaml
          cp renewed/Meta/StrataLint/Golden/c0-inaugural-conservative-certificate.json \
            candidate/Meta/StrataLint/Golden/c0-inaugural-conservative-certificate.json
          cd candidate
          git config user.name "c0-ceremony-bot"
          git config user.email "c0-ceremony-bot@users.noreply.github.com"
          git add -- \
            Meta/StrataLint/TOWER.yaml \
            Meta/StrataLint/Golden/c0-inaugural-conservative-certificate.json
          if git diff --cached --quiet; then
            make c0-reconcile-trust-root
            git add -- Meta/StrataLint/TOWER.yaml
            git diff --cached --quiet || {
              echo "::error::no-op artifact did not contain a consistent C0 trust root"
              exit 1
            }
            echo "C0 ceremony is a byte-exact no-op"
            exit 0
          fi
          git -c core.hooksPath=/dev/null commit \
            -m "chore(c0): reconcile TOWER trust root [c0-ceremony-bot]"
          git push origin "HEAD:refs/heads/$HEAD_REF"
