## [PR #5065] MIRROR_KREIN_SECOND_LAYER_CLOSURE

# 镜像 Krein 几何的第二层闭合

**候选 GID：**

```text
D5/S3/Midline/Cayley/ZeroDataHilbertPresentationTransport
D5/S3/Midline/Cayley/CanonicalZetaMirrorEvenOddDecomposition
D5/S3/Midline/Cayley/CanonicalZetaCayleyKreinInverse
D5/S3/Midline/Cayley/FiniteMirrorKreinGramInertia
```

本增补建立在同一 PR 已有的无参数 `zetaZeroData`、唯一 presentation 重标号、镜像 fundamental symmetry、Cayley `J`-unitarity 和有限镜像轨道计数之上。第一层证明了对象存在以及每个非固定镜像轨道产生负方向。第二层进一步关闭四项承重义务：表示无关的 Hilbert 算子运输、规范化偶奇谱投影、Cayley 的有界显式 Krein 逆元、实际有限 Gram 矩阵的精确负惯性。

这些节点不以旧定理改名充当进展。每项都增加一个此前缺失的结构层。

## 1. `ZeroData` presentation 的 Hilbert 箐子几何无关性

任意两个有效 presentation `Z` 与 `Z'` 之间已有唯一零点保持等价：

\[
e_{Z,Z'}:\mathbb N\simeq\mathbb N.
\]

第二层把它提升到 multiplicity-expanded 坐标：

\[
\widetilde e_{Z,Z'}:
\sum_n\operatorname{Fin}(m_n)
\simeq
\sum_{n'}\operatorname{Fin}(m'_{n'}).
\]

再通过坐标重排构造酉映射：

\[
\boxed{
T_{Z,Z'}:\mathcal H_Z\simeq_u\mathcal H_{Z'}.
}
\]

它同时满足：

\[
\boxed{
T_{Z,Z'}J_Z=J_{Z'}T_{Z,Z'},
}
\]

\[
\boxed{
T_{Z,Z'}U_Z=U_{Z'}T_{Z,Z'},
}
\]

以及：

\[
\boxed{
[T\psi,T\phi]_{J_{Z'}}=[\psi,\phi]_{J_Z}.
}
\]

所以 `ZeroData` 的自然数编号只是 presentation。镜像谱分解、Cayley 动力学与不定内积在唯一酉共轭意义下保持。该结论排除了后续 operator criterion 对 `Classical.choice` 编号的隐性依赖。

## 2. 镜像的规范偶奇谱投影

定义：

\[
\boxed{
P_+=\frac{I+J}{2},
\qquad
P_-=\frac{I-J}{2}.
}
\]

机器节点证明：

\[
P_+^2=P_+,
\qquad
P_-^2=P_-,
\]

\[
P_+P_-=P_-P_+=0,
\qquad
P_++P_-=I,
\]

并证明：

\[
JP_+=P_+,
\qquad
JP_-=-P_-.
\]

两个扇区在 Hilbert 内积下正交：

\[
\boxed{
\langle P_+\psi,P_-\phi\rangle=0.
}
\]

最重要的能量恒等式是：

\[
\boxed{
[\psi,\psi]_J
=\lVert P_+\psi\rVert^2
-
\lVert P_-\psi\rVert^2.
}
\]

这说明 Krein 负性精确位于镜像奇谱投影的像中。此前的单个奇向量证书由此升级为全空间的规范谱分解。`P_-\psi=0` 当且仅当 `J\psi=\psi`，所以“无奇部分”与镜像固定具有严格等价关系。

## 3. Cayley 算子的显式有界 Krein 逆元

第一层已经证明：

\[
U_Z^*J_ZU_Z=J_Z.
\]

第二层先构造真实的 reciprocal coefficient vector：

\[
\widetilde c_v=c_v^{-1}.
\]

其有界性不需要新的零点下界。镜像恒等式给出：

\[
c_{M(v)}=\overline{c_v}^{-1},
\]

所以：

\[
|c_v^{-1}|=|c_{M(v)}|.
\]

原 Cayley coefficient vector 已经有界，而镜像只是置换坐标。因此 reciprocal vector 同样有界，并定义一个 bounded diagonal operator `V_Z`。

机器节点逐坐标证明：

\[
V_ZU_Z=I,
\qquad
U_ZV_Z=I.
\]

所以：

\[
\boxed{
U_Z\text{ 对每个有效 ZeroData 都可逆}.
}
\]

这不要求 RH，也不要求普通酉性。

再由 `J^2=I` 和 `U^*JU=J` 得到左逆：

\[
(JU^*J)U=I.
\]

与显式双侧逆的唯一性结合，证明：

\[
\boxed{
U^{-1}=JU^*J.
}
\]

并推出伴随守恒式：

\[
\boxed{
UJU^*=J.
}
\]

因此函数方程和共轭结构提供完整的 Krein-unitary 群元素，而不只是一个单向 Gram 恒等式。普通 unitary 是镜像负扇区退化后的更强性质。

## 4. 实际 mirror-Krein Gram 矩阵的精确惯性

第一层定义的 `finiteMirrorKreinIndex` 是每个有限窗口中，选取一个非固定镜像轨道代表后，按解析重数求和得到的整数：

\[
\kappa_T=
\sum_{n\in\mathcal R_T}m_n.
\]

它同时构造了抽象标准负型。第二层关闭更强的矩阵义务。

对每个：

\[
i\in
\sum_{n\in\mathcal R_T}\operatorname{Fin}(m_n),
\]

将其嵌入真实 zero Hilbert space，取实际奇向量：

\[
v_i^-=e_i-Je_i.
\]

one-representative-per-orbit 条件保证不同 `i` 不会互为镜像。由 Hilbert 基正交性与镜像 involution，机器计算：

\[
\langle v_i^-,v_j^-\rangle
=2\delta_{ij}.
\]

由于 `Jv_j^-=-v_j^-`，真实 Krein Gram 条目为：

\[
[v_i^-,v_j^-]_J
=-2\delta_{ij}.
\]

于是：

\[
\boxed{
G_T^-=-2I.
}
\]

这是一份由实际 `mirrorKreinForm` 生成的 Hermitian Gram 矩阵。利用仓库已有的 `RHLinalg.negIndex`、Hermitian negation 与 positive-definite eigenvalue theory，机器证明：

\[
\boxed{
\operatorname{negIndex}(G_T^-)
=\#\mathcal I_T^-
=\kappa_T.
}
\]

因此：

\[
\boxed{
\operatorname{negIndex}(G_T^-)>0
\iff
\text{窗口含有离线镜像轨道}.
}
\]

以及：

\[
\boxed{
\operatorname{negIndex}(G_T^-)=0
\iff
\text{窗口内全部零点位于临界线}.
}
\]

这一结论把 combinatorial orbit count 升级成真实有限 Hermitian Gram 的谱惯性。它为后续 Pick、Weil 与 sampled-kernel negative-square transport 提供了标准目标矩阵。

## 5. 四项结果组成的闭合链

第二层现在给出：

\[
\boxed{
\begin{aligned}
\text{唯一 presentation reindexing}
&\Longrightarrow
\text{unitary operator transport},\\
\text{mirror self-adjoint involution}
&\Longrightarrow
\text{orthogonal even/odd projections},\\
\text{mirror Cayley reciprocity}
&\Longrightarrow
U^{-1}=JU^*J,\\
\text{finite nonfixed mirror orbits}
&\Longrightarrow
G_T^-=-2I,\\
&\Longrightarrow
n_-(G_T^-)=\kappa_T.
\end{aligned}
}
\]

这条链说明，离线破缺同时具有四种彼此一致的表示：镜像非固定轨道、Hilbert 奇投影、Krein 负方向、有限 Gram 负特征值。它们在 presentation unitary transport 下保持。

## 6. 与 RH 主路线的边界

本层没有证明 RH。它完成的是 zero-side target geometry。现在任意 prime-side、Pick-side 或 Weil-side 构造若要忠实检测全部离线轨道，需要建立到 `G_T^-` 或其奇扇区的满秩运输。

下一承重节点应优先处理：

```text
FiniteMirrorOddChannelInterpolationSurjective
CanonicalZeroOperatorPresentationInvariance
CayleyRadialBlockIntertwiner
FiniteWeilMirrorGramCongruence
```

其中第一和第四项将回答，允许的 Weil 测试函数评价是否覆盖整个 finite mirror-odd sector。若覆盖映射满秩，则 Sylvester 惯性律会把本层的精确 `kappa_T` 运输成真实 Weil Gram 的 negative-square index。

本层不主张 prime-side 算子已经收敛到 zero-side Cayley operator，不主张所有离线轨道已被单一测试函数同时隔离，也不定义无限维 Fredholm/Krein 指数。
