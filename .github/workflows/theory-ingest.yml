# 理论卷自动摄入:PR 触碰 docs/develop/theory/** 时,以 base 侧法官跑 make ingest,
# 产生的账本对齐与 content-addressed echo 投影 bot-commit 回 PR 分支。
# 信任拓扑:代码=base 侧(pull_request_target),PR 侧仅理论卷数据输入;写路径白名单硬校验。
name: theory-ingest

on:
  pull_request_target:
    branches: [dev]
    paths:
      - 'docs/develop/theory/**'

permissions:
  actions: read
  contents: write

concurrency:
  group: theory-ingest-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-ingest:
    name: Auto-ingest theory volumes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out base (judge code)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: judge
          persist-credentials: false

      - name: Check out PR head (data + commit target)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce candidate data-only boundary
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git -C candidate rev-parse HEAD)"
          test "$actual" = "$HEAD_SHA"
          if ! git -C candidate cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git -C candidate fetch --no-tags "$GITHUB_WORKSPACE/judge" "$BASE_SHA"
          fi
          bad=()
          while IFS= read -r -d '' path; do
            case "$path" in
              docs/develop/theory/*|Meta/BACKFILL.yaml|Meta/Digestion/atoms/*|Generated/echo-residual-summary.md) ;;
              *) bad+=("$path") ;;
            esac
          done < <(git -C candidate diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA")
          if [[ "${#bad[@]}" -ne 0 ]]; then
            printf '::error::theory ingest refuses non-data candidate path: %s\n' "${bad[@]}"
            registry_rejected=false
            for path in "${bad[@]}"; do
              if [[ $path == "Meta/registry.yaml" ]]; then
                registry_rejected=true
                break
              fi
            done
            if [[ $registry_rejected == true ]]; then
              printf '%s\n' '::error::THEORY-INGEST-REGISTRY-001: land a separate harness PR that adds the new theory path to Meta/registry.yaml first, then rebase the theory PR and drop its registry diff from the data PR'
            fi
            exit 1
          fi

      - name: Install pinned SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: judge/global.json

      - name: Overlay judge harness onto candidate data
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete judge/Meta/StrataLint/ candidate/Meta/StrataLint/
          cp judge/Makefile judge/global.json candidate/

      - name: Resolve base canonical Lean report address
        id: lean-report-input
        shell: bash
        run: |
          set -euo pipefail
          helper="$GITHUB_WORKSPACE/candidate/Meta/StrataLint/scripts/report/lean-report-input.sh"
          test -x "$helper"
          read -r address _ <<< "$("$helper" address --repository "$GITHUB_WORKSPACE/candidate")"
          [[ "$address" =~ ^[0-9a-f]{64}$ ]]
          echo "address=$address" >> "$GITHUB_OUTPUT"

      # 缓存由 ci.yml 的 Canonical Lean report production 生产(约 10 分钟),与本
      # workflow 并行触发;缓存被 LRU 逐出后的首个 theory PR 会竞态 miss(先例:
      # PR #290/#320,ingest 11:12 失败,缓存 12:58 才产出)。故以 lookup-only 探测
      # + 条件等待重试,全程无凭据;最终 restore 仍 fail-closed——等待不降级检测。
      # 诚实边界(对抗评审注):12 分钟重试只盖"生产者正在跑"的窗口;生产者自身
      # 失败/被取消(如上述先例的 106 分钟空窗)不在此列,届时仍诚实红,由重跑
      # 或 shepherd 唤醒兜底——缩窗而非闭窗。
      - name: Probe base canonical Lean report cache
        id: lean-report-probe-1
        uses: actions/cache/restore@v4
        with:
          path: .canonical-lean-report-cache
          key: stratalint-canonical-lean-report-v1-${{ steps.lean-report-input.outputs.address }}
          lookup-only: true

      - name: Wait for cache production (first retry)
        if: steps.lean-report-probe-1.outputs.cache-hit != 'true'
        shell: bash
        run: sleep 360

      - name: Re-probe base canonical Lean report cache
        id: lean-report-probe-2
        if: steps.lean-report-probe-1.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .canonical-lean-report-cache
          key: stratalint-canonical-lean-report-v1-${{ steps.lean-report-input.outputs.address }}
          lookup-only: true

      - name: Wait for cache production (final retry)
        if: |
          steps.lean-report-probe-1.outputs.cache-hit != 'true'
            && steps.lean-report-probe-2.outputs.cache-hit != 'true'
        shell: bash
        run: sleep 360

      - name: Restore base canonical Lean report
        id: lean-report-cache
        uses: actions/cache/restore@v4
        with:
          path: .canonical-lean-report-cache
          key: stratalint-canonical-lean-report-v1-${{ steps.lean-report-input.outputs.address }}
          fail-on-cache-miss: true

      - name: Install and verify base canonical Lean report
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.lean-report-cache.outputs.cache-hit }}" = "true"
          source="$GITHUB_WORKSPACE/.canonical-lean-report-cache/raw-lean-report.json"
          report="$GITHUB_WORKSPACE/candidate/.lake/build/stratalint/raw-lean-report.json"
          mkdir -p "$(dirname "$report")"
          for suffix in '' .sha256 .input.attestation .provenance.json; do
            test -s "${source}${suffix}"
            cp "${source}${suffix}" "${report}${suffix}"
          done
          "$GITHUB_WORKSPACE/candidate/Meta/StrataLint/scripts/report/lean-report-input.sh" verify \
            --repository "$GITHUB_WORKSPACE/candidate" \
            --report "$report"
          printf '%s\n' \
            "Lean report input address: sha256:${{ steps.lean-report-input.outputs.address }}" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Run ingest with base judge
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          make ingest BASE=HEAD

      - name: Re-emit content-addressed echo projection
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          cd candidate
          projection="$(mktemp)"
          trap 'rm -f "$projection"' EXIT
          dotnet run --project Meta/StrataLint/StrataLint.Cli/StrataLint.Cli.csproj --configuration Release -- \
            echo-verify --emit --base "$BASE_SHA" \
            > "$projection"
          mv "$projection" Generated/echo-residual-summary.md
          trap - EXIT

      - name: Enforce write-path whitelist and commit back
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd candidate
          git restore --source=HEAD -- Meta/StrataLint Makefile global.json || true
          git clean -fd -- Meta/StrataLint
          changed="$(git status --porcelain)"
          if [ -z "$changed" ]; then echo "ingest no-op"; exit 0; fi
          bad="$(git status --porcelain | grep -vE '^.. (Meta/BACKFILL\.yaml|Meta/Digestion/atoms/.*|Generated/echo-residual-summary\.md)$' || true)"
          if [ -n "$bad" ]; then
            echo "::error::ingest touched paths outside whitelist:"; echo "$bad"; exit 1
          fi
          git config user.name "theory-ingest-bot"
          git config user.email "theory-ingest-bot@users.noreply.github.com"
          git add Meta/BACKFILL.yaml Meta/Digestion/atoms Generated/echo-residual-summary.md
          git commit -m "chore(digestion): auto-ingest theory update [theory-ingest-bot]"
          gh auth setup-git
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
