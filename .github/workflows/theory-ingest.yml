# 理论卷自动摄入:只读 trusted-prepare 从事件 base 的 producer 与候选 theory 数据
# 计算唯一 canonical 结果;writeback 只校验该 run 的 artifact 并以 CAS 快进写回。
# 不回写 echo residual 投影:它是允许陈旧的人读快照,按需由 producer 现算。
name: theory-ingest

on:
  pull_request_target:
    branches: [dev]
    paths:
      - 'docs/develop/theory/**'

permissions:
  actions: read
  contents: read

concurrency:
  group: theory-ingest-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  trusted-prepare:
    name: Prepare trusted theory ingest closure
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    steps:
      - name: Reject fork pull requests
        shell: bash
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]]; then
            printf '%s\n' "fork pull requests cannot receive theory ingest writeback" >&2
            exit 1
          fi

      - name: Check out pinned event base
        id: checkout-trusted
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false

      - name: Strip checkout remote state
        if: steps.checkout-trusted.outcome == 'success'
        shell: bash
        env:
          CHECKOUT_PATH: trusted
        run: |
          set -euo pipefail
          git -C "$CHECKOUT_PATH" remote remove origin
          git -C "$CHECKOUT_PATH" for-each-ref --format='delete %(refname)' refs/remotes/ |
            git -C "$CHECKOUT_PATH" update-ref --stdin
          remote_count="$(git -C "$CHECKOUT_PATH" remote | wc -l)"
          remote_ref_count="$(git -C "$CHECKOUT_PATH" for-each-ref --format='%(refname)' refs/remotes/ | wc -l)"
          if [[ "$remote_count" -ne 0 || "$remote_ref_count" -ne 0 ]]; then
            printf '%s\n' "checkout still exposes remotes or remote-tracking refs" >&2
            exit 1
          fi
          head_sha="$(git -C "$CHECKOUT_PATH" rev-parse HEAD)"
          base_sha="$(git -C "$CHECKOUT_PATH" rev-parse HEAD^1)"
          test -n "$head_sha"
          test -n "$base_sha"

      - name: Check out candidate theory as data
        id: checkout-candidate-data
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate-data
          sparse-checkout: docs/develop/theory
          sparse-checkout-cone-mode: false
          fetch-depth: 0
          persist-credentials: false

      - name: Strip checkout remote state
        if: steps.checkout-candidate-data.outcome == 'success'
        shell: bash
        env:
          CHECKOUT_PATH: candidate-data
        run: |
          set -euo pipefail
          git -C "$CHECKOUT_PATH" remote remove origin
          git -C "$CHECKOUT_PATH" for-each-ref --format='delete %(refname)' refs/remotes/ |
            git -C "$CHECKOUT_PATH" update-ref --stdin
          remote_count="$(git -C "$CHECKOUT_PATH" remote | wc -l)"
          remote_ref_count="$(git -C "$CHECKOUT_PATH" for-each-ref --format='%(refname)' refs/remotes/ | wc -l)"
          if [[ "$remote_count" -ne 0 || "$remote_ref_count" -ne 0 ]]; then
            printf '%s\n' "checkout still exposes remotes or remote-tracking refs" >&2
            exit 1
          fi
          head_sha="$(git -C "$CHECKOUT_PATH" rev-parse HEAD)"
          base_sha="$(git -C "$CHECKOUT_PATH" rev-parse HEAD^1)"
          test -n "$head_sha"
          test -n "$base_sha"

      - name: Reject event heads that change trusted inputs
        shell: bash
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/trusted/tools/scripts/workflow/theory-ingest-closure.sh" \
            guard-inputs \
            "$GITHUB_WORKSPACE/trusted" \
            "$GITHUB_WORKSPACE/candidate-data" \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

      - name: Install pinned SDK from trusted base
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: trusted/global.json

      - name: Build trusted producer
        shell: bash
        run: |
          set -euo pipefail
          dotnet build trusted/tools/StrataLint.sln -c Release --warnaserror

      - name: Resolve trusted canonical Lean report address
        id: lean-report-input
        shell: bash
        run: |
          set -euo pipefail
          helper="$GITHUB_WORKSPACE/trusted/tools/scripts/report/lean-report-input.sh"
          test -x "$helper"
          read -r address producer_sha256 sources_sha256 config_sha256 \
            <<< "$("$helper" address --repository "$GITHUB_WORKSPACE/trusted")"
          [[ "$address" =~ ^[0-9a-f]{64}$ ]]
          [[ "$producer_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$sources_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$config_sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "address=$address" >> "$GITHUB_OUTPUT"
          echo "sources_sha256=$sources_sha256" >> "$GITHUB_OUTPUT"
          echo "config_sha256=$config_sha256" >> "$GITHUB_OUTPUT"

      - name: Restore trusted canonical Lean report
        id: lean-report-cache
        uses: actions/cache/restore@v4
        with:
          path: .canonical-lean-report-cache
          key: stratalint-canonical-lean-report-v2-${{ steps.lean-report-input.outputs.address }}

      - name: Validate restored trusted canonical Lean report
        id: lean-report-cache-validation
        if: steps.lean-report-cache.outputs.cache-hit == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          source="$GITHUB_WORKSPACE/.canonical-lean-report-cache/raw-lean-report.json"
          report="$GITHUB_WORKSPACE/trusted/.lake/build/stratalint/raw-lean-report.json"
          mkdir -p "$(dirname "$report")"
          for suffix in '' .sha256 .input.attestation .provenance.json; do
            test -s "${source}${suffix}"
            cp "${source}${suffix}" "${report}${suffix}"
          done
          "$GITHUB_WORKSPACE/trusted/tools/scripts/report/lean-report-input.sh" verify \
            --repository "$GITHUB_WORKSPACE/trusted" \
            --report "$report"

      - name: Restore elan and pinned Lean toolchain for cold production
        if: steps.lean-report-cache-validation.outcome != 'success'
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-${{ runner.arch }}-elan-${{ hashFiles('trusted/lean-toolchain') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-elan-

      - name: Install pinned Lean toolchain for cold production
        if: steps.lean-report-cache-validation.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -x "$HOME/.elan/bin/elan" ]]; then
            curl --proto '=https' --tlsv1.2 -sSf https://elan.lean-lang.org/elan-init.sh \
              | sh -s -- -y --default-toolchain none
          fi
          toolchain="$(tr -d '\r\n' < trusted/lean-toolchain)"
          test -n "$toolchain"
          if ! "$HOME/.elan/bin/elan" toolchain list 2>/dev/null | grep -qF "$toolchain"; then
            "$HOME/.elan/bin/elan" toolchain install "$toolchain"
          fi
          "$HOME/.elan/bin/elan" default "$toolchain"
          "$HOME/.elan/bin/lake" --version

      - name: Restore trusted Lean dependency artifacts for cold production
        id: lake-deps-cache
        if: steps.lean-report-cache-validation.outcome != 'success'
        uses: actions/cache/restore@v4
        with:
          path: |
            trusted/.lake/packages
            trusted/.lake/config
            trusted/.lake/.stratalint-lean-cache-stamp.json
            ~/.cache/mathlib
          key: ${{ runner.os }}-${{ runner.arch }}-lake-deps-v1-${{ steps.lean-report-input.outputs.config_sha256 }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-lake-deps-v1-${{ steps.lean-report-input.outputs.config_sha256 }}

      - name: Restore trusted Lean build artifacts for cold production
        id: lake-build-cache
        if: steps.lean-report-cache-validation.outcome != 'success'
        uses: actions/cache/restore@v4
        with:
          path: trusted/.lake/build
          key: ${{ runner.os }}-${{ runner.arch }}-lake-build-v1-${{ steps.lean-report-input.outputs.config_sha256 }}-${{ steps.lean-report-input.outputs.sources_sha256 }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-lake-build-v1-${{ steps.lean-report-input.outputs.config_sha256 }}-

      - name: Produce trusted canonical Lean report from cold path
        if: steps.lean-report-cache-validation.outcome != 'success'
        # ASSUMED-UNVERIFIED: #2402 established only that a cold build exceeds 30m.
        # The 60m cap is a lower-bound extrapolation, not a completed cold-build measurement.
        timeout-minutes: 60
        shell: bash
        run: |
          set -euo pipefail
          cd trusted
          export PATH="$HOME/.elan/bin:$PATH"
          report=".lake/build/stratalint/raw-lean-report.json"
          for suffix in '' .sha256 .input.attestation .provenance.json; do
            rm -f -- "${report}${suffix}"
          done
          make lean-report

      - name: Install and verify trusted canonical Lean report
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/trusted/.lake/build/stratalint/raw-lean-report.json"
          for suffix in '' .sha256 .input.attestation .provenance.json; do
            test -s "${report}${suffix}"
          done
          "$GITHUB_WORKSPACE/trusted/tools/scripts/report/lean-report-input.sh" verify \
            --repository "$GITHUB_WORKSPACE/trusted" \
            --report "$report"
          printf '%s\n' \
            "Lean report input address: sha256:${{ steps.lean-report-input.outputs.address }}" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Run base-owned ingest and seal trusted closure
        shell: bash
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/trusted/tools/scripts/workflow/theory-ingest-closure.sh" \
            prepare \
            "$GITHUB_WORKSPACE/trusted" \
            "$GITHUB_WORKSPACE/candidate-data" \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            "$GITHUB_WORKSPACE/trusted-artifact"

      - name: Upload trusted ingest closure
        uses: actions/upload-artifact@v4
        with:
          name: theory-ingest-trusted-closure
          path: trusted-artifact
          if-no-files-found: error
          retention-days: 1

  writeback:
    name: Authorize and write back theory ingest closure
    needs: trusted-prepare
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Reject fork pull requests
        shell: bash
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]]; then
            printf '%s\n' "fork pull requests cannot receive theory ingest writeback" >&2
            exit 1
          fi

      - name: Check out pinned-base validator
        id: checkout-validator
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-validator
          fetch-depth: 0
          persist-credentials: false

      - name: Strip checkout remote state
        if: steps.checkout-validator.outcome == 'success'
        shell: bash
        env:
          CHECKOUT_PATH: trusted-validator
        run: |
          set -euo pipefail
          git -C "$CHECKOUT_PATH" remote remove origin
          git -C "$CHECKOUT_PATH" for-each-ref --format='delete %(refname)' refs/remotes/ |
            git -C "$CHECKOUT_PATH" update-ref --stdin
          remote_count="$(git -C "$CHECKOUT_PATH" remote | wc -l)"
          remote_ref_count="$(git -C "$CHECKOUT_PATH" for-each-ref --format='%(refname)' refs/remotes/ | wc -l)"
          if [[ "$remote_count" -ne 0 || "$remote_ref_count" -ne 0 ]]; then
            printf '%s\n' "checkout still exposes remotes or remote-tracking refs" >&2
            exit 1
          fi
          head_sha="$(git -C "$CHECKOUT_PATH" rev-parse HEAD)"
          base_sha="$(git -C "$CHECKOUT_PATH" rev-parse HEAD^1)"
          test -n "$head_sha"
          test -n "$base_sha"

      - name: Download this run's trusted ingest closure
        uses: actions/download-artifact@v4
        with:
          name: theory-ingest-trusted-closure
          path: trusted-artifact

      - name: Validate, commit, and compare-and-swap trusted closure
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
          REMOTE_URL: ${{ github.server_url }}/${{ github.repository }}.git
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_GRAPHQL_URL: ${{ github.graphql_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$HEAD_REPOSITORY" == "$BASE_REPOSITORY" ]]
          "$GITHUB_WORKSPACE/trusted-validator/tools/scripts/workflow/theory-ingest-closure.sh" \
            writeback \
            "$GITHUB_WORKSPACE/trusted-validator" \
            "$GITHUB_WORKSPACE/trusted-artifact" \
            "$BASE_SHA" \
            "$HEAD_SHA" \
            "$HEAD_REF" \
            "$REMOTE_URL"
