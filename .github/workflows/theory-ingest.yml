# 理论卷自动摄入:只读 job 在 GitHub merge result 上生成候选提案;最小写 job 以事件
# base SHA 钉住的 producer 对事件 head 的理论源独立重算,逐字节相等才快进写回。
# 不回写 echo residual 投影:它是允许陈旧的人读快照(CLAUDE.md 第〇节),按需由
# `make echo-residual-summary` 重发,消费者应调 producer 现算而非读仓内分片。
name: theory-ingest

on:
  pull_request_target:
    branches: [dev]
    paths:
      - 'docs/develop/theory/**'

permissions:
  actions: read
  contents: read

concurrency:
  group: theory-ingest-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  propose:
    name: Propose theory ingest closure
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 36
    steps:
      - name: Check out checked merge result
        id: checkout-merge
        continue-on-error: ${{ github.event_name == 'pull_request_target' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ format('refs/pull/{0}/merge', github.event.pull_request.number) }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Strip checkout remote state
        if: steps.checkout-merge.outcome == 'success'
        shell: bash
        env:
          CHECKOUT_PATH: candidate
        run: |
          set -euo pipefail
          git -C "$CHECKOUT_PATH" remote remove origin
          git -C "$CHECKOUT_PATH" for-each-ref --format='delete %(refname)' refs/remotes/ |
            git -C "$CHECKOUT_PATH" update-ref --stdin
          remote_count="$(git -C "$CHECKOUT_PATH" remote | wc -l)"
          remote_ref_count="$(git -C "$CHECKOUT_PATH" for-each-ref --format='%(refname)' refs/remotes/ | wc -l)"
          if [[ "$remote_count" -ne 0 || "$remote_ref_count" -ne 0 ]]; then
            printf '%s\n' "checkout still exposes remotes or remote-tracking refs" >&2
            exit 1
          fi
          head_sha="$(git -C "$CHECKOUT_PATH" rev-parse HEAD)"
          base_sha="$(git -C "$CHECKOUT_PATH" rev-parse HEAD^1)"
          test -n "$head_sha"
          test -n "$base_sha"

      - name: Fail closed when merge result is unavailable
        if: always() && steps.checkout-merge.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "cannot check out GitHub merge ref refs/pull/${{ github.event.pull_request.number }}/merge; conflicted pull requests have no merge result, so theory ingest fails closed" >&2
          exit 1

      - name: Resolve checked merge result's dev parent
        id: base
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git -C candidate rev-parse HEAD^1)"
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Install pinned SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: candidate/global.json

      - name: Resolve candidate canonical Lean report address
        id: lean-report-input
        shell: bash
        run: |
          set -euo pipefail
          helper="$GITHUB_WORKSPACE/candidate/tools/scripts/report/lean-report-input.sh"
          test -x "$helper"
          read -r address producer_sha256 sources_sha256 config_sha256 \
            <<< "$("$helper" address --repository "$GITHUB_WORKSPACE/candidate")"
          [[ "$address" =~ ^[0-9a-f]{64}$ ]]
          [[ "$producer_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$sources_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$config_sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "address=$address" >> "$GITHUB_OUTPUT"
          echo "sources_sha256=$sources_sha256" >> "$GITHUB_OUTPUT"
          echo "config_sha256=$config_sha256" >> "$GITHUB_OUTPUT"

      - name: Restore candidate canonical Lean report
        id: lean-report-cache
        uses: actions/cache/restore@v4
        with:
          path: .canonical-lean-report-cache
          key: stratalint-canonical-lean-report-v2-${{ steps.lean-report-input.outputs.address }}

      - name: Restore elan and pinned Lean toolchain cache on cache miss
        if: steps.lean-report-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-${{ runner.arch }}-elan-${{ hashFiles('candidate/lean-toolchain') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-elan-

      - name: Install pinned Lean toolchain on cache miss
        if: steps.lean-report-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -x "$HOME/.elan/bin/elan" ]]; then
            curl --proto '=https' --tlsv1.2 -sSf https://elan.lean-lang.org/elan-init.sh \
              | sh -s -- -y --default-toolchain none
          fi
          toolchain="$(tr -d '\r\n' < candidate/lean-toolchain)"
          test -n "$toolchain"
          if ! "$HOME/.elan/bin/elan" toolchain list 2>/dev/null | grep -qF "$toolchain"; then
            "$HOME/.elan/bin/elan" toolchain install "$toolchain"
          fi
          "$HOME/.elan/bin/elan" default "$toolchain"
          "$HOME/.elan/bin/lake" --version

      - name: Restore candidate Lean dependency artifacts on cache miss
        id: lake-deps-cache
        if: steps.lean-report-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            candidate/.lake/packages
            candidate/.lake/config
            candidate/.lake/.stratalint-lean-cache-stamp.json
            ~/.cache/mathlib
          key: ${{ runner.os }}-${{ runner.arch }}-lake-deps-v1-${{ steps.lean-report-input.outputs.config_sha256 }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-lake-deps-v1-${{ steps.lean-report-input.outputs.config_sha256 }}

      - name: Restore candidate Lean build artifacts on cache miss
        id: lake-build-cache
        if: steps.lean-report-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: candidate/.lake/build
          key: ${{ runner.os }}-${{ runner.arch }}-lake-build-v1-${{ steps.lean-report-input.outputs.config_sha256 }}-${{ steps.lean-report-input.outputs.sources_sha256 }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-lake-build-v1-${{ steps.lean-report-input.outputs.config_sha256 }}-

      - name: Produce candidate canonical Lean report on cache miss
        if: steps.lean-report-cache.outputs.cache-hit != 'true'
        # Budget basis: 895s measured cold build; 30m step = 2.01x, 36m job = 30m + 4x the measured 1.2m remainder.
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          export PATH="$HOME/.elan/bin:$PATH"
          make lean-report

      - name: Install and verify candidate canonical Lean report
        shell: bash
        run: |
          set -euo pipefail
          source="$GITHUB_WORKSPACE/.canonical-lean-report-cache/raw-lean-report.json"
          report="$GITHUB_WORKSPACE/candidate/.lake/build/stratalint/raw-lean-report.json"
          if [[ "${{ steps.lean-report-cache.outputs.cache-hit }}" == "true" ]]; then
            mkdir -p "$(dirname "$report")"
            for suffix in '' .sha256 .input.attestation .provenance.json; do
              test -s "${source}${suffix}"
              cp "${source}${suffix}" "${report}${suffix}"
            done
          fi
          for suffix in '' .sha256 .input.attestation .provenance.json; do
            test -s "${report}${suffix}"
          done
          "$GITHUB_WORKSPACE/candidate/tools/scripts/report/lean-report-input.sh" verify \
            --repository "$GITHUB_WORKSPACE/candidate" \
            --report "$report"
          printf '%s\n' \
            "Lean report input address: sha256:${{ steps.lean-report-input.outputs.address }}" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Run ingest with checked dev parent SHA
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          make ingest BASE=${{ steps.base.outputs.sha }}

      - name: Produce declared-write-set proposal
        shell: bash
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/candidate/tools/scripts/workflow/theory-ingest-closure.sh" \
            propose \
            "$GITHUB_WORKSPACE/candidate" \
            "${{ steps.base.outputs.sha }}" \
            "$GITHUB_WORKSPACE/proposal/theory-ingest.patch"

      - name: Upload untrusted ingest proposal
        uses: actions/upload-artifact@v4
        with:
          name: theory-ingest-proposal
          path: proposal/theory-ingest.patch
          if-no-files-found: error
          retention-days: 1

  writeback:
    name: Authorize and write back theory ingest closure
    needs: propose
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 36
    steps:
      - name: Reject fork pull requests
        shell: bash
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]]; then
            printf '%s\n' "fork pull requests cannot receive theory ingest writeback" >&2
            exit 1
          fi

      - name: Check out pinned base producer
        id: checkout-trusted
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 2
          persist-credentials: true

      - name: Strip checkout remote state
        if: steps.checkout-trusted.outcome == 'success'
        shell: bash
        env:
          CHECKOUT_PATH: trusted
        run: |
          set -euo pipefail
          git -C "$CHECKOUT_PATH" remote remove origin
          git -C "$CHECKOUT_PATH" for-each-ref --format='delete %(refname)' refs/remotes/ |
            git -C "$CHECKOUT_PATH" update-ref --stdin
          remote_count="$(git -C "$CHECKOUT_PATH" remote | wc -l)"
          remote_ref_count="$(git -C "$CHECKOUT_PATH" for-each-ref --format='%(refname)' refs/remotes/ | wc -l)"
          if [[ "$remote_count" -ne 0 || "$remote_ref_count" -ne 0 ]]; then
            printf '%s\n' "checkout still exposes remotes or remote-tracking refs" >&2
            exit 1
          fi
          head_sha="$(git -C "$CHECKOUT_PATH" rev-parse HEAD)"
          base_sha="$(git -C "$CHECKOUT_PATH" rev-parse HEAD^1)"
          test -n "$head_sha"
          test -n "$base_sha"

      - name: Check out candidate theory as data
        id: checkout-candidate-data
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate-data
          sparse-checkout: docs/develop/theory
          sparse-checkout-cone-mode: false
          fetch-depth: 0
          persist-credentials: false

      - name: Strip checkout remote state
        if: steps.checkout-candidate-data.outcome == 'success'
        shell: bash
        env:
          CHECKOUT_PATH: candidate-data
        run: |
          set -euo pipefail
          git -C "$CHECKOUT_PATH" remote remove origin
          git -C "$CHECKOUT_PATH" for-each-ref --format='delete %(refname)' refs/remotes/ |
            git -C "$CHECKOUT_PATH" update-ref --stdin
          remote_count="$(git -C "$CHECKOUT_PATH" remote | wc -l)"
          remote_ref_count="$(git -C "$CHECKOUT_PATH" for-each-ref --format='%(refname)' refs/remotes/ | wc -l)"
          if [[ "$remote_count" -ne 0 || "$remote_ref_count" -ne 0 ]]; then
            printf '%s\n' "checkout still exposes remotes or remote-tracking refs" >&2
            exit 1
          fi
          head_sha="$(git -C "$CHECKOUT_PATH" rev-parse HEAD)"
          base_sha="$(git -C "$CHECKOUT_PATH" rev-parse HEAD^1)"
          test -n "$head_sha"
          test -n "$base_sha"

      - name: Install pinned SDK from trusted base
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: trusted/global.json

      - name: Install pinned Lean toolchain from trusted base
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -x "$HOME/.elan/bin/elan" ]]; then
            curl --proto '=https' --tlsv1.2 -sSf https://elan.lean-lang.org/elan-init.sh \
              | sh -s -- -y --default-toolchain none
          fi
          toolchain="$(tr -d '\r\n' < trusted/lean-toolchain)"
          test -n "$toolchain"
          if ! "$HOME/.elan/bin/elan" toolchain list 2>/dev/null | grep -qF "$toolchain"; then
            "$HOME/.elan/bin/elan" toolchain install "$toolchain"
          fi
          "$HOME/.elan/bin/elan" default "$toolchain"
          "$HOME/.elan/bin/lake" --version

      - name: Build trusted producer
        shell: bash
        run: |
          set -euo pipefail
          dotnet build trusted/tools/StrataLint.sln -c Release --warnaserror

      - name: Produce trusted canonical Lean report
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          cd trusted
          export PATH="$HOME/.elan/bin:$PATH"
          make lean-report

      - name: Download untrusted ingest proposal
        uses: actions/download-artifact@v4
        with:
          name: theory-ingest-proposal
          path: proposal

      - name: Recompute, authorize, and write back
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
          REMOTE_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          [[ "$HEAD_REPOSITORY" == "$BASE_REPOSITORY" ]]
          "$GITHUB_WORKSPACE/trusted/tools/scripts/workflow/theory-ingest-closure.sh" \
            writeback \
            "$GITHUB_WORKSPACE/trusted" \
            "$GITHUB_WORKSPACE/candidate-data" \
            "$GITHUB_WORKSPACE/proposal/theory-ingest.patch" \
            "$BASE_SHA" \
            "$HEAD_SHA" \
            "$HEAD_REF" \
            "$REMOTE_URL"
