# 理论卷自动摄入:PR 触碰 docs/develop/theory/** 时,以 base 侧法官跑 make ingest,
# 随后由 base 侧闭合判据检查候选树;法官覆盖的 harness/构建元数据路径从判定中排除。
# 不回写 echo residual 投影:它是允许陈旧的人读快照(CLAUDE.md 第〇节),按需由
# `make echo-residual-summary` 重发,消费者应调 producer 现算而非读仓内分片。
name: theory-ingest

on:
  pull_request_target:
    branches: [dev]
    paths:
      - 'docs/develop/theory/**'

permissions:
  actions: read
  contents: read

concurrency:
  group: theory-ingest-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-ingest:
    name: Auto-ingest theory volumes
    runs-on: ubuntu-latest
    timeout-minutes: 36
    env:
      THEORY_INGEST_OVERLAY_PATHS: |-
        Meta/StrataLint
        Makefile
        global.json
    steps:
      - name: Check out base (judge code)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: judge
          persist-credentials: false

      - name: Check out PR head (data + commit target)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: judge/global.json

      - name: Overlay judge harness onto candidate data
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t overlay_paths <<< "$THEORY_INGEST_OVERLAY_PATHS"
          for path in "${overlay_paths[@]}"; do
            source="$GITHUB_WORKSPACE/judge/$path"
            destination="$GITHUB_WORKSPACE/candidate/$path"
            if [ -d "$source" ]; then
              mkdir -p "$destination"
              rsync -a --delete "$source/" "$destination"
            else
              mkdir -p "$(dirname "$destination")"
              cp "$source" "$destination"
            fi
          done

      - name: Resolve base canonical Lean report address
        id: lean-report-input
        shell: bash
        run: |
          set -euo pipefail
          helper="$GITHUB_WORKSPACE/candidate/Meta/StrataLint/scripts/report/lean-report-input.sh"
          test -x "$helper"
          read -r address _ <<< "$("$helper" address --repository "$GITHUB_WORKSPACE/candidate")"
          [[ "$address" =~ ^[0-9a-f]{64}$ ]]
          echo "address=$address" >> "$GITHUB_OUTPUT"

      - name: Restore base canonical Lean report
        id: lean-report-cache
        uses: actions/cache/restore@v4
        with:
          path: .canonical-lean-report-cache
          key: stratalint-canonical-lean-report-v2-${{ steps.lean-report-input.outputs.address }}

      - name: Restore elan and pinned Lean toolchain cache on cache miss
        if: steps.lean-report-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-${{ runner.arch }}-elan-${{ hashFiles('candidate/lean-toolchain') }}

      - name: Install pinned Lean toolchain on cache miss
        if: steps.lean-report-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -x "$HOME/.elan/bin/elan" ]]; then
            curl --proto '=https' --tlsv1.2 -sSf https://elan.lean-lang.org/elan-init.sh \
              | sh -s -- -y --default-toolchain none
          fi
          toolchain="$(tr -d '\r\n' < candidate/lean-toolchain)"
          test -n "$toolchain"
          if ! "$HOME/.elan/bin/elan" toolchain list 2>/dev/null | grep -qF "$toolchain"; then
            "$HOME/.elan/bin/elan" toolchain install "$toolchain"
          fi
          "$HOME/.elan/bin/elan" default "$toolchain"
          "$HOME/.elan/bin/lake" --version

      - name: Restore candidate Lean build artifacts on cache miss
        if: steps.lean-report-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            candidate/.lake
            ~/.cache/mathlib
          key: ${{ runner.os }}-${{ runner.arch }}-lake-${{ hashFiles('candidate/lake-manifest.json', 'candidate/lean-toolchain') }}-${{ github.event.pull_request.head.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-lake-${{ hashFiles('candidate/lake-manifest.json', 'candidate/lean-toolchain') }}-

      - name: Produce base canonical Lean report on cache miss
        if: steps.lean-report-cache.outputs.cache-hit != 'true'
        # Budget basis: 895s measured cold build; 30m step = 2.01x, 36m job = 30m + 4x the measured 1.2m remainder.
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          export PATH="$HOME/.elan/bin:$PATH"
          make lean-report

      - name: Install and verify base canonical Lean report
        shell: bash
        run: |
          set -euo pipefail
          source="$GITHUB_WORKSPACE/.canonical-lean-report-cache/raw-lean-report.json"
          report="$GITHUB_WORKSPACE/candidate/.lake/build/stratalint/raw-lean-report.json"
          consumer="$GITHUB_WORKSPACE/candidate/Meta/StrataLint/scripts/report/report-consumer.sh"
          if [[ "${{ steps.lean-report-cache.outputs.cache-hit }}" == "true" ]]; then
            mkdir -p "$(dirname "$report")"
            while IFS= read -r suffix; do
              test -s "${source}${suffix}"
              cp "${source}${suffix}" "${report}${suffix}"
            done < <("$consumer" --bundle-suffixes)
          fi
          while IFS= read -r suffix; do
            test -s "${report}${suffix}"
          done < <("$consumer" --bundle-suffixes)
          "$GITHUB_WORKSPACE/candidate/Meta/StrataLint/scripts/report/lean-report-input.sh" verify \
            --repository "$GITHUB_WORKSPACE/candidate" \
            --report "$report"
          printf '%s\n' \
            "Lean report input address: sha256:${{ steps.lean-report-input.outputs.address }}" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Run ingest with base judge
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          make ingest BASE=HEAD

      - name: Enforce theory ingest closure
        shell: bash
        run: |
          set -euo pipefail
          closure_args=("$GITHUB_WORKSPACE/candidate")
          mapfile -t overlay_paths <<< "$THEORY_INGEST_OVERLAY_PATHS"
          for path in "${overlay_paths[@]}"; do
            closure_args+=(--exclude "$path")
          done
          "$GITHUB_WORKSPACE/judge/Meta/StrataLint/scripts/workflow/theory-ingest-closure.sh" \
            "${closure_args[@]}"
