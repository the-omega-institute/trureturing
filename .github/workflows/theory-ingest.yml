# 理论卷自动摄入:PR 触碰 docs/develop/theory/** 时,以 base 侧法官跑 make ingest,
# 产生的账本对齐(仅 Meta/BACKFILL.yaml + Meta/Digestion/atoms/**)bot-commit 回 PR 分支。
# 信任拓扑:代码=base 侧(pull_request_target),PR 侧仅理论卷数据输入;写路径白名单硬校验。
name: theory-ingest

on:
  pull_request_target:
    branches: [dev]
    paths:
      - 'docs/develop/theory/**'

permissions:
  actions: read
  contents: write

concurrency:
  group: theory-ingest-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-ingest:
    name: Auto-ingest theory volumes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out base (judge code)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: judge
          persist-credentials: false

      - name: Check out PR head (data + commit target)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce candidate data-only boundary
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git -C candidate rev-parse HEAD)"
          test "$actual" = "$HEAD_SHA"
          if ! git -C candidate cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git -C candidate fetch --no-tags "$GITHUB_WORKSPACE/judge" "$BASE_SHA"
          fi
          bad=()
          while IFS= read -r -d '' path; do
            case "$path" in
              docs/develop/theory/*|Meta/BACKFILL.yaml|Meta/Digestion/atoms/*) ;;
              *) bad+=("$path") ;;
            esac
          done < <(git -C candidate diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA")
          if [[ "${#bad[@]}" -ne 0 ]]; then
            printf '::error::theory ingest refuses non-data candidate path: %s\n' "${bad[@]}"
            exit 1
          fi

      - name: Install pinned SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: judge/global.json

      - name: Overlay judge harness onto candidate data
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete judge/Meta/StrataLint/ candidate/Meta/StrataLint/
          cp judge/Makefile judge/global.json candidate/

      - name: Resolve base canonical Lean report address
        id: lean-report-input
        shell: bash
        run: |
          set -euo pipefail
          helper="$GITHUB_WORKSPACE/candidate/Meta/StrataLint/scripts/report/lean-report-input.sh"
          test -x "$helper"
          read -r address _ <<< "$("$helper" address --repository "$GITHUB_WORKSPACE/candidate")"
          [[ "$address" =~ ^[0-9a-f]{64}$ ]]
          echo "address=$address" >> "$GITHUB_OUTPUT"

      - name: Restore base canonical Lean report
        id: lean-report-cache
        uses: actions/cache/restore@v4
        with:
          path: .canonical-lean-report-cache
          key: stratalint-canonical-lean-report-v1-${{ steps.lean-report-input.outputs.address }}
          fail-on-cache-miss: true

      - name: Install and verify base canonical Lean report
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.lean-report-cache.outputs.cache-hit }}" = "true"
          source="$GITHUB_WORKSPACE/.canonical-lean-report-cache/raw-lean-report.json"
          report="$GITHUB_WORKSPACE/candidate/.lake/build/stratalint/raw-lean-report.json"
          mkdir -p "$(dirname "$report")"
          for suffix in '' .sha256 .input.attestation .provenance.json; do
            test -s "${source}${suffix}"
            cp "${source}${suffix}" "${report}${suffix}"
          done
          "$GITHUB_WORKSPACE/candidate/Meta/StrataLint/scripts/report/lean-report-input.sh" verify \
            --repository "$GITHUB_WORKSPACE/candidate" \
            --report "$report"
          printf '%s\n' \
            "Lean report input address: sha256:${{ steps.lean-report-input.outputs.address }}" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Run ingest with base judge
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          make ingest BASE=HEAD

      - name: Enforce write-path whitelist and commit back
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd candidate
          git restore --source=HEAD -- Meta/StrataLint Makefile global.json || true
          git clean -fd -- Meta/StrataLint
          changed="$(git status --porcelain)"
          if [ -z "$changed" ]; then echo "ingest no-op"; exit 0; fi
          bad="$(git status --porcelain | grep -vE '^.. (Meta/BACKFILL\.yaml|Meta/Digestion/atoms/)' || true)"
          if [ -n "$bad" ]; then
            echo "::error::ingest touched paths outside whitelist:"; echo "$bad"; exit 1
          fi
          git config user.name "theory-ingest-bot"
          git config user.email "theory-ingest-bot@users.noreply.github.com"
          git add Meta/BACKFILL.yaml Meta/Digestion/atoms
          git commit -m "chore(digestion): auto-ingest theory update [theory-ingest-bot]"
          gh auth setup-git
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
