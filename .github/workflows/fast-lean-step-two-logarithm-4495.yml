name: fast-lean-step-two-logarithm-4495

on:
  push:
    branches:
      - tmp/finalize-step-two-logarithm-4495

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: lane/math/step-two-chronological-logarithm
      - name: Install Lean
        run: tools/scripts/workflow/install-lean-toolchain.sh lean-toolchain --github-path "$GITHUB_PATH"
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Compile logarithm owner
        run: lake build D5.S3.Observer.Chronology.StepTwoChronologicalLogarithm
