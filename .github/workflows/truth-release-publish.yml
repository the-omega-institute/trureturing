name: DAG and truth release

on:
  schedule:
    - cron: '17 2 * * *'
  repository_dispatch:
    types: [publish-truth-release]

permissions: {}

# Inspector and Scribe follow the source pin. The publisher has its own revision.
env:
  TRUTH_TOOLS_COMMIT: de3688f9bd17c65f7bce8759d9df345dc03bdb69

concurrency:
  group: truth-release-publish-dev
  cancel-in-progress: false

jobs:
  pin:
    if: github.repository == 'the-omega-institute/trureturing' && github.ref == 'refs/heads/dev' && github.ref_protected
    runs-on: ubuntu-24.04-arm
    permissions:
      actions: read
      contents: read
    outputs:
      source: ${{ steps.pin.outputs.source }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: /.github/actions/lean-cache-shards/pin-source.py
          persist-credentials: false
      - name: Pin the published source
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/actions/lean-cache-shards/pin-source.py --published
      - if: steps.pin.outputs.upload == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: generation-pin-${{ github.run_id }}
          path: ${{ runner.temp }}/pin/source
          if-no-files-found: error

  build:
    needs: pin
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      existing: ${{ steps.reports.outputs.existing }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.pin.outputs.source }}
          persist-credentials: false
      - name: Check out the workflow's report reader
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: truth-workflow
          sparse-checkout-cone-mode: false
          sparse-checkout: /.github/scripts/read-module-reports.py
          persist-credentials: false
      - name: Select the previous Truth release
        id: reports
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ needs.pin.outputs.source }}
        run: |
          python3 -B truth-workflow/.github/scripts/read-module-reports.py select "$SOURCE" "$RUNNER_TEMP/truth-selection.json"
      - name: Check out the fixed truth release tools
        if: steps.reports.outputs.existing == ''
        uses: actions/checkout@v5
        with:
          repository: the-omega-institute/trureturing-tools
          ref: ${{ env.TRUTH_TOOLS_COMMIT }}
          path: truth-tools
          persist-credentials: false
      - name: Install the tools pinned by the source
        if: steps.reports.outputs.existing == ''
        run: make install-tools
      - name: Read compatible predecessor rows and current module ZIPs
        if: steps.reports.outputs.existing == ''
        env:
          MODULE_RELEASE: ${{ format('lean-modules-{0}', needs.pin.outputs.source) }}
        run: |
          python3 -B truth-workflow/.github/scripts/read-module-reports.py \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download" "$MODULE_RELEASE" \
            "$GITHUB_WORKSPACE/.lake/build/lean-inspector/modules" --previous-bundle "$RUNNER_TEMP/truth-base" \
            --selection "$RUNNER_TEMP/truth-selection.json"
          if [[ -f "$RUNNER_TEMP/truth-base/reuse.json" ]]; then
            base=$(jq -er '.source_commit | select(test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/truth-base/truth-release-publication.v1.json")
            if ! git cat-file -e "$base^{tree}" 2>/dev/null; then
              git fetch --no-tags --depth=1 --filter=blob:none origin "$base"
            fi
          fi
      - if: steps.reports.outputs.existing == ''
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore Scribe resource inputs
        if: steps.reports.outputs.existing == ''
        id: scribe-cache
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/truth-scribe
          key: truth-scribe-v1-${{ needs.pin.outputs.source }}
          restore-keys: truth-scribe-v1-
      - name: Generate and package the DAG and truth release
        id: generate
        if: steps.reports.outputs.existing == ''
        env:
          TRUTH_RELEASE_BASE: ${{ runner.temp }}/truth-base
          TRUTH_RELEASE_SCRIBE_CACHE: ${{ runner.temp }}/truth-scribe
        run: bash "$GITHUB_WORKSPACE/truth-tools/.github/scripts/truth_release/build.sh" "$RUNNER_TEMP/truth-assets"
      - name: Save the prepared Scribe resources
        if: steps.generate.outputs.scribe_cache_ready == 'true' && steps.scribe-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/truth-scribe
          key: truth-scribe-v1-${{ needs.pin.outputs.source }}
      - id: upload
        if: steps.reports.outputs.existing == ''
        uses: actions/upload-artifact@v6
        with:
          name: truth-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/truth-assets/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: needs.build.outputs.existing == ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out the fixed truth release tools
        uses: actions/checkout@v5
        with:
          repository: the-omega-institute/trureturing-tools
          ref: ${{ env.TRUTH_TOOLS_COMMIT }}
          path: truth-tools
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/truth-assets
          merge-multiple: true
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6
        with:
          version: 1.3.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the truth bundle to GHCR
        id: oci
        run: python3 truth-tools/.github/scripts/truth_release/publish.py oci "$RUNNER_TEMP/truth-assets"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-name: ghcr.io/the-omega-institute/trureturing/truth-release
          subject-digest: ${{ steps.oci.outputs.digest }}
          push-to-registry: true
      - name: Publish DAG.md and the truth bundle to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          REFERENCE: ${{ steps.oci.outputs.reference }}
        run: python3 truth-tools/.github/scripts/truth_release/publish.py mirror "$RUNNER_TEMP/truth-assets" "$REFERENCE"
