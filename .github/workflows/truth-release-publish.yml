name: truth-release-publish

on:
  schedule:
    - cron: '17 * * * *'
  # repository_dispatch always runs the workflow definition from the DEFAULT branch and
  # carries no ref selector, so a caller cannot execute a modified workflow definition
  # from an attacker-controlled ref. It carries no source_commit input either:
  # the produce job still resolves the current protected dev tip and walk-backs to the
  # newest gate-verified commit, identical to the scheduled path. It exists only so an
  # operator can force a publish when GitHub's scheduler is delayed.
  repository_dispatch:
    types: [publish-truth-release]
permissions: {}
concurrency:
  group: truth-release-publish-dev
  cancel-in-progress: false

# Truth releases are ordered by dev history: a release is newer exactly when its
# source_commit is a descendant. Consumers must never use wall-clock publication order.

jobs:
  produce:
    name: produce verified truth-release inputs
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.release.outputs.artifact_name }}
      artifact_id: ${{ steps.transfer.outputs.artifact-id }}
      artifact_digest: ${{ steps.transfer.outputs.artifact-digest }}
      release_digest: ${{ steps.release.outputs.release_digest }}
      run_attempt: ${{ steps.release.outputs.run_attempt }}
      source_commit: ${{ steps.source.outputs.source_commit }}
      source_tree: ${{ steps.identity.outputs.source_tree }}
      publish_ready: ${{ steps.source.outputs.publish_ready }}
    env:
      REQUIRED_CHECKS: 'Candidate harness engineering checks|Canonical Lean report production|Content-addressed dev baseline admission'
    steps:
      - name: Resolve protected dev and wait for required gates
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="$(gh api "repos/${GITHUB_REPOSITORY}/branches/dev")"
          [[ "$(jq -r '.protected' <<< "$branch")" == 'true' ]] \
            || { printf '%s\n' 'dev is not protected; refusing to publish' >&2; exit 1; }
          IFS='|' read -r -a required_checks <<< "$REQUIRED_CHECKS"
          # Pick the most recent protected-dev commit whose required gates are all green.
          # This survives dev churn: rather than betting on one specific tip (whose gates may
          # still be running, or may have failed), scan recent dev history newest-first and
          # publish the newest already gate-verified commit. Every scheduled run makes progress
          # without depending on the state of a single commit; provenance stays bound to the
          # exact gate-verified source_commit chosen here.
          recent_shas="$(gh api "repos/${GITHUB_REPOSITORY}/commits?sha=dev&per_page=40" --jq '.[].sha')"
          source_commit=''
          for candidate in $recent_shas; do
            [[ "$candidate" =~ ^[0-9a-f]{40}$ ]] || continue
            checks="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${candidate}/check-runs?per_page=100" --jq '.check_runs')"
            candidate_green=true
            for required in "${required_checks[@]}"; do
              conclusion="$(jq -r --arg name "$required" '[.[] | select(.name == $name and .status == "completed") | .conclusion] | if length == 0 then "missing" else .[0] end' <<< "$checks")"
              [[ "$conclusion" == "success" ]] || { candidate_green=false; break; }
            done
            if [[ "$candidate_green" == true ]]; then
              source_commit="$candidate"
              break
            fi
          done
          if [[ -z "$source_commit" ]]; then
            printf '%s\n' 'no recent protected dev commit has all required gates green yet; leaving publication for the next scheduled run'
            printf 'publish_ready=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'selected gate-verified source_commit=%s\n' "$source_commit"
          printf 'source_commit=%s\n' "$source_commit" >> "$GITHUB_OUTPUT"
          printf 'publish_ready=true\n' >> "$GITHUB_OUTPUT"

      - name: Check out the exact protected dev tip
        id: checkout
        if: steps.source.outputs.publish_ready == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.source.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Strip checkout remote state
        if: steps.checkout.outcome == 'success'
        shell: bash
        env:
          CHECKOUT_PATH: .
        run: |
          set -euo pipefail
          git -C "$CHECKOUT_PATH" remote remove origin
          git -C "$CHECKOUT_PATH" for-each-ref --format='delete %(refname)' refs/remotes/ |
            git -C "$CHECKOUT_PATH" update-ref --stdin
          remote_count="$(git -C "$CHECKOUT_PATH" remote | wc -l)"
          remote_ref_count="$(git -C "$CHECKOUT_PATH" for-each-ref --format='%(refname)' refs/remotes/ | wc -l)"
          if [[ "$remote_count" -ne 0 || "$remote_ref_count" -ne 0 ]]; then
            printf '%s\n' "checkout still exposes remotes or remote-tracking refs" >&2
            exit 1
          fi
          head_sha="$(git -C "$CHECKOUT_PATH" rev-parse HEAD)"
          base_sha="$(git -C "$CHECKOUT_PATH" rev-parse HEAD^1)"
          test -n "$head_sha"
          test -n "$base_sha"

      - name: Verify checked-out protected dev identity
        id: identity
        if: steps.source.outputs.publish_ready == 'true'
        env:
          RESOLVED_SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          source_tree="$(git cat-file -p HEAD | sed -n 's/^tree //p')"
          if git symbolic-ref -q HEAD >/dev/null; then
            printf '%s\n' 'protected dev source must be checked out detached' >&2
            exit 1
          fi
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$source_tree" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$source_commit" != "$RESOLVED_SOURCE_COMMIT" ]]; then
            printf '%s\n' 'checked out commit is not the resolved protected dev tip' >&2
            exit 1
          fi
          printf 'source_tree=%s\n' "$source_tree" >> "$GITHUB_OUTPUT"
          printf 'commit_on_protected_dev=true\n' >> "$GITHUB_OUTPUT"

      - name: Set up pinned .NET SDK
        if: steps.source.outputs.publish_ready == 'true'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Install the pinned Lean toolchain
        if: steps.source.outputs.publish_ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tools/scripts/workflow/install-lean-toolchain.sh lean-toolchain --github-path "$GITHUB_PATH"

      - name: Warm the Lean dependency cache
        if: steps.source.outputs.publish_ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get || printf '%s\n' 'mathlib cache get missed; lake build/report will fill remaining dependencies'
          make lean-cache-from-github-without-mathlib \
            || printf '%s\n' 'repository Lean build cache was unavailable; canonical report production will fill remaining dependencies'

      # The publish producer only needs the canonical Lean report for the selected
      # gate-verified commit. That commit already passed the "Canonical Lean report
      # production" gate on its dev push, which content-addresses and caches the report
      # under stratalint-canonical-lean-report-v2-<address>. Reuse it here instead of
      # re-running the whole-tree `make lean-report` (which does not finish in the
      # runner window). If the cache misses or fails to verify, fall through to the
      # full production path below, so this is a pure speed-up, never a trust weakening.
      - name: Resolve canonical Lean report address
        id: lean-report-input
        if: steps.source.outputs.publish_ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          helper="$GITHUB_WORKSPACE/tools/scripts/report/lean-report-input.sh"
          test -x "$helper"
          # Only reuse the cached report when the producer closure is COMPLETELY
          # discovered. If discovery degrades (the address then embeds an
          # `unavailable:candidate` marker over a declared-only producer set), a
          # changed-but-omitted producer source could retain the cache key, so we
          # refuse reuse and fall through to full production. The producer-paths and
          # scribe-producer-paths subcommands exit non-zero when the closure is
          # incomplete, giving us a fail-closed gate on the reuse path.
          closure_complete=true
          "$helper" producer-paths --repository "$GITHUB_WORKSPACE" >/dev/null 2>&1 \
            && "$helper" scribe-producer-paths --repository "$GITHUB_WORKSPACE" >/dev/null 2>&1 \
            || closure_complete=false
          echo "closure_complete=$closure_complete" >> "$GITHUB_OUTPUT"
          read -r address producer_sha256 sources_sha256 config_sha256 \
            <<< "$("$helper" address --repository "$GITHUB_WORKSPACE")"
          [[ "$address" =~ ^[0-9a-f]{64}$ ]]
          echo "address=$address" >> "$GITHUB_OUTPUT"

      - name: Restore canonical Lean report by input address
        id: report-cache
        if: steps.source.outputs.publish_ready == 'true' && steps.lean-report-input.outputs.closure_complete == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .canonical-lean-report-cache
          key: stratalint-canonical-lean-report-v2-${{ steps.lean-report-input.outputs.address }}
          restore-keys: stratalint-canonical-lean-report-v2-

      - name: Serve the canonical Lean report from the cached address
        id: report-reuse
        if: steps.source.outputs.publish_ready == 'true' && steps.lean-report-input.outputs.closure_complete == 'true' && steps.report-cache.outputs.cache-hit == 'true'
        # A cache serve failure must fall back to full production, not fail the job.
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          source="$GITHUB_WORKSPACE/.canonical-lean-report-cache/raw-lean-report.json"
          for suffix in '' .sha256 .input.attestation .provenance.json .materials.zip; do
            test -s "${source}${suffix}"
          done
          # Re-verify the cached report against the checked-out tree; mismatch falls back.
          "$GITHUB_WORKSPACE/tools/scripts/report/lean-report-input.sh" verify \
            --repository "$GITHUB_WORKSPACE" --report "$source"
          served="$RUNNER_TEMP/canonical-lean-report/raw-lean-report.json"
          mkdir -p "$RUNNER_TEMP/canonical-lean-report"
          for suffix in '' .sha256 .input.attestation .provenance.json .materials.zip; do
            cp "${source}${suffix}" "${served}${suffix}"
          done
          printf 'path=%s\n' "$served" >> "$GITHUB_OUTPUT"
          printf '%s\n' 'canonical Lean report served from cached input address' >> "$GITHUB_STEP_SUMMARY"

      - name: Produce the canonical Lean report
        id: report
        if: steps.source.outputs.publish_ready == 'true' && steps.report-reuse.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          make lean-report
          report="$GITHUB_WORKSPACE/.lake/build/stratalint/raw-lean-report.json"
          test -s "$report"
          tools/scripts/report/lean-report-input.sh verify \
            --repository "$GITHUB_WORKSPACE" --report "$report"
          printf 'path=%s\n' "$report" >> "$GITHUB_OUTPUT"

      - name: Assemble the real seven-artifact truth-release
        id: release
        if: steps.source.outputs.publish_ready == 'true'
        env:
          COMMIT_ON_PROTECTED_DEV: ${{ steps.identity.outputs.commit_on_protected_dev }}
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          SOURCE_TREE: ${{ steps.identity.outputs.source_tree }}
          REPORT_PATH: ${{ steps.report-reuse.outputs.path || steps.report.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/truth-release-bundle"
          rm -rf "$bundle"
          mkdir -p "$bundle"
          [[ "$COMMIT_ON_PROTECTED_DEV" == 'true' ]] \
            || { printf '%s\n' 'protected-dev provenance was not established' >&2; exit 1; }
          dotnet restore tools/StrataLint.Cli/StrataLint.Cli.csproj --locked-mode
          # Build the producer explicitly (visible progress) so a slow/hanging build target is
          # diagnosable, then run without rebuilding. `dotnet run` was building this from scratch
          # inside the step and being killed silently after a few minutes.
          dotnet build tools/StrataLint.Cli/StrataLint.Cli.csproj \
            --configuration Release --no-restore -v minimal
          commit_epoch="$(git show -s --format=%ct HEAD)"
          [[ "$commit_epoch" =~ ^[0-9]+$ ]]
          produced_at="$(date -u --date="@${commit_epoch}" +%Y-%m-%dT%H:%M:%SZ)"
          # PROBE: TRDIAG showed the producer exhausts memory (MemAvailable 9GB -> ~176MB,
          # swap 100%) while the dotnet RSS stays <200MB, so the memory sink is outside the
          # managed heap. truth-release materializes the whole repo and re-runs the full
          # Scribe emit under Path.GetTempPath(); if that path is a RAM-backed tmpfs the
          # temp writes consume RAM. Redirect .NET's temp dir to the large real-disk
          # RUNNER_TEMP, and sample /tmp + /dev/shm so this run confirms whether the
          # default temp was tmpfs and whether the redirect stops the collapse.
          export TMPDIR="$RUNNER_TEMP"
          printf 'TRDIAG tmp_mounts /tmp=[%s] shm=[%s] RUNNER_TEMP=[%s]\n' \
            "$(df -h /tmp 2>/dev/null | awk 'NR==2{print $1" size="$2" avail="$4}')" \
            "$(df -h /dev/shm 2>/dev/null | awk 'NR==2{print $1" size="$2" avail="$4}')" \
            "$(df -h "$RUNNER_TEMP" 2>/dev/null | awk 'NR==2{print $1" size="$2" avail="$4}')"
          # TRDIAG (temporary): the producer is silently cancelled a few minutes into
          # this run with no workflow timeout; local measurement has refuted host-level
          # OOM (~1GB RSS) and disk exhaustion (~342MB materialized snapshot). Stream a
          # comprehensive resource sample every 3s (each line is flushed to the live log,
          # so the trajectory survives a step kill) covering the signals a runner-level
          # cancel would come from: cgroup memory + OOM-kill events, MemAvailable/swap,
          # the target dotnet process's own RSS/threads/open-fds, and disk+inodes on both
          # the RUNNER_TEMP and workspace mounts. Also capture the real dotnet exit code,
          # preserving the step's failure semantics.
          # The sampler runs with `set +e` and no pipefail so that a probe that fails
          # (e.g. pgrep finding no match before dotnet starts) never terminates it.
          ( set +e +o pipefail
            while true; do
              # Pick the highest-RSS dotnet process (the launched app, not the `dotnet
              # run` wrapper) so per-process figures track the real workload.
              dpid="$(ps -C dotnet -o pid=,rss= 2>/dev/null | sort -k2 -n | awk 'END{print $1}')"
              if [ -n "${dpid}" ] && [ -r "/proc/${dpid}/status" ]; then
                drss="$(awk '/VmRSS/{print $2"kB"}' "/proc/${dpid}/status" 2>/dev/null)"
                dthr="$(awk '/Threads/{print $2}' "/proc/${dpid}/status" 2>/dev/null)"
                dfd="$(ls "/proc/${dpid}/fd" 2>/dev/null | wc -l)"
              else dpid='none'; drss='NA'; dthr='NA'; dfd='NA'; fi
              printf 'TRDIAG %s cgmem=%s/%s cgoom=[%s] cgpids=%s/%s memavail=%skB swap=%s dotnet[%s rss=%s thr=%s fd=%s] tmp=%sMB,%si ws=%sMB,%si home=%sMB,%si load=%s procs=%s\n' \
                "$(date -u +%H:%M:%S)" \
                "$(cat /sys/fs/cgroup/memory.current 2>/dev/null || echo NA)" \
                "$(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo NA)" \
                "$(tr '\n' ',' < /sys/fs/cgroup/memory.events 2>/dev/null | tr -d ' ' || echo NA)" \
                "$(cat /sys/fs/cgroup/pids.current 2>/dev/null || echo NA)" \
                "$(cat /sys/fs/cgroup/pids.max 2>/dev/null || echo NA)" \
                "$(awk '/MemAvailable/{print $2}' /proc/meminfo 2>/dev/null)" \
                "$(free -m | awk '/Swap:/{print $3"/"$2}')" \
                "${dpid}" "${drss}" "${dthr}" "${dfd}" \
                "$(df -m "$RUNNER_TEMP" | awk 'NR==2{print $4}')" \
                "$(df -i "$RUNNER_TEMP" | awk 'NR==2{print $4}')" \
                "$(df -m "$GITHUB_WORKSPACE" | awk 'NR==2{print $4}')" \
                "$(df -i "$GITHUB_WORKSPACE" | awk 'NR==2{print $4}')" \
                "$(df -m "$HOME" | awk 'NR==2{print $4}')" \
                "$(df -i "$HOME" | awk 'NR==2{print $4}')" \
                "$(cut -d' ' -f1-3 /proc/loadavg)" \
                "$(ps -e --no-headers | wc -l)"
              sleep 3
            done ) &
          trdiag_sampler=$!
          trap 'kill "$trdiag_sampler" 2>/dev/null || true' EXIT
          set +e
          dotnet run --project tools/StrataLint.Cli/StrataLint.Cli.csproj \
            --configuration Release --no-restore --no-build -- \
            truth-release \
            --out "$bundle" \
            --candidate-lean-report "$REPORT_PATH" \
            --producer-package-commit "$SOURCE_COMMIT" \
            --produced-at "$produced_at" \
            --commit-on-protected-dev "$COMMIT_ON_PROTECTED_DEV" \
            --required-check 'Candidate harness engineering checks=success' \
            --required-check 'Canonical Lean report production=success' \
            --required-check 'Content-addressed dev baseline admission=success'
          trdiag_dotnet_exit=$?
          set -e
          kill "$trdiag_sampler" 2>/dev/null || true
          printf 'TRDIAG DOTNET_EXIT=%s\n' "$trdiag_dotnet_exit"
          [ "$trdiag_dotnet_exit" -eq 0 ] || exit "$trdiag_dotnet_exit"
          digest="$(find "$bundle" -maxdepth 1 -type f -name release-manifest.v1.json -exec jq -r '.release_digest' {} \;)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          jq -e --arg digest "$digest" \
            '.schema == "truth-release-publication.v1" and .release_digest == $digest and .bundle_ref == $digest and .source_commit == $ENV.SOURCE_COMMIT and .source_tree == $ENV.SOURCE_TREE and (.producer_commit | test("^[0-9a-f]{40}$"))' \
            "$bundle/truth-release-publication.v1.json" >/dev/null
          artifact="$RUNNER_TEMP/truth-release-${digest#sha256:}.tar.gz"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C "$bundle" -cf - . | gzip -n > "$artifact"
          assets="$RUNNER_TEMP/truth-release-assets"
          rm -rf "$assets"
          mkdir -p "$assets"
          cp "$artifact" "$assets/"
          cp "$bundle/truth-release-publication.v1.json" "$assets/"
          archive_name="$(basename "$artifact")"
          publication_name='truth-release-publication.v1.json'
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg source_tree "$SOURCE_TREE" \
            --arg release_digest "$digest" \
            --arg archive_name "$archive_name" \
            --arg archive_sha256 "sha256:$(sha256sum "$artifact" | awk '{print $1}')" \
            --argjson archive_size "$(stat -c '%s' "$artifact")" \
            --arg publication_name "$publication_name" \
            --arg publication_sha256 "sha256:$(sha256sum "$bundle/$publication_name" | awk '{print $1}')" \
            --argjson publication_size "$(stat -c '%s' "$bundle/$publication_name")" \
            '{schema:"truth-release-transfer.v1",repository:$repository,run_id:$run_id,run_attempt:$run_attempt,source_commit:$source_commit,source_tree:$source_tree,release_digest:$release_digest,archive:{name:$archive_name,sha256:$archive_sha256,size:$archive_size},publication:{name:$publication_name,sha256:$publication_sha256,size:$publication_size}}' \
            > "$assets/truth-release-transfer.v1.json"
          artifact_name="truth-release-publication-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${digest#sha256:}"
          printf 'artifact_name=%s\n' "$artifact_name" >> "$GITHUB_OUTPUT"
          printf 'release_digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      # Partial Release recovery must use GitHub's "Re-run failed jobs" so only publish
      # retries with this retained transfer. A full re-run resolves and freezes the then-current
      # protected dev tip again and produces a new run-attempt-bound transfer.
      - name: Transfer publication assets to the digest-keyed publisher
        id: transfer
        if: steps.source.outputs.publish_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          path: ${{ runner.temp }}/truth-release-assets/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: publish persistent verified truth-release
    needs: produce
    if: needs.produce.outputs.publish_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      OCI_REPOSITORY: ghcr.io/${{ github.repository_owner }}/trureturing/truth-release
      OCI_ARTIFACT_TYPE: application/vnd.theomega.truth-release.bundle.v1
      OCI_LAYER_TYPE: application/vnd.theomega.truth-release.bundle.v1+tar+gzip
      RELEASE_DIGEST: ${{ needs.produce.outputs.release_digest }}
      PRODUCE_RUN_ATTEMPT: ${{ needs.produce.outputs.run_attempt }}
      SOURCE_COMMIT: ${{ needs.produce.outputs.source_commit }}
      SOURCE_TREE: ${{ needs.produce.outputs.source_tree }}
      TRANSFER_ARTIFACT_ID: ${{ needs.produce.outputs.artifact_id }}
      TRANSFER_ARTIFACT_DIGEST: ${{ needs.produce.outputs.artifact_digest }}
    steps:
      - name: Reverify protected dev before publication writes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          branch="$(gh api "repos/${GITHUB_REPOSITORY}/branches/dev")"
          [[ "$(jq -r '.protected' <<< "$branch")" == 'true' ]] \
            || { printf '%s\n' 'dev is not protected; refusing publication writes' >&2; exit 1; }
          dev_tip="$(jq -r '.commit.sha' <<< "$branch")"
          [[ "$dev_tip" =~ ^[0-9a-f]{40}$ ]]
          comparison="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${SOURCE_COMMIT}...${dev_tip}")"
          [[ "$(jq -r '.merge_base_commit.sha' <<< "$comparison")" == "$SOURCE_COMMIT" \
            && "$(jq -r '.behind_by' <<< "$comparison")" == '0' ]] \
            || { printf '%s\n' 'source commit left protected dev while publication was queued' >&2; exit 1; }

      - name: Download the prepared publication assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.produce.outputs.artifact_id }}
          path: ${{ runner.temp }}/truth-release-assets
          merge-multiple: true

      - name: Verify transferred release_digest binding
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_TREE" =~ ^[0-9a-f]{40}$ ]]
          assets="$RUNNER_TEMP/truth-release-assets"
          archive="$assets/truth-release-${RELEASE_DIGEST#sha256:}.tar.gz"
          publication="$assets/truth-release-publication.v1.json"
          transfer="$assets/truth-release-transfer.v1.json"
          [[ "$TRANSFER_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$TRANSFER_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ -s "$archive" && -s "$publication" && -s "$transfer" ]]
          mapfile -t transferred_files < <(find "$assets" -maxdepth 1 -type f -printf '%f\n' | sort)
          expected_files=(
            "$(basename "$archive")"
            'truth-release-publication.v1.json'
            'truth-release-transfer.v1.json'
          )
          mapfile -t expected_files < <(printf '%s\n' "${expected_files[@]}" | sort)
          [[ "${transferred_files[*]}" == "${expected_files[*]}" ]] \
            || { printf '%s\n' 'publication artifact contains an unexpected file set' >&2; exit 1; }
          jq -e \
            --arg archive_name "$(basename "$archive")" \
            --arg archive_sha256 "sha256:$(sha256sum "$archive" | awk '{print $1}')" \
            --argjson archive_size "$(stat -c '%s' "$archive")" \
            --arg publication_sha256 "sha256:$(sha256sum "$publication" | awk '{print $1}')" \
            --argjson publication_size "$(stat -c '%s' "$publication")" \
            '.schema == "truth-release-transfer.v1"
              and .repository == $ENV.GITHUB_REPOSITORY
              and .run_id == $ENV.GITHUB_RUN_ID
              and .run_attempt == $ENV.PRODUCE_RUN_ATTEMPT
              and .source_commit == $ENV.SOURCE_COMMIT
              and .source_tree == $ENV.SOURCE_TREE
              and .release_digest == $ENV.RELEASE_DIGEST
              and .archive == {name:$archive_name,sha256:$archive_sha256,size:$archive_size}
              and .publication == {name:"truth-release-publication.v1.json",sha256:$publication_sha256,size:$publication_size}' \
            "$transfer" >/dev/null
          jq -e --arg digest "$RELEASE_DIGEST" --arg commit "$SOURCE_COMMIT" --arg tree "$SOURCE_TREE" \
            '.schema == "truth-release-publication.v1" and .release_digest == $digest and .bundle_ref == $digest and .source_commit == $commit and .source_tree == $tree' \
            "$publication" >/dev/null
          archived_publication="$RUNNER_TEMP/archived-truth-release-publication.v1.json"
          tar -xOzf "$archive" ./truth-release-publication.v1.json > "$archived_publication"
          cmp -s "$publication" "$archived_publication" \
            || { printf '%s\n' 'archive publication pointer differs from the transferred pointer' >&2; exit 1; }
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          printf 'publication=%s\n' "$publication" >> "$GITHUB_OUTPUT"

      - name: Install ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1.2.4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish or verify the immutable GHCR artifact
        id: oci
        env:
          ARCHIVE: ${{ steps.assets.outputs.archive }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          verify_protected_dev_tip() {
            local comparison status merge_base
            comparison="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${SOURCE_COMMIT}...dev")"
            status="$(jq -r '.status' <<< "$comparison")"
            merge_base="$(jq -r '.merge_base_commit.sha' <<< "$comparison")"
            { [[ "$status" == "ahead" || "$status" == "identical" ]] && [[ "$merge_base" == "$SOURCE_COMMIT" ]]; } \
              || { printf '%s\n' 'source commit is no longer an ancestor of protected dev before OCI publication; refusing to publish' >&2; return 1; }
          }

          verify_pinned_oci_artifact() {
            local reference="$1"
            local manifest="$RUNNER_TEMP/oci-manifest.json"
            local expected_digest expected_size pull_dir downloaded source_url
            [[ "$reference" == "$OCI_REPOSITORY@"* ]]
            [[ "${reference##*@}" =~ ^sha256:[0-9a-f]{64}$ ]]
            oras manifest fetch "$reference" > "$manifest"
            expected_digest="sha256:$(sha256sum "$ARCHIVE" | awk '{print $1}')"
            expected_size="$(stat -c '%s' "$ARCHIVE")"
            source_url="https://github.com/${GITHUB_REPOSITORY}/commit/${SOURCE_COMMIT}"
            jq -e \
              --arg artifact_type "$OCI_ARTIFACT_TYPE" \
              --arg layer_type "$OCI_LAYER_TYPE" \
              --arg digest "$expected_digest" \
              --argjson size "$expected_size" \
              --arg release_digest "$RELEASE_DIGEST" \
              --arg source_url "$source_url" \
              --arg source_commit "$SOURCE_COMMIT" \
              '.schemaVersion == 2 and .artifactType == $artifact_type
                and (.layers | length) == 1
                and .layers[0].mediaType == $layer_type
                and .layers[0].digest == $digest
                and .layers[0].size == $size
                and .annotations["org.theomega.truth-release.release-digest"] == $release_digest
                and .annotations["org.opencontainers.image.source"] == $source_url
                and .annotations["org.opencontainers.image.revision"] == $source_commit' \
              "$manifest" >/dev/null \
              || { printf '%s\n' 'pinned OCI manifest is not immutably bound to the expected archive and source' >&2; return 1; }
            pull_dir="$RUNNER_TEMP/oci-pull"
            rm -rf "$pull_dir"
            mkdir -p "$pull_dir"
            (
              cd "$pull_dir"
              oras pull "$reference"
            )
            downloaded="$pull_dir/$(basename "$ARCHIVE")"
            test -f "$downloaded"
            cmp -s "$ARCHIVE" "$downloaded" \
              || { printf '%s\n' 'existing OCI archive bytes differ from the expected truth-release' >&2; return 1; }
          }

          verify_protected_dev_tip
          tag="release-${RELEASE_DIGEST#sha256:}"
          reference="$OCI_REPOSITORY:$tag"
          source_url="https://github.com/${GITHUB_REPOSITORY}/commit/${SOURCE_COMMIT}"
          descriptor="$RUNNER_TEMP/oci-descriptor.json"
          fetch_error="$RUNNER_TEMP/oci-fetch-error.txt"
          if oras manifest fetch --descriptor "$reference" > "$descriptor" 2> "$fetch_error"; then
            pushed=false
          else
            if ! grep -Eqi 'manifest unknown|not found' "$fetch_error"; then
              cat "$fetch_error" >&2
              printf '%s\n' 'OCI lookup failed without a definitive not-found response' >&2
              exit 1
            fi
            oras push "$reference" \
              --artifact-type "$OCI_ARTIFACT_TYPE" \
              --annotation "org.opencontainers.image.source=${source_url}" \
              --annotation "org.opencontainers.image.revision=${SOURCE_COMMIT}" \
              --annotation "org.theomega.truth-release.release-digest=${RELEASE_DIGEST}" \
              "$ARCHIVE:$OCI_LAYER_TYPE"
            pushed=true
            oras manifest fetch --descriptor "$reference" > "$descriptor"
          fi
          oci_digest="$(jq -r '.digest' "$descriptor")"
          [[ "$oci_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          immutable_reference="$OCI_REPOSITORY@$oci_digest"
          verify_pinned_oci_artifact "$immutable_reference"
          current_digest="$(oras manifest fetch --descriptor "$reference" | jq -r '.digest')"
          [[ "$current_digest" == "$oci_digest" ]] \
            || { printf '%s\n' 'OCI digest tag moved during immutable verification' >&2; exit 1; }
          printf 'OCI_ARTIFACT status=%s release_digest=%s coordinate=%s@%s\n' \
            "$([[ "$pushed" == true ]] && printf published || printf verified-existing)" \
            "$RELEASE_DIGEST" "$OCI_REPOSITORY" "$oci_digest"
          printf 'digest=%s\n' "$oci_digest" >> "$GITHUB_OUTPUT"
          printf 'reference=%s\n' "$immutable_reference" >> "$GITHUB_OUTPUT"

      - name: Verify existing provenance or request repair
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          SUBJECT_DIGEST: ${{ steps.oci.outputs.digest }}
          SUBJECT_REFERENCE: ${{ steps.oci.outputs.reference }}
        shell: bash
        run: |
          set -euo pipefail
          attest_comparison="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${SOURCE_COMMIT}...dev")"
          attest_status="$(jq -r '.status' <<< "$attest_comparison")"
          attest_merge_base="$(jq -r '.merge_base_commit.sha' <<< "$attest_comparison")"
          { [[ "$attest_status" == "ahead" || "$attest_status" == "identical" ]] && [[ "$attest_merge_base" == "$SOURCE_COMMIT" ]]; } \
            || { printf '%s\n' 'source commit is no longer an ancestor of protected dev before OCI attestation; refusing to publish' >&2; exit 1; }
          [[ "$SUBJECT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$SUBJECT_REFERENCE" == "$OCI_REPOSITORY@$SUBJECT_DIGEST" ]]
          encoded_digest="$(jq -rn --arg digest "$SUBJECT_DIGEST" '$digest | @uri')"
          inventory="$RUNNER_TEMP/provenance-inventory.json"
          status="$(curl -sS -o "$inventory" -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/attestations/${encoded_digest}")"
          if [[ "$status" == 404 ]]; then
            printf 'needed=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$status" == 200 ]] \
            || { printf 'attestation inventory lookup failed with HTTP %s\n' "$status" >&2; exit 1; }
          count="$(jq -er '.attestations | length' "$inventory")"
          [[ "$count" =~ ^[0-9]+$ ]]
          if [[ "$count" -eq 0 ]]; then
            printf 'needed=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh attestation verify "oci://${SUBJECT_REFERENCE}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/truth-release-publish.yml" \
            --source-digest "$SOURCE_COMMIT" \
            --source-ref 'refs/heads/dev' \
            --format json > "$RUNNER_TEMP/provenance-verified.json"; then
            printf 'needed=false\n' >> "$GITHUB_OUTPUT"
            printf 'OCI_PROVENANCE status=verified-existing subject=%s@%s\n' "$OCI_REPOSITORY" "$SUBJECT_DIGEST"
          else
            printf 'needed=true\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Attest the GHCR artifact provenance
        if: steps.provenance.outputs.needed == 'true'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ env.OCI_REPOSITORY }}
          subject-digest: ${{ steps.oci.outputs.digest }}
          push-to-registry: true

      - name: Require verified GHCR provenance
        env:
          GH_TOKEN: ${{ github.token }}
          SUBJECT_DIGEST: ${{ steps.oci.outputs.digest }}
          SUBJECT_REFERENCE: ${{ steps.oci.outputs.reference }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SUBJECT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$SUBJECT_REFERENCE" == "$OCI_REPOSITORY@$SUBJECT_DIGEST" ]]
          for attempt in $(seq 1 6); do
            if gh attestation verify "oci://${SUBJECT_REFERENCE}" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/truth-release-publish.yml" \
              --source-digest "$SOURCE_COMMIT" \
              --source-ref 'refs/heads/dev' \
              --format json > "$RUNNER_TEMP/provenance-final.json"; then
              printf 'OCI_PROVENANCE status=verified subject=%s@%s\n' "$OCI_REPOSITORY" "$SUBJECT_DIGEST"
              exit 0
            fi
            [[ "$attempt" -lt 6 ]] && sleep 10
          done
          printf '%s\n' 'GHCR provenance did not become verifiable' >&2
          exit 1

      - name: Create or recover the immutable GitHub Release mirror
        env:
          ARCHIVE: ${{ steps.assets.outputs.archive }}
          GH_TOKEN: ${{ github.token }}
          PUBLICATION: ${{ steps.assets.outputs.publication }}
        shell: bash
        run: |
          set -euo pipefail

          tag="truth-release-${RELEASE_DIGEST#sha256:}"
          title="Truth release ${RELEASE_DIGEST#sha256:}"
          body="Verified truth-release.v1 bundle for ${SOURCE_COMMIT}. The OCI artifact is keyed by ${RELEASE_DIGEST}; this release is a human mirror."
          release_json="$RUNNER_TEMP/github-release.json"
          created=false
          expected_assets=("$(basename "$ARCHIVE")" "$(basename "$PUBLICATION")")
          expected_assets_json="$(printf '%s\n' "${expected_assets[@]}" | jq -Rsc 'split("\n")[:-1] | sort')"

          verify_protected_dev_tip() {
            local comparison status merge_base
            comparison="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${SOURCE_COMMIT}...dev")"
            status="$(jq -r '.status' <<< "$comparison")"
            merge_base="$(jq -r '.merge_base_commit.sha' <<< "$comparison")"
            { [[ "$status" == "ahead" || "$status" == "identical" ]] && [[ "$merge_base" == "$SOURCE_COMMIT" ]]; } \
              || { printf '%s\n' 'source commit is no longer an ancestor of protected dev before GitHub Release publication; refusing to publish' >&2; return 1; }
          }

          verify_release_metadata() {
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" > "$release_json"
            jq -e --arg tag "$tag" --arg target "$SOURCE_COMMIT" --arg title "$title" --arg body "$body" \
              '.tag_name == $tag and .target_commitish == $target and .name == $title and .body == $body and .draft == false and .prerelease == false' \
              "$release_json" >/dev/null \
              || { printf '%s\n' 'existing GitHub Release metadata does not match the prepared release' >&2; exit 1; }
            ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}")"
            [[ "$(jq -r '.object.type' <<< "$ref")" == 'commit' \
              && "$(jq -r '.object.sha' <<< "$ref")" == "$SOURCE_COMMIT" ]] \
              || { printf '%s\n' 'existing GitHub Release tag is not bound to the source commit' >&2; exit 1; }
            jq -e --argjson expected "$expected_assets_json" \
              '[.assets[].name] as $actual
                | ($actual | length) == ($actual | unique | length)
                  and (($actual - $expected) | length) == 0' \
              "$release_json" >/dev/null \
              || { printf '%s\n' 'GitHub Release contains an unexpected or duplicate asset' >&2; exit 1; }
          }

          verify_release() {
            verify_release_metadata
            jq -e --argjson expected "$expected_assets_json" \
              '(.assets | length) == ($expected | length)
                and ([.assets[].name] | sort) == $expected' \
              "$release_json" >/dev/null \
              || { printf '%s\n' 'GitHub Release asset set does not exactly match the prepared release' >&2; exit 1; }
          }

          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" > "$release_json" 2>/dev/null; then
            verify_release_metadata
          else
            verify_protected_dev_tip
            if gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_COMMIT" \
              --title "$title" --notes "$body"; then
              created=true
            fi
            verify_release_metadata
          fi

          for asset in "$ARCHIVE" "$PUBLICATION"; do
            name="$(basename "$asset")"
            verify_release_metadata
            count="$(jq --arg name "$name" '[.assets[] | select(.name == $name)] | length' "$release_json")"
            if [[ "$count" == '0' ]]; then
              verify_protected_dev_tip
              gh release upload "$tag" "$asset" --repo "$GITHUB_REPOSITORY" \
                || printf '%s\n' "asset upload raced or failed; verifying remote asset before deciding"
            elif [[ "$count" != '1' ]]; then
              printf 'GitHub Release has %s assets named %s; refusing reuse\n' "$count" "$name" >&2
              exit 1
            fi
            verify_release_metadata
            count="$(jq --arg name "$name" '[.assets[] | select(.name == $name)] | length' "$release_json")"
            [[ "$count" == '1' ]] \
              || { printf '%s\n' "GitHub Release asset $name is absent after upload" >&2; exit 1; }
            verify_dir="$(mktemp -d)"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir "$verify_dir"
            if ! cmp -s "$asset" "$verify_dir/$name"; then
              local_digest="$(sha256sum "$asset" | cut -d' ' -f1)"
              remote_digest="$(sha256sum "$verify_dir/$name" | cut -d' ' -f1)"
              printf 'GitHub Release asset %s is immutable but mismatched (local=%s remote=%s)\n' \
                "$name" "$local_digest" "$remote_digest" >&2
              exit 1
            fi
          done
          verify_release
          printf 'GITHUB_RELEASE status=%s tag=%s assets=verified\n' \
            "$([[ "$created" == true ]] && printf published || printf verified-or-recovered)" "$tag"
