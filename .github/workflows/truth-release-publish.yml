name: truth-release-publish

on:
  push:
    branches: [dev]
    paths:
      - 'D5/**/*.lean'
      - 'Trureturing.lean'
      - 'Blueprint/**/*.scribe.cs'
      - 'Evidence/**'
      - 'Meta/**'
      - 'tools/**'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - 'global.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/truth-release-publish.yml'

permissions:
  contents: write
  actions: read
  packages: write
  id-token: write
  attestations: write

jobs:
  produce:
    name: produce verified truth-release inputs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    outputs:
      artifact_name: ${{ steps.release.outputs.artifact_name }}
      release_digest: ${{ steps.release.outputs.release_digest }}
      source_commit: ${{ steps.source.outputs.source_commit }}
    env:
      GH_TOKEN: ${{ github.token }}
      REQUIRED_CHECKS: >-
        Candidate harness engineering checks
        |Canonical Lean report production
        |Content-addressed dev baseline admission
    steps:
      - name: Resolve protected dev and wait for required gates
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/dev" --jq '.object.sha')"
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$source_commit" != "$GITHUB_SHA" ]]; then
            printf '%s\n' 'resolved protected dev tip does not equal the push SHA' >&2
            exit 1
          fi
          IFS='|' read -r -a required_checks <<< "$REQUIRED_CHECKS"
          all_green=false
          for attempt in $(seq 1 60); do
            checks="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${source_commit}/check-runs?per_page=100" --jq '.check_runs')"
            all_green=true
            summary=()
            for required in "${required_checks[@]}"; do
              conclusion="$(jq -r --arg name "$required" '[.[] | select(.name == $name and .status == "completed") | .conclusion] | if length == 0 then "missing" else .[0] end' <<< "$checks")"
              summary+=("$required=$conclusion")
              [[ "$conclusion" == "success" ]] || all_green=false
            done
            printf 'required-gates attempt=%s %s\n' "$attempt" "${summary[*]}"
            [[ "$all_green" == true ]] && break
            all_green=false
            sleep 60
          done
          [[ "$all_green" == true ]] || { printf '%s\n' 'required dev gates did not become green within the publish window' >&2; exit 1; }
          report_root="$RUNNER_TEMP/canonical-lean-report"
          mkdir -p "$report_root"
          run_id="$(gh run list --workflow ci.yml --commit "$source_commit" --limit 20 --json databaseId,status,conclusion --jq '[.[] | select(.status == "completed" and .conclusion == "success")][0].databaseId // empty')"
          if [[ -n "$run_id" && "$run_id" =~ ^[0-9]+$ ]]; then
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name raw-lean-reports --dir "$report_root" \
              || printf '%s\n' 'canonical report artifact could not be downloaded; warm-cache production will be used'
          else
            printf '%s\n' 'no successful CI run was found for this exact dev commit; warm-cache production will be used'
          fi
          printf 'source_commit=%s\n' "$source_commit" >> "$GITHUB_OUTPUT"

      - name: Check out the exact protected dev tip
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Strip checkout remote state
        if: steps.checkout.outcome == 'success'
        shell: bash
        env:
          CHECKOUT_PATH: .
        run: |
          set -euo pipefail
          git -C "$CHECKOUT_PATH" remote remove origin
          git -C "$CHECKOUT_PATH" for-each-ref --format='delete %(refname)' refs/remotes/ |
            git -C "$CHECKOUT_PATH" update-ref --stdin
          remote_count="$(git -C "$CHECKOUT_PATH" remote | wc -l)"
          remote_ref_count="$(git -C "$CHECKOUT_PATH" for-each-ref --format='%(refname)' refs/remotes/ | wc -l)"
          if [[ "$remote_count" -ne 0 || "$remote_ref_count" -ne 0 ]]; then
            printf '%s\n' "checkout still exposes remotes or remote-tracking refs" >&2
            exit 1
          fi
          head_sha="$(git -C "$CHECKOUT_PATH" rev-parse HEAD)"
          base_sha="$(git -C "$CHECKOUT_PATH" rev-parse HEAD^1)"
          test -n "$head_sha"
          test -n "$base_sha"

      - name: Verify checked-out protected dev identity
        id: identity
        env:
          RESOLVED_SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          source_tree="$(git cat-file -p HEAD | sed -n 's/^tree //p')"
          protected_dev_tip="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/dev" --jq '.object.sha')"
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$source_tree" =~ ^[0-9a-f]{40}$ ]]
          [[ "$protected_dev_tip" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$source_commit" != "$RESOLVED_SOURCE_COMMIT" ]]; then
            printf '%s\n' 'checked out commit does not equal the resolved source SHA' >&2
            exit 1
          fi
          if [[ "$source_commit" != "$protected_dev_tip" ]]; then
            printf '%s\n' 'checked out commit is not the current protected dev tip' >&2
            exit 1
          fi
          printf 'source_tree=%s\n' "$source_tree" >> "$GITHUB_OUTPUT"
          printf 'commit_on_protected_dev=true\n' >> "$GITHUB_OUTPUT"

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install the pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          tools/scripts/workflow/install-lean-toolchain.sh lean-toolchain --github-path "$GITHUB_PATH"

      - name: Warm the Lean dependency cache
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get || printf '%s\n' 'mathlib cache get missed; lake build/report will fill remaining dependencies'
          make lean-cache-from-github-without-mathlib \
            || printf '%s\n' 'repository Lean build cache was unavailable; the canonical report artifact remains the primary input'

      - name: Reuse the canonical Lean report artifact
        id: report
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          report_root="$RUNNER_TEMP/canonical-lean-report"
          report="$(find "$report_root" -type f -name candidate-lean-report.json -print -quit)"
          [[ -s "$report" ]] || { printf '%s\n' 'canonical report artifact is missing candidate-lean-report.json' >&2; exit 1; }
          helper="$GITHUB_WORKSPACE/tools/scripts/report/lean-report-input.sh"
          "$helper" verify --repository "$GITHUB_WORKSPACE" --report "$report"
          printf 'path=%s\n' "$report" >> "$GITHUB_OUTPUT"

      - name: Fall back to warm-cache canonical report production
        if: steps.report.outcome != 'success'
        id: report_fallback
        shell: bash
        run: |
          set -euo pipefail
          make lean-report
          report="$GITHUB_WORKSPACE/.lake/build/stratalint/raw-lean-report.json"
          test -s "$report"
          tools/scripts/report/lean-report-input.sh verify \
            --repository "$GITHUB_WORKSPACE" --report "$report"
          printf 'path=%s\n' "$report" >> "$GITHUB_OUTPUT"

      - name: Assemble the real seven-artifact truth-release
        id: release
        env:
          COMMIT_ON_PROTECTED_DEV: ${{ steps.identity.outputs.commit_on_protected_dev }}
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          SOURCE_TREE: ${{ steps.identity.outputs.source_tree }}
          REPORT_PATH: ${{ steps.report.outputs.path || steps.report_fallback.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/truth-release-bundle"
          rm -rf "$bundle"
          mkdir -p "$bundle"
          dotnet restore tools/StrataLint.Cli/StrataLint.Cli.csproj --locked-mode
          SOURCE_EPOCH="$(git show -s --format=%ct "$SOURCE_COMMIT")"
          [[ "$SOURCE_EPOCH" =~ ^[0-9]+$ ]]
          produced_at="$(date -u -d "@$SOURCE_EPOCH" +%Y-%m-%dT%H:%M:%SZ)"
          dotnet run --project tools/StrataLint.Cli/StrataLint.Cli.csproj \
            --configuration Release --no-restore -- \
            truth-release \
            --out "$bundle" \
            --candidate-lean-report "$REPORT_PATH" \
            --producer-package-commit "$SOURCE_COMMIT" \
            --produced-at "$produced_at" \
            --commit-on-protected-dev "$COMMIT_ON_PROTECTED_DEV" \
            --required-check 'Candidate harness engineering checks=success' \
            --required-check 'Canonical Lean report production=success' \
            --required-check 'Content-addressed dev baseline admission=success'
          digest="$(find "$bundle" -maxdepth 1 -type f -name release-manifest.v1.json -exec jq -r '.release_digest' {} \;)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          jq -e --arg digest "$digest" \
            '.schema == "truth-release-publication.v1" and .release_digest == $digest and .bundle_ref == $digest and .source_commit == $ENV.SOURCE_COMMIT and .source_tree == $ENV.SOURCE_TREE and (.producer_commit | test("^[0-9a-f]{40}$"))' \
            "$bundle/truth-release-publication.v1.json" >/dev/null
          archive="$RUNNER_TEMP/truth-release-${digest#sha256:}.tar.gz"
          tar --sort=name --mtime="@$SOURCE_EPOCH" --owner=0 --group=0 --numeric-owner \
            --format=ustar -C "$bundle" -cf - . | gzip -n > "$archive"
          artifact_name="truth-release-publication-${digest#sha256:}"
          staging="$RUNNER_TEMP/$artifact_name"
          mkdir -p "$staging"
          cp "$archive" "$bundle/truth-release-publication.v1.json" "$staging/"
          printf 'artifact_name=%s\n' "$artifact_name" >> "$GITHUB_OUTPUT"
          printf 'release_digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'staging=%s\n' "$staging" >> "$GITHUB_OUTPUT"

      - name: Transfer immutable publication inputs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          path: ${{ steps.release.outputs.staging }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: publish persistent verified truth-release
    needs: produce
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    concurrency:
      group: truth-release-publish-${{ needs.produce.outputs.release_digest }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      OCI_REPOSITORY: ghcr.io/${{ github.repository_owner }}/trureturing/truth-release
      OCI_ARTIFACT_TYPE: application/vnd.theomega.truth-release.bundle.v1
      OCI_LAYER_TYPE: application/vnd.theomega.truth-release.bundle.v1+tar+gzip
      RELEASE_DIGEST: ${{ needs.produce.outputs.release_digest }}
      SOURCE_COMMIT: ${{ needs.produce.outputs.source_commit }}
    steps:
      - name: Download immutable publication inputs
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.produce.outputs.artifact_name }}
          path: ${{ runner.temp }}/truth-release-publication

      - name: Validate transferred publication inputs
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/truth-release-publication"
          archive="$root/truth-release-${RELEASE_DIGEST#sha256:}.tar.gz"
          publication="$root/truth-release-publication.v1.json"
          [[ "$RELEASE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test -s "$archive"
          jq -e \
            '.schema == "truth-release-publication.v1" and .release_digest == $ENV.RELEASE_DIGEST and .bundle_ref == $ENV.RELEASE_DIGEST and .source_commit == $ENV.SOURCE_COMMIT' \
            "$publication" >/dev/null
          protected_dev_tip="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/dev" --jq '.object.sha')"
          [[ "$protected_dev_tip" == "$SOURCE_COMMIT" ]] \
            || { printf '%s\n' 'publication source is no longer the protected dev tip' >&2; exit 1; }
          printf 'ARCHIVE=%s\n' "$archive" >> "$GITHUB_ENV"
          printf 'PUBLICATION=%s\n' "$publication" >> "$GITHUB_ENV"

      - name: Install ORAS
        uses: oras-project/setup-oras@v1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish or verify the immutable GHCR artifact
        id: oci
        shell: bash
        run: |
          set -euo pipefail

          verify_protected_dev_tip() {
            local protected_dev_tip
            protected_dev_tip="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/dev" --jq '.object.sha')"
            [[ "$protected_dev_tip" == "$SOURCE_COMMIT" ]] \
              || { printf '%s\n' 'protected dev moved before OCI publication' >&2; return 1; }
          }

          verify_oci_artifact() {
            local reference="$1"
            local manifest="$RUNNER_TEMP/oci-manifest.json"
            local expected_digest expected_size pull_dir downloaded
            oras manifest fetch "$reference" > "$manifest"
            expected_digest="sha256:$(sha256sum "$ARCHIVE" | awk '{print $1}')"
            expected_size="$(stat -c '%s' "$ARCHIVE")"
            jq -e \
              --arg artifact_type "$OCI_ARTIFACT_TYPE" \
              --arg layer_type "$OCI_LAYER_TYPE" \
              --arg digest "$expected_digest" \
              --argjson size "$expected_size" \
              --arg source "https://github.com/${GITHUB_REPOSITORY}/commit/${SOURCE_COMMIT}" \
              '.artifactType == $artifact_type
                and (.layers | length) == 1
                and .layers[0].mediaType == $layer_type
                and .layers[0].digest == $digest
                and .layers[0].size == $size
                and .annotations["org.opencontainers.image.source"] == $source' \
              "$manifest" >/dev/null \
              || { printf '%s\n' 'existing OCI tag is not immutably bound to the expected archive and source' >&2; return 1; }
            pull_dir="$RUNNER_TEMP/oci-pull"
            rm -rf "$pull_dir"
            mkdir -p "$pull_dir"
            (
              cd "$pull_dir"
              oras pull "$reference"
            )
            downloaded="$pull_dir/$(basename "$ARCHIVE")"
            test -f "$downloaded"
            cmp -s "$ARCHIVE" "$downloaded" \
              || { printf '%s\n' 'existing OCI archive bytes differ from the expected truth-release' >&2; return 1; }
          }

          verify_protected_dev_tip
          tag="release-${RELEASE_DIGEST#sha256:}"
          reference="$OCI_REPOSITORY:$tag"
          pushed=false
          lookup_error="$RUNNER_TEMP/oci-lookup-error.txt"
          if oras manifest fetch "$reference" >/dev/null 2> "$lookup_error"; then
            :
          elif grep -Eqi '(^|[^[:alpha:]])(404|manifest unknown|not found)([^[:alpha:]]|$)' "$lookup_error"; then
            verify_protected_dev_tip
            oras push "$reference" \
              --artifact-type "$OCI_ARTIFACT_TYPE" \
              --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}/commit/${SOURCE_COMMIT}" \
              "$ARCHIVE:$OCI_LAYER_TYPE"
            pushed=true
          else
            printf '%s\n' 'OCI tag lookup failed without a confirmed missing-manifest response' >&2
            sed -n '1,20p' "$lookup_error" >&2
            exit 1
          fi
          descriptor="$RUNNER_TEMP/oci-descriptor.json"
          oras manifest fetch --descriptor "$reference" > "$descriptor"
          oci_digest="$(jq -r '.digest' "$descriptor")"
          [[ "$oci_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          immutable_reference="$OCI_REPOSITORY@$oci_digest"
          verify_oci_artifact "$immutable_reference"
          current_digest="$(oras manifest fetch --descriptor "$reference" | jq -r '.digest')"
          [[ "$current_digest" == "$oci_digest" ]] \
            || { printf '%s\n' 'OCI digest tag moved during immutable verification' >&2; exit 1; }
          printf 'OCI_ARTIFACT status=%s release_digest=%s coordinate=%s@%s\n' \
            "$([[ "$pushed" == true ]] && printf published || printf verified)" \
            "$RELEASE_DIGEST" "$OCI_REPOSITORY" "$oci_digest"
          printf 'pushed=%s\n' "$pushed" >> "$GITHUB_OUTPUT"
          printf 'digest=%s\n' "$oci_digest" >> "$GITHUB_OUTPUT"

      - name: Revalidate protected dev before OCI attestation
        if: steps.oci.outputs.pushed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          protected_dev_tip="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/dev" --jq '.object.sha')"
          [[ "$protected_dev_tip" == "$SOURCE_COMMIT" ]] \
            || { printf '%s\n' 'protected dev moved before OCI attestation' >&2; exit 1; }

      - name: Attest the GHCR artifact provenance
        if: steps.oci.outputs.pushed == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.OCI_REPOSITORY }}
          subject-digest: ${{ steps.oci.outputs.digest }}
          push-to-registry: true

      - name: Create or repair the immutable GitHub Release mirror
        shell: bash
        run: |
          set -euo pipefail

          tag="truth-release-${RELEASE_DIGEST#sha256:}"
          expected_name="Truth release ${RELEASE_DIGEST#sha256:}"
          expected_body="Verified truth-release.v1 bundle for ${SOURCE_COMMIT}. The OCI artifact is keyed by ${RELEASE_DIGEST}; this release is a human mirror."
          release_collection_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases"
          release_lookup_api="${release_collection_api}/tags/${tag}"
          release_json="$RUNNER_TEMP/github-release.json"

          verify_protected_dev_tip() {
            local protected_dev_tip
            protected_dev_tip="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/dev" --jq '.object.sha')"
            [[ "$protected_dev_tip" == "$SOURCE_COMMIT" ]] \
              || { printf '%s\n' 'protected dev moved before GitHub Release publication' >&2; return 1; }
          }

          fetch_release() {
            curl -sS -o "$release_json" -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "$release_lookup_api"
          }

          resolve_tag_target() {
            local object object_type
            object="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}")"
            object_type="$(jq -r '.object.type' <<< "$object")"
            while [[ "$object_type" == tag ]]; do
              object="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$(jq -r '.object.sha' <<< "$object")")"
              object_type="$(jq -r '.object.type' <<< "$object")"
            done
            [[ "$object_type" == commit ]]
            jq -r '.object.sha' <<< "$object"
          }

          verify_existing_tag_if_present() {
            local status target
            status="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}")"
            if [[ "$status" == 404 ]]; then
              return 0
            fi
            [[ "$status" == 200 ]] \
              || { printf 'GitHub tag lookup failed with HTTP %s\n' "$status" >&2; return 1; }
            target="$(resolve_tag_target)"
            [[ "$target" == "$SOURCE_COMMIT" ]] \
              || { printf '%s\n' 'existing Release tag does not point to the verified source commit' >&2; return 1; }
          }

          verify_release_metadata() {
            local target
            jq -e \
              --arg tag "$tag" \
              --arg target "$SOURCE_COMMIT" \
              --arg name "$expected_name" \
              --arg body "$expected_body" \
              '.tag_name == $tag
                and .target_commitish == $target
                and .name == $name
                and .body == $body
                and .draft == false
                and .prerelease == false' \
              "$release_json" >/dev/null \
              || { printf '%s\n' 'existing GitHub Release metadata does not match the immutable publication' >&2; return 1; }
            target="$(resolve_tag_target)"
            [[ "$target" == "$SOURCE_COMMIT" ]] \
              || { printf '%s\n' 'GitHub Release tag does not point to the verified source commit' >&2; return 1; }
          }

          verify_release_asset() {
            local expected="$1"
            local name asset_count asset_id asset_size downloaded
            name="$(basename "$expected")"
            asset_count="$(jq --arg name "$name" '[.assets[] | select(.name == $name)] | length' "$release_json")" \
              || { printf '%s\n' 'GitHub Release assets are not valid JSON' >&2; return 2; }
            [[ "$asset_count" =~ ^[0-9]+$ ]] \
              || { printf '%s\n' 'GitHub Release asset count is not numeric' >&2; return 2; }
            if [[ "$asset_count" -eq 0 ]]; then
              return 1
            fi
            if [[ "$asset_count" -ne 1 ]]; then
              printf 'GitHub Release has %s assets named %s; refusing an ambiguous binding\n' "$asset_count" "$name" >&2
              return 2
            fi
            asset_id="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .id' "$release_json")" \
              || { printf 'GitHub Release asset id lookup failed for %s\n' "$name" >&2; return 2; }
            asset_size="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .size' "$release_json")" \
              || { printf 'GitHub Release asset size lookup failed for %s\n' "$name" >&2; return 2; }
            [[ "$asset_id" =~ ^[0-9]+$ && "$asset_size" -eq "$(stat -c '%s' "$expected")" ]] \
              || { printf 'GitHub Release asset metadata differs for %s\n' "$name" >&2; return 2; }
            downloaded="$RUNNER_TEMP/downloaded-${asset_id}-${name}"
            gh api "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              -H 'Accept: application/octet-stream' > "$downloaded" \
              || { printf 'GitHub Release asset download failed for %s\n' "$name" >&2; return 2; }
            cmp -s "$expected" "$downloaded" \
              || { printf 'GitHub Release asset bytes differ for %s\n' "$name" >&2; return 2; }
            return 0
          }

          upload_release_asset() {
            local expected="$1"
            local name encoded_name upload_url response status
            verify_protected_dev_tip
            name="$(basename "$expected")"
            encoded_name="$(jq -rn --arg name "$name" '$name | @uri')"
            upload_url="$(jq -r '.upload_url' "$release_json" | sed 's/{?name,label}$//')"
            [[ "$upload_url" =~ ^https://uploads\.github\.com/ ]] \
              || { printf '%s\n' 'GitHub Release returned no safe upload URL' >&2; return 1; }
            response="$RUNNER_TEMP/upload-${name}.json"
            status="$(curl -sS -o "$response" -w '%{http_code}' -X POST "${upload_url}?name=${encoded_name}" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'Content-Type: application/octet-stream' \
              --data-binary "@$expected")"
            if [[ "$status" != 201 && "$status" != 422 ]]; then
              printf 'GitHub Release asset upload failed with HTTP %s for %s\n' "$status" "$name" >&2
              return 1
            fi
            [[ "$(fetch_release)" == 200 ]] \
              || { printf '%s\n' 'GitHub Release disappeared after asset upload' >&2; return 1; }
            verify_release_metadata
            verify_release_asset "$expected"
          }

          verify_protected_dev_tip
          release_status="$(fetch_release)"
          if [[ "$release_status" == 404 ]]; then
            verify_existing_tag_if_present
            verify_protected_dev_tip
            payload="$(jq -n \
              --arg tag "$tag" \
              --arg target "$SOURCE_COMMIT" \
              --arg name "$expected_name" \
              --arg body "$expected_body" \
              '{tag_name:$tag,target_commitish:$target,name:$name,body:$body,draft:false,prerelease:false}')"
            create_response="$RUNNER_TEMP/github-release-create.json"
            create_status="$(curl -sS -o "$create_response" -w '%{http_code}' \
              -X POST "$release_collection_api" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'Content-Type: application/json' \
              --data "$payload")"
            if [[ "$create_status" != 201 && "$create_status" != 422 ]]; then
              printf 'GitHub Release creation failed with HTTP %s\n' "$create_status" >&2
              exit 1
            fi
            release_status="$(fetch_release)"
          fi
          [[ "$release_status" == 200 ]] \
            || { printf 'GitHub Release lookup failed with HTTP %s\n' "$release_status" >&2; exit 1; }
          verify_release_metadata

          for asset in "$ARCHIVE" "$PUBLICATION"; do
            if verify_release_asset "$asset"; then
              printf 'GITHUB_RELEASE_ASSET status=verified name=%s\n' "$(basename "$asset")"
            else
              verification_status=$?
              if [[ "$verification_status" -ne 1 ]]; then
                exit "$verification_status"
              fi
              upload_release_asset "$asset"
              printf 'GITHUB_RELEASE_ASSET status=uploaded name=%s\n' "$(basename "$asset")"
            fi
          done
          [[ "$(fetch_release)" == 200 ]] \
            || { printf '%s\n' 'GitHub Release disappeared during final verification' >&2; exit 1; }
          verify_release_metadata
          verify_release_asset "$ARCHIVE"
          verify_release_asset "$PUBLICATION"
          printf 'GITHUB_RELEASE status=verified tag=%s\n' "$tag"
