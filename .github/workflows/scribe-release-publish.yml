name: Scribe resource publication

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Ref to publish
        required: false
        default: dev
        type: string

permissions:
  contents: write

jobs:
  run:
    uses: the-omega-institute/trureturing-tools/.github/workflows/scribe-release-publish.yml@3178c75d57a098d042573bae760802fa8ba83bf6
    with:
      ref: ${{ inputs.ref }}
