name: Scribe resource publication

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Ref to publish
        required: false
        default: dev
        type: string

permissions:
  contents: write

jobs:
  run:
    uses: the-omega-institute/trureturing-tools/.github/workflows/scribe-release-publish.yml@a332ab65560ad7b7c0c51773349159ac470999a8
    with:
      ref: ${{ inputs.ref }}
