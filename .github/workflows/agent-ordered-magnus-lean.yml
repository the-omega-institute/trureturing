name: agent-ordered-magnus-lean

# Validation revision 2.
on:
  push:
    branches:
      - lane/math/ordered-magnus-observability

permissions:
  contents: read

jobs:
  validate:
    if: contains(github.event.head_commit.message, '[ordered-magnus-lean]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lane/math/ordered-magnus-observability
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install pinned Lean toolchain
        run: tools/scripts/workflow/install-lean-toolchain.sh lean-toolchain --github-path "$GITHUB_PATH"
      - name: Restore Lean dependencies
        run: lake update
      - name: Build target modules
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          : > diagnostics/summary.tsv
          failed=0
          modules=(
            D5.S3.Observer.AgencyHolonomy.SecondMagnusKernelNormSquare
            D5.S3.Observer.AgencyHolonomy.FiniteFourierMagnusCommutator
            D5.S3.Observer.AgencyHolonomy.PairCalibratedSecondMagnusObservability
            D5.S3.Observer.AgencyHolonomy.OrderedTimeSimplexSecondMagnusAverage
          )
          for module in "${modules[@]}"; do
            safe="${module//./_}"
            lake build "$module" > "diagnostics/${safe}.log" 2>&1
            status=$?
            cat "diagnostics/${safe}.log"
            printf '%s\t%s\n' "$module" "$status" >> diagnostics/summary.tsv
            if [ "$status" -ne 0 ]; then failed=1; fi
          done
          printf '%s\n' "$failed" > diagnostics/failed
          exit 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ordered-magnus-lean-diagnostics
          path: diagnostics
          if-no-files-found: error
          retention-days: 3
      - name: Enforce successful builds
        run: |
          cat diagnostics/summary.tsv
          test "$(cat diagnostics/failed)" = "0"
