name: CI publication verification

on:
  push:
    branches: ['integration-ci-*-tests']

permissions: {}

# This native integration event verifies the Lean-cache publication and restore
# programs. It is separate from the required CI workflows.
jobs:
  cache:
    name: verify cache publication and restore
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
      statuses: write
    concurrency:
      group: lean-cache-release-diagnostics
      queue: max
      cancel-in-progress: false
    env:
      STRATALINT_CACHE_WRITES: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the pinned tools release
        run: python3 .github/scripts/install-tools.py
      - id: entry
        name: Validate candidate, check the input patterns and strip checkout remote
        env:
          # The publication and restore programs and the build configuration they read.
          CI_HIT_PATHS: |
            .editorconfig
            .globalconfig
            .github/scripts/install-tools.py
            Meta/tools-release.json
            .github/workflows/ci-publication-verify.yml
            .github/workflows/lean-analysis-fixtures.yml
            .github/workflows/lean-cache-publish.yml
            .github/actions/lean-cache-produce/action.yml
            .gitignore
            D5/*.lean
            Directory.Build.*
            Directory.Packages.props
            Makefile
            Meta/FILEMAP.toml
            Meta/ci-cache-paths.json
            NuGet.Config
            NuGet.config
            Reg/*.lean
            Reg/lake-manifest.json
            Reg/lakefile.*
            Trureturing.lean
            global.json
            lake-manifest.json
            lakefile.*
            lean-report-inputs.json
            lean-toolchain
            nuget.config
          CI_PUSH_BEFORE: ${{ github.event.before }}
          CI_PUSH_RANGE: optional
        run: bash tools/scripts/workflow/ci-entry.sh
      - name: Validate entry result
        env:
          HIT: ${{ steps.entry.outputs.hit }}
        run: case "$HIT" in true|false) ;; *) echo "CI_ENTRY_ERROR hit output is '$HIT'" >&2; exit 2 ;; esac
      - name: Read the pinned .NET SDK version
        id: dotnet-sdk
        if: steps.entry.outputs.hit == 'true'
        run: |
          version="$(jq -er '.sdk.version' global.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - if: steps.entry.outputs.hit == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ steps.dotnet-sdk.outputs.version }}
      - if: steps.entry.outputs.hit == 'true'
        run: make -C tools dotnet DOTNET_PROJECT=tools/StrataLint.Lean/StrataLint.Lean.csproj
      - if: steps.entry.outputs.hit == 'true'
        id: keys
        run: python3 tools/scripts/worktree/lean_actions.py keys --repository "$GITHUB_WORKSPACE"
      - id: elan
        if: steps.entry.outputs.hit == 'true' && steps.keys.outputs.elan_key != ''
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ~/.elan
          key: ${{ steps.keys.outputs.elan_key }}
      - if: steps.entry.outputs.hit == 'true'
        run: tools/scripts/workflow/install-lean-toolchain.sh lean-toolchain --github-path "$GITHUB_PATH"
      - id: dependency
        if: steps.entry.outputs.hit == 'true' && steps.keys.outputs.dependency_key != ''
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.keys.outputs.dependency_archive_path }}
          key: ${{ steps.keys.outputs.dependency_key }}
          restore-keys: ${{ steps.keys.outputs.dependency_restore_prefix }}
      - id: project
        if: steps.entry.outputs.hit == 'true' && steps.keys.outputs.project_key != ''
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.keys.outputs.project_archive_path }}
          key: ${{ steps.keys.outputs.project_key }}
          restore-keys: ${{ steps.keys.outputs.project_restore_prefix }}
      - if: steps.entry.outputs.hit == 'true'
        name: Restore optional validated seeds
        env:
          DEPENDENCY_KEY: ${{ steps.dependency.outputs.cache-matched-key }}
          PROJECT_KEY: ${{ steps.project.outputs.cache-matched-key }}
          DEPENDENCY_OUTCOME: ${{ steps.dependency.outcome }}
          PROJECT_OUTCOME: ${{ steps.project.outcome }}
        run: python3 tools/scripts/worktree/lean_actions.py restore --repository "$GITHUB_WORKSPACE" --dependency-key "$DEPENDENCY_KEY" --project-key "$PROJECT_KEY" --dependency-outcome "$DEPENDENCY_OUTCOME" --project-outcome "$PROJECT_OUTCOME"
      - if: steps.entry.outputs.hit == 'true'
        name: Publish and restore an isolated verification snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os
          import runpy
          import subprocess
          import tempfile
          from pathlib import Path

          diagnostics = runpy.run_path("tools/scripts/report/runner-diagnostics.py")
          worker = diagnostics["worker_ancestor"]()
          cgroup = diagnostics["cgroup_directory"]((worker or {"pid": os.getpid()})["pid"])
          temporary = Path(tempfile.gettempdir())
          repo, commit = os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_SHA"]
          run, attempt = os.environ["GITHUB_RUN_ID"], os.environ["GITHUB_RUN_ATTEMPT"]
          endpoint = f"repos/{repo}/statuses/{commit}"
          run_url = f"https://github.com/{repo}/actions/runs/{run}/attempts/{attempt}"

          def current_phase():
              stages = list(temporary.glob("lean-release-*"))
              if any((stage / "downloaded").is_dir() for stage in stages):
                  return "restore"
              processes = subprocess.check_output(["ps", "-eo", "args="], text=True)
              if any("gh release " + operation in processes for operation in ("create", "upload", "edit")):
                  return "upload"
              if stages:
                  return "archive"
              if "compiled-fib-test" in processes:
                  return "fib"
              if "check-lean-report" in processes:
                  return "report"
              return "setup"

          def record(phase, state):
              try:
                  workspace, temp = (os.statvfs(path) for path in (Path.cwd(), temporary))
                  workspace_mib = workspace.f_bavail * workspace.f_frsize // (1024 ** 2)
                  temporary_mib = temp.f_bavail * temp.f_frsize // (1024 ** 2)
                  memory = diagnostics["memory_sample"](cgroup)
                  available_kib = memory.get("MemAvailable_kb")
                  available_mib = available_kib // 1024 if available_kib is not None else "?"
                  current_bytes = memory.get("memory.current")
                  current_mib = current_bytes // (1024 ** 2) if isinstance(current_bytes, int) else "?"
                  events = memory.get("memory.events", {})
                  description = (
                      f"{phase} free={workspace_mib}/{temporary_mib}MiB "
                      f"inodes={min(workspace.f_favail, temp.f_favail)} "
                      f"mem={available_mib}/{current_mib}MiB "
                      f"oom={events.get('oom', '?')}/{events.get('oom_kill', '?')}"
                  )
                  print(description, flush=True)
                  subprocess.run(
                      ["gh", "api", "--silent", "--method", "POST", endpoint,
                       "-f", "context=diagnostics/lean-cache-release/resources",
                       "-f", f"state={state}", "-f", f"description={description}",
                       "-f", f"target_url={run_url}"],
                      timeout=10, check=False,
                  )
              except (OSError, subprocess.TimeoutExpired) as error:
                  print(f"Resource status unavailable ({type(error).__name__})", flush=True)

          record("before", "pending")
          process = subprocess.Popen(
              ["make", "lean-cache-to-github-without-mathlib", "FULL_BUILD=1",
               "LEAN_CACHE_MODE=verification", f"LEAN_CACHE_SOURCE_REF={os.environ['GITHUB_REF']}",
               f"LEAN_CACHE_SOURCE_COMMIT={commit}"]
          )
          while True:
              try:
                  result = process.wait(timeout=45)
                  break
              except subprocess.TimeoutExpired:
                  try:
                      phase = current_phase()
                  except (OSError, subprocess.SubprocessError):
                      phase = "unknown"
                  record(phase, "pending")
          record(f"exit={result}", "success" if result == 0 else "failure")
          raise SystemExit(result if result >= 0 else 128 - result)
          PY

  scribe:
    name: verify Scribe publication and fetch
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: write
    concurrency:
      group: scribe-resources-verification
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the pinned tools release
        run: python3 .github/scripts/install-tools.py
      - id: entry
        name: Validate candidate, check the input patterns and strip checkout remote
        env:
          CI_HIT_PATHS: |
            .editorconfig
            .globalconfig
            .github/scripts/install-tools.py
            Meta/tools-release.json
            .github/workflows/ci-publication-verify.yml
            .github/workflows/scribe-release-publish.yml
            .gitignore
            Blueprint/*.scribe.cs
            Directory.Build.*
            Directory.Packages.props
            Golden/Projection/*.json
            Makefile
            Meta/FILEMAP.toml
            NuGet.Config
            NuGet.config
            global.json
            nuget.config
          CI_PUSH_BEFORE: ${{ github.event.before }}
          CI_PUSH_RANGE: optional
        run: bash tools/scripts/workflow/ci-entry.sh
      - name: Validate entry result
        env:
          HIT: ${{ steps.entry.outputs.hit }}
        run: case "$HIT" in true|false) ;; *) echo "CI_ENTRY_ERROR hit output is '$HIT'" >&2; exit 2 ;; esac
      - name: Read the pinned .NET SDK version
        id: dotnet-sdk
        if: steps.entry.outputs.hit == 'true'
        run: |
          version="$(jq -er '.sdk.version' global.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - if: steps.entry.outputs.hit == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ steps.dotnet-sdk.outputs.version }}
      - if: steps.entry.outputs.hit == 'true'
        name: Publish an isolated verification resource pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          make scribe-release-publish PREFIX=scribe-resources-verify TARGET="$GITHUB_SHA" \
            | tee "$RUNNER_TEMP/scribe-release-publish.log"
      - if: steps.entry.outputs.hit == 'true'
        name: Fetch the exact verification digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          receipt="$(tail -n 1 "$RUNNER_TEMP/scribe-release-publish.log")"
          [[ "$receipt" =~ ^SCRIBE_RELEASE\ (published|reused)\ tag=scribe-resources-verify-[0-9a-f]{64}\ digest=([0-9a-f]{64})$ ]] \
            || { echo 'SCRIBE_RELEASE InvalidPublicationReceipt' >&2; exit 2; }
          make scribe-release-fetch PREFIX=scribe-resources-verify DIGEST="${BASH_REMATCH[2]}"
      - if: always() && steps.entry.outputs.hit == 'true'
        name: Clean the verification release and tag created by this job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/scribe-release-publish.log"
          [[ -f "$log" ]] || exit 0
          tag="$(sed -n 's/^SCRIBE_RELEASE draft-requested tag=\(scribe-resources-verify-[0-9a-f]\{64\}\) digest=[0-9a-f]\{64\}$/\1/p' "$log")"
          [[ -n "$tag" ]] || exit 0
          [[ "$tag" =~ ^scribe-resources-verify-[0-9a-f]{64}$ ]] \
            || { echo 'SCRIBE_RELEASE InvalidCleanupTag' >&2; exit 2; }
          if metadata="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft 2>&1)"; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          else
            case "$metadata" in
              *'release not found'*|*'(HTTP 404)'*) ;;
              *) printf '%s\n' "$metadata" >&2; exit 1 ;;
            esac
            if error="$(gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" 2>&1)"; then
              :
            else
              case "$error" in
                *'(HTTP 404)'*) ;;
                *) printf '%s\n' "$error" >&2; exit 1 ;;
              esac
            fi
          fi
