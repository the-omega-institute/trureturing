name: CI publication verification

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify Linux native tools after restoring the fixed v6 snapshot
        type: choice
        options: [native-readback]
        required: true

permissions:
  contents: read

jobs:
  native-readback:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      SEED: lean-cache-verify-v3-56a005855ea17e0b0958f73ec801ae140b0a1679-linux-arm64-report-stratalint-raw-lean-report-v3-env-5a2260e99128-ci-44987188519-1
      SOURCE: d426d5066bdea01998b30966e03d379f06f8a9d7
      READER: 86076eb0c20938075ef649b3464df0e470fa518b
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE }}
          persist-credentials: false
      - name: Install the consumer's pinned tools
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE" ]]
          python3 .github/scripts/install-tools.py
          tools/scripts/workflow/install-lean-toolchain.sh lean-toolchain --github-path "$GITHUB_PATH"
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/checkout@v5
        with:
          repository: the-omega-institute/trureturing-tools
          ref: ${{ env.READER }}
          path: build/native-tools
          persist-credentials: false
      - name: Verify the Linux snapshot and restore with Actions storage disconnected
        run: |
          set -euo pipefail
          [[ "$(git -C build/native-tools rev-parse HEAD)" == "$READER" ]]
          gh release download "$SEED" -R "$GITHUB_REPOSITORY" --pattern manifest.json --dir "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP" && echo '0ac39cae4d4c31dc6a73744daca1cc1ed349fcd33c4eaedacb3279fe51c96847  manifest.json' | sha256sum -c -)
          jq -e --arg source "$SOURCE" '.schema == "lean-release-seed-v6" and .producer_commit_sha == $source and (.partition | endswith("/linux-arm64"))' "$RUNNER_TEMP/manifest.json"
          test ! -e .lake/build
          env -u GITHUB_ACTIONS -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_CACHE_URL -u ACTIONS_RESULTS_URL \
            python3 -u build/native-tools/tools/scripts/worktree/lean_cache_release.py \
            fetch --mode candidate --repository "$PWD" --tag "$SEED" --source-commit "$SOURCE" | tee "$RUNNER_TEMP/fetch.log"
          sed -n 's/^LEAN_CACHE_NATIVE //p' "$RUNNER_TEMP/fetch.log" | jq -es 'length == 1 and .[0].status == "invalidated" and .[0].products >= 6'
          sed -n 's/^LEAN_CACHE_FETCH //p' "$RUNNER_TEMP/fetch.log" | jq -es --arg tag "$SEED" --arg source "$SOURCE" 'length == 1 and .[0].resolved == $tag and .[0].producer_commit_sha == $source and .[0].status == "unpacked"'
          module=.lake/build/lib/lean/D5/S0/Tower/GoldenGapWord.olean
          test -s "$module"
          sha256sum "$module" > "$RUNNER_TEMP/module.sha256"
          for program in producer/bin/{dependencyReadout,inputDiscovery,reportInspector} reg/bin/{compiledJudgeTests,auricFibAnalysis,compiledFibTests}; do
            for sidecar in '' .hash .trace .rsp; do
              test ! -e ".lake/build/lean-inspector/$program$sidecar"
            done
          done
          df -h .
      - name: Rebuild both affected live executables with Lake on Linux ARM
        run: |
          set -euo pipefail
          bash tools/scripts/worktree/lean-cache-run.sh lake exe cache get
          make lean LEAN_TARGETS="leanInspector/dependencyReadout regInspector/compiledJudgeTests"
          for program in producer/bin/dependencyReadout reg/bin/compiledJudgeTests; do
            product=".lake/build/lean-inspector/$program"
            file "$product"
            readelf -h "$product" | grep -E 'Machine:[[:space:]]+AArch64'
          done
          sha256sum -c "$RUNNER_TEMP/module.sha256"
      - name: Read real module declarations and run the compiled judge suite
        run: |
          set -euo pipefail
          echo '{"modules":["D5.S0.Tower.GoldenGapWord"]}' > "$RUNNER_TEMP/request.json"
          lake -d tools/lean-inspector-reg env "$PWD/.lake/build/lean-inspector/producer/bin/dependencyReadout" "$RUNNER_TEMP/request.json" "$RUNNER_TEMP/response.json"
          jq -e '.modules | (length == 1 and .[0].module == "D5.S0.Tower.GoldenGapWord" and .[0].status == "ok" and (.[0].declarations | length > 0))' "$RUNNER_TEMP/response.json"
          jq -c '.modules[] | {module,status,declarations:(.declarations | length)}' "$RUNNER_TEMP/response.json"
          make compiled-judge-test
