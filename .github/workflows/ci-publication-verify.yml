name: Native Lean report preparation probe
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      PROJECT_KEY: lean-project-push-56a005855ea17e0b0958f73ec801ae140b0a1679-linux-arm64-44851467996-1
      DEPENDENCY_KEY: lean-dependency-v4-56a005855ea17e0b0958f73ec801ae140b0a1679-linux-arm64-44741122381-1
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 696c92214e1adc74d548258d5448ce6009daf970
          persist-credentials: false
      - run: make install-tools
      - id: keys
        run: python3 tools/scripts/worktree/lean_actions.py keys --repository "$GITHUB_WORKSPACE"
      - uses: actions/cache/restore@v5
        with:
          path: ~/.elan
          key: ${{ steps.keys.outputs.elan_key }}
      - run: tools/scripts/workflow/install-lean-toolchain.sh lean-toolchain --github-path "$GITHUB_PATH"
      - id: dependency
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.keys.outputs.dependency_archive_path }}
          key: ${{ env.DEPENDENCY_KEY }}
          fail-on-cache-miss: true
      - id: project
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.keys.outputs.project_archive_path }}
          key: ${{ env.PROJECT_KEY }}
          fail-on-cache-miss: true
      - name: Validate the two immutable native seeds
        run: |
          python3 tools/scripts/worktree/lean_actions.py restore --repository "$GITHUB_WORKSPACE" \
            --dependency-key "$DEPENDENCY_KEY" --dependency-outcome success --project-key "$PROJECT_KEY" --project-outcome success
      - name: Measure existing, newly compiled and replayed D5 and Reg outputs
        run: |
          test "$STRATALINT_ACTIONS_CACHE_SEEDED" = 1
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, shutil, subprocess, time
          modules = [
              "D5.S0.Computability.KernelComponentPayload",
              "Reg.Support.FieldLift",
              "D5.S3.Quantum.Analysis.RefinedBMVDimThreeInteger",
              "Reg.D5.S1.Words.Patterns.Separable.OccupiedMellinInterior",
          ]
          manifest = Path(os.environ["RUNNER_TEMP"]) / "native-seed-modules.json"
          manifest.write_text(json.dumps(modules))

          def snapshot():
              data = {}
              for module in modules:
                  stem = Path(".lake/build")
                  if module.startswith("Reg."):
                      stem /= "reg"
                  stem = stem / "lib/lean" / Path(*module.split("."))
                  for suffix in [".trace", ".olean", ".ilean"]:
                      path = stem.with_suffix(suffix)
                      if path.is_file():
                          with path.open("rb") as stream:
                              digest = hashlib.file_digest(stream, "sha256").hexdigest()
                          data[module + suffix] = [path.stat().st_mtime_ns, digest]
              return data

          def compile_inputs(previous, stage):
              start = time.monotonic()
              subprocess.run(["lake", "--log-level=error", "-d", "tools/lean-inspector-reg", "script", "run",
                              "leanInspector/compileReportModules", str(manifest)], check=True)
              result = snapshot()
              print(json.dumps(dict(stage=stage, seconds=round(time.monotonic() - start, 2),
                    reused=[name for name in result if previous.get(name) == result[name]],
                    added=sorted(result.keys() - previous.keys()),
                    rebuilt=[name for name in previous.keys() & result.keys() if previous[name] != result[name]],
                    disk_free_bytes=shutil.disk_usage(".").free)), flush=True)
              return result

          initial = snapshot()
          print(json.dumps(dict(stage="seed", files=sorted(initial), disk_free_bytes=shutil.disk_usage(".").free)), flush=True)
          current = compile_inputs(initial, "first-prepare")
          replay = compile_inputs(current, "second-prepare")
          if len(current) != 12 or current != replay:
              raise SystemExit("The current manifest did not produce stable files on replay")
          if any(initial.get(modules[0] + ext) != current[modules[0] + ext] for ext in [".trace", ".olean", ".ilean"]):
              raise SystemExit("The unchanged D5 control was not reused")
          PY
