name: CI publication verification

on:
  push:
    branches: ['integration-ci-*-tests']

permissions: {}

# This native integration event verifies the Lean-cache publication and restore
# programs. It is separate from the required CI workflows.
jobs:
  cache:
    name: verify cache publication and restore
    runs-on: runner-for-trureturing-cache-release-publish
    timeout-minutes: 120
    outputs:
      indexed-tag: ${{ steps.publish.outputs.indexed_tag }}
    permissions:
      contents: write
      actions: read
    env:
      STRATALINT_CACHE_WRITES: 'false'
      SHARD_HANDOFF: ${{ vars.LEAN_CACHE_SHARDS_REF == github.ref_name && vars.LEAN_CACHE_SHARDS_HANDOFF || 'legacy' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: entry
        name: Validate candidate, check the input patterns and strip checkout remote
        env:
          # The publication and restore programs and the build configuration they read.
          CI_HIT_PATHS: |
            .editorconfig
            .globalconfig
            .github/workflows/ci-publication-verify.yml
            .github/workflows/lean-analysis-fixtures.yml
            .github/workflows/lean-cache-publish.yml
            .github/actions/lean-cache-produce/action.yml
            .gitignore
            D5/*.lean
            Directory.Build.*
            Directory.Packages.props
            Makefile
            Meta/FILEMAP.toml
            Meta/ci-cache-paths.json
            NuGet.Config
            NuGet.config
            Reg/*.lean
            Reg/lake-manifest.json
            Reg/lakefile.*
            Trureturing.lean
            global.json
            lake-manifest.json
            lakefile.*
            lean-report-inputs.json
            lean-toolchain
            nuget.config
            tools/.editorconfig
            tools/.globalconfig
            tools/Architecture/*
            tools/Directory.Build.*
            tools/Directory.Packages.props
            tools/Makefile
            tools/NuGet.Config
            tools/NuGet.config
            tools/StrataLint.Engine/*
            tools/StrataLint.Engineering/*
            tools/StrataLint.Lean/*
            tools/StrataLint.Runtime/*
            tools/Trureturing.Truth/*
            tools/global.json
            tools/lean-inspector/*
            tools/lean-inspector-interface/*
            tools/lean-inspector-reg/*
            tools/nuget.config
            tools/scripts/dotnet-build.sh
            tools/scripts/lean-report-pair.sh
            tools/scripts/lib/resource-observation-lib.sh
            tools/scripts/report/*
            tools/scripts/workflow/ci-entry.sh
            tools/scripts/workflow/install-lean-toolchain.sh
            tools/scripts/worktree/*
          CI_PUSH_BEFORE: ${{ github.event.before }}
        run: bash tools/scripts/workflow/ci-entry.sh
      - name: Validate entry result
        env:
          HIT: ${{ steps.entry.outputs.hit }}
        run: case "$HIT" in true|false) ;; *) echo "CI_ENTRY_ERROR hit output is '$HIT'" >&2; exit 2 ;; esac
      - name: Read the pinned .NET SDK version
        id: dotnet-sdk
        if: steps.entry.outputs.hit == 'true'
        run: |
          version="$(jq -er '.sdk.version' global.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - if: steps.entry.outputs.hit == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ steps.dotnet-sdk.outputs.version }}
      - if: steps.entry.outputs.hit == 'true'
        run: make -C tools dotnet DOTNET_PROJECT=tools/StrataLint.Lean/StrataLint.Lean.csproj
      - if: steps.entry.outputs.hit == 'true'
        id: keys
        run: python3 tools/scripts/worktree/lean_actions.py keys --repository "$GITHUB_WORKSPACE"
      - id: elan
        if: steps.entry.outputs.hit == 'true' && steps.keys.outputs.elan_key != ''
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ~/.elan
          key: ${{ steps.keys.outputs.elan_key }}
      - if: steps.entry.outputs.hit == 'true'
        run: tools/scripts/workflow/install-lean-toolchain.sh lean-toolchain --github-path "$GITHUB_PATH"
      - id: dependency
        if: steps.entry.outputs.hit == 'true' && steps.keys.outputs.dependency_key != ''
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.keys.outputs.dependency_archive_path }}
          key: ${{ steps.keys.outputs.dependency_key }}
          restore-keys: ${{ steps.keys.outputs.dependency_restore_prefix }}
      - if: steps.entry.outputs.hit == 'true'
        name: Check the selected cache handoff scenario
        run: |
          case "$SHARD_HANDOFF" in complete|partial|none|legacy) ;; *) exit 2 ;; esac
      - id: shards
        name: Restore the selected sharded project seed
        if: steps.entry.outputs.hit == 'true' && (env.SHARD_HANDOFF == 'complete' || env.SHARD_HANDOFF == 'partial')
        uses: ./.github/actions/lean-cache-shards
        with:
          operation: restore
          require-complete: ${{ env.SHARD_HANDOFF == 'complete' }}
          targets: ${{ env.SHARD_HANDOFF == 'partial' && 'D5.S0.Tower.GoldenGapWord' || '' }}
      - if: steps.entry.outputs.hit == 'true' && env.SHARD_HANDOFF != 'legacy'
        name: Check the cache handoff evidence
        env:
          AVAILABLE: ${{ steps.shards.outputs.available }}
          COMPLETE: ${{ steps.shards.outputs.complete }}
        run: |
          case "$SHARD_HANDOFF" in
            complete) [[ "$AVAILABLE" =~ ^[1-9][0-9]*$ && "$COMPLETE" == true ]] ;;
            partial) [[ "$AVAILABLE" =~ ^[1-9][0-9]*$ && "$COMPLETE" == false ]] ;;
            none) [[ ! -e .lake/build ]] ;;
          esac
          echo "LEAN_RELEASE_HANDOFF seed=$SHARD_HANDOFF available=${AVAILABLE:-0} complete=${COMPLETE:-false}"
      - id: project
        if: steps.entry.outputs.hit == 'true' && env.SHARD_HANDOFF == 'legacy' && steps.keys.outputs.project_key != ''
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.keys.outputs.project_archive_path }}
          key: ${{ steps.keys.outputs.project_key }}
          restore-keys: ${{ steps.keys.outputs.project_restore_prefix }}
      - if: steps.entry.outputs.hit == 'true'
        name: Restore optional validated seeds
        env:
          DEPENDENCY_KEY: ${{ steps.dependency.outputs.cache-matched-key }}
          PROJECT_KEY: ${{ steps.project.outputs.cache-matched-key }}
          DEPENDENCY_OUTCOME: ${{ steps.dependency.outcome }}
          PROJECT_OUTCOME: ${{ steps.project.outcome }}
        run: python3 tools/scripts/worktree/lean_actions.py restore --repository "$GITHUB_WORKSPACE" --dependency-key "$DEPENDENCY_KEY" --project-key "$PROJECT_KEY" --dependency-outcome "$DEPENDENCY_OUTCOME" --project-outcome "$PROJECT_OUTCOME"
      - if: steps.entry.outputs.hit == 'true' && env.SHARD_HANDOFF != 'legacy'
        name: Complete the project compiler outputs for the pinned source
        env:
          STRATALINT_ACCEPT_COLD_BUILD: '1'
        run: make lean FULL_BUILD=1
      - id: publish
        if: steps.entry.outputs.hit == 'true'
        name: Publish and restore an isolated verification snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          receipt="$RUNNER_TEMP/indexed-cache-publish.log"
          make lean-cache-to-github-without-mathlib FULL_BUILD=1 LEAN_CACHE_INDEXED=1 LEAN_CACHE_MODE=verification LEAN_CACHE_SOURCE_REF="$GITHUB_REF" LEAN_CACHE_SOURCE_COMMIT="$GITHUB_SHA" | tee "$receipt"
          tag="$(sed -n 's/^LEAN_CACHE_PUBLISH //p' "$receipt" | jq -er 'select(.status == "published") | .tag')"
          [[ "$tag" == lean-cache-verify-v2-* ]]
          echo "indexed_tag=$tag" >> "$GITHUB_OUTPUT"

  indexed-consumer:
    name: Verify indexed Release recovery in a clean checkout
    needs: cache
    if: needs.cache.outputs.indexed-tag != ''
    runs-on: runner-for-trureturing-cache-release-publish
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        restore: [full, scoped]
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      LEAN_CACHE_TAG: ${{ needs.cache.outputs.indexed-tag }}
      LEAN_CACHE_SOURCE_COMMIT: ${{ github.sha }}
      LEAN_CACHE_MODE: candidate
      RESTORE: ${{ matrix.restore }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: tools/scripts/workflow/install-lean-toolchain.sh lean-toolchain --github-path "$GITHUB_PATH"
      - name: Restore from Release assets
        run: |
          test ! -e .lake/build
          if [[ "$RESTORE" == scoped ]]; then
            export LEAN_CACHE_TARGETS=D5.S0.Tower.GoldenGapWord
          fi
          env -u GITHUB_ACTIONS -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_CACHE_URL -u ACTIONS_RESULTS_URL \
            make lean-cache-from-github-without-mathlib
          test -s .lake/build/lib/lean/D5/S0/Tower/GoldenGapWord.olean
          if [[ "$RESTORE" == full ]]; then
            test -s .lake/build/stratalint/raw-lean-report.json.reuse.json
          fi

  cache-shards:
    name: Verify Lean cache continuation transport
    if: github.ref_protected
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write
    env:
      STRATALINT_CACHE_WRITES: 'true'
      CACHE_SCOPE: D5.S0.Tower.GoldenGapWord
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2002
          persist-credentials: false
      - id: entry
        name: Validate source and select cache transport changes
        env:
          CI_HIT_PATHS: |
            .github/actions/lean-cache-shards/*
            .github/workflows/ci-publication-verify.yml
            tools/scripts/worktree/lean_actions_shards.py
            tools/scripts/worktree/lean_cache_shards.py
          CI_PUSH_BEFORE: ${{ github.event.before }}
        run: bash tools/scripts/workflow/ci-entry.sh
      - if: steps.entry.outputs.hit == 'true'
        id: keys
        run: python3 tools/scripts/worktree/lean_actions.py keys --repository "$GITHUB_WORKSPACE"
      - if: steps.entry.outputs.hit == 'true'
        uses: actions/cache/restore@v5
        with:
          path: ~/.elan
          key: ${{ steps.keys.outputs.elan_key }}
      - if: steps.entry.outputs.hit == 'true'
        run: tools/scripts/workflow/install-lean-toolchain.sh lean-toolchain --github-path "$GITHUB_PATH"
      - if: steps.entry.outputs.hit == 'true'
        id: dependency
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.keys.outputs.dependency_archive_path }}
          key: ${{ steps.keys.outputs.dependency_key }}
          restore-keys: ${{ steps.keys.outputs.dependency_restore_prefix }}
      - if: steps.entry.outputs.hit == 'true'
        name: Prepare Lean dependencies and build the scoped checkpoint
        env:
          DEPENDENCY_KEY: ${{ steps.dependency.outputs.cache-matched-key }}
          DEPENDENCY_OUTCOME: ${{ steps.dependency.outcome }}
        run: |
          python3 tools/scripts/worktree/lean_actions.py restore --layers dependency --dependency-key "$DEPENDENCY_KEY" --dependency-outcome "$DEPENDENCY_OUTCOME"
          make lean LEAN_TARGETS="$CACHE_SCOPE"
      - if: steps.entry.outputs.hit == 'true'
        id: checkpoint
        name: Save scoped producer continuation
        uses: ./.github/actions/lean-cache-shards
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          operation: save
          state: resume
          anchor: ${{ github.event.before }}
          targets: ${{ env.CACHE_SCOPE }}
      - if: steps.entry.outputs.hit == 'true'
        name: Isolate the restored build
        run: |
          test -f .lake/build/lib/lean/D5/S0/Tower/GoldenGapWord.olean
          mv .lake/build .lake/shard-verification-source
      - if: steps.entry.outputs.hit == 'true'
        id: resumed
        name: Restore the immutable producer continuation
        uses: ./.github/actions/lean-cache-shards
        with:
          operation: restore
          state: resume
          targets: ${{ env.CACHE_SCOPE }}
      - if: steps.entry.outputs.hit == 'true'
        name: Check the recovered bytes and Lake freshness
        env:
          SAVED: ${{ steps.checkpoint.outputs.available }}
          UNSAVED: ${{ steps.checkpoint.outputs.missing }}
          RESTORED: ${{ steps.resumed.outputs.available }}
          MISSING: ${{ steps.resumed.outputs.missing }}
        run: |
          [[ "$SAVED" =~ ^[1-9][0-9]*$ && "$SAVED" == "$RESTORED" && "$UNSAVED" == 0 && "$MISSING" == 0 ]]
          path=lib/lean/D5/S0/Tower/GoldenGapWord.olean
          cmp ".lake/shard-verification-source/$path" ".lake/build/$path"
          lake --no-build build "$CACHE_SCOPE"

      - if: steps.entry.outputs.hit == 'true'
        name: Evict one entry of this run's incomplete index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          index=build/lean-cache/shards/index.json
          prefix="$(python3 tools/scripts/worktree/lean_actions_shards.py identity --state resume | jq -er .prefix)"
          digest="$(jq -er '.entries | to_entries[0].value' "$index")"
          gh cache delete --ref "$GITHUB_REF" "${prefix}material-$digest"
          mv .lake/build .lake/shard-verification-recovered
      - if: steps.entry.outputs.hit == 'true'
        id: evicted
        name: Restore remaining checkpoint entries
        uses: ./.github/actions/lean-cache-shards
        with:
          operation: restore
          state: resume
          targets: ${{ env.CACHE_SCOPE }}
      - if: steps.entry.outputs.hit == 'true'
        name: Rebuild the missing checkpoint entry through Lake
        env:
          SAVED: ${{ steps.checkpoint.outputs.available }}
          AVAILABLE: ${{ steps.evicted.outputs.available }}
          MISSING: ${{ steps.evicted.outputs.missing }}
        run: |
          [[ "$AVAILABLE" =~ ^[0-9]+$ && "$MISSING" == 1 && $((AVAILABLE + 1)) == "$SAVED" ]]
          make lean LEAN_TARGETS="$CACHE_SCOPE"
          lake --no-build build "$CACHE_SCOPE"

  scribe:
    name: verify Scribe publication and fetch
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: write
    concurrency:
      group: scribe-resources-verification
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: entry
        name: Validate candidate, check the input patterns and strip checkout remote
        env:
          CI_HIT_PATHS: |
            .editorconfig
            .globalconfig
            .github/workflows/ci-publication-verify.yml
            .github/workflows/scribe-release-publish.yml
            .gitignore
            Blueprint/*.scribe.cs
            Directory.Build.*
            Directory.Packages.props
            Golden/Projection/*.json
            Makefile
            Meta/FILEMAP.toml
            NuGet.Config
            NuGet.config
            global.json
            nuget.config
            tools/.editorconfig
            tools/.globalconfig
            tools/Architecture/*
            tools/Directory.Build.*
            tools/Directory.Packages.props
            tools/NuGet.Config
            tools/NuGet.config
            tools/StrataLint.Engine/*
            tools/StrataLint.Engineering/*
            tools/StrataLint.Runtime/*
            tools/StrataLint.Scribe/*
            tools/Trureturing.Truth/*
            tools/nuget.config
            tools/scripts/scribe-release.sh
            tools/scripts/workflow/ci-entry.sh
          CI_PUSH_BEFORE: ${{ github.event.before }}
        run: bash tools/scripts/workflow/ci-entry.sh
      - name: Validate entry result
        env:
          HIT: ${{ steps.entry.outputs.hit }}
        run: case "$HIT" in true|false) ;; *) echo "CI_ENTRY_ERROR hit output is '$HIT'" >&2; exit 2 ;; esac
      - name: Read the pinned .NET SDK version
        id: dotnet-sdk
        if: steps.entry.outputs.hit == 'true'
        run: |
          version="$(jq -er '.sdk.version' global.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - if: steps.entry.outputs.hit == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ steps.dotnet-sdk.outputs.version }}
      - if: steps.entry.outputs.hit == 'true'
        name: Publish an isolated verification resource pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          make scribe-release-publish PREFIX=scribe-resources-verify TARGET="$GITHUB_SHA" \
            | tee "$RUNNER_TEMP/scribe-release-publish.log"
      - if: steps.entry.outputs.hit == 'true'
        name: Fetch the exact verification digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          receipt="$(tail -n 1 "$RUNNER_TEMP/scribe-release-publish.log")"
          [[ "$receipt" =~ ^SCRIBE_RELEASE\ (published|reused)\ tag=scribe-resources-verify-[0-9a-f]{64}\ digest=([0-9a-f]{64})$ ]] \
            || { echo 'SCRIBE_RELEASE InvalidPublicationReceipt' >&2; exit 2; }
          make scribe-release-fetch PREFIX=scribe-resources-verify DIGEST="${BASH_REMATCH[2]}"
      - if: always() && steps.entry.outputs.hit == 'true'
        name: Clean the verification release and tag created by this job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/scribe-release-publish.log"
          [[ -f "$log" ]] || exit 0
          tag="$(sed -n 's/^SCRIBE_RELEASE draft-requested tag=\(scribe-resources-verify-[0-9a-f]\{64\}\) digest=[0-9a-f]\{64\}$/\1/p' "$log")"
          [[ -n "$tag" ]] || exit 0
          [[ "$tag" =~ ^scribe-resources-verify-[0-9a-f]{64}$ ]] \
            || { echo 'SCRIBE_RELEASE InvalidCleanupTag' >&2; exit 2; }
          if metadata="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft 2>&1)"; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          else
            case "$metadata" in
              *'release not found'*|*'(HTTP 404)'*) ;;
              *) printf '%s\n' "$metadata" >&2; exit 1 ;;
            esac
            if error="$(gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" 2>&1)"; then
              :
            else
              case "$error" in
                *'(HTTP 404)'*) ;;
                *) printf '%s\n' "$error" >&2; exit 1 ;;
              esac
            fi
          fi
