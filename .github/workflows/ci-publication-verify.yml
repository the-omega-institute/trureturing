name: Measure active Lean compiler frontends
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 1966c9a01dc8b3b03adaeb96d53f9c1134026db6
          persist-credentials: false
      - uses: actions/cache/restore@v5
        with:
          path: ~/.elan
          key: elan-pinned-linux-arm64-ca5f1f601d34c49079e38d7e7041eb0f2a9c227fbc1df0f404820069a052330c
          fail-on-cache-miss: true
      - name: Count real compiler overlap and resolve active module PIDs
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake --version
          python3 - <<'PYTHON'
          from pathlib import Path
          import os, shutil, subprocess, tempfile, time
          source = Path('.github/actions/lean-compile-layer/measure.sh').read_text()
          source = source.split("<<'PY' &\n", 1)[1].split('\nlake_progress = ', 1)[0]
          observer = {}
          exec(compile(source, 'feature-observer', 'exec'), observer)
          with tempfile.TemporaryDirectory(dir=os.environ["RUNNER_TEMP"]) as tmp:
              repo = Path(tmp)
              shutil.copy('lean-toolchain', repo)
              (repo/'lakefile.toml').write_text('name="probe"\nversion="0.1.0"\nweakLeanArgs=["-j1"]\n[[lean_lib]]\nname="D5"\n')
              (repo/'D5').mkdir()
              for i in range(8):
                  (repo/'D5'/f'Item{i}.lean').write_text(
                      f'import Lean\n#eval do\n  let h ← IO.FS.Handle.mk "{repo}/events" .append\n'
                      f'  h.putStrLn s!"start {i} {{← IO.Process.getPID}}"\n  h.flush\n  IO.sleep 1100\n'
                      f'  h.putStrLn s!"end {i} {{← IO.Process.getPID}}"\n  h.flush\n')
              (repo/'D5.lean').write_text(''.join(f'import D5.Item{i}\n' for i in range(8)))
              for limit in (4, 2, 1):
                  shutil.rmtree(repo/'.lake/build', ignore_errors=True)
                  events = repo/'events'
                  events.unlink(missing_ok=True)
                  mapped = set()
                  with subprocess.Popen(['lake', 'build', 'D5'], cwd=repo,
                                        env={**os.environ, 'LEAN_NUM_THREADS': str(limit)}) as child:
                      while child.poll() is None:
                          if events.exists():
                              for row in events.read_text().splitlines():
                                  if len(row.split()) != 3:
                                      continue
                                  phase, number, pid = row.split()
                                  if phase == 'start' and int(pid) not in mapped:
                                      proc = Path('/proc')/pid
                                      if observer['lean_module'](proc, repo) == f'D5.Item{number}':
                                          mapped.add(int(pid))
                          time.sleep(.075)
                      if child.returncode:
                          raise SystemExit(child.returncode)
                  active = set()
                  peak = 0
                  for line in events.read_text().splitlines():
                      phase, number, pid = line.split()
                      if phase == 'start':
                          active.add(pid)
                      else:
                          active.remove(pid)
                      peak = max(peak, len(active))
                  print(f'LEAN_FRONTEND_PROBE threads={limit} peak={peak} verified_process_modules={len(mapped)}', flush=True)
                  if peak != limit or len(mapped) != 8:
                      raise SystemExit('Compiler overlap or Linux process source attribution differed')
          PYTHON
