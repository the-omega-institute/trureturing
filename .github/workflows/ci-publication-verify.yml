name: CI publication verification

on:
  push:
    branches: ['integration-ci-*-tests']

permissions: {}

# This native integration event verifies the Lean-cache publication and restore
# programs. It is separate from the required CI workflows.
jobs:
  cache:
    name: verify cache publication and restore
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    env:
      STRATALINT_CACHE_WRITES: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: entry
        name: Validate candidate, check the input patterns and strip checkout remote
        env:
          # The publication and restore programs and the build configuration they read.
          CI_HIT_PATHS: |
            .editorconfig
            .globalconfig
            .github/workflows/ci-publication-verify.yml
            .github/workflows/lean-analysis-fixtures.yml
            .github/workflows/lean-cache-publish.yml
            .gitignore
            D5/*.lean
            Directory.Build.*
            Directory.Packages.props
            Makefile
            Meta/FILEMAP.toml
            Meta/ci-cache-paths.json
            NuGet.Config
            NuGet.config
            Reg/*.lean
            Reg/lake-manifest.json
            Reg/lakefile.*
            Trureturing.lean
            global.json
            lake-manifest.json
            lakefile.*
            lean-report-inputs.json
            lean-toolchain
            nuget.config
            tools/.editorconfig
            tools/.globalconfig
            tools/Architecture/*
            tools/Directory.Build.*
            tools/Directory.Packages.props
            tools/Makefile
            tools/NuGet.Config
            tools/NuGet.config
            tools/StrataLint.Engine/*
            tools/StrataLint.Engineering/*
            tools/StrataLint.Lean/*
            tools/StrataLint.Runtime/*
            tools/Trureturing.Truth/*
            tools/global.json
            tools/lean-inspector/*
            tools/lean-inspector-interface/*
            tools/lean-inspector-reg/*
            tools/nuget.config
            tools/scripts/dotnet-build.sh
            tools/scripts/lean-report-pair.sh
            tools/scripts/lib/resource-observation-lib.sh
            tools/scripts/report/*
            tools/scripts/workflow/ci-entry.sh
            tools/scripts/workflow/install-lean-toolchain.sh
            tools/scripts/worktree/*
          CI_PUSH_BEFORE: ${{ github.event.before }}
        run: bash tools/scripts/workflow/ci-entry.sh
      - name: Validate entry result
        env:
          HIT: ${{ steps.entry.outputs.hit }}
        run: case "$HIT" in true|false) ;; *) echo "CI_ENTRY_ERROR hit output is '$HIT'" >&2; exit 2 ;; esac
      - if: steps.entry.outputs.hit == 'true'
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - if: steps.entry.outputs.hit == 'true'
        run: make -C tools dotnet DOTNET_PROJECT=tools/StrataLint.Lean/StrataLint.Lean.csproj
      - if: steps.entry.outputs.hit == 'true'
        id: keys
        run: python3 tools/scripts/worktree/lean_actions.py keys --repository "$GITHUB_WORKSPACE"
      - id: elan
        if: steps.entry.outputs.hit == 'true' && steps.keys.outputs.elan_key != ''
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ~/.elan
          key: ${{ steps.keys.outputs.elan_key }}
      - if: steps.entry.outputs.hit == 'true'
        run: tools/scripts/workflow/install-lean-toolchain.sh lean-toolchain --github-path "$GITHUB_PATH"
      - id: dependency
        if: steps.entry.outputs.hit == 'true' && steps.keys.outputs.dependency_key != ''
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.keys.outputs.dependency_archive_path }}
          key: ${{ steps.keys.outputs.dependency_key }}
          restore-keys: ${{ steps.keys.outputs.dependency_restore_prefix }}
      - id: project
        if: steps.entry.outputs.hit == 'true' && steps.keys.outputs.project_key != ''
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.keys.outputs.project_archive_path }}
          key: ${{ steps.keys.outputs.project_key }}
          restore-keys: ${{ steps.keys.outputs.project_restore_prefix }}
      - if: steps.entry.outputs.hit == 'true'
        name: Restore optional validated seeds
        env:
          DEPENDENCY_KEY: ${{ steps.dependency.outputs.cache-matched-key }}
          PROJECT_KEY: ${{ steps.project.outputs.cache-matched-key }}
          DEPENDENCY_OUTCOME: ${{ steps.dependency.outcome }}
          PROJECT_OUTCOME: ${{ steps.project.outcome }}
        run: python3 tools/scripts/worktree/lean_actions.py restore --repository "$GITHUB_WORKSPACE" --dependency-key "$DEPENDENCY_KEY" --project-key "$PROJECT_KEY" --dependency-outcome "$DEPENDENCY_OUTCOME" --project-outcome "$PROJECT_OUTCOME"
      - if: steps.entry.outputs.hit == 'true'
        name: Publish and restore an isolated verification snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: make lean-cache-to-github-without-mathlib LEAN_CACHE_MODE=verification LEAN_CACHE_SOURCE_REF="$GITHUB_REF" LEAN_CACHE_SOURCE_COMMIT="$GITHUB_SHA"

  scribe:
    name: verify Scribe publication and fetch
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: write
    concurrency:
      group: scribe-resources-verification
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: entry
        name: Validate candidate, check the input patterns and strip checkout remote
        env:
          CI_HIT_PATHS: |
            .editorconfig
            .globalconfig
            .github/workflows/ci-publication-verify.yml
            .github/workflows/scribe-release-publish.yml
            .gitignore
            Blueprint/*.scribe.cs
            Directory.Build.*
            Directory.Packages.props
            Golden/Projection/*.json
            Makefile
            Meta/FILEMAP.toml
            NuGet.Config
            NuGet.config
            global.json
            nuget.config
            tools/.editorconfig
            tools/.globalconfig
            tools/Architecture/*
            tools/Directory.Build.*
            tools/Directory.Packages.props
            tools/NuGet.Config
            tools/NuGet.config
            tools/StrataLint.Engine/*
            tools/StrataLint.Engineering/*
            tools/StrataLint.Runtime/*
            tools/StrataLint.Scribe/*
            tools/Trureturing.Truth/*
            tools/nuget.config
            tools/scripts/scribe-release.sh
            tools/scripts/workflow/ci-entry.sh
          CI_PUSH_BEFORE: ${{ github.event.before }}
        run: bash tools/scripts/workflow/ci-entry.sh
      - name: Validate entry result
        env:
          HIT: ${{ steps.entry.outputs.hit }}
        run: case "$HIT" in true|false) ;; *) echo "CI_ENTRY_ERROR hit output is '$HIT'" >&2; exit 2 ;; esac
      - if: steps.entry.outputs.hit == 'true'
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - if: steps.entry.outputs.hit == 'true'
        name: Publish an isolated verification resource pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          make scribe-release-publish PREFIX=scribe-resources-verify TARGET="$GITHUB_SHA" \
            | tee "$RUNNER_TEMP/scribe-release-publish.log"
      - if: steps.entry.outputs.hit == 'true'
        name: Fetch the exact verification digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          receipt="$(tail -n 1 "$RUNNER_TEMP/scribe-release-publish.log")"
          [[ "$receipt" =~ ^SCRIBE_RELEASE\ (published|reused)\ tag=scribe-resources-verify-[0-9a-f]{64}\ digest=([0-9a-f]{64})$ ]] \
            || { echo 'SCRIBE_RELEASE InvalidPublicationReceipt' >&2; exit 2; }
          make scribe-release-fetch PREFIX=scribe-resources-verify DIGEST="${BASH_REMATCH[2]}"
      - if: always() && steps.entry.outputs.hit == 'true'
        name: Clean the verification release and tag created by this job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/scribe-release-publish.log"
          [[ -f "$log" ]] || exit 0
          tag="$(sed -n 's/^SCRIBE_RELEASE draft-requested tag=\(scribe-resources-verify-[0-9a-f]\{64\}\) digest=[0-9a-f]\{64\}$/\1/p' "$log")"
          [[ -n "$tag" ]] || exit 0
          [[ "$tag" =~ ^scribe-resources-verify-[0-9a-f]{64}$ ]] \
            || { echo 'SCRIBE_RELEASE InvalidCleanupTag' >&2; exit 2; }
          if metadata="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft 2>&1)"; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          else
            case "$metadata" in
              *'release not found'*|*'(HTTP 404)'*) ;;
              *) printf '%s\n' "$metadata" >&2; exit 1 ;;
            esac
            if error="$(gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" 2>&1)"; then
              :
            else
              case "$error" in
                *'(HTTP 404)'*) ;;
                *) printf '%s\n' "$error" >&2; exit 1 ;;
              esac
            fi
          fi
