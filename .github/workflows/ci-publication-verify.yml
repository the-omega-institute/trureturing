name: Measure publisher storage through seed restoration

on:
  push:
    branches: ['integration-ci-lean-cache-shards-disk-31553-tests']
  workflow_dispatch:
    inputs:
      mode:
        description: Project seed for Release verification
        type: choice
        options: [complete, partial, none, legacy]
        required: true
      checkpoint_run:
        description: Optional earlier checkpoint run for the same commit and cold mode
        type: string
      checkpoint_seconds:
        description: Cold build interval before saving a checkpoint (0 runs the normal build)
        type: string
        default: '0'

permissions: {}

# This native integration event verifies the Lean-cache publication and restore
# programs. It is separate from the required CI workflows.
jobs:
  cache:
    name: Measure the native publisher before and after restoring its seeds
    if: github.event_name == 'push' || (github.ref_protected && startsWith(github.ref, 'refs/heads/integration-ci-') && endsWith(github.ref, '-tests') && vars.LEAN_CACHE_SHARDS_REF == github.ref_name && vars.LEAN_CACHE_SHARDS_HISTORY_ANCHOR != '')
    runs-on: ubuntu-24.04-arm
    # Cold and partial seed scenarios exercise the scheduled Release build.
    timeout-minutes: ${{ (github.event_name == 'workflow_dispatch' || (vars.LEAN_CACHE_SHARDS_REF == github.ref_name && contains(fromJSON('["none","partial"]'), vars.LEAN_CACHE_SHARDS_HANDOFF))) && 360 || 120 }}
    permissions:
      contents: read
      actions: read
    concurrency:
      group: lean-cache-publisher-disk-observation
      queue: max
      cancel-in-progress: false
    env:
      STRATALINT_CACHE_WRITES: 'false'
      SHARD_HANDOFF: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || vars.LEAN_CACHE_SHARDS_REF == github.ref_name && vars.LEAN_CACHE_SHARDS_HANDOFF || 'legacy' }}
      CHECKPOINT_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.checkpoint_seconds || '420' }}
    steps:
      - name: Measure storage before checkout
        run: |
          cat > "$RUNNER_TEMP/measure-lean-publisher-disk.py" <<'PYTHON'
          from pathlib import Path
          import json
          import os
          import shutil
          import subprocess
          import sys

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          reading = {"phase": sys.argv[1], "runner": os.environ["RUNNER_NAME"]}
          for label, path in (("workspace", workspace), ("temp", Path(os.environ["RUNNER_TEMP"]))):
              disk = shutil.disk_usage(path)
              reading[label] = {"device": path.stat().st_dev, "total_bytes": disk.total,
                                "used_bytes": disk.used, "available_bytes": disk.free}
          for item in (".lake/build", ".lake/packages"):
              path = workspace / item
              reading[item] = (int(subprocess.check_output(
                  ["du", "--summarize", "--block-size=1", "--one-file-system", "--", str(path)]
              ).split()[0]) if path.is_dir() else None)
          print("LEAN_PUBLISHER_DISK " + json.dumps(reading), flush=True)
          PYTHON
          python3 "$RUNNER_TEMP/measure-lean-publisher-disk.py" start
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the pinned tools release
        run: python3 .github/scripts/install-tools.py
      - name: Fetch the fixed dev history for cold build checkpoints
        if: contains(fromJSON('["none","partial"]'), env.SHARD_HANDOFF) && env.CHECKPOINT_SECONDS != '0' && vars.LEAN_CACHE_SHARDS_HISTORY_ANCHOR != ''
        env:
          ANCHOR: ${{ vars.LEAN_CACHE_SHARDS_HISTORY_ANCHOR }}
        run: |
          [[ "$ANCHOR" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=2002 origin "$ANCHOR"
          [[ "$(git rev-parse FETCH_HEAD)" == "$ANCHOR" ]]
      - id: entry
        name: Validate candidate, check the input patterns and strip checkout remote
        env:
          # The publication and restore programs and the build configuration they read.
          CI_HIT_PATHS: |
            .editorconfig
            .globalconfig
            .github/scripts/install-tools.py
            Meta/tools-release.json
            .github/workflows/ci-publication-verify.yml
            .github/workflows/lean-analysis-fixtures.yml
            .github/workflows/lean-cache-publish.yml
            .github/actions/lean-cache-produce/action.yml
            .github/actions/lean-cache-release-seed/*
            .github/actions/lean-cache-shards/*
            .gitignore
            D5/*.lean
            Directory.Build.*
            Directory.Packages.props
            Makefile
            Meta/FILEMAP.toml
            Meta/ci-cache-paths.json
            NuGet.Config
            NuGet.config
            Reg/*.lean
            Reg/lake-manifest.json
            Reg/lakefile.*
            Trureturing.lean
            global.json
            lake-manifest.json
            lakefile.*
            lean-report-inputs.json
            lean-toolchain
            nuget.config
          CI_PUSH_BEFORE: ${{ github.event.before }}
          CI_PUSH_RANGE: optional
        run: bash tools/scripts/workflow/ci-entry.sh
      - name: Validate entry result
        env:
          HIT: ${{ steps.entry.outputs.hit }}
        run: case "$HIT" in true|false) ;; *) echo "CI_ENTRY_ERROR hit output is '$HIT'" >&2; exit 2 ;; esac
      - name: Bind the protected dispatch checkout
        if: github.event_name == 'workflow_dispatch'
        env:
          CHECKPOINT_RUN: ${{ inputs.checkpoint_run }}
        run: |
          case "$SHARD_HANDOFF" in
            complete|legacy) [[ -z "$CHECKPOINT_RUN" && "$CHECKPOINT_SECONDS" == 0 ]] ;;
            none|partial)
              [[ "$CHECKPOINT_SECONDS" =~ ^(0|[1-9][0-9]{0,4})$ && "$CHECKPOINT_SECONDS" -lt 21600 ]]
              [[ -z "$CHECKPOINT_RUN" || ( "$CHECKPOINT_RUN" =~ ^[1-9][0-9]*$ && "$CHECKPOINT_RUN" != "$GITHUB_RUN_ID" ) ]]
              ;;
            *) exit 2 ;;
          esac
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          {
            echo 'STRATALINT_CACHE_SOURCE_VALIDATED=true'
            echo "STRATALINT_CACHE_SOURCE_REF=$GITHUB_REF"
            echo "STRATALINT_CACHE_SOURCE_COMMIT=$GITHUB_SHA"
            echo "STRATALINT_CACHE_CHECKED_OUT_SHA=$GITHUB_SHA"
          } >> "$GITHUB_ENV"
      - name: Read the pinned .NET SDK version
        id: dotnet-sdk
        if: steps.entry.outputs.hit == 'true'
        run: |
          version="$(jq -er '.sdk.version' global.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - if: steps.entry.outputs.hit == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ steps.dotnet-sdk.outputs.version }}
      - if: steps.entry.outputs.hit == 'true'
        run: make -C tools dotnet DOTNET_PROJECT=tools/StrataLint.Lean/StrataLint.Lean.csproj
      - if: steps.entry.outputs.hit == 'true'
        id: keys
        run: python3 tools/scripts/worktree/lean_actions.py keys --repository "$GITHUB_WORKSPACE"
      - id: elan
        if: steps.entry.outputs.hit == 'true' && steps.keys.outputs.elan_key != ''
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ~/.elan
          key: ${{ steps.keys.outputs.elan_key }}
      - if: steps.entry.outputs.hit == 'true'
        run: tools/scripts/workflow/install-lean-toolchain.sh lean-toolchain --github-path "$GITHUB_PATH"
      - name: Measure storage before seed
        if: steps.entry.outputs.hit == 'true'
        run: python3 "$RUNNER_TEMP/measure-lean-publisher-disk.py" before_seed
      - name: Restore the selected Release build seeds
        if: steps.entry.outputs.hit == 'true'
        uses: ./.github/actions/lean-cache-release-seed
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          mode: ${{ env.SHARD_HANDOFF }}
          cache-keys: ${{ toJSON(steps.keys.outputs) }}
          verification-history-anchor: ${{ contains(fromJSON('["none","partial"]'), env.SHARD_HANDOFF) && vars.LEAN_CACHE_SHARDS_HISTORY_ANCHOR || '' }}
          checkpoint-run: ${{ inputs.checkpoint_run || '' }}
          checkpoint-seconds: ${{ contains(fromJSON('["none","partial"]'), env.SHARD_HANDOFF) && vars.LEAN_CACHE_SHARDS_HISTORY_ANCHOR != '' && env.CHECKPOINT_SECONDS || '0' }}
      - name: Measure storage after seed
        if: steps.entry.outputs.hit == 'true'
        run: python3 "$RUNNER_TEMP/measure-lean-publisher-disk.py" after_seed
