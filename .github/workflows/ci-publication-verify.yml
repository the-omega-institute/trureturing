name: CI publication verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoped:
    name: Verify indexed Release recovery in a clean checkout (scoped)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      RESTORE: scoped
      LEAN_CACHE_MODE: candidate
      LEAN_CACHE_SOURCE_COMMIT: d426d5066bdea01998b30966e03d379f06f8a9d7
      LEAN_CACHE_TAG: lean-cache-verify-v3-56a005855ea17e0b0958f73ec801ae140b0a1679-linux-arm64-report-stratalint-raw-lean-report-v3-env-5a2260e99128-ci-44987188519-1
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.LEAN_CACHE_SOURCE_COMMIT }}
          persist-credentials: false
      - name: Install the pinned tools release
        run: python3 .github/scripts/install-tools.py
      - run: tools/scripts/workflow/install-lean-toolchain.sh lean-toolchain --github-path "$GITHUB_PATH"
      - name: Confirm that the previous test snapshot was retired
        if: env.RETIRE_VOLUME_TAG != ''
        run: |
          for resource in "releases/tags" "git/ref/tags"; do
            if gh api "repos/$GITHUB_REPOSITORY/$resource/$RETIRE_VOLUME_TAG" > "$RUNNER_TEMP/prior-tag.json"; then
              echo "Previous test tag is still present in $resource" >&2
              exit 1
            fi
            jq -e '.status == "404"' "$RUNNER_TEMP/prior-tag.json"
          done
      - name: Restore from Release assets
        run: |
          test ! -e .lake/build
          if [[ "$RESTORE" == scoped ]]; then
            export LEAN_CACHE_TARGETS=D5.S0.Tower.GoldenGapWord
          fi
          env -u GITHUB_ACTIONS -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_CACHE_URL -u ACTIONS_RESULTS_URL \
            make lean-cache-from-github-without-mathlib
          test -s .lake/build/lib/lean/D5/S0/Tower/GoldenGapWord.olean
          if [[ "$RESTORE" == full ]]; then
            PYTHONPATH=tools/lean-inspector python3 - <<'PYTHON'
          from pathlib import Path
          import reuse

          receipt = reuse.read_receipt(reuse.canonical_seed(Path.cwd()))
          if receipt["completed"] != reuse.CHECKED:
              raise SystemExit("Restored publication lacks the current full-report check")
          PYTHON
          else
            test ! -e .lake/build/stratalint/raw-lean-report.json
          fi

