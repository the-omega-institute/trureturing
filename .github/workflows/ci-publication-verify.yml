name: CI publication verification
on: workflow_dispatch
permissions:
  contents: read
jobs:
  sparse-graph:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      LEAN_NUM_THREADS: '1'
      STRATALINT_ACCEPT_COLD_BUILD: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 390dd491446650cde61260cc1730cdc14e5178f0
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: the-omega-institute/trureturing-tools
          ref: ffeff0c1542b7403d97334b3fa1d1a4658d9c6d7
          path: build/candidate
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Install the candidate tools in the pinned project
        run: |
          set -euo pipefail
          python3 .github/scripts/install-tools.py
          python3 build/candidate/package_release.py --output-dir "$RUNNER_TEMP/candidate"
          tar -xzf "$RUNNER_TEMP/candidate/trureturing-tools.tar.gz" -C .
          tools/scripts/workflow/install-lean-toolchain.sh lean-toolchain --github-path "$GITHUB_PATH"
          make -C tools dotnet DOTNET_PROJECT=tools/StrataLint.Lean/StrataLint.Lean.csproj
      - name: Prepare the pinned dependency workspace
        run: bash .github/actions/lean-compile-layer/prepare-dependencies.sh
      - name: Discover and validate the real sparse report graph
        run: |
          set -euo pipefail
          PYTHONPATH=tools/lean-inspector /usr/bin/time -v python3 - <<'PY'
          import tempfile
          from pathlib import Path
          import build_inputs, scoped
          root=Path.cwd()
          modules=build_inputs.publication.selection.Selection(root).modules()
          programs=build_inputs.sparse_programs()
          with tempfile.TemporaryDirectory() as tmp:
              entry=scoped.Entry(root, tmp, tmp)
              entry.provision()
              graph=build_inputs.sparse_graph(entry, modules, programs)
          assert len(modules)>20000
          assert set(modules) <= graph.keys()
          assert graph['Inspector']['source_path']=='tools/lean-inspector/Inspector.lean'
          assert 'LeanInformationAudit.RawArtifacts' in graph['Inspector']['imports']
          print(f'registered_modules={len(modules)} dependencies={len(graph)} program_roots={programs}')
          PY
