name: CI publication verification
on: workflow_dispatch
permissions: {}
jobs:
  parallel-compile:
    if: ${{ false }}
    runs-on: ubuntu-24.04-arm
    steps:
      - run: exit 1
  cache:
    needs: parallel-compile
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04-arm
    outputs:
      indexed-tag: ${{ steps.publish.outputs.indexed_tag }}
    steps:
      - id: publish
        run: echo 'indexed_tag=verification-fixture' >> "$GITHUB_OUTPUT"
  original:
    needs: cache
    if: needs.cache.outputs.indexed-tag != ''
    runs-on: ubuntu-24.04-arm
    steps:
      - run: echo 'original condition ran'
  corrected:
    needs: cache
    if: ${{ !cancelled() && needs.cache.result == 'success' && needs.cache.outputs.indexed-tag != '' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - run: echo 'corrected condition ran'
  verify:
    needs: [parallel-compile, cache, original, corrected]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04-arm
    steps:
      - env:
          PARALLEL: ${{ needs.parallel-compile.result }}
          PUBLISH: ${{ needs.cache.result }}
          ORIGINAL: ${{ needs.original.result }}
          CORRECTED: ${{ needs.corrected.result }}
        run: |
          printf 'parallel=%s publish=%s original=%s corrected=%s\n' "$PARALLEL" "$PUBLISH" "$ORIGINAL" "$CORRECTED"
          [[ "$PARALLEL,$PUBLISH,$ORIGINAL,$CORRECTED" == "skipped,success,skipped,success" ]]
