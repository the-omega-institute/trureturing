name: CI tests-architecture

on:
  pull_request:
    branches: [dev, 'integration-**']
    types: [opened, synchronize, reopened]
  push:
    branches: [dev, 'integration-**']

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-tests-architecture-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests-architecture:
    uses: ./.github/workflows/ci-unit.yml
    with:
      run: make -C tools test TEST_PROJECT=tools/tests/StrataLint.ArchitectureTests/StrataLint.ArchitectureTests.csproj
