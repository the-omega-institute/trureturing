name: CI tests-repository-contract

on:
  pull_request:
    branches: [dev, 'integration-**']
    types: [opened, synchronize, reopened]
  push:
    branches: [dev, 'integration-**']

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-tests-repository-contract-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests-repository-contract:
    uses: ./.github/workflows/ci-unit.yml
    with:
      command: make -C tools test TEST_PROJECT=tools/tests/StrataLint.RepositoryContract.Tests/StrataLint.RepositoryContract.Tests.csproj
      paths: |
        .editorconfig
        .github/*
        .gitignore
        Directory.Build.props
        Directory.Packages.props
        Golden/gate-authority-roots.toml
        Makefile
        Meta/Digestion/atomizers.toml
        Meta/FILEMAP.*.toml
        Meta/FILEMAP.toml
        Meta/ReportProducers/*
        Meta/ci-checks.json
        Meta/engineering-projects.json
        Reg/lake-manifest.json
        Reg/lakefile.toml
        docs/CONTRIBUTING.md
