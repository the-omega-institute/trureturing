name: agent-test-observer-kernel-formalizations

on:
  push:
    branches:
      - agent/test/observer-kernel-formalizations-20260829

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/test/observer-kernel-formalizations-20260829
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install pinned Lean toolchain
        run: tools/scripts/workflow/install-lean-toolchain.sh lean-toolchain --github-path "$GITHUB_PATH"
      - name: Restore Lean dependencies
        run: lake update
      - name: Build Scribe and repository CLI
        run: make -C tools dotnet
      - name: Lean 01 InjectiveConstantReadoutSubsingleton
        run: lake build D5.S3.ConceptDynamics.Faithfulness.InjectiveConstantReadoutSubsingleton
      - name: Lean 02 InjectiveSensorFamilyFaithfulness
        run: lake build D5.S3.ConceptDynamics.Faithfulness.InjectiveSensorFamilyFaithfulness
      - name: Lean 03 PairSensorStrictRefinement
        run: lake build D5.S3.ConceptDynamics.Faithfulness.PairSensorStrictRefinement
      - name: Lean 04 PostprocessingKernelMonotonicity
        run: lake build D5.S3.ConceptDynamics.ObservationOrder.PostprocessingKernelMonotonicity
      - name: Lean 05 RecoverablePostprocessingKernelEquality
        run: lake build D5.S3.ConceptDynamics.ObservationOrder.RecoverablePostprocessingKernelEquality
      - name: Lean 06 ConstantPostprocessingStrictLoss
        run: lake build D5.S3.ConceptDynamics.ObservationOrder.ConstantPostprocessingStrictLoss
      - name: Lean 07 PairReadoutKernelIntersection
        run: lake build D5.S3.ConceptDynamics.ObservationOrder.PairReadoutKernelIntersection
      - name: Lean 08 SensorFamilyKernelIntersection
        run: lake build D5.S3.ConceptDynamics.ObservationOrder.SensorFamilyKernelIntersection
      - name: Lean 09 SensorFamilyRestrictionMonotonicity
        run: lake build D5.S3.ConceptDynamics.ObservationOrder.SensorFamilyRestrictionMonotonicity
      - name: Lean 10 CongruenceKernelSensorFusion
        run: lake build D5.S3.Observer.Refinement.CongruenceKernelSensorFusion
      - name: Lean 11 AgencyCompletionMinimality
        run: lake build D5.S3.Observer.Agency.Self.AgencyCompletionMinimality
      - name: Lean 12 AgencyResidualDecomposition
        run: lake build D5.S3.Observer.Agency.Self.AgencyResidualDecomposition
      - name: Lean 13 AgencyResidualWitness
        run: lake build D5.S3.Observer.Agency.Self.AgencyResidualWitness
      - name: Lean 14 StrategySelfKnowledgeFactorization
        run: lake build D5.S3.Observer.Agency.Self.StrategySelfKnowledgeFactorization
      - name: Lean 15 MemoryTransport
        run: lake build D5.S3.Observer.Agency.Holonomy.MemoryTransport
      - name: Lean 16 ActionLoopRequiresMemory
        run: lake build D5.S3.Observer.Agency.Holonomy.ActionLoopRequiresMemory
      - name: Lean 17 HolonomyPolicyRigidity
        run: lake build D5.S3.Observer.Agency.Holonomy.HolonomyPolicyRigidity
      - name: Lean 18 HolonomyCompositionInvariance
        run: lake build D5.S3.Observer.Agency.Holonomy.HolonomyCompositionInvariance
      - name: Lean 19 SurjectiveSensorReindexKernelEquality
        run: lake build D5.S3.ConceptDynamics.ObservationOrder.SurjectiveSensorReindexKernelEquality
      - name: Lean 20 SensorFamilyExtensionStrictRefinement
        run: lake build D5.S3.ConceptDynamics.ObservationOrder.SensorFamilyExtensionStrictRefinement
      - name: Lean 21 InjectivePostprocessingKernelEquality
        run: lake build D5.S3.ConceptDynamics.ObservationOrder.InjectivePostprocessingKernelEquality
      - name: Lean 22 PostprocessingStrictLossWitness
        run: lake build D5.S3.ConceptDynamics.ObservationOrder.PostprocessingStrictLossWitness
      - name: Lean 23 CompletionPointIntersection
        run: lake build D5.S3.Observer.Completion.CompletionPointIntersection
      - name: Lean 24 CompletionPointPullback
        run: lake build D5.S3.Observer.Completion.CompletionPointPullback
      - name: Lean 25 GaugeStableZeroDefect
        run: lake build D5.S3.Observer.Completion.GaugeStableZeroDefect
      - name: Validate source formatting
        run: git diff --check
