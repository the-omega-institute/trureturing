name: CI tests-ci-entry

on:
  pull_request:
    branches: [dev, 'integration-**']
    types: [opened, synchronize, reopened]
  push:
    branches: [dev, 'integration-**']

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-tests-ci-entry-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests-ci-entry:
    uses: ./.github/workflows/ci-unit.yml
    with:
      unit: tests-ci-entry
      command: bash tools/scripts/workflow/ci-entry-test.sh && python3 -m unittest tools/scripts/workflow/test_ci_units.py
