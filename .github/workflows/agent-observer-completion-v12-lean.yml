name: agent-observer-completion-v12-lean

on:
  push:
    branches:
      - agent/theory/observer-completion-reflection-v12-20260829

permissions:
  contents: read

jobs:
  validate:
    if: contains(github.event.head_commit.message, '[observer-v12-lean]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/theory/observer-completion-reflection-v12-20260829
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install pinned Lean toolchain
        run: tools/scripts/workflow/install-lean-toolchain.sh lean-toolchain --github-path "$GITHUB_PATH"
      - name: Restore Lean dependencies and cache
        run: lake update
      - name: Build observer completion v1.2.1 modules
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          : > diagnostics/summary.tsv
          failed=0
          modules=(
            D5.S3.ObserverMemory.Refinement.PostprocessingKernelCalculus
            D5.S3.ObserverMemory.Refinement.JointReadoutSupremum
            D5.S3.Observer.Agency.Self.AgencyEnrichment
            D5.S3.Observer.Agency.Holonomy.VisibleLoopHolonomy
            D5.S3.Observer.Completion.CompletionLocusCalculus
            D5.S3.ObserverMemory.RefinementClosure.FiniteHorizonKernelRecurrence
            D5.S3.ObserverMemory.RefinementClosure.CommutingClosureCommonFixedPoint
          )
          for module in "${modules[@]}"; do
            safe="${module//./_}"
            log="diagnostics/${safe}.log"
            echo "===== $module ====="
            lake build "$module" > "$log" 2>&1
            status=$?
            cat "$log"
            printf '%s\t%s\n' "$module" "$status" >> diagnostics/summary.tsv
            if [ "$status" -ne 0 ]; then
              failed=1
            fi
          done
          printf '%s\n' "$failed" > diagnostics/failed
          exit 0
      - name: Upload Lean diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observer-v12-lean-diagnostics
          path: diagnostics
          if-no-files-found: error
          retention-days: 3
      - name: Enforce successful module builds
        shell: bash
        run: |
          cat diagnostics/summary.tsv
          test "$(cat diagnostics/failed)" = "0"
