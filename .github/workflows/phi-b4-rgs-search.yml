name: phi-b4-rgs-search

on:
  push:
    branches:
      - agent/research/phi-b4-rgs-symmetry-20260903
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rgs:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - { states: 14, type0: 6 }
          - { states: 14, type0: 7 }
          - { states: 14, type0: 8 }
          - { states: 14, type0: 9 }
          - { states: 14, type0: 10 }
          - { states: 14, type0: 11 }
          - { states: 15, type0: 6 }
          - { states: 15, type0: 7 }
          - { states: 15, type0: 8 }
          - { states: 15, type0: 9 }
          - { states: 15, type0: 10 }
          - { states: 15, type0: 11 }
          - { states: 15, type0: 12 }
          - { states: 22, type0: 8 }
          - { states: 22, type0: 9 }
          - { states: 22, type0: 10 }
          - { states: 22, type0: 11 }
          - { states: 22, type0: 12 }
          - { states: 22, type0: 13 }
          - { states: 22, type0: 14 }
    steps:
      - uses: actions/checkout@v4
      - name: Install CaDiCaL
        run: |
          sudo apt-get update
          if ! sudo apt-get install -y cadical; then
            git clone --depth 1 --branch rel-2.1.3 \
              https://github.com/arminbiere/cadical.git /tmp/cadical
            cd /tmp/cadical
            ./configure
            make -j2
            sudo install -m 0755 build/cadical /usr/local/bin/cadical
          fi
      - name: Run RGS-normalized exact search
        run: |
          mkdir -p result
          rounds=8
          timeout=900
          if [ "${{ matrix.states }}" = "22" ]; then
            rounds=2
            timeout=300
          fi
          python3 research/phi_b4_bounds_rgs.py \
            --states ${{ matrix.states }} \
            --type0-states ${{ matrix.type0 }} \
            --seed 79 \
            --validation 200 \
            --batch 8 \
            --max-rounds "$rounds" \
            --timeout "$timeout" \
            --output result/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phi-b4-rgs-k${{ matrix.states }}-t0-${{ matrix.type0 }}
          path: result
