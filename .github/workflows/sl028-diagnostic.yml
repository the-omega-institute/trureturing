name: sl028-diagnostic

on:
  push:
    branches:
      - harness/sl028-definition-reuse-advisory

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore tools/StrataLint.sln --locked-mode
      - name: Run focused SL-028 and delivery tests
        shell: bash
        run: |
          set +e
          dotnet test tools/StrataLint.sln \
            --configuration Release \
            --no-restore \
            --logger "console;verbosity=detailed" \
            --filter "FullyQualifiedName~DuplicateDefinitionAdvisoryTests|FullyQualifiedName~DuplicateStatementAdvisoryTests|FullyQualifiedName~ActiveRuleScopeProbeTests|FullyQualifiedName~ProtectedSurfaceObservationTests" \
            > sl028-focused-tests.log 2>&1
          status=$?
          set -e
          cat sl028-focused-tests.log
          printf '%s\n' "$status" > sl028-focused-tests.exit
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sl028-focused-test-diagnostics
          path: |
            sl028-focused-tests.log
            sl028-focused-tests.exit
          if-no-files-found: error
          retention-days: 1
