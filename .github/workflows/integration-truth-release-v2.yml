name: integration-truth-release-v2

# Pre-merge integration proof for the Trureturing.Truth package boundary. Packs the package to a
# runner-local NuGet feed, then a standalone consumer restores it, verifies no floating deps via a
# CI-generated lock (--locked-mode against the lock produced in this same job), and exercises the real
# public API: TruthReleaseBundleWriter -> TruthReleaseVerification.Verify -> ReadTruthGraph/ReadTruthExport.
# The lock is generated in CI, not committed: a locally-built package's content hash is not byte-identical
# to a Linux CI build (the assembly bytes differ by platform/SDK), so a committed lock can never match.
# This proves cross-project package consumption; it never merges into dev.

on:
  push:
    branches:
      - integration-truth-release-v2
      - 'integration-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack-and-consume:
    name: pack and consume Trureturing.Truth through NuGet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack Trureturing.Truth to runner-local feed
        run: >
          dotnet pack tools/Trureturing.Truth/Trureturing.Truth.csproj
          -c Release
          -p:Version=0.1.0-integration.v2
          -o "$RUNNER_TEMP/feed"

      - name: Point standalone consumer at the runner-local feed
        working-directory: integration/Consumer
        run: |
          cat > nuget.config <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="runner-local-truth-feed" value="$RUNNER_TEMP/feed" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF

      - name: Restore consumer and generate the lock in CI
        working-directory: integration/Consumer
        run: dotnet restore --packages "$RUNNER_TEMP/packages"

      - name: Prove no floating deps against the CI-generated lock
        working-directory: integration/Consumer
        run: dotnet restore --locked-mode --packages "$RUNNER_TEMP/packages"

      - name: Assert the lock records the shared package
        working-directory: integration/Consumer
        run: grep -Fq '"Trureturing.Truth"' packages.lock.json

      - name: Run the end-to-end package consumer
        working-directory: integration/Consumer
        run: dotnet run -c Release --no-restore
