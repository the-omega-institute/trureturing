name: append-rh-theory-4441

on:
  push:
    branches:
      - tmp/export-rh-theory-4441

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout append payload
        uses: actions/checkout@v4
        with:
          ref: tmp/export-rh-theory-4441
          path: exporter

      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: lane/math/golden-second-magnus-sampling
          path: target
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Append to the existing RH theory volume
        working-directory: target
        run: |
          set -euo pipefail
          theory='docs/develop/theory/RH_RESEARCH_LANE_THEORY.md'
          marker='## [PR #4441] GOLDEN_SECOND_MAGNUS_SAMPLING'

          if grep -Fq "$marker" "$theory"; then
            echo 'Theory section already present.'
            exit 0
          fi

          cp "$theory" /tmp/rh-theory-before.md
          base64 --decode ../exporter/tmp/rh-theory-append-4441.b64 >> "$theory"

          python - <<'PY'
          from pathlib import Path
          before = Path('/tmp/rh-theory-before.md').read_bytes()
          after = Path('docs/develop/theory/RH_RESEARCH_LANE_THEORY.md').read_bytes()
          marker = b'## [PR #4441] GOLDEN_SECOND_MAGNUS_SAMPLING'
          if not after.startswith(before):
              raise SystemExit('theory update is not append-only')
          if after.count(marker) != 1:
              raise SystemExit('theory section marker is missing or duplicated')
          if len(after) <= len(before):
              raise SystemExit('theory append is empty')
          PY

          test "$(git diff --name-only)" = "$theory"
          git config user.name 'AlyciaBHZ'
          git config user.email '50111876+AlyciaBHZ@users.noreply.github.com'
          git add "$theory"
          git commit -m 'docs: append golden second-Magnus shell theory'
          git push origin HEAD:refs/heads/lane/math/golden-second-magnus-sampling
