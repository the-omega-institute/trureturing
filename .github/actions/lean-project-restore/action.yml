name: Restore a source-matched Lean project or PR preparation
description: Check the restored report before giving it precedence over the PR preparation
inputs:
  project-key:
    description: Preferred native seed to probe
    required: false
  alternate-key:
    description: Another eligible native seed for this checkout
    required: false
  project-paths:
    description: Registered project archive paths
    required: true
  allow-preparation:
    description: Whether this consumer can adopt its PR preparation
    default: 'true'
outputs:
  adopted:
    description: Whether the PR preparation was installed
    value: ${{ steps.artifact.outputs.adopted }}
  matched:
    description: Whether the checked-out report inputs and bundle matched
    value: ${{ steps.primary.outputs.matched == 'true' || steps.alternate.outputs.matched == 'true' }}
  project-key:
    description: Key of the retained native material
    value: ${{ steps.artifact.outputs.adopted != 'true' && (steps.primary.outputs.key || steps.alternate.outputs.key) || '' }}
runs:
  using: composite
  steps:
    - id: primary
      if: inputs.project-key != ''
      uses: ./.github/actions/lean-native-probe
      with:
        key: ${{ inputs.project-key }}
        paths: ${{ inputs.project-paths }}
    - id: alternate
      if: inputs.alternate-key != '' && steps.primary.outputs.key == ''
      uses: ./.github/actions/lean-native-probe
      with:
        key: ${{ inputs.alternate-key }}
        paths: ${{ inputs.project-paths }}
    - id: artifact
      if: inputs.allow-preparation == 'true' && steps.primary.outputs.matched != 'true' && steps.alternate.outputs.matched != 'true'
      shell: bash
      run: python3 tools/scripts/worktree/lean_pr_cache.py adopt --repository "$GITHUB_WORKSPACE"
