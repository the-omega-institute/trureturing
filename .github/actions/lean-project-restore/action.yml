name: Restore a source-matched Lean project or PR preparation
description: Check the restored report before giving it precedence over the PR preparation
inputs:
  project-key:
    description: Project cache key bound to the checked-out source
    required: false
  alternate-key:
    description: Second compatible source when the preferred transfer misses
    required: false
  project-paths:
    description: Registered project archive paths
    required: true
  allow-preparation:
    description: Whether this consumer can adopt its PR preparation
    default: 'true'
outputs:
  adopted:
    description: Whether the PR preparation was installed
    value: ${{ steps.artifact.outputs.adopted }}
  matched:
    description: Whether the checked-out report inputs and bundle matched
    value: ${{ steps.probe.outputs.matched }}
  project-key:
    description: Successfully transferred project key
    value: ${{ steps.artifact.outputs.adopted != 'true' && steps.transferred.outputs.key || '' }}
runs:
  using: composite
  steps:
    - id: exact
      if: inputs.project-key != ''
      continue-on-error: true
      uses: actions/cache/restore@v5
      with:
        path: ${{ inputs.project-paths }}
        key: ${{ inputs.project-key }}
    - name: Discard an incomplete project transfer
      if: inputs.project-key != '' && (steps.exact.outcome != 'success' || steps.exact.outputs.cache-hit != 'true')
      shell: bash
      run: python3 tools/scripts/worktree/lean_actions.py restore --repository "$GITHUB_WORKSPACE" --layers project --project-outcome failure
    - id: alternate
      if: inputs.alternate-key != '' && (steps.exact.outcome != 'success' || steps.exact.outputs.cache-hit != 'true')
      continue-on-error: true
      uses: actions/cache/restore@v5
      with:
        path: ${{ inputs.project-paths }}
        key: ${{ inputs.alternate-key }}
    - name: Discard an incomplete alternate transfer
      if: steps.alternate.outcome != 'skipped' && (steps.alternate.outcome != 'success' || steps.alternate.outputs.cache-hit != 'true')
      shell: bash
      run: python3 tools/scripts/worktree/lean_actions.py restore --repository "$GITHUB_WORKSPACE" --layers project --project-outcome failure
    - id: transferred
      shell: bash
      env:
        KEY: ${{ steps.exact.outcome == 'success' && steps.exact.outputs.cache-hit == 'true' && steps.exact.outputs.cache-matched-key || steps.alternate.outcome == 'success' && steps.alternate.outputs.cache-hit == 'true' && steps.alternate.outputs.cache-matched-key || '' }}
      run: echo "key=$KEY" >> "$GITHUB_OUTPUT"
    - id: probe
      if: steps.transferred.outputs.key != ''
      continue-on-error: true
      shell: bash
      run: |
        decision="$(python3 tools/lean-inspector/reuse.py probe --repository "$GITHUB_WORKSPACE" --report .lake/build/stratalint/raw-lean-report.json)"
        echo "LEAN_SOURCE_SEED $decision"
        jq -er 'if .needs_lake == false then "matched=true" else "matched=false" end' <<< "$decision" >> "$GITHUB_OUTPUT"
    - id: artifact
      if: inputs.allow-preparation == 'true' && steps.probe.outputs.matched != 'true'
      shell: bash
      run: python3 tools/scripts/worktree/lean_pr_cache.py adopt --repository "$GITHUB_WORKSPACE"
