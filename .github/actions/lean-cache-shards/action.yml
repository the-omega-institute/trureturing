name: Transport Lean cache shards
description: Restore or publish immutable project shard entries and a bound index
inputs:
  operation:
    description: Look up, restore or save project shards, save a producer continuation, or pack or adopt a PR preparation
    required: true
  state:
    description: Complete snapshot or producer continuation
    default: complete
  resume-after-attempt:
    description: Restore a continuation from this run after the given attempt and before the current attempt
    default: ''
  anchor:
    description: Pinned dev commit used to derive a layout and enable sharded PR preparation
  require-complete:
    description: Skip installation when any requested project shard is missing
    default: 'false'
  require-existing-index:
    description: Use the prior index layout for a short push publication
    default: 'false'
  sharded-adoption:
    description: Search for sharded PR preparation artifacts in addition to native preparations
    default: 'false'
  require-pr-opt-in:
    description: Search for PR preparation artifacts only if the open PR currently has the preparation label
    default: 'false'
  targets:
    description: Space-delimited project Lean modules whose imports are needed
  targets-file:
    description: File of whitespace-delimited Lean modules for a scoped restore
outputs:
  complete:
    description: All requested project shards present for the selected operation
  key:
    description: Immutable Actions snapshot index key
  visible:
    description: Distinct material keys physically listed on the index owner ref during lookup
  available:
    description: Number of verified project cache entries installed or published
  legacy_fallback:
    description: A failed producer continuation can attempt a native cache archive
  missing:
    description: Number of requested project cache entries unavailable
  artifact_name:
    description: Name of the packed PR preparation artifact
  artifact_path:
    description: Directory containing the packed PR preparation artifact
  adopted:
    description: Whether a matching PR preparation was installed
  sharded:
    description: Whether the adopted preparation was assembled from project shards
runs:
  using: node24
  main: run.mjs
