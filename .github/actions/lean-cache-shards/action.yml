name: Transport Lean cache shards
description: Publish and restore Lean module cache shards
inputs:
  operation:
    description: Plan, build, or finish a module cache publication, or restore published modules
    required: true
  targets:
    description: Space-delimited project Lean modules whose imports are needed
  targets-file:
    description: File of whitespace-delimited Lean modules for a scoped restore
outputs:
  matrix:
    description: Matrix of compiler lanes containing changed module shards
  has_work:
    description: Whether any module shards require building
  complete:
    description: All modules in a nonempty restore scope were installed
  available:
    description: Number of modules installed from the published cache
runs:
  using: node24
  main: run.mjs
